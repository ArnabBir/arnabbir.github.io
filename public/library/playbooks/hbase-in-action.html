ll=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"320.5\\\" y=\\\"113.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">b10<\/text><rect x=\\\"392\\\" y=\\\"75\\\" width=\\\"105\\\" height=\\\"65\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"444.5\\\" y=\\\"113.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">b20<\/text><rect x=\\\"516\\\" y=\\\"75\\\" width=\\\"105\\\" height=\\\"65\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"568.5\\\" y=\\\"113.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">c10<\/text><polyline points=\\\"175,20 175,70\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m171.08531019299892 61.89597607882591 l175 70 l178.91468980700108 61.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><text x=\\\"175\\\" y=\\\"16\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"14\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">start: included<\/text><polyline points=\\\"568,190 568,145\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m571.9146898070011 153.1040239211741 l568 145 l564.0853101929989 153.1040239211741\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><text x=\\\"530\\\" y=\\\"214\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"14\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">stop: excluded<\/text><text x=\\\"320\\\" y=\\\"176\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"21\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">a20 &lt;= key &lt; c10<\/text><\/svg>\"}", "pdf_page": 61}, {"module": "2", "section": {"name": "Table scans", "start": 42, "end": 47}, "title": "Design the twits table for its question", "body": "The application needs recent twits for a particular user. Putting the user first in the compound rowkey groups that user's twits. Putting time next orders that group. The book uses a fixed-width user hash and a negated timestamp so recent positive timestamps sort first in the example's encoding. The schema is organized around the read it must support.", "takeaway": "The rowkey is the first query plan you design.", "kind": "lesson", "id": "c0056", "index": 55, "pdf_source_start": 69, "pdf_source_end": 74, "words": 67, "search": "design the twits table for its question the application needs recent twits for a particular user. putting the user first in the compound rowkey groups that user's twits. putting time next orders that group. the book uses a fixed-width user hash and a negated timestamp so recent positive timestamps sort first in the example's encoding. the schema is organized around the read it must support. the rowkey is the first query plan you design. table scans {}", "pdf_page": 62}, {"module": "2", "section": {"name": "Table scans", "start": 42, "end": 47}, "title": "A compound key needs unambiguous fields", "body": "Variable-length usernames make field boundaries awkward. The book hashes the user into a fixed-width MD5 value and follows it with an eight-byte long. It also stores the original username as a column because the hash is not reversible. The result is a 24-byte key in this example. This use of MD5 is a layout example, not password-storage advice.", "takeaway": "Fixed-width fields simplify decoding but do not preserve the original text by themselves.", "kind": "lesson", "visual": {"type": "twitkey", "caption": "TwitBase example: fixed 16-byte user hash followed by an 8-byte negated timestamp; printed p.44.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"40\" width=\"356\" height=\"85\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"198.0\" y=\"77.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">MD5(user)<\/text><text x=\"198.0\" y=\"99.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">16 bytes<\/text><rect x=\"386\" y=\"40\" width=\"234\" height=\"85\" rx=\"10\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><text x=\"503.0\" y=\"77.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Negated time<\/text><text x=\"503.0\" y=\"99.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">8 bytes<\/text><text x=\"198\" y=\"164\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"18\" font-weight=\"normal\" fill=\"#173344\">Group one user<\/text><text x=\"503\" y=\"164\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"18\" font-weight=\"normal\" fill=\"#173344\">Recent first<\/text><text x=\"320\" y=\"211\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"19\" font-weight=\"bold\" fill=\"#173344\">Fixed-width example: 24-byte rowkey<\/text><\/svg>"}, "id": "c0057", "index": 56, "pdf_source_start": 69, "pdf_source_end": 74, "words": 71, "search": "a compound key needs unambiguous fields variable-length usernames make field boundaries awkward. the book hashes the user into a fixed-width md5 value and follows it with an eight-byte long. it also stores the original username as a column because the hash is not reversible. the result is a 24-byte key in this example. this use of md5 is a layout example, not password-storage advice. fixed-width fields simplify decoding but do not preserve the original text by themselves. table scans {\"type\": \"twitkey\", \"caption\": \"twitbase example: fixed 16-byte user hash followed by an 8-byte negated timestamp; printed p.44.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"40\\\" width=\\\"356\\\" height=\\\"85\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"198.0\\\" y=\\\"77.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">md5(user)<\/text><text x=\\\"198.0\\\" y=\\\"99.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">16 bytes<\/text><rect x=\\\"386\\\" y=\\\"40\\\" width=\\\"234\\\" height=\\\"85\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"503.0\\\" y=\\\"77.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">negated time<\/text><text x=\\\"503.0\\\" y=\\\"99.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">8 bytes<\/text><text x=\\\"198\\\" y=\\\"164\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"18\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">group one user<\/text><text x=\\\"503\\\" y=\\\"164\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"18\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">recent first<\/text><text x=\\\"320\\\" y=\\\"211\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"19\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">fixed-width example: 24-byte rowkey<\/text><\/svg>\"}", "pdf_page": 63}, {"module": "2", "section": {"name": "Table scans", "start": 45, "end": 46}, "title": "Iterate results and decode the key", "body": "Get a ResultScanner from the table, then iterate Results. The twit text and username come from cells; the date can be recovered from the timestamp portion of the rowkey and its sign restored. The scan interface hides repeated remote reads, but the caller still needs to understand the encoding used to build the key.", "takeaway": "Scanning returns bytes in an order; the application interprets their meaning.", "kind": "lesson", "id": "c0058", "index": 57, "pdf_source_start": 72, "pdf_source_end": 73, "words": 65, "search": "iterate results and decode the key get a resultscanner from the table, then iterate results. the twit text and username come from cells; the date can be recovered from the timestamp portion of the rowkey and its sign restored. the scan interface hides repeated remote reads, but the caller still needs to understand the encoding used to build the key. scanning returns bytes in an order; the application interprets their meaning. table scans {\"type\": \"code\", \"text\": \"resultscanner scanner = twits.getscanner(scan);\\ntry {\\n    for (result row : scanner) {\\n        // decode values and the key using the schema.\\n    }\\n} finally {\\n    scanner.close();\\n}\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "ResultScanner scanner = twits.getScanner(scan);\ntry {\n    for (Result row : scanner) {\n        // Decode values and the key using the schema.\n    }\n} finally {\n    scanner.close();\n}", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 64}, {"module": "2", "section": {"name": "Table scans", "start": 42, "end": 47}, "title": "Scanner caching is a transport batch", "body": "setCaching(n) controls how many rows the scanner requests per RPC in the book. It is not the same as keeping HFile blocks in BlockCache. Larger batches can reduce network round trips but increase client memory and the time spent before the next request. The book warns that excessively long pauses can lead to timeouts.", "takeaway": "Rows per RPC and server block caching are different knobs.", "kind": "lesson", "id": "c0059", "index": 58, "pdf_source_start": 69, "pdf_source_end": 74, "words": 64, "search": "scanner caching is a transport batch setcaching(n) controls how many rows the scanner requests per rpc in the book. it is not the same as keeping hfile blocks in blockcache. larger batches can reduce network round trips but increase client memory and the time spent before the next request. the book warns that excessively long pauses can lead to timeouts. rows per rpc and server block caching are different knobs. table scans {}", "pdf_page": 65}, {"module": "2", "section": {"name": "Table scans", "start": 42, "end": 47}, "title": "next(n) is not the RPC batch knob", "body": "ResultScanner.next(n) asks the API for n results. Internally, it may need several remote requests to supply them. The caching setting determines rows fetched per RPC, not this convenience method's argument. Therefore a next(100) loop does not prove that only one request crossed the network.", "takeaway": "Do not infer network calls merely by counting Java method calls.", "kind": "lesson", "visual": {"type": "table", "headers": ["Control", "What it means"], "rows": [["Scan.setCaching(n)", "Rows fetched per RPC in the book"], ["ResultScanner.next(n)", "Number of results requested from the iterator API"], ["Scan.setCacheBlocks(false)", "Avoid loading scanned blocks into server BlockCache"]], "caption": "The first two are distinguished on printed pp.45-46; the third is developed in chapter 10, p.280."}, "id": "c0060", "index": 59, "pdf_source_start": 69, "pdf_source_end": 74, "words": 55, "search": "next(n) is not the rpc batch knob resultscanner.next(n) asks the api for n results. internally, it may need several remote requests to supply them. the caching setting determines rows fetched per rpc, not this convenience method's argument. therefore a next(100) loop does not prove that only one request crossed the network. do not infer network calls merely by counting java method calls. table scans {\"type\": \"table\", \"headers\": [\"control\", \"what it means\"], \"rows\": [[\"scan.setcaching(n)\", \"rows fetched per rpc in the book\"], [\"resultscanner.next(n)\", \"number of results requested from the iterator api\"], [\"scan.setcacheblocks(false)\", \"avoid loading scanned blocks into server blockcache\"]], \"caption\": \"the first two are distinguished on printed pp.45-46; the third is developed in chapter 10, p.280.\"}", "pdf_page": 66}, {"module": "2", "section": {"name": "Table scans", "start": 42, "end": 47}, "title": "Filters run before results cross the wire", "body": "A Filter is a server-side predicate attached to a Scan. The example combines ValueFilter with RegexStringComparator to retain matching twit content. That can save network traffic and client work, but it does not manufacture an index on the value. The server may still need to inspect many candidates inside the requested range.", "takeaway": "Filtering reduces returned data; key design reduces the search work itself.", "kind": "lesson", "id": "c0061", "index": 60, "pdf_source_start": 69, "pdf_source_end": 74, "words": 63, "search": "filters run before results cross the wire a filter is a server-side predicate attached to a scan. the example combines valuefilter with regexstringcomparator to retain matching twit content. that can save network traffic and client work, but it does not manufacture an index on the value. the server may still need to inspect many candidates inside the requested range. filtering reduces returned data; key design reduces the search work itself. table scans {}", "pdf_page": 67}, {"module": "2", "section": {"name": "Atomic operations and ACID semantics", "start": 47, "end": 47}, "title": "Increment avoids a client-side race", "body": "incrementColumnValue changes an integral cell value in HBase and returns the result. Two clients do not independently read the same old counter and overwrite one another's increase. The source compares the operation to AtomicLong.addAndGet. Its example stores tweet_count in users, away from the twits table's scan-oriented key layout.", "takeaway": "Make the read-modify-write one server-side atomic operation when using the counter API.", "kind": "lesson", "id": "c0062", "index": 61, "pdf_source_start": 74, "pdf_source_end": 74, "words": 60, "search": "increment avoids a client-side race incrementcolumnvalue changes an integral cell value in hbase and returns the result. two clients do not independently read the same old counter and overwrite one another's increase. the source compares the operation to atomiclong.addandget. its example stores tweet_count in users, away from the twits table's scan-oriented key layout. make the read-modify-write one server-side atomic operation when using the counter api. atomic operations and acid semantics {\"type\": \"code\", \"text\": \"long newcount = userstable.incrementcolumnvalue(\\n    bytes.tobytes(\\\"therealmt\\\"),\\n    bytes.tobytes(\\\"info\\\"),\\n    bytes.tobytes(\\\"tweet_count\\\"),\\n    1l);\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "long newCount = usersTable.incrementColumnValue(\n    Bytes.toBytes(\"TheRealMT\"),\n    Bytes.toBytes(\"info\"),\n    Bytes.toBytes(\"tweet_count\"),\n    1L);", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 68}, {"module": "2", "section": {"name": "Atomic operations and ACID semantics", "start": 47, "end": 48}, "title": "A conditional mutation has a success condition", "body": "checkAndPut and checkAndDelete combine a comparison with a mutation. If the expected current value no longer matches, the caller cannot treat the change as successful. The source sketches implementing a counter with checkAndPut, but that listing does not show a retry loop. Keep the atomic comparison distinct from an application's complete retry policy.", "takeaway": "An atomic conditional operation can still report that its condition did not hold.", "kind": "lesson", "id": "c0063", "index": 62, "pdf_source_start": 74, "pdf_source_end": 75, "words": 66, "search": "a conditional mutation has a success condition checkandput and checkanddelete combine a comparison with a mutation. if the expected current value no longer matches, the caller cannot treat the change as successful. the source sketches implementing a counter with checkandput, but that listing does not show a retry loop. keep the atomic comparison distinct from an application's complete retry policy. an atomic conditional operation can still report that its condition did not hold. atomic operations and acid semantics {\"type\": \"code\", \"text\": \"boolean applied = userstable.checkandput(\\n    row, family, qualifier, expectedoldbytes, update);\\nif (!applied) {\\n    // the condition failed.\\n    // a complete retry/conflict policy is not shown.\\n}\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "boolean applied = usersTable.checkAndPut(\n    row, family, qualifier, expectedOldBytes, update);\nif (!applied) {\n    // The condition failed.\n    // A complete retry/conflict policy is not shown.\n}", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 69}, {"module": "2", "section": {"name": "Atomic operations and ACID semantics", "start": 47, "end": 50}, "title": "The row is the atomic boundary", "body": "The book promises that a single row mutation does not expose only some of its intended cells, even when it touches several families. Separate rows do not gain that all-or-nothing guarantee. Separate operations on the same row also remain separate operations. These boundaries affect how you model a user with related fields or a relationship stored in two directions.", "takeaway": "Same row in one operation is not the same as several operations or several rows.", "kind": "lesson", "id": "c0064", "index": 63, "pdf_source_start": 74, "pdf_source_end": 77, "words": 74, "search": "the row is the atomic boundary the book promises that a single row mutation does not expose only some of its intended cells, even when it touches several families. separate rows do not gain that all-or-nothing guarantee. separate operations on the same row also remain separate operations. these boundaries affect how you model a user with related fields or a relationship stored in two directions. same row in one operation is not the same as several operations or several rows. atomic operations and acid semantics {}", "pdf_page": 70}, {"module": "2", "section": {"name": "Atomic operations and ACID semantics", "start": 47, "end": 50}, "title": "A scan is not a table snapshot", "body": "The source explicitly distinguishes a row-consistent read from a consistent snapshot of an entire table. A scan may reach a later row after that row has been updated. Each row can be read coherently while different rows reflect different moments. This matters for reports, copied tables, and later backup discussions.", "takeaway": "Row consistency does not freeze the whole table for a scan.", "kind": "lesson", "visual": {"type": "table", "headers": ["Operation shape", "Book guarantee"], "rows": [["One Put on one row", "Atomic across the selected cells/families"], ["Writes to different rows", "Not a multirow transaction"], ["checkAnd* or increment*", "Atomic operation"], ["Table scan", "Not a table-wide point-in-time snapshot"]], "caption": "Explicit scope from printed p.49."}, "id": "c0065", "index": 64, "pdf_source_start": 74, "pdf_source_end": 77, "words": 61, "search": "a scan is not a table snapshot the source explicitly distinguishes a row-consistent read from a consistent snapshot of an entire table. a scan may reach a later row after that row has been updated. each row can be read coherently while different rows reflect different moments. this matters for reports, copied tables, and later backup discussions. row consistency does not freeze the whole table for a scan. atomic operations and acid semantics {\"type\": \"table\", \"headers\": [\"operation shape\", \"book guarantee\"], \"rows\": [[\"one put on one row\", \"atomic across the selected cells/families\"], [\"writes to different rows\", \"not a multirow transaction\"], [\"checkand* or increment*\", \"atomic operation\"], [\"table scan\", \"not a table-wide point-in-time snapshot\"]], \"caption\": \"explicit scope from printed p.49.\"}", "pdf_page": 71}, {"module": "2", "section": {"name": "Chapter recall", "start": 26, "end": 28}, "title": "Recall: a crash before flush", "body": "The protected Put completed, but its MemStore had not flushed when the server failed. Which component is used for recovery?", "takeaway": "The WAL preserves the recovery record for edits that were acknowledged through the protected write path but have not yet reached an HFile.", "kind": "quiz", "choices": ["The WAL", "The table name alone", "The last Get response"], "answer": 0, "explanation": "The WAL preserves the recovery record for edits that were acknowledged through the protected write path but have not yet reached an HFile.", "id": "c0066", "index": 65, "pdf_source_start": 53, "pdf_source_end": 55, "words": 43, "search": "recall: a crash before flush the protected put completed, but its memstore had not flushed when the server failed. which component is used for recovery? the wal preserves the recovery record for edits that were acknowledged through the protected write path but have not yet reached an hfile. chapter recall {}", "pdf_page": 72, "answer_page": 365}, {"module": "2", "section": {"name": "Chapter recall", "start": 43, "end": 45}, "title": "Recall: the scan edge", "body": "A scan starts at A20 and stops at C10. Which key is excluded by the upper bound?", "takeaway": "The book defines scanner start keys as inclusive and stop keys as exclusive. C10 is the first excluded key in this example.", "kind": "quiz", "choices": ["B20", "C10", "A20"], "answer": 1, "explanation": "The book defines scanner start keys as inclusive and stop keys as exclusive. C10 is the first excluded key in this example.", "id": "c0067", "index": 66, "pdf_source_start": 70, "pdf_source_end": 72, "words": 39, "search": "recall: the scan edge a scan starts at a20 and stops at c10. which key is excluded by the upper bound? the book defines scanner start keys as inclusive and stop keys as exclusive. c10 is the first excluded key in this example. chapter recall {}", "pdf_page": 73, "answer_page": 366}, {"module": "2", "section": {"name": "Chapter recall", "start": 30, "end": 32}, "title": "Recall: a deleted cell", "body": "A deleted value no longer appears in Get, yet its old HFile remains. What explains that?", "takeaway": "The chapter separates logical deletion from immutable-file cleanup. Major compaction is introduced as the place where deletion markers and hidden records are reconciled.", "kind": "quiz", "choices": ["Delete failed because every HFile must vanish immediately", "Get always reads from an unrelated table", "A tombstone changes read visibility before physical cleanup"], "answer": 2, "explanation": "The chapter separates logical deletion from immutable-file cleanup. Major compaction is introduced as the place where deletion markers and hidden records are reconciled.", "id": "c0068", "index": 67, "pdf_source_start": 57, "pdf_source_end": 59, "words": 39, "search": "recall: a deleted cell a deleted value no longer appears in get, yet its old hfile remains. what explains that? the chapter separates logical deletion from immutable-file cleanup. major compaction is introduced as the place where deletion markers and hidden records are reconciled. chapter recall {}", "pdf_page": 74, "answer_page": 367}, {"module": "2", "section": {"name": "Chapter recall", "start": 49, "end": 50}, "title": "Recall: one batch or one snapshot", "body": "A scan returns each row coherently. What additional guarantee must you NOT infer?", "takeaway": "The source explicitly denies table-snapshot semantics for scans. Different rows can reflect updates that happened at different times during traversal.", "kind": "quiz", "choices": ["Every row is read from a table-wide snapshot at the scan start", "Rows have rowkeys", "Results can be limited by bounds"], "answer": 0, "explanation": "The source explicitly denies table-snapshot semantics for scans. Different rows can reflect updates that happened at different times during traversal.", "id": "c0069", "index": 68, "pdf_source_start": 76, "pdf_source_end": 77, "words": 33, "search": "recall: one batch or one snapshot a scan returns each row coherently. what additional guarantee must you not infer? the source explicitly denies table-snapshot semantics for scans. different rows can reflect updates that happened at different times during traversal. chapter recall {}", "pdf_page": 75, "answer_page": 368}, {"module": "2", "section": {"name": "Chapter recall", "start": 47, "end": 49}, "title": "Recall: two counters", "body": "Two clients must add one to a shared count. Which operation directly expresses the book's safe counter update?", "takeaway": "The server-side increment removes the race in a separated client read/add/write sequence. It is an atomic cell update, not a multirow transaction.", "kind": "quiz", "choices": ["Read, add locally, then unconditional Put", "incrementColumnValue", "Change the column-family name"], "answer": 1, "explanation": "The server-side increment removes the race in a separated client read/add/write sequence. It is an atomic cell update, not a multirow transaction.", "id": "c0070", "index": 69, "pdf_source_start": 74, "pdf_source_end": 76, "words": 40, "search": "recall: two counters two clients must add one to a shared count. which operation directly expresses the book's safe counter update? the server-side increment removes the race in a separated client read/add/write sequence. it is an atomic cell update, not a multirow transaction. chapter recall {}", "pdf_page": 76, "answer_page": 369}, {"module": "3", "section": {"name": "Why MapReduce and how it works", "start": 51, "end": 61}, "title": "Latency and throughput are different goals", "body": "One operation's response time is latency. The amount of work completed over an interval is throughput. Chapter 3 introduces MapReduce because processing many records can benefit from parallelism even when one job has substantial startup and coordination overhead. A fast batch total does not automatically make an individual user-facing request fast.", "takeaway": "Batch throughput and interactive latency are separate design targets.", "kind": "lesson", "id": "c0071", "index": 70, "pdf_source_start": 78, "pdf_source_end": 88, "words": 60, "search": "latency and throughput are different goals one operation's response time is latency. the amount of work completed over an interval is throughput. chapter 3 introduces mapreduce because processing many records can benefit from parallelism even when one job has substantial startup and coordination overhead. a fast batch total does not automatically make an individual user-facing request fast. batch throughput and interactive latency are separate design targets. why mapreduce and how it works {}", "pdf_page": 77}, {"module": "3", "section": {"name": "Why MapReduce and how it works", "start": 51, "end": 61}, "title": "From a loop to distributed work", "body": "A serial loop handles one portion after another. Threads can use more local resources, but one machine still has a limit. MapReduce divides work across machines and handles task execution and failure recovery. Your functions describe the per-record and per-group computation; the framework handles a distributed execution plan around them.", "takeaway": "Parallelism is useful when the problem can be divided and its results combined.", "kind": "lesson", "id": "c0072", "index": 71, "pdf_source_start": 78, "pdf_source_end": 88, "words": 63, "search": "from a loop to distributed work a serial loop handles one portion after another. threads can use more local resources, but one machine still has a limit. mapreduce divides work across machines and handles task execution and failure recovery. your functions describe the per-record and per-group computation; the framework handles a distributed execution plan around them. parallelism is useful when the problem can be divided and its results combined. why mapreduce and how it works {}", "pdf_page": 78}, {"module": "3", "section": {"name": "Why MapReduce and how it works", "start": 57, "end": 59}, "title": "Map transforms each input record", "body": "The example processes user activity logs. A mapper extracts a user identifier and time spent, producing a key-value pair. It does not need to know all of a user's other records. This separation lets many mappers process different input splits independently. The mapper's output key determines which later group receives a record.", "takeaway": "Choose the map-output key according to the group you will need next.", "kind": "lesson", "id": "c0073", "index": 72, "pdf_source_start": 84, "pdf_source_end": 86, "words": 64, "search": "map transforms each input record the example processes user activity logs. a mapper extracts a user identifier and time spent, producing a key-value pair. it does not need to know all of a user's other records. this separation lets many mappers process different input splits independently. the mapper's output key determines which later group receives a record. choose the map-output key according to the group you will need next. why mapreduce and how it works {\"type\": \"code\", \"text\": \"map(logrecord):\\n    user = extract_user(logrecord)\\n    duration = extract_time_spent(logrecord)\\n    emit(user, duration)\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "map(logRecord):\n    user = extract_user(logRecord)\n    duration = extract_time_spent(logRecord)\n    emit(user, duration)", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 79}, {"module": "3", "section": {"name": "Why MapReduce and how it works", "start": 51, "end": 61}, "title": "Shuffle brings equal keys together", "body": "After mapping, records with the same user key must reach the same logical reduce group. The shuffle partitions, transfers, and groups that intermediate data. It is real work, often involving network and sorting costs. A reduce-side join or aggregation is therefore not 'free parallel computation'; its data movement is part of the design.", "takeaway": "The shuffle pays for grouping data that started in different places.", "kind": "lesson", "id": "c0074", "index": 73, "pdf_source_start": 78, "pdf_source_end": 88, "words": 64, "search": "shuffle brings equal keys together after mapping, records with the same user key must reach the same logical reduce group. the shuffle partitions, transfers, and groups that intermediate data. it is real work, often involving network and sorting costs. a reduce-side join or aggregation is therefore not 'free parallel computation'; its data movement is part of the design. the shuffle pays for grouping data that started in different places. why mapreduce and how it works {\"type\": \"mapreduce\", \"caption\": \"reconstruction of the time-spent aggregation in chapter 3. grouping is by user, not by the input file.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"15\\\" y=\\\"35\\\" width=\\\"170\\\" height=\\\"110\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"100.0\\\" y=\\\"74.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">ada: 3<\/text><text x=\\\"100.0\\\" y=\\\"96.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">ben: 2<\/text><text x=\\\"100.0\\\" y=\\\"118.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">ada: 7<\/text><rect x=\\\"232\\\" y=\\\"35\\\" width=\\\"178\\\" height=\\\"110\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"321.0\\\" y=\\\"85.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">ada: [3, 7]<\/text><text x=\\\"321.0\\\" y=\\\"107.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">ben: [2]<\/text><rect x=\\\"457\\\" y=\\\"35\\\" width=\\\"170\\\" height=\\\"110\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"542.0\\\" y=\\\"85.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">ada: 10<\/text><text x=\\\"542.0\\\" y=\\\"107.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">ben: 2<\/text><polyline points=\\\"187,90 230,90\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m221.8959760788259 93.91468980700107 l230 90 l221.8959760788259 86.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"412,90 455,90\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m446.8959760788259 93.91468980700107 l455 90 l446.8959760788259 86.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><text x=\\\"100\\\" y=\\\"185\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">map pairs<\/text><text x=\\\"320\\\" y=\\\"185\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">group<\/text><text x=\\\"540\\\" y=\\\"185\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">reduce<\/text><\/svg>\"}", "visual": {"type": "mapreduce", "caption": "Reconstruction of the time-spent aggregation in chapter 3. Grouping is by user, not by the input file.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"15\" y=\"35\" width=\"170\" height=\"110\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"100.0\" y=\"74.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Ada: 3<\/text><text x=\"100.0\" y=\"96.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Ben: 2<\/text><text x=\"100.0\" y=\"118.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Ada: 7<\/text><rect x=\"232\" y=\"35\" width=\"178\" height=\"110\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"321.0\" y=\"85.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Ada: [3, 7]<\/text><text x=\"321.0\" y=\"107.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Ben: [2]<\/text><rect x=\"457\" y=\"35\" width=\"170\" height=\"110\" rx=\"10\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><text x=\"542.0\" y=\"85.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Ada: 10<\/text><text x=\"542.0\" y=\"107.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Ben: 2<\/text><polyline points=\"187,90 230,90\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M221.8959760788259 93.91468980700107 L230 90 L221.8959760788259 86.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><polyline points=\"412,90 455,90\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M446.8959760788259 93.91468980700107 L455 90 L446.8959760788259 86.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><text x=\"100\" y=\"185\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">MAP PAIRS<\/text><text x=\"320\" y=\"185\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">GROUP<\/text><text x=\"540\" y=\"185\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">REDUCE<\/text><\/svg>"}, "pdf_page": 80}, {"module": "3", "section": {"name": "Why MapReduce and how it works", "start": 51, "end": 61}, "title": "Reduce combines one group's values", "body": "For the time-spent example, a reducer sums all durations associated with a user. It sees a key and the collection of values for that key, not necessarily the original log-file layout. The source's worked example produces separate totals for each user. A reducer is valuable when many partial observations need a common final result.", "takeaway": "Map extracts contributions; reduce combines contributions sharing a key.", "kind": "lesson", "lab": "shuffle", "lab_snapshot": "Toy observations: Ada 3, Ben 2, Ada 7, Ben 5. Shuffle groups Ada [3,7] and Ben [2,5]; reduce produces Ada 10 and Ben 7.", "id": "c0075", "index": 74, "pdf_source_start": 78, "pdf_source_end": 88, "words": 63, "search": "reduce combines one group's values for the time-spent example, a reducer sums all durations associated with a user. it sees a key and the collection of values for that key, not necessarily the original log-file layout. the source's worked example produces separate totals for each user. a reducer is valuable when many partial observations need a common final result. map extracts contributions; reduce combines contributions sharing a key. why mapreduce and how it works {}", "pdf_page": 81}, {"module": "3", "section": {"name": "Why MapReduce and how it works", "start": 51, "end": 61}, "title": "Input and output formats bridge the framework", "body": "MapReduce needs a way to divide input, read records, and write output. Format classes provide that bridge. A text-file job and an HBase-table job may share the same map/reduce idea but obtain records differently. This is why HBase integration introduces table-specific input and output classes rather than asking the application to manually scrape every server.", "takeaway": "Computation functions and storage formats solve different parts of a job.", "kind": "lesson", "id": "c0076", "index": 75, "pdf_source_start": 78, "pdf_source_end": 88, "words": 66, "search": "input and output formats bridge the framework mapreduce needs a way to divide input, read records, and write output. format classes provide that bridge. a text-file job and an hbase-table job may share the same map/reduce idea but obtain records differently. this is why hbase integration introduces table-specific input and output classes rather than asking the application to manually scrape every server. computation functions and storage formats solve different parts of a job. why mapreduce and how it works {}", "pdf_page": 82}, {"module": "3", "section": {"name": "Why MapReduce and how it works", "start": 51, "end": 61}, "title": "The scheduler vocabulary is historical", "body": "The book explains Hadoop using JobTracker and TaskTracker. The coordinating process manages jobs; worker processes execute assigned tasks and report progress. These names belong to the book's Hadoop generation. The distributed-programming lesson is task scheduling, retries, and division of work, not a claim that this is the naming in every later Hadoop deployment.", "takeaway": "Read scheduler details within the release the book actually uses.", "kind": "lesson", "id": "c0077", "index": 76, "pdf_source_start": 78, "pdf_source_end": 88, "words": 63, "search": "the scheduler vocabulary is historical the book explains hadoop using jobtracker and tasktracker. the coordinating process manages jobs; worker processes execute assigned tasks and report progress. these names belong to the book's hadoop generation. the distributed-programming lesson is task scheduling, retries, and division of work, not a claim that this is the naming in every later hadoop deployment. read scheduler details within the release the book actually uses. why mapreduce and how it works {}", "pdf_page": 83}, {"module": "3", "section": {"name": "Distributed tables and locating regions", "start": 62, "end": 67}, "title": "A region covers an ordered key interval", "body": "HBase divides a large table into regions. Each region covers a contiguous portion of the rowkey space. It contains the machinery for the families of rows in that interval. This preserves ordered access while making parts of the table independently assignable to servers. A region is neither one row nor an HDFS disk block.", "takeaway": "Table partitioning follows rowkey ranges.", "kind": "lesson", "id": "c0078", "index": 77, "pdf_source_start": 89, "pdf_source_end": 94, "words": 59, "search": "a region covers an ordered key interval hbase divides a large table into regions. each region covers a contiguous portion of the rowkey space. it contains the machinery for the families of rows in that interval. this preserves ordered access while making parts of the table independently assignable to servers. a region is neither one row nor an hdfs disk block. table partitioning follows rowkey ranges. distributed tables and locating regions {}", "pdf_page": 84}, {"module": "3", "section": {"name": "Distributed tables and locating regions", "start": 62, "end": 67}, "title": "RegionServers host regions", "body": "A RegionServer serves reads and writes for the regions assigned to it. One server can host several regions, potentially from several tables. This is why table size, region size, and server count are different measurements. The placement can change without the application changing the table name used in its API calls.", "takeaway": "The table is logical; the RegionServer assignment is a changing placement decision.", "kind": "lesson", "id": "c0079", "index": 78, "pdf_source_start": 89, "pdf_source_end": 94, "words": 63, "search": "regionservers host regions a regionserver serves reads and writes for the regions assigned to it. one server can host several regions, potentially from several tables. this is why table size, region size, and server count are different measurements. the placement can change without the application changing the table name used in its api calls. the table is logical; the regionserver assignment is a changing placement decision. distributed tables and locating regions {}", "pdf_page": 85}, {"module": "3", "section": {"name": "Distributed tables and locating regions", "start": 62, "end": 67}, "title": "Splitting grows the partition set", "body": "When a region grows, splitting creates two daughter regions covering subdivisions of the parent's range. The table remains ordered. A split does not by itself mean new hardware has appeared, and it does not fix a workload whose newest keys always hit the same narrow edge. Later schema lessons explain why distribution still depends on the key.", "takeaway": "Splits create more assignable ranges, not an automatic cure for every hot key.", "kind": "lesson", "visual": {"type": "regions", "caption": "Illustrative table ranges distributed over RegionServers. Range boundaries are not file-block boundaries.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"15\" width=\"600\" height=\"50\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"320.0\" y=\"46.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Logical table: ordered rowkey space<\/text><rect x=\"20\" y=\"99\" width=\"170\" height=\"55\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"105.0\" y=\"132.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">[-inf, G)<\/text><text x=\"105\" y=\"184\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">RegionServer 1<\/text><polyline points=\"105,66 105,96\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M101.08531019299893 87.89597607882591 L105 96 L108.91468980700107 87.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"235\" y=\"99\" width=\"170\" height=\"55\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"320.0\" y=\"132.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">[G, P)<\/text><text x=\"320\" y=\"184\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">RegionServer 2<\/text><polyline points=\"320,66 320,96\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M316.0853101929989 87.89597607882591 L320 96 L323.9146898070011 87.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"450\" y=\"99\" width=\"170\" height=\"55\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"535.0\" y=\"132.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">[P, +inf)<\/text><text x=\"535\" y=\"184\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">RegionServer 1<\/text><polyline points=\"535,66 535,96\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M531.0853101929989 87.89597607882591 L535 96 L538.9146898070011 87.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><\/svg>"}, "id": "c0080", "index": 79, "pdf_source_start": 89, "pdf_source_end": 94, "words": 70, "search": "splitting grows the partition set when a region grows, splitting creates two daughter regions covering subdivisions of the parent's range. the table remains ordered. a split does not by itself mean new hardware has appeared, and it does not fix a workload whose newest keys always hit the same narrow edge. later schema lessons explain why distribution still depends on the key. splits create more assignable ranges, not an automatic cure for every hot key. distributed tables and locating regions {\"type\": \"regions\", \"caption\": \"illustrative table ranges distributed over regionservers. range boundaries are not file-block boundaries.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"15\\\" width=\\\"600\\\" height=\\\"50\\\"
