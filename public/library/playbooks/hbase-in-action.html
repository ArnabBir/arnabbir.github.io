dth=\\\"135\\\" height=\\\"48\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">wait b<\/text><rect x=\\\"20\\\" y=\\\"144\\\" width=\\\"135\\\" height=\\\"48\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"87.5\\\" y=\\\"174.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">issue a<\/text><rect x=\\\"175\\\" y=\\\"144\\\" width=\\\"135\\\" height=\\\"48\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"242.5\\\" y=\\\"174.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">issue b<\/text><rect x=\\\"330\\\" y=\\\"144\\\" width=\\\"135\\\" height=\\\"48\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"174.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">other work<\/text><rect x=\\\"485\\\" y=\\\"144\\\" width=\\\"135\\\" height=\\\"48\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"174.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">group / wait<\/text><\/svg>\"}", "pdf_page": 184}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 162, "end": 177}, "title": "One reusable client has a shutdown boundary", "body": "The asynchbase example creates a reusable HBaseClient and shuts it down at the application's lifecycle boundary. Waiting for shutdown completion drains outstanding work rather than exiting casually with requests still in flight. This is the same resource-management concern encountered with pooled table handles, expressed through a different API.", "takeaway": "Do not let process exit become your accidental completion policy.", "kind": "lesson", "id": "c0179", "index": 178, "pdf_source_start": 189, "pdf_source_end": 204, "words": 58, "search": "one reusable client has a shutdown boundary the asynchbase example creates a reusable hbaseclient and shuts it down at the application's lifecycle boundary. waiting for shutdown completion drains outstanding work rather than exiting casually with requests still in flight. this is the same resource-management concern encountered with pooled table handles, expressed through a different api. do not let process exit become your accidental completion policy. asynchbase and the password-update pipeline {}", "pdf_page": 185}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 162, "end": 177}, "title": "Scanning returns deferred batches", "body": "nextRows produces a Deferred batch of rows rather than a single synchronous stream of Result objects. Each row in that batch contains cell information. The caller must recognize when scanning has ended and keep row decoding separate from the mechanics of requesting another batch. This adds asynchronous control flow without changing the key-order concepts.", "takeaway": "Batch shape and completion shape both matter in an asynchronous scanner.", "kind": "lesson", "id": "c0180", "index": 179, "pdf_source_start": 189, "pdf_source_end": 204, "words": 65, "search": "scanning returns deferred batches nextrows produces a deferred batch of rows rather than a single synchronous stream of result objects. each row in that batch contains cell information. the caller must recognize when scanning has ended and keep row decoding separate from the mechanics of requesting another batch. this adds asynchronous control flow without changing the key-order concepts. batch shape and completion shape both matter in an asynchronous scanner. asynchbase and the password-update pipeline {}", "pdf_page": 186}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 162, "end": 177}, "title": "Conditional update protects against a stale old value", "body": "The example changes a value only if the expected old value still matches. A false result means the comparison did not hold, not necessarily a transport exception. Success, condition failure, and request failure are distinct outcomes. This distinction is central to using conditional writes under concurrent access.", "takeaway": "A completed RPC can legitimately report that the requested condition failed.", "kind": "lesson", "lab": "async", "lab_snapshot": "Toy compare-and-set outcomes: true -> updated result; false -> condition-conflict result; exception -> error result. Formatting a message does not turn the failed update into a successful one.", "id": "c0181", "index": 180, "pdf_source_start": 189, "pdf_source_end": 204, "words": 58, "search": "conditional update protects against a stale old value the example changes a value only if the expected old value still matches. a false result means the comparison did not hold, not necessarily a transport exception. success, condition failure, and request failure are distinct outcomes. this distinction is central to using conditional writes under concurrent access. a completed rpc can legitimately report that the requested condition failed. asynchbase and the password-update pipeline {}", "pdf_page": 187}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 169, "end": 176}, "title": "Chain transformations without losing context", "body": "One callback can transform the update result into a reporting object; a later callback can format a message or send a notification. The output of one stage becomes the input of the next. The pipeline is easier to reason about when success and error objects carry the relevant user and operation information rather than just an anonymous boolean.", "takeaway": "Useful callback chains preserve meaning as they transform results.", "kind": "lesson", "id": "c0182", "index": 181, "pdf_source_start": 196, "pdf_source_end": 203, "words": 67, "search": "chain transformations without losing context one callback can transform the update result into a reporting object; a later callback can format a message or send a notification. the output of one stage becomes the input of the next. the pipeline is easier to reason about when success and error objects carry the relevant user and operation information rather than just an anonymous boolean. useful callback chains preserve meaning as they transform results. asynchbase and the password-update pipeline {\"type\": \"code\", \"text\": \"update(user)\\n    -> success_or_error_result\\n    -> format_report(result)\\n    -> notify(report)\\n\\n// each arrow is a callback boundary in the example.\\n// notification can have its own failure path.\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "update(user)\n    -> success_or_error_result\n    -> format_report(result)\n    -> notify(report)\n\n// Each arrow is a callback boundary in the example.\n// Notification can have its own failure path.", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 188}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 172, "end": 177}, "title": "Group work at the completion boundary", "body": "Deferred.group collects several outstanding operations so the application can handle their collective completion. Waiting there is different from waiting after each request. The book uses this to finish a pipeline while allowing independent updates to overlap. A grouped completion still needs to represent failures rather than assuming every member succeeded.", "takeaway": "Wait where completion is needed, not automatically after every operation is issued.", "kind": "lesson", "id": "c0183", "index": 182, "pdf_source_start": 199, "pdf_source_end": 204, "words": 62, "search": "group work at the completion boundary deferred.group collects several outstanding operations so the application can handle their collective completion. waiting there is different from waiting after each request. the book uses this to finish a pipeline while allowing independent updates to overlap. a grouped completion still needs to represent failures rather than assuming every member succeeded. wait where completion is needed, not automatically after every operation is issued. asynchbase and the password-update pipeline {\"type\": \"code\", \"text\": \"pending = []\\nfor user in users:\\n    pending.add(start_independent_update(user))\\n\\nwait_for_group(pending)\\n// contrast with waiting inside the loop.\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "pending = []\nfor user in users:\n    pending.add(start_independent_update(user))\n\nwait_for_group(pending)\n// Contrast with waiting inside the loop.", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 189}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 162, "end": 177}, "title": "The password example is a control-flow exercise", "body": "The example uses password changes to demonstrate scanning, conditional mutation, callbacks, and reporting. It does not supply a complete authentication service or a production password-handling design. Keeping that boundary explicit prevents the example's data values from being mistaken for security advice. Learn the branching and resource lifecycle rather than adopt the credential scheme.", "takeaway": "A domain example can teach concurrency without being a finished security design.", "kind": "source-note", "id": "c0184", "index": 183, "pdf_source_start": 189, "pdf_source_end": 204, "words": 65, "search": "the password example is a control-flow exercise the example uses password changes to demonstrate scanning, conditional mutation, callbacks, and reporting. it does not supply a complete authentication service or a production password-handling design. keeping that boundary explicit prevents the example's data values from being mistaken for security advice. learn the branching and resource lifecycle rather than adopt the credential scheme. a domain example can teach concurrency without being a finished security design. asynchbase and the password-update pipeline {}", "pdf_page": 190}, {"module": "6", "section": {"name": "Chapter recall", "start": 150, "end": 156}, "title": "Recall: scanner routing", "body": "Why can a REST scanner require subsequent requests to reach the same gateway?", "takeaway": "The source distinguishes stateful scan resources from independent stateless HTTP requests. Routing must preserve access to the scanner state.", "kind": "quiz", "choices": ["The scanner has state at that gateway", "HBase never supports several clients", "Base64 requires the same CPU"], "answer": 0, "explanation": "The source distinguishes stateful scan resources from independent stateless HTTP requests. Routing must preserve access to the scanner state.", "id": "c0185", "index": 184, "pdf_source_start": 177, "pdf_source_end": 183, "words": 32, "search": "recall: scanner routing why can a rest scanner require subsequent requests to reach the same gateway? the source distinguishes stateful scan resources from independent stateless http requests. routing must preserve access to the scanner state. chapter recall {}", "pdf_page": 191, "answer_page": 383}, {"module": "6", "section": {"name": "Chapter recall", "start": 153, "end": 155}, "title": "Recall: encoding", "body": "A JSON response contains a Base64 value. What has Base64 supplied?", "takeaway": "Base64 is a transport encoding. The application still decodes the bytes according to the format used when the value was written.", "kind": "quiz", "choices": ["Encryption and authentication", "A textual representation of bytes", "A declared SQL type"], "answer": 1, "explanation": "Base64 is a transport encoding. The application still decodes the bytes according to the format used when the value was written.", "id": "c0186", "index": 185, "pdf_source_start": 180, "pdf_source_end": 182, "words": 32, "search": "recall: encoding a json response contains a base64 value. what has base64 supplied? base64 is a transport encoding. the application still decodes the bytes according to the format used when the value was written. chapter recall {}", "pdf_page": 192, "answer_page": 384}, {"module": "6", "section": {"name": "Chapter recall", "start": 165, "end": 173}, "title": "Recall: conditional false", "body": "A compare-and-set request completes with false. Which interpretation fits?", "takeaway": "Condition failure is different from a request exception. The operation can complete normally and report that no update was applied because the comparison failed.", "kind": "quiz", "choices": ["The mutation definitely succeeded", "The table was necessarily deleted", "The expected old value did not match"], "answer": 2, "explanation": "Condition failure is different from a request exception. The operation can complete normally and report that no update was applied because the comparison failed.", "id": "c0187", "index": 186, "pdf_source_start": 192, "pdf_source_end": 200, "words": 33, "search": "recall: conditional false a compare-and-set request completes with false. which interpretation fits? condition failure is different from a request exception. the operation can complete normally and report that no update was applied because the comparison failed. chapter recall {}", "pdf_page": 193, "answer_page": 385}, {"module": "6", "section": {"name": "Chapter recall", "start": 163, "end": 177}, "title": "Recall: blocking the async API", "body": "Which sequence permits more overlap?", "takeaway": "Joining after every operation serializes progress. Issuing independent work first and grouping completion preserves the purpose of the asynchronous client.", "kind": "quiz", "choices": ["Issue independent A and B, then wait at the completion boundary", "Never handle errors", "Issue request A, wait; issue B, wait"], "answer": 0, "explanation": "Joining after every operation serializes progress. Issuing independent work first and grouping completion preserves the purpose of the asynchronous client.", "id": "c0188", "index": 187, "pdf_source_start": 190, "pdf_source_end": 204, "words": 25, "search": "recall: blocking the async api which sequence permits more overlap? joining after every operation serializes progress. issuing independent work first and grouping completion preserves the purpose of the asynchronous client. chapter recall {}", "pdf_page": 194, "answer_page": 386}, {"module": "7", "section": {"name": "The monitoring problem and time-series data", "start": 181, "end": 186}, "title": "Monitor the entire infrastructure", "body": "OpenTSDB is introduced as a real application for collecting metrics from many machines and software layers. The history should remain queryable as new measurements and metric types appear. HBase supplies the scalable storage; OpenTSDB supplies the domain-specific collection and query behavior. This case study shows how a database is embedded inside an application rather than equated with the application itself.", "takeaway": "A time-series product includes ingestion, metadata, query logic, and storage.", "kind": "lesson", "id": "c0189", "index": 188, "pdf_source_start": 208, "pdf_source_end": 213, "words": 70, "search": "monitor the entire infrastructure opentsdb is introduced as a real application for collecting metrics from many machines and software layers. the history should remain queryable as new measurements and metric types appear. hbase supplies the scalable storage; opentsdb supplies the domain-specific collection and query behavior. this case study shows how a database is embedded inside an application rather than equated with the application itself. a time-series product includes ingestion, metadata, query logic, and storage. the monitoring problem and time-series data {}", "pdf_page": 195}, {"module": "7", "section": {"name": "The monitoring problem and time-series data", "start": 181, "end": 186}, "title": "A measurement needs context", "body": "A useful observation includes a metric, a timestamp, a value, and labels identifying its context. A bytes-sent value without its host or metric name is hard to interpret. Labels such as host=ubuntu distinguish series. The chapter treats these attributes as schema inputs, not optional decorations added only when displaying a graph.", "takeaway": "The identity of a series includes its metric and relevant tags.", "kind": "lesson", "id": "c0190", "index": 189, "pdf_source_start": 208, "pdf_source_end": 213, "words": 62, "search": "a measurement needs context a useful observation includes a metric, a timestamp, a value, and labels identifying its context. a bytes-sent value without its host or metric name is hard to interpret. labels such as host=ubuntu distinguish series. the chapter treats these attributes as schema inputs, not optional decorations added only when displaying a graph. the identity of a series includes its metric and relevant tags. the monitoring problem and time-series data {}", "pdf_page": 196}, {"module": "7", "section": {"name": "The monitoring problem and time-series data", "start": 181, "end": 186}, "title": "Do not put every new point at the same edge", "body": "A naive time-first layout places many simultaneous measurements near the current-time end of the key space. The book already warned about this hotspot pattern. OpenTSDB instead begins its key with the metric identifier and then time. That choice serves metric-centric queries and distributes different metrics into different ranges, with the workload trade-offs that entails.", "takeaway": "The first field should serve the intended query and distribution pattern.", "kind": "lesson", "id": "c0191", "index": 190, "pdf_source_start": 208, "pdf_source_end": 213, "words": 65, "search": "do not put every new point at the same edge a naive time-first layout places many simultaneous measurements near the current-time end of the key space. the book already warned about this hotspot pattern. opentsdb instead begins its key with the metric identifier and then time. that choice serves metric-centric queries and distributes different metrics into different ranges, with the workload trade-offs that entails. the first field should serve the intended query and distribution pattern. the monitoring problem and time-series data {}", "pdf_page": 197}, {"module": "7", "section": {"name": "Schema design", "start": 187, "end": 190}, "title": "Two tables serve two responsibilities", "body": "The design separates the measurement table tsdb from the identifier mapping table tsdb-uid. The first stores values by metric, time bucket, and tags. The second maps human-readable names to compact identifiers and back. This is denormalization with a clear purpose: repeated names need not be copied into every measurement coordinate.", "takeaway": "Compact data storage can depend on a separate metadata lookup table.", "kind": "lesson", "id": "c0192", "index": 191, "pdf_source_start": 214, "pdf_source_end": 217, "words": 61, "search": "two tables serve two responsibilities the design separates the measurement table tsdb from the identifier mapping table tsdb-uid. the first stores values by metric, time bucket, and tags. the second maps human-readable names to compact identifiers and back. this is denormalization with a clear purpose: repeated names need not be copied into every measurement coordinate. compact data storage can depend on a separate metadata lookup table. schema design {\"type\": \"table\", \"headers\": [\"table\", \"role\"], \"rows\": [[\"tsdb\", \"hourly buckets of observations\"], [\"tsdb-uid\", \"name / compact uid mappings\"]], \"caption\": \"study comparison based on the cited section.\"}", "visual": {"type": "table", "headers": ["Table", "Role"], "rows": [["tsdb", "Hourly buckets of observations"], ["tsdb-uid", "Name / compact UID mappings"]], "caption": "Study comparison based on the cited section."}, "pdf_page": 198}, {"module": "7", "section": {"name": "Schema design", "start": 187, "end": 190}, "title": "UIDs replace long repeated names", "body": "The source uses three-byte identifiers for metric names, tag names, and tag values. Reusing these compact representations saves coordinate bytes in a measurement-heavy table. The mapping must remain available so writers and readers agree on the IDs. A UID is not the measurement value and is not itself the timestamp.", "takeaway": "Saving repeated name bytes introduces a mapping contract shared by ingestion and queries.", "kind": "lesson", "id": "c0193", "index": 192, "pdf_source_start": 214, "pdf_source_end": 217, "words": 63, "search": "uids replace long repeated names the source uses three-byte identifiers for metric names, tag names, and tag values. reusing these compact representations saves coordinate bytes in a measurement-heavy table. the mapping must remain available so writers and readers agree on the ids. a uid is not the measurement value and is not itself the timestamp. saving repeated name bytes introduces a mapping contract shared by ingestion and queries. schema design {\"type\": \"table\", \"headers\": [\"piece\", \"example\"], \"rows\": [[\"metric uid\", \"0x000001\"], [\"base timestamp\", \"1292148000\"], [\"host tag-name uid\", \"0x000002\"], [\"ubuntu tag-value uid\", \"0x000003\"], [\"qualifier\", \"123-second offset; flags 0x07\"], [\"cell value\", \"476\"]], \"caption\": \"source example from figure 7.6. uid display is expanded to show the stated three-byte width.\"}", "visual": {"type": "table", "headers": ["Piece", "Example"], "rows": [["Metric UID", "0x000001"], ["Base timestamp", "1292148000"], ["host tag-name UID", "0x000002"], ["ubuntu tag-value UID", "0x000003"], ["Qualifier", "123-second offset; flags 0x07"], ["Cell value", "476"]], "caption": "Source example from figure 7.6. UID display is expanded to show the stated three-byte width."}, "pdf_page": 199}, {"module": "7", "section": {"name": "Schema design", "start": 187, "end": 190}, "title": "Forward and reverse UID mappings", "body": "In tsdb-uid, one orientation resolves a name to an ID, while another resolves the ID back to its name. The family and qualifier conventions distinguish the mapping kind. This makes writes and human-facing query results both possible. A one-way mapping would make decoding or label display more awkward.", "takeaway": "Encoding and decoding often need different lookup directions.", "kind": "lesson", "id": "c0194", "index": 193, "pdf_source_start": 214, "pdf_source_end": 217, "words": 56, "search": "forward and reverse uid mappings in tsdb-uid, one orientation resolves a name to an id, while another resolves the id back to its name. the family and qualifier conventions distinguish the mapping kind. this makes writes and human-facing query results both possible. a one-way mapping would make decoding or label display more awkward. encoding and decoding often need different lookup directions. schema design {}", "pdf_page": 200}, {"module": "7", "section": {"name": "Schema design", "start": 187, "end": 190}, "title": "Metric comes first in the measurement key", "body": "The rowkey starts with a metric UID, followed by the base timestamp for an hour, then tag-name and tag-value UIDs. This creates an ordered run for a metric, with its hours ordered within that run. Tags remain available in the key for later filtering. Different field order would support different contiguous ranges.", "takeaway": "The OpenTSDB key makes metric-plus-time the primary scan shape.", "kind": "lesson", "visual": {"type": "tsdbkey", "caption": "Figures 7.4-7.6, printed pp.189-190: 3-byte metric, 4-byte base time, then 6 bytes per tag pair.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"38\" width=\"131.46153846153845\" height=\"92\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"85.73076923076923\" y=\"79.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">metric<\/text><text x=\"85.73076923076923\" y=\"101.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">3 bytes<\/text><rect x=\"158.46153846153845\" y=\"38\" width=\"177.6153846153846\" height=\"92\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"247.26923076923077\" y=\"79.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">hour<\/text><text x=\"247.26923076923077\" y=\"101.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">4 bytes<\/text><rect x=\"343.0769230769231\" y=\"38\" width=\"131.46153846153845\" height=\"92\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"408.8076923076923\" y=\"79.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">tag name<\/text><text x=\"408.8076923076923\" y=\"101.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">3 bytes<\/text><rect x=\"481.53846153846155\" y=\"38\" width=\"131.46153846153845\" height=\"92\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"547.2692307692307\" y=\"79.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">tag value<\/text><text x=\"547.2692307692307\" y=\"101.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">3 bytes<\/text><text x=\"320\" y=\"166\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"20\" font-weight=\"bold\" fill=\"#173344\">Rowkey: 7 + (6 x number of tags) bytes<\/text><text x=\"320\" y=\"207\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"18\" font-weight=\"normal\" fill=\"#173344\">Qualifier: 12 offset bits + 4 flag bits<\/text><\/svg>"}, "id": "c0195", "index": 194, "pdf_source_start": 214, "pdf_source_end": 217, "words": 61, "search": "metric comes first in the measurement key the rowkey starts with a metric uid, followed by the base timestamp for an hour, then tag-name and tag-value uids. this creates an ordered run for a metric, with its hours ordered within that run. tags remain available in the key for later filtering. different field order would support different contiguous ranges. the opentsdb key makes metric-plus-time the primary scan shape. schema design {\"type\": \"tsdbkey\", \"caption\": \"figures 7.4-7.6, printed pp.189-190: 3-byte metric, 4-byte base time, then 6 bytes per tag pair.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"38\\\" width=\\\"131.46153846153845\\\" height=\\\"92\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"85.73076923076923\\\" y=\\\"79.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">metric<\/text><text x=\\\"85.73076923076923\\\" y=\\\"101.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">3 bytes<\/text><rect x=\\\"158.46153846153845\\\" y=\\\"38\\\" width=\\\"177.6153846153846\\\" height=\\\"92\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"247.26923076923077\\\" y=\\\"79.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">hour<\/text><text x=\\\"247.26923076923077\\\" y=\\\"101.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">4 bytes<\/text><rect x=\\\"343.0769230769231\\\" y=\\\"38\\\" width=\\\"131.46153846153845\\\" height=\\\"92\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"408.8076923076923\\\" y=\\\"79.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">tag name<\/text><text x=\\\"408.8076923076923\\\" y=\\\"101.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">3 bytes<\/text><rect x=\\\"481.53846153846155\\\" y=\\\"38\\\" width=\\\"131.46153846153845\\\" height=\\\"92\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"547.2692307692307\\\" y=\\\"79.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">tag value<\/text><text x=\\\"547.2692307692307\\\" y=\\\"101.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">3 bytes<\/text><text x=\\\"320\\\" y=\\\"166\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"20\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">rowkey: 7 + (6 x number of tags) bytes<\/text><text x=\\\"320\\\" y=\\\"207\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"18\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">qualifier: 12 offset bits + 4 flag bits<\/text><\/svg>\"}", "pdf_page": 201}, {"module": "7", "section": {"name": "Schema design", "start": 187, "end": 190}, "title": "An hour is one bucket of observations", "body": "The timestamp in the rowkey is rounded down to the beginning of an hour. Measurements for the same metric and tag combination within that hour occupy different cells in that row. The timestamp is therefore split between the rowkey and the qualifier. This reduces the number of rows and avoids repeating the full key for each separate row-level observation.", "takeaway": "The row identifies the hour; the qualifier identifies the point inside that hour.", "kind": "lesson", "id": "c0196", "index": 195, "pdf_source_start": 214, "pdf_source_end": 217, "words": 72, "search": "an hour is one bucket of observations the timestamp in the rowkey is rounded down to the beginning of an hour. measurements for the same metric and tag combination within that hour occupy different cells in that row. the timestamp is therefore split between the rowkey and the qualifier. this reduces the number of rows and avoids repeating the full key for each separate row-level observation. the row identifies the hour; the qualifier identifies the point inside that hour. schema design {}", "pdf_page": 202}, {"module": "7", "section": {"name": "Schema design", "start": 187, "end": 190}, "title": "A qualifier packs offset and flags", "body": "The book describes a two-byte qualifier: twelve bits for the seconds offset within the hour and four bits for flags. Those flags distinguish how the measurement should be interpreted. Bit packing is not arbitrary cleverness here: it connects time precision to a compact cell address. It also means decoding must respect the exact field layout.", "takeaway": "A compact qualifier is meaningful only with its agreed bit-level interpretation.", "kind": "lesson", "visual": {"type": "code", "text": "qualifier = (seconds_within_hour << 4) | flags", "caption": "Arithmetic reconstruction of the book's two-byte qualifier. Valid teaching inputs use offsets 0-3599 and flags 0-15."}, "id": "c0197", "index": 196, "pdf_source_start": 214, "pdf_source_end": 217, "words": 66, "search": "a qualifier packs offset and flags the book describes a two-byte qualifier: twelve bits for the seconds offset within the hour and four bits for flags. those flags distinguish how the measurement should be interpreted. bit packing is not arbitrary cleverness here: it connects time precision to a compact cell address. it also means decoding must respect the exact field layout. a compact qualifier is meaningful only with its agreed bit-level interpretation. schema design {\"type\": \"code\", \"text\": \"qualifier = (seconds_within_hour << 4) | flags\", \"caption\": \"arithmetic reconstruction of the book's two-byte qualifier. valid teaching inputs use offsets 0-3599 and flags 0-15.\"}", "pdf_page": 203}, {"module": "7", "section": {"name": "Schema design", "start": 187, "end": 190}, "title": "Work through the source's measurement", "body": "The book stores mysql.bytes_sent=476 for host=ubuntu at timestamp 1292148123. Rounding to the hour gives 1292148000 and leaves an offset of 123 seconds. The example's flags are 0x07. Combining the offset with those four flag bits gives a qualifier value of 1975, or 0x07B7. This last arithmetic is calculated from the source layout.", "takeaway": "Split the timestamp first; then combine the offset with the value-format flags.", "kind": "lesson", "lab": "tsdb", "lab_snapshot": "Source example: 1292148123 = 1292148000 + 123. (123 << 4) | 7 = 1975 = 0x07B7. With one tag, the rowkey is 3 + 4 + 6 = 13 bytes; the qualifier is 2 bytes.", "id": "c0198", "index": 197, "pdf_source_start": 214, "pdf_source_end": 217, "words": 64, "search": "work through the source's measurement the book stores mysql.bytes_sent=476 for host=ubuntu at timestamp 1292148123. rounding to the hour gives 1292148000 and leaves an offset of 123 seconds. the example's flags are 0x07. combining the offset with those four flag bits gives a qualifier value of 1975, or 0x07b7. this last arithmetic is calculated from the source layout. split the timestamp first; then combine the offset with the value-format flags. schema design {}", "pdf_page": 204}, {"module": "7", "section": {"name": "Schema design", "start": 197, "end": 199}, "title": "Canonical tag order makes one series identity", "body": "A metric and tag set should produce the same rowkey regardless of the order in which tags arrived. The implementation uses a consistent ordering when building the row template. Otherwise host=ubuntu,region=west and region=west,host=ubuntu could become different byte strings for the same intended series. Deterministic serialization is part of the schema.", "takeaway": "Equivalent tag sets need the same encoded key.", "kind": "lesson", "id": "c0199", "index": 198, "pdf_source_start": 224, "pdf_source_end": 226, "words": 58, "search": "canonical tag order makes one series identity a metric and tag set should produce the same rowkey regardless of the order in which tags arrived. the implementation uses a consistent ordering when building the row template. otherwise host=ubuntu,region=west and region=west,host=ubuntu could become different byte strings for the same intended series. deterministic serialization is part of the schema. equivalent tag sets need the same encoded key. schema design {\"type\": \"code\", \"text\": \"ordered_tags = sort_by_encoded_tag_identity(tags)\\nkey = metric_uid + hour_base_timestamp\\nfor tag in ordered_tags:\\n    key += tag.name_uid + tag.value_uid\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "ordered_tags = sort_by_encoded_tag_identity(tags)\nkey = metric_uid + hour_base_timestamp\nfor tag in ordered_tags:\n    key += tag.name_uid + tag.value_uid", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 205}, {"module": "7", "section": {"name": "Schema design", "start": 187, "end": 190}, "title": "Bucketing changes filtering work", "body": "A row containing many observations for one hour and tag combination can be rejected as a unit when it is not relevant. The book also connects fewer rows to the number of entries considered by row Bloom filters. These are reasons for bucketing, not a claim that an hour is the best bucket for every domain.", "takeaway": "Choose a grouping unit that gives later operations useful work to skip.", "kind": "lesson", "id": "c0200", "index": 199, "pdf_source_start": 214, "pdf_source_end": 217, "words": 68, "search": "bucketing changes filtering work a row containing many observations for one hour and tag combination can be rejected as a unit when it is not relevant. the book also connects fewer rows to the number of entries considered by row bloom filters. these are reasons for bucketing, not a claim that an hour is the best bucket for every domain. choose a grouping unit that gives later operations useful work to skip. schema design {}", "pdf_page": 206}, {"module": "7", "section": {"name": "Application architecture and ingestion", "start": 190, "end": 199}, "title": "The time-series daemon owns application logic", "body": "OpenTSDB's daemon accepts observations and handles queries above HBase. HBase need not understand graphing, metric names, or aggregation semantics. Keeping the daemon's request self-contained and avoiding unnecessary local state helps several instances serve the application. Its application logic is a different scaling concern from the region and file machinery below.", "takeaway": "A scalable storage engine does not remove the need to design the application tier.", "kind": "lesson", "id": "c0201", "index": 200, "pdf_source_start": 217, "pdf_source_end": 226, "words": 64, "search": "the time-series daemon owns application logic opentsdb's daemon accepts observations and handles queries above hbase. hbase need not understand graphing, metric names, or aggregation semantics. keeping the daemon's request self-contained and avoiding unnecessary local state helps several instances serve the application. its application logic is a different scaling concern from the region and file machinery below. a scalable storage engine does not remove the need to design the application tier. application architecture and ingestion {}", "pdf_page": 207}, {"module": "7", "section": {"name": "Application architecture and ingestion", "start": 190, "end": 199}, "title": "Collectors feed the daemon", "body": "The case study introduces tcollector as the layer that runs and supervises collection scripts and sends observations onward. This separates measuring a system from storing and querying its history. Collection can require buffering and process management of its own. The data pipeline therefore has responsibilities before the HBase client ever builds a Put.", "takeaway": "A measurement must be collected reliably before it can be stored reliably.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Collection scripts", "tcollector", "tsd application", "HBase tables"], "caption": "High-level ingestion components described in the OpenTSDB case study.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Collection<\/text><text x=\"87.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">scripts<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">tcollector<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"397.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">tsd<\/text><text x=\"397.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">application<\/text><polyline points=\"467.0,75 483.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M474.8959760788259 78.91468980700107 L483.0 75 L474.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"485.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"552.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">HBase tables<\/text><\/svg>"}, "id": "c0202", "index": 201, "pdf_source_start": 217, "pdf_source_end": 226, "words": 65, "search": "collectors feed the daemon the case study introduces tcollector as the layer that runs and supervises collection scripts and sends observations onward. this separates measuring a system from storing and querying its history. collection can require buffering and process management of its own. the data pipeline therefore has responsibilities before the hbase client ever builds a put. a measurement must be collected reliably before it can be stored reliably. application architecture and ingestion {\"type\": \"flow\", \"labels\": [\"collection scripts\", \"tcollector\", \"tsd application\", \"hbase tables\"], \"caption\": \"high-level ingestion components described in the opentsdb case study.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"150\\\" viewbox=\\\"0 0 640 150\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"150\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"87.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">collection<\/text><text x=\\\"87.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">scripts<\/text><polyline points=\\\"157.0,75 173.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m164.8959760788259 78.91468980700107 l173.0 75 l164.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"175.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"242.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">tcollector<\/text><polyline points=\\\"312.0,75 328.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m319.8959760788259 78.91468980700107 l328.0 75 l319.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"330.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">tsd<\/text><text x=\\\"397.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">application<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">hbase tables<\/text><\/svg>\"}", "pdf_page": 208}, {"module": "7", "section": {"name": "Application architecture and ingestion", "start": 190, "end": 199}, "title": "UID creation is not a single blind insert", "body": "getOrCreate first checks whether the name is already registered. If not, the application allocates an identifier and creates mappings. Concurrent registration needs coordination so clients agree on a stable result. The chapter sketches this procedure rather than providing a complete proof of every race and failure case. Treat the sequence as an application consistency problem worth examining.", "takeaway": "A compact-ID registry has its own concurrency and failure behavior.", "kind": "lesson", "id": "c0203", "index": 202, "pdf_source_start": 217, "pdf_source_end": 226, "words": 67, "search": "uid creation is not a single blind insert getorcreate first checks whether the name is already registered. if not, the application allocates an identifier and creates mappings. concurrent registration needs coordination so clients agree on a stable result. the chapter sketches this procedure rather than providing a complete proof of every race and failure case. treat the sequence as an application consistency problem worth examining. a compact-id registry has its own concurrency and failure behavior. application architecture and ingestion {}", "pdf_page": 209}, {"module": "7", "section": {"name": "Application architecture and ingestion", "start": 194, "end": 197}, "title": "Mapping-write order has a reason", "body": "The source writes the ID-to-name mapping before making the name-to-ID direction visible. This is intended to avoid exposing a forward mapping whose reverse information is unavailable. It can instead leave an unused reverse mapping if later work fails. That is an explicit failure trade-off, not a multirow atomic transaction supplied by HBase.", "takeaway": "Ordering related writes can choose a safer partial state without making them atomic.", "kind": "lesson", "id": "c0204", "index": 203, "pdf_source_start": 221, "pdf_source_end": 224, "words": 65, "search": "mapping-write order has a reason the source writes the id-to-name mapping before making the name-to-id direction visible. this is intended to avoid exposing a forward mapping whose reverse information is unavailable. it can instead leave an unused reverse mapping if later work fails. that is an explicit failure trade-off, not a multirow atomic transaction supplied by hbase. ordering related writes can choose a safer partial state without making them atomic. application architecture and ingestion {\"type\": \"code\", \"text\": \"id = allocate_id(kind)\\nwrite_reverse_mapping(id, name)\\nwrite_forward_mapping(name, id)\\n\\n// ordering chooses a possible partial state.\\n// it does not create a multirow transaction.\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "id = allocate_id(kind)\nwrite_reverse_mapping(id, name)\nwrite_forward_mapping(name, id)\n\n// Ordering chooses a possible partial state.\n// It does not create a multirow transaction.", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 210}, {"module": "7", "section": {"name": "Application architecture and ingestion", "start": 190, "end": 199}, "title": "Immutable mappings are cache-friendly", "body": "After a name is assigned an identifier, the case study treats that mapping as stable. Clients can cache it and avoid a table lookup for every point. This works because the application has made the mapping contract stable, not because all database values are inherently safe to cache forever. The data's semantics justify the cache lifetime.", "takeaway": "Cache policy should follow the meaning and mutability of the cached mapping.", "kind": "lesson", "id": "c0205", "index": 204, "pdf_source_start": 217, "pdf_source_end": 226, "words": 68, "search": "immutable mappings are cache-friendly after a name is assigned an identifier, the case study treats that mapping as stable. clients can cache it and avoid a table lookup for every point. this works because the application has made the mapping contract stable, not because all database values are inherently safe to cache forever. the data's semantics justify the cache lifetime. cache policy should follow the meaning and mutability of the cached mapping. application architecture and ingestion {}", "pdf_page": 211}, {"module": "7", "section": {"name": "Application architecture and ingestion", "start": 190, "end": 199}, "title": "Build reusable key bytes, then the point", "body": "The implementation can prepare the metric and tag portions of a row template, fill in the hour timestamp, and create the qualifier for each observation. This avoids repeatedly reconstructing all metadata for a sequence of points. The final Put still carries a complete rowkey and cell address. Optimization stays within the schema contract.", "takeaway": "Reuse stable encoding work without making each write's identity ambiguous.", "kind": "lesson", "id": "c0206", "index": 205, "pdf_source_start": 217, "pdf_source_end": 226, "words": 63, "search": "build reusable key bytes, then the point the implementation can prepare the metric and tag portions of a row template, fill in the hour timestamp, and create the qualifier for each observation. this avoids repeatedly reconstructing all metadata for a sequence of points. the final put still carries a complete rowkey and cell address. optimization stays within the schema contract. reuse stable encoding work without making each write's identity ambiguous. application architecture and ingestion {}", "pdf_page": 212}, {"module": "7", "section": {"name": "Querying data", "start": 199, "end": 202}, "title": "Autocomplete queries the name-oriented index", "body": "Autocomplete looks for registered names sharing a prefix. That query belongs to the UID table's name-oriented rows, not a scan of all measurements. The example uses simple textual bounds for a prefix. Read it as an example for that input range rather than a fully general byte-prefix successor algorithm.", "takeaway": "Ask the metadata index for names; do not search every measurement to discover them.", "kind": "lesson", "id": "c0207", "index": 206, "pdf_source_start": 226, "pdf_source_end": 229, "words": 63, "search": "autocomplete queries the name-oriented index autocomplete looks for registered names sharing a prefix. that query belongs to the uid table's name-oriented rows, not a scan of all measurements. the example uses simple textual bounds for a prefix. read it as an example for that input range rather than a fully general byte-prefix successor algorithm. ask the metadata index for names; do not search every measurement to discover them. querying data {}", "pdf_page": 213}, {"module": "7", "section": {"name": "Querying data", "start": 199, "end": 202}, "title": "Start with metric and time bounds", "body": "A measurement query resolves the metric to its UID, builds the time range in rowkey order, and scans that range. This narrows the candidates before applying tag conditions. Tags later in the key are not automatically independent indexes that make every tag query equally cheap. The data layout makes some queries more selective than others.", "takeaway": "The front of the rowkey determines the first useful range restriction.", "kind": "lesson", "id": "c0208", "index": 207, "pdf_source_start": 226, "pdf_source_end": 229, "words": 66, "search": "start with metric and time bounds a measurement query resolves the metric to its uid, builds the time range in rowkey order, and scans that range. this narrows the candidates before applying tag conditions. tags later in the key are not automatically independent indexes that make every tag query equally cheap. the data layout makes some queries more selective than others. the front of the rowkey determines the first useful range restriction. querying data {}", "pdf_page": 214}, {"module": "7", "section": {"name": "Querying data", "start": 199, "end": 202}, "title": "Tag matching works on encoded key structure", "body": "The case study builds tag conditions using the fixed-width UID fields in rowkeys. Matching must respect field boundaries rather than accidentally finding a byte pattern inside an unrelated field. The chapter's regex-oriented implementation is specific to its binary schema. It is not an invitation to treat arbitrary encoded keys as unconstrained human text.", "takeaway": "A binary-key filter must understand the schema's field widths and ordering.", "kind": "lesson", "id": "c0209", "index": 208, "pdf_source_start": 226, "pdf_source_end": 229, "words": 64, "search": "tag matching works on encoded key structure the case study builds tag conditions using the fixed-width uid fields in rowkeys. matching must respect field boundaries rather than accidentally finding a byte pattern inside an unrelated field. the chapter's regex-oriented implementation is specific to its binary schema. it is not an invitation to treat arbitrary encoded keys as unconstrained human text. a binary-key filter must understand the schema's field widths and ordering. querying data {}", "pdf_page": 215}, {"module": "7", "section": {"name": "Querying data", "start": 199, "end": 202}, "title": "Aggregation belongs to the time-series query layer", "body": "After the appropriate observations are retrieved, OpenTSDB can combine and present them according to the metric query. HBase supplies stored cells; it does not automatically know which hosts should be grouped or how a graph should be assembled. This separation explains why the daemon exists even though HBase can scale storage and scans.", "takeaway": "Domain-specific aggregation is an application responsibility in this design.", "kind": "lesson", "id": "c0210", "index": 209, "pdf_source_start": 226, "pdf_source_end": 229, "words": 62, "search": "aggregation belongs to the time-series query layer after the appropriate observations are retrieved, opentsdb can combine and present them according to the metric query. hbase supplies stored cells; it does not automatically know which hosts should be grouped or how a graph should be assembled. this separation explains why the daemon exists even though hbase can scale storage and scans. domain-specific aggregation is an application responsibility in this design. querying data {}", "pdf_page": 216}, {"module": "7", "section": {"name": "Chapter recall", "start": 189, "end": 190}, "title": "Recall: the time split", "body": "Timestamp 1292148123 falls into which source-example bucket?", "takeaway": "The base is rounded down to an hour. The remaining 123 seconds are encoded in the qualifier along with its flags.", "kind": "quiz", "choices": ["Base 0, offset 1292148123", "Base 1292148000, offset 123", "Base 1292148123, offset 3600"], "answer": 1, "explanation": "The base is rounded down to an hour. The remaining 123 seconds are encoded in the qualifier along with its flags.", "id": "c0211", "index": 210, "pdf_source_start": 216, "pdf_source_end": 217, "words": 28, "search": "recall: the time split timestamp 1292148123 falls into which source-example bucket? the base is rounded down to an hour. the remaining 123 seconds are encoded in the qualifier along with its flags. chapter recall {}", "pdf_page": 217, "answer_page": 387}, {"module": "7", "section": {"name": "Chapter recall", "start": 189, "end": 190}, "title": "Recall: key size", "body": "Using the stated layout, how many rowkey bytes are used with two tag pairs?", "takeaway": "Three metric bytes plus four timestamp bytes plus two six-byte tag pairs gives 3 + 4 + 12 = 19. This excludes the qualifier, value, and other storage metadata.", "kind": "quiz", "choices": ["24", "12", "19"], "answer": 2, "explanation": "Three metric bytes plus four timestamp bytes plus two six-byte tag pairs gives 3 + 4 + 12 = 19. This excludes the qualifier, value, and other storage metadata.", "id": "c0212", "index": 211, "pdf_source_start": 216, "pdf_source_end": 217, "words": 43, "search": "recall: key size using the stated layout, how many rowkey bytes are used with two tag pairs? three metric bytes plus four timestamp bytes plus two six-byte tag pairs gives 3 + 4 + 12 = 19. this excludes the qualifier, value, and other storage metadata. chapter recall {}", "pdf_page": 218, "answer_page": 388}, {"module": "7", "section": {"name": "Chapter recall", "start": 194, "end": 199}, "title": "Recall: same tags, different order", "body": "What prevents two arrival orders of the same tags from creating different rowkeys?", "takeaway": "A stable tag ordering ensures equivalent series identities serialize to the same key. Physical file layout cannot repair ambiguous application keys.", "kind": "quiz", "choices": ["Canonical ordering during encoding", "Increasing the number of HFiles", "Disabling the WAL"], "answer": 0, "explanation": "A stable tag ordering ensures equivalent series identities serialize to the same key. Physical file layout cannot repair ambiguous application keys.", "id": "c0213", "index": 212, "pdf_source_start": 221, "pdf_source_end": 226, "words": 34, "search": "recall: same tags, different order what prevents two arrival orders of the same tags from creating different rowkeys? a stable tag ordering ensures equivalent series identities serialize to the same key. physical file layout cannot repair ambiguous application keys. chapter recall {}", "pdf_page": 219, "answer_page": 389}, {"module": "7", "section": {"name": "Chapter recall", "start": 199, "end": 200}, "title": "Recall: autocomplete", "body": "Where does the case study search for metric names beginning with a prefix?", "takeaway": "The mapping table has the name-oriented access pattern needed for autocomplete. Measurement storage is optimized for metric/time data rather than discovering names.", "kind": "quiz", "choices": ["The RegionServer log only", "The name-oriented UID mapping", "Every observation cell in tsdb"], "answer": 1, "explanation": "The mapping table has the name-oriented access pattern needed for autocomplete. Measurement storage is optimized for metric/time data rather than discovering names.", "id": "c0214", "index": 213, "pdf_source_start": 226, "pdf_source_end": 227, "words": 35, "search": "recall: autocomplete where does the case study search for metric names beginning with a prefix? the mapping table has the name-oriented access pattern needed for autocomplete. measurement storage is optimized for metric/time data rather than discovering names. chapter recall {}", "pdf_page": 220, "answer_page": 390}, {"module": "8", "section": {"name": "Geographic data and the spatial-index problem", "start": 203, "end": 209}, "title": "Spatial queries introduce a new locality", "body": "A geographic application asks for nearby points or points inside a polygon. The example stores New York Wi-Fi locations and wants selective queries rather than a full-table scan. HBase orders one-dimensional rowkeys, while locations have longitude and latitude. The design problem is to encode useful spatial grouping into that ordered key space.", "takeaway": "A spatial query needs a useful connection between geographic neighborhood and key order.", "kind": "lesson", "id": "c0215", "index": 214, "pdf_source_start": 230, "pdf_source_end": 236, "words": 65, "search": "spatial queries introduce a new locality a geographic application asks for nearby points or points inside a polygon. the example stores new york wi-fi locations and wants selective queries rather than a full-table scan. hbase orders one-dimensional rowkeys, while locations have longitude and latitude. the design problem is to encode useful spatial grouping into that ordered key space. a spatial query needs a useful connection between geographic neighborhood and key order. geographic data and the spatial-index problem {}", "pdf_page": 221}, {"module": "8", "section": {"name": "Geographic data and the spatial-index problem", "start": 203, "end": 209}, "title": "Spatial locality is not Hadoop data locality", "body": "Spatial locality here means geographically nearby points being near each other in the data layout. Hadoop data locality means computation occurring near the machines storing the required bytes. The book explicitly distinguishes them. A GIS key can improve geographic candidate selection even though region placement and HDFS block location remain different concerns.", "takeaway": "Nearby on a map and nearby on a machine are two different meanings of locality.", "kind": "lesson", "id": "c0216", "index": 215, "pdf_source_start": 230, "pdf_source_end": 236, "words": 67, "search": "spatial locality is not hadoop data locality spatial locality here means geographically nearby points being near each other in the data layout. hadoop data locality means computation occurring near the machines storing the required bytes. the book explicitly distinguishes them. a gis key can improve geographic candidate selection even though region placement and hdfs block location remain different concerns. nearby on a map and nearby on a machine are two different meanings of locality. geographic data and the spatial-index problem {}", "pdf_page": 222}, {"module": "8", "section": {"name": "Geographic data and the spatial-index problem", "start": 203, "end": 209}, "title": "Two queries guide the design", "body": "Nearest-neighbor queries ask for the closest points to a target. Within queries ask for points inside a supplied polygon. The required candidate region and final acceptance test differ. The chapter develops an index useful to both, then explains additional filtering and ranking work. A common index does not make the two operations identical.", "takeaway": "First state whether the result is ranked by distance or selected by containment.", "kind": "lesson", "id": "c0217", "index": 216, "pdf_source_start": 230, "pdf_source_end": 236, "words": 66, "search": "two queries guide the design nearest-neighbor queries ask for the closest points to a target. within queries ask for points inside a supplied polygon. the required candidate region and final acceptance test differ. the chapter develops an index useful to both, then explains additional filtering and ranking work. a common index does not make the two operations identical. first state whether the result is ranked by distance or selected by containment. geographic data and the spatial-index problem {\"type\": \"table\", \"headers\": [\"query\", \"candidate stage\", \"final decision\"], \"rows\": [[\"nearest neighbors\", \"spatial key ranges\", \"rank by distance\"], [\"within polygon\", \"covering key ranges\", \"test containment\"]], \"caption\": \"study comparison based on the cited section.\"}", "visual": {"type": "table", "headers": ["Query", "Candidate stage", "Final decision"], "rows": [["Nearest neighbors", "Spatial key ranges", "Rank by distance"], ["Within polygon", "Covering key ranges", "Test containment"]], "caption": "Study comparison based on the cited section."}, "pdf_page": 223}, {"module": "8", "section": {"name": "Geographic data and the spatial-index problem", "start": 203, "end": 209}, "title": "Longitude followed by latitude is not enough", "body": "A straightforward concatenation sorts primarily by the first coordinate. Two geographically close points can then be far apart in the second coordinate's position within that order. The chapter shows why a naive compound key does not give balanced spatial locality. Adding a filter can discard distant points, but it does not necessarily avoid reading them.", "takeaway": "A two-field key is still ordered by one field before the other.", "kind": "lesson", "id": "c0218", "index": 217, "pdf_source_start": 230, "pdf_source_end": 236, "words": 67, "search": "longitude followed by latitude is not enough a straightforward concatenation sorts primarily by the first coordinate. two geographically close points can then be far apart in the second coordinate's position within that order. the chapter shows why a naive compound key does not give balanced spatial locality. adding a filter can discard distant points, but it does not necessarily avoid reading them. a two-field key is still ordered by one field before the other. geographic data and the spatial-index problem {}", "pdf_page": 224}, {"module": "8", "section": {"name": "Geohash and spatial rowkeys", "start": 209, "end": 216}, "title": "Geohash repeatedly divides coordinate ranges", "body": "Start with longitude from -180 to 180 and latitude from -90 to 90. Repeatedly bisect the relevant interval and record which half contains the point. The source interleaves bits from longitude and latitude, longitude first. The resulting bit sequence can be encoded as characters and used in a rowkey. This creates a hierarchy of geographic boxes.", "takeaway": "Geohash turns repeated two-dimensional partitioning into an ordered code.", "kind": "lesson", "lab": "geo", "lab_snapshot": "For 40.78 latitude and -73.97 longitude, the first six interleaved bits are 011001. Longitude contributes 010; latitude contributes 101. The experiment shows the resulting bounding rectangle, not a full GIS index.", "id": "c0219", "index": 218, "pdf_source_start": 236, "pdf_source_end": 243, "words": 65, "search": "geohash repeatedly divides coordinate ranges start with longitude from -180 to 180 and latitude from -90 to 90. repeatedly bisect the relevant interval and record which half contains the point. the source interleaves bits from longitude and latitude, longitude first. the resulting bit sequence can be encoded as characters and used in a rowkey. this creates a hierarchy of geographic boxes. geohash turns repeated two-dimensional partitioning into an ordered code. geohash and spatial rowkeys {}", "pdf_page": 225}, {"module": "8", "section": {"name": "Geohash and spatial rowkeys", "start": 209, "end": 216}, "title": "A shorter prefix describes a larger box", "body": "More geohash bits identify a smaller area. Removing trailing precision groups points into a larger shared box. This makes prefixes attractive for ordered scans: a common key prefix describes candidates in a geographic area. The prefix is a spatial bucket, not an exact circular-distance result. Exact query conditions still need their own test.", "takeaway": "Geohash precision is a candidate-granularity choice.", "kind": "lesson", "id": "c0220", "index": 219, "pdf_source_start": 236, "pdf_source_end": 243, "words": 59, "search": "a shorter prefix describes a larger box more geohash bits identify a smaller area. removing trailing precision groups points into a larger shared box. this makes prefixes attractive for ordered scans: a common key prefix describes candidates in a geographic area. the prefix is a spatial bucket, not an exact circular-distance result. exact query conditions still need their own test. geohash precision is a candidate-granularity choice. geohash and spatial rowkeys {}", "pdf_page": 226}, {"module": "8", "section": {"name": "Geohash and spatial rowkeys", "start": 209, "end": 216}, "title": "Work through the first six bits", "body": "For the book's point near Central Park, longitude -73.97 gives the first three decisions 010. Latitude 40.78 gives 101. Interleaving longitude first yields 011001. This tiny example is enough to see the algorithm without memorizing a long geohash string. Additional precision repeats the same interval-halving process.", "takeaway": "The next bit records a smaller interval, not an unrelated hash operation.", "kind": "lesson", "id": "c0221", "index": 220, "pdf_source_start": 236, "pdf_source_end": 243, "words": 58, "search": "work through the first six bits for the book's point near central park, longitude -73.97 gives the first three decisions 010. latitude 40.78 gives 101. interleaving longitude first yields 011001. this tiny example is enough to see the algorithm without memorizing a long geohash string. additional precision repeats the same interval-halving process. the next bit records a smaller interval, not an unrelated hash operation. geohash and spatial rowkeys {\"type\": \"geohash\", \"caption\": \"a conceptual sequence of alternating longitude and latitude bisections; based on figure 8.6.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><text x=\\\"28\\\" y=\\\"34\\\" text-anchor=\\\"start\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"18\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">longitude<\/text><text x=\\\"420\\\" y=\\\"34\\\" text-
