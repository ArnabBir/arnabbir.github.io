04 l323.9146898070011 95.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"540,75 540,134 529,134\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\" stroke-dasharray=\\\"6,5\\\"/><path d=\\\"m537.1040239211741 130.08531019299892 l529 134 l537.1040239211741 137.91468980700108\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"320,164 320,180\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m316.0853101929989 171.8959760788259 l320 180 l323.9146898070011 171.8959760788259\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><\/svg>\"}", "pdf_page": 261}, {"module": "9", "section": {"name": "Deploying software and choosing a distribution", "start": 248, "end": 253}, "title": "Make node setup repeatable", "body": "The chapter encourages configuration management and automation rather than installing each host differently by hand. Repeatable setup helps both initial deployment and replacing failed hardware. The target is consistent binaries, configuration, permissions, and role-specific daemon management. An operational script is useful when it makes that intent clear and can be checked, not merely because it is short.", "takeaway": "A replacement node should not require rediscovering the deployment process.", "kind": "lesson", "id": "c0256", "index": 255, "pdf_source_start": 275, "pdf_source_end": 280, "words": 67, "search": "make node setup repeatable the chapter encourages configuration management and automation rather than installing each host differently by hand. repeatable setup helps both initial deployment and replacing failed hardware. the target is consistent binaries, configuration, permissions, and role-specific daemon management. an operational script is useful when it makes that intent clear and can be checked, not merely because it is short. a replacement node should not require rediscovering the deployment process. deploying software and choosing a distribution {}", "pdf_page": 262}, {"module": "9", "section": {"name": "Deploying software and choosing a distribution", "start": 248, "end": 253}, "title": "Whirr is a historical automation example", "body": "The source demonstrates cloud deployment through Whirr, while noting the version combination used in that example differs from some earlier book exercises. This is a case study in repeatable provisioning and lifecycle commands, not a verified installation path for current services. Keep the example's release assumptions together rather than mixing commands across chapters blindly.", "takeaway": "Version combinations are part of the deployment example's contract.", "kind": "lesson", "id": "c0257", "index": 256, "pdf_source_start": 275, "pdf_source_end": 280, "words": 63, "search": "whirr is a historical automation example the source demonstrates cloud deployment through whirr, while noting the version combination used in that example differs from some earlier book exercises. this is a case study in repeatable provisioning and lifecycle commands, not a verified installation path for current services. keep the example's release assumptions together rather than mixing commands across chapters blindly. version combinations are part of the deployment example's contract. deploying software and choosing a distribution {}", "pdf_page": 263}, {"module": "9", "section": {"name": "Deploying software and choosing a distribution", "start": 248, "end": 253}, "title": "Distribution affects packaging and paths", "body": "The book compares stock Apache packages with Cloudera's CDH. The choice changes installation commands, configuration paths, and daemon scripts. The underlying need remains the same: install compatible software and start the appropriate roles. Its vendor preference is historical context rather than a current product recommendation.", "takeaway": "A packaging choice changes operational mechanics even when the conceptual roles are familiar.", "kind": "lesson", "id": "c0258", "index": 257, "pdf_source_start": 275, "pdf_source_end": 280, "words": 58, "search": "distribution affects packaging and paths the book compares stock apache packages with cloudera's cdh. the choice changes installation commands, configuration paths, and daemon scripts. the underlying need remains the same: install compatible software and start the appropriate roles. its vendor preference is historical context rather than a current product recommendation. a packaging choice changes operational mechanics even when the conceptual roles are familiar. deploying software and choosing a distribution {}", "pdf_page": 264}, {"module": "9", "section": {"name": "Deploying software and choosing a distribution", "start": 248, "end": 253}, "title": "Install daemons where their roles belong", "body": "The chapter's CDH example separates HBase binaries from Master and RegionServer management packages. Not every daemon belongs on every node. A consistent software layout can coexist with role-specific process startup. The important check is whether each host runs the services it is meant to run, with the intended configuration.", "takeaway": "Uniform installation and identical role placement are not the same goal.", "kind": "lesson", "id": "c0259", "index": 258, "pdf_source_start": 275, "pdf_source_end": 280, "words": 60, "search": "install daemons where their roles belong the chapter's cdh example separates hbase binaries from master and regionserver management packages. not every daemon belongs on every node. a consistent software layout can coexist with role-specific process startup. the important check is whether each host runs the services it is meant to run, with the intended configuration. uniform installation and identical role placement are not the same goal. deploying software and choosing a distribution {}", "pdf_page": 265}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Two files control different layers", "body": "hbase-env.sh sets environment and JVM options used to launch processes. hbase-site.xml contains HBase configuration properties consumed by daemons and clients. Mixing these responsibilities makes troubleshooting harder. A heap option is not a table setting; a ZooKeeper quorum is not an ordinary cell value. Learn which layer consumes each configuration before changing it.", "takeaway": "First identify which process reads a setting and when it takes effect.", "kind": "lesson", "visual": {"type": "table", "headers": ["Location", "Kinds of settings in the book"], "rows": [["hbase-env.sh", "JAVA_HOME, heap, garbage-collection options, log directory"], ["hbase-site.xml", "Root directory, quorum, distributed mode, client/server properties"], ["Family descriptors", "Versions, TTL, compression, blocks and caching"], ["Hadoop / OS configuration", "Filesystem behavior and host resource limits"]], "caption": "The configuration layers discussed in chapters 4 and 9."}, "id": "c0260", "index": 259, "pdf_source_start": 280, "pdf_source_end": 287, "words": 64, "search": "two files control different layers hbase-env.sh sets environment and jvm options used to launch processes. hbase-site.xml contains hbase configuration properties consumed by daemons and clients. mixing these responsibilities makes troubleshooting harder. a heap option is not a table setting; a zookeeper quorum is not an ordinary cell value. learn which layer consumes each configuration before changing it. first identify which process reads a setting and when it takes effect. hbase environment and daemon configuration {\"type\": \"table\", \"headers\": [\"location\", \"kinds of settings in the book\"], \"rows\": [[\"hbase-env.sh\", \"java_home, heap, garbage-collection options, log directory\"], [\"hbase-site.xml\", \"root directory, quorum, distributed mode, client/server properties\"], [\"family descriptors\", \"versions, ttl, compression, blocks and caching\"], [\"hadoop / os configuration\", \"filesystem behavior and host resource limits\"]], \"caption\": \"the configuration layers discussed in chapters 4 and 9.\"}", "pdf_page": 266}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Heap is shared between jobs inside the server", "body": "The RegionServer uses memory for write buffers, cached read blocks, and other work. Increasing one allocation can reduce headroom for another or worsen garbage collection. The book offers sample heap sizes but explicitly says to experiment for the workload. A bigger heap is not automatically a lower-latency service.", "takeaway": "Memory capacity, working-set fit, and pause behavior must be considered together.", "kind": "lesson", "id": "c0261", "index": 260, "pdf_source_start": 280, "pdf_source_end": 287, "words": 59, "search": "heap is shared between jobs inside the server the regionserver uses memory for write buffers, cached read blocks, and other work. increasing one allocation can reduce headroom for another or worsen garbage collection. the book offers sample heap sizes but explicitly says to experiment for the workload. a bigger heap is not automatically a lower-latency service. memory capacity, working-set fit, and pause behavior must be considered together. hbase environment and daemon configuration {}", "pdf_page": 267}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Long pauses can look like lost membership", "body": "The source connects stop-the-world garbage-collection pauses with ZooKeeper session timeouts. A server that pauses too long may fail to maintain its coordination session. Therefore garbage collection is not just local CPU overhead; it can affect the distributed system's view of the server. The specific collector flags are book-era details.", "takeaway": "A local pause can become a distributed availability event.", "kind": "lesson", "id": "c0262", "index": 261, "pdf_source_start": 280, "pdf_source_end": 287, "words": 58, "search": "long pauses can look like lost membership the source connects stop-the-world garbage-collection pauses with zookeeper session timeouts. a server that pauses too long may fail to maintain its coordination session. therefore garbage collection is not just local cpu overhead; it can affect the distributed system's view of the server. the specific collector flags are book-era details. a local pause can become a distributed availability event. hbase environment and daemon configuration {}", "pdf_page": 268}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Read historical GC settings as a rationale", "body": "The chapter discusses ParNew, CMS, young-generation sizing, occupancy thresholds, and logging. Its flags and suggested values belong to the Java versions it used. The useful mechanism is the trade-off between memory turnover, collection frequency, CPU work, and pause duration. This companion does not ask you to copy those flags into a current JVM.", "takeaway": "Understand the memory behavior being tuned before adopting any release-specific setting.", "kind": "lesson", "id": "c0263", "index": 262, "pdf_source_start": 280, "pdf_source_end": 287, "words": 64, "search": "read historical gc settings as a rationale the chapter discusses parnew, cms, young-generation sizing, occupancy thresholds, and logging. its flags and suggested values belong to the java versions it used. the useful mechanism is the trade-off between memory turnover, collection frequency, cpu work, and pause duration. this companion does not ask you to copy those flags into a current jvm. understand the memory behavior being tuned before adopting any release-specific setting. hbase environment and daemon configuration {}", "pdf_page": 269}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Three properties establish distributed operation", "body": "The book highlights the ZooKeeper quorum, hbase.rootdir, and hbase.cluster.distributed. Together they tell components where to coordinate, where to persist HBase data, and that the installation is distributed. Other properties then tune behavior. Incorrect basic addresses or mode settings cannot be repaired by changing block size or cache percentages.", "takeaway": "Connectivity, persistence location, and deployment mode come before performance tuning.", "kind": "lesson", "visual": {"type": "code", "text": "<configuration>\n  <property>\n    <name>hbase.cluster.distributed<\/name>\n    <value>true<\/value>\n  <\/property>\n  <!-- Also configure the intended ZooKeeper quorum\n       and HDFS-backed hbase.rootdir. -->\n<\/configuration>", "caption": "Book-era XML structure. This deliberately incomplete sketch is not a runnable production configuration."}, "id": "c0264", "index": 263, "pdf_source_start": 280, "pdf_source_end": 287, "words": 58, "search": "three properties establish distributed operation the book highlights the zookeeper quorum, hbase.rootdir, and hbase.cluster.distributed. together they tell components where to coordinate, where to persist hbase data, and that the installation is distributed. other properties then tune behavior. incorrect basic addresses or mode settings cannot be repaired by changing block size or cache percentages. connectivity, persistence location, and deployment mode come before performance tuning. hbase environment and daemon configuration {\"type\": \"code\", \"text\": \"<configuration>\\n  <property>\\n    <name>hbase.cluster.distributed<\/name>\\n    <value>true<\/value>\\n  <\/property>\\n  <!-- also configure the intended zookeeper quorum\\n       and hdfs-backed hbase.rootdir. -->\\n<\/configuration>\", \"caption\": \"book-era xml structure. this deliberately incomplete sketch is not a runnable production configuration.\"}", "pdf_page": 270}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Client batches spend memory to save round trips", "body": "The source lists scanner caching and the HTable write buffer among the client-side controls. Both can reduce the frequency of remote communication, but they buffer different things. The caller must account for memory and completion behavior rather than assuming that a larger batch is always an improvement. Scan timeouts and delayed flushing remain relevant.", "takeaway": "Batch size is both a transport decision and a memory decision.", "kind": "lesson", "id": "c0265", "index": 264, "pdf_source_start": 280, "pdf_source_end": 287, "words": 65, "search": "client batches spend memory to save round trips the source lists scanner caching and the htable write buffer among the client-side controls. both can reduce the frequency of remote communication, but they buffer different things. the caller must account for memory and completion behavior rather than assuming that a larger batch is always an improvement. scan timeouts and delayed flushing remain relevant. batch size is both a transport decision and a memory decision. hbase environment and daemon configuration {}", "pdf_page": 271}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Flush and file-count limits interact", "body": "A small MemStore threshold can produce frequent flushes and many HFiles. File-count thresholds influence compaction and can eventually block writes while maintenance catches up. These knobs are connected through the write path. Changing only one number without observing the resulting flush and compaction activity can simply move the bottleneck.", "takeaway": "Trace a tuning change through buffer growth, flushes, files, and compactions.", "kind": "lesson", "id": "c0266", "index": 265, "pdf_source_start": 280, "pdf_source_end": 287, "words": 60, "search": "flush and file-count limits interact a small memstore threshold can produce frequent flushes and many hfiles. file-count thresholds influence compaction and can eventually block writes while maintenance catches up. these knobs are connected through the write path. changing only one number without observing the resulting flush and compaction activity can simply move the bottleneck. trace a tuning change through buffer growth, flushes, files, and compactions. hbase environment and daemon configuration {}", "pdf_page": 272}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Global MemStore watermarks bound server use", "body": "The book describes upper and lower limits for combined MemStore usage on a RegionServer. Hitting the upper level triggers flushing toward a lower level. A per-region threshold and a server-wide budget answer different questions. Many regions each using modest memory can still exhaust the aggregate allowance.", "takeaway": "Add up the write buffers; a per-region limit is not a host-wide limit.", "kind": "lesson", "lab": "memory", "lab_snapshot": "Toy heap 8 GiB with 20% cache and 40% MemStore leaves 3.2 GiB for other heap use. A 1,000-row scan at 100 rows per fetch needs about 10 data fetches in the simplified model, excluding setup, limits, retries, and empty final calls.", "id": "c0267", "index": 266, "pdf_source_start": 280, "pdf_source_end": 287, "words": 59, "search": "global memstore watermarks bound server use the book describes upper and lower limits for combined memstore usage on a regionserver. hitting the upper level triggers flushing toward a lower level. a per-region threshold and a server-wide budget answer different questions. many regions each using modest memory can still exhaust the aggregate allowance. add up the write buffers; a per-region limit is not a host-wide limit. hbase environment and daemon configuration {}", "pdf_page": 273}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "More request handlers can overload resources", "body": "Handler count controls how much RPC work can be accepted concurrently in the book's description. Too little concurrency underuses resources; too much can overwhelm CPU, memory, or storage. The setting cannot create additional disk throughput by itself. Observe the whole stack when changing it, not just the number of runnable threads.", "takeaway": "Concurrency limits should match the capacity behind the request handlers.", "kind": "lesson", "id": "c0268", "index": 267, "pdf_source_start": 280, "pdf_source_end": 287, "words": 61, "search": "more request handlers can overload resources handler count controls how much rpc work can be accepted concurrently in the book's description. too little concurrency underuses resources; too much can overwhelm cpu, memory, or storage. the setting cannot create additional disk throughput by itself. observe the whole stack when changing it, not just the number of runnable threads. concurrency limits should match the capacity behind the request handlers. hbase environment and daemon configuration {}", "pdf_page": 274}, {"module": "9", "section": {"name": "HBase environment and daemon configuration", "start": 253, "end": 260}, "title": "Time and namespace settings identify coordination", "body": "ZooKeeper session timeout concerns how long a participant can be silent before its session is considered lost. The znode parent defines the root of this HBase installation's coordination namespace. They solve different problems. Likewise, management UI ports and RPC ports are not interchangeable. Configuration names should be read for their actual role.", "takeaway": "A timeout, an address, and a namespace are three different pieces of configuration.", "kind": "lesson", "id": "c0269", "index": 268, "pdf_source_start": 280, "pdf_source_end": 287, "words": 65, "search": "time and namespace settings identify coordination zookeeper session timeout concerns how long a participant can be silent before its session is considered lost. the znode parent defines the root of this hbase installation's coordination namespace. they solve different problems. likewise, management ui ports and rpc ports are not interchangeable. configuration names should be read for their actual role. a timeout, an address, and a namespace are three different pieces of configuration. hbase environment and daemon configuration {}", "pdf_page": 275}, {"module": "9", "section": {"name": "Hadoop, operating system, and daemon management", "start": 260, "end": 263}, "title": "WAL durability depends on the filesystem contract", "body": "The chapter highlights durable synchronization support in its HDFS generation and warns that an unsuitable configuration can lose data after server failure. Appendix B later gives a simplified acknowledgment account, so do not infer a stronger persistence guarantee from a diagram alone. The source does not fully specify every sync and hardware-failure boundary.", "takeaway": "The meaning of a completed write depends on the underlying synchronization contract.", "kind": "lesson", "id": "c0270", "index": 269, "pdf_source_start": 287, "pdf_source_end": 290, "words": 65, "search": "wal durability depends on the filesystem contract the chapter highlights durable synchronization support in its hdfs generation and warns that an unsuitable configuration can lose data after server failure. appendix b later gives a simplified acknowledgment account, so do not infer a stronger persistence guarantee from a diagram alone. the source does not fully specify every sync and hardware-failure boundary. the meaning of a completed write depends on the underlying synchronization contract. hadoop, operating system, and daemon management {}", "pdf_page": 276}, {"module": "9", "section": {"name": "Hadoop, operating system, and daemon management", "start": 260, "end": 263}, "title": "DataNode connections can be a resource limit", "body": "The book discusses the old dfs.datanode.max.xcievers property as a limit on DataNode communication resources. Under load, too low a limit can surface as I/O exceptions above HDFS. The lesson is that a failure observed by HBase may originate in a dependency's resource limit. The historical property spelling and suggested values should remain release-specific.", "takeaway": "An HBase exception does not prove the bottleneck lives in HBase itself.", "kind": "lesson", "id": "c0271", "index": 270, "pdf_source_start": 287, "pdf_source_end": 290, "words": 65, "search": "datanode connections can be a resource limit the book discusses the old dfs.datanode.max.xcievers property as a limit on datanode communication resources. under load, too low a limit can surface as i/o exceptions above hdfs. the lesson is that a failure observed by hbase may originate in a dependency's resource limit. the historical property spelling and suggested values should remain release-specific. an hbase exception does not prove the bottleneck lives in hbase itself. hadoop, operating system, and daemon management {}", "pdf_page": 277}, {"module": "9", "section": {"name": "Hadoop, operating system, and daemon management", "start": 260, "end": 263}, "title": "Open-file limits matter to a database", "body": "HBase and HDFS use many files and connections. Operating-system limits can therefore become real constraints under load. The chapter also warns about swapping and its effect on latency and membership timeouts. Its shell snippets are examples for the cited environment, not complete current OS-hardening instructions. Observe actual process limits and behavior in the intended environment.", "takeaway": "Host policy can cap a distributed service long before its logical schema limit.", "kind": "lesson", "id": "c0272", "index": 271, "pdf_source_start": 287, "pdf_source_end": 290, "words": 68, "search": "open-file limits matter to a database hbase and hdfs use many files and connections. operating-system limits can therefore become real constraints under load. the chapter also warns about swapping and its effect on latency and membership timeouts. its shell snippets are examples for the cited environment, not complete current os-hardening instructions. observe actual process limits and behavior in the intended environment. host policy can cap a distributed service long before its logical schema limit. hadoop, operating system, and daemon management {}", "pdf_page": 278}, {"module": "9", "section": {"name": "Hadoop, operating system, and daemon management", "start": 260, "end": 263}, "title": "Start the right roles and verify them", "body": "The final deployment step starts Master and RegionServer daemons using the distribution's scripts or centralized tooling. Dependency services must be available. The shell and Master UI provide a first check of which processes and regions are visible. This is deployment verification, not yet a full workload test or a proof of failover behavior.", "takeaway": "Process startup is a milestone; it is not the end of validation.", "kind": "lesson", "id": "c0273", "index": 272, "pdf_source_start": 287, "pdf_source_end": 290, "words": 65, "search": "start the right roles and verify them the final deployment step starts master and regionserver daemons using the distribution's scripts or centralized tooling. dependency services must be available. the shell and master ui provide a first check of which processes and regions are visible. this is deployment verification, not yet a full workload test or a proof of failover behavior. process startup is a milestone; it is not the end of validation. hadoop, operating system, and daemon management {}", "pdf_page": 279}, {"module": "9", "section": {"name": "Chapter recall", "start": 253, "end": 256}, "title": "Recall: configuration layer", "body": "Which file holds the book's JVM heap and collector launch options?", "takeaway": "Environment and JVM startup options are separated from hbase-site.xml properties and family descriptors in the chapter's configuration model.", "kind": "quiz", "choices": ["The twit message qualifier", "hbase-env.sh", "An ordinary users-table row"], "answer": 1, "explanation": "Environment and JVM startup options are separated from hbase-site.xml properties and family descriptors in the chapter's configuration model.", "id": "c0274", "index": 273, "pdf_source_start": 280, "pdf_source_end": 283, "words": 29, "search": "recall: configuration layer which file holds the book's jvm heap and collector launch options? environment and jvm startup options are separated from hbase-site.xml properties and family descriptors in the chapter's configuration model. chapter recall {}", "pdf_page": 280, "answer_page": 396}, {"module": "9", "section": {"name": "Chapter recall", "start": 254, "end": 256}, "title": "Recall: local pause, cluster effect", "body": "Why can a long garbage-collection pause affect region availability?", "takeaway": "The source connects prolonged process pauses with session timeout and the cluster treating a server as unavailable.", "kind": "quiz", "choices": ["The pause automatically deletes every HFile", "Java changes the rowkeys to random values", "The server may fail to maintain its ZooKeeper session"], "answer": 2, "explanation": "The source connects prolonged process pauses with session timeout and the cluster treating a server as unavailable.", "id": "c0275", "index": 274, "pdf_source_start": 281, "pdf_source_end": 283, "words": 26, "search": "recall: local pause, cluster effect why can a long garbage-collection pause affect region availability? the source connects prolonged process pauses with session timeout and the cluster treating a server as unavailable. chapter recall {}", "pdf_page": 281, "answer_page": 397}, {"module": "9", "section": {"name": "Chapter recall", "start": 258, "end": 259}, "title": "Recall: aggregate memory", "body": "Why is a per-region MemStore setting insufficient as the only memory check?", "takeaway": "The chapter distinguishes region-level flush thresholds from server-wide MemStore budgets. Many independent buffers compete for the same heap.", "kind": "quiz", "choices": ["A server may host many regions whose buffers add up", "Each server always has exactly one region", "MemStores use no memory"], "answer": 0, "explanation": "The chapter distinguishes region-level flush thresholds from server-wide MemStore budgets. Many independent buffers compete for the same heap.", "id": "c0276", "index": 275, "pdf_source_start": 285, "pdf_source_end": 286, "words": 30, "search": "recall: aggregate memory why is a per-region memstore setting insufficient as the only memory check? the chapter distinguishes region-level flush thresholds from server-wide memstore budgets. many independent buffers compete for the same heap. chapter recall {}", "pdf_page": 282, "answer_page": 398}, {"module": "9", "section": {"name": "Chapter recall", "start": 246, "end": 249}, "title": "Recall: provisioned machines", "body": "What remains after cloud machines are provisioned?", "takeaway": "The historical cloud discussion explicitly separates obtaining infrastructure from operating the distributed stack on it.", "kind": "quiz", "choices": ["Only changing the book cover", "Database configuration, resource allocation, dependencies, and operations", "Nothing; HBase tuning and recovery are automatic"], "answer": 1, "explanation": "The historical cloud discussion explicitly separates obtaining infrastructure from operating the distributed stack on it.", "id": "c0277", "index": 276, "pdf_source_start": 273, "pdf_source_end": 276, "words": 22, "search": "recall: provisioned machines what remains after cloud machines are provisioned? the historical cloud discussion explicitly separates obtaining infrastructure from operating the distributed stack on it. chapter recall {}", "pdf_page": 283, "answer_page": 399}, {"module": "10", "section": {"name": "Monitoring the cluster and application", "start": 264, "end": 273}, "title": "Build observability during the prototype", "body": "The book recommends installing metrics collection and graphing before production and before performance testing. That lets you connect application actions to MemStore, disk, cache, and request behavior while the system is easier to understand. Waiting until an incident leaves operators to reconstruct a history they never recorded.", "takeaway": "Instrumentation is part of learning the system, not an optional final decoration.", "kind": "lesson", "id": "c0278", "index": 277, "pdf_source_start": 291, "pdf_source_end": 300, "words": 59, "search": "build observability during the prototype the book recommends installing metrics collection and graphing before production and before performance testing. that lets you connect application actions to memstore, disk, cache, and request behavior while the system is easier to understand. waiting until an incident leaves operators to reconstruct a history they never recorded. instrumentation is part of learning the system, not an optional final decoration. monitoring the cluster and application {}", "pdf_page": 284}, {"module": "10", "section": {"name": "Monitoring the cluster and application", "start": 264, "end": 273}, "title": "Collection and graphing are different jobs", "body": "A collection system captures and stores measurements; a graphing layer makes their history understandable. Rollups can summarize older data, while detailed recent data supports diagnosis. The source uses Ganglia and other era-specific tools as examples. The important workflow is to retain enough measurements to recognize changes and explain their timing.", "takeaway": "A pretty graph is only useful when the right measurements were captured.", "kind": "lesson", "id": "c0279", "index": 278, "pdf_source_start": 291, "pdf_source_end": 300, "words": 62, "search": "collection and graphing are different jobs a collection system captures and stores measurements; a graphing layer makes their history understandable. rollups can summarize older data, while detailed recent data supports diagnosis. the source uses ganglia and other era-specific tools as examples. the important workflow is to retain enough measurements to recognize changes and explain their timing. a pretty graph is only useful when the right measurements were captured. monitoring the cluster and application {}", "pdf_page": 285}, {"module": "10", "section": {"name": "Monitoring the cluster and application", "start": 264, "end": 273}, "title": "HBase exposes several metric channels", "body": "The chapter describes the then-current Hadoop metrics framework, contexts for Ganglia or files, and JMX. Different channels change how data is collected, not the underlying need to understand its meaning. File-based recording may support later analysis but can be awkward for active monitoring. Ports and property names shown are historical.", "takeaway": "Metric transport and metric interpretation should not be confused.", "kind": "lesson", "id": "c0280", "index": 279, "pdf_source_start": 291, "pdf_source_end": 300, "words": 59, "search": "hbase exposes several metric channels the chapter describes the then-current hadoop metrics framework, contexts for ganglia or files, and jmx. different channels change how data is collected, not the underlying need to understand its meaning. file-based recording may support later analysis but can be awkward for active monitoring. ports and property names shown are historical. metric transport and metric interpretation should not be confused. monitoring the cluster and application {}", "pdf_page": 286}, {"module": "10", "section": {"name": "Monitoring the cluster and application", "start": 264, "end": 273}, "title": "Watch the dependency layers too", "body": "HBase latency can reflect disks, HDFS, the network, the OS, or the JVM. The chapter specifically lists HDFS throughput and latency, filesystem usage, disk throughput, and per-node network behavior. A symptom at the client can result from a lower-layer queue or resource limit. Monitoring only database counters leaves that chain invisible.", "takeaway": "Trace symptoms down the stack rather than assuming the top layer caused them.", "kind": "lesson", "id": "c0281", "index": 280, "pdf_source_start": 291, "pdf_source_end": 300, "words": 64, "search": "watch the dependency layers too hbase latency can reflect disks, hdfs, the network, the os, or the jvm. the chapter specifically lists hdfs throughput and latency, filesystem usage, disk throughput, and per-node network behavior. a symptom at the client can result from a lower-layer queue or resource limit. monitoring only database counters leaves that chain invisible. trace symptoms down the stack rather than assuming the top layer caused them. monitoring the cluster and application {}", "pdf_page": 287}, {"module": "10", "section": {"name": "Monitoring the cluster and application", "start": 264, "end": 273}, "title": "Write metrics follow the write path", "body": "MemStore growth, flush activity, compaction queues, garbage collection, and HDFS I/O describe different stages of ingestion. A sawtooth buffer pattern can indicate accumulation followed by flushing. The shape still needs to be read with workload and other metrics. A rising compaction queue suggests maintenance is accumulating rather than keeping pace.", "takeaway": "Use several linked write-path signals to explain a slowdown.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Incoming writes", "MemStore / flushes", "HFiles / compactions", "Disk + GC signals"], "caption": "A diagnostic reading order based on the write-path metrics discussed in section 10.1.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y l=\\\"#173344\\\">disk + gc<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">signals<\/text><\/svg>\"}", "pdf_page": 288}, {"module": "10", "section": {"name": "Monitoring the cluster and application", "start": 264, "end": 273}, "title": "Sync latency is a narrower signal", "body": "The source distinguishes fsWriteLatency, which includes HFile and WAL writes, from fsSyncLatency, which concerns WAL synchronization in its metrics model. This distinction helps avoid treating every filesystem latency increase as the same operation. Look at exactly what a metric includes before comparing it with client Put latency.", "takeaway": "A metric's name is not a substitute for its measurement scope.", "kind": "lesson", "id": "c0283", "index": 282, "pdf_source_start": 291, "pdf_source_end": 300, "words": 58, "search": "sync latency is a narrower signal the source distinguishes fswritelatency, which includes hfile and wal writes, from fssynclatency, which concerns wal synchronization in its metrics model. this distinction helps avoid treating every filesystem latency increase as the same operation. look at exactly what a metric includes before comparing it with client put latency. a metric's name is not a substitute for its measurement scope. monitoring the cluster and application {}", "pdf_page": 289}, {"module": "10", "section": {"name": "Monitoring the cluster and application", "start": 264, "end": 273}, "title": "Read metrics focus on useful cached work", "body": "Cache hits, evictions, and size help explain read performance. A large cache alone does not prove that useful blocks remain available: scans can replace frequently used blocks, and a changing working set can lower hit rates. Correlate these signals with the read mix and disk I/O rather than tuning only for the largest cache allocation.", "takeaway": "Cache effectiveness matters more than cache size by itself.", "kind": "lesson", "id": "c0284", "index": 283, "pdf_source_start": 291, "pdf_source_end": 300, "words": 64, "search": "read metrics focus on useful cached work cache hits, evictions, and size help explain read performance. a large cache alone does not prove that useful blocks remain available: scans can replace frequently used blocks, and a changing working set can lower hit rates. correlate these signals with the read mix and disk i/o rather than tuning only for the largest cache allocation. cache effectiveness matters more than cache size by itself. monitoring the cluster and application {}", "pdf_page": 290}, {"module": "10", "section": {"name": "Monitoring the cluster and application", "start": 264, "end": 273}, "title": "Measure what the application experiences", "body": "A cluster dashboard can look healthy while the client experiences poor Get, Put, or Scan latency. The source therefore recommends application-side measurements, per-server visibility, connectivity checks, and network observations. This captures the whole path the user-facing request takes. Server metrics and client metrics explain different parts of the same interaction.", "takeaway": "A healthy daemon graph is not proof of a healthy application request.", "kind": "lesson", "visual": {"type": "table", "headers": ["Signal group", "What to investigate"], "rows": [["Client latency / connectivity", "What the application actually experiences"], ["MemStore / flushes / compactions", "Whether ingestion and maintenance keep pace"], ["Cache hits / evictions", "Whether reads reuse useful blocks"], ["HDFS / disk / network / JVM", "Whether a dependency causes the symptom"]], "caption": "A source-derived monitoring checklist, not a set of universal alarm thresholds."}, "id": "c0285", "index": 284, "pdf_source_start": 291, "pdf_source_end": 300, "words": 62, "search": "measure what the application experiences a cluster dashboard can look healthy while the client experiences poor get, put, or scan latency. the source therefore recommends application-side measurements, per-server visibility, connectivity checks, and network observations. this captures the whole path the user-facing request takes. server metrics and client metrics explain different parts of the same interaction. a healthy daemon graph is not proof of a healthy application request. monitoring the cluster and application {\"type\": \"table\", \"headers\": [\"signal group\", \"what to investigate\"], \"rows\": [[\"client latency / connectivity\", \"what the application actually experiences\"], [\"memstore / flushes / compactions\", \"whether ingestion and maintenance keep pace\"], [\"cache hits / evictions\", \"whether reads reuse useful blocks\"], [\"hdfs / disk / network / jvm\", \"whether a dependency causes the symptom\"]], \"caption\": \"a source-derived monitoring checklist, not a set of universal alarm thresholds.\"}", "pdf_page": 291}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "Benchmark the workload you intend to serve", "body": "The chapter recommends tests that emulate the application's expected operations. A sequential scan benchmark cannot by itself prove performance for random reads mixed with writes. Data size, access distribution, concurrency, and ongoing maintenance change the result. Install monitoring first so the numbers can be explained rather than merely recorded.", "takeaway": "A benchmark result is meaningful only together with its workload and conditions.", "kind": "lesson", "id": "c0286", "index": 285, "pdf_source_start": 300, "pdf_source_end": 310, "words": 61, "search": "benchmark the workload you intend to serve the chapter recommends tests that emulate the application's expected operations. a sequential scan benchmark cannot by itself prove performance for random reads mixed with writes. data size, access distribution, concurrency, and ongoing maintenance change the result. install monitoring first so the numbers can be explained rather than merely recorded. a benchmark result is meaningful only together with its workload and conditions. performance testing and workload-specific tuning {}", "pdf_page": 292}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "PerformanceEvaluation tests specific operations", "body": "The bundled tool can run random or sequential reads and writes and several scan patterns. The source notes that its individual tests do not directly represent every mixed workload. Writing test data first creates the table needed for later reads. The exact command line belongs to the book's release and is not presented here as a current benchmark recipe.", "takeaway": "A convenient built-in test answers a specific question, not every capacity question.", "kind": "lesson", "id": "c0287", "index": 286, "pdf_source_start": 300, "pdf_source_end": 310, "words": 71, "search": "performanceevaluation tests specific operations the bundled tool can run random or sequential reads and writes and several scan patterns. the source notes that its individual tests do not directly represent every mixed workload. writing test data first creates the table needed for later reads. the exact command line belongs to the book's release and is not presented here as a current benchmark recipe. a convenient built-in test answers a specific question, not every capacity question. performance testing and workload-specific tuning {}", "pdf_page": 293}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "YCSB can express a workload mix", "body": "The chapter uses Yahoo! Cloud Serving Benchmark to discuss configurable clients, threads, data distributions, and mixed operations. Its generated workload can be closer to an application's mix than one isolated operation test. It still needs to be configured thoughtfully. A standard tool does not automatically make two tests comparable if their datasets or durability assumptions differ.", "takeaway": "A workload generator is a starting point for a fair experiment.", "kind": "lesson", "id": "c0288", "index": 287, "pdf_source_start": 300, "pdf_source_end": 310, "words": 67, "search": "ycsb can express a workload mix the chapter uses yahoo! cloud serving benchmark to discuss configurable clients, threads, data distributions, and mixed operations. its generated workload can be closer to an application's mix than one isolated operation test. it still needs to be configured thoughtfully. a standard tool does not automatically make two tests comparable if their datasets or durability assumptions differ. a workload generator is a starting point for a fair experiment. performance testing and workload-specific tuning {}", "pdf_page": 294}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "Maintenance state changes performance", "body": "A cluster doing heavy flushing, compaction, or splitting is not in the same state as an otherwise idle cluster. The source includes this in its performance discussion. Measurements should therefore record what else the system is doing. A short quiet-period test may miss exactly the conditions that dominate a sustained ingestion workload.", "takeaway": "Steady-state maintenance is part of the workload, not benchmark noise to ignore.", "kind": "lesson", "id": "c0289", "index": 288, "pdf_source_start": 300, "pdf_source_end": 310, "words": 64, "search": "maintenance state changes performance a cluster doing heavy flushing, compaction, or splitting is not in the same state as an otherwise idle cluster. the source includes this in its performance discussion. measurements should therefore record what else the system is doing. a short quiet-period test may miss exactly the conditions that dominate a sustained ingestion workload. steady-state maintenance is part of the workload, not benchmark noise to ignore. performance testing and workload-specific tuning {}", "pdf_page": 295}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "Random reads favor useful cache and precise access", "body": "For random-read-heavy workloads, the source emphasizes BlockCache, finer block granularity, Bloom filters, and reducing cache pollution. Increasing cache allocation must leave room for other heap consumers. The tuning direction follows the expected access pattern; it is not a universal recommendation for every table sharing the server.", "takeaway": "Improve the probability of finding the required small read without extra disk work.", "kind": "lesson", "id": "c0290", "index": 289, "pdf_source_start": 300, "pdf_source_end": 310, "words": 59, "search": "random reads favor useful cache and precise access for random-read-heavy workloads, the source emphasizes blockcache, finer block granularity, bloom filters, and reducing cache pollution. increasing cache allocation must leave room for other heap consumers. the tuning direction follows the expected access pattern; it is not a universal recommendation for every table sharing the server. improve the probability of finding the required small read without extra disk work. performance testing and workload-specific tuning {}", "pdf_page": 296}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "Long scans have a different cache trade-off", "body": "Large sequential reads may pass through blocks only once. Caching every one can evict blocks valuable to interactive lookups. The book discusses Scan.setCacheBlocks(false) for that case, separately from increasing rows fetched per RPC. Turning off block insertion does not mean eliminating the scanner's network batching.", "takeaway": "Avoid polluting server BlockCache while still batching scan results sensibly.", "kind": "lesson", "visual": {"type": "code", "text": "Scan scan = new Scan(startRow, stopRow);\nscan.setCaching(100);\nscan.setCacheBlocks(false);", "caption": "Book-era scan tuning sketch. 100 is illustrative, not a recommended universal value; range variables must be defined by the application."}, "id": "c0291", "index": 290, "pdf_source_start": 300, "pdf_source_end": 310, "words": 55, "search": "long scans have a different cache trade-off large sequential reads may pass through blocks only once. caching every one can evict blocks valuable to interactive lookups. the book discusses scan.setcacheblocks(false) for that case, separately from increasing rows fetched per rpc. turning off block insertion does not mean eliminating the scanner's network batching. avoid polluting server blockcache while still batching scan results sensibly. performance testing and workload-specific tuning {\"type\": \"code\", \"text\": \"scan scan = new scan(startrow, stoprow);\\nscan.setcaching(100);\\nscan.setcacheblocks(false);\", \"caption\": \"book-era scan tuning sketch. 100 is illustrative, not a recommended universal value; range variables must be defined by the application.\"}", "pdf_page": 297}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "Write-heavy tuning considers downstream files", "body": "Larger write buffers can form fewer, larger flushed files, reducing some compaction pressure. Larger regions can reduce the frequency of splits. But increased memory use, larger maintenance units, and pause behavior introduce other costs. The source repeatedly says to experiment. The write path explains the tuning direction without proving that making every threshold larger is safe.", "takeaway": "Tune the pipeline, not a single buffer in isolation.", "kind": "lesson", "id": "c0292", "index": 291, "pdf_source_start": 300, "pdf_source_end": 310, "words": 65, "search": "write-heavy tuning considers downstream files larger write buffers can form fewer, larger flushed files, reducing some compaction pressure. larger regions can reduce the frequency of splits. but increased memory use, larger maintenance units, and pause behavior introduce other costs. the source repeatedly says to experiment. the write path explains the tuning direction without proving that making every threshold larger is safe. tune the pipeline, not a single buffer in isolation. performance testing and workload-specific tuning {}", "pdf_page": 298}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "Mixed workloads need a compromise", "body": "A cache-heavy configuration and a write-buffer-heavy configuration compete for the same resources. The chapter does not provide a universal mixed-workload recipe. It recommends iterative testing of the relevant settings, including compression, key design, compaction timing, and handler concurrency. Be prepared for an improvement to one operation to worsen another.", "takeaway": "Choose the compromise that meets the application's combined requirements.", "kind": "lesson", "id": "c0293", "index": 292, "pdf_source_start": 300, "pdf_source_end": 310, "words": 58, "search": "mixed workloads need a compromise a cache-heavy configuration and a write-buffer-heavy configuration compete for the same resources. the chapter does not provide a universal mixed-workload recipe. it recommends iterative testing of the relevant settings, including compression, key design, compaction timing, and handler concurrency. be prepared for an improvement to one operation to worsen another. choose the compromise that meets the application's combined requirements. performance testing and workload-specific tuning {}", "pdf_page": 299}, {"module": "10", "section": {"name": "Performance testing and workload-specific tuning", "start": 273, "end": 283}, "title": "Schema can dominate the tuning result", "body": "If the rowkey forces a huge scan or concentrates writes on one range, configuration changes may only hide the problem briefly. The source returns to schema design even in its operations chapter. Performance investigation should therefore include the application's requests and key distribution, not only server flags.", "takeaway": "Do not use configuration to avoid examining a mismatched access path.", "kind": "lesson", "id": "c0294", "index": 293, "pdf_source_start": 300, "pdf_source_end": 310, "words": 58, "search": "schema can dominate the tuning result if the rowkey forces a huge scan or concentrates writes on one range, configuration changes may only hide the problem briefly. the source returns to schema design even in its operations chapter. performance investigation should therefore include the application's requests and key distribution, not only server flags. do not use configuration to avoid examining a mismatched access path. performance testing and workload-specific tuning {}", "pdf_page": 300}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Respect dependency startup and shutdown order", "body": "Start HDFS and ZooKeeper before HBase needs them. Shut HBase down before removing its dependencies. Within that constraint, the book discusses several daemon-management approaches. The reason is straightforward: a serving process cannot initialize or finish cleanly if the coordination or persistence service it needs has already disappeared.", "takeaway": "Stop the dependent service before stopping the services it depends on.", "kind": "lesson", "id": "c0295", "index": 294, "pdf_source_start": 310, "pdf_source_end": 320, "words": 58, "search": "respect dependency startup and shutdown order start hdfs and zookeeper before hbase needs them. shut hbase down before removing its dependencies. within that constraint, the book discusses several daemon-management approaches. the reason is straightforward: a serving process cannot initialize or finish cleanly if the coordination or persistence service it needs has already disappeared. stop the dependent service before stopping the services it depends on. cluster management and everyday tools {}", "pdf_page": 301}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "One daemon, many daemons, or the whole cluster", "body": "The book distinguishes hbase-daemon.sh, its multi-host wrapper, and whole-cluster start/stop scripts. Packaging can also provide init scripts or centralized management. Read the scope of a command before executing it. A command that acts on every server is operationally different from stopping one process on the local host.", "takeaway": "Know the command's blast radius before treating it as routine.", "kind": "lesson", "id": "c0296", "index": 295, "pdf_source_start": 310, "pdf_source_end": 320, "words": 57, "search": "one daemon, many daemons, or the whole cluster the book distinguishes hbase-daemon.sh, its multi-host wrapper, and whole-cluster start/stop scripts. packaging can also provide init scripts or centralized management. read the scope of a command before executing it. a command that acts on every server is operationally different from stopping one process on the local host. know the command's blast radius before treating it as routine. cluster management and everyday tools {}", "pdf_page": 302}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Move regions before planned maintenance", "body": "For a planned stop, the chapter recommends proactively moving a RegionServer's regions elsewhere instead of waiting for failure detection and recovery. The source's graceful-stop sequence disables balancing, moves regions, stops relevant gateways, and stops the RegionServer. This minimizes avoidable disruption, provided the remaining cluster has capacity to serve the load.", "takeaway": "Planned maintenance should use controlled handoff rather than simulate a crash.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Pause balancer", "Move regions", "Stop gateways", "Stop RegionServer"], "caption": "The book's graceful-stop outline. This is a study sequence, not an executable runbook.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Pause balancer<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Move regions<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"397.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Stop gateways<\/text><polyline points=\"467.0,75 483.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M474.8959760788259 78.91468980700107 L483.0 75 L474.8959760788259 71.08531019299893\" fill=\"none\" st
