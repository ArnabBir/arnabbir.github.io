ther than filled with a different system's behavior. learn the book's actual scope, not an imagined complete hbase specification. reading approach {}", "pdf_page": 9}, {"module": "0", "section": {"name": "Reading approach", "start": 1, "end": 1}, "title": "Keep three views separate", "body": "While reading, distinguish the logical data coordinates, the physical storage machinery, and the client API. A row is a logical grouping. A MemStore or HFile participates in storage. Get and Put are commands. Confusion becomes easier to fix when you can name which view a question belongs to.", "takeaway": "Ask: am I discussing the model, the storage, or the API?", "kind": "lesson", "source_label": "About this book, printed pp. xxi-xxiv; edition page; chapter 1, printed p.16. Navigation instructions are companion material.", "id": "c0004", "index": 3, "pdf_source_start": 22, "pdf_source_end": 25, "words": 59, "search": "keep three views separate while reading, distinguish the logical data coordinates, the physical storage machinery, and the client api. a row is a logical grouping. a memstore or hfile participates in storage. get and put are commands. confusion becomes easier to fix when you can name which view a question belongs to. ask: am i discussing the model, the storage, or the api? reading approach {}", "pdf_page": 10}, {"module": "0", "section": {"name": "Reading approach", "start": 1, "end": 1}, "title": "The experiments are safe models", "body": "The HTML experiments use small invented inputs to illustrate the book's rules. They do not contact a cluster, execute shell commands, or provision servers. The PDF gives a static example of each exercise. Code sketches preserve the book-era terminology but are not a tested application bundle. Operational and password examples are for reading, not production execution.", "takeaway": "Changing a simulation is not the same as benchmarking HBase.", "kind": "lesson", "source_label": "About this book, printed pp. xxi-xxiv; edition page; chapter 1, printed p.16. Navigation instructions are companion material.", "id": "c0005", "index": 4, "pdf_source_start": 22, "pdf_source_end": 25, "words": 66, "search": "the experiments are safe models the html experiments use small invented inputs to illustrate the book's rules. they do not contact a cluster, execute shell commands, or provision servers. the pdf gives a static example of each exercise. code sketches preserve the book-era terminology but are not a tested application bundle. operational and password examples are for reading, not production execution. changing a simulation is not the same as benchmarking hbase. reading approach {}", "pdf_page": 11}, {"module": "1", "section": {"name": "Data-management systems and the rise of HBase", "start": 3, "end": 8}, "title": "Begin with storage and retrieval", "body": "At the simplest level, HBase lets an application store a value and retrieve it later. The book describes it as a sparse, distributed, persistent, multidimensional sorted map. Each adjective will become concrete: missing cells need no placeholders, data is spread across machines, and key order can be used for scans. Start with this picture before thinking about cluster processes.", "takeaway": "HBase is an ordered data store, not merely a bag of unrelated key-value pairs.", "kind": "lesson", "id": "c0006", "index": 5, "pdf_source_start": 30, "pdf_source_end": 35, "words": 73, "search": "begin with storage and retrieval at the simplest level, hbase lets an application store a value and retrieve it later. the book describes it as a sparse, distributed, persistent, multidimensional sorted map. each adjective will become concrete: missing cells need no placeholders, data is spread across machines, and key order can be used for scans. start with this picture before thinking about cluster processes. hbase is an ordered data store, not merely a bag of unrelated key-value pairs. data-management systems and the rise of hbase {}", "pdf_page": 12}, {"module": "1", "section": {"name": "Data-management systems and the rise of HBase", "start": 3, "end": 8}, "title": "Not a relational database in disguise", "body": "The book's HBase does not speak SQL, enforce relationships, or offer transactions across arbitrary rows. Values are byte arrays rather than database-enforced typed fields. This changes where work happens: your application chooses encodings, models relationships, and plans access paths. Translating table names alone does not translate a relational design.", "takeaway": "Keep the access requirements; reconsider the relational assumptions.", "kind": "lesson", "id": "c0007", "index": 6, "pdf_source_start": 30, "pdf_source_end": 35, "words": 57, "search": "not a relational database in disguise the book's hbase does not speak sql, enforce relationships, or offer transactions across arbitrary rows. values are byte arrays rather than database-enforced typed fields. this changes where work happens: your application chooses encodings, models relationships, and plans access paths. translating table names alone does not translate a relational design. keep the access requirements; reconsider the relational assumptions. data-management systems and the rise of hbase {\"type\": \"table\", \"headers\": [\"requirement\", \"book's hbase framing\"], \"rows\": [[\"typed fields\", \"values are interpreted by the application\"], [\"sql query planner\", \"plan access through keys and scans\"], [\"relationships\", \"model and maintain them in the application\"], [\"atomicity\", \"reason about the row boundary\"]], \"caption\": \"study comparison based on the cited section.\"}", "visual": {"type": "table", "headers": ["Requirement", "Book's HBase framing"], "rows": [["Typed fields", "Values are interpreted by the application"], ["SQL query planner", "Plan access through keys and scans"], ["Relationships", "Model and maintain them in the application"], ["Atomicity", "Reason about the row boundary"]], "caption": "Study comparison based on the cited section."}, "pdf_page": 13}, {"module": "1", "section": {"name": "Data-management systems and the rise of HBase", "start": 3, "end": 8}, "title": "Scale out rather than only up", "body": "A distributed HBase table can use many machines. Each adds storage, memory, and serving capacity. The client API hides much of that placement work. The book's motivation is to grow the cluster rather than require a single increasingly powerful computer. This flexibility still depends on a schema that spreads the workload effectively.", "takeaway": "More machines help when the work can actually reach them.", "kind": "lesson", "id": "c0008", "index": 7, "pdf_source_start": 30, "pdf_source_end": 35, "words": 62, "search": "scale out rather than only up a distributed hbase table can use many machines. each adds storage, memory, and serving capacity. the client api hides much of that placement work. the book's motivation is to grow the cluster rather than require a single increasingly powerful computer. this flexibility still depends on a schema that spreads the workload effectively. more machines help when the work can actually reach them. data-management systems and the rise of hbase {}", "pdf_page": 14}, {"module": "1", "section": {"name": "Data-management systems and the rise of HBase", "start": 3, "end": 8}, "title": "OLTP asks for an answer now", "body": "Online transaction processing records interactions as they occur and expects a quick response. The book uses purchases, transfers, and social connections as examples of interactions. Here, transaction describes the database workload, not just money. A user-facing request and a nightly analytical job have different latency expectations even when both use the same underlying data.", "takeaway": "Online workloads care about the response the waiting user receives.", "kind": "lesson", "id": "c0009", "index": 8, "pdf_source_start": 30, "pdf_source_end": 35, "words": 64, "search": "oltp asks for an answer now online transaction processing records interactions as they occur and expects a quick response. the book uses purchases, transfers, and social connections as examples of interactions. here, transaction describes the database workload, not just money. a user-facing request and a nightly analytical job have different latency expectations even when both use the same underlying data. online workloads care about the response the waiting user receives. data-management systems and the rise of hbase {}", "pdf_page": 15}, {"module": "1", "section": {"name": "Data-management systems and the rise of HBase", "start": 3, "end": 8}, "title": "OLAP asks broader questions", "body": "Online analytical processing examines accumulated data: totals, reports, trends, and other summaries. The book contrasts recording a connection with analyzing the network of connections. This distinction motivates combining random row access with batch processing. It is not a claim that one technology automatically implements every analytical query efficiently.", "takeaway": "Recording events and analyzing many events are different access patterns.", "kind": "lesson", "id": "c0010", "index": 9, "pdf_source_start": 30, "pdf_source_end": 35, "words": 58, "search": "olap asks broader questions online analytical processing examines accumulated data: totals, reports, trends, and other summaries. the book contrasts recording a connection with analyzing the network of connections. this distinction motivates combining random row access with batch processing. it is not a claim that one technology automatically implements every analytical query efficiently. recording events and analyzing many events are different access patterns. data-management systems and the rise of hbase {}", "pdf_page": 16}, {"module": "1", "section": {"name": "Data-management systems and the rise of HBase", "start": 3, "end": 8}, "title": "Big Data is more than a size label", "body": "The authors frame Big Data around new ways to use varied information to create value, not simply a fixed number of bytes. Behavior logs, incremental observations, and semi-structured records motivate different designs. Their historical argument is that evolving data and larger workloads pushed companies to explore alternatives to traditional database assumptions.", "takeaway": "Start with what you need to do with the data, not a fashionable label.", "kind": "lesson", "id": "c0011", "index": 10, "pdf_source_start": 30, "pdf_source_end": 35, "words": 65, "search": "big data is more than a size label the authors frame big data around new ways to use varied information to create value, not simply a fixed number of bytes. behavior logs, incremental observations, and semi-structured records motivate different designs. their historical argument is that evolving data and larger workloads pushed companies to explore alternatives to traditional database assumptions. start with what you need to do with the data, not a fashionable label. data-management systems and the rise of hbase {}", "pdf_page": 17}, {"module": "1", "section": {"name": "Data-management systems and the rise of HBase", "start": 3, "end": 8}, "title": "The papers behind the stack", "body": "The book traces a lineage from Google's file-system, MapReduce, and Bigtable papers to open-source implementations. Hadoop supplies distributed storage and batch computation; HBase adds a Bigtable-inspired data model and online access. These technologies complement one another. They are not three different names for the same service. The source traces Hadoop through the Nutch web-search project and describes the first experimental HBase code in 2007.", "takeaway": "Separate file storage, distributed computation, and database access.", "kind": "lesson", "visual": {"type": "flow", "labels": ["GFS ideas / HDFS", "MapReduce / batch", "Bigtable ideas / HBase"], "caption": "Historical relationships described by the book; not an implementation identity.", "svg": "<svg xmlns=\"http://www.w3.org/20 ions. hadoop supplies distributed storage and batch computation; hbase adds a bigtable-inspired data model and online access. these technologies complement one another. they are not three different names for the same service. the source traces hadoop through the nutch web-search project and describes the first experimental hbase code in 2007. separate file storage, distributed computation, and database access. data-management systems and the rise of hbase {\"type\": \"flow\", \"labels\": [\"gfs ideas / hdfs\", \"mapreduce / batch\", \"bigtable ideas / hbase\"], \"caption\": \"historical relationships described by the book; not an implementation identity.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"150\\\" viewbox=\\\"0 0 640 150\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"150\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20.0\\\" y=\\\"30\\\" width=\\\"186.66666666666666\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"113.33333333333333\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">gfs ideas / hdfs<\/text><polyline points=\\\"208.66666666666666,75 224.66666666666666,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m216.56264274549255 78.91468980700107 l224.66666666666666 75 l216.56264274549255 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"226.66666666666666\\\" y=\\\"30\\\" width=\\\"186.66666666666666\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"320.0\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">mapreduce / batch<\/text><polyline points=\\\"415.3333333333333,75 431.3333333333333,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\ 19}, {"module": "1", "section": {"name": "Use cases and success stories", "start": 9, "end": 15}, "title": "A web-search storage pattern", "body": "A crawler repeatedly inserts or updates individual web-page records. A MapReduce job scans the corpus to build a search index. A search application then retrieves selected documents for display. Figure 1.1 combines these online and offline access patterns. HBase is the document store in that picture, not the whole search engine.", "takeaway": "One dataset can need both individual updates and broad batch processing.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Crawler updates", "Stored documents", "Batch index build", "Search result fetch"], "caption": "Reconstruction of figure 1.1, printed p.10; search-index queries are distinct from document fetches.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Crawler<\/text><text x=\"87.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">updates<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Stored<\/text><text x=\"242.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">batch index<\/text><text x=\\\"397.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">build<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">search result<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">fetch<\/text><\/svg>\"}", "pdf_page": 20}, {"module": "1", "section": {"name": "Use cases and success stories", "start": 9, "end": 15}, "title": "Incremental measurements accumulate", "body": "Monitoring data arrives over time from many machines. New metrics may appear as software changes. The book introduces OpenTSDB as an application that stores these observations in HBase and makes history queryable. The central question is not merely how to append numbers, but how to retrieve the right metric, time range, and labels later.", "takeaway": "Continuous arrival and historical queries must both shape the table.", "kind": "lesson", "id": "c0015", "index": 14, "pdf_source_start": 36, "pdf_source_end": 42, "words": 64, "search": "incremental measurements accumulate monitoring data arrives over time from many machines. new metrics may appear as software changes. the book introduces opentsdb as an application that stores these observations in hbase and makes history queryable. the central question is not merely how to append numbers, but how to retrieve the right metric, time range, and labels later. continuous arrival and historical queries must both shape the table. use cases and success stories {}", "pdf_page": 21}, {"module": "1", "section": {"name": "Use cases and success stories", "start": 9, "end": 15}, "title": "Counters belong near the event stream", "body": "Likes, clicks, and other interactions often lead to counters. Reading a value, adding one locally, and writing it back introduces a race between clients. The introduction motivates HBase's atomic increment using these workloads. Chapter 2 then explains the operation rather than leaving it as a use-case slogan.", "takeaway": "A counting workload needs a concurrency-aware update operation.", "kind": "lesson", "id": "c0016", "index": 15, "pdf_source_start": 36, "pdf_source_end": 42, "words": 55, "search": "counters belong near the event stream likes, clicks, and other interactions often lead to counters. reading a value, adding one locally, and writing it back introduces a race between clients. the introduction motivates hbase's atomic increment using these workloads. chapter 2 then explains the operation rather than leaving it as a use-case slogan. a counting workload needs a concurrency-aware update operation. use cases and success stories {}", "pdf_page": 22}, {"module": "1", "section": {"name": "Use cases and success stories", "start": 9, "end": 15}, "title": "Telemetry is richer than a counter", "body": "Crash reports and logs can contain many evolving attributes. The book uses Mozilla's Socorro and Trend Micro as historical examples. A sparse model can accommodate new fields while supporting record-level updates and later processing. These are examples of the book's design motivations, not claims about those companies' present infrastructure.", "takeaway": "Flexible records help when the shape of observations changes over time.", "kind": "lesson", "id": "c0017", "index": 16, "pdf_source_start": 36, "pdf_source_end": 42, "words": 60, "search": "telemetry is richer than a counter crash reports and logs can contain many evolving attributes. the book uses mozilla's socorro and trend micro as historical examples. a sparse model can accommodate new fields while supporting record-level updates and later processing. these are examples of the book's design motivations, not claims about those companies' present infrastructure. flexible records help when the shape of observations changes over time. use cases and success stories {}", "pdf_page": 23}, {"module": "1", "section": {"name": "Use cases and success stories", "start": 9, "end": 15}, "title": "Content can be data or a model", "body": "The content-serving examples include documents, shortened-URL mappings, and user profiles used to choose what to show. Some values are returned directly to a person; others feed another application decision. In each case, identify the key used to find the value and the expected response time. The database is one component of the larger product.", "takeaway": "A serving table should match the application's lookup, not just its business nouns.", "kind": "lesson", "id": "c0018", "index": 17, "pdf_source_start": 36, "pdf_source_end": 42, "words": 67, "search": "content can be data or a model the content-serving examples include documents, shortened-url mappings, and user profiles used to choose what to show. some values are returned directly to a person; others feed another application decision. in each case, identify the key used to find the value and the expected response time. the database is one component of the larger product. a serving table should match the application's lookup, not just its business nouns. use cases and success stories {}", "pdf_page": 24}, {"module": "1", "section": {"name": "Use cases and success stories", "start": 9, "end": 15}, "title": "Information exchange needs history", "body": "Messaging combines continuous writes with users asking for previous conversations. The book's historical Facebook example highlights write throughput, large tables, and record-level consistency. The reusable lesson is the coexistence of a stream of new messages and selective access to old ones. The reported company numbers remain historical examples.", "takeaway": "Design for both incoming messages and the history users will request.", "kind": "lesson", "id": "c0019", "index": 18, "pdf_source_start": 36, "pdf_source_end": 42, "words": 59, "search": "information exchange needs history messaging combines continuous writes with users asking for previous conversations. the book's historical facebook example highlights write throughput, large tables, and record-level consistency. the reusable lesson is the coexistence of a stream of new messages and selective access to old ones. the reported company numbers remain historical examples. design for both incoming messages and the history users will request. use cases and success stories {}", "pdf_page": 25}, {"module": "1", "section": {"name": "Hello HBase", "start": 15, "end": 20}, "title": "Three deployment modes", "body": "Standalone runs the HBase components together in one Java process. Pseudo-distributed mode uses multiple processes on one machine. Fully distributed mode spreads services across a cluster. The book develops examples mainly in standalone mode, then teaches deployment later. A successful local experiment does not test the resource contention or failures of a distributed installation.", "takeaway": "Local learning and distributed deployment answer different questions.", "kind": "lesson", "visual": {"type": "table", "headers": ["Mode", "Shape", "Use in the book"], "rows": [["Standalone", "One JVM", "Exploration and development"], ["Pseudo-distributed", "Several JVMs; one host", "Testing component separation"], ["Fully distributed", "Multiple hosts", "Cluster deployment"]], "caption": "Book-era deployment modes, printed p.15."}, "id": "c0020", "index": 19, "pdf_source_start": 42, "pdf_source_end": 47, "words": 62, "search": "three deployment modes standalone runs the hbase components together in one java process. pseudo-distributed mode uses multiple processes on one machine. fully distributed mode spreads services across a cluster. the book develops examples mainly in standalone mode, then teaches deployment later. a successful local experiment does not test the resource contention or failures of a distributed installation. local learning and distributed deployment answer different questions. hello hbase {\"type\": \"table\", \"headers\": [\"mode\", \"shape\", \"use in the book\"], \"rows\": [[\"standalone\", \"one jvm\", \"exploration and development\"], [\"pseudo-distributed\", \"several jvms; one host\", \"testing component separation\"], [\"fully distributed\", \"multiple hosts\", \"cluster deployment\"]], \"caption\": \"book-era deployment modes, printed p.15.\"}", "pdf_page": 26}, {"module": "1", "section": {"name": "Hello HBase", "start": 15, "end": 20}, "title": "Configuration gives the process its environment", "body": "The introductory install sets HBASE_HOME and starts HBase with the bundled script. The book then changes hbase.rootdir away from a temporary location. This illustrates two different concerns: locating program files and selecting where data persists. The exact download URL, Java version, and console port are historical details, not current installation instructions.", "takeaway": "Do not confuse the software directory with the data directory.", "kind": "lesson", "id": "c0021", "index": 20, "pdf_source_start": 42, "pdf_source_end": 47, "words": 61, "search": "configuration gives the process its environment the introductory install sets hbase_home and starts hbase with the bundled script. the book then changes hbase.rootdir away from a temporary location. this illustrates two different concerns: locating program files and selecting where data persists. the exact download url, java version, and console port are historical details, not current installation instructions. do not confuse the software directory with the data directory. hello hbase {}", "pdf_page": 27}, {"module": "1", "section": {"name": "Hello HBase", "start": 15, "end": 20}, "title": "The shell is a client", "body": "The HBase shell is a JRuby application around the Java client API. Interactive mode is useful for inspection; batch mode supports scripting. Asking for list is a simple end-to-end check that the client can communicate with the server. The shell is not direct editing of HFiles.", "takeaway": "A shell command still travels through HBase's client and server machinery.", "kind": "lesson", "id": "c0022", "index": 21, "pdf_source_start": 42, "pdf_source_end": 47, "words": 57, "search": "the shell is a client the hbase shell is a jruby application around the java client api. interactive mode is useful for inspection; batch mode supports scripting. asking for list is a simple end-to-end check that the client can communicate with the server. the shell is not direct editing of hfiles. a shell command still travels through hbase's client and server machinery. hello hbase {}", "pdf_page": 28}, {"module": "1", "section": {"name": "Hello HBase", "start": 15, "end": 20}, "title": "Create a family, then choose qualifiers", "body": "The first example creates mytable with a column family named cf. A later put introduces cf:message without a separate column-definition step. Families are declared in advance; qualifiers can appear as data is written. This is the practical meaning of the flexible schema in the introductory example.", "takeaway": "Flexible qualifiers do not remove the need to declare column families.", "kind": "lesson", "visual": {"type": "code", "text": "create 'mytable', 'cf'\nput 'mytable', 'first', 'cf:message', 'hello HBase'\nget 'mytable', 'first'\nscan 'mytable'", "caption": "Small shell sequence from chapter 1, printed pp.19-20. For an isolated book-era learning environment only."}, "id": "c0023", "index": 22, "pdf_source_start": 42, "pdf_source_end": 47, "words": 57, "search": "create a family, then choose qualifiers the first example creates mytable with a column family named cf. a later put introduces cf:message without a separate column-definition step. families are declared in advance; qualifiers can appear as data is written. this is the practical meaning of the flexible schema in the introductory example. flexible qualifiers do not remove the need to declare column families. hello hbase {\"type\": \"code\", \"text\": \"create 'mytable', 'cf'\\nput 'mytable', 'first', 'cf:message', 'hello hbase'\\nget 'mytable', 'first'\\nscan 'mytable'\", \"caption\": \"small shell sequence from chapter 1, printed pp.19-20. for an isolated book-era learning environment only.\"}", "pdf_page": 29}, {"module": "1", "section": {"name": "Hello HBase", "start": 15, "end": 20}, "title": "Get one row; scan a sequence", "body": "Get uses a rowkey to retrieve one row. Scan can return several rows in key order. With no bounds, the introductory scan reads the entire table. This is a useful first demonstration but a dangerous default to forget when the table grows. Later lessons show how keys and scan bounds reduce the area searched.", "takeaway": "A bare scan is not a selective query.", "kind": "lesson", "id": "c0024", "index": 23, "pdf_source_start": 42, "pdf_source_end": 47, "words": 62, "search": "get one row; scan a sequence get uses a rowkey to retrieve one row. scan can return several rows in key order. with no bounds, the introductory scan reads the entire table. this is a useful first demonstration but a dangerous default to forget when the table grows. later lessons show how keys and scan bounds reduce the area searched. a bare scan is not a selective query. hello hbase {}", "pdf_page": 30}, {"module": "1", "section": {"name": "Hello HBase", "start": 15, "end": 20}, "title": "Versions are stored and requested separately", "body": "In the book's introductory configuration, a family retains three versions, but a normal read returns the newest version unless asked otherwise. The retained-history setting and the read request are separate controls. Seeing only one value does not prove only one version exists. Treat the stated default as a property of the book's release.", "takeaway": "Stored history is not the same as returned history.", "kind": "lesson", "id": "c0025", "index": 24, "pdf_source_start": 42, "pdf_source_end": 47, "words": 62, "search": "versions are stored and requested separately in the book's introductory configuration, a family retains three versions, but a normal read returns the newest version unless asked otherwise. the retained-history setting and the read request are separate controls. seeing only one value does not prove only one version exists. treat the stated default as a property of the book's release. stored history is not the same as returned history. hello hbase {\"type\": \"table\", \"headers\": [\"setting\", \"book example\"], \"rows\": [[\"retain history\", \"family keeps three versions\"], [\"request history\", \"ordinary get returns latest\"], [\"version coordinate\", \"timestamp identifies one value\"]], \"caption\": \"study comparison based on the cited section.\"}", "visual": {"type": "table", "headers": ["Setting", "Book example"], "rows": [["Retain history", "Family keeps three versions"], ["Request history", "Ordinary Get returns latest"], ["Version coordinate", "Timestamp identifies one value"]], "caption": "Study comparison based on the cited section."}, "pdf_page": 31}, {"module": "1", "section": {"name": "Chapter recall", "start": 9, "end": 10}, "title": "Recall: two kinds of work", "body": "Which pairing matches the web-search example?", "takeaway": "The example separates incremental row updates, a batch index-building job, and selective document retrieval. HBase supplies storage, not the entire search product.", "kind": "quiz", "choices": ["Crawler updates individual documents; MapReduce builds an index over many documents", "HBase automatically builds every search index", "A crawler must rewrite the whole table for each page"], "answer": 0, "explanation": "The example separates incremental row updates, a batch index-building job, and selective document retrieval. HBase supplies storage, not the entire search product.", "id": "c0026", "index": 25, "pdf_source_start": 36, "pdf_source_end": 37, "words": 28, "search": "recall: two kinds of work which pairing matches the web-search example? the example separates incremental row updates, a batch index-building job, and selective document retrieval. hbase supplies storage, not the entire search product. chapter recall {}", "pdf_page": 32, "answer_page": 362}, {"module": "1", "section": {"name": "Chapter recall", "start": 18, "end": 19}, "title": "Recall: flexible schema", "body": "What must be named when creating the introductory table?", "takeaway": "The family is declared with the table. Qualifiers and byte-array values are introduced later through writes; that is the flexibility being demonstrated.", "kind": "quiz", "choices": ["Every qualifier and its Java type", "At least one column family", "Every future timestamp"], "answer": 1, "explanation": "The family is declared with the table. Qualifiers and byte-array values are introduced later through writes; that is the flexibility being demonstrated.", "id": "c0027", "index": 26, "pdf_source_start": 45, "pdf_source_end": 46, "words": 31, "search": "recall: flexible schema what must be named when creating the introductory table? the family is declared with the table. qualifiers and byte-array values are introduced later through writes; that is the flexibility being demonstrated. chapter recall {}", "pdf_page": 33, "answer_page": 363}, {"module": "1", "section": {"name": "Chapter recall", "start": 19, "end": 20}, "title": "Recall: retention versus reads", "body": "The family retains three versions. A default Get returns one. Is that contradictory?", "takeaway": "The introductory example explicitly distinguishes retaining versions from returning the latest version by default. A logical history can be larger than a particular response.", "kind": "quiz", "choices": ["Yes; a Get must return all HFiles", "Yes; three retained versions force every Get to return three", "No; retained versions and versions requested by a read are different controls"], "answer": 2, "explanation": "The introductory example explicitly distinguishes retaining versions from returning the latest version by default. A logical history can be larger than a particular response.", "id": "c0028", "index": 27, "pdf_source_start": 46, "pdf_source_end": 47, "words": 37, "search": "recall: retention versus reads the family retains three versions. a default get returns one. is that contradictory? the introductory example explicitly distinguishes retaining versions from returning the latest version by default. a logical history can be larger than a particular response. chapter recall {}", "pdf_page": 34, "answer_page": 364}, {"module": "2", "section": {"name": "Starting from scratch", "start": 21, "end": 25}, "title": "Meet TwitBase", "body": "TwitBase is a deliberately simplified social application. Users maintain profiles, publish short twits, and connect through relationships. The first chapter of implementation focuses on users and twits; relationships arrive later. The authors explicitly say this is a prototype, not a production-ready Twitter replacement. That limitation matters when reading its security and error-handling examples.", "takeaway": "Follow the example to learn HBase, not to copy a finished social platform.", "kind": "lesson", "id": "c0029", "index": 28, "pdf_source_start": 48, "pdf_source_end": 52, "words": 66, "search": "meet twitbase twitbase is a deliberately simplified social application. users maintain profiles, publish short twits, and connect through relationships. the first chapter of implementation focuses on users and twits; relationships arrive later. the authors explicitly say this is a prototype, not a production-ready twitter replacement. that limitation matters when reading its security and error-handling examples. follow the example to learn hbase, not to copy a finished social platform. starting from scratch {}", "pdf_page": 35}, {"module": "2", "section": {"name": "Starting from scratch", "start": 21, "end": 25}, "title": "A username makes a better identifier", "body": "A person's display name is not necessarily unique. The example first considers Mark Twain, then uses TheRealMT as the rowkey and puts the name in a cell. The change separates identity from a descriptive attribute. It also makes later Get requests easy: the application already knows the key it should supply.", "takeaway": "Choose the rowkey from the identifier your application actually uses.", "kind": "lesson", "id": "c0030", "index": 29, "pdf_source_start": 48, "pdf_source_end": 52, "words": 61, "search": "a username makes a better identifier a person's display name is not necessarily unique. the example first considers mark twain, then uses therealmt as the rowkey and puts the name in a cell. the change separates identity from a descriptive attribute. it also makes later get requests easy: the application already knows the key it should supply. choose the rowkey from the identifier your application actually uses. starting from scratch {}", "pdf_page": 36}, {"module": "2", "section": {"name": "Starting from scratch", "start": 21, "end": 25}, "title": "Inspect what the table declares", "body": "Create users with family info, then inspect it with describe. The response contains family-level properties such as versions, compression, block size, and cache settings. A table with very few logical requirements still has physical configuration. Learning to read this output helps connect a schema choice to its storage behavior.", "takeaway": "Describe reveals both the family name and its physical policy.", "kind": "lesson", "id": "c0031", "index": 30, "pdf_source_start": 48, "pdf_source_end": 52, "words": 59, "search": "inspect what the table declares create users with family info, then inspect it with describe. the response contains family-level properties such as versions, compression, block size, and cache settings. a table with very few logical requirements still has physical configuration. learning to read this output helps connect a schema choice to its storage behavior. describe reveals both the family name and its physical policy. starting from scratch {}", "pdf_page": 37}, {"module": "2", "section": {"name": "Starting from scratch", "start": 21, "end": 25}, "title": "The old Java handle and its configuration", "body": "The book opens an HTableInterface through HTable or HTablePool. Configuration can come from classpath files or explicit settings; the ZooKeeper quorum provides the cluster entry point in this architecture. Treat these as names from the book's client API. The lesson is how configuration and a reusable table handle connect application code to the service.", "takeaway": "The handle is an access object; the table's data remains on the server.", "kind": "lesson", "id": "c0032", "index": 31, "pdf_source_start": 48, "pdf_source_end": 52, "words": 67, "search": "the old java handle and its configuration the book opens an htableinterface through htable or htablepool. configuration can come from classpath files or explicit settings; the zookeeper quorum provides the cluster entry point in this architecture. treat these as names from the book's client api. the lesson is how configuration and a reusable table handle connect application code to the service. the handle is an access object; the table's data remains on the server. starting from scratch {}", "pdf_page": 38}, {"module": "2", "section": {"name": "Starting from scratch", "start": 21, "end": 25}, "title": "Borrow, use, and return a table handle", "body": "The book recommends HTablePool because repeatedly constructing table handles has overhead. Closing a borrowed handle returns its resources to the pool. The enclosing application owns the pool and closes it at the appropriate lifecycle boundary. Read this separately from the data model: closing a handle does not delete a table or erase its rows.", "takeaway": "Resource cleanup and database deletion are unrelated operations.", "kind": "lesson", "visual": {"type": "code", "text": "HTableInterface users = pool.getTable(\"users\");\ntry {\n    // Construct and send book-era commands here.\n} finally {\n    users.close();\n}", "caption": "Companion lifecycle sketch using the book-era HTableInterface and HTablePool names. The finally block makes the cleanup intention explicit; not a verbatim listing."}, "id": "c0033", "index": 32, "pdf_source_start": 48, "pdf_source_end": 52, "words": 62, "search": "borrow, use, and return a table handle the book recommends htablepool because repeatedly constructing table handles has overhead. closing a borrowed handle returns its resources to the pool. the enclosing application owns the pool and closes it at the appropriate lifecycle boundary. read this separately from the data model: closing a handle does not delete a table or erase its rows. resource cleanup and database deletion are unrelated operations. starting from scratch {\"type\": \"code\", \"text\": \"htableinterface users = pool.gettable(\\\"users\\\");\\ntry {\\n    // construct and send book-era commands here.\\n} finally {\\n    users.close();\\n}\", \"caption\": \"companion lifecycle sketch using the book-era htableinterface and htablepool names. the finally block makes the cleanup intention explicit; not a verbatim listing.\"}", "pdf_page": 39}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 26}, "title": "Constructing a Put does not send it", "body": "A Put object holds the rowkey and the cells you intend to write. Adding cells only builds the command locally. The network operation occurs when usersTable.put(p) is called. Keeping construction and execution separate makes it easier to understand which line can involve remote work and which line merely prepares data.", "takeaway": "Command construction is not command execution.", "kind": "lesson", "id": "c0034", "index": 33, "pdf_source_start": 52, "pdf_source_end": 53, "words": 56, "search": "constructing a put does not send it a put object holds the rowkey and the cells you intend to write. adding cells only builds the command locally. the network operation occurs when userstable.put(p) is called. keeping construction and execution separate makes it easier to understand which line can involve remote work and which line merely prepares data. command construction is not command execution. data manipulation and storage machinery {\"type\": \"code\", \"text\": \"put put = new put(bytes.tobytes(\\\"therealmt\\\"));\\nput.add(bytes.tobytes(\\\"info\\\"),\\n        bytes.tobytes(\\\"name\\\"),\\n        bytes.tobytes(\\\"mark twain\\\"));\\n// the command is local until sent:\\nuserstable.put(put);\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "Put put = new Put(Bytes.toBytes(\"TheRealMT\"));\nput.add(Bytes.toBytes(\"info\"),\n        Bytes.toBytes(\"name\"),\n        Bytes.toBytes(\"Mark Twain\"));\n// The command is local until sent:\nusersTable.put(put);", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 40}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Bytes are a contract you choose", "body": "HBase stores rowkeys, qualifiers, and values as byte arrays. Bytes.toBytes and matching decode helpers bridge Java values and those arrays. The database does not independently enforce that a value is an email, a long, or a serialized object. The reader must use the same representation chosen by the writer.", "takeaway": "An encoding mismatch is an application error, even when HBase stored the bytes correctly.", "kind": "lesson", "id": "c0035", "index": 34, "pdf_source_start": 52, "pdf_source_end": 59, "words": 63, "search": "bytes are a contract you choose hbase stores rowkeys, qualifiers, and values as byte arrays. bytes.tobytes and matching decode helpers bridge java values and those arrays. the database does not independently enforce that a value is an email, a long, or a serialized object. the reader must use the same representation chosen by the writer. an encoding mismatch is an application error, even when hbase stored the bytes correctly. data manipulation and storage machinery {}", "pdf_page": 41}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "A cell has an address", "body": "Within a table, rowkey, column family, and column qualifier identify a cell. In the users example, [TheRealMT, info, email] identifies the email cell. The family groups related columns; the qualifier selects one field in that family. Different rows can contain different qualifiers, so an absent email is not stored as a mandatory empty slot.", "takeaway": "A cell is addressed by row, family, and qualifier.", "kind": "lesson", "visual": {"type": "coordinates", "caption": "Four coordinates identify a particular stored value: rowkey, family, qualifier, and version. Based on figures 2.4-2.7.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"25\" width=\"135\" height=\"64\" rx=\"10\" fill=\"#E5F2EF\"
