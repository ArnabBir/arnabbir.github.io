ly=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">[p, +inf)<\/text><text x=\\\"535\\\" y=\\\"184\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">regionserver 1<\/text><polyline points=\\\"535,66 535,96\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m531.0853101929989 87.89597607882591 l535 96 l538.9146898070011 87.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><\/svg>\"}", "pdf_page": 86}, {"module": "3", "section": {"name": "Distributed tables and locating regions", "start": 62, "end": 67}, "title": "The Master and the data-serving path", "body": "The book separates cluster administration from ordinary data access. The Master coordinates region management, while clients ultimately communicate with the RegionServer serving their data. Thinking that every Get must be routed through the Master creates the wrong bottleneck model. Metadata discovery is still needed when the client does not know the relevant location.", "takeaway": "The administrative coordinator is not a mandatory proxy for every row read.", "kind": "lesson", "id": "c0081", "index": 80, "pdf_source_start": 89, "pdf_source_end": 94, "words": 65, "search": "the master and the data-serving path the book separates cluster administration from ordinary data access. the master coordinates region management, while clients ultimately communicate with the regionserver serving their data. thinking that every get must be routed through the master creates the wrong bottleneck model. metadata discovery is still needed when the client does not know the relevant location. the administrative coordinator is not a mandatory proxy for every row read. distributed tables and locating regions {}", "pdf_page": 87}, {"module": "3", "section": {"name": "Distributed tables and locating regions", "start": 62, "end": 67}, "title": "The old catalog is a hierarchy", "body": "In the book's architecture, .META. stores region-location information and -ROOT- locates .META. regions. -ROOT- itself has a known discovery path through ZooKeeper and is not split like ordinary tables in this account. Keep the names intact when studying the example; replacing them silently would change the mechanism being taught.", "takeaway": "The catalog tells the client which server owns a requested key range.", "kind": "lesson", "id": "c0082", "index": 81, "pdf_source_start": 89, "pdf_source_end": 94, "words": 61, "search": "the old catalog is a hierarchy in the book's architecture, .meta. stores region-location information and -root- locates .meta. regions. -root- itself has a known discovery path through zookeeper and is not split like ordinary tables in this account. keep the names intact when studying the example; replacing them silently would change the mechanism being taught. the catalog tells the client which server owns a requested key range. distributed tables and locating regions {}", "pdf_page": 88}, {"module": "3", "section": {"name": "Distributed tables and locating regions", "start": 62, "end": 67}, "title": "ZooKeeper starts the lookup", "body": "An uncached client begins from its ZooKeeper configuration, finds -ROOT-, uses it to find the relevant .META. region, and then finds the user region's server. The final Get or Put goes to that RegionServer. This multi-step lookup is the book-era discovery path, not an instruction to perform all those calls by hand in application code.", "takeaway": "The client library performs discovery on the application's behalf.", "kind": "lesson", "visual": {"type": "flow", "labels": ["ZooKeeper", "-ROOT-", ".META.", "User RegionServer"], "caption": "Legacy uncached lookup from chapter 3 and appendix A. These exact catalog names are edition-specific.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">ZooKeeper<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">-ROOT-<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"397.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">.META.<\/text><polyline points=\"467.0,75 483.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M474.8959760788259 78.91468980700107 L483.0 75 L474.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"485.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"552.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">User<\/text><text x=\"552.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">RegionServer<\/text><\/svg>"}, "id": "c0083", "index": 82, "pdf_source_start": 89, "pdf_source_end": 94, "words": 64, "search": "zookeeper starts the lookup an uncached client begins from its zookeeper configuration, finds -root-, uses it to find the relevant .meta. region, and then finds the user region's server. the final get or put goes to that regionserver. this multi-step lookup is the book-era discovery path, not an instruction to perform all those calls by hand in application code. the client library performs discovery on the application's behalf. distributed tables and locating regions {\"type\": \"flow\", \"labels\": [\"zookeeper\", \"-root-\", \".meta.\", \"user regionserver\"], \"caption\": \"legacy uncached lookup from chapter 3 and appendix a. these exact catalog names are edition-specific.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"150\\\" viewbox=\\\"0 0 640 150\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"150\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"87.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">zookeeper<\/text><polyline points=\\\"157.0,75 173.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m164.8959760788259 78.91468980700107 l173.0 75 l164.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"175.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"242.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">-root-<\/text><polyline points=\\\"312.0,75 328.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m319.8959760788259 78.91468980700107 l328.0 75 l319.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"330.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">.meta.<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">user<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">regionserver<\/text><\/svg>\"}", "pdf_page": 89}, {"module": "3", "section": {"name": "Distributed tables and locating regions", "start": 62, "end": 67}, "title": "Caching avoids repeated discovery", "body": "The client library retains region-location information after finding it. Subsequent requests can reuse the location until it becomes stale, for example because a region moved or split. Then the library refreshes what it needs. Distinguish this metadata cache from BlockCache and the scanner's row batches: they cache three different things for three different reasons.", "takeaway": "A region-location cache saves discovery, not user-data reads.", "kind": "lesson", "visual": {"type": "table", "headers": ["Cache-like concept", "Stored information", "Purpose"], "rows": [["Client location cache", "Region to server mapping", "Avoid repeated catalog lookup"], ["Scanner caching", "Fetched result rows", "Amortize RPC calls"], ["BlockCache", "HFile blocks", "Avoid repeated file I/O"]], "caption": "Three distinct mechanisms already introduced by the book."}, "id": "c0084", "index": 83, "pdf_source_start": 89, "pdf_source_end": 94, "words": 62, "search": "caching avoids repeated discovery the client library retains region-location information after finding it. subsequent requests can reuse the location until it becomes stale, for example because a region moved or split. then the library refreshes what it needs. distinguish this metadata cache from blockcache and the scanner's row batches: they cache three different things for three different reasons. a region-location cache saves discovery, not user-data reads. distributed tables and locating regions {\"type\": \"table\", \"headers\": [\"cache-like concept\", \"stored information\", \"purpose\"], \"rows\": [[\"client location cache\", \"region to server mapping\", \"avoid repeated catalog lookup\"], [\"scanner caching\", \"fetched result rows\", \"amortize rpc calls\"], [\"blockcache\", \"hfile blocks\", \"avoid repeated file i/o\"]], \"caption\": \"three distinct mechanisms already introduced by the book.\"}", "pdf_page": 90}, {"module": "3", "section": {"name": "HBase as source, sink, and shared resource", "start": 68, "end": 70}, "title": "Read a table through TableInputFormat", "body": "A MapReduce job can use HBase as its input. TableInputFormat and a configured Scan expose table rows to the job, while TableMapper receives the rowkey and Result. Restricting families or columns avoids pulling unrelated cells into every task. The book connects input work to table regions rather than treating the entire table as one local iterator.", "takeaway": "A distributed table scan needs both a work partition and a read projection.", "kind": "lesson", "id": "c0085", "index": 84, "pdf_source_start": 95, "pdf_source_end": 97, "words": 69, "search": "read a table through tableinputformat a mapreduce job can use hbase as its input. tableinputformat and a configured scan expose table rows to the job, while tablemapper receives the rowkey and result. restricting families or columns avoids pulling unrelated cells into every task. the book connects input work to table regions rather than treating the entire table as one local iterator. a distributed table scan needs both a work partition and a read projection. hbase as source, sink, and shared resource {\"type\": \"code\", \"text\": \"class usermapper extends tablemapper<outkey, outvalue> {\\n    // map(rowkey, result, context) receives table data.\\n    // configure the input scan before running the job.\\n    // outkey and outvalue are application placeholders.\\n}\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "class UserMapper extends TableMapper<OutKey, OutValue> {\n    // map(rowkey, Result, Context) receives table data.\n    // Configure the input Scan before running the job.\n    // OutKey and OutValue are application placeholders.\n}", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 91}, {"module": "3", "section": {"name": "HBase as source, sink, and shared resource", "start": 68, "end": 75}, "title": "Write job output as table mutations", "body": "A job can send Put or Delete commands to HBase through table-output integration. The mutation already carries its destination rowkey. This is different from writing lines to a text file: the output describes changes to table cells. Retrying such output must still be considered in terms of its application effect.", "takeaway": "A table sink receives mutations, not merely printable strings.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Configured Scan", "TableMapper", "Optional shuffle", "Table mutations"], "caption": "HBase source/sink integration. Some jobs are map-only; a reducer is not mandatory.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Configured<\/text><text x=\"87.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Scan<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">TableMapper<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"397.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Optional<\/text><text x=\"397.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">shuffle<\/text><polyline points=\"467.0,75 483.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M474.8959760788259 78.91468980700107 L483.0 75 L474.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"485.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"552.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Table<\/text><text x=\"552.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">mutations<\/text><\/svg>"}, "id": "c0086", "index": 85, "pdf_source_start": 95, "pdf_source_end": 102, "words": 59, "search": "write job output as table mutations a job can send put or delete commands to hbase through table-output integration. the mutation already carries its destination rowkey. this is different from writing lines to a text file: the output describes changes to table cells. retrying such output must still be considered in terms of its application effect. a table sink receives mutations, not merely printable strings. hbase as source, sink, and shared resource {\"type\": \"flow\", \"labels\": [\"configured scan\", \"tablemapper\", \"optional shuffle\", \"table mutations\"], \"caption\": \"hbase source/sink integration. some jobs are map-only; a reducer is not mandatory.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"150\\\" viewbox=\\\"0 0 640 150\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"150\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"87.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">configured<\/text><text x=\\\"87.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">scan<\/text><polyline points=\\\"157.0,75 173.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m164.8959760788259 78.91468980700107 l173.0 75 l164.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"175.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"242.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">tablemapper<\/text><polyline points=\\\"312.0,75 328.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m319.8959760788259 78.91468980700107 l328.0 75 l319.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"330.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">optional<\/text><text x=\\\"397.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">shuffle<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">table<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">mutations<\/text><\/svg>\"}", "pdf_page": 92}, {"module": "3", "section": {"name": "HBase as source, sink, and shared resource", "start": 68, "end": 75}, "title": "A reduce-side join moves data to the join key", "body": "When records from two datasets must be matched, a reduce-side join emits both sides under a common key. The shuffle groups matching records for combination. This is flexible but can transport and sort substantial data. The chapter uses it to show that a join design should include where matching happens and how much data must move.", "takeaway": "A distributed join is also a data-movement choice.", "kind": "lesson", "id": "c0087", "index": 86, "pdf_source_start": 95, "pdf_source_end": 102, "words": 64, "search": "a reduce-side join moves data to the join key when records from two datasets must be matched, a reduce-side join emits both sides under a common key. the shuffle groups matching records for combination. this is flexible but can transport and sort substantial data. the chapter uses it to show that a join design should include where matching happens and how much data must move. a distributed join is also a data-movement choice. hbase as source, sink, and shared resource {}", "pdf_page": 93}, {"module": "3", "section": {"name": "HBase as source, sink, and shared resource", "start": 68, "end": 75}, "title": "A small side can become a lookup", "body": "For some joins, the mapper can keep a smaller dataset in memory or query it from HBase. This avoids shuffling both full datasets, but changes the cost: local memory must hold the data, or remote lookups add load and latency. The choice depends on dataset size and access behavior, not a universal rule that map-side is always better.", "takeaway": "Avoiding a shuffle may exchange it for memory pressure or serving traffic.", "kind": "lesson", "id": "c0088", "index": 87, "pdf_source_start": 95, "pdf_source_end": 102, "words": 70, "search": "a small side can become a lookup for some joins, the mapper can keep a smaller dataset in memory or query it from hbase. this avoids shuffling both full datasets, but changes the cost: local memory must hold the data, or remote lookups add load and latency. the choice depends on dataset size and access behavior, not a universal rule that map-side is always better. avoiding a shuffle may exchange it for memory pressure or serving traffic. hbase as source, sink, and shared resource {}", "pdf_page": 94}, {"module": "3", "section": {"name": "HBase as source, sink, and shared resource", "start": 68, "end": 75}, "title": "Batch work shares real resources", "body": "MapReduce reads from the same RegionServers, files, disks, and networks used by the online application unless those workloads are deliberately separated. A large job can therefore hurt user-facing latency. The book repeatedly recommends planning this coexistence instead of assuming that independent APIs imply independent capacity.", "takeaway": "Separate interfaces do not create separate disk and network budgets.", "kind": "lesson", "id": "c0089", "index": 88, "pdf_source_start": 95, "pdf_source_end": 102, "words": 55, "search": "batch work shares real resources mapreduce reads from the same regionservers, files, disks, and networks used by the online application unless those workloads are deliberately separated. a large job can therefore hurt user-facing latency. the book repeatedly recommends planning this coexistence instead of assuming that independent apis imply independent capacity. separate interfaces do not create separate disk and network budgets. hbase as source, sink, and shared resource {}", "pdf_page": 95}, {"module": "3", "section": {"name": "HBase as source, sink, and shared resource", "start": 68, "end": 75}, "title": "Retries can repeat side effects", "body": "MapReduce may repeat a task after failure or execute speculative work. Repeating an Increment repeats its effect. The chapter warns against using non-idempotent side effects casually inside such jobs. Producing count contributions and reducing them is a different design from directly incrementing a live counter for every attempted record.", "takeaway": "A retryable task must be examined for repeatable side effects.", "kind": "lesson", "id": "c0090", "index": 89, "pdf_source_start": 95, "pdf_source_end": 102, "words": 59, "search": "retries can repeat side effects mapreduce may repeat a task after failure or execute speculative work. repeating an increment repeats its effect. the chapter warns against using non-idempotent side effects casually inside such jobs. producing count contributions and reducing them is a different design from directly incrementing a live counter for every attempted record. a retryable task must be examined for repeatable side effects. hbase as source, sink, and shared resource {}", "pdf_page": 96}, {"module": "3", "section": {"name": "Worked jobs, HDFS, and reliability", "start": 75, "end": 81}, "title": "A map-only job can still be useful", "body": "The CountShakespeare example reads selected user information, checks a condition, and records counts through the framework. It does not need a reducer to write a normal dataset. This is a useful reminder that MapReduce is a framework with optional stages. Do not add a shuffle just because the framework's name contains reduce.", "takeaway": "Use only the stages required by the job's result.", "kind": "lesson", "id": "c0091", "index": 90, "pdf_source_start": 102, "pdf_source_end": 108, "words": 61, "search": "a map-only job can still be useful the countshakespeare example reads selected user information, checks a condition, and records counts through the framework. it does not need a reducer to write a normal dataset. this is a useful reminder that mapreduce is a framework with optional stages. do not add a shuffle just because the framework's name contains reduce. use only the stages required by the job's result. worked jobs, hdfs, and reliability {}", "pdf_page": 97}, {"module": "3", "section": {"name": "Worked jobs, HDFS, and reliability", "start": 75, "end": 81}, "title": "A mutation job can tag matching rows", "body": "The chapter also illustrates a job that identifies matching content and constructs table mutations. Its important boundary is between deciding what a record means and applying the resulting change to a destination row. Review the destination key and retry behavior rather than assuming the output is safe merely because it came from a batch job.", "takeaway": "For a table-writing job, inspect the intended final cells as carefully as the mapper logic.", "kind": "lesson", "id": "c0092", "index": 91, "pdf_source_start": 102, "pdf_source_end": 108, "words": 70, "search": "a mutation job can tag matching rows the chapter also illustrates a job that identifies matching content and constructs table mutations. its important boundary is between deciding what a record means and applying the resulting change to a destination row. review the destination key and retry behavior rather than assuming the output is safe merely because it came from a batch job. for a table-writing job, inspect the intended final cells as carefully as the mapper logic. worked jobs, hdfs, and reliability {}", "pdf_page": 98}, {"module": "3", "section": {"name": "Worked jobs, HDFS, and reliability", "start": 75, "end": 81}, "title": "HDFS makes files available beyond one server", "body": "The RegionServer does not own the only physical copy of its HFiles. HDFS distributes and replicates file blocks, which helps another server access stored data when region assignment changes. HBase manages database regions; HDFS manages file-block storage. Their responsibilities cooperate, but are not identical forms of partitioning.", "takeaway": "Region movement and file replication happen at different layers.", "kind": "lesson", "id": "c0093", "index": 92, "pdf_source_start": 102, "pdf_source_end": 108, "words": 56, "search": "hdfs makes files available beyond one server the regionserver does not own the only physical copy of its hfiles. hdfs distributes and replicates file blocks, which helps another server access stored data when region assignment changes. hbase manages database regions; hdfs manages file-block storage. their responsibilities cooperate, but are not identical forms of partitioning. region movement and file replication happen at different layers. worked jobs, hdfs, and reliability {}", "pdf_page": 99}, {"module": "3", "section": {"name": "Worked jobs, HDFS, and reliability", "start": 75, "end": 81}, "title": "Failure recovery needs surviving storage", "body": "The chapter explains availability through reassignment and recovery using the underlying distributed storage. If a RegionServer goes away, other servers can take over its regions using their persisted state and recovery information. This differs from standalone mode backed only by local files. A successful single-machine demonstration has not exercised that distributed recovery path.", "takeaway": "The storage layer is part of HBase's recovery design.", "kind": "lesson", "id": "c0094", "index": 93, "pdf_source_start": 102, "pdf_source_end": 108, "words": 62, "search": "failure recovery needs surviving storage the chapter explains availability through reassignment and recovery using the underlying distributed storage. if a regionserver goes away, other servers can take over its regions using their persisted state and recovery information. this differs from standalone mode backed only by local files. a successful single-machine demonstration has not exercised that distributed recovery path. the storage layer is part of hbase's recovery design. worked jobs, hdfs, and reliability {}", "pdf_page": 100}, {"module": "3", "section": {"name": "Chapter recall", "start": 56, "end": 60}, "title": "Recall: who gets equal keys", "body": "A mapper emits (Ada,3) on one machine and (Ada,7) on another. What brings those contributions together?", "takeaway": "The intermediate key is used to group Ada's contributions for the reducer. This is why the map-output key matters to the aggregation.", "kind": "quiz", "choices": ["Changing the column family", "BlockCache", "Shuffle/grouping"], "answer": 2, "explanation": "The intermediate key is used to group Ada's contributions for the reducer. This is why the map-output key matters to the aggregation.", "id": "c0095", "index": 94, "pdf_source_start": 83, "pdf_source_end": 87, "words": 38, "search": "recall: who gets equal keys a mapper emits (ada,3) on one machine and (ada,7) on another. what brings those contributions together? the intermediate key is used to group ada's contributions for the reducer. this is why the map-output key matters to the aggregation. chapter recall {}", "pdf_page": 101, "answer_page": 370}, {"module": "3", "section": {"name": "Chapter recall", "start": 64, "end": 67}, "title": "Recall: a stale address", "body": "A region moves after the client cached its location. Which layer handles rediscovery in the book?", "takeaway": "The client library manages catalog discovery and cached region locations. Application code works with table operations rather than maintaining the whole placement map.", "kind": "quiz", "choices": ["The HBase client library", "Every application must edit -ROOT- manually", "The HFile value encoder"], "answer": 0, "explanation": "The client library manages catalog discovery and cached region locations. Application code works with table operations rather than maintaining the whole placement map.", "id": "c0096", "index": 95, "pdf_source_start": 91, "pdf_source_end": 94, "words": 39, "search": "recall: a stale address a region moves after the client cached its location. which layer handles rediscovery in the book? the client library manages catalog discovery and cached region locations. application code works with table operations rather than maintaining the whole placement map. chapter recall {}", "pdf_page": 102, "answer_page": 371}, {"module": "3", "section": {"name": "Chapter recall", "start": 71, "end": 75}, "title": "Recall: duplicated increments", "body": "A task increments a live counter and is executed twice. What is the problem?", "takeaway": "Atomic does not mean idempotent. Each increment can be individually correct while repeated task attempts apply the business effect more than once.", "kind": "quiz", "choices": ["Speculation creates a table-wide transaction", "The second attempt can repeat the increment", "Increment cannot run on a server"], "answer": 1, "explanation": "Atomic does not mean idempotent. Each increment can be individually correct while repeated task attempts apply the business effect more than once.", "id": "c0097", "index": 96, "pdf_source_start": 98, "pdf_source_end": 102, "words": 36, "search": "recall: duplicated increments a task increments a live counter and is executed twice. what is the problem? atomic does not mean idempotent. each increment can be individually correct while repeated task attempts apply the business effect more than once. chapter recall {}", "pdf_page": 103, "answer_page": 372}, {"module": "3", "section": {"name": "Chapter recall", "start": 62, "end": 65}, "title": "Recall: region versus block", "body": "Which pairing is correct?", "takeaway": "The chapter separates the serving partition from the underlying storage unit. Multiple regions can be hosted by a server, and their files are stored through HDFS.", "kind": "quiz", "choices": ["HBase regions are exactly the HDFS blocks", "Every region has its own dedicated physical machine forever", "HBase assigns key-range regions; HDFS stores and replicates file blocks"], "answer": 2, "explanation": "The chapter separates the serving partition from the underlying storage unit. Multiple regions can be hosted by a server, and their files are stored through HDFS.", "id": "c0098", "index": 97, "pdf_source_start": 89, "pdf_source_end": 92, "words": 30, "search": "recall: region versus block which pairing is correct? the chapter separates the serving partition from the underlying storage unit. multiple regions can be hosted by a server, and their files are stored through hdfs. chapter recall {}", "pdf_page": 104, "answer_page": 373}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Model the questions first", "body": "Start by writing the questions the application must answer, then choose the arrangement of rows and cells. HBase does not supply the relational query planner the reader might expect. A design that conveniently records an entity may still require a huge scan for the application's most common request. The chapter's organizing principle is to make those access requirements explicit early.", "takeaway": "The schema should explain how a question reaches a small amount of data.", "kind": "lesson", "id": "c0099", "index": 98, "pdf_source_start": 112, "pdf_source_end": 127, "words": 73, "search": "model the questions first start by writing the questions the application must answer, then choose the arrangement of rows and cells. hbase does not supply the relational query planner the reader might expect. a design that conveniently records an entity may still require a huge scan for the application's most common request. the chapter's organizing principle is to make those access requirements explicit early. the schema should explain how a question reaches a small amount of data. how to approach schema design {}", "pdf_page": 105}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Use the coordinates as design tools", "body": "Rowkey, family, qualifier, and version are not interchangeable labels. The rowkey determines order and region placement. A family affects physical storage and policy. A qualifier identifies a field within the family. A version selects history. Choosing where to encode an attribute decides what the client can address directly and what it must inspect later.", "takeaway": "Ask which coordinate makes the attribute useful to the intended read.", "kind": "lesson", "id": "c0100", "index": 99, "pdf_source_start": 112, "pdf_source_end": 127, "words": 65, "search": "use the coordinates as design tools rowkey, family, qualifier, and version are not interchangeable labels. the rowkey determines order and region placement. a family affects physical storage and policy. a qualifier identifies a field within the family. a version selects history. choosing where to encode an attribute decides what the client can address directly and what it must inspect later. ask which coordinate makes the attribute useful to the intended read. how to approach schema design {}", "pdf_page": 106}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Three questions about following", "body": "TwitBase needs to list the users someone follows, test whether a relationship exists, and find the inverse set of followers. Those are related product features but different lookups. Writing them out reveals that one orientation of the data may make the inverse direction expensive. This is where schema design becomes more than drawing an entity diagram.", "takeaway": "A relationship has a direction; the query may need either direction.", "kind": "lesson", "id": "c0101", "index": 100, "pdf_source_start": 112, "pdf_source_end": 127, "words": 67, "search": "three questions about following twitbase needs to list the users someone follows, test whether a relationship exists, and find the inverse set of followers. those are related product features but different lookups. writing them out reveals that one orientation of the data may make the inverse direction expensive. this is where schema design becomes more than drawing an entity diagram. a relationship has a direction; the query may need either direction. how to approach schema design {}", "pdf_page": 107}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Numbered relationship columns add coordination", "body": "One design stores followed users in numbered columns and maintains a count. Inserting then means finding an available position and updating bookkeeping. Concurrent clients can compete for that position or count. The chapter uses this awkwardness to motivate a simpler representation that uses the followed user's identity directly as the qualifier.", "takeaway": "Do not invent sequence bookkeeping when the relationship already has a useful identifier.", "kind": "lesson", "id": "c0102", "index": 101, "pdf_source_start": 112, "pdf_source_end": 127, "words": 64, "search": "numbered relationship columns add coordination one design stores followed users in numbered columns and maintains a count. inserting then means finding an available position and updating bookkeeping. concurrent clients can compete for that position or count. the chapter uses this awkwardness to motivate a simpler representation that uses the followed user's identity directly as the qualifier. do not invent sequence bookkeeping when the relationship already has a useful identifier. how to approach schema design {}", "pdf_page": 108}, {"module": "4", "section": {"name": "How to approach schema design", "start": 86, "end": 89}, "title": "Put the other user's ID in the qualifier", "body": "A wide-row design uses the follower as the rowkey and each followed user as a qualifier. Testing a relationship becomes a targeted cell lookup; listing the following set becomes a family read. The identifier acts as an address rather than a value hidden behind an arbitrary numbered column. This also removes the need to coordinate a 'next column' counter.", "takeaway": "Qualifiers can carry meaningful identifiers, not only fixed field names.", "kind": "lesson", "id": "c0103", "index": 102, "pdf_source_start": 113, "pdf_source_end": 116, "words": 69, "search": "put the other user's id in the qualifier a wide-row design uses the follower as the rowkey and each followed user as a qualifier. testing a relationship becomes a targeted cell lookup; listing the following set becomes a family read. the identifier acts as an address rather than a value hidden behind an arbitrary numbered column. this also removes the need to coordinate a 'next column' counter. qualifiers can carry meaningful identifiers, not only fixed field names. how to approach schema design {\"type\": \"code\", \"text\": \"// wide relationship representation (pseudocode).\\nrowkey = follower_id\\nfamily = follows\\nqualifier = followed_id\\nvalue = relationship_metadata\\n\\n// exact membership: address this row and qualifier.\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "// Wide relationship representation (pseudocode).\nrowkey = follower_id\nfamily = follows\nqualifier = followed_id\nvalue = relationship_metadata\n\n// Exact membership: address this row and qualifier.", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 109}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "A wide row has a boundary advantage", "body": "Keeping related cells in one row fits HBase's row-atomic operation boundary. It can also put a user's collection together for retrieval. The trade-off is that a growing or very busy collection remains concentrated around that row. The chapter does not claim that every nested collection should be made arbitrarily wide.", "takeaway": "Locality and the row-atomic boundary are benefits, not a license to ignore growth.", "kind": "lesson", "id": "c0104", "index": 103, "pdf_source_start": 112, "pdf_source_end": 127, "words": 63, "search": "a wide row has a boundary advantage keeping related cells in one row fits hbase's row-atomic operation boundary. it can also put a user's collection together for retrieval. the trade-off is that a growing or very busy collection remains concentrated around that row. the chapter does not claim that every nested collection should be made arbitrarily wide. locality and the row-atomic boundary are benefits, not a license to ignore growth. how to approach schema design {}", "pdf_page": 110}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "A tall table makes each relationship a row", "body": "The alternative uses a compound rowkey such as follower plus followed user. One relationship is one row. All relationships for a follower form a prefix range; an exact relationship has an exact compound key. This changes the unit of storage and update. A whole following list no longer becomes one row-atomic mutation merely because its rows share a prefix.", "takeaway": "Moving from wide to tall changes both access shape and atomicity scope.", "kind": "lesson", "visual": {"type": "table", "headers": ["Design", "List following", "Test one relationship", "Atomic grouping"], "rows": [["Wide: follower row, followed qualifier", "Read the row/family", "Read the exact qualifier", "Selected cells of one row"], ["Tall: follower + followed rowkey", "Scan the follower prefix", "Get the compound key", "One relationship row"]], "caption": "Two relationship representations developed in chapter 4; they are not universally interchangeable."}, "id": "c0105", "index": 104, "pdf_source_start": 112, "pdf_source_end": 127, "words": 71, "search": "a tall table makes each relationship a row the alternative uses a compound rowkey such as follower plus followed user. one relationship is one row. all relationships for a follower form a prefix range; an exact relationship has an exact compound key. this changes the unit of storage and update. a whole following list no longer becomes one row-atomic mutation merely because its rows share a prefix. moving from wide to tall changes both access shape and atomicity scope. how to approach schema design {\"type\": \"table\", \"headers\": [\"design\", \"list following\", \"test one relationship\", \"atomic grouping\"], \"rows\": [[\"wide: follower row, followed qualifier\", \"read the row/family\", \"read the exact qualifier\", \"selected cells of one row\"], [\"tall: follower + followed rowkey\", \"scan the follower prefix\", \"get the compound key\", \"one relationship row\"]], \"caption\": \"two relationship representations developed in chapter 4; they are not universally interchangeable.\"}", "pdf_page": 111}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Denormalized fields have maintenance costs", "body": "A relationship row can duplicate information such as display names so a later read avoids another lookup. But changing the original name now has several copies to consider. The chapter treats this as an explicit trade-off, not an oversight. Faster reads may require more writes and a plan for keeping or tolerating redundant values.", "takeaway": "Every duplicate value is also a future update responsibility.", "kind": "lesson", "id": "c0106", "index": 105, "pdf_source_start": 112, "pdf_source_end": 127, "words": 63, "search": "denormalized fields have maintenance costs a relationship row can duplicate information such as display names so a later read avoids another lookup. but changing the original name now has several copies to consider. the chapter treats this as an explicit trade-off, not an oversight. faster reads may require more writes and a plan for keeping or tolerating redundant values. every duplicate value is also a future update responsibility. how to approach schema design {}", "pdf_page": 112}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Distribute the leading part of the key", "body": "Regions divide the ordered rowkey space. A timestamp-first key often sends newly arriving events to the same advancing edge. Even a large cluster can then have a hot serving range. The leading component matters because it decides the broad grouping before later fields are compared. Good total data distribution is not the same as good current write distribution.", "takeaway": "Look at where the next writes go, not only where yesterday's data sits.", "kind": "lesson", "id": "c0107", "index": 106, "pdf_source_start": 112, "pdf_source_end": 127, "words": 71, "search": "distribute the leading part of the key regions divide the ordered rowkey space. a timestamp-first key often sends newly arriving events to the same advancing edge. even a large cluster can then have a hot serving range. the leading component matters because it decides the broad grouping before later fields are compared. good total data distribution is not the same as good current write distribution. look at where the next writes go, not only where yesterday's data sits. how to approach schema design {\"type\": \"hotspot\", \"caption\": \"illustrative timestamp-first writes converge on one key-space edge; user-group prefixes can distribute different users.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><text x=\\\"320\\\" y=\\\"23\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"19\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">timestamp-first: new arrivals share an edge<\/text><rect x=\\\"20\\\" y=\\\"105\\\" width=\\\"135\\\" height=\\\"64\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"87.5\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-siz 537924 94.554021168417\\\" fill=\\\"none\\\" stroke=\\\"#c57130\\\" stroke-width=\\\"2.5\\\"/><text x=\\\"320\\\" y=\\\"210\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">stored data can be spread while current writes remain hot.<\/text><\/svg>\"}", "visual": {"type": "hotspot", "caption": "Illustrative timestamp-first writes converge on one key-space edge; user-group prefixes can distribute different users.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><text x=\"320\" y=\"23\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"19\" font-weight=\"bold\" fill=\"#173344\">Timestamp-first: new arrivals share an edge<\/text><rect x=\"20\" y=\"105\" width=\"135\" height=\"64\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"143.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Range 1<\/text><rect x=\"175\" y=\"105\" width=\"135\" height=\"64\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"143.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Range 2<\/text><rect x=\"330\" y=\"105\" width=\"135\" height=\"64\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"397.5\" y=\"143.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Range 3<\/text><rect x=\"485\" y=\"105\" width=\"135\" height=\"64\" rx=\"10\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><text x=\"552.5\" y=\"143.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Range 4<\/text><polyline points=\"430,45 552,100\" fill=\"none\" stroke=\"#C57130\" stroke-width=\"2.5\"/><path d=\"M543.0031515140295 100.23815398482654 L552 100 L546.2209168731503 93.10056537004951\" fill=\"none\" stroke=\"#C57130\" stroke-width=\"2.5\"/><polyline points=\"480,45 552,100\" fill=\"none\" stroke=\"#C57130\" stroke-width=\"2.5\"/><path d=\"M543.1835924648202 98.19142095178984 L552 100 L547.9363418284471 91.96963996667824\" fill=\"none\" stroke=\"#C57130\" stroke-width=\"2.5\"/><polyline points=\"530,45 552,100\" fill=\"none\" stroke=\"#C57130\" stroke-width=\"2.5\"/><path d=\"M545.3555428368787 93.92948198195194 L552 100 L552.6249393125719 91.02172339167466\" fill=\"none\" stroke=\"#C57130\" stroke-width=\"2.5\"/><polyline points=\"580,45 552,100\" fill=\"none\" stroke=\"#C57130\" stroke-width=\"2.5\"/><path d=\"M552.188031049199 91.00196441857796 L552 100 L559.16528537924 94.554021168417\" fill=\"none\" stroke=\"#C57130\" stroke-width=\"2.5\"/><text x=\"320\" y=\"210\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">Stored data can be spread while current writes remain hot.<\/text><\/svg>"}, "pdf_page": 113}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Hash the grouping field deliberately", "body": "The chapter uses a fixed-width hash of a user to spread user groups across the key space. Appending time preserves useful order within each user group. Hashing the whole composite key instead would hide that grouping from prefix scans. The benefit depends on which part is hashed and which ordering the application still needs.", "takeaway": "Hashing a field and hashing the entire key solve different problems.", "kind": "lesson", "lab": "keys", "lab_snapshot": "Twelve toy events from three users. Time-first appends target the newest range; user-first gives three user groups; a four-bucket salt gives four scan ranges for an unspecific time query. Counts are illustrative, not throughput measurements.", "id": "c0108", "index": 107, "pdf_source_start": 112, "pdf_source_end": 127, "words": 65, "search": "hash the grouping field deliberately the chapter uses a fixed-width hash of a user to spread user groups across the key space. appending time preserves useful order within each user group. hashing the whole composite key instead would hide that grouping from prefix scans. the benefit depends on which part is hashed and which ordering the application still needs. hashing a field and hashing the entire key solve different problems. how to approach schema design {}", "pdf_page": 114}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Target all useful coordinates", "body": "Once the row range is known, restrict families, qualifiers, and relevant versions as well. Each restriction removes data the caller does not need. The chapter emphasizes targeted access because a small final answer can otherwise hide a large read. Good key design and precise projection reinforce one another rather than replace one another.", "takeaway": "A narrow range with an unnecessarily broad projection still does extra work.", "kind": "lesson", "id": "c0109", "index": 108, "pdf_source_start": 112, "pdf_source_end": 127, "words": 65, "search": "target all useful coordinates once the row range is known, restrict families, qualifiers, and relevant versions as well. each restriction removes data the caller does not need. the chapter emphasizes targeted access because a small final answer can otherwise hide a large read. good key design and precise projection reinforce one another rather than replace one another. a narrow range with an unnecessarily broad projection still does extra work. how to approach schema design {}", "pdf_page": 115}, {"module": "4", "section": {"name": "How to approach schema design", "start": 85, "end": 100}, "title": "Coordinates occupy storage too", "body": "HBase's stored key-value records include coordinates, not just the payload. Long repeated rowkeys and qualifiers can become substantial overhead for very small values. The chapter uses this to motivate compact encodings and thoughtful placement of metadata. Shorter names alone are not a complete schema design, but repeated metadata should not be invisible in capacity estimates.", "takeaway": "Estimate the address bytes as well as the value bytes.", "kind": "lesson", "id": "c0110", "index": 109, "pdf_source_start": 112, "pdf_source_end": 127, "words": 65, "search": "coordinates occupy storage too hbase's stored key-value records include coordinates, not just the payload. long repeated rowkeys and qualifiers can become substantial overhead for very small values. the chapter uses this to motivate compact encodings and thoughtful placement of metadata. shorter names alone are not a complete schema design, but repeated metadata should not be invisible in capacity estimates. estimate the address bytes as well as the value bytes. how to approach schema design {}", "pdf_page": 116}, {"module": "4", "section": {"name": "Denormalization and heterogeneous tables", "start": 100, "end": 103}, "title": "Read fan-out or write fan-out?", "body": "A user's timeline can be assembled by reading many followed users at request time. Alternatively, writes can populate a materialized per-user stream so reads are simpler. The latter duplicates work and data when a twit is published. The chapter frames the trade-off around where the application can afford the cost and what read it wants to make fast.", "takeaway": "Materializing a view moves work; it does not make work disappear.", "kind": "lesson", "visual": {"type": "fanout", "caption": "The same feed requirement can spend work at read time or at write time. Reconstruction of the chapter 4 trade-off.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"30\" width=\"178\" height=\"70\" rx=\"10\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><text x=\"109.0\" y=\"71.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">One new twit<\/text><rect x=\"387\" y=\"15\" width=\"233\" height=\"51\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"503.5\" y=\"46.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Feed for Ada<\/text><polyline points=\"199,65 295,65 295,40 385,40\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M376.8959760788259 43.914689807001075 L385 40 L376.8959760788259 36.085310192998925\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"387\" y=\"83\" width=\"233\" height=\"51\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"503.5\" y=\"114.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Feed for Ben<\/text><polyline points=\"199,65 295,65 295,108 385,108\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M376.8959760788259 111.91468980700107 L385 108 L376.8959760788259 104.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"387\" y=\"151\" width=\"233\" height=\"51\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"503.5\" y=\"182.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Feed for Cy<\/text><polyline points=\"199,65 295,65 295,176 385,176\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M376.8959760788259 179.91468980700108 L385 176 L376.8959760788259 172.08531019299892\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><text x=\"145\" y=\"175\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"bold\" fill=\"#173344\">Write-time fan-out<\/text><text x=\"145\" y=\"201\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"14\" font-weight=\"normal\" fill=\"#173344\">versus read-time assembly<\/text><\/svg>"}, "id": "c0111", "index": 110, "pdf_source_start": 127, "pdf_source_end": 130, "words": 69, "search": "read fan-out or write fan-out? a user's timeline can be assembled by reading many followed users at request time. alternatively, writes can populate a materialized per-user stream so reads are simpler. the latter duplicates work and data when a twit is published. the chapter frames the trade-off around where the application can afford the cost and what read it wants to make fast. materializing a view moves work; it does not make work disappear. denormalization and heterogeneous tables {\"type\": \"fanout\", \"caption\": \"the same feed requirement can spend work at read time or at write time. reconstruction of the chapter 4 trade-off.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"30\\\" width=\\\"178\\\" height=\\\"70\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"109.0\\\" y=\\\"71.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">one new twit<\/text><rect x=\\\"387\\\" y=\\\"15\\\" width=\\\"233\\\" height=\\\"51\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"503.5\\\" y=\\\"46.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">feed for ada<\/text><polyline points=\\\"199,65 295,65 295,40 385,40\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m376.8959760788259 43.914689807001075 l385 40 l376.8959760788259 36.085310192998925\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"387\\\" y=\\\"83\\\" width=\\\"233\\\" height=\\\"51\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"503.5\\\" y=\\\"114.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">feed for ben<\/text><polyline points=\\\"199,65 295,65 295,108 385,108\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m376.8959760788259 111.91468980700107 l385 108 l376.8959760788259 104.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"387\\\" y=\\\"151\\\" width=\\\"233\\\" height=\\\"51\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"503.5\\\" y=\\\"182.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">feed for cy<\/text><polyline points=\\\"199,65 295,65 295,176 385,176\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m376.8959760788259 179.91468980700108 l385 176 l376.8959760788259 172.08531019299892\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><text x=\\\"145\\\" y=\\\"175\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">write-time fan-out<\/text><text x=\\\"145\\\" y=\\\"201\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"14\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">versus read-time assembly<\/text><\/svg>\"}", "pdf_page": 117}, {"module": "4", "section": {"name": "Denormalization and heterogeneous tables", "start": 100, "end": 103}, "title": "The inverse relation needs its own access path", "body": "A follower-oriented table makes outgoing relationships easy to find. Discovering everyone who follows a particular user can require scanning far more data. An inverse index reverses the orientation to match that query. Keeping both directions means more writes, and HBase does not automatically turn them into a cross-table transaction.", "takeaway": "A second query direction often deserves a second keyed representation.", "kind": "lesson", "id": "c0112", "index": 111, "pdf_source_start": 127, "pdf_source_end": 130, "words": 59, "search": "the inverse relation needs its own access path a follower-oriented table makes outgoing relationships easy to find. discovering everyone who follows a particular user can require scanning far more data. an inverse index reverses the orientation to match that query. keeping both directions means more writes, and hbase does not automatically turn them into a cross-table transaction. a second query direction often deserves a second keyed representation. denormalization and heterogeneous tables {}", "pdf_page": 118}, {"module": "4", "section": {"name": "Denormalization and heterogeneous tables", "start": 100, "end": 103}, "title": "One table can contain more than one row shape", "body": "The book also explores encoding a record type into the key so different relationship orientations can share a table. A type prefix distinguishes their ranges. This is heterogeneous data in a single table: the logical table need not mean that every row has identical business meaning. The client must still know how to build the right keys.", "takeaway": "Shared storage is safe only when key construction keeps the row types distinguishable.", "kind": "lesson", "id": "c0113", "index": 112, "pdf_source_start": 127, "pdf_source_end": 130, "words": 70, "search": "one table can contain more than one row shape the book also explores encoding a record type into the key so different relationship orientations can share a table. a type prefix distinguishes their ranges. this is heterogeneous data in a single table: the logical table need not mean that every row has identical business meaning. the client must still know how to build the right keys. shared storage is safe only when key construction keeps the row types distinguishable. denormalization and heterogeneous tables {}", "pdf_page": 119}, {"module": "4", "section": {"name": "Rowkey strategies and I/O considerations", "start": 103, "end": 108}, "title": "Salting exchanges locality for parallel access", "body": "A bounded salt prefix spreads writes over several key ranges. Without knowing the salt, a query may need one scan per bucket and then merge results. The chapter presents this as a write-distribution technique with a read cost. Salt count is a design choice tied to the workload, not a free performance multiplier.", "takeaway": "More write destinations can mean more read ranges.", "kind": "lesson", "visual": {"type": "table", "headers": ["Key layout", "Helpful property", "Cost to remember"], "rows": [["User + time", "One user's history together", "A very hot user can still concentrate work"], ["Time + user", "Time-first order", "New writes can converge on the newest range"], ["Salt + time + user", "Several write ranges", "Time queries may fan out over salts"]], "caption": "Conceptual trade-offs from chapter 4; illustrative field names, not a prescribed production schema."}, "id": "c0114", "index": 113, "pdf_source_start": 130, "pdf_source_end": 135, "words": 61, "search": "salting exchanges locality for parallel access a bounded salt prefix spreads writes over several key ranges. without knowing the salt, a query may need one scan per bucket and then merge results. the chapter presents this as a write-distribution technique with a read cost. salt count is a design choice tied to the workload, not a free performance multiplier. more write destinations can mean more read ranges. rowkey strategies and i/o considerations {\"type\": \"table\", \"headers\": [\"key layout\", \"helpful property\", \"cost to remember\"], \"rows\": [[\"user + time\", \"one user's history together\", \"a very hot user can still concentrate work\"], [\"time + user\", \"time-first order\", \"new writes can converge on the newest range\"], [\"salt + time + user\", \"several write ranges\", \"time queries may fan out over salts\"]], \"caption\": \"conceptual trade-offs from chapter 4; illustrative field names, not a prescribed production schema.\"}", "pdf_page": 120}, {"module": "4", "section": {"name": "Rowkey strategies and I/O considerations", "start": 103, "end": 108}, "title": "Field order makes some queries cheap", "body": "A composite key is sorted left to right. Putting user before time makes the user's time history contiguous. Putting another attribute first changes which ranges are contiguous. A later field cannot undo that top-level grouping. Write sample keys in sorted order before committing to a design; the expected scan should become visible in that ordering.", "takeaway": "A compound key is not an unordered set of attributes.", "kind": "lesson", "id": "c0115", "index": 114, "pdf_source_start": 130, "pdf_source_end": 135, "words": 65, "search": "field order makes some queries cheap a composite key is sorted left to right. putting user before time makes the user's time history contiguous. putting another attribute first changes which ranges are contiguous. a later field cannot undo that top-level grouping. write sample keys in sorted order before committing to a design; the expected scan should become visible in that ordering. a compound key is not an unordered set of attributes. rowkey strategies and i/o considerations {}", "pdf_page": 121}, {"module": "4", "section": {"name": "Rowkey strategies and I/O considerations", "start": 103, "end": 108}, "title": "Cardinality affects the shape of load", "body": "An attribute with few distinct values produces a few broad groups; a high-cardinality identifier can produce many groups. But distinct-value count alone says nothing about whether one group dominates traffic. The chapter relates cardinality and rowkey structure to read and write behavior. Examine both the number of groups and the work landing in each.", "takeaway": "Many possible keys do not imply evenly distributed activity.", "kind": "lesson", "id": "c0116", "index": 115, "pdf_source_start": 130, "pdf_source_end": 135, "words": 63, "search": "cardinality affects the shape of load an attribute with few distinct values produces a few broad groups; a high-cardinality identifier can produce many groups. but distinct-value count alone says nothing about whether one group dominates traffic. the chapter relates cardinality and rowkey structure to read and write behavior. examine both the number of groups and the work landing in each. many possible keys do not imply evenly distributed activity. rowkey strategies and i/o considerations {}", "pdf_page": 122}, {"module": "4", "section": {"name": "Rowkey strategies and I/O considerations", "start": 103, "end": 108}, "title": "Write-optimized and read-optimized can conflict", "body": "Grouping records together benefits scans, while scattering them may improve write distribution. Extra copies can reduce lookup work but increase ingestion and maintenance. The chapter's answer is to start from requirements and make the trade-off visible. It does not provide one ideal key for every workload.", "takeaway": "Name which operation a key improves and which operation becomes harder.", "kind": "lesson", "id": "c0117", "index": 116, "pdf_source_start": 130, "pdf_source_end": 135, "words": 57, "search": "write-optimized and read-optimized can conflict grouping records together benefits scans, while scattering them may improve write distribution. extra copies can reduce lookup work but increase ingestion and maintenance. the chapter's answer is to start from requirements and make the trade-off visible. it does not provide one ideal key for every workload. name which operation a key improves and which operation becomes harder. rowkey strategies and i/o considerations {}", "pdf_page": 123}, {"module": "4", "section": {"name": "From relational to non-relational", "start": 108, "end": 113}, "title": "Separate identifying and descriptive attributes", "body": "The migration discussion distinguishes attributes used to identify an entity from those describing it. In HBase, the former often inform rowkey design; the latter become values or meaningful qualifiers depending on access. This is not a mechanical rule. The important question remains whether the application can address the data it needs without a broad search.", "takeaway": "Entity identity is a starting point; access requirements finish the key design.", "kind": "lesson", "id": "c0118", "index": 117, "pdf_source_start": 135, "pdf_source_end": 140, "words": 67, "search": "separate identifying and descriptive attributes the migration discussion distinguishes attributes used to identify an entity from those describing it. in hbase, the former often inform rowkey design; the latter become values or meaningful qualifiers depending on access. this is not a mechanical rule. the important question remains whether the application can address the data it needs without a broad search. entity identity is a starting point; access requirements finish the key design. from relational to non-relational {}", "pdf_page": 124}, {"module": "4", "section": {"name": "From relational to non-relational", "start": 108, "end": 113}, "title": "A blob hides inner fields from HBase", "body": "Serializing an object into one cell can reduce coordinate overhead and simplify whole-object retrieval. But HBase cannot then independently project or mutate its internal fields using normal column operations. Exposing fields as cells gives finer access at the cost of more metadata and application mapping. Pick the representation for how the object is actually read and updated.", "takeaway": "Compact whole-object storage trades away direct field-level operations.", "kind": "lesson", "id": "c0119", "index": 118, "pdf_source_start": 135, "pdf_source_end": 140, "words": 65, "search": "a blob hides inner fields from hbase serializing an object into one cell can reduce coordinate overhead and simplify whole-object retrieval. but hbase cannot then independently project or mutate its internal fields using normal column operations. exposing fields as cells gives finer access at the cost of more metadata and application mapping. pick the representation for how the object is actually read and updated. compact whole-object storage trades away direct field-level operations. from relational to non-relational {\"type\": \"table\", \"headers\": [\"representation\", \"benefit\", \"trade-off\"], \"rows\": [[\"one serialized cell\", \"compact whole-object access\", \"no direct inner-field projection\"], [\"several cells\", \"independent field access\", \"more coordinate metadata\"]], \"caption\": \"study comparison based on the cited section.\"}", "visual": {"type": "table", "headers": ["Representation", "Benefit", "Trade-off"], "rows": [["One serialized cell", "Compact whole-object access", "No direct inner-field projection"], ["Several cells", "Independent field access", "More coordinate metadata"]], "caption": "Study comparison based on the cited section."}, "pdf_page": 125}, {"module": "4", "section": {"name": "From relational to non-relational", "start": 108, "end": 113}, "title": "Nested entities can live under qualifiers", "body": "A parent row can contain a nested collection using qualifiers to identify children or child fields. This can exploit row locality and atomicity. The chapter shows how a limited nested structure fits the model; it does not imply unlimited recursive relational behavior. More complex nesting requires an explicit encoding and access plan.", "takeaway": "A qualifier namespace can model a collection when its boundaries stay understandable.", "kind": "lesson", "id": "c0120", "index": 119, "pdf_source_start": 135, "pdf_source_end": 140, "words": 64, "search": "nested entities can live under qualifiers a parent row can contain a nested collection using qualifiers to identify children or child fields. this can exploit row locality and atomicity. the chapter shows how a limited nested structure fits the model; it does not imply unlimited recursive relational behavior. more complex nesting requires an explicit encoding and access plan. a qualifier namespace can model a collection when its boundaries stay understandable. from relational to non-relational {}", "pdf_page": 126}, {"module": "4", "section": {"name": "From relational to non-relational", "start": 108, "end": 113}, "title": "Some relational features do not map directly", "body": "Foreign-key enforcement, joins, and automatic secondary-index behavior should not be assumed. A many-to-many relationship may need multiple orientations or application lookups. A table with sparse qualifiers is not equivalent to a relational schema with every constraint preserved. Identify each requirement that used to be provided by the relational database.", "takeaway": "Migration includes deciding who now provides the missing behavior.", "kind": "lesson", "id": "c0121", "index": 120, "pdf_source_start": 135, "pdf_source_end": 140, "words": 58, "search": "some relational features do not map directly foreign-key enforcement, joins, and automatic secondary-index behavior should not be assumed. a many-to-many relationship may need multiple orientations or application lookups. a table with sparse qualifiers is not equivalent to a relational schema with every constraint preserved. identify each requirement that used to be provided by the relational database. migration includes deciding who now provides the missing behavior. from relational to non-relational {}", "pdf_page": 127}, {"module": "4", "section": {"name": "Advanced column-family configurations", "start": 113, "end": 117}, "title": "Block size is a workload trade-off", "body": "Random reads can benefit from smaller HFile blocks and a more granular index. Long scans can benefit from fetching more data per block. Smaller blocks increase index size; larger blocks may fetch more unwanted data around a point lookup. The chapter teaches the reason for tuning rather than treating its default as an optimum.", "takeaway": "Tune the access unit according to the shape of reads.", "kind": "lesson", "id": "c0122", "index": 121, "pdf_source_start": 140, "pdf_source_end": 144, "words": 64, "search": "block size is a workload trade-off random reads can benefit from smaller hfile blocks and a more granular index. long scans can benefit from fetching more data per block. smaller blocks increase index size; larger blocks may fetch more unwanted data around a point lookup. the chapter teaches the reason for tuning rather than treating its default as an optimum. tune the access unit according to the shape of reads. advanced column-family configurations {}", "pdf_page": 128}, {"module": "4", "section": {"name": "Advanced column-family configurations", "start": 113, "end": 117}, "title": "BlockCache and aggressive caching", "body": "BLOCKCACHE controls whether a family participates in caching, while IN_MEMORY asks for more aggressive caching behavior in the book. It is not a promise that all family data is permanently pinned in RAM. Large scans can churn useful cached blocks. Interpret the policy in relation to the working set and competing tables.", "takeaway": "A cache preference is not a residency guarantee.", "kind": "lesson", "id": "c0123", "index": 122, "pdf_source_start": 140, "pdf_source_end": 144, "words": 60, "search": "blockcache and aggressive caching blockcache controls whether a family participates in caching, while in_memory asks for more aggressive caching behavior in the book. it is not a promise that all family data is permanently pinned in ram. large scans can churn useful cached blocks. interpret the policy in relation to the working set and competing tables. a cache preference is not a residency guarantee. advanced column-family configurations {}", "pdf_page": 129}, {"module": "4", "section": {"name": "Advanced column-family configurations", "start": 113, "end": 117}, "title": "Bloom filters rule out some files", "body": "A Bloom filter can indicate that a requested row, or row/column combination, is definitely absent from a file. A possible match still needs checking. The book discusses ROW and ROWCOL configurations as ways to avoid unnecessary HFile reads for suitable access patterns. Bloom filters are not complete alternative indexes holding the actual values.", "takeaway": "Definitely absent is useful; maybe present is not an answer.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Candidate HFile", "Bloom check", "Absent: skip", "Maybe: inspect"], "caption": "Conceptual decision path: only a negative membership result rules out the candidate.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Candidate<\/text><text x=\"87.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">HFile<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Bloom check<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.
