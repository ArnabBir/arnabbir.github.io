ue: samuel@clemens.org<\/text><\/svg>"}, "id": "c0036", "index": 35, "pdf_source_start": 52, "pdf_source_end": 59, "words": 63, "search": "a cell has an address within a table, rowkey, column family, and column qualifier identify a cell. in the users example, [therealmt, info, email] identifies the email cell. the family groups related columns; the qualifier selects one field in that family. different rows can contain different qualifiers, so an absent email is not stored as a mandatory empty slot. a cell is addressed by row, family, and qualifier. data manipulation and storage machinery {\"type\": \"coordinates\", \"caption\": \"four coordinates identify a particular stored value: rowkey, family, qualifier, and version. based on figures 2.4-2.7.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"25\\\" width=\\\"135\\\" height=\\\"64\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"87.5\\\" y=\\\"63.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">rowkey<\/text><rect x=\\\"175\\\" y=\\\"25\\\" width=\\\"135\\\" height=\\\"64\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"242.5\\\" y=\\\"63.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">family<\/text><rect x=\\\"330\\\" y=\\\"25\\\" width=\\\"135\\\" height=\\\"64\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"63.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">qualifier<\/text><rect x=\\\"485\\\" y=\\\"25\\\" width=\\\"135\\\" height=\\\"64\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"63.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">version<\/text><text x=\\\"87\\\" y=\\\"116\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">therealmt<\/text><text x=\\\"242\\\" y=\\\"116\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">info<\/text><text x=\\\"397\\\" y=\\\"116\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">email<\/text><text x=\\\"552\\\" y=\\\"116\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">300<\/text><polyline points=\\\"320,131 320,155\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m316.0853101929989 146.8959760788259 l320 155 l323.9146898070011 146.8959760788259\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"110\\\" y=\\\"161\\\" width=\\\"420\\\" height=\\\"49\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"320.0\\\" y=\\\"191.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">value: samuel@clemens.org<\/text><\/svg>\"}", "pdf_page": 42}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 26, "end": 26}, "title": "An update is another Put", "body": "The same Put mechanism inserts a new value or updates an existing cell. HBase does not edit an immutable HFile in place. A later value enters the write path and is reconciled with older state when needed. The application-facing change can be immediate even though the older physical representation still exists until maintenance processes act.", "takeaway": "Logical modification does not require an in-place file edit.", "kind": "lesson", "id": "c0037", "index": 36, "pdf_source_start": 53, "pdf_source_end": 53, "words": 64, "search": "an update is another put the same put mechanism inserts a new value or updates an existing cell. hbase does not edit an immutable hfile in place. a later value enters the write path and is reconciled with older state when needed. the application-facing change can be immediate even though the older physical representation still exists until maintenance processes act. logical modification does not require an in-place file edit. data manipulation and storage machinery {\"type\": \"code\", \"text\": \"put update = new put(bytes.tobytes(\\\"therealmt\\\"));\\nupdate.add(bytes.tobytes(\\\"info\\\"),\\n           bytes.tobytes(\\\"email\\\"),\\n           bytes.tobytes(\\\"new@example.test\\\"));\\nuserstable.put(update);\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "Put update = new Put(Bytes.toBytes(\"TheRealMT\"));\nupdate.add(Bytes.toBytes(\"info\"),\n           Bytes.toBytes(\"email\"),\n           Bytes.toBytes(\"new@example.test\"));\nusersTable.put(update);", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 43}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Two destinations make the write path useful", "body": "The book's default write enters the write-ahead log, or WAL/HLog, and the MemStore. The MemStore provides an in-memory write buffer. The WAL supports recovery if that memory is lost before a flush. The book considers the write complete after the required recording succeeds, not after a fresh HFile is created for every Put.", "takeaway": "The WAL protects the buffered write; the MemStore is not durable by itself.", "kind": "lesson", "visual": {"type": "write", "caption": "Reconstruction of figure 2.1, printed p.27. Acknowledgment belongs to the configured write path; a MemStore flush is a different event.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"76\" width=\"114\" height=\"64\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"77.0\" y=\"114.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Put<\/text><rect x=\"222\" y=\"20\" width=\"185\" height=\"65\" rx=\"10\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><text x=\"314.5\" y=\"58.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">WAL / recovery<\/text><rect x=\"222\" y=\"127\" width=\"185\" height=\"65\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"314.5\" y=\"165.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">MemStore / RAM<\/text><rect x=\"470\" y=\"127\" width=\"150\" height=\"65\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"545.0\" y=\"165.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">New HFile<\/text><polyline points=\"134,100 180,100 180,52 220,52\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M211.8959760788259 55.914689807001075 L220 52 L211.8959760788259 48.085310192998925\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><polyline points=\"134,112 180,112 180,159 220,159\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M211.8959760788259 162.91468980700108 L220 159 L211.8959760788259 155.08531019299892\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><polyline points=\"408,159 469,159\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M460.8959760788259 162.91468980700108 L469 159 L460.8959760788259 155.08531019299892\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><text x=\"440\" y=\"138\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"13\" font-weight=\"normal\" fill=\"#173344\">flush<\/text><text x=\"320\" y=\"221\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">Protected completion is distinct from a later flush.<\/text><\/svg>"}, "lab": "write", "lab_snapshot": "Toy trace: Put A enters WAL and MemStore; flush creates HFile 1; Put B is buffered; a crash loses memory; replay restores B from the WAL. This is not a protocol simulator.", "id": "c0038", "index": 37, "pdf_source_start": 52, "pdf_source_end": 59, "words": 66, "search": "two destinations make the write path useful the book's default write enters the write-ahead log, or wal/hlog, and the memstore. the memstore provides an in-memory write buffer. the wal supports recovery if that memory is lost before a flush. the book considers the write complete after the required recording succeeds, not after a fresh hfile is created for every put. the wal protects the buffered write; the memstore is not durable by itself. data manipulation and storage machinery {\"type\": \"write\", \"caption\": \"reconstruction of figure 2.1, printed p.27. acknowledgment belongs to the configured write path; a memstore flush is a different event.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"76\\\" width=\\\"114\\\" height=\\\"64\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"77.0\\\" y=\\\"114.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">put<\/text><rect x=\\\"222\\\" y=\\\"20\\\" width=\\\"185\\\" height=\\\"65\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"314.5\\\" y=\\\"58.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">wal / recovery<\/text><rect x=\\\"222\\\" y=\\\"127\\\" width=\\\"185\\\" height=\\\"65\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"314.5\\\" y=\\\"165.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">memstore / ram<\/text><rect x=\\\"470\\\" y=\\\"127\\\" width=\\\"150\\\" height=\\\"65\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"545.0\\\" y=\\\"165.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">new hfile<\/text><polyline points=\\\"134,100 180,100 180,52 220,52\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m211.8959760788259 55.914689807001075 l220 52 l211.8959760788259 48.085310192998925\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"134,112 180,112 180,159 220,159\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m211.8959760788259 162.91468980700108 l220 159 l211.8959760788259 155.08531019299892\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"408,159 469,159\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m460.8959760788259 162.91468980700108 l469 159 l460.8959760788259 155.08531019299892\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><text x=\\\"440\\\" y=\\\"138\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"13\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">flush<\/text><text x=\\\"320\\\" y=\\\"221\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">protected completion is distinct from a later flush.<\/text><\/svg>\"}", "pdf_page": 44}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Flush means a new HFile", "body": "When a MemStore is flushed, its contents become a new HFile. Existing HFiles remain immutable. Repeated flushes therefore produce several files for the same region and family, and one logical row can have relevant records in several files. That directly explains why the read path and compaction need to combine information.", "takeaway": "Flush appends another immutable file to the storage picture.", "kind": "lesson", "id": "c0039", "index": 38, "pdf_source_start": 52, "pdf_source_end": 59, "words": 60, "search": "flush means a new hfile when a memstore is flushed, its contents become a new hfile. existing hfiles remain immutable. repeated flushes therefore produce several files for the same region and family, and one logical row can have relevant records in several files. that directly explains why the read path and compaction need to combine information. flush appends another immutable file to the storage picture. data manipulation and storage machinery {}", "pdf_page": 45}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Recovery replays what memory lost", "body": "A server can fail before its latest MemStore contents reach an HFile. The book explains that HBase recovers those edits from the WAL. In its release description, one server WAL is shared across the tables and families it serves. The exact implementation detail is historical; the recovery purpose is the central lesson.", "takeaway": "Unflushed does not mean unrecoverable when the write is protected by the WAL.", "kind": "lesson", "id": "c0040", "index": 39, "pdf_source_start": 52, "pdf_source_end": 59, "words": 65, "search": "recovery replays what memory lost a server can fail before its latest memstore contents reach an hfile. the book explains that hbase recovers those edits from the wal. in its release description, one server wal is shared across the tables and families it serves. the exact implementation detail is historical; the recovery purpose is the central lesson. unflushed does not mean unrecoverable when the write is protected by the wal. data manipulation and storage machinery {}", "pdf_page": 46}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Skipping the WAL changes the risk", "body": "The source shows setWriteToWAL(false) only with a warning: a failure can lose edits that have not reached an HFile. The apparent shortcut removes recovery information, not just redundant overhead. Do not treat it as a harmless performance tweak. Any experiment that disables durability protection is a different workload contract.", "takeaway": "A faster path can be a weaker promise.", "kind": "source-note", "id": "c0041", "index": 40, "pdf_source_start": 52, "pdf_source_end": 59, "words": 57, "search": "skipping the wal changes the risk the source shows setwritetowal(false) only with a warning: a failure can lose edits that have not reached an hfile. the apparent shortcut removes recovery information, not just redundant overhead. do not treat it as a harmless performance tweak. any experiment that disables durability protection is a different workload contract. a faster path can be a weaker promise. data manipulation and storage machinery {}", "pdf_page": 47}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Get can project only the needed data", "body": "A Get begins with a rowkey. addFamily selects a family; addColumn narrows it to a qualifier. Result holds the returned cells, and getValue extracts a selected value for decoding. Restricting the request can avoid transferring irrelevant data. It also documents what the caller actually needs, instead of relying on a growing row's full contents.", "takeaway": "State the smallest useful projection in the request.", "kind": "lesson", "visual": {"type": "code", "text": "Get get = new Get(Bytes.toBytes(\"TheRealMT\"));\nget.addColumn(Bytes.toBytes(\"info\"), Bytes.toBytes(\"email\"));\nResult result = usersTable.get(get);\nbyte[] email = result.getValue(\n    Bytes.toBytes(\"info\"), Bytes.toBytes(\"email\"));", "caption": "Book-era API sketch; shortened for study, not a complete or executed program."}, "id": "c0042", "index": 41, "pdf_source_start": 52, "pdf_source_end": 59, "words": 62, "search": "get can project only the needed data a get begins with a rowkey. addfamily selects a family; addcolumn narrows it to a qualifier. result holds the returned cells, and getvalue extracts a selected value for decoding. restricting the request can avoid transferring irrelevant data. it also documents what the caller actually needs, instead of relying on a growing row's full contents. state the smallest useful projection in the request. data manipulation and storage machinery {\"type\": \"code\", \"text\": \"get get = new get(bytes.tobytes(\\\"therealmt\\\"));\\nget.addcolumn(bytes.tobytes(\\\"info\\\"), bytes.tobytes(\\\"email\\\"));\\nresult result = userstable.get(get);\\nbyte[] email = result.getvalue(\\n    bytes.tobytes(\\\"info\\\"), bytes.tobytes(\\\"email\\\"));\", \"caption\": \"book-era api sketch; shortened for study, not a complete or executed program.\"}", "pdf_page": 48}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "A read reconciles several sources", "body": "The newest useful value may be buffered in the MemStore, while older or other fields reside in HFiles. BlockCache can satisfy file-block reads without disk access. The read path assembles the relevant view; it is not simply 'find the first file containing the row and stop.' Figure 2.2 emphasizes that the result may depend on several storage locations.", "takeaway": "One logical row need not have one physical home inside a region's files.", "kind": "lesson", "visual": {"type": "read", "caption": "Reconstruction of figure 2.2, printed p.29. Cache contents represent file blocks; the result is reconciled with buffered edits.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"15\" width=\"165\" height=\"62\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"102.5\" y=\"52.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">MemStore<\/text><rect x=\"238\" y=\"15\" width=\"165\" height=\"62\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"320.5\" y=\"52.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">BlockCache<\/text><rect x=\"455\" y=\"15\" width=\"165\" height=\"62\" rx=\"10\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><text x=\"537.5\" y=\"52.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">HFiles<\/text><polyline points=\"103,79 103,112 320,112 320,135\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M316.0853101929989 126.89597607882591 L320 135 L323.9146898070011 126.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><polyline points=\"320,79 320,112 320,112 320,135\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M316.0853101929989 126.89597607882591 L320 135 L323.9146898070011 126.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><polyline points=\"537,79 537,112 320,112 320,135\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M316.0853101929989 126.89597607882591 L320 135 L323.9146898070011 126.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"162\" y=\"137\" width=\"316\" height=\"66\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"320.0\" y=\"176.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Reconcile requested row / cells<\/text><\/svg>"}, "id": "c0043", "index": 42, "pdf_source_start": 52, "pdf_source_end": 59, "words": 71, "search": "a read reconciles several sources the newest useful value may be buffered in the memstore, while older or other fields reside in hfiles. blockcache can satisfy file-block reads without disk access. the read path assembles the relevant view; it is not simply 'find the first file containing the row and stop.' figure 2.2 emphasizes that the result may depend on several storage locations. one logical row need not have one physical home inside a region's files. data manipulation and storage machinery {\"type\": \"read\", \"caption\": \"reconstruction of figure 2.2, printed p.29. cache contents represent file blocks; the result is reconciled with buffered edits.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"15\\\" width=\\\"165\\\" height=\\\"62\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"102.5\\\" y=\\\"52.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">memstore<\/text><rect x=\\\"238\\\" y=\\\"15\\\" width=\\\"165\\\" height=\\\"62\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"320.5\\\" y=\\\"52.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">blockcache<\/text><rect x=\\\"455\\\" y=\\\"15\\\" width=\\\"165\\\" height=\\\"62\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"537.5\\\" y=\\\"52.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">hfiles<\/text><polyline points=\\\"103,79 103,112 320,112 320,135\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m316.0853101929989 126.89597607882591 l320 135 l323.9146898070011 126.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"320,79 320,112 320,112 320,135\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m316.0853101929989 126.89597607882591 l320 135 l323.9146898070011 126.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"537,79 537,112 320,112 320,135\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m316.0853101929989 126.89597607882591 l320 135 l323.9146898070011 126.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"162\\\" y=\\\"137\\\" width=\\\"316\\\" height=\\\"66\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"320.0\\\" y=\\\"176.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">reconcile requested row / cells<\/text><\/svg>\"}", "pdf_page": 49}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "HFile blocks and their index", "body": "An HFile contains blocks plus an index locating them. Smaller blocks give finer-grained random access but increase index entries and index memory. Larger blocks can favor sequential reading. The source uses 64 KB as the book-era default. Do not confuse this HFile read unit with the much larger HDFS block discussed later.", "takeaway": "Block size trades access granularity against index overhead.", "kind": "lesson", "id": "c0044", "index": 43, "pdf_source_start": 52, "pdf_source_end": 59, "words": 60, "search": "hfile blocks and their index an hfile contains blocks plus an index locating them. smaller blocks give finer-grained random access but increase index entries and index memory. larger blocks can favor sequential reading. the source uses 64 kb as the book-era default. do not confuse this hfile read unit with the much larger hdfs block discussed later. block size trades access granularity against index overhead. data manipulation and storage machinery {}", "pdf_page": 50}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Delete first changes what reads see", "body": "A Delete writes a tombstone indicating that matching data should no longer be returned. An immutable file is not rewritten immediately to remove the old value. Therefore a successful logical delete and physical disk-space reclamation happen at different points. The book introduces major compaction as the step that reconciles deletions across the full set of relevant files.", "takeaway": "Not visible to Get does not mean already removed from every HFile.", "kind": "lesson", "id": "c0045", "index": 44, "pdf_source_start": 52, "pdf_source_end": 59, "words": 69, "search": "delete first changes what reads see a delete writes a tombstone indicating that matching data should no longer be returned. an immutable file is not rewritten immediately to remove the old value. therefore a successful logical delete and physical disk-space reclamation happen at different points. the book introduces major compaction as the step that reconciles deletions across the full set of relevant files. not visible to get does not mean already removed from every hfile. data manipulation and storage machinery {}", "pdf_page": 51}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Minor compaction combines some files", "body": "A minor compaction selects several HFiles, reads their records, and writes a merged HFile. The new file replaces those inputs. Fewer active files can reduce work for later reads, but producing them itself costs I/O. The book describes selection and maximum-file limits as configurable rather than prescribing a single universal schedule.", "takeaway": "Compaction pays maintenance work to improve the future storage layout.", "kind": "lesson", "id": "c0046", "index": 45, "pdf_source_start": 52, "pdf_source_end": 59, "words": 61, "search": "minor compaction combines some files a minor compaction selects several hfiles, reads their records, and writes a merged hfile. the new file replaces those inputs. fewer active files can reduce work for later reads, but producing them itself costs i/o. the book describes selection and maximum-file limits as configurable rather than prescribing a single universal schedule. compaction pays maintenance work to improve the future storage layout. data manipulation and storage machinery {}", "pdf_page": 52}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 25, "end": 32}, "title": "Major compaction sees the complete set", "body": "The chapter defines a major compaction over all HFiles of a column family in a region. Seeing the complete set lets HBase reconcile a deletion marker with the records it hides. This is more work than merging a few files, so the book cautions against treating major compaction as a cheap, constantly repeated operation.", "takeaway": "Read the compaction scope: one region's family, not an unexplained global rewrite.", "kind": "lesson", "visual": {"type": "compaction", "caption": "Minor compaction combines a selected set; the book defines major compaction by including the complete family-store file set.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"15\" width=\"165\" height=\"54\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"102.5\" y=\"48.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">HFile 1<\/text><rect x=\"237\" y=\"15\" width=\"165\" height=\"54\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"319.5\" y=\"48.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">HFile 2<\/text><rect x=\"454\" y=\"15\" width=\"165\" height=\"54\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"536.5\" y=\"48.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">HFile 3<\/text><polyline points=\"102,72 102,108 320,108 320,135\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M316.0853101929989 126.89597607882591 L320 135 L323.9146898070011 126.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><polyline points=\"320,72 320,108 320,108 320,135\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M316.0853101929989 126.89597607882591 L320 135 L323.9146898070011 126.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><polyline points=\"536,72 536,108 320,108 320,135\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M316.0853101929989 126.89597607882591 L320 135 L323.9146898070011 126.89597607882591\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"178\" y=\"137\" width=\"284\" height=\"61\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"320.0\" y=\"173.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">New merged HFile<\/text><text x=\"320\" y=\"222\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">Replace selected inputs after producing the output.<\/text><\/svg>"}, "id": "c0047", "index": 46, "pdf_source_start": 52, "pdf_source_end": 59, "words": 66, "search": "major compaction sees the complete set the chapter defines a major compaction over all hfiles of a column family in a region. seeing the complete set lets hbase reconcile a deletion marker with the records it hides. this is more work than merging a few files, so the book cautions against treating major compaction as a cheap, constantly repeated operation. read the compaction scope: one region's family, not an unexplained global rewrite. data manipulation and storage machinery {\"type\": \"compaction\", \"caption\": \"minor compaction combines a selected set; the book defines major compaction by including the complete family-store file set.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"15\\\" width=\\\"165\\\" height=\\\"54\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"102.5\\\" y=\\\"48.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">hfile 1<\/text><rect x=\\\"237\\\" y=\\\"15\\\" width=\\\"165\\\" height=\\\"54\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"319.5\\\" y=\\\"48.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">hfile 2<\/text><rect x=\\\"454\\\" y=\\\"15\\\" width=\\\"165\\\" height=\\\"54\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"536.5\\\" y=\\\"48.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">hfile 3<\/text><polyline points=\\\"102,72 102,108 320,108 320,135\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m316.0853101929989 126.89597607882591 l320 135 l323.9146898070011 126.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"320,72 320,108 320,108 320,135\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m316.0853101929989 126.89597607882591 l320 135 l323.9146898070011 126.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><polyline points=\\\"536,72 536,108 320,108 320,135\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m316.0853101929989 126.89597607882591 l320 135 l323.9146898070011 126.89597607882591\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"178\\\" y=\\\"137\\\" width=\\\"284\\\" height=\\\"61\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"320.0\\\" y=\\\"173.5\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">new merged hfile<\/text><text x=\\\"320\\\" y=\\\"222\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">replace selected inputs after producing the output.<\/text><\/svg>\"}", "pdf_page": 53}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 31, "end": 33}, "title": "A timestamp chooses a value version", "body": "Adding a version coordinate identifies a particular value in a cell's history. If an explicit timestamp is omitted, the book uses the receiving server's current millisecond time. The number retained is configured by family. This makes clock handling and retention policy relevant to application behavior, not just operational housekeeping.", "takeaway": "The timestamp is part of the stored value's address.", "kind": "lesson", "id": "c0048", "index": 47, "pdf_source_start": 58, "pdf_source_end": 60, "words": 58, "search": "a timestamp chooses a value version adding a version coordinate identifies a particular value in a cell's history. if an explicit timestamp is omitted, the book uses the receiving server's current millisecond time. the number retained is configured by family. this makes clock handling and retention policy relevant to application behavior, not just operational housekeeping. the timestamp is part of the stored value's address. data manipulation and storage machinery {\"type\": \"code\", \"text\": \"// read-selection is separate from family retention.\\nget get = new get(bytes.tobytes(\\\"therealmt\\\"));\\nget.addcolumn(bytes.tobytes(\\\"info\\\"),\\n              bytes.tobytes(\\\"email\\\"));\\nget.setmaxversions(3);\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "// Read-selection is separate from family retention.\nGet get = new Get(Bytes.toBytes(\"TheRealMT\"));\nget.addColumn(Bytes.toBytes(\"info\"),\n              Bytes.toBytes(\"email\"));\nget.setMaxVersions(3);", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 54}, {"module": "2", "section": {"name": "Data manipulation and storage machinery", "start": 30, "end": 32}, "title": "One version or multiple versions to delete?", "body": "The old API distinguishes deleteColumn from deleteColumns. The singular operation targets a version; the plural operation covers versions according to its timestamp semantics. Their similar spellings make a code review easy to misread. The chapter's prose is not a substitute for the exact overload contract, especially at timestamp boundaries.", "takeaway": "Read the method name and timestamp argument together.", "kind": "lesson", "id": "c0049", "index": 48, "pdf_source_start": 57, "pdf_source_end": 59, "words": 57, "search": "one version or multiple versions to delete? the old api distinguishes deletecolumn from deletecolumns. the singular operation targets a version; the plural operation covers versions according to its timestamp semantics. their similar spellings make a code review easy to misread. the chapter's prose is not a substitute for the exact overload contract, especially at timestamp boundaries. read the method name and timestamp argument together. data manipulation and storage machinery {\"type\": \"code\", \"text\": \"// compare names carefully; do not execute as a recipe.\\ndelete d = new delete(row);\\n// d.deletecolumn(family, qualifier, timestamp);\\n// d.deletecolumns(family, qualifier, timestamp);\\n// singular and plural have different version scope.\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "// Compare names carefully; do not execute as a recipe.\nDelete d = new Delete(row);\n// d.deleteColumn(family, qualifier, timestamp);\n// d.deleteColumns(family, qualifier, timestamp);\n// Singular and plural have different version scope.", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 55}, {"module": "2", "section": {"name": "Data coordinates and application structure", "start": 33, "end": 42}, "title": "A sorted map of maps", "body": "The logical model can be imagined as rowkey to families, family to qualifiers, and qualifier to versions and values. The book orders rowkeys and qualifiers ascending and version timestamps descending. Thus a scan can exploit row order, while a cell's recent history is encountered before older history. This nested-map view explains the coordinates without pretending they are stored as Java Maps.", "takeaway": "A useful mental model is not a literal on-disk object layout.", "kind": "lesson", "visual": {"type": "code", "text": "Map<RowKey, Map<Family, Map<Qualifier, Map<Version, Value>>>>", "caption": "Logical model from printed p.40. The version map is newest first; this expression is a teaching model, not a runtime storage implementation."}, "lab": "versions", "lab_snapshot": "Toy email history at timestamps 300, 200, 100. Requesting one returns the value at 300; requesting three returns all three, newest first. Retention and read selection are separate.", "id": "c0050", "index": 49, "pdf_source_start": 60, "pdf_source_end": 69, "words": 72, "search": "a sorted map of maps the logical model can be imagined as rowkey to families, family to qualifiers, and qualifier to versions and values. the book orders rowkeys and qualifiers ascending and version timestamps descending. thus a scan can exploit row order, while a cell's recent history is encountered before older history. this nested-map view explains the coordinates without pretending they are stored as java maps. a useful mental model is not a literal on-disk object layout. data coordinates and application structure {\"type\": \"code\", \"text\": \"map<rowkey, map<family, map<qualifier, map<version, value>>>>\", \"caption\": \"logical model from printed p.40. the version map is newest first; this expression is a teaching model, not a runtime storage implementation.\"}", "pdf_page": 56}, {"module": "2", "section": {"name": "Data coordinates and application structure", "start": 33, "end": 42}, "title": "Fewer coordinates can select more cells", "body": "An exact cell and version selects a narrow location. Omitting the qualifier broadens the request to a family; omitting the family can broaden it to the row. Figure 2.6 uses nested maps to show these relationships. Actual returned versions still depend on read settings, so the diagram is not an instruction that every ordinary Get returns all retained history.", "takeaway": "Logical scope and read options both shape a response.", "kind": "lesson", "id": "c0051", "index": 50, "pdf_source_start": 60, "pdf_source_end": 69, "words": 68, "search": "fewer coordinates can select more cells an exact cell and version selects a narrow location. omitting the qualifier broadens the request to a family; omitting the family can broaden it to the row. figure 2.6 uses nested maps to show these relationships. actual returned versions still depend on read settings, so the diagram is not an instruction that every ordinary get returns all retained history. logical scope and read options both shape a response. data coordinates and application structure {}", "pdf_page": 57}, {"module": "2", "section": {"name": "Data coordinates and application structure", "start": 33, "end": 42}, "title": "Families separate physical files", "body": "Each family has its own HFile set within a region. A row with data in two families contributes records to both sets. Within those files, each qualifier/version has its own key-value record. Missing fields need no placeholder records. These facts explain both the value of sparsity and why a family choice has physical consequences.", "takeaway": "A column family is more than a cosmetic prefix on a field name.", "kind": "lesson", "id": "c0052", "index": 51, "pdf_source_start": 60, "pdf_source_end": 69, "words": 67, "search": "families separate physical files each family has its own hfile set within a region. a row with data in two families contributes records to both sets. within those files, each qualifier/version has its own key-value record. missing fields need no placeholder records. these facts explain both the value of sparsity and why a family choice has physical consequences. a column family is more than a cosmetic prefix on a field name. data coordinates and application structure {}", "pdf_page": 58}, {"module": "2", "section": {"name": "Data coordinates and application structure", "start": 33, "end": 42}, "title": "UsersDAO separates storage from the model", "body": "The book wraps HBase details in UsersDAO: byte-array constants, Get/Put/Delete construction, and conversion from Result to a User. The calling environment supplies the pool. UsersTool then handles command-line interaction. This layering lets you understand the user-facing operation without re-reading the byte conversion and command setup every time.", "takeaway": "Keep application meaning and storage plumbing understandable separately.", "kind": "lesson", "visual": {"type": "flow", "labels": ["UsersTool", "UsersDAO", "HBase commands", "Result to User"], "caption": "The chapter 2 application structure. Return data is converted back through the DAO.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">UsersTool<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">UsersDAO<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"3 art": 33, "end": 42}, "title": "Read the cleanup path, not just the happy path", "body": "In the printed getUser example, the empty-result branch returns before the later close call. The intended pool lifecycle is still clear from the surrounding discussion, but the listing does not visibly close that borrowed handle on every path. This companion calls out the gap rather than presenting the entire listing as a tested production DAO.", "takeaway": "A source example can explain a design while still leaving an error path incomplete.", "kind": "source-note", "id": "c0054", "index": 53, "pdf_source_start": 60, "pdf_source_end": 69, "words": 69, "search": "read the cleanup path, not just the happy path in the printed getuser example, the empty-result branch returns before the later close call. the intended pool lifecycle is still clear from the surrounding discussion, but the listing does not visibly close that borrowed handle on every path. this companion calls out the gap rather than presenting the entire listing as a tested production dao. a source example can explain a design while still leaving an error path incomplete. data coordinates and application structure {}", "pdf_page": 60}, {"module": "2", "section": {"name": "Table scans", "start": 42, "end": 47}, "title": "Range bounds create a selective scan", "body": "The book's simple range from T to U includes keys beginning at T and stops before U. Start is inclusive; stop is exclusive. Because rows are ordered, the server can begin at a useful key rather than inspect the whole table. A filter alone and a bounded scan are different tools, even when both return a small answer.", "takeaway": "First reduce the range; then test the remaining records as needed.", "kind": "lesson", "lab": "ranges", "lab_snapshot": "Toy rows: A10, A20, B10, B20, C10. Start A20 and stop C10 return A20, B10, B20. Input order does not change rowkey ordering.", "visual": {"type": "range", "caption": "A scan covers [start, stop). Its limits are
