>read datanodes<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">assemble<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">logical file<\/text><\/svg>\"}", "pdf_page": 354}, {"module": "B", "section": {"name": "HDFS write and read paths", "start": 320, "end": 324}, "title": "HBase's files become HDFS clients' data", "body": "An HFile or WAL is a file from the filesystem's perspective. HBase interprets its contents as database data or recovery information; HDFS stores its blocks and manages replicas. That layered interpretation is why an HBase region and an HDFS block should never be assumed to be the same unit.", "takeaway": "Each layer has its own object model and responsibility.", "kind": "lesson", "id": "c0349", "index": 348, "pdf_source_start": 347, "pdf_source_end": 351, "words": 58, "search": "hbase's files become hdfs clients' data an hfile or wal is a file from the filesystem's perspective. hbase interprets its contents as database data or recovery information; hdfs stores its blocks and manages replicas. that layered interpretation is why an hbase region and an hdfs block should never be assumed to be the same unit. each layer has its own object model and responsibility. hdfs write and read paths {}", "pdf_page": 355}, {"module": "B", "section": {"name": "Failure resilience and splitting files", "start": 324, "end": 325}, "title": "Heartbeats help detect missing DataNodes", "body": "The appendix describes DataNodes periodically reporting to the NameNode. When reports remain absent beyond the configured interval, the system treats the node as failed and considers the affected replicas. The printed timing values are historical examples. The purpose is failure detection and recovery planning, not a guarantee that every disappearance is instantly distinguished from a delay.", "takeaway": "Failure detection uses observations and timeouts, not direct certainty about every machine.", "kind": "lesson", "id": "c0350", "index": 349, "pdf_source_start": 351, "pdf_source_end": 352, "words": 68, "search": "heartbeats help detect missing datanodes the appendix describes datanodes periodically reporting to the namenode. when reports remain absent beyond the configured interval, the system treats the node as failed and considers the affected replicas. the printed timing values are historical examples. the purpose is failure detection and recovery planning, not a guarantee that every disappearance is instantly distinguished from a delay. failure detection uses observations and timeouts, not direct certainty about every machine. failure resilience and splitting files {}", "pdf_page": 356}, {"module": "B", "section": {"name": "Failure resilience and splitting files", "start": 324, "end": 325}, "title": "Restore the replica count from surviving copies", "body": "Losing a DataNode can leave some blocks under-replicated. The NameNode arranges replacement replicas using surviving copies. If every copy of a required block is truly lost, there is no remaining source from which to reproduce it. The appendix explicitly distinguishes ordinary replica loss from loss of all replicas.", "takeaway": "Replication tolerates some losses; it cannot reconstruct data after every copy is gone.", "kind": "lesson", "id": "c0351", "index": 350, "pdf_source_start": 351, "pdf_source_end": 352, "words": 61, "search": "restore the replica count from surviving copies losing a datanode can leave some blocks under-replicated. the namenode arranges replacement replicas using surviving copies. if every copy of a required block is truly lost, there is no remaining source from which to reproduce it. the appendix explicitly distinguishes ordinary replica loss from loss of all replicas. replication tolerates some losses; it cannot reconstruct data after every copy is gone. failure resilience and splitting files {}", "pdf_page": 357}, {"module": "B", "section": {"name": "Failure resilience and splitting files", "start": 324, "end": 325}, "title": "Large files are split into blocks", "body": "The appendix gives 64-128 MB as typical HDFS block sizes in its era. A file's blocks can live on different DataNodes, so a logical file can be larger than one disk. This also supports working on different portions across machines. These large storage blocks are distinct from the much smaller HFile blocks used for database access.", "takeaway": "File distribution and database read granularity operate at different scales.", "kind": "lesson", "id": "c0352", "index": 351, "pdf_source_start": 351, "pdf_source_end": 352, "words": 66, "search": "large files are split into blocks the appendix gives 64-128 mb as typical hdfs block sizes in its era. a file's blocks can live on different datanodes, so a logical file can be larger than one disk. this also supports working on different portions across machines. these large storage blocks are distinct from the much smaller hfile blocks used for database access. file distribution and database read granularity operate at different scales. failure resilience and splitting files {}", "pdf_page": 358}, {"module": "B", "section": {"name": "Failure resilience and splitting files", "start": 324, "end": 325}, "title": "Placement information is obtained as writing proceeds", "body": "As the client writes more of a large file, it obtains further placement information for additional blocks. The application does not manually stitch together a catalog of physical disks. The filesystem owns that bookkeeping. This closes the book's dependency story: HBase can focus on region serving while HDFS provides a distributed file substrate.", "takeaway": "HBase builds database behavior on top of a filesystem that already manages distributed blocks.", "kind": "lesson", "id": "c0353", "index": 352, "pdf_source_start": 351, "pdf_source_end": 352, "words": 67, "search": "placement information is obtained as writing proceeds as the client writes more of a large file, it obtains further placement information for additional blocks. the application does not manually stitch together a catalog of physical disks. the filesystem owns that bookkeeping. this closes the book's dependency story: hbase can focus on region serving while hdfs provides a distributed file substrate. hbase builds database behavior on top of a filesystem that already manages distributed blocks. failure resilience and splitting files {}", "pdf_page": 359}, {"module": "B", "section": {"name": "Chapter recall", "start": 319, "end": 323}, "title": "Recall: data versus metadata", "body": "Which role provides block-location information in the appendix?", "takeaway": "The NameNode manages metadata and locations. DataNodes supply the block contents that the client reads or writes.", "kind": "quiz", "choices": ["UsersDAO", "NameNode", "A column qualifier"], "answer": 1, "explanation": "The NameNode manages metadata and locations. DataNodes supply the block contents that the client reads or writes.", "id": "c0354", "index": 353, "pdf_source_start": 346, "pdf_source_end": 350, "words": 25, "search": "recall: data versus metadata which role provides block-location information in the appendix? the namenode manages metadata and locations. datanodes supply the block contents that the client reads or writes. chapter recall {}", "pdf_page": 360, "answer_page": 408}, {"module": "B", "section": {"name": "Chapter recall", "start": 324, "end": 325}, "title": "Recall: all copies lost", "body": "Can creating a new empty DataNode reconstruct a block after every existing replica has been destroyed?", "takeaway": "The appendix explicitly recognizes loss of all replicas as data loss. A block identifier locates data; it does not encode the missing contents.", "kind": "quiz", "choices": ["Yes; the block ID contains all its contents", "Yes; the rowkey recreates the value", "No; a surviving copy or another backup source is needed"], "answer": 2, "explanation": "The appendix explicitly recognizes loss of all replicas as data loss. A block identifier locates data; it does not encode the missing contents.", "id": "c0355", "index": 354, "pdf_source_start": 351, "pdf_source_end": 352, "words": 39, "search": "recall: all copies lost can creating a new empty datanode reconstruct a block after every existing replica has been destroyed? the appendix explicitly recognizes loss of all replicas as data loss. a block identifier locates data; it does not encode the missing contents. chapter recall {}", "pdf_page": 361, "answer_page": 409}], "labs": [{"key": "write", "title": "Follow a write through a crash", "description": "Step through WAL, MemStore, flush, crash, and replay.", "id": "c0038"}, {"key": "versions", "title": "Read a cell at different versions", "description": "Select latest-only or several versions and inspect the result.", "id": "c0050"}, {"key": "ranges", "title": "Explore ordered keys and scan bounds", "description": "Change start and stop keys; observe inclusive and exclusive edges.", "id": "c0055"}, {"key": "shuffle", "title": "Group and sum activity records", "description": "Change a user duration and inspect map pairs, grouped values, and totals.", "id": "c0075"}, {"key": "keys", "title": "See distribution and scan fan-out", "description": "Switch between time-first, user-first, and salted toy keys.", "id": "c0108"}, {"key": "filters", "title": "Choose cell or row filtering", }
if(key==='observer'){
 const descriptions={forward:['Forward: Ada follows Ben','Emit inverse: Ben is followed by Ada'],inverse:['Inverse: Ben is followed by Ada','No derived write: inverse guard stops recursion'],other:['User profile update','No derived write: unrelated schema shape']},d=descriptions[s.type];
 h=selectLab(key,'type','Incoming mutation shape',[['forward','Forward relationship'],['inverse','Derived inverse relationship'],['other','Unrelated profile']],s.type)+`<div class="model">${tile(d[0])}</div><p class="explain"><b>${esc(d[1])}</b></p><p class="explain">The observer recognizes its intended input shape. Producing an inverse row is extra work, not an automatically atomic transaction with the original row.</p>`;
 boundary+=' Schema-guard demonstration with fixed identities. No observer lifecycle, network call, recursion engine, or failure-recovery strategy is implemented.';
}
if(key==='async'){
 const d={success:['RPC completes: true','Success callback','Updated result','Format completion report'],conflict:['RPC completes: false','Condition-conflict branch','Not applied result','Format conflict report'],error:['RPC fails: exception','Error callback','Failure + user context','Format failure report']}[s.outcome];
 h=selectLab(key,'outcome','Conditional-update outcome',[['success','Expected value matches'],['conflict','Expected value changed'],['error','Request exception']],s.outcome)+`<div class="model">${d.map(x=>tile(x,s.outcome!=='success')).join('')}</div><p class="explain">An RPC returning false is not the same as a transport failure. Formatting a failure report does not make the update successful. Notifications can introduce another failure path.</p>`;
 boundary+=' Fixed completion branches, no actual Deferred library or concurrent execution. This is not a password-handling implementation.';
}
if(key==='tsdb'){
 const base=1292148000,t=base+s.offset,q=(s.offset<<4)|s.flags;
 h=slider(key,'offset','Seconds into the hour',0,3599,s.offset)+slider(key,'flags','Four-bit flags',0,15,s.flags)+slider(key,'tags','Tag pairs',0,4,s.tags)+`<div class="labpair"><div><small>FULL TIMESTAMP</small><b>${t}</b></div><div><small>QUALIFIER</small><b>${q} / 0x${q.toString(16).toUpperCase().padStart(4,'0')}</b></div></div><p class="explain">Base ${base} + offset ${s.offset}.<br>Qualifier = (${s.offset} &lt;&lt; 4) | ${s.flags}.<br>Rowkey = 3 + 4 + 6 x ${s.tags} = <b>${7+6*s.tags} bytes</b>.</p><pre><code>${q.toString(2).padStart(16,'0').slice(0,12)} | ${q.toString(2).padStart(16,'0').slice(12)}\n12 offset bits | 4 flag bits</code></pre>`;
 boundary+=' The book\'s two-byte qualifier and UID layout only. Counts exclude values and HBase record overhead; not all flag combinations are valid measurement encodings. Zero tags is an arithmetic case, not an API-validity claim.';
}
if(key==='geo'){
 const g=geobits(s.lat,s.lon,s.bits),xr=40+(s.lon+180)/360*560,yr=170-(s.lat+90)/180*140,bx=40+(g.lon[0]+180)/360*560,by=170-(g.lat[1]+90)/180*140,bw=(g.lon[1]-g.lon[0])/360*560,bh=(g.lat[1]-g.lat[0])/180*140;
 h=slider(key,'lat','Latitude',-90,90,s.lat,.01)+slider(key,'lon','Longitude',-180,180,s.lon,.01)+slider(key,'bits','Interleaved bits',2,20,s.bits)+`<div class="model">${tile(g.bits)}</div><svg viewBox="0 0 640 200" role="img" aria-label="Coordinate box created by the bit prefix"><rect x="40" y="30" width="560" height="140" fill="#e9eff7" stroke="#a8babe"/><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="#e5f2ef" stroke="#126c69" stroke-width="2"/><circle cx="${xr}" cy="${yr}" r="4" fill="#c57130"/><text x="40" y="191" fill="#173344" font-size="14">Schematic coordinate ranges, not a geographic map</text></svg><p class="explain">Longitude box: [${g.lon[0].toFixed(5)}, ${g.lon[1].toFixed(5)}].<br>Latitude box: [${g.lat[0].toFixed(5)}, ${g.lat[1].toFixed(5)}].<br>More bits narrow the box; they do not prove complete nearest-neighbor coverage.</p><details><summary>Inspect bit decisions</summary>${labTable(['Step','Dimension','Midpoint','Bit'],g.decisions)}</details>`;
 boundary+=' Bisection and longitude-first bit interleaving only. No Base32 conversion, wraparound neighbors, geodesic distances, or spatial database query is implemented.';
}
if(key==='memory'){
 const cache=s.heap*s.cache/100,mem=s.heap*s.mem/100,other=s.heap-cache-mem,fetch=Math.ceil(s.rows/s.batch);
 h=slider(key,'heap','Toy RegionServer heap (GiB)',2,32,s.heap)+slider(key,'cache','Cache share (%)',0,70,s.cache,5)+slider(key,'mem','MemStore share (%)',0,90-s.cache,s.mem,5)+`<div class="labpair"><div><small>CACHE / MEMSTORE</small><b>${cache.toFixed(2)} / ${mem.toFixed(2)} GiB</b></div><div><small>REMAINING HEAP</small><b>${other.toFixed(2)} GiB</b></div></div>`+slider(key,'rows','Rows to fetch',100,5000,s.rows,100)+slider(key,'batch','Rows per toy fetch',1,500,s.batch)+`<p class="explain">Idealized data fetches: ceil(${s.rows}/${s.batch}) = <b>${fetch}</b>. Increasing rows per fetch is a client transport choice, not the same setting as server BlockCache size.</p>`;
 boundary+=' Arithmetic budget, not heap allocation or a performance recommendation. The toy caps the two shares at 90%; excludes off-heap memory, other processes, setup/empty RPCs, byte limits, retries, and region transitions.';
}
if(key==='replication'){
 const vals=n=>Array.from({length:n},(_,i)=>String.fromCharCode(65+i));
 h=labTable(['Source accepted','Destination applied','Pending'],[[vals(s.accepted).join(', ')||'-',vals(s.shipped).join(', ')||'-',vals(s.accepted).slice(s.shipped).join(', ')||'-']])+`<div class="controls">${labButton(key,'accept','Accept next edit',s.accepted>=10)}${labButton(key,'ship','Ship one',s.shipped>=s.accepted)}${labButton(key,'all','Ship all',s.shipped>=s.accepted)}${labButton(key,'reset','Reset')}</div><p class="explain">Lag in this fixed ordered stream: <b>${s.accepted-s.shipped} edit(s)</b>. Accepting at the source does not wait for the destination in the asynchronous model.</p>`;
 boundary+=' Single ordered toy stream with no network failures, topology cycles, duplicate delivery, conflicts, or failover. It illustrates lag, not a complete replication protocol.';
}
return `<section class="lab" aria-label="Interactive ${esc(key)} experiment"><div class="labhead">Try the mechanism</div>${h}<div class="boundary">${esc(boundary)}</div></section>`;}
function labAction(key,a){const s=labState[key];if(key==='write'){s.step=a==='reset'?0:Math.max(0,Math.min(5,s.step+(a==='next'?1:-1)));}if(key==='replication'){if(a==='reset'){s.accepted=2;s.shipped=0;}if(a==='accept')s.accepted=Math.min(10,s.accepted+1);if(a==='ship')s.shipped=Math.min(s.accepted,s.shipped+1);if(a==='all')s.shipped=s.accepted;}const top=$('stage').scrollTop;render();$('stage').scrollTop=top;}
$('card').addEventListener('change',e=>{const key=e.target.dataset.labInput;if(!key)return;const field=e.target.dataset.field;labState[key][field]=typeof labState[key][field]==='string'?e.target.value:Number(e.target.value);if(key==='memory')labState.memory.mem=Math.min(labState.memory.mem,90-labState.memory.cache);const top=$('stage').scrollTop;render();$('stage').scrollTop=top;});
applyTheme();go(state.current);
window.HBASE_APP={go,openLibrary,closeLibrary,renderLab,labAction,geobits,getState:()=>JSON.parse(JSON.stringify(state)),getPool:()=>pool.slice(),getLabState:()=>JSON.parse(JSON.stringify(labState))};
</script></body></html>
