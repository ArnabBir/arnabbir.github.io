": {"name": "Geohash and spatial rowkeys", "start": 209, "end": 216}, "title": "Several short scans can beat one broad scan", "body": "To cover neighboring tiles, the chapter considers multiple narrower scans rather than one large range that drags in many excess points. Independent scans can also overlap in execution. The trade-off includes coordination and candidate volume, so the right granularity depends on the data and query. The example is a way to reason about work, not a measured universal speedup.", "takeaway": "Measure the candidates read as well as the number of scans issued.", "kind": "lesson", "id": "c0223", "index": 222, "pdf_source_start": 236, "pdf_source_end": 243, "words": 71, "search": "several short scans can beat one broad scan to cover neighboring tiles, the chapter considers multiple narrower scans rather than one large range that drags in many excess points. independent scans can also overlap in execution. the trade-off includes coordination and candidate volume, so the right granularity depends on the data and query. the example is a way to reason about work, not a measured universal speedup. measure the candidates read as well as the number of scans issued. geohash and spatial rowkeys {}", "pdf_page": 229}, {"module": "8", "section": {"name": "Implementing nearest-neighbor queries", "start": 216, "end": 222}, "title": "Create candidates before selecting winners", "body": "The nearest-neighbor implementation scans a chosen geohash neighborhood, computes distances for candidate points, and keeps the best results. Candidate generation and ranking are separate stages. A perfect ranking function cannot recover a point that the scan never retrieved. This separation is especially important when interpreting a fixed-precision example.", "takeaway": "Retrieval coverage limits what the ranking stage can possibly return.", "kind": "lesson", "id": "c0224", "index": 223, "pdf_source_start": 243, "pdf_source_end": 249, "words": 58, "search": "create candidates before selecting winners the nearest-neighbor implementation scans a chosen geohash neighborhood, computes distances for candidate points, and keeps the best results. candidate generation and ranking are separate stages. a perfect ranking function cannot recover a point that the scan never retrieved. this separation is especially important when interpreting a fixed-precision example. retrieval coverage limits what the ranking stage can possibly return. implementing nearest-neighbor queries {}", "pdf_page": 230}, {"module": "8", "section": {"name": "Implementing nearest-neighbor queries", "start": 216, "end": 222}, "title": "Keep a bounded set of the closest matches", "body": "The implementation uses a bounded priority-queue structure to retain the best k candidates while scanning. It need not keep every examined point in memory just to return a small result. Once the scan finishes, those retained candidates provide the query's local top matches. The queue implements selection, not a new storage index.", "takeaway": "A top-k structure reduces result memory, not the number of candidates the scan visits.", "kind": "lesson", "id": "c0225", "index": 224, "pdf_source_start": 243, "pdf_source_end": 249, "words": 66, "search": "keep a bounded set of the closest matches the implementation uses a bounded priority-queue structure to retain the best k candidates while scanning. it need not keep every examined point in memory just to return a small result. once the scan finishes, those retained candidates provide the query's local top matches. the queue implements selection, not a new storage index. a top-k structure reduces result memory, not the number of candidates the scan visits. implementing nearest-neighbor queries {}", "pdf_page": 231}, {"module": "8", "section": {"name": "Implementing nearest-neighbor queries", "start": 216, "end": 222}, "title": "Combine the per-scan candidates", "body": "Several tile scans can return their own closest matches. The client combines those candidates and chooses the overall best k among the retrieved set. The word retrieved matters: aggregation cannot fix an insufficient spatial search area. Think of the flow as several candidate streams followed by a common selection step.", "takeaway": "The final top k is only as complete as the candidate coverage.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Tile ranges", "Scan candidates", "Distance / top k", "Merge candidates"], "caption": "The chapter's nearest-neighbor query flow. Coverage and final ranking are separate correctness concerns.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Tile ranges<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Scan<\/text><text x=\"242.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">candidates<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"397.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Distance / top<\/text><text x=\"397.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">k<\/text><polyline points=\"467.0,75 483.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M474.8959760788259 78.91468980700107 L483.0 75 L474.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"485.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"552.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Merge<\/text><text x=\"552.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">candidates<\/text><\/svg>"}, "id": "c0226", "index": 225, "pdf_source_start": 243, "pdf_source_end": 249, "words": 62, "search": "combine the per-scan candidates several tile scans can return their own closest matches. the client combines those candidates and chooses the overall best k among the retrieved set. the word retrieved matters: aggregation cannot fix an insufficient spatial search area. think of the flow as several candidate streams followed by a common selection step. the final top k is only as complete as the candidate coverage. implementing nearest-neighbor queries {\"type\": \"flow\", \"labels\": [\"tile ranges\", \"scan candidates\", \"distance / top k\", \"merge candidates\"], \"caption\": \"the chapter's nearest-neighbor query flow. coverage and final ranking are separate correctness concerns.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"150\\\" viewbox=\\\"0 0 640 150\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"150\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"87.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">tile ranges<\/text><polyline points=\\\"157.0,75 173.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m164.8959760788259 78.91468980700107 l173.0 75 l164.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"175.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"242.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">scan<\/text><text x=\\\"242.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">candidates<\/text><polyline points=\\\"312.0,75 328.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m319.8959760788259 78.91468980700107 l328.0 75 l319.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"330.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">distance / top<\/text><text x=\\\"397.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">k<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">merge<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">candidates<\/text><\/svg>\"}", "pdf_page": 232}, {"module": "8", "section": {"name": "Implementing nearest-neighbor queries", "start": 216, "end": 222}, "title": "The example distance is deliberately simple", "body": "The source uses a Euclidean calculation over its coordinate representation for the demonstration. That is enough to explain ranking and compare candidates in the example. It is not a full statement about accurate physical distances everywhere on Earth. Keep the model's units and intended scope visible when reading the numerical results.", "takeaway": "A demonstration distance function is not automatically a complete geographic distance model.", "kind": "lesson", "id": "c0227", "index": 226, "pdf_source_start": 243, "pdf_source_end": 249, "words": 63, "search": "the example distance is deliberately simple the source uses a euclidean calculation over its coordinate representation for the demonstration. that is enough to explain ranking and compare candidates in the example. it is not a full statement about accurate physical distances everywhere on earth. keep the model's units and intended scope visible when reading the numerical results. a demonstration distance function is not automatically a complete geographic distance model. implementing nearest-neighbor queries {}", "pdf_page": 233}, {"module": "8", "section": {"name": "Implementing nearest-neighbor queries", "start": 216, "end": 222}, "title": "A comparator's side effect is a caution", "body": "The example caches calculated distance while comparing candidates, and the surrounding source warns about that kind of side effect in a comparator. It is worth noticing because code can be compact without being a general recommendation. The learning objective is understanding repeated comparison work and result ranking, not endorsing every implementation shortcut.", "takeaway": "Read explicit warnings attached to clever-looking code.", "kind": "lesson", "id": "c0228", "index": 227, "pdf_source_start": 243, "pdf_source_end": 249, "words": 59, "search": "a comparator's side effect is a caution the example caches calculated distance while comparing candidates, and the surrounding source warns about that kind of side effect in a comparator. it is worth noticing because code can be compact without being a general recommendation. the learning objective is understanding repeated comparison work and result ranking, not endorsing every implementation shortcut. read explicit warnings attached to clever-looking code. implementing nearest-neighbor queries {}", "pdf_page": 234}, {"module": "8", "section": {"name": "Implementing nearest-neighbor queries", "start": 216, "end": 222}, "title": "Precision depends on density and the query", "body": "A very fine tile in a sparse area may contain too few points. A coarse tile in a dense area can produce many unnecessary candidates. Later in the nearest-neighbor discussion, the book says to tune precision using the dataset and query behavior. Its example does not supply a universal termination proof for arbitrary global nearest-neighbor searches.", "takeaway": "Fixed precision is a workload assumption, not a general nearest-neighbor guarantee.", "kind": "lesson", "id": "c0229", "index": 228, "pdf_source_start": 243, "pdf_source_end": 249, "words": 67, "search": "precision depends on density and the query a very fine tile in a sparse area may contain too few points. a coarse tile in a dense area can produce many unnecessary candidates. later in the nearest-neighbor discussion, the book says to tune precision using the dataset and query behavior. its example does not supply a universal termination proof for arbitrary global nearest-neighbor searches. fixed precision is a workload assumption, not a general nearest-neighbor guarantee. implementing nearest-neighbor queries {}", "pdf_page": 235}, {"module": "8", "section": {"name": "Implementing nearest-neighbor queries", "start": 216, "end": 222}, "title": "Keep the nine-tile claim within the worked example", "body": "The spatial-index discussion says to scan the center tile and its eight neighbors. The later implementation discussion also explains that precision must be adjusted to the task and point density. These passages should be read together. This companion does not extend the example into a guarantee that nine tiles at any fixed precision always contain every query's true nearest k points.", "takeaway": "The source provides a worked strategy and tuning discussion, not a complete general coverage algorithm.", "kind": "source-note", "id": "c0230", "index": 229, "pdf_source_start": 243, "pdf_source_end": 249, "words": 76, "search": "keep the nine-tile claim within the worked example the spatial-index discussion says to scan the center tile and its eight neighbors. the later implementation discussion also explains that precision must be adjusted to the task and point density. these passages should be read together. this companion does not extend the example into a guarantee that nine tiles at any fixed precision always contain every query's true nearest k points. the source provides a worked strategy and tuning discussion, not a complete general coverage algorithm. implementing nearest-neighbor queries {}", "pdf_page": 236}, {"module": "8", "section": {"name": "Within queries and server-side filtering", "start": 222, "end": 235}, "title": "A polygon defines the exact acceptance test", "body": "For a within query, the target is a supplied polygon rather than a desired result count. The source introduces JTS geometry and a WKT representation to express the shape. The coordinate sequence closes the polygon by returning to its start. A scan rectangle or tile neighborhood may cover that polygon while also containing points that should be rejected.", "takeaway": "Covering the polygon finds candidates; containment decides the result.", "kind": "lesson", "id": "c0231", "index": 230, "pdf_source_start": 249, "pdf_source_end": 262, "words": 67, "search": "a polygon defines the exact acceptance test for a within query, the target is a supplied polygon rather than a desired result count. the source introduces jts geometry and a wkt representation to express the shape. the coordinate sequence closes the polygon by returning to its start. a scan rectangle or tile neighborhood may cover that polygon while also containing points that should be rejected. covering the polygon finds candidates; containment decides the result. within queries and server-side filtering {}", "pdf_page": 237}, {"module": "8", "section": {"name": "Within queries and server-side filtering", "start": 222, "end": 235}, "title": "The centroid helps start the search", "body": "The source uses a polygon's centroid as an anchor for constructing candidate geohash coverage. It also notes that a centroid need not lie inside every polygon. This is a reason to check the actual coverage rather than assume that a center point alone proves the whole shape is included. A geometry helper still has a precise mathematical role.", "takeaway": "An anchor point is not a proof that the candidate area covers the query shape.", "kind": "lesson", "id": "c0232", "index": 231, "pdf_source_start": 249, "pdf_source_end": 262, "words": 73, "search": "the centroid helps start the search the source uses a polygon's centroid as an anchor for constructing candidate geohash coverage. it also notes that a centroid need not lie inside every polygon. this is a reason to check the actual coverage rather than assume that a center point alone proves the whole shape is included. a geometry helper still has a precise mathematical role. an anchor point is not a proof that the candidate area covers the query shape. within queries and server-side filtering {}", "pdf_page": 238}, {"module": "8", "section": {"name": "Within queries and server-side filtering", "start": 224, "end": 227}, "title": "Try finer coverage, then coarsen", "body": "The minimumBoundingPrefixes logic tries a precision, checks whether the central tile contains the polygon, and otherwise considers the surrounding tiles and their covering hull. If the coverage is insufficient, it reduces precision. The goal is an area that safely covers the query. It need not be the smallest possible set of tiles.", "takeaway": "A conservative covering region can include extra points that must be filtered later.", "kind": "lesson", "id": "c0233", "index": 232, "pdf_source_start": 251, "pdf_source_end": 254, "words": 65, "search": "try finer coverage, then coarsen the minimumboundingprefixes logic tries a precision, checks whether the central tile contains the polygon, and otherwise considers the surrounding tiles and their covering hull. if the coverage is insufficient, it reduces precision. the goal is an area that safely covers the query. it need not be the smallest possible set of tiles. a conservative covering region can include extra points that must be filtered later. within queries and server-side filtering {\"type\": \"code\", \"text\": \"for precision from fine toward coarse:\\n    center_tile = tile_for(query_centroid, precision)\\n    if center_tile_contains_query_polygon:\\n        return [center_tile]\\n    neighbors = center_tile_and_eight_neighbors\\n    if covering_hull_contains_query_polygon:\\n        return neighbors\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "for precision from fine toward coarse:\n    center_tile = tile_for(query_centroid, precision)\n    if center_tile_contains_query_polygon:\n        return [center_tile]\n    neighbors = center_tile_and_eight_neighbors\n    if covering_hull_contains_query_polygon:\n        return neighbors", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 239}, {"module": "8", "section": {"name": "Within queries and server-side filtering", "start": 222, "end": 235}, "title": "A convex hull is a covering shape", "body": "The book describes a convex hull using the rubber-band intuition around outer points. It helps reason about the combined coverage of tiles. A hull can include space not occupied by the original polygon, so it is a candidate-covering tool rather than the final within predicate. The distinction prevents accidental false positives from being returned.", "takeaway": "Containment in a covering hull is not the same as containment in the query polygon.", "kind": "lesson", "visual": {"type": "polygon", "caption": "A tile-based candidate cover can surround a smaller polygon. Final geometry filtering rejects candidates outside the polygon.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"100\" y=\"14\" width=\"88\" height=\"63\" rx=\"0\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><rect x=\"100\" y=\"77\" width=\"88\" height=\"63\" rx=\"0\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><rect x=\"100\" y=\"140\" width=\"88\" height=\"63\" rx=\"0\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><rect x=\"188\" y=\"14\" width=\"88\" height=\"63\" rx=\"0\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><rect x=\"188\" y=\"77\" width=\"88\" height=\"63\" rx=\"0\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><  server-side within decision needs longitude and latitude together. That makes a whole-row filtering hook more natural than deciding from an isolated cell. The filter must serialize its configuration so the server knows the query geometry, and its classes must be available where it executes. A correct client predicate does not automatically deploy itself to the cluster.", "takeaway": "Moving work server-side adds serialization and deployment requirements.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Covering key ranges", "Candidate row", "Read both coordinates", "Polygon predicate"], "caption": "Server-side within filtering retains the same candidate-versus-exact-test distinction.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Covering key<\/text><text x=\"87.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">ranges<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Candidate row<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"no 7\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">coordinates<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">polygon<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">predicate<\/text><\/svg>\"}", "pdf_page": 243}, {"module": "8", "section": {"name": "Within queries and server-side filtering", "start": 222, "end": 235}, "title": "The printed WithinFilter has a coordinate-reading mismatch", "body": "The source's WithinFilter listing reads a qualifier in code where the surrounding explanation intends to read the coordinate value. This companion describes the intended data flow but does not reproduce the listing as an executable, verified filter. A full implementation needs its data extraction and serialization checked against actual rows and its release-specific Filter contract.", "takeaway": "Treat the listing as a source-reading exercise; do not silently promote it into tested code.", "kind": "source-note", "id": "c0238", "index": 237, "pdf_source_start": 249, "pdf_source_end": 262, "words": 70, "search": "the printed withinfilter has a coordinate-reading mismatch the source's withinfilter listing reads a qualifier in code where the surrounding explanation intends to read the coordinate value. this companion describes the intended data flow but does not reproduce the listing as an executable, verified filter. a full implementation needs its data extraction and serialization checked against actual rows and its release-specific filter contract. treat the listing as a source-reading exercise; do not silently promote it into tested code. within queries and server-side filtering {}", "pdf_page": 244}, {"module": "8", "section": {"name": "Within queries and server-side filtering", "start": 222, "end": 235}, "title": "Dependencies must reach the executing process", "body": "The GIS filter uses geometry classes as well as application code. The chapter explores JAR packaging, dependencies, classpaths, and server restarts when required by its deployment method. A missing dependency appears where the filter is loaded, not necessarily where the client compiled. The distinction between a lean JAR and a bundled JAR matters to the deployment shape.", "takeaway": "Successful client compilation does not prove the RegionServer can load the filter.", "kind": "lesson", "id": "c0239", "index": 238, "pdf_source_start": 249, "pdf_source_end": 262, "words": 69, "search": "dependencies must reach the executing process the gis filter uses geometry classes as well as application code. the chapter explores jar packaging, dependencies, classpaths, and server restarts when required by its deployment method. a missing dependency appears where the filter is loaded, not necessarily where the client compiled. the distinction between a lean jar and a bundled jar matters to the deployment shape. successful client compilation does not prove the regionserver can load the filter. within queries and server-side filtering {}", "pdf_page": 245}, {"module": "8", "section": {"name": "Within queries and server-side filtering", "start": 222, "end": 235}, "title": "Validate equal results before celebrating speed", "body": "The source compares client-side and server-side versions using the same within query. Both should return the same retained points. Only then should performance be assessed under an appropriately sized distributed workload. A small example proves behavior more than scalability, and a costly row-level predicate can add server work or trigger timeouts.", "takeaway": "An optimization should preserve the answer before its resource savings are evaluated.", "kind": "lesson", "id": "c0240", "index": 239, "pdf_source_start": 249, "pdf_source_end": 262, "words": 63, "search": "validate equal results before celebrating speed the source compares client-side and server-side versions using the same within query. both should return the same retained points. only then should performance be assessed under an appropriately sized distributed workload. a small example proves behavior more than scalability, and a costly row-level predicate can add server work or trigger timeouts. an optimization should preserve the answer before its resource savings are evaluated. within queries and server-side filtering {}", "pdf_page": 246}, {"module": "8", "section": {"name": "Chapter recall", "start": 211, "end": 212}, "title": "Recall: six bits", "body": "Longitude contributes 010; latitude contributes 101. With longitude first, what is the interleaved sequence?", "takeaway": "Take one bit from longitude, then one from latitude repeatedly: 0,1,1,0,0,1. This reproduces the source's six-bit illustration.", "kind": "quiz", "choices": ["101010", "010101", "011001"], "answer": 2, "explanation": "Take one bit from longitude, then one from latitude repeatedly: 0,1,1,0,0,1. This reproduces the source's six-bit illustration.", "id": "c0241", "index": 240, "pdf_source_start": 238, "pdf_source_end": 239, "words": 31, "search": "recall: six bits longitude contributes 010; latitude contributes 101. with longitude first, what is the interleaved sequence? take one bit from longitude, then one from latitude repeatedly: 0,1,1,0,0,1. this reproduces the source's six-bit illustration. chapter recall {}", "pdf_page": 247, "answer_page": 391}, {"module": "8", "section": {"name": "Chapter recall", "start": 213, "end": 216}, "title": "Recall: a boundary neighbor", "body": "Why can scanning only a target geohash prefix miss a nearby point?", "takeaway": "Spatially adjacent tiles can share only a short prefix. The book illustrates this edge case and examines neighboring tiles rather than trusting the target prefix alone.", "kind": "quiz", "choices": ["A nearby point can fall across a prefix boundary", "Geohashes store no location information", "Every tile contains exactly one point"], "answer": 0, "explanation": "Spatially adjacent tiles can share only a short prefix. The book illustrates this edge case and examines neighboring tiles rather than trusting the target prefix alone.", "id": "c0242", "index": 241, "pdf_source_start": 240, "pdf_source_end": 243, "words": 38, "search": "recall: a boundary neighbor why can scanning only a target geohash prefix miss a nearby point? spatially adjacent tiles can share only a short prefix. the book illustrates this edge case and examines neighboring tiles rather than trusting the target prefix alone. chapter recall {}", "pdf_page": 248, "answer_page": 392}, {"module": "8", "section": {"name": "Chapter recall", "start": 216, "end": 221}, "title": "Recall: ranking cannot repair retrieval", "body": "A correct distance function ranks all retrieved points. What does it NOT prove?", "takeaway": "Candidate coverage is a separate concern. A point excluded by the spatial scan never reaches the ranking function.", "kind": "quiz", "choices": ["The result can be limited to k", "The scan covered every possible true nearest neighbor", "The candidates can be compared"], "answer": 1, "explanation": "Candidate coverage is a separate concern. A point excluded by the spatial scan never reaches the ranking function.", "id": "c0243", "index": 242, "pdf_source_start": 243, "pdf_source_end": 248, "words": 31, "search": "recall: ranking cannot repair retrieval a correct distance function ranks all retrieved points. what does it not prove? candidate coverage is a separate concern. a point excluded by the spatial scan never reaches the ranking function. chapter recall {}", "pdf_page": 249, "answer_page": 393}, {"module": "8", "section": {"name": "Chapter recall", "start": 228, "end": 232}, "title": "Recall: within filter scope", "body": "Why use row-level processing for the within predicate?", "takeaway": "The polygon test depends on longitude and latitude together. Inspecting one cell in isolation may not provide sufficient context.", "kind": "quiz", "choices": ["Every predicate is necessarily row-level", "It creates a geographic secondary index automatically", "The predicate needs both coordinate values"], "answer": 2, "explanation": "The polygon test depends on longitude and latitude together. Inspecting one cell in isolation may not provide sufficient context.", "id": "c0244", "index": 243, "pdf_source_start": 255, "pdf_source_end": 259, "words": 27, "search": "recall: within filter scope why use row-level processing for the within predicate? the polygon test depends on longitude and latitude together. inspecting one cell in isolation may not provide sufficient context. chapter recall {}", "pdf_page": 250, "answer_page": 394}, {"module": "8", "section": {"name": "Chapter recall", "start": 228, "end": 235}, "title": "Recall: optimization evidence", "body": "The baseline considers 181 points and keeps 26. What should be checked first after pushing the filter to the server?", "takeaway": "Correctness comes first. Equal retained results validate the predicate move; timing and resource savings then need an appropriate measurement setup.", "kind": "quiz", "choices": ["That the same 26 intended points are retained", "That every returned row has changed its key", "That the source's percentage slogan is repeated"], "answer": 0, "explanation": "Correctness comes first. Equal retained results validate the predicate move; timing and resource savings then need an appropriate measurement setup.", "id": "c0245", "index": 244, "pdf_source_start": 255, "pdf_source_end": 262, "words": 40, "search": "recall: optimization evidence the baseline considers 181 points and keeps 26. what should be checked first after pushing the filter to the server? correctness comes first. equal retained results validate the predicate move; timing and resource savings then need an appropriate measurement setup. chapter recall {}", "pdf_page": 251, "answer_page": 395}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "Plan the whole dependency stack", "body": "A distributed HBase deployment includes HDFS and ZooKeeper as well as HBase processes. MapReduce is another workload when the application uses it, not a requirement that every HBase request run a batch job. Planning only the RegionServer process misses storage, coordination, networking, and operational dependencies. The book organizes deployment around these roles.", "takeaway": "A cluster plan should name all services on which serving data depends.", "kind": "lesson", "id": "c0246", "index": 245, "pdf_source_start": 266, "pdf_source_end": 275, "words": 64, "search": "plan the whole dependency stack a distributed hbase deployment includes hdfs and zookeeper as well as hbase processes. mapreduce is another workload when the application uses it, not a requirement that every hbase request run a batch job. planning only the regionserver process misses storage, coordination, networking, and operational dependencies. the book organizes deployment around these roles. a cluster plan should name all services on which serving data depends. planning a cluster {}", "pdf_page": 252}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "Prototype and production answer different questions", "body": "A small prototype can colocate roles and prioritize ease of exploration. A production deployment must consider sustained workload, failure, maintenance, and its service requirements. The chapter provides size categories and example hardware profiles to illustrate this progression. They are historical heuristics rather than capacity guarantees for an arbitrary modern workload.", "takeaway": "A prototype proves behavior; production planning must also prove resource and failure assumptions.", "kind": "lesson", "id": "c0247", "index": 246, "pdf_source_start": 266, "pdf_source_end": 275, "words": 63, "search": "prototype and production answer different questions a small prototype can colocate roles and prioritize ease of exploration. a production deployment must consider sustained workload, failure, maintenance, and its service requirements. the chapter provides size categories and example hardware profiles to illustrate this progression. they are historical heuristics rather than capacity guarantees for an arbitrary modern workload. a prototype proves behavior; production planning must also prove resource and failure assumptions. planning a cluster {}", "pdf_page": 253}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "Separate batch and online requirements", "body": "Running heavy MapReduce work beside low-latency HBase serving creates competition for resources. The book discusses separating these workloads, potentially using another cluster and another data copy. This can improve isolation but adds storage and movement costs. The right reading lesson is to plan the trade-off rather than equate maximum consolidation with maximum efficiency.", "takeaway": "The lowest server count is not automatically the best service design.", "kind": "lesson", "id": "c0248", "index": 247, "pdf_source_start": 266, "pdf_source_end": 275, "words": 64, "search": "separate batch and online requirements running heavy mapreduce work beside low-latency hbase serving creates competition for resources. the book discusses separating these workloads, potentially using another cluster and another data copy. this can improve isolation but adds storage and movement costs. the right reading lesson is to plan the trade-off rather than equate maximum consolidation with maximum efficiency. the lowest server count is not automatically the best service design. planning a cluster {}", "pdf_page": 254}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "Commodity does not mean careless", "body": "The chapter favors scale-out commodity hardware but still emphasizes balanced disks, RAM, CPU, and network resources. Underpowered storage or a badly oversubscribed network can limit the entire cluster. Its shopping quantities and preferred technologies are specific to the period. Do not convert those example numbers into present-day purchasing advice.", "takeaway": "A scale-out design still needs each node and network path to be fit for the workload.", "kind": "lesson", "id": "c0249", "index": 248, "pdf_source_start": 266, "pdf_source_end": 275, "words": 65, "search": "commodity does not mean careless the chapter favors scale-out commodity hardware but still emphasizes balanced disks, ram, cpu, and network resources. underpowered storage or a badly oversubscribed network can limit the entire cluster. its shopping quantities and preferred technologies are specific to the period. do not convert those example numbers into present-day purchasing advice. a scale-out design still needs each node and network path to be fit for the workload. planning a cluster {}", "pdf_page": 255}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "Role placement changes as the cluster grows", "body": "The source discusses small, medium, and large clusters with progressively more dedicated coordination and management roles. The size bands illustrate when shared-role convenience may give way to isolation and redundancy. There is no universal cliff at exactly one server count. Workload, maintenance needs, and available capacity determine whether a role is a bottleneck.", "takeaway": "Use the role-based reasoning, not a rigid server-count threshold.", "kind": "lesson", "id": "c0250", "index": 249, "pdf_source_start": 266, "pdf_source_end": 275, "words": 62, "search": "role placement changes as the cluster grows the source discusses small, medium, and large clusters with progressively more dedicated coordination and management roles. the size bands illustrate when shared-role convenience may give way to isolation and redundancy. there is no universal cliff at exactly one server count. workload, maintenance needs, and available capacity determine whether a role is a bottleneck. use the role-based reasoning, not a rigid server-count threshold. planning a cluster {}", "pdf_page": 256}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "Hadoop master metadata needs protection", "body": "The book's Hadoop-era discussion pays particular attention to NameNode metadata and its deployment risks. Its description of master availability is tied to the releases it discusses. Later broad high-availability language should not erase those earlier limitations. Distinguish 'the data has replicas' from 'the metadata service remains usable under the planned failures.'", "takeaway": "Redundant data bytes do not alone prove metadata-service availability.", "kind": "lesson", "id": "c0251", "index": 250, "pdf_source_start": 266, "pdf_source_end": 275, "words": 60, "search": "hadoop master metadata needs protection the book's hadoop-era discussion pays particular attention to namenode metadata and its deployment risks. its description of master availability is tied to the releases it discusses. later broad high-availability language should not erase those earlier limitations. distinguish 'the data has replicas' from 'the metadata service remains usable under the planned failures.' redundant data bytes do not alone prove metadata-service availability. planning a cluster {}", "pdf_page": 257}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "The HBase Master has a different job", "body": "The HBase Master manages cluster and region activity rather than serving all application data directly. The deployment discussion considers backup Masters and where they should run. This is a role-specific planning question. Giving the Master the same resource profile as a RegionServer simply because both are Java processes ignores their different responsibilities.", "takeaway": "Place and size services according to their jobs, not just their programming language.", "kind": "lesson", "id": "c0252", "index": 251, "pdf_source_start": 266, "pdf_source_end": 275, "words": 65, "search": "the hbase master has a different job the hbase master manages cluster and region activity rather than serving all application data directly. the deployment discussion considers backup masters and where they should run. this is a role-specific planning question. giving the master the same resource profile as a regionserver simply because both are java processes ignores their different responsibilities. place and size services according to their jobs, not just their programming language. planning a cluster {}", "pdf_page": 258}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "Colocate RegionServers and DataNodes deliberately", "body": "The book often places RegionServers on hosts that also run HDFS DataNodes. This can support data locality, but both processes share CPU, disks, memory, and the network. RegionServer heap is not the entire machine's memory budget. The chapter's allocation examples should be read with those competing consumers in view.", "takeaway": "Host-level resource planning includes every colocated daemon.", "kind": "lesson", "id": "c0253", "index": 252, "pdf_source_start": 266, "pdf_source_end": 275, "words": 56, "search": "colocate regionservers and datanodes deliberately the book often places regionservers on hosts that also run hdfs datanodes. this can support data locality, but both processes share cpu, disks, memory, and the network. regionserver heap is not the entire machine's memory budget. the chapter's allocation examples should be read with those competing consumers in view. host-level resource planning includes every colocated daemon. planning a cluster {}", "pdf_page": 259}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "ZooKeeper is sensitive to delays", "body": "ZooKeeper participates in coordination and session tracking. Delays caused by a heavily loaded shared host or disk can affect that role. The chapter discusses dedicated resources and quorum deployment as the cluster grows. Treat coordination availability as its own requirement, not as incidental overhead that can be placed anywhere without consequences.", "takeaway": "A small coordination workload can still be critical to the whole service.", "kind": "lesson", "id": "c0254", "index": 253, "pdf_source_start": 266, "pdf_source_end": 275, "words": 63, "search": "zookeeper is sensitive to delays zookeeper participates in coordination and session tracking. delays caused by a heavily loaded shared host or disk can affect that role. the chapter discusses dedicated resources and quorum deployment as the cluster grows. treat coordination availability as its own requirement, not as incidental overhead that can be placed anywhere without consequences. a small coordination workload can still be critical to the whole service. planning a cluster {}", "pdf_page": 260}, {"module": "9", "section": {"name": "Planning a cluster", "start": 239, "end": 248}, "title": "Cloud provisioning is not cloud operations", "body": "The historical cloud discussion separates obtaining machines from operating the distributed system on them. Instances, storage, networking, data placement, and ongoing management still matter after provisioning succeeds. The book's EC2, EBS, and S3 opinio
