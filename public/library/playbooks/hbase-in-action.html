mily=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">candidate<\/text><text x=\\\"87.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">hfile<\/text><polyline points=\\\"157.0,75 173.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m164.8959760788259 78.91468980700107 l173.0 75 l164.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"175.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"242.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">bloom check<\/text><polyline points=\\\"312.0,75 328.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m319.8959760788259 78.91468980700107 l328.0 75 l319.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"330.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">absent: skip<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">maybe: inspect<\/text><\/svg>\"}", "pdf_page": 130}, {"module": "4", "section": {"name": "Advanced column-family configurations", "start": 115, "end": 115}, "title": "TTL expresses an age policy", "body": "Time to live is configured at the family level in seconds in the book. It limits how long values remain eligible under that policy. Physical cleanup still belongs to storage maintenance, so expiration should not be confused with instant file-space reclamation. The source's five-hour example uses 18,000 seconds.", "takeaway": "Retention policy affects visibility before it necessarily changes disk usage.", "kind": "lesson", "id": "c0125", "index": 124, "pdf_source_start": 142, "pdf_source_end": 142, "words": 58, "search": "ttl expresses an age policy time to live is configured at the family level in seconds in the book. it limits how long values remain eligible under that policy. physical cleanup still belongs to storage maintenance, so expiration should not be confused with instant file-space reclamation. the source's five-hour example uses 18,000 seconds. retention policy affects visibility before it necessarily changes disk usage. advanced column-family configurations {\"type\": \"code\", \"text\": \"// family-description example, not a live command.\\n// ttl unit in the book is seconds.\\nttl = 5 * 60 * 60   // 18000 seconds\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "// Family-description example, not a live command.\n// TTL unit in the book is seconds.\nTTL = 5 * 60 * 60   // 18000 seconds", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 131}, {"module": "4", "section": {"name": "Advanced column-family configurations", "start": 113, "end": 117}, "title": "Compression spends CPU to reduce I/O", "body": "Compression can reduce the bytes stored and transferred for HFiles, but encoding and decoding require CPU work. The chapter discusses GZIP, LZO, and Snappy in its historical environment, including library availability. Those comparisons are not current benchmark results. The lasting reading lesson is to account for both resource savings and extra work.", "takeaway": "Less I/O and more CPU can be a worthwhile exchange, but must be measured.", "kind": "lesson", "id": "c0126", "index": 125, "pdf_source_start": 140, "pdf_source_end": 144, "words": 66, "search": "compression spends cpu to reduce i/o compression can reduce the bytes stored and transferred for hfiles, but encoding and decoding require cpu work. the chapter discusses gzip, lzo, and snappy in its historical environment, including library availability. those comparisons are not current benchmark results. the lasting reading lesson is to account for both resource savings and extra work. less i/o and more cpu can be a worthwhile exchange, but must be measured. advanced column-family configurations {}", "pdf_page": 132}, {"module": "4", "section": {"name": "Advanced column-family configurations", "start": 113, "end": 117}, "title": "Version limits interact with retention", "body": "VERSIONS bounds the history retained for a cell. MIN_VERSIONS adds a lower-bound concept when age-based retention is involved. These are family policies, whereas a Get still chooses which eligible versions to return. Because retention combines settings, reading one parameter in isolation can misrepresent the intended result.", "takeaway": "Treat history policy as a combination of settings, not just one integer.", "kind": "lesson", "visual": {"type": "table", "headers": ["Family setting", "Question it answers"], "rows": [["BLOCKSIZE", "What HFile read granularity?"], ["BLOCKCACHE / IN_MEMORY", "How should blocks compete for cache?"], ["BLOOMFILTER", "Which absence check can avoid a file read?"], ["TTL", "What age policy applies?"], ["COMPRESSION", "How are file bytes compressed?"], ["VERSIONS / MIN_VERSIONS", "What cell history is retained?"]], "caption": "Configuration themes of section 4.7; exact defaults and APIs are book-era."}, "id": "c0127", "index": 126, "pdf_source_start": 140, "pdf_source_end": 144, "words": 58, "search": "version limits interact with retention versions bounds the history retained for a cell. min_versions adds a lower-bound concept when age-based retention is involved. these are family policies, whereas a get still chooses which eligible versions to return. because retention combines settings, reading one parameter in isolation can misrepresent the intended result. treat history policy as a combination of settings, not just one integer. advanced column-family configurations {\"type\": \"table\", \"headers\": [\"family setting\", \"question it answers\"], \"rows\": [[\"blocksize\", \"what hfile read granularity?\"], [\"blockcache / in_memory\", \"how should blocks compete for cache?\"], [\"bloomfilter\", \"which absence check can avoid a file read?\"], [\"ttl\", \"what age policy applies?\"], [\"compression\", \"how are file bytes compressed?\"], [\"versions / min_versions\", \"what cell history is retained?\"]], \"caption\": \"configuration themes of section 4.7; exact defaults and apis are book-era.\"}", "pdf_page": 133}, {"module": "4", "section": {"name": "Filtering data", "start": 117, "end": 124}, "title": "A filter can act at several levels", "body": "The filter API can inspect the rowkey, each KeyValue, or a completed row. It can also indicate that a scan should finish. These hooks serve different needs. A condition requiring two columns cannot always be decided correctly from the first individual cell alone. Match the hook to the information needed for the decision.", "takeaway": "Choose a filter hook based on the state it must see.", "kind": "lesson", "id": "c0128", "index": 127, "pdf_source_start": 144, "pdf_source_end": 151, "words": 64, "search": "a filter can act at several levels the filter api can inspect the rowkey, each keyvalue, or a completed row. it can also indicate that a scan should finish. these hooks serve different needs. a condition requiring two columns cannot always be decided correctly from the first individual cell alone. match the hook to the information needed for the decision. choose a filter hook based on the state it must see. filtering data {\"type\": \"table\", \"headers\": [\"filter family\", \"target described in the book\"], \"rows\": [[\"rowfilter / prefixfilter\", \"rowkeys\"], [\"qualifierfilter\", \"column qualifiers\"], [\"valuefilter\", \"individual cell values\"], [\"timestampsfilter\", \"specified version timestamps\"], [\"filterlist\", \"combine conditions with all/one semantics\"]], \"caption\": \"selected prebundled filters from section 4.8.\"}", "visual": {"type": "table", "headers": ["Filter family", "Target described in the book"], "rows": [["RowFilter / PrefixFilter", "Rowkeys"], ["QualifierFilter", "Column qualifiers"], ["ValueFilter", "Individual cell values"], ["TimestampsFilter", "Specified version timestamps"], ["FilterList", "Combine conditions with all/one semantics"]], "caption": "Selected prebundled filters from section 4.8."}, "pdf_page": 134}, {"module": "4", "section": {"name": "Filtering data", "start": 117, "end": 120}, "title": "Filter return values control traversal", "body": "Per-cell filtering can do more than a simple true/false inclusion test. The chapter describes return codes that include a cell, skip it, move to another column or row, or influence continued traversal. Row-level methods use exclusion-oriented booleans. This makes naming and control-flow review especially important: true may mean discard rather than keep.", "takeaway": "Do not assume every filter result uses the same meaning of true.", "kind": "lesson", "id": "c0129", "index": 128, "pdf_source_start": 144, "pdf_source_end": 147, "words": 64, "search": "filter return values control traversal per-cell filtering can do more than a simple true/false inclusion test. the chapter describes return codes that include a cell, skip it, move to another column or row, or influence continued traversal. row-level methods use exclusion-oriented booleans. this makes naming and control-flow review especially important: true may mean discard rather than keep. do not assume every filter result uses the same meaning of true. filtering data {\"type\": \"code\", \"text\": \"// read the release-specific hook contracts.\\nfilterrowkey(...)   -> row exclusion decision\\nfilterkeyvalue(...) -> cell / traversal return code\\nfilterrow(...)      -> final row exclusion decision\\nreset()             -> clear row-local state\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "// Read the release-specific hook contracts.\nfilterRowKey(...)   -> row exclusion decision\nfilterKeyValue(...) -> cell / traversal return code\nfilterRow(...)      -> final row exclusion decision\nreset()             -> clear row-local state", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 135}, {"module": "4", "section": {"name": "Filtering data", "start": 117, "end": 124}, "title": "Reset state between rows", "body": "A filter that collects information while inspecting a row must reset that information before the next row. Otherwise a decision about one user can leak into another user's result. The book's custom examples demonstrate stateful decisions, so lifecycle methods are part of correctness, not optional cleanup decorations.", "takeaway": "Row-local state must really be local to one row.", "kind": "lesson", "id": "c0130", "index": 129, "pdf_source_start": 144, "pdf_source_end": 151, "words": 56, "search": "reset state between rows a filter that collects information while inspecting a row must reset that information before the next row. otherwise a decision about one user can leak into another user's result. the book's custom examples demonstrate stateful decisions, so lifecycle methods are part of correctness, not optional cleanup decorations. row-local state must really be local to one row. filtering data {}", "pdf_page": 136}, {"module": "4", "section": {"name": "Filtering data", "start": 117, "end": 124}, "title": "Cell filtering and row filtering differ", "body": "A ValueFilter checks cell values. It does not automatically implement every business rule of 'keep the whole row if some other column matches.' A row-level predicate can make a final decision using several cells. The distinction is important in the later GIS example, where longitude and latitude must be considered together.", "takeaway": "Discarding a cell and discarding an entire row are different operations.", "kind": "lesson", "lab": "filters", "lab_snapshot": "Toy users have name and score cells. A cell-value condition can retain only matching cells; a row predicate on score can retain the selected name and score together. This demonstrates scope, not every Filter implementation.", "id": "c0131", "index": 130, "pdf_source_start": 144, "pdf_source_end": 151, "words": 62, "search": "cell filtering and row filtering differ a valuefilter checks cell values. it does not automatically implement every business rule of 'keep the whole row if some other column matches.' a row-level predicate can make a final decision using several cells. the distinction is important in the later gis example, where longitude and latitude must be considered together. discarding a cell and discarding an entire row are different operations. filtering data {}", "pdf_page": 137}, {"module": "4", "section": {"name": "Filtering data", "start": 121, "end": 124}, "title": "Combine predicates intentionally", "body": "FilterList combines child filters using all-condition or any-condition logic. This resembles AND and OR, but the children still act at their own hook and traversal levels. A PrefixFilter can stop after leaving its prefix range; adding a suitable start row can avoid preceding work. Compose predicates without forgetting the scan's range and the individual filter contracts.", "takeaway": "Combining filters does not replace understanding each filter's scope.", "kind": "lesson", "id": "c0132", "index": 131, "pdf_source_start": 148, "pdf_source_end": 151, "words": 65, "search": "combine predicates intentionally filterlist combines child filters using all-condition or any-condition logic. this resembles and and or, but the children still act at their own hook and traversal levels. a prefixfilter can stop after leaving its prefix range; adding a suitable start row can avoid preceding work. compose predicates without forgetting the scan's range and the individual filter contracts. combining filters does not replace understanding each filter's scope. filtering data {\"type\": \"code\", \"text\": \"filterlist all = new filterlist(\\n    filterlist.operator.must_pass_all);\\nall.addfilter(firstcondition);\\nall.addfilter(secondcondition);\\nscan.setfilter(all);\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "FilterList all = new FilterList(\n    FilterList.Operator.MUST_PASS_ALL);\nall.addFilter(firstCondition);\nall.addFilter(secondCondition);\nscan.setFilter(all);", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 138}, {"module": "4", "section": {"name": "Filtering data", "start": 117, "end": 124}, "title": "The password filter has a source mismatch", "body": "The PasswordStrengthFilter discussion describes a threshold change, while the displayed implementation uses a different literal threshold. It is a demonstration of custom filtering, not a complete password policy. When studying it, follow how state, projection, and exclusion work; do not treat the specific password examples or threshold as production security guidance.", "takeaway": "A code literal and its surrounding prose should be compared, not silently reconciled.", "kind": "source-note", "id": "c0133", "index": 132, "pdf_source_start": 144, "pdf_source_end": 151, "words": 64, "search": "the password filter has a source mismatch the passwordstrengthfilter discussion describes a threshold change, while the displayed implementation uses a different literal threshold. it is a demonstration of custom filtering, not a complete password policy. when studying it, follow how state, projection, and exclusion work; do not treat the specific password examples or threshold as production security guidance. a code literal and its surrounding prose should be compared, not silently reconciled. filtering data {}", "pdf_page": 139}, {"module": "4", "section": {"name": "Chapter recall", "start": 100, "end": 103}, "title": "Recall: inverse direction", "body": "The rowkey begins with follower ID. What makes \"who follows this user?\" expensive without another representation?", "takeaway": "A follower-first layout groups outgoing relationships. The incoming direction requires another keyed orientation or a much broader search.", "kind": "quiz", "choices": ["The desired lookup key is not the leading grouping field", "Column families cannot store names", "Every relationship automatically has an inverse index"], "answer": 0, "explanation": "A follower-first layout groups outgoing relationships. The incoming direction requires another keyed orientation or a much broader search.", "id": "c0134", "index": 133, "pdf_source_start": 127, "pdf_source_end": 130, "words": 34, "search": "recall: inverse direction the rowkey begins with follower id. what makes \"who follows this user?\" expensive without another representation? a follower-first layout groups outgoing relationships. the incoming direction requires another keyed orientation or a much broader search. chapter recall {}", "pdf_page": 140, "answer_page": 374}, {"module": "4", "section": {"name": "Chapter recall", "start": 103, "end": 108}, "title": "Recall: hashing everything", "body": "Why not simply hash the whole user-plus-time key when the main query is one user's history?", "takeaway": "Hashing only the grouping component can retain the following time order. Hashing the entire composite key destroys that directly scannable grouping.", "kind": "quiz", "choices": ["It creates a table snapshot", "It hides the user prefix grouping needed for that scan", "It makes qualifiers mandatory SQL columns"], "answer": 1, "explanation": "Hashing only the grouping component can retain the following time order. Hashing the entire composite key destroys that directly scannable grouping.", "id": "c0135", "index": 134, "pdf_source_start": 130, "pdf_source_end": 135, "words": 37, "search": "recall: hashing everything why not simply hash the whole user-plus-time key when the main query is one user's history? hashing only the grouping component can retain the following time order. hashing the entire composite key destroys that directly scannable grouping. chapter recall {}", "pdf_page": 141, "answer_page": 375}, {"module": "4", "section": {"name": "Chapter recall", "start": 114, "end": 115}, "title": "Recall: Bloom result", "body": "A Bloom filter says a row may be present in an HFile. What should happen next?", "takeaway": "A Bloom filter rules out definite absence. A positive possibility is not proof of membership or the requested value.", "kind": "quiz", "choices": ["Assume the row is definitely absent", "Return the row without reading its value", "Check the file as needed"], "answer": 2, "explanation": "A Bloom filter rules out definite absence. A positive possibility is not proof of membership or the requested value.", "id": "c0136", "index": 135, "pdf_source_start": 141, "pdf_source_end": 142, "words": 35, "search": "recall: bloom result a bloom filter says a row may be present in an hfile. what should happen next? a bloom filter rules out definite absence. a positive possibility is not proof of membership or the requested value. chapter recall {}", "pdf_page": 142, "answer_page": 376}, {"module": "4", "section": {"name": "Chapter recall", "start": 114, "end": 115}, "title": "Recall: cache knobs", "body": "Does IN_MEMORY mean every byte of that family is permanently resident?", "takeaway": "The chapter distinguishes aggressive cache treatment from an absolute in-memory guarantee. Capacity and eviction still matter.", "kind": "quiz", "choices": ["No, it expresses the source's more aggressive caching policy", "Yes, it disables HFiles", "Yes, it allocates unlimited RAM"], "answer": 0, "explanation": "The chapter distinguishes aggressive cache treatment from an absolute in-memory guarantee. Capacity and eviction still matter.", "id": "c0137", "index": 136, "pdf_source_start": 141, "pdf_source_end": 142, "words": 27, "search": "recall: cache knobs does in_memory mean every byte of that family is permanently resident? the chapter distinguishes aggressive cache treatment from an absolute in-memory guarantee. capacity and eviction still matter. chapter recall {}", "pdf_page": 143, "answer_page": 377}, {"module": "4", "section": {"name": "Chapter recall", "start": 100, "end": 103}, "title": "Recall: two updates", "body": "A relationship is written to a forward table and an inverse table. What guarantee is missing?", "takeaway": "Denormalization improves the inverse lookup but introduces multiple writes. The row-level mutation guarantee does not become a cross-table transaction.", "kind": "quiz", "choices": ["Both tables can be read", "All-or-nothing atomic completion across both rows", "Each row has a key"], "answer": 1, "explanation": "Denormalization improves the inverse lookup but introduces multiple writes. The row-level mutation guarantee does not become a cross-table transaction.", "id": "c0138", "index": 137, "pdf_source_start": 127, "pdf_source_end": 130, "words": 35, "search": "recall: two updates a relationship is written to a forward table and an inverse table. what guarantee is missing? denormalization improves the inverse lookup but introduces multiple writes. the row-level mutation guarantee does not become a cross-table transaction. chapter recall {}", "pdf_page": 144, "answer_page": 378}, {"module": "5", "section": {"name": "The two kinds of coprocessors", "start": 126, "end": 131}, "title": "Push computation toward the data", "body": "A coprocessor runs application logic inside HBase server processes. The chapter motivates it as a way to avoid moving large amounts of data to a client or to extend existing behavior. This is more powerful than a client helper function because it executes where the data is served. That location also gives mistakes a much larger potential impact.", "takeaway": "Server-side execution is both an optimization opportunity and an operational responsibility.", "kind": "lesson", "id": "c0139", "index": 138, "pdf_source_start": 153, "pdf_source_end": 158, "words": 69, "search": "push computation toward the data a coprocessor runs application logic inside hbase server processes. the chapter motivates it as a way to avoid moving large amounts of data to a client or to extend existing behavior. this is more powerful than a client helper function because it executes where the data is served. that location also gives mistakes a much larger potential impact. server-side execution is both an optimization opportunity and an operational responsibility. the two kinds of coprocessors {}", "pdf_page": 145}, {"module": "5", "section": {"name": "The two kinds of coprocessors", "start": 126, "end": 131}, "title": "Observers intercept existing operations", "body": "An observer participates in hooks around operations already performed by HBase. Pre- and post-hooks let code react around an event such as a mutation. The chapter introduces RegionObserver, WALObserver, and MasterObserver for different scopes. Picking a hook is picking a location in the system's lifecycle, not simply naming an ordinary Java callback.", "takeaway": "An observer attaches behavior to an existing HBase event.", "kind": "lesson", "id": "c0140", "index": 139, "pdf_source_start": 153, "pdf_source_end": 158, "words": 61, "search": "observers intercept existing operations an observer participates in hooks around operations already performed by hbase. pre- and post-hooks let code react around an event such as a mutation. the chapter introduces regionobserver, walobserver, and masterobserver for different scopes. picking a hook is picking a location in the system's lifecycle, not simply naming an ordinary java callback. an observer attaches behavior to an existing hbase event. the two kinds of coprocessors {}", "pdf_page": 146}, {"module": "5", "section": {"name": "The two kinds of coprocessors", "start": 126, "end": 131}, "title": "Endpoints expose a new operation", "body": "An endpoint makes custom functionality callable by the client. Rather than fetch every row and aggregate locally, the client can ask regions to compute a partial result and then combine those partials. The endpoint interface describes what is remotely invoked; its server implementation performs the region-local work.", "takeaway": "An endpoint is an additional RPC-style operation, not a hook around a normal Put.", "kind": "lesson", "visual": {"type": "table", "headers": ["Type", "How it begins", "Book example"], "rows": [["Observer", "An existing operation triggers a hook", "Maintain an inverse relationship index"], ["Endpoint", "A client calls the custom operation", "Compute counts near the data"]], "caption": "The central distinction in section 5.1."}, "id": "c0141", "index": 140, "pdf_source_start": 153, "pdf_source_end": 158, "words": 61, "search": "endpoints expose a new operation an endpoint makes custom functionality callable by the client. rather than fetch every row and aggregate locally, the client can ask regions to compute a partial result and then combine those partials. the endpoint interface describes what is remotely invoked; its server implementation performs the region-local work. an endpoint is an additional rpc-style operation, not a hook around a normal put. the two kinds of coprocessors {\"type\": \"table\", \"headers\": [\"type\", \"how it begins\", \"book example\"], \"rows\": [[\"observer\", \"an existing operation triggers a hook\", \"maintain an inverse relationship index\"], [\"endpoint\", \"a client calls the custom operation\", \"compute counts near the data\"]], \"caption\": \"the central distinction in section 5.1.\"}", "pdf_page": 147}, {"module": "5", "section": {"name": "The two kinds of coprocessors", "start": 126, "end": 131}, "title": "Hook scope determines available context", "body": "Region hooks concern data and region activity. WAL hooks concern log-related events. Master hooks concern administrative operations such as table management. A task should be attached where the required context exists. Using a server-side extension does not mean that every extension sees every event at every scope.", "takeaway": "Place the behavior at the layer that owns the event.", "kind": "lesson", "id": "c0142", "index": 141, "pdf_source_start": 153, "pdf_source_end": 158, "words": 57, "search": "hook scope determines available context region hooks concern data and region activity. wal hooks concern log-related events. master hooks concern administrative operations such as table management. a task should be attached where the required context exists. using a server-side extension does not mean that every extension sees every event at every scope. place the behavior at the layer that owns the event. the two kinds of coprocessors {}", "pdf_page": 148}, {"module": "5", "section": {"name": "The two kinds of coprocessors", "start": 126, "end": 131}, "title": "Coprocessors are not a sandbox", "body": "The chapter explicitly warns that coprocessors run in the server process without the isolation one might expect from an external service. Slow or faulty code can hurt the server's work. Dependency conflicts also become server problems. The examples are therefore not permission to deploy arbitrary code merely because it compiles.", "takeaway": "Treat coprocessor code as code inside the database's failure boundary.", "kind": "source-note", "id": "c0143", "index": 142, "pdf_source_start": 153, "pdf_source_end": 158, "words": 60, "search": "coprocessors are not a sandbox the chapter explicitly warns that coprocessors run in the server process without the isolation one might expect from an external service. slow or faulty code can hurt the server's work. dependency conflicts also become server problems. the examples are therefore not permission to deploy arbitrary code merely because it compiles. treat coprocessor code as code inside the database's failure boundary. the two kinds of coprocessors {}", "pdf_page": 149}, {"module": "5", "section": {"name": "Implementing an observer", "start": 131, "end": 137}, "title": "The inverse-index observer has a precise job", "body": "TwitBase writes a forward relationship. The observer creates the corresponding reverse orientation so follower queries have a targeted lookup. The schema needs enough information in the incoming mutation to construct that inverse row. This is a concrete example of aligning extension behavior with the denormalized access path designed in chapter 4.", "takeaway": "An observer needs the identifiers required to build its secondary representation.", "kind": "lesson", "id": "c0144", "index": 143, "pdf_source_start": 158, "pdf_source_end": 164, "words": 62, "search": "the inverse-index observer has a precise job twitbase writes a forward relationship. the observer creates the corresponding reverse orientation so follower queries have a targeted lookup. the schema needs enough information in the incoming mutation to construct that inverse row. this is a concrete example of aligning extension behavior with the denormalized access path designed in chapter 4. an observer needs the identifiers required to build its secondary representation. implementing an observer {}", "pdf_page": 150}, {"module": "5", "section": {"name": "Implementing an observer", "start": 131, "end": 137}, "title": "Inspect the mutation before doing work", "body": "The observer should first decide whether the incoming Put belongs to the relationship shape it handles. Unrelated mutations should not trigger inverse-index work. This check avoids unnecessary remote operations and makes the extension's scope visible. The book's implementation uses its table and key conventions to recognize the relevant records.", "takeaway": "A narrow trigger is part of a safe observer design.", "kind": "lesson", "id": "c0145", "index": 144, "pdf_source_start": 158, "pdf_source_end": 164, "words": 59, "search": "inspect the mutation before doing work the observer should first decide whether the incoming put belongs to the relationship shape it handles. unrelated mutations should not trigger inverse-index work. this check avoids unnecessary remote operations and makes the extension's scope visible. the book's implementation uses its table and key conventions to recognize the relevant records. a narrow trigger is part of a safe observer design. implementing an observer {}", "pdf_page": 151}, {"module": "5", "section": {"name": "Implementing an observer", "start": 131, "end": 137}, "title": "Avoid processing your own derived writes forever", "body": "An inverse write can itself reach observer hooks. Without a way to distinguish the derived representation, an observer can repeatedly create new derived operations. The chapter's schema and checks prevent that recursion. Read those conditions before focusing on the mutation-building code: the guard explains why the extension stops.", "takeaway": "A derived write must not recursively regenerate the same work without a stopping condition.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Forward Put", "Recognize source shape", "Build inverse Put", "Ignore inverse shape"], "caption": "The inverse-index observer needs a guard against reprocessing its own derived representation.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Forward Put<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Recognize<\/text><text x=\"242.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">source shape<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"397.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Build inverse<\/text><text x=\"397.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\" ent)\\n\\nstop(environment):\\n    release_reusable_resources()\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "start(environment):\n    create_reusable_resources()\n\non_relevant_event(event):\n    perform_only_required_work(event)\n\nstop(environment):\n    release_reusable_resources()", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 153}, {"module": "5", "section": {"name": "Implementing an observer", "start": 131, "end": 137}, "title": "A post-hook adds work to the write path", "body": "A derived write is extra work, potentially involving another region or server. Running it from an observer does not make that cost disappear. The source's example is useful for understanding where the work is triggered, but it does not specify a complete cross-row transaction or every failure-recovery case. Keep the limits of the row guarantee visible.", "takeaway": "A postPut extension is not automatically an atomic transaction over both index orientations.", "kind": "lesson", "id": "c0148", "index": 147, "pdf_source_start": 158, "pdf_source_end": 164, "words": 69, "search": "a post-hook adds work to the write path a derived write is extra work, potentially involving another region or server. running it from an observer does not make that cost disappear. the source's example is useful for understanding where the work is triggered, but it does not specify a complete cross-row transaction or every failure-recovery case. keep the limits of the row guarantee visible. a postput extension is not automatically an atomic transaction over both index orientations. implementing an observer {}", "pdf_page": 154}, {"module": "5", "section": {"name": "Implementing an observer", "start": 131, "end": 137}, "title": "Package, install, and check the scope", "body": "The book demonstrates table-level installation through a coprocessor specification containing a JAR location, class name, priority, and arguments. It also discusses classpath and global-configuration approaches. These mechanisms have different deployment scopes. The exact syntax is release-specific; the general reading task is to identify which tables and server processes will load the code.", "takeaway": "Installation scope matters as much as the extension's class name.", "kind": "lesson", "id": "c0149", "index": 148, "pdf_source_start": 158, "pdf_source_end": 164, "words": 62, "search": "package, install, and check the scope the book demonstrates table-level installation through a coprocessor specification containing a jar location, class name, priority, and arguments. it also discusses classpath and global-configuration approaches. these mechanisms have different deployment scopes. the exact syntax is release-specific; the general reading task is to identify which tables and server processes will load the code. installation scope matters as much as the extension's class name. implementing an observer {}", "pdf_page": 155}, {"module": "5", "section": {"name": "Implementing an observer", "start": 131, "end": 137}, "title": "Describe is not a behavior test", "body": "Seeing a coprocessor listed in a table description verifies configuration, not its full runtime behavior. The chapter follows deployment with example writes and reads. That extra step can reveal class-loading, key-construction, or trigger problems that a configuration listing alone cannot detect. A successful compile is only one stage of the test.", "takeaway": "Test the expected derived data after loading the extension.", "kind": "lesson", "id": "c0150", "index": 149, "pdf_source_start": 158, "pdf_source_end": 164, "words": 60, "search": "describe is not a behavior test seeing a coprocessor listed in a table description verifies configuration, not its full runtime behavior. the chapter follows deployment with example writes and reads. that extra step can reveal class-loading, key-construction, or trigger problems that a configuration listing alone cannot detect. a successful compile is only one stage of the test. test the expected derived data after loading the extension. implementing an observer {}", "pdf_page": 156}, {"module": "5", "section": {"name": "Implementing an endpoint", "start": 137, "end": 142}, "title": "Define a small endpoint contract", "body": "The follower-count example exposes a method for the server to perform. The client calls the interface rather than knowing all of the internal scanner code. That boundary should make the input range and returned quantity clear. The chapter uses its older coprocessor RPC interface; preserve that historical setting when reading the implementation.", "takeaway": "The endpoint contract should say exactly what regional result is returned.", "kind": "lesson", "id": "c0151", "index": 150, "pdf_source_start": 164, "pdf_source_end": 169, "words": 63, "search": "define a small endpoint contract the follower-count example exposes a method for the server to perform. the client calls the interface rather than knowing all of the internal scanner code. that boundary should make the input range and returned quantity clear. the chapter uses its older coprocessor rpc interface; preserve that historical setting when reading the implementation. the endpoint contract should say exactly what regional result is returned. implementing an endpoint {}", "pdf_page": 157}, {"module": "5", "section": {"name": "Implementing an endpoint", "start": 137, "end": 142}, "title": "Project the count's unit correctly", "body": "The example configures its scan so each relevant relationship contributes the intended amount of work to the count. Counting KeyValues is only equivalent to counting rows if the projection and version settings make that equivalence true. A row with several cells or retained versions can otherwise contribute more than one item.", "takeaway": "Before counting cells, prove that one cell represents the entity you want to count.", "kind": "lesson", "visual": {"type": "code", "text": "// Conceptual endpoint algorithm, not an API-complete listing.\nscan = select_relationship_cells(one_version = true)\ncount = 0\nfor each selected relationship in this_region(scan):\n    count += 1\nreturn count", "caption": "Companion pseudocode of the chapter 5 count. Projection defines the counted unit."}, "id": "c0152", "index": 151, "pdf_source_start": 164, "pdf_source_end": 169, "words": 65, "search": "project the count's unit correctly the example configures its scan so each relevant relationship contributes the intended amount of work to the count. counting keyvalues is only equivalent to counting rows if the projection and version settings make that equivalence true. a row with several cells or retained versions can otherwise contribute more than one item. before counting cells, prove that one cell represents the entity you want to count. implementing an endpoint {\"type\": \"code\", \"text\": \"// conceptual endpoint algorithm, not an api-complete listing.\\nscan = select_relationship_cells(one_version = true)\\ncount = 0\\nfor each selected relationship in this_region(scan):\\n    count += 1\\nreturn count\", \"caption\": \"companion pseudocode of the chapter 5 count. projection defines the counted unit.\"}", "pdf_page": 158}, {"module": "5", "section": {"name": "Implementing an endpoint", "start": 137, "end": 142}, "title": "InternalScanner has a last-batch detail", "body": "A scanner can fill the result collection on the same call that reports there is no further batch after it. The chapter's loop processes that final collection, clears reused state, and closes the scanner. These mechanics matter to a count: skipping the last returned batch or counting a reused list twice changes the answer.", "takeaway": "Interpret the continuation flag separately from the data just returned.", "kind": "lesson", "id": "c0153", "index": 152, "pdf_source_start": 164, "pdf_source_end": 169, "words": 64, "search": "internalscanner has a last-batch detail a scanner can fill the result collection on the same call that reports there is no further batch after it. the chapter's loop processes that final collection, clears reused state, and closes the scanner. these mechanics matter to a count: skipping the last returned batch or counting a reused list twice changes the answer. interpret the continuation flag separately from the data just returned. implementing an endpoint {}", "pdf_page": 159}, {"module": "5", "section": {"name": "Implementing an endpoint", "start": 137, "end": 142}, "title": "Combine regional partial results", "body": "The client invokes the endpoint across relevant regions and adds their partial counts. If the regional contributions are 4, 6, and 3, the client total is 13. The arithmetic is small because the server returns aggregates instead of whole relationship rows. This is the mechanism behind the reduced network result size, not evidence that scanning work vanished.", "takeaway": "Local computation reduces returned data, while the underlying scan still performs work.", "kind": "lesson", "visual": {"type": "partials", "caption": "Illustrative partials 4 + 6 + 3 = 13. The source uses regional aggregation rather than transferring all matching rows.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"15\" width=\"170\" height=\"60\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"105.0\" y=\"51.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Region 1: 4<\/text><polyline points=\"105,78 105,112 320,112 320,138\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M316.0853101929989 129.8959760788259 L320 138 L323.9146898070011 129.8959760788259\" fi 29989 129.8959760788259 l320 138 l323.9146898070011 129.8959760788259\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"210\\\" y=\\\"140\\\" width=\\\"220\\\" height=\\\"60\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"320.0\\\" y=\\\"176.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">client sum = 13<\/text><\/svg>\"}", "pdf_page": 160}, {"module": "5", "section": {"name": "Implementing an endpoint", "start": 137, "end": 142}, "title": "Use the right extension for the task", "body": "An inverse-index update is a reaction to a normal write, so an observer fits the example. A request for a custom aggregate is an explicit call, so an endpoint fits. Both require careful data scope, deployment, and testing. The chapter's final lesson is not 'put everything in coprocessors'; it is understanding these two extension points and their costs.", "takeaway": "Choose between reacting to an operation and exposing a new operation.", "kind": "lesson", "id": "c0155", "index": 154, "pdf_source_start": 164, "pdf_source_end": 169, "words": 69, "search": "use the right extension for the task an inverse-index update is a reaction to a normal write, so an observer fits the example. a request for a custom aggregate is an explicit call, so an endpoint fits. both require careful data scope, deployment, and testing. the chapter's final lesson is not 'put everything in coprocessors'; it is understanding these two extension points and their costs. choose between reacting to an operation and exposing a new operation. implementing an endpoint {}", "pdf_page": 161}, {"module": "5", "section": {"name": "Chapter recall", "start": 127, "end": 131}, "title": "Recall: which extension", "body": "You need a custom regional aggregation called explicitly by a client. Which type matches?", "takeaway": "Endpoints expose new callable operations. Observers intercept events around operations that already exist.", "kind": "quiz", "choices": ["Observer only", "A column-family name", "Endpoint"], "answer": 2, "explanation": "Endpoints expose new callable operations. Observers intercept events around operations that already exist.", "id": "c0156", "index": 155, "pdf_source_start": 154, "pdf_source_end": 158, "words": 27, "search": "recall: which extension you need a custom regional aggregation called explicitly by a client. which type matches? endpoints expose new callable operations. observers intercept events around operations that already exist. chapter recall {}", "pdf_page": 162, "answer_page": 379}, {"module": "5", "section": {"name": "Chapter recall", "start": 138, "end": 140}, "title": "Recall: counting the wrong thing", "body": "A row has four selected cells. The endpoint counts every KeyValue. Can that count automatically be interpreted as one relationship per row?", "takeaway": "The source's count relies on its scan projection and version choice. Counting cells is not generally identical to counting rows.", "kind": "quiz", "choices": ["No, the projection must make the counted unit match the entity", "Yes, compaction changes four into one", "Yes, every row is always one KeyValue"], "answer": 0, "explanation": "The source's count relies on its scan projection and version choice. Counting cells is not generally identical to counting rows.", "id": "c0157", "index": 156, "pdf_source_start": 165, "pdf_source_end": 167, "words": 42, "search": "recall: counting the wrong thing a row has four selected cells. the endpoint counts every keyvalue. can that count automatically be interpreted as one relationship per row? the source's count relies on its scan projection and version choice. counting cells is not generally identical to counting rows. chapter recall {}", "pdf_page": 163, "answer_page": 380}, {"module": "5", "section": {"name": "Chapter recall", "start": 132, "end": 135}, "title": "Recall: safe recursion", "body": "Why recognize and ignore an inverse-index write in the observer?", "takeaway": "An observer can encounter writes caused by the observer itself. The representation check provides a stopping condition for the derived operation.", "kind": "quiz", "choices": ["To make the Master store every relationship", "To avoid repeatedly deriving another inverse write from it", "To prevent all HBase reads"], "answer": 1, "explanation": "An observer can encounter writes caused by the observer itself. The representation check provides a stopping condition for the derived operation.", "id": "c0158", "index": 157, "pdf_source_start": 159, "pdf_source_end": 162, "words": 31, "search": "recall: safe recursion why recognize and ignore an inverse-index write in the observer? an observer can encounter writes caused by the observer itself. the representation check provides a stopping condition for the derived operation. chapter recall {}", "pdf_page": 164, "answer_page": 381}, {"module": "5", "section": {"name": "Chapter recall", "start": 135, "end": 142}, "title": "Recall: installation proof", "body": "Describe lists the coprocessor. What should the learning test still do?", "takeaway": "Configuration visibility is not a full runtime test. Example operations check that the hook executes and produces the intended data.", "kind": "quiz", "choices": ["Assume every class and key path is correct", "Delete all regions", "Exercise the intended behavior with actual example operations"], "answer": 2, "explanation": "Configuration visibility is not a full runtime test. Example operations check that the hook executes and produces the intended data.", "id": "c0159", "index": 158, "pdf_source_start": 162, "pdf_source_end": 169, "words": 31, "search": "recall: installation proof describe lists the coprocessor. what should the learning test still do? configuration visibility is not a full runtime test. example operations check that the hook executes and produces the intended data. chapter recall {}", "pdf_page": 165, "answer_page": 382}, {"module": "6", "section": {"name": "Scripting the shell from UNIX and JRuby", "start": 143, "end": 150}, "title": "Java is not the only application language", "body": "HBase is implemented in Java, but applications can reach it through several interfaces. Chapter 6 compares the shell, JRuby, REST, Thrift, and asynchbase. Some wrap the standard Java client; others expose a gateway or use a different implementation. The choice changes deployment, serialization, and concurrency concerns as well as syntax.", "takeaway": "Choose a client by its runtime and interaction model, not just its language name.", "kind": "lesson", "id": "c0160", "index": 159, "pdf_source_start": 170, "pdf_source_end": 177, "words": 64, "search": "java is not the only application language hbase is implemented in java, but applications can reach it through several interfaces. chapter 6 compares the shell, jruby, rest, thrift, and asynchbase. some wrap the standard java client; others expose a gateway or use a different implementation. the choice changes deployment, serialization, and concurrency concerns as well as syntax. choose a client by its runtime and interaction model, not just its language name. scripting the shell from unix and jruby {\"type\": \"table\", \"headers\": [\"interface\", \"location of adaptation\"], \"rows\": [[\"jruby\", \"java api on the jvm\"], [\"rest\", \"http gateway\"], [\"thrift\", \"generated bindings + gateway\"], [\"asynchbase\", \"alternative asynchronous java client\"]], \"caption\": \"study comparison based on the cited section.\"}", "visual": {"type": "table", "headers": ["Interface", "Location of adaptation"], "rows": [["JRuby", "Java API on the JVM"], ["REST", "HTTP gateway"], ["Thrift", "Generated bindings + gateway"], ["Asynchbase", "Alternative asynchronous Java client"]], "caption": "Study comparison based on the cited section."}, "pdf_page": 166}, {"module": "6", "section": {"name": "Scripting the shell from UNIX and JRuby", "start": 144, "end": 146}, "title": "Batch shell commands are still client operations", "body": "A UNIX script can pass commands into the HBase shell instead of requiring a person to type them. This is useful for repeatable schema setup and administrative tasks. It does not bypass HBase's normal operations. The example demonstrates how a small script can reuse shell functionality instead of creating a separate Java program for every task.", "takeaway": "Automating the shell changes the input method, not the database semantics.", "kind": "lesson", "id": "c0161", "index": 160, "pdf_source_start": 171, "pdf_source_end": 173, "words": 67, "search": "batch shell commands are still client operations a unix script can pass commands into the hbase shell instead of requiring a person to type them. this is useful for repeatable schema setup and administrative tasks. it does not bypass hbase's normal operations. the example demonstrates how a small script can reuse shell functionality instead of creating a separate java program for every task. automating the shell changes the input method, not the database semantics. scripting the shell from unix and jruby {\"type\": \"code\", \"text\": \"hbase shell <<'hbase_commands'\\nlist\\ndescribe 'users'\\nexit\\nhbase_commands\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "hbase shell <<'HBASE_COMMANDS'\nlist\ndescribe 'users'\nexit\nHBASE_COMMANDS", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 167}, {"module": "6", "section": {"name": "Scripting the shell from UNIX and JRuby", "start": 143, "end": 150}, "title": "Separate script inputs from schema commands", "body": "The chapter's shell scripts parameterize names so an example can be reused in different environments. A script should make its target table and family visible before it runs. Reusability does not remove the risk of pointing a schema-changing command at the wrong place. In this companion the examples are reading exercises, not buttons that mutate a cluster.", "takeaway": "A repeatable script still needs an explicit target.", "kind": "lesson", "id": "c0162", "index": 161, "pdf_source_start": 170, "pdf_source_end": 177, "words": 65, "search": "separate script inputs from schema commands the chapter's shell scripts parameterize names so an example can be reused in different environments. a script should make its target table and family visible before it runs. reusability does not remove the risk of pointing a schema-changing command at the wrong place. in this companion the examples are reading exercises, not buttons that mutate a cluster. a repeatable script still needs an explicit target. scripting the shell from unix and jruby {}", "pdf_page": 168}, {"module": "6", "section": {"name": "Scripting the shell from UNIX and JRuby", "start": 143, "end": 150}, "title": "JRuby can call the Java API", "body": "The shell runs on the JVM and can interact with Java classes. Its JRuby environment exposes objects used to access HBase and format results. This allows richer loops and helper functions than a sequence of basic shell commands. The underlying table handles, command objects, and byte conversions are still the same concepts learned earlier.", "takeaway": "A different JVM language can reuse the Java client without a network gateway.", "kind": "lesson", "id": "c0163", "index": 162, "pdf_source_start": 170, "pdf_source_end": 177, "words": 67, "search": "jruby can call the java api the shell runs on the jvm and can interact with java classes. its jruby environment exposes objects used to access hbase and format results. this allows richer loops and helper functions than a sequence of basic shell commands. the underlying table handles, command objects, and byte conversions are still the same concepts learned earlier. a different jvm language can reuse the java client without a network gateway. scripting the shell from unix and jruby {}", "pdf_page": 169}, {"module": "6", "section": {"name": "Scripting the shell from UNIX and JRuby", "start": 143, "end": 150}, "title": "Use iteration and formatting as separate steps", "body": "The JRuby example accesses the users table, iterates results, and presents them through the shell's formatter. Reading data and choosing its display format are separate responsibilities. This mirrors UsersDAO and UsersTool from chapter 2, even though the syntax is different. It is a useful way to recognize the same application structure across languages.", "takeaway": "Changing the presentation layer does not change the table's data coordinates.", "kind": "lesson", "id": "c0164", "index": 163, "pdf_source_start": 170, "pdf_source_end": 177, "words": 64, "search": "use iteration and formatting as separate steps the jruby example accesses the users table, iterates results, and presents them through the shell's formatter. reading data and choosing its display format are separate responsibilities. this mirrors usersdao and userstool from chapter 2, even though the syntax is different. it is a useful way to recognize the same application structure across languages. changing the presentation layer does not change the table's data coordinates. scripting the shell from unix and jruby {}", "pdf_page": 170}, {"module": "6", "section": {"name": "HBase over REST", "start": 150, "end": 156}, "title": "A REST gateway adds another service", "body": "A non-Java client can send HTTP requests to a REST service, which then uses HBase access internally. The gateway needs to be started and operated in addition to the cluster. It can become a bottleneck or an additional failure point. Its convenience is therefore an architectural choice, not simply a different spelling of a direct client call.", "takeaway": "A gateway is a real process in the request path.", "kind": "lesson", "visual": {"t as xml, json, protocol buffers, or raw bytes. http headers tell the service which representation the client can consume. a response body must be interpreted according to that representation; a base64 string in a json field is not necessarily the original cell text. distinguish the cell value from its transport encoding. a serialized response can contain an encoded form of the stored bytes. hbase over rest {}", "pdf_page": 172}, {"module": "6", "section": {"name": "HBase over REST", "start": 150, "end": 156}, "title": "Paths locate table data", "body": "The REST examples express the table, row, and optionally family/qualifier in the request path. This mirrors the coordinate model rather than inventing a relational query language. A narrow path can express a specific lookup; scanning uses additional service behavior. Reading the URL structure is therefore another way to practice the underlying HBase model.", "takeaway": "The protocol changes; the row and column coordinates remain central.", "kind": "lesson", "id": "c0167", "index": 166, "pdf_source_start": 177, "pdf_source_end": 183, "words": 63, "search": "paths locate table data the rest examples express the table, row, and optionally family/qualifier in the request path. this mirrors the coordinate model rather than inventing a relational query language. a narrow path can express a specific lookup; scanning uses additional service behavior. reading the url structure is therefore another way to practice the underlying hbase model. the protocol changes; the row and column coordinates remain central. hbase over rest {}", "pdf_page": 173}, {"module": "6", "section": {"name": "HBase over REST", "start": 150, "end": 156}, "title": "Base64 is transport encoding", "body": "The chapter's structured responses encode byte-oriented fields such as rowkeys, columns, and values. Base64 represents arbitrary bytes safely in a textual payload; it does not encrypt or semantically interpret them. After decoding, the application still nnerget(scanner_id)\\n        process(rows)\\nfinally:\\n    client.scannerclose(scanner_id)\\n    transport.close()\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "scanner_id = client.scannerOpen(...)\ntry:\n    while more_rows:\n        rows = client.scannerGet(scanner_id)\n        process(rows)\nfinally:\n    client.scannerClose(scanner_id)\n    transport.close()", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 179}, {"module": "6", "section": {"name": "Thrift gateway from Python", "start": 156, "end": 162}, "title": "TRowResult contains byte-oriented cells", "body": "The Python example receives row results containing a columns mapping whose entries hold cell data and timestamps. That is a different object shape from Java Result, but it describes the same kind of coordinates and values. Reading a new client API becomes easier when you map its objects back to the model rather than memorize names alone.", "takeaway": "Translate the response shape back into row, column, timestamp, and value.", "kind": "lesson", "id": "c0174", "index": 173, "pdf_source_start": 183, "pdf_source_end": 189, "words": 68, "search": "trowresult contains byte-oriented cells the python example receives row results containing a columns mapping whose entries hold cell data and timestamps. that is a different object shape from java result, but it describes the same kind of coordinates and values. reading a new client api becomes easier when you map its objects back to the model rather than memorize names alone. translate the response shape back into row, column, timestamp, and value. thrift gateway from python {}", "pdf_page": 180}, {"module": "6", "section": {"name": "Thrift gateway from Python", "start": 156, "end": 162}, "title": "Gateway deployment is part of client choice", "body": "Both REST and Thrift require a server-side gateway. A service that understands the external protocol turns requests into HBase work. Therefore the operational choice includes capacity, accessibility, lifecycle, and compatibility of that process. A language client may be easy to generate but still depends on a correctly configured gateway.", "takeaway": "Non-Java convenience has an infrastructure cost to account for.", "kind": "lesson", "id": "c0175", "index": 174, "pdf_source_start": 183, "pdf_source_end": 189, "words": 58, "search": "gateway deployment is part of client choice both rest and thrift require a server-side gateway. a service that understands the external protocol turns requests into hbase work. therefore the operational choice includes capacity, accessibility, lifecycle, and compatibility of that process. a language client may be easy to generate but still depends on a correctly configured gateway. non-java convenience has an infrastructure cost to account for. thrift gateway from python {}", "pdf_page": 181}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 162, "end": 177}, "title": "Asynchronous is an interaction model", "body": "The chapter introduces asynchbase as an alternative Java client built around asynchronous, nonblocking operations. A request returns a Deferred representing work that will finish later. Code attaches callbacks rather than necessarily waiting immediately. The historical library and dependency versions are not current recommendations; the lesson is how asynchronous control flow differs from straight-line blocking code.", "takeaway": "Returning a handle to future work lets the caller do other work first.", "kind": "lesson", "id": "c0176", "index": 175, "pdf_source_start": 189, "pdf_source_end": 204, "words": 68, "search": "asynchronous is an interaction model the chapter introduces asynchbase as an alternative java client built around asynchronous, nonblocking operations. a request returns a deferred representing work that will finish later. code attaches callbacks rather than necessarily waiting immediately. the historical library and dependency versions are not current recommendations; the lesson is how asynchronous control flow differs from straight-line blocking code. returning a handle to future work lets the caller do other work first. asynchbase and the password-update pipeline {}", "pdf_page": 182}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 162, "end": 177}, "title": "A Deferred has success and failure paths", "body": "A success callback processes a completed value. An error callback processes a failed operation. The book's password-update example carries enough context to explain which user succeeded or failed. Omitting the failure branch does not eliminate failures; it only makes them harder to handle and report coherently.", "takeaway": "Design the error path alongside the successful result path.", "kind": "lesson", "id": "c0177", "index": 176, "pdf_source_start": 189, "pdf_source_end": 204, "words": 55, "search": "a deferred has success and failure paths a success callback processes a completed value. an error callback processes a failed operation. the book's password-update example carries enough context to explain which user succeeded or failed. omitting the failure branch does not eliminate failures; it only makes them harder to handle and report coherently. design the error path alongside the successful result path. asynchbase and the password-update pipeline {\"type\": \"table\", \"headers\": [\"outcome\", \"meaning\", \"next application concern\"], \"rows\": [[\"true\", \"expected value matched; update applied\", \"report completion\"], [\"false\", \"condition did not match\", \"decide how to handle the conflict\"], [\"exception\", \"operation failed\", \"preserve error context\"]], \"caption\": \"conceptual branches of the chapter's conditional update pipeline.\"}", "visual": {"type": "table", "headers": ["Outcome", "Meaning", "Next application concern"], "rows": [["true", "Expected value matched; update applied", "Report completion"], ["false", "Condition did not match", "Decide how to handle the conflict"], ["Exception", "Operation failed", "Preserve error context"]], "caption": "Conceptual branches of the chapter's conditional update pipeline."}, "pdf_page": 183}, {"module": "6", "section": {"name": "Asynchbase and the password-update pipeline", "start": 162, "end": 177}, "title": "Joining immediately can serialize the loop", "body": "A blocking join waits for the Deferred to finish. If each asynchronous request is followed immediately by a join before the next request is issued, the application gives up much of the overlap it sought. The chapter first shows simple blocking behavior, then builds chains and groups to demonstrate why the asynchronous interface exists.", "takeaway": "An asynchronous API used with immediate waits can still produce serial behavior.", "kind": "lesson", "visual": {"type": "async", "caption": "Conceptual contrast: issue/wait/issue/wait versus issue several operations and combine completion results.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><text x=\"20\" y=\"25\" text-anchor=\"start\" font-family=\"DejaVu Sans\" font-size=\"18\" font-weight=\"bold\" fill=\"#173344\">Immediate waits<\/text><text x=\"20\" y=\"126\" text-anchor=\"start\" font-family=\"DejaVu Sans\" font-size=\"18\" font-weight=\"bold\" fill=\"#173344\">Issue, then combine<\/text><rect x=\"20\" y=\"40\" width=\"135\" height=\"48\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">issue A<\/text><rect x=\"175\" y=\"40\" width=\"135\" height=\"48\" rx=\"10\" fill=\"#FBEDDE\"
