80700107 l173.0 75 l164.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"175.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"242.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">move regions<\/text><polyline points=\\\"312.0,75 328.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m319.8959760788259 78.91468980700107 l328.0 75 l319.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"330.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"397.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">stop gateways<\/text><polyline points=\\\"467.0,75 483.0,75\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m474.8959760788259 78.91468980700107 l483.0 75 l474.8959760788259 71.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">stop<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">regionserver<\/text><\/svg>\"}", "pdf_page": 303}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Decommissioning also changes inventory", "body": "Stopping a server once does not ensure it stays out of the cluster. If automation still lists it as an expected RegionServer host, it may be started again. The chapter therefore separates graceful shutdown from removing the node from management configuration. Operational state and desired deployment state both need attention.", "takeaway": "Remove a decommissioned node from the system that would otherwise restart it.", "kind": "lesson", "id": "c0298", "index": 297, "pdf_source_start": 310, "pdf_source_end": 320, "words": 62, "search": "decommissioning also changes inventory stopping a server once does not ensure it stays out of the cluster. if automation still lists it as an expected regionserver host, it may be started again. the chapter therefore separates graceful shutdown from removing the node from management configuration. operational state and desired deployment state both need attention. remove a decommissioned node from the system that would otherwise restart it. cluster management and everyday tools {}", "pdf_page": 304}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Add storage and serving roles coherently", "body": "The example assumes DataNode and RegionServer colocation. It adds the DataNode to HDFS, then starts the RegionServer and confirms it appears in the cluster. Rebalancing can move regions onto the new serving capacity. That may initially reduce locality, so successful membership is only the first observation to make.", "takeaway": "A new node must join the intended layers before it can help the workload.", "kind": "lesson", "id": "c0299", "index": 298, "pdf_source_start": 310, "pdf_source_end": 320, "words": 62, "search": "add storage and serving roles coherently the example assumes datanode and regionserver colocation. it adds the datanode to hdfs, then starts the regionserver and confirms it appears in the cluster. rebalancing can move regions onto the new serving capacity. that may initially reduce locality, so successful membership is only the first observation to make. a new node must join the intended layers before it can help the workload. cluster management and everyday tools {}", "pdf_page": 305}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Balancing region counts is not balancing every load", "body": "The source's balancer works from the distribution of regions across servers. Two equal region counts can still serve different request volumes or differently sized data. Do not infer perfect workload balance from an even number of assigned regions. The key distribution and current request pattern remain relevant.", "takeaway": "Count balance and work balance are different measurements.", "kind": "lesson", "id": "c0300", "index": 299, "pdf_source_start": 310, "pdf_source_end": 320, "words": 55, "search": "balancing region counts is not balancing every load the source's balancer works from the distribution of regions across servers. two equal region counts can still serve different request volumes or differently sized data. do not infer perfect workload balance from an even number of assigned regions. the key distribution and current request pattern remain relevant. count balance and work balance are different measurements. cluster management and everyday tools {}", "pdf_page": 306}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Rolling upgrades require compatibility and headroom", "body": "The chapter distinguishes compatible changes that can be rolled through nodes from incompatible changes requiring planned downtime. Taking one node out also requires enough remaining capacity. The old script sequence is not a universal upgrade plan. Read compatibility and release assumptions before assuming a restart order can preserve service.", "takeaway": "Rolling is possible only when both the software contract and the capacity permit it.", "kind": "lesson", "id": "c0301", "index": 300, "pdf_source_start": 310, "pdf_source_end": 320, "words": 63, "search": "rolling upgrades require compatibility and headroom the chapter distinguishes compatible changes that can be rolled through nodes from incompatible changes requiring planned downtime. taking one node out also requires enough remaining capacity. the old script sequence is not a universal upgrade plan. read compatibility and release assumptions before assuming a restart order can preserve service. rolling is possible only when both the software contract and the capacity permit it. cluster management and everyday tools {}", "pdf_page": 307}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Use status at the needed detail level", "body": "The shell provides summary, simple, and detailed status views. A summary helps establish whether servers are alive; a detailed view exposes regions, store files, memory, and other state. Ask a focused question before drowning in output. The same approach applies to log and metric inspection: choose the view that helps test the current hypothesis.", "takeaway": "Start broad enough to orient yourself, then inspect the relevant detail.", "kind": "lesson", "visual": {"type": "code", "text": "help 'status'\nstatus 'summary'\nstatus 'detailed'\ndescribe 'users'", "caption": "Non-mutating shell inspection examples from the book-era interface. Their exact output varies by release."}, "id": "c0302", "index": 301, "pdf_source_start": 310, "pdf_source_end": 320, "words": 65, "search": "use status at the needed detail level the shell provides summary, simple, and detailed status views. a summary helps establish whether servers are alive; a detailed view exposes regions, store files, memory, and other state. ask a focused question before drowning in output. the same approach applies to log and metric inspection: choose the view that helps test the current hypothesis. start broad enough to orient yourself, then inspect the relevant detail. cluster management and everyday tools {\"type\": \"code\", \"text\": \"help 'status'\\nstatus 'summary'\\nstatus 'detailed'\\ndescribe 'users'\", \"caption\": \"non-mutating shell inspection examples from the book-era interface. their exact output varies by release.\"}", "pdf_page": 308}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "A returned boolean can mean previous state", "body": "The book highlights that balance_switch returns the balancer's prior state, while balancer reports whether a balancing run occurred. A true result does not have one universal meaning across all shell commands. This small detail illustrates a larger operational rule: read a command's documented return contract instead of guessing from a familiar value.", "takeaway": "Interpret return values per command, not by intuition.", "kind": "lesson", "id": "c0303", "index": 302, "pdf_source_start": 310, "pdf_source_end": 320, "words": 60, "search": "a returned boolean can mean previous state the book highlights that balance_switch returns the balancer's prior state, while balancer reports whether a balancing run occurred. a true result does not have one universal meaning across all shell commands. this small detail illustrates a larger operational rule: read a command's documented return contract instead of guessing from a familiar value. interpret return values per command, not by intuition. cluster management and everyday tools {}", "pdf_page": 309}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Compaction and split commands change live work", "body": "The shell can request compaction or split a table or region. These operations can trigger substantial storage work and movement. The book treats them as tools requiring judgment rather than automatic cures. A hotspot may point back to a rowkey problem, and broad compaction during heavy load may worsen latency.", "takeaway": "Administrative capability does not imply that the operation is cheap or appropriate now.", "kind": "lesson", "id": "c0304", "index": 303, "pdf_source_start": 310, "pdf_source_end": 320, "words": 63, "search": "compaction and split commands change live work the shell can request compaction or split a table or region. these operations can trigger substantial storage work and movement. the book treats them as tools requiring judgment rather than automatic cures. a hotspot may point back to a rowkey problem, and broad compaction during heavy load may worsen latency. administrative capability does not imply that the operation is cheap or appropriate now. cluster management and everyday tools {}", "pdf_page": 310}, {"module": "10", "section": {"name": "Cluster management and everyday tools", "start": 283, "end": 293}, "title": "Schema changes and truncate have different effects", "body": "The book's schema-alter examples disable, alter, and re-enable a table. Truncate, by contrast, removes the data while recreating a table structure. Similar-looking shell interactions can have radically different consequences. This companion does not put destructive commands behind runnable controls or imply that old alteration steps are required in every later release.", "takeaway": "Read whether a command changes policy, availability, or the data itself.", "kind": "lesson", "id": "c0305", "index": 304, "pdf_source_start": 310, "pdf_source_end": 320, "words": 62, "search": "schema changes and truncate have different effects the book's schema-alter examples disable, alter, and re-enable a table. truncate, by contrast, removes the data while recreating a table structure. similar-looking shell interactions can have radically different consequences. this companion does not put destructive commands behind runnable controls or imply that old alteration steps are required in every later release. read whether a command changes policy, availability, or the data itself. cluster management and everyday tools {}", "pdf_page": 311}, {"module": "10", "section": {"name": "Consistency checks, file inspection, and presplitting", "start": 293, "end": 299}, "title": "Region assignment has an invariant", "body": "The hbck discussion defines a consistent region as assigned and deployed to the intended single RegionServer, with metadata reflecting that placement. Disagreement among metadata and actual deployment is an operational problem. This is a different meaning of consistency from the earlier discussion of a client's row-level read guarantee.", "takeaway": "Always name which consistency invariant is under examination.", "kind": "lesson", "id": "c0306", "index": 305, "pdf_source_start": 320, "pdf_source_end": 326, "words": 56, "search": "region assignment has an invariant the hbck discussion defines a consistent region as assigned and deployed to the intended single regionserver, with metadata reflecting that placement. disagreement among metadata and actual deployment is an operational problem. this is a different meaning of consistency from the earlier discussion of a client's row-level read guarantee. always name which consistency invariant is under examination. consistency checks, file inspection, and presplitting {}", "pdf_page": 312}, {"module": "10", "section": {"name": "Consistency checks, file inspection, and presplitting", "start": 293, "end": 299}, "title": "Table coverage has another invariant", "body": "Every possible rowkey should belong to exactly one region of the table. A gap leaves some key range without an owner; an overlap gives a range competing ownership descriptions. The checker's job includes detecting these structural inconsistencies. This is why region boundaries form more than a list of arbitrary partitions.", "takeaway": "A table's regions should cover the key space without gaps or overlaps.", "kind": "lesson", "visual": {"type": "coverage", "caption": "Illustrative healthy, overlapping, and gapped intervals. hbck checks structural invariants, not business-level data validity.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><text x=\"20\" y=\"53\" text-anchor=\"start\" font-family=\"DejaVu Sans\" font-size=\"16\" font-weight=\"bold\" fill=\"#173344\">Healthy<\/text><rect x=\"136\" y=\"30\" width=\"154\" height=\"35\" rx=\"3\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><rect x=\"290\" y=\"36\" width=\"154\" height=\"35\" rx=\"3\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><rect x=\"444\" y=\"30\" width=\"154\" height=\"35\" rx=\"3\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"20\" y=\"123\" text-anchor=\"start\" font-family=\"DejaVu Sans\" font-size=\"16\" font-weight=\"bold\" fill=\"#173344\">Overlap<\/text><rect x=\"136\" y=\"100\" width=\"231\" height=\"35\" rx=\"3\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><rect x=\"290\" y=\"106\" width=\"154\" height=\"35\" rx=\"3\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><rect x=\"444\" y=\"100\" width=\"154\" height=\"35\" rx=\"3\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"20\" y=\"193\" text-anchor=\"start\" font-family=\"DejaVu Sans\" font-size=\"16\" font-weight=\"bold\" fill=\"#173344\">Gap<\/text><rect x=\"136\" y=\"170\" width=\"154\" height=\"35\" rx=\"3\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><rect x=\"367\" y=\"176\" width=\"77\" height=\"35\" rx=\"3\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><rect x=\"444\" y=\"170\" width=\"154\" height=\"35\" rx=\"3\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><\/svg>"}, "id": "c0307", "index": 306, "pdf_source_start": 320, "pdf_source_end": 326, "words": 62, "search": "table coverage has another invariant every possible rowkey should belong to exactly one region of the table. a gap leaves some key range without an owner; an overlap gives a range competing ownership descriptions. the checker's job includes detecting these structural inconsistencies. this is why region boundaries form more than a list of arbitrary partitions. a table's regions should cover the key space without gaps or overlaps. consistency checks, file inspection, and presplitting {\"type\": \"coverage\", \"caption\": \"illustrative healthy, overlapping, and gapped intervals. hbck checks structural invariants, not business-level data validity.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><text x=\\\"20\\\" y=\\\"53\\\" text-anchor=\\\"start\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"16\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">healthy<\/text><rect x=\\\"136\\\" y=\\\"30\\\" width=\\\"154\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><rect x=\\\"290\\\" y=\\\"36\\\" width=\\\"154\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><rect x=\\\"444\\\" y=\\\"30\\\" width=\\\"154\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"20\\\" y=\\\"123\\\" text-anchor=\\\"start\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"16\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">overlap<\/text><rect x=\\\"136\\\" y=\\\"100\\\" width=\\\"231\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><rect x=\\\"290\\\" y=\\\"106\\\" width=\\\"154\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><rect x=\\\"444\\\" y=\\\"100\\\" width=\\\"154\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"20\\\" y=\\\"193\\\" text-anchor=\\\"start\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"16\\\" font-weight=\\\"bold\\\" fill=\\\"#173344\\\">gap<\/text><rect x=\\\"136\\\" y=\\\"170\\\" width=\\\"154\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><rect x=\\\"367\\\" y=\\\"176\\\" width=\\\"77\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><rect x=\\\"444\\\" y=\\\"170\\\" width=\\\"154\\\" height=\\\"35\\\" rx=\\\"3\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><\/svg>\"}", "pdf_page": 313}, {"module": "10", "section": {"name": "Consistency checks, file inspection, and presplitting", "start": 293, "end": 299}, "title": "A transient observation may not be a lasting fault", "body": "During a split or movement, a one-time checker result may catch intermediate state. The book advises repeating inspection over time before concluding that an inconsistency persists. This does not mean ignoring errors; it means distinguishing a normal transition from a stuck or corrupted state using evidence.", "takeaway": "Investigate persistence and context before choosing a repair.", "kind": "lesson", "id": "c0308", "index": 307, "pdf_source_start": 320, "pdf_source_end": 326, "words": 54, "search": "a transient observation may not be a lasting fault during a split or movement, a one-time checker result may catch intermediate state. the book advises repeating inspection over time before concluding that an inconsistency persists. this does not mean ignoring errors; it means distinguishing a normal transition from a stuck or corrupted state using evidence. investigate persistence and context before choosing a repair. consistency checks, file inspection, and presplitting {}", "pdf_page": 314}, {"module": "10", "section": {"name": "Consistency checks, file inspection, and presplitting", "start": 293, "end": 299}, "title": "Detection is not the same as repair", "body": "The source separates read-oriented checking from flags that modify assignments, catalog metadata, orphan regions, or overlaps. It repeatedly warns that repair is advanced and release-dependent. A broad repair command can change substantial state. This companion names the repair categories for understanding but is not an authorization or step-by-step production repair procedure.", "takeaway": "Do not turn a diagnostic result into an automatic destructive action.", "kind": "source-note", "id": "c0309", "index": 308, "pdf_source_start": 320, "pdf_source_end": 326, "words": 62, "search": "detection is not the same as repair the source separates read-oriented checking from flags that modify assignments, catalog metadata, orphan regions, or overlaps. it repeatedly warns that repair is advanced and release-dependent. a broad repair command can change substantial state. this companion names the repair categories for understanding but is not an authorization or step-by-step production repair procedure. do not turn a diagnostic result into an automatic destructive action. consistency checks, file inspection, and presplitting {\"type\": \"table\", \"headers\": [\"category\", \"meaning in the source\"], \"rows\": [[\"assignment mismatch\", \"catalog and serving location disagree\"], [\"missing region information\", \"catalog or filesystem metadata is incomplete\"], [\"overlapping ranges\", \"more than one region covers some keys\"], [\"repair\", \"advanced state-changing intervention\"]], \"caption\": \"study comparison based on the cited section.\"}", "visual": {"type": "table", "headers": ["Category", "Meaning in the source"], "rows": [["Assignment mismatch", "Catalog and serving location disagree"], ["Missing region information", "Catalog or filesystem metadata is incomplete"], ["Overlapping ranges", "More than one region covers some keys"], ["Repair", "Advanced state-changing intervention"]], "caption": "Study comparison based on the cited section."}, "pdf_page": 315}, {"module": "10", "section": {"name": "Consistency checks, file inspection, and presplitting", "start": 293, "end": 299}, "title": "Inspect WALs and HFiles with their own tools", "body": "The hlog utility reveals edits in a write-ahead log; hfile inspects file keys, metadata, block information, and statistics. These views help connect a logical row operation to its physical representation. A file-size statistic and an edit sequence answer different questions. The source supplies tools because low-level visibility can be useful when normal abstractions fail.", "takeaway": "Choose the inspection tool according to whether you need history or stored layout.", "kind": "lesson", "id": "c0310", "index": 309, "pdf_source_start": 320, "pdf_source_end": 326, "words": 67, "search": "inspect wals and hfiles with their own tools the hlog utility reveals edits in a write-ahead log; hfile inspects file keys, metadata, block information, and statistics. these views help connect a logical row operation to its physical representation. a file-size statistic and an edit sequence answer different questions. the source supplies tools because low-level visibility can be useful when normal abstractions fail. choose the inspection tool according to whether you need history or stored layout. consistency checks, file inspection, and presplitting {}", "pdf_page": 316}, {"module": "10", "section": {"name": "Consistency checks, file inspection, and presplitting", "start": 293, "end": 299}, "title": "Presplitting needs known key distribution", "body": "A new table can be created with explicit split boundaries so ingestion uses several regions from the beginning. The source recommends doing this when the expected key distribution is understood. Merely creating many ranges does not make future traffic evenly distributed. Too many small regions also introduce overhead.", "takeaway": "Presplit for the expected keys, not just for an impressive region count.", "kind": "lesson", "id": "c0311", "index": 310, "pdf_source_start": 320, "pdf_source_end": 326, "words": 60, "search": "presplitting needs known key distribution a new table can be created with explicit split boundaries so ingestion uses several regions from the beginning. the source recommends doing this when the expected key distribution is understood. merely creating many ranges does not make future traffic evenly distributed. too many small regions also introduce overhead. presplit for the expected keys, not just for an impressive region count. consistency checks, file inspection, and presplitting {}", "pdf_page": 317}, {"module": "10", "section": {"name": "Consistency checks, file inspection, and presplitting", "start": 297, "end": 299}, "title": "Four split keys define five intervals", "body": "The book's A, B, C, D example includes the interval before A and the interval after D. The result is five regions, not four. This is a useful boundary exercise: split keys separate adjacent ranges; they are not the names of the resulting regions. Empty outer bounds represent the ends of the table's key space.", "takeaway": "Count separators plus the two outer ends when deriving the range set.", "kind": "lesson", "id": "c0312", "index": 311, "pdf_source_start": 324, "pdf_source_end": 326, "words": 67, "search": "four split keys define five intervals the book's a, b, c, d example includes the interval before a and the interval after d. the result is five regions, not four. this is a useful boundary exercise: split keys separate adjacent ranges; they are not the names of the resulting regions. empty outer bounds represent the ends of the table's key space. count separators plus the two outer ends when deriving the range set. consistency checks, file inspection, and presplitting {\"type\": \"code\", \"text\": \"split keys: a, b, c, d\\n\\n[-infinity, a)\\n[a, b)\\n[b, c)\\n[c, d)\\n[d, +infinity)\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "Split keys: A, B, C, D\n\n[-infinity, A)\n[A, B)\n[B, C)\n[C, D)\n[D, +infinity)", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 318}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Individual-node resilience is not the whole backup story", "body": "HDFS replication and region recovery address some node failures. A second cluster or backup can address other concerns, including a whole data-center loss or isolating batch work. The source's broad availability language must be read with its earlier deployment assumptions. Do not interpret 'replicated' as a guarantee against every loss or availability scenario.", "takeaway": "State which failure the extra copy is meant to address.", "kind": "lesson", "id": "c0313", "index": 312, "pdf_source_start": 326, "pdf_source_end": 336, "words": 63, "search": "individual-node resilience is not the whole backup story hdfs replication and region recovery address some node failures. a second cluster or backup can address other concerns, including a whole data-center loss or isolating batch work. the source's broad availability language must be read with its earlier deployment assumptions. do not interpret 'replicated' as a guarantee against every loss or availability scenario. state which failure the extra copy is meant to address. backup and inter-cluster replication {}", "pdf_page": 319}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Inter-cluster replication ships edits asynchronously", "body": "In the book's design, writes enter the primary cluster's log and edits are shipped to another cluster afterward. The source write does not wait for remote application of the edit. This keeps remote latency off that write's completion path, but allows a lagging destination. The original terminology and exact configuration describe HBase 0.92.1/CDH4.", "takeaway": "Acknowledged at the source does not mean already visible at the remote destination.", "kind": "lesson", "lab": "replication", "lab_snapshot": "Toy source accepts edits A then B while destination is empty. Shipping A leaves one pending edit. Source acknowledgment did not wait for either destination update. The model omits failure recovery and conflict resolution.", "id": "c0314", "index": 313, "pdf_source_start": 326, "pdf_source_end": 336, "words": 66, "search": "inter-cluster replication ships edits asynchronously in the book's design, writes enter the primary cluster's log and edits are shipped to another cluster afterward. the source write does not wait for remote application of the edit. this keeps remote latency off that write's completion path, but allows a lagging destination. the original terminology and exact configuration describe hbase 0.92.1/cdh4. acknowledged at the source does not mean already visible at the remote destination. backup and inter-cluster replication {}", "pdf_page": 320}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Replication scope and destination schema must agree", "body": "The chapter enables replication on selected column families. The same table and family must already exist at the destination in its example; replication is not presented as automatically creating them. A configured peer and a replication-enabled family solve different pieces of setup. Test with small writes before relying on the pipeline.", "takeaway": "Both routing and destination structure must be ready for the edits.", "kind": "lesson", "id": "c0315", "index": 314, "pdf_source_start": 326, "pdf_source_end": 336, "words": 62, "search": "replication scope and destination schema must agree the chapter enables replication on selected column families. the same table and family must already exist at the destination in its example; replication is not presented as automatically creating them. a configured peer and a replication-enabled family solve different pieces of setup. test with small writes before relying on the pipeline. both routing and destination structure must be ready for the edits. backup and inter-cluster replication {\"type\": \"replication\", \"caption\": \"asynchronous hlog edit shipping: local completion and remote progress are distinct events.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"230\\\" viewbox=\\\"0 0 640 230\\\" role=\\\"img\\\"><rect width=\\\"640\\\" height=\\\"230\\\" rx=\\\"14\\\" fill=\\\"#f7fafa\\\"/><rect x=\\\"20\\\" y=\\\"25\\\" width=\\\"200\\\" height=\\\"80\\\" rx=\\\"10\\\" fill=\\\"#e5f2ef\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"120.0\\\" y=\\\"60.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">source cluster<\/text><text x=\\\"120.0\\\" y=\\\"82.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">a, b<\/text><rect x=\\\"420\\\" y=\\\"25\\\" width=\\\"200\\\" height=\\\"80\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"520.0\\\" y=\\\"60.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">replica cluster<\/text><text x=\\\"520.0\\\" y=\\\"82.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">a only<\/text><polyline points=\\\"223,65 416,65\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><path d=\\\"m407.8959760788259 68.91468980700107 l416 65 l407.8959760788259 61.085310192998925\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><text x=\\\"320\\\" y=\\\"48\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"15\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">async ship<\/text><rect x=\\\"140\\\" y=\\\"145\\\" width=\\\"360\\\" height=\\\"58\\\" rx=\\\"10\\\" fill=\\\"#fbedde\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"320.0\\\" y=\\\"180.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">pending edit: b<\/text><\/svg>\"}", "visual": {"type": "replication", "caption": "Asynchronous HLog edit shipping: local completion and remote progress are distinct events.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20\" y=\"25\" width=\"200\" height=\"80\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"120.0\" y=\"60.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Source cluster<\/text><text x=\"120.0\" y=\"82.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">A, B<\/text><rect x=\"420\" y=\"25\" width=\"200\" height=\"80\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"520.0\" y=\"60.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Replica cluster<\/text><text x=\"520.0\" y=\"82.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">A only<\/text><polyline points=\"223,65 416,65\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M407.8959760788259 68.91468980700107 L416 65 L407.8959760788259 61.085310192998925\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><text x=\"320\" y=\"48\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"15\" font-weight=\"normal\" fill=\"#173344\">async ship<\/text><rect x=\"140\" y=\"145\" width=\"360\" height=\"58\" rx=\"10\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><text x=\"320.0\" y=\"180.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Pending edit: B<\/text><\/svg>"}, "pdf_page": 321}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Replication topology expresses allowed directions", "body": "The book uses master-slave for one-way replication, master-master for two-way replication, and cyclic for several clusters. The direction of configured peers determines which edits travel where. A one-way secondary does not magically send direct writes back to the primary. The application must respect the intended write topology.", "takeaway": "Drawing an arrow is also choosing which updates can propagate along it.", "kind": "lesson", "visual": {"type": "table", "headers": ["Book term", "Direction", "Application concern"], "rows": [["Master-slave", "One way", "Avoid unintended direct writes to the replicated secondary"], ["Master-master", "Both ways", "Understand writes originating on either side"], ["Cyclic", "Several linked clusters", "Understand each configured propagation path"]], "caption": "Topology terminology retained from section 10.4.1; this is not a current conflict-resolution specification."}, "id": "c0316", "index": 315, "pdf_source_start": 326, "pdf_source_end": 336, "words": 59, "search": "replication topology expresses allowed directions the book uses master-slave for one-way replication, master-master for two-way replication, and cyclic for several clusters. the direction of configured peers determines which edits travel where. a one-way secondary does not magically send direct writes back to the primary. the application must respect the intended write topology. drawing an arrow is also choosing which updates can propagate along it. backup and inter-cluster replication {\"type\": \"table\", \"headers\": [\"book term\", \"direction\", \"application concern\"], \"rows\": [[\"master-slave\", \"one way\", \"avoid unintended direct writes to the replicated secondary\"], [\"master-master\", \"both ways\", \"understand writes originating on either side\"], [\"cyclic\", \"several linked clusters\", \"understand each configured propagation path\"]], \"caption\": \"topology terminology retained from section 10.4.1; this is not a current conflict-resolution specification.\"}", "pdf_page": 322}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Verify replication by reading the destination", "body": "The chapter begins validation with a few writes and corresponding destination reads, then introduces VerifyReplication for larger comparisons. Time and family filters narrow the comparison. Merely listing a peer does not prove edits arrive correctly. Asynchronous progress also affects when it is meaningful to compare live source and destination data.", "takeaway": "Configuration proves intent; destination observations help prove behavior.", "kind": "lesson", "id": "c0317", "index": 316, "pdf_source_start": 326, "pdf_source_end": 336, "words": 58, "search": "verify replication by reading the destination the chapter begins validation with a few writes and corresponding destination reads, then introduces verifyreplication for larger comparisons. time and family filters narrow the comparison. merely listing a peer does not prove edits arrive correctly. asynchronous progress also affects when it is meaningful to compare live source and destination data. configuration proves intent; destination observations help prove behavior. backup and inter-cluster replication {}", "pdf_page": 323}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Stopping replication has historical nuances", "body": "The source describes behavior in which stopping and restarting replication while the same HLog remains active can still ship intervening edits. It explicitly ties these details to its release. Do not infer 'disable means permanently discard all intervening changes' from the command name alone. This is a version-reading caution, not a modern operational procedure.", "takeaway": "Lifecycle commands need release-specific semantics, especially around buffered work.", "kind": "source-note", "id": "c0318", "index": 317, "pdf_source_start": 326, "pdf_source_end": 336, "words": 63, "search": "stopping replication has historical nuances the source describes behavior in which stopping and restarting replication while the same hlog remains active can still ship intervening edits. it explicitly ties these details to its release. do not infer 'disable means permanently discard all intervening changes' from the command name alone. this is a version-reading caution, not a modern operational procedure. lifecycle commands need release-specific semantics, especially around buffered work. backup and inter-cluster replication {}", "pdf_page": 324}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Failover and failback are application concerns", "body": "Keeping a secondary copy does not automatically direct the application to use it. The book discusses application or DNS-level switching and then the challenge of bringing writes made on the secondary back to the primary. That second step is easy to forget. Replication is a building block in a recovery plan, not the complete plan.", "takeaway": "Plan how to return as well as how to switch away.", "kind": "lesson", "id": "c0319", "index": 318, "pdf_source_start": 326, "pdf_source_end": 336, "words": 66, "search": "failover and failback are application concerns keeping a secondary copy does not automatically direct the application to use it. the book discusses application or dns-level switching and then the challenge of bringing writes made on the secondary back to the primary. that second step is easy to forget. replication is a building block in a recovery plan, not the complete plan. plan how to return as well as how to switch away. backup and inter-cluster replication {}", "pdf_page": 325}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Export and Import use a pull model", "body": "Export scans table data and writes SequenceFiles containing rowkeys and Results. Import reads those files and creates destination Puts. This differs from log-shipping replication, which pushes new edits. Filters for families, versions, or timestamps control what Export reads. The resulting dataset reflects the scan behavior and chosen options.", "takeaway": "A scan-based copy and a live edit stream preserve data through different mechanisms.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Export table scan", "SequenceFiles", "Import reads", "Destination Puts"], "caption": "The book's Export/Import pipeline. This is distinct from asynchronous HLog shipping.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Export table<\/text><text x=\"87.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">scan<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">SequenceFiles<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"397.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Import reads<\/text><polyline points=\"467.0,75 483.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M474.8959760788259 78.91468980700107 L483.0 75 L474.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"485.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"552.5\" y=\"70.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Destination<\/text><text x=\"552.5\" y=\"92.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Puts<\/text><\/svg>"}, "id": "c0320", "index": 319, "pdf_source_start": 326, "pdf_source_end": 336, "words": 61, "search": "export and import use a pull model export scans table data and writes sequencefiles containing rowkeys and results. import reads those files and creates destination puts. this differs from log-shipping replication, which pushes new edits. filters for families, versions, or timestamps control what export reads. the resulting dataset reflects the scan behavior and chosen options. a scan-based copy and a live edit stream preserve data through different mechanisms. backup and inter-cluster replication {\"type\": \"flow\", \"labels\": [\"export table scan\", \"sequencefiles\", \"import reads\", \"destination puts\"], \"caption\": \"the book's export/import pipeline. this is distinct from asynchronous hlog shipping.\", \"svg\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"1 1.08531019299893\\\" fill=\\\"none\\\" stroke=\\\"#126c69\\\" stroke-width=\\\"2.5\\\"/><rect x=\\\"485.0\\\" y=\\\"30\\\" width=\\\"135.0\\\" height=\\\"90\\\" rx=\\\"10\\\" fill=\\\"#e9eff7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"70.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">destination<\/text><text x=\\\"552.5\\\" y=\\\"92.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">puts<\/text><\/svg>\"}", "pdf_page": 326}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "A scan-based export is not a table-wide snapshot promise", "body": "The backup section uses point-in-time language for scan-based jobs, while chapter 2 explicitly states that a scan is not a snapshot of the entire table. Keep those boundaries visible. This companion does not infer global snapshot isolation for a live Export or CopyTable job merely because its output is used as a backup.", "takeaway": "A backup label does not strengthen the consistency semantics of its read operation.", "kind": "source-note", "id": "c0321", "index": 320, "pdf_source_start": 326, "pdf_source_end": 336, "words": 66, "search": "a scan-based export is not a table-wide snapshot promise the backup section uses point-in-time language for scan-based jobs, while chapter 2 explicitly states that a scan is not a snapshot of the entire table. keep those boundaries visible. this companion does not infer global snapshot isolation for a live export or copytable job merely because its output is used as a backup. a backup label does not strengthen the consistency semantics of its read operation. backup and inter-cluster replication {}", "pdf_page": 327}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 306, "end": 307}, "title": "ImportTsv maps input fields to coordinates", "body": "The delimited-file import tool needs a mapping that identifies the rowkey field and each destination column. The source requires exactly one HBASE_ROW_KEY entry. Separator, timestamps, bad-line behavior, and a custom mapper affect how text becomes mutations. Those choices define an ingestion contract; they are not merely cosmetic parsing options.", "takeaway": "A delimited file still needs an explicit mapping into row and cell addresses.", "kind": "lesson", "id": "c0322", "index": 321, "pdf_source_start": 333, "pdf_source_end": 334, "words": 62, "search": "importtsv maps input fields to coordinates the delimited-file import tool needs a mapping that identifies the rowkey field and each destination column. the source requires exactly one hbase_row_key entry. separator, timestamps, bad-line behavior, and a custom mapper affect how text becomes mutations. those choices define an ingestion contract; they are not merely cosmetic parsing options. a delimited file still needs an explicit mapping into row and cell addresses. backup and inter-cluster replication {\"type\": \"code\", \"text\": \"input fields: longitude, latitude, id, name\\nmapping:      a:lon,     a:lat, hbase_row_key, a:name\\n\\nexactly one source field supplies the rowkey.\\nother fields name destination family:qualifier cells.\", \"caption\": \"companion sketch of the cited book-era mechanism. not a complete, executed application or current api guarantee.\"}", "visual": {"type": "code", "text": "Input fields: longitude, latitude, id, name\nMapping:      a:lon,     a:lat, HBASE_ROW_KEY, a:name\n\nExactly one source field supplies the rowkey.\nOther fields name destination family:qualifier cells.", "caption": "Companion sketch of the cited book-era mechanism. Not a complete, executed application or current API guarantee."}, "pdf_page": 328}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Bulk loading prepares HFiles before installation", "body": "Instead of sending every record through ordinary Put calls, a bulk path generates HFiles and then installs them into the target table. The files must match the region ranges and table configuration. The source's loader handles required adjustments and activation. This is a different ingestion route with different preparation work, not a faster synonym for any individual write.", "takeaway": "Bulk load moves work into file construction and controlled installation.", "kind": "lesson", "visual": {"type": "flow", "labels": ["Input records", "Sorted HFiles", "Range / configuration checks", "Install into regions"], "caption": "Conceptual bulk-loading stages in section 10.4.2; no live commands are executed by the companion.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"150\" viewBox=\"0 0 640 150\" role=\"img\"><rect width=\"640\" height=\"150\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"20.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"87.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Input records<\/text><polyline points=\"157.0,75 173.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M164.8959760788259 78.91468980700107 L173.0 75 L164.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"175.0\" y=\"30\" width=\"135.0\" height=\"90\" rx=\"10\" fill=\"#E9EFF7\" stroke=\"#A8BABE\"/><text x=\"242.5\" y=\"81.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Sorted HFiles<\/text><polyline points=\"312.0,75 328.0,75\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><path d=\"M319.8959760788259 78.91468980700107 L328.0 75 L319.8959760788259 71.08531019299893\" fill=\"none\" stroke=\"#126C69\" stroke-width=\"2.5\"/><rect x=\"330.0\" y=\"30\" width=\"135.0\ so the exact target must be checked instead of copying all lines unquestioningly. this is another reason to inspect data-movement semantics before execution. know whether ingestion consumes, moves, copies, or preserves its staged input. backup and inter-cluster replication {}", "pdf_page": 330}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "CopyTable writes directly to another table", "body": "CopyTable scans a source table and sends mutations to a destination without using an intermediate SequenceFile export. It can target another table or another cluster in the source's examples. Time and family choices still affect what gets copied. Removing the intermediate file stage does not create a multirow snapshot or a bidirectional replication system.", "takeaway": "Direct copy is a scan-and-write job, not the same thing as ongoing replication.", "kind": "lesson", "id": "c0325", "index": 324, "pdf_source_start": 326, "pdf_source_end": 336, "words": 67, "search": "copytable writes directly to another table copytable scans a source table and sends mutations to a destination without using an intermediate sequencefile export. it can target another table or another cluster in the source's examples. time and family choices still affect what gets copied. removing the intermediate file stage does not create a multirow snapshot or a bidirectional replication system. direct copy is a scan-and-write job, not the same thing as ongoing replication. backup and inter-cluster replication {\"type\": \"table\", \"headers\": [\"method\", \"data movement\"], \"rows\": [[\"replication\", \"push new log edits asynchronously\"], [\"export / import\", \"pull rows to files, then write rows\"], [\"copytable\", \"pull rows and write a target table\"], [\"root-directory copy\", \"filesystem copy of a stable stopped state\"]], \"caption\": \"study comparison based on the cited section.\"}", "visual": {"type": "table", "headers": ["Method", "Data movement"], "rows": [["Replication", "Push new log edits asynchronously"], ["Export / Import", "Pull rows to files, then write rows"], ["CopyTable", "Pull rows and write a target table"], ["Root-directory copy", "Filesystem copy of a stable stopped state"]], "caption": "Study comparison based on the cited section."}, "pdf_page": 331}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Do not copy a live root directory blindly", "body": "While HBase runs, flushes, compactions, and splits change files and some edits remain in memory. The chapter explains why an ordinary live directory copy is not a coherent backup of that moving state. It contrasts this with a cleanly stopped system whose files no longer change. This is a narrowly described historical backup approach, not a complete current backup strategy.", "takeaway": "A consistent filesystem copy needs a well-defined stable state.", "kind": "source-note", "id": "c0326", "index": 325, "pdf_source_start": 326, "pdf_source_end": 336, "words": 69, "search": "do not copy a live root directory blindly while hbase runs, flushes, compactions, and splits change files and some edits remain in memory. the chapter explains why an ordinary live directory copy is not a coherent backup of that moving state. it contrasts this with a cleanly stopped system whose files no longer change. this is a narrowly described historical backup approach, not a complete current backup strategy. a consistent filesystem copy needs a well-defined stable state. backup and inter-cluster replication {}", "pdf_page": 332}, {"module": "10", "section": {"name": "Backup and inter-cluster replication", "start": 299, "end": 309}, "title": "Operational knowledge grows through evidence", "body": "The book finishes by emphasizing experience, monitoring, controlled tests, and understanding the mechanisms behind tools. The aim is not memorizing a long command list. It is being able to connect a symptom to a layer, inspect the relevant evidence, and choose an action whose scope and risk are understood.", "takeaway": "Operate by tested hypotheses and explicit contracts, not by ritual command sequences.", "kind": "lesson", "id": "c0327", "index": 326, "pdf_source_start": 326, "pdf_source_end": 336, "words": 61, "search": "operational knowledge grows through evidence the book finishes by emphasizing experience, monitoring, controlled tests, and understanding the mechanisms behind tools. the aim is not memorizing a long command list. it is being able to connect a symptom to a layer, inspect the relevant evidence, and choose an action whose scope and risk are understood. operate by tested hypotheses and explicit contracts, not by ritual command sequences. backup and inter-cluster replication {}", "pdf_page": 333}, {"module": "10", "section": {"name": "Chapter recall", "start": 279, "end": 280}, "title": "Recall: read cache pollution", "body": "A one-off large scan evicts blocks used by point reads. Which distinction is relevant?", "takeaway": "The source treats these as different controls. You can avoid populating the server BlockCache while still batching rows over the network.", "kind": "quiz", "choices": ["Both settings are the same cache", "Neither setting affects a scan", "setCacheBlocks controls server block insertion; setCaching controls rows fetched per RPC"], "answer": 2, "explanation": "The source treats these as different controls. You can avoid populating the server BlockCache while still batching rows over the network.", "id": "c0328", "index": 327, "pdf_source_start": 306, "pdf_source_end": 307, "words": 35, "search": "recall: read cache pollution a one-off large scan evicts blocks used by point reads. which distinction is relevant? the source treats these as different controls. you can avoid populating the server blockcache while still batching rows over the network. chapter recall {}", "pdf_page": 334, "answer_page": 400}, {"module": "10", "section": {"name": "Chapter recall", "start": 284, "end": 285}, "title": "Recall: planned maintenance", "body": "What should happen before deliberately stopping a serving node in the book's graceful approach?", "takeaway": "Controlled handoff avoids waiting for failure detection and reassignment. Remaining capacity is part of the maintenance assumption.", "kind": "quiz", "choices": ["Move its regions to remaining servers with capacity", "Wait for an avoidable crash-recovery path", "Delete the catalog"], "answer": 0, "explanation": "Controlled handoff avoids waiting for failure detection and reassignment. Remaining capacity is part of the maintenance assumption.", "id": "c0329", "index": 328, "pdf_source_start": 311, "pdf_source_end": 312, "words": 31, "search": "recall: planned maintenance what should happen before deliberately stopping a serving node in the book's graceful approach? controlled handoff avoids waiting for failure detection and reassignment. remaining capacity is part of the maintenance assumption. chapter recall {}", "pdf_page": 335, "answer_page": 401}, {"module": "10", "section": {"name": "Chapter recall", "start": 297, "end": 299}, "title": "Recall: split separators", "body": "A table is created with split keys A, B, C, D. How many intervals result?", "takeaway": "There is a range before A, three internal ranges, and a range starting at D. Four separators define five intervals.", "kind": "quiz", "choices": ["Four", "Five", "Eight"], "answer": 1, "explanation": "There is a range before A, three internal ranges, and a range starting at D. Four separators define five intervals.", "id": "c0330", "index": 329, "pdf_source_start": 324, "pdf_source_end": 326, "words": 35, "search": "recall: split separators a table is created with split keys a, b, c, d. how many intervals result? there is a range before a, three internal ranges, and a range starting at d. four separators define five intervals. chapter recall {}", "pdf_page": 336, "answer_page": 402}, {"module": "10", "section": {"name": "Chapter recall", "start": 300, "end": 303}, "title": "Recall: local and remote completion", "body": "A source write completes before its asynchronous replica has applied the edit. Is that excluded by the book's replication model?", "takeaway": "The chapter explicitly describes asynchronous log shipping. Local write completion and remote visibility are separate milestones.", "kind": "quiz", "choices": ["Yes; all remote clusters acknowledge synchronously", "Yes; each Put is a global transaction", "No; the source does not wait for remote replication"], "answer": 2, "explanation": "The chapter explicitly describes asynchronous log shipping. Local write completion and remote visibility are separate milestones.", "id": "c0331", "index": 330, "pdf_source_start": 327, "pdf_source_end": 330, "words": 36, "search": "recall: local and remote completion a source write completes before its asynchronous replica has applied the edit. is that excluded by the book's replication model? the chapter explicitly describes asynchronous log shipping. local write completion and remote visibility are separate milestones. chapter recall {}", "pdf_page": 337, "answer_page": 403}, {"module": "10", "section": {"name": "Chapter recall", "start": 293, "end": 296}, "title": "Recall: checking before repair", "body": "hbck reports an issue once during a split. What does the source recommend considering?", "takeaway": "The source warns that transitions can look inconsistent in a single observation. Persistent problems require diagnosis; repair remains an advanced, release-specific operation.", "kind": "quiz", "choices": ["Whether it is a transient transition and whether it persists on repeated inspection", "Immediately run the broadest repair flags", "Ignore every checker result permanently"], "answer": 0, "explanation": "The source warns that transitions can look inconsistent in a single observation. Persistent problems require diagnosis; repair remains an advanced, release-specific operation.", "id": "c0332", "index": 331, "pdf_source_start": 320, "pdf_source_end": 323, "words": 36, "search": "recall: checking before repair hbck reports an issue once during a split. what does the source recommend considering? the source warns that transitions can look inconsistent in a single observation. persistent problems require diagnosis; repair remains an advanced, release-specific operation. chapter recall {}", "pdf_page": 338, "answer_page": 404}, {"module": "10", "section": {"name": "Chapter recall", "start": 304, "end": 308}, "title": "Recall: live export", "body": "Why should a live scan-based export not be assumed to be a table-wide snapshot?", "takeaway": "Calling an output a backup does not add stronger read semantics. The source's scan guarantee must still govern how the export is interpreted.", "kind": "quiz", "choices": ["SequenceFiles cannot store bytes", "Chapter 2 explicitly limits scans to row-consistent observations rather than one table instant", "Export never reads rows"], "answer": 1, "explanation": "Calling an output a backup does not add stronger read semantics. The source's scan guarantee must still govern how the export is interpreted.", "id": "c0333", "index": 332, "pdf_source_start": 331, "pdf_source_end": 335, "words": 37, "search": "recall: live export why should a live scan-based export not be assumed to be a table-wide snapshot? calling an output a backup does not add stronger read semantics. the source's scan guarantee must still govern how the export is interpreted. chapter recall {}", "pdf_page": 339, "answer_page": 405}, {"module": "A", "section": {"name": "Exploring ZooKeeper", "start": 311, "end": 312}, "title": "Read the cluster's coordination view", "body": "zk_dump shows the parent znode, active Master, backup Masters, RegionServers, and the server holding -ROOT- in the book's architecture. This gives a different view from a user-table scan. It describes membership and role location rather than application values. The appendix uses it to connect the earlier lookup theory to observable metadata.", "takeaway": "Use coordination output to learn who is participating and which roles they hold.", "kind": "lesson", "id": "c0334", "index": 333, "pdf_source_start": 338, "pdf_source_end": 339, "words": 64, "search": "read the cluster's coordination view zk_dump shows the parent znode, active master, backup masters, regionservers, and the server holding -root- in the book's architecture. this gives a different view from a user-table scan. it describes membership and role location rather than application values. the appendix uses it to connect the earlier lookup theory to observable metadata. use coordination output to learn who is participating and which roles they hold. exploring zookeeper {}", "pdf_page": 340}, {"module": "A", "section": {"name": "Exploring ZooKeeper", "start": 311, "end": 312}, "title": "Standalone and distributed output differ in shape", "body": "In standalone mode, many roles appear on localhost. In a distributed deployment, several host addresses appear. The meaning of the roles stays recognizable even as the topology grows. The source compares these outputs so a learner does not confuse 'several role labels' with 'several physical computers.'", "takeaway": "Read role identity separately from host identity.", "kind": "lesson", "id": "c0335", "index": 334, "pdf_source_start": 338, "pdf_source_end": 339, "words": 53, "search": "standalone and distributed output differ in shape in standalone mode, many roles appear on localhost. in a distributed deployment, several host addresses appear. the meaning of the roles stays recognizable even as the topology grows. the source compares these outputs so a learner does not confuse 'several role labels' with 'several physical computers.' read role identity separately from host identity. exploring zookeeper {}", "pdf_page": 341}, {"module": "A", "section": {"name": "Exploring -ROOT- and .META.", "start": 312, "end": 317}, "title": "-ROOT- points to catalog regions", "body": "The old -ROOT- table stores information about the .META. region or regions. A single region can cover the entire relevant range when the catalog is small. Empty start and end boundaries represent the outer limits rather than an ordinary empty business key. The appendix's output makes the catalog hierarchy concrete.", "takeaway": "System tables store locations and ranges, not merely application records with unusual names.", "kind": "lesson", "id": "c0336", "index": 335, "pdf_source_start": 339, "pdf_source_end": 344, "words": 63, "search": "-root- points to catalog regions the old -root- table stores information about the .meta. region or regions. a single region can cover the entire relevant range when the catalog is small. empty start and end boundaries represent the outer limits rather than an ordinary empty business key. the appendix's output makes the catalog hierarchy concrete. system tables store locations and ranges, not merely application records with unusual names. exploring -root- and .meta. {}", "pdf_page": 342}, {"module": "A", "section": {"name": "Exploring -ROOT- and .META.", "start": 312, "end": 317}, "title": ".META. describes user-table regions", "body": "The appendix inspects region information, server location, and server-start identity. After a user table is created, its regions appear in the catalog. This is how the client learns the region to contact for a key range. The catalog itself is managed by HBase; ordinary applications should not replace client lookup with manual metadata manipulation.", "takeaway": "Metadata connects logical row ranges to the processes serving them.", "kind": "lesson", "id": "c0337", "index": 336, "pdf_source_start": 339, "pdf_source_end": 344, "words": 64, "search": ".meta. describes user-table regions the appendix inspects region information, server location, and server-start identity. after a user table is created, its regions appear in the catalog. this is how the client learns the region to contact for a key range. the catalog itself is managed by hbase; ordinary applications should not replace client lookup with manual metadata manipulation. metadata connects logical row ranges to the processes serving them. exploring -root- and .meta. {}", "pdf_page": 343}, {"module": "A", "section": {"name": "Exploring -ROOT- and .META.", "start": 312, "end": 317}, "title": "A split leaves a visible transition", "body": "During the appendix's split example, the parent is marked offline/split and metadata identifies daughter regions. For a time, parent and daughter information coexist. After cleanup, the parent's transitional entry disappears. This explains why the operations chapter warns that one checker observation can catch a normal intermediate state.", "takeaway": "Metadata can describe an ongoing transition, not only a final steady state.", "kind": "lesson", "visual": {"type": "split", "caption": "Parent range [A,Z) becomes [A,M) and [M,Z) in this teaching example. Parent transition metadata is distinct from active serving ownership.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"230\" viewBox=\"0 0 640 230\" role=\"img\"><rect width=\"640\" height=\"230\" rx=\"14\" fill=\"#F7FAFA\"/><rect x=\"200\" y=\"15\" width=\"240\" height=\"65\" rx=\"10\" fill=\"#FBEDDE\" stroke=\"#A8BABE\"/><text x=\"320.0\" y=\"53.5\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Parent [A, Z)<\/text><rect x=\"35\" y=\"144\" width=\"250\" height=\"64\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"160.0\" y=\"182.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" font-weight=\"normal\" fill=\"#173344\">Daughter [A, M)<\/text><rect x=\"355\" y=\"144\" width=\"250\" height=\"64\" rx=\"10\" fill=\"#E5F2EF\" stroke=\"#A8BABE\"/><text x=\"480.0\" y=\"182.0\" text-anchor=\"middle\" font-family=\"DejaVu Sans\" font-size=\"17\" ently belongs to three regions", "The table is a relational join", "The split is in transition and cleanup is not finished"], "answer": 2, "explanation": "The appendix shows transitional split metadata. It must be interpreted with active serving state and later cleanup, not treated automatically as permanent overlapping ownership.", "id": "c0341", "index": 340, "pdf_source_start": 341, "pdf_source_end": 343, "words": 34, "search": "recall: parent and daughters why might parent and daughter region metadata appear together briefly? the appendix shows transitional split metadata. it must be interpreted with active serving state and later cleanup, not treated automatically as permanent overlapping ownership. chapter recall {}", "pdf_page": 347, "answer_page": 406}, {"module": "A", "section": {"name": "Chapter recall", "start": 316, "end": 317}, "title": "Recall: escaped key", "body": "A region boundary appears as escaped binary bytes. What should you check first?", "takeaway": "Hashed and composite rowkeys need not resemble the original application strings. The source connects the unfamiliar output to the byte-encoded key design.", "kind": "quiz", "choices": ["The application's rowkey encoding", "Whether the field can be renamed to a username", "Whether all HFiles must be deleted"], "answer": 0, "explanation": "Hashed and composite rowkeys need not resemble the original application strings. The source connects the unfamiliar output to the byte-encoded key design.", "id": "c0342", "index": 341, "pdf_source_start": 343, "pdf_source_end": 344, "words": 35, "search": "recall: escaped key a region boundary appears as escaped binary bytes. what should you check first? hashed and composite rowkeys need not resemble the original application strings. the source connects the unfamiliar output to the byte-encoded key design. chapter recall {}", "pdf_page": 348, "answer_page": 407}, {"module": "B", "section": {"name": "Distributed files and metadata separation", "start": 318, "end" 7\\\" stroke=\\\"#a8babe\\\"/><text x=\\\"552.5\\\" y=\\\"81.0\\\" text-anchor=\\\"middle\\\" font-family=\\\"dejavu sans\\\" font-size=\\\"17\\\" font-weight=\\\"normal\\\" fill=\\\"#173344\\\">datanode d<\/text><\/svg>\"}", "pdf_page": 352}, {"module": "B", "section": {"name": "HDFS write and read paths", "start": 320, "end": 324}, "title": "Acknowledgment and stable storage need careful reading", "body": "The appendix describes acknowledgments after data reaches memory, with later disk persistence. Elsewhere, chapter 9 stresses synchronization support for HBase's WAL durability. The appendix is a simplified file-write narrative, not a complete specification of every sync method or hardware-failure guarantee. This companion keeps that boundary explicit instead of treating all acknowledgments as equivalent.", "takeaway": "Ask what exactly has been acknowledged and which persistence contract applies.", "kind": "source-note", "id": "c0347", "index": 346, "pdf_source_start": 347, "pdf_source_end": 351, "words": 64, "search": "acknowledgment and stable storage need careful reading the appendix describes acknowledgments after data reaches memory, with later disk persistence. elsewhere, chapter 9 stresses synchronization support for hbase's wal durability. the appendix is a simplified file-write narrative, not a complete specification of every sync method or hardware-failure guarantee. this companion keeps that boundary explicit instead of treating all acknowledgments as equivalent. ask what exactly has been acknowledged and which persistence contract applies. hdfs write and read paths {}", "pdf_page": 353}, {"module": "B", "section": {"name": "HDFS write and read paths", "start": 320, "end": 324}, "title": "A read asks for block locations", "body": "The client asks the NameNode where a file's blocks can be read. The response includes DataNode locations and block identifiers. The client then asks the appropriate DataNodes for contents and assembles the logical file. This
