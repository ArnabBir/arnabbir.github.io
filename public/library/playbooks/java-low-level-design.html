*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{cursor:default;opacity:.55}.primary{background:var(--accent);border-color:var(--accent);color:#fff}:root[data-theme=dark] .primary{color:#09272b}.quiet{background:transparent}.small{font-size:13px}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:1.8px;text-transform:uppercase}.badge{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--tint);font-size:12px;font-weight:700;color:var(--accent)}.badge.deep{background:var(--warnbg);color:var(--warn)}a{color:var(--accent)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,3.2vw,39px);line-height:1.18;letter-spacing:-.8px;margin-bottom:18px}h2{font-size:24px;line-height:1.3;margin-bottom:12px}h3{font-size:18px;line-height:1.4;margin-bottom:9px}p{margin-bottom:16px}pre{background:var(--code);color:var(--codeink);padding:21px;border-radius:13px;overflow-x:auto;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}pre code{overflow-wrap:normal}input,select,textarea{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:10px;max-width:100%;min-height:44px}textarea{width:100%;min-height:125px;resize:vertical;line-height:1.6}label{display:block;font-size:14px;font-weight:650;margin-bottom:6px}input[type=checkbox],input[type=radio]{min-height:0;accent-color:var(--accent)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stack>*+*{margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.box{border:1px solid var(--line);padding:20px;border-radius:14px;background:var(--paper)}.callout{background:var(--tint);border-left:4px solid var(--accent);padding:19px 21px;border-radius:0 12px 12px 0;margin:20px 0}.gotcha{background:var(--warnbg);border-left-color:var(--warn)}.callout p:last-child{margin-bottom:0}.chip{border:1px solid var(--line);border-radius:9px;display:inline-block;padding:9px 14px;margin:5px;background:var(--paper);font-weight:650}.chip.active{background:var(--tint);border-color:var(--accent)}.good{color:var(--good)}.bad{color:var(--bad)}.hidden,[hidden]{display:none!important}.status{border-top:1px solid var(--line);padding-top:10px;min-height:32px;color:var(--muted);font-size:14px}.section{margin:25px 0}.btns{display:flex;gap:8px;flex-wrap:wrap}.full{width:100%}.screenreader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding:12px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:16px;line-height:1.25}.brand span{display:block;font-size:11px;letter-spacing:1.3px;color:var(--muted);font-weight:650;margin-top:4px}.topnav{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.topnav button{font-size:13px;padding:8px 11px}.topnav button[aria-current=page]{background:var(--tint);color:var(--accent);border-color:var(--accent)}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);max-width:1460px;margin:auto}.sidebar{padding:23px 18px;position:sticky;top:80px;height:calc(100dvh - 80px);overflow-y:auto;border-right:1px solid var(--line)}.sidebar input,.sidebar select{width:100%;margin-bottom:12px}.sidebar .navlist{margin-top:14px;display:grid;gap:5px}.navitem{text-align:left;border:0;background:transparent;padding:10px;font-size:13px;line-height:1.35;display:block;width:100%;border-radius:9px}.navitem small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.navitem.current{background:var(--tint);color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.navitem .dot{font-size:11px}.progressbar{height:6px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0 8px}.progressbar>div{height:100%;background:var(--accent);transition:width .2s}main{padding:28px;min-width:0}.reader{max-width:960px;margin:auto}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;min-width:0}.cardmeta{margin-bottom:14px}.cardtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.cardtools button{font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;border-bottom:1px solid var(--line);padding-bottom:12px;margin:20px 0}.tabs button{border:0;border-radius:8px;padding:10px 7px;font-size:14px}.tabs button[aria-selected=true]{background:var(--tint);color:var(--accent);font-weight:750}.tabpanel{min-height:300px}.steps{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:17px 0}.steps button{min-height:30px;padding:3px;font-size:11px;border-radius:6px}.steps button.active{background:var(--accent);color:#fff}.diagram{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:13px;margin:18px 0}.diagram svg{display:block;width:100%;height:auto;color:var(--ink)}.diagram .node{fill:var(--paper);stroke:var(--line);stroke-width:2}.diagram .node.hot{fill:var(--tint);stroke:var(--accent)}.diagram text{fill:var(--ink);font-family:system-ui,sans-serif}.diagram .edge{stroke:var(--muted);stroke-width:1.5;fill:none}.diagram .caption{font-size:12px;text-align:center;color:var(--muted);padding:7px}.answer{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;white-space:normal}.answer.chosen{border:2px solid var(--accent);background:var(--tint)}.answer.correct{border-color:var(--good)}.answer.incorrect{border-color:var(--bad)}.answer:disabled{opacity:1}.quizresult{margin:20px 0;padding:20px;border:1px solid var(--line);border-radius:12px}.bottomnav{position:sticky;bottom:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:space-between;gap:12px;margin-top:18px;z-index:10;box-shadow:var(--shadow)}.bottomnav button{min-width:95px}.bottomnav span{font-size:12px;color:var(--muted);align-self:center}.refs{font-size:12px;color:var(--muted);margin-top:22px}.refs a{margin-right:12px}.listline{border-bottom:1px solid var(--line);padding:10px 0}.listline:last-child{border:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:15px}.stat strong{display:block;font-size:27px;line-height:1.2;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}.tocgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tocbutton{text-align:left;padding:16px}.tocbutton strong{display:block}.tocbutton small{display:block;color:var(--muted)}.labtoolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:18px 0}.labtoolbar>div{flex:1;min-width:120px}.labtoolbar input,.labtoolbar select{width:100%}.laboutput{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;margin:18px 0}.laboutput h3{margin-bottom:12px}.lablog{font:13px/1.6 ui-monospace,monospace;border-left:3px solid var(--line);padding-left:15px;max-height:250px;overflow:auto}.lablog div{padding:4px 0}.labitems{display:flex;gap:10px;flex-wrap:wrap}.seat{min-width:88px;padding:16px;background:var(--paper);border:2px solid var(--line);border-radius:12px;text-align:center}.seat.held{border-color:var(--warn)}.seat.confirmed{border-color:var(--good)}.seat small{display:block;font-size:11px}.labcheckboxes{display:flex;gap:18px;flex-wrap:wrap}.labcheckboxes label{display:flex;gap:8px;align-items:center;font-size:15px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th,td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}.timer{font:600 42px/1.1 ui-monospace,monospace;color:var(--accent)}.mockfields{display:grid;gap:16px}.rubricrow{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.notice{padding:12px 22px;background:var(--warnbg);color:var(--warn);font-size:13px}.exportStatus{font-size:13px;color:var(--muted)}details{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}summary{cursor:pointer;font-weight:700}details p{margin:14px 0 4px}.sideToggle{display:none}.labnote{font-size:13px;color:var(--muted)}.kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 6px}.examSummary{padding:14px;border-bottom:1px solid var(--line)}

<script id="courseData" type="application/json">{"cards": [{"id": "L001", "number": 1, "module": "F1", "title": "What low-level design actually produces", "idea": "Turn a use case into objects, methods and rules that can be implemented. A class diagram is a map of your design; it is not the design itself. Start with one request and show what changes.", "mental": "For a parking lot: park(vehicle) chooses a suitable free spot and creates one active ticket. Where does that all-or-nothing action live?", "code": "Ticket park(Vehicle vehicle);\nReceipt exit(TicketId ticket);", "gotcha": "Starting with load balancers and regions can leave the object-level problem unanswered. Ask about deployment only when it changes the local contract.", "question": "Which deliverable best answers this workshop's LLD prompt?", "options": ["Only a list of cloud services", "A class for every noun", "A method trace with invariant-preserving objects"], "answer": 2, "explanation": "The trace connects requirements, ownership and executable behavior. Infrastructure may be an extension, not a substitute.", "practice": "Explain a library checkout in three sentences without naming any design pattern.", "flow": ["Use case", "Owner", "Method", "Invariant"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L002", "number": 2, "module": "F1", "title": "Clarify the rule that changes the design", "idea": "Ask questions that would change an interface, state machine or data structure. Do not spend the whole interview collecting cosmetic details. Record the chosen assumption before coding.", "mental": "For a seat booking: are seats assigned? Can a user hold several seats? When does a hold expire? These questions affect atomicity.", "code": "// Chosen scope, not a universal rule:\n// One show; assigned seats; 5-minute holds.", "gotcha": "An unstated assumption becomes a surprise bug when the interviewer changes the scenario.", "question": "Which question has the largest effect on seat-booking correctness?", "options": ["What color is the booking button?", "Must a multi-seat hold succeed all-or-nothing?", "Which font does the ticket use?"], "answer": 1, "explanation": "All-or-nothing ownership changes the update boundary. Appearance does not affect this core model.", "practice": "Write three clarifying questions for a vending machine; answer each with an explicit assumption.", "flow": ["Ambiguity", "Question", "Assumption", "Contract"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L003", "number": 3, "module": "F1", "title": "Write one happy path in plain English", "idea": "Use a tiny example before drawing classes. Name the input, current state, decision, new state and response. The example becomes your first executable test.", "mental": "Room R is free from 10 to 11. Ana requests it. The service accepts and the next overlapping request fails.", "code": "book(\"R\", ten, eleven);\n// A later overlapping request must fail.", "gotcha": "A story like \"the user books a room\" hides the conflict and the time boundaries.", "question": "What should the first example contain?", "options": ["Initial state, command and expected final state", "All possible deployment regions", "Only a UML inheritance tree"], "answer": 0, "explanation": "Observable before-and-after behavior lets you check the later design.", "practice": "Describe one accepted and one rejected request for a wallet transfer.", "flow": ["Before", "Command", "Decision", "After"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L004", "number": 4, "module": "F1", "title": "Put a fence around the problem", "idea": "Choose an interview-sized core. List what is in scope and what is deliberately excluded. An extension is allowed, but it must not silently become an implemented feature.", "mental": "For a chess core, separate turn handling and legal-move checks from matchmaking and a search engine.", "code": "// Core: move validation and turn ownership.\n// Extension: clocks, replay, network play.", "gotcha": "Saying \"chess\" does not specify whether castling, en passant and draws are required. Name omissions.", "question": "What is a defensible scope statement?", "options": ["Everything a real product might do", "Only the class names", "Explicit core behavior plus named exclusions"], "answer": 2, "explanation": "A bounded contract allows a coherent implementation and an honest extension discussion.", "practice": "For ride dispatch, choose the smallest core you could implement and test during an interview.", "flow": ["Core", "Exclusions", "Assumptions", "Extensions"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L005", "number": 5, "module": "F1", "title": "Turn features into acceptance rules", "idea": "A feature says what exists. An acceptance rule says how to tell whether it works. Prefer concrete outcomes over adjectives such as scalable, clean or robust.", "mental": "Feature: cancellation. Rule: canceling the same reservation twice never returns stock twice.", "code": "cancel(id);\ncancel(id);\n// available stock rises only once.", "gotcha": "Idempotence is not \"ignore all errors\". A retry and a conflicting new request are different cases.", "question": "Which rule is testable?", "options": ["The system is extremely scalable", "A repeated cancel restores stock at most once", "The cancellation design is elegant"], "answer": 1, "explanation": "A measurable state change can become an assertion. An adjective cannot.", "practice": "Rewrite \"supports notifications\" into three testable rules.", "flow": ["Feature", "Example", "Assertion", "Test"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L006", "number": 6, "module": "F1", "title": "Nouns suggest objects; verbs reveal owners", "idea": "Underline nouns and verbs, but do not create a class for every noun. Ask which object has the information needed to perform a verb while protecting a rule.", "mental": "A Booking owns its status. A PricingPolicy computes a price. A repository stores and finds bookings.", "code": "booking.cancel();\nMoney price = pricing.quote(request);", "gotcha": "A Manager class that prices, stores, emails and mutates everything becomes difficult to test or change.", "question": "Who should protect a booking's legal state transition?", "options": ["The booking or its explicit state-machine owner", "Any controller that can setStatus", "Every caller independently"], "answer": 0, "explanation": "One rule owner prevents different callers from interpreting transitions differently.", "practice": "Draw three responsibilities for a food order and assign each to one owner.", "flow": ["Noun", "Behavior", "Information", "Owner"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L007", "number": 7, "module": "F1", "title": "An invariant is a rule that stays true", "idea": "State an invariant in one sentence that applies before and after every completed public operation. Then identify all fields needed to check it.", "mental": "Inventory: reserved is never negative and never exceeds onHand. Both values belong to one consistency boundary.", "code": "0 <= reserved && reserved <= onHand", "gotcha": "Checking the rule only in the UI is not enough; other callers can bypass the UI.", "question": "Which statement is an invariant?", "options": ["The user clicks Park first", "The code uses a factory", "Every active ticket refers to one occupied spot"], "answer": 2, "explanation": "The ticket-to-spot relationship is a persistent rule. A UI sequence or pattern name is not.", "practice": "Write three invariants for a meeting-room calendar.", "flow": ["Valid state", "Operation", "Guard", "Valid state"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L008", "number": 8, "module": "F1", "title": "The aggregate is your consistency boundary", "idea": "In this workbook, an aggregate is the cluster of state changed together to keep a rule true. It may be one small object or several owned objects. Choose it from invariants, not from a diagram style.", "mental": "A vending session needs credit, selection and stock reservation to agree. Separate independent setters make invalid combinations easy.", "code": "synchronized Receipt buy(String sku) {\n    // validate, plan, then change owned state\n}", "gotcha": "A JVM lock can protect this process only. It does not make two servers share the same lock.", "question": "Why place related mutations behind one operation?", "options": ["To avoid ever testing failures", "To preserve a cross-field rule atomically", "To make every object global"], "answer": 1, "explanation": "The boundary tells callers what becomes true together. Deployment may require a different coordination mechanism.", "practice": "Circle the fields that must change together in a two-account transfer.", "flow": ["Owned fields", "One command", "Commit", "Snapshot"], "sources": ["S15"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L009", "number": 9, "module": "F1", "title": "Draw relationships with a legend", "idea": "Use a simple notation consistently: A owns B means B's lifecycle is controlled by A; A uses B means a dependency. Cardinalities such as 1 and many answer a different question from inheritance.", "mental": "Library owns copies; Loan references one copy and one member. A title is not a lendable physical copy.", "code": "record LoanId(String value) {}\nrecord CopyId(String value) {}", "gotcha": "A double arrow with no legend can hide whether an object owns, calls or merely references another.", "question": "What relationship should a loan have to its copy?", "options": ["A reference to the uniquely identified physical copy", "Inheritance from BookCopy", "A new title object on every lookup"], "answer": 0, "explanation": "A loan uses copy identity. It is not a special kind of copy.", "practice": "Draw an order with many order lines and an injected payment port.", "flow": ["Owns", "References", "Uses", "Implements"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L010", "number": 10, "module": "F1", "title": "Trace the awkward operation, not only getters", "idea": "The design becomes convincing when you trace its hardest mutation. Show the guard, decision, commit and failure path. A diagram full of getters proves little about behavior.", "mental": "Two clients request the last seat. The important moment is the atomic claim, not listing available seats.", "code": "Availability shown earlier is advisory.\nThe claim operation decides ownership.", "gotcha": "A read followed by a write is not one atomic action merely because each map call is thread-safe.", "question": "Which trace exposes the key seat-booking risk?", "options": ["Reading the cinema name", "Formatting a confirmation email", "Two holds competing for the same seat"], "answer": 2, "explanation": "The competing mutation forces you to define the ownership boundary.", "practice": "Trace cancellation racing with confirmation using two possible orderings.", "flow": ["Guard", "Decision", "Atomic change", "Reply"], "sources": ["S06"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L011", "number": 11, "module": "F1", "title": "Explain complexity with the actual variables", "idea": "Name the collection being scanned and the operation being measured. Average hash lookup and worst-case scanning are different claims. Mention the cost of snapshots and output size too.", "mental": "A simple parking allocator scans S spots: O(S) per allocation. An index adds bookkeeping to avoid that scan.", "code": "// S = number of spots; T = active tickets\n// allocation O(S); ticket lookup expected O(1)", "gotcha": "Do not claim the whole design is O(1) because it contains a HashMap.", "question": "A calendar scans B bookings for overlap. Its check costs?", "options": ["O(log B), because time is ordered", "O(B) in this baseline", "O(1), because IDs are hashed"], "answer": 1, "explanation": "The actual algorithm checks every booking. An index is an optional different design.", "practice": "State time and space cost for the core operation of an LRU cache.", "flow": ["Operation", "Input size", "Work", "Tradeoff"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L012", "number": 12, "module": "F1", "title": "A practical 45-minute interview plan", "idea": "Use a flexible rehearsal budget: 5 minutes for scope, 7 for invariants and examples, 8 for objects and APIs, 15 for the core code, 7 for tests and 3 for tradeoffs. This is a practice plan, not a company rubric.", "mental": "When time is short, finish one correct vertical slice instead of adding many empty classes.", "code": "scope -> rules -> objects -> core -> tests", "gotcha": "A polished diagram with an unfinished key operation leaves the most important behavior unproven.", "question": "You have ten minutes left. What is the best next move?", "options": ["Finish and test the highest-risk operation", "Add every optional pattern", "Rename all classes again"], "answer": 0, "explanation": "Working behavior gives you something concrete to defend. Extra architecture cannot replace it.", "practice": "Use the Mock Interview panel and score yourself only after implementing the core.", "flow": ["Scope", "Model", "Implement", "Defend"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L013", "number": 13, "module": "F2", "title": "Identity and value are different questions", "idea": "An entity is the same thing over time even when its fields change. A value object is interchangeable with another equal value. Make that distinction before defining equality.", "mental": "A car keeps its identity after repainting. A date range is defined by its endpoints.", "code": "record CarId(String value) {}\nrecord Range(Instant start, Instant end) {}", "gotcha": "Including mutable business fields in an entity's hash code can make hash-based lookup unreliable after mutation.", "question": "Should a repaint create a new car identity?", "options": ["Yes; every field defines entity identity", "Only if the car is inside a list", "No; identity is independent of the color"], "answer": 2, "explanation": "Stable IDs model the same entity through changing state. Value equality is appropriate for the range.", "practice": "Choose entity or value for Seat, SeatId, Money, Booking and Address.", "flow": ["Identity", "Lifecycle", "Value", "Equality"], "sources": ["S02", "S04"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L014", "number": 14, "module": "F2", "title": "A record is shallowly immutable", "idea": "Record components cannot be reassigned, but a component can refer to a mutable object. Copy incoming collections and choose immutable element types when callers must not mutate your value.", "mental": "A record containing ArrayList is not a deep snapshot. A copy protects the list structure, not mutable elements inside it.", "code": "record Basket(List<String> skus) {\n    Basket { skus = List.copyOf(skus); }\n}", "gotcha": "Returning the original mutable list gives callers a back door around your invariant.", "question": "What does List.copyOf protect here?", "options": ["Only the original list variable name", "The list structure; strings are already immutable", "Every possible mutable object recursively"], "answer": 1, "explanation": "The copy is shallow. Its safety depends on the element types too.", "practice": "Change the element type to MutableItem. Explain what additional copying or modeling is required.", "flow": ["Caller list", "Defensive copy", "Private state", "Safe view"], "sources": ["S01", "S03"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L015", "number": 15, "module": "F2", "title": "Construct only valid values", "idea": "Validate local rules in the constructor: IDs are nonblank, ranges are nonempty, amounts obey the model. Cross-object rules belong to the operation that has the needed context.", "mental": "A Range can reject start >= end. It cannot know whether room R already has another booking.", "code": "record SeatId(String value) {\n    SeatId {\n        if (value == null || value.isBlank())\n            throw new IllegalArgumentException();\n    }\n}", "gotcha": "A constructor that calls a remote service makes simple value creation slow and failure-prone.", "question": "Where should \"this room has no overlap\" be checked?", "options": ["In the booking operation with calendar context", "Only in the Range constructor", "Nowhere after the ID is valid"], "answer": 0, "explanation": "The rule depends on other bookings, not just the new range.", "practice": "Implement a positive Quantity value and distinguish it from a nonnegative StockCount.", "flow": ["Local validation", "Valid value", "Context rule", "Operation"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L016", "number": 16, "module": "F2", "title": "Encapsulation means controlling change", "idea": "Private fields help only when the public methods express meaningful actions. Replace broad setters with verbs that check the rules. Return snapshots rather than live mutable collections.", "mental": "withdraw(amount) can reject insufficient balance. setBalance(anything) cannot explain why the change is allowed.", "code": "void reserve(int quantity);\nvoid release(ReservationId id);\nStockSnapshot snapshot();", "gotcha": "A public getMutableReservations method undoes the protection of private fields.", "question": "Which interface better protects inventory?", "options": ["setAvailable(anyInteger)", "Expose the reservations map", "reserve(quantity) with validation"], "answer": 2, "explanation": "The operation can keep stock and reservations consistent. Independent setters cannot do so reliably.", "practice": "Refactor a booking with setStatus into confirm, cancel and expire.", "flow": ["Private state", "Guarded action", "Invariant", "Snapshot"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L017", "number": 17, "module": "F2", "title": "Enums remove impossible spellings", "idea": "Use an enum for a closed vocabulary such as reservation status. The enum lists possible states; it does not by itself define which transitions are legal.", "mental": "CONFIRMED is a status. Whether HELD can become CONFIRMED still requires an ownership and expiry check.", "code": "enum Status { HELD, CONFIRMED, CANCELLED }", "gotcha": "Accepting every enum value in setStatus still permits invalid transitions.", "question": "Does an enum automatically validate transitions?", "options": ["Only when enum names are uppercase", "No; transition rules are separate", "Yes; all enum changes are safe"], "answer": 1, "explanation": "A closed set prevents typos, not illegal state-machine edges.", "practice": "List allowed and forbidden edges for a three-state loan.", "flow": ["Closed values", "Transition guard", "Action", "Next state"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L018", "number": 18, "module": "F2", "title": "Composition keeps policies replaceable", "idea": "Give an object a collaborator instead of inheriting behavior merely to reuse code. Use inheritance when the subtype can honor the full base contract.", "mental": "A parking lot has a PricingPolicy. A discounted lot is not necessarily a new subtype of every lot operation.", "code": "final class Checkout {\n    private final PricingPolicy pricing;\n    Checkout(PricingPolicy p) { pricing = p; }\n}", "gotcha": "Changing one pricing formula should not require duplicating entry, exit and ticket lifecycle code.", "question": "Which model isolates pricing changes?", "options": ["Checkout has a PricingPolicy", "Every price creates a new Ticket subclass", "One giant switch in every controller"], "answer": 0, "explanation": "Composition localizes the variation behind one contract.", "practice": "Replace hard-coded notification delivery with a Sender dependency.", "flow": ["Service", "Uses policy", "Small contract", "Replacement"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L019", "number": 19, "module": "F2", "title": "An interface is a promise, not decoration", "idea": "Create an interface around meaningful variation or a boundary you want to fake in tests. Describe failures, side effects and thread-safety along with the signature.", "mental": "A PaymentPort can return approved, declined or unknown. A boolean loses the uncertainty of a timeout.", "code": "interface PaymentPort {\n    PaymentResult charge(PaymentRequest request);\n}", "gotcha": "One implementation does not automatically make an interface wrong, but an interface without a useful boundary adds noise.", "question": "Why put a clock behind an injectable dependency?", "options": ["To increase the class count", "To ensure wall time never changes", "To control time in tests and remove a hidden input"], "answer": 2, "explanation": "The caller supplies a stable dependency instead of every method reading ambient time.", "practice": "Write the contract for a repository method that tries to claim one resource.", "flow": ["Promise", "Implementation", "Fake", "Test"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L020", "number": 20, "module": "F2", "title": "Polymorphism replaces a decision in one place", "idea": "Let callers invoke the shared behavior while implementations vary. Keep the decision about which implementation to use at a composition boundary.", "mental": "EqualSplit and WeightedSplit both produce a complete allocation. Expense creation checks that the resulting shares sum to the amount.", "code": "interface SplitPolicy {\n    Map<String, Long> split(long amount,\n                            List<String> members);\n}", "gotcha": "If every caller still switches on the concrete policy type, the polymorphism is not doing its job.", "question": "What belongs outside a split policy?", "options": ["Defining a deterministic remainder rule", "Persisting the expense and sending notifications", "Computing each member's share"], "answer": 1, "explanation": "Keep pure allocation separate from orchestration and side effects.", "practice": "Design two implementations of a delivery-fee policy with the same postcondition.", "flow": ["Input", "Policy", "Allocation", "Validation"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L021", "number": 21, "module": "F2", "title": "Generics make reusable containers honest", "idea": "Use type parameters when behavior is independent of the value type. A cache needs key equality and capacity rules; it should not know about hotels or students.", "mental": "Cache<K,V> separates storage behavior from a particular domain while retaining compile-time type checks.", "code": "interface Cache<K,V> {\n    Optional<V> get(K key);\n    void put(K key, V value);\n}", "gotcha": "A raw Map throws away checks. Generic type parameters also do not make mutable values thread-safe.", "question": "Does Cache<String, List<Item>> protect Item mutations?", "options": ["No; value ownership needs its own contract", "Yes; generics imply immutability", "Yes; all nested types are copied"], "answer": 0, "explanation": "Generics constrain types, not aliasing or concurrency.", "practice": "Document whether your cache stores values by reference or copies them.", "flow": ["Type contract", "Key", "Value", "Ownership"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L022", "number": 22, "module": "F2", "title": "Choose a collection for the operation", "idea": "Pick structures from required work: hash lookup by ID, ordered traversal, FIFO work, or nearest time. Additional indexes improve reads but create additional consistency rules.", "mental": "A meeting calendar can start with a list. A second index by start time must stay consistent on booking and cancellation.", "code": "Map<BookingId, Booking> byId;\nNavigableMap<Instant, Booking> byStart;", "gotcha": "A PriorityQueue iterator is not a sorted traversal. Repeated polling is different from iteration.", "question": "Why is a second index not free?", "options": ["It automatically makes every operation O(1)", "It eliminates all concurrency questions", "Every mutation must keep both representations aligned"], "answer": 2, "explanation": "The read speed-up comes with memory and write-maintenance cost.", "practice": "For an elevator, compare a FIFO queue and an ordered set of stops.", "flow": ["Access need", "Structure", "Cost", "Maintenance"], "sources": ["S10"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L023", "number": 23, "module": "F2", "title": "Equality and sorting are separate contracts", "idea": "Equal objects must have equal hash codes. A comparator decides ordering and may need a stable tie-breaker when multiple tasks share a deadline. Use comparison helpers instead of subtraction.", "mental": "If a TreeSet comparator returns zero for different booking IDs, those entries are equivalent for that set's ordering.", "code": "Comparator<Task> order = Comparator\n    .comparing(Task::dueAt)\n    .thenComparing(Task::id);", "gotcha": "a.priority - b.priority can overflow. A missing tie-breaker can accidentally collapse distinct elements in an ordered set.", "question": "Two tasks share a due time but must both be kept. What helps?", "options": ["Return zero for every tie and hope", "Order by due time, then stable unique ID", "Compare only the due time in a TreeSet"], "answer": 1, "explanation": "The secondary key distinguishes independently scheduled tasks.", "practice": "Write equality for a BookingId and ordering for Booking without mixing the two.", "flow": ["Equality", "Hashing", "Ordering", "Tie-break"], "sources": ["S02", "S09"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L024", "number": 24, "module": "F2", "title": "Make failure visible in the API", "idea": "Use an exception or a result type deliberately. Separate invalid input, ordinary domain rejection and an unexpected infrastructure failure. Avoid a boolean when the caller needs a reason.", "mental": "A booking can fail because the room is busy; that is not the same as the repository being unreachable.", "code": "enum Reject { BUSY, EXPIRED, WRONG_OWNER }\nrecord Decision(boolean accepted, Reject reason) {}", "gotcha": "This minimal result needs an invariant: accepted means reason is absent. A richer sealed hierarchy can encode that structure explicitly.", "question": "Should a payment timeout be returned as a definite decline?", "options": ["No; the external outcome may be unknown", "Yes; no reply proves no charge", "Only when the amount is small"], "answer": 0, "explanation": "Uncertainty must survive the API boundary so callers do not blindly create another charge.", "practice": "Define a result type for a hold attempt with success and conflict variants.", "flow": ["Input error", "Domain reject", "Unknown outcome", "Success"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L025", "number": 25, "module": "F3", "title": "Single responsibility: one reason to change", "idea": "Keep unrelated policies apart. A class may have several methods that all protect one coherent responsibility; the goal is not one method per class.", "mental": "An invoice calculation changes with pricing rules. Email formatting changes with communications. Separate them.", "code": "Money total = calculator.total(lines);\nmailer.send(invoiceView);", "gotcha": "Splitting every tiny method into a new class can make the design harder to follow without separating real concerns.", "question": "What is a useful split?", "options": ["One class per local variable", "One giant InvoiceManager for everything", "Pricing calculation separate from email delivery"], "answer": 2, "explanation": "Pricing and delivery evolve independently and can be tested separately.", "practice": "Find two unrelated responsibilities in a logger and separate them.", "flow": ["Reason to change", "Boundary", "Dependency", "Test"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L026", "number": 26, "module": "F3", "title": "Open for an expected variation", "idea": "Create a stable contract where the requirement already varies. Do not build a universal plug-in framework for hypothetical future features.", "mental": "A shipping-fee policy can vary by region. The order lifecycle should not know each formula.", "code": "interface ShippingFee {\n    Money quote(Shipment shipment);\n}", "gotcha": "An interface cannot protect a contract that never specified rounding, currency or failure behavior.", "question": "When is a policy interface justified?", "options": ["Only after every possible feature is known", "Two expected formulas share a stable contract", "Whenever a class has one method"], "answer": 1, "explanation": "A real variation point earns the abstraction.", "practice": "Add a weekend pricing policy without editing the reservation transition rules.", "flow": ["Stable contract", "Variation", "New policy", "Same caller"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L027", "number": 27, "module": "F3", "title": "Substitution means preserving promises", "idea": "A subtype must accept the promised inputs and maintain the promised outcomes. Inheritance for code reuse is not enough when behavior becomes surprising.", "mental": "A read-only repository should not implement a writable contract by throwing UnsupportedOperationException for every save.", "code": "interface Reader { Item find(Id id); }\ninterface Writer { void save(Item item); }", "gotcha": "A subtype that silently weakens atomicity or drops validation breaks callers even when the method signatures match.", "question": "Which subtype violates a no-negative-balance contract?", "options": ["One that allows overdrafts without changing the contract", "One that uses a different internal map", "One that logs the call after success"], "answer": 0, "explanation": "Behavioral promises matter, not the private implementation.", "practice": "Explain why Square-versus-Rectangle setters can violate expectations; propose immutable values instead.", "flow": ["Base promise", "Subtype", "Same expectations", "Safe caller"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L028", "number": 28, "module": "F3", "title": "Small interfaces reduce accidental dependency", "idea": "Give a caller only the operations it needs. A search screen should not depend on administrator deletion functions just because both use the same data.", "mental": "A catalog reader and catalog editor can be different ports backed by the same repository implementation.", "code": "interface CatalogReader {\n    List<ItemView> search(Query query);\n}", "gotcha": "Do not fragment interfaces so far that one coherent operation needs twenty trivial collaborators.", "question": "What should a public booking viewer depend on?", "options": ["A global administrator service", "The mutable internal booking map", "A read-only booking query interface"], "answer": 2, "explanation": "The narrow interface limits both coupling and unintended mutation.", "practice": "Split a broad FileSystem interface into a read view and controlled edit operations.", "flow": ["Caller need", "Narrow port", "Implementation", "Least access"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L029", "number": 29, "module": "F3", "title": "Dependency inversion makes effects replaceable", "idea": "Let business rules depend on a small port, not directly on a database driver or network client. Wire concrete implementations at the edge.", "mental": "Checkout should ask PaymentPort to charge; a fake can simulate decline or uncertainty without a real bank.", "code": "Checkout checkout = new Checkout(fakePayments);", "gotcha": "An interface that simply exposes the entire vendor SDK has not created a meaningful domain boundary.", "question": "Where should a vendor error code be translated?", "options": ["Only in the user interface", "Inside the adapter at the port boundary", "Throughout every domain object"], "answer": 1, "explanation": "The domain sees a stable vocabulary rather than external implementation details.", "practice": "Write a fake Sender that records messages and can fail the next call.", "flow": ["Domain rule", "Port", "Adapter", "External system"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L030", "number": 30, "module": "F3", "title": "Strategy: swap the decision rule", "idea": "Use Strategy when one operation has alternative algorithms with the same contract. The owner still validates inputs and resulting invariants.", "mental": "Different spot-allocation policies return a suitable candidate; ParkingLot performs the atomic claim.", "code": "Spot candidate = allocation.choose(free, vehicle);\n// Validate and claim under the owner's boundary.", "gotcha": "A strategy choosing a spot does not automatically reserve it. Selection and ownership are distinct.", "question": "Who must atomically claim the chosen spot?", "options": ["The parking-lot consistency owner", "The UI after rendering the choice", "Every strategy using its own private lock"], "answer": 0, "explanation": "The owner protects the shared state regardless of which selection rule is used.", "practice": "Name the postcondition for a split policy and one reason to reject its output.", "flow": ["Context", "Strategy", "Decision", "Commit"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L031", "number": 31, "module": "F3", "title": "State: behavior follows lifecycle", "idea": "Use a State object when behavior varies substantially with lifecycle state. For a few transitions, an enum plus guarded methods can be clearer. Choose the smaller correct model.", "mental": "A vending machine may accept coins while collecting credit and reject them while dispensing.", "code": "switch (state) {\n    case IDLE, COLLECTING -> accept(coin);\n    default -> throw new IllegalStateException();\n}", "gotcha": "A State class hierarchy can hide the transition graph if no one documents allowed edges.", "question": "For three simple states, is an enum acceptable?", "options": ["No, every state requires a class", "Only if no tests exist", "Yes, when transitions are explicit and guarded"], "answer": 2, "explanation": "Patterns are tools. The simplest model that explains the rules is often easier to defend.", "practice": "Model a booking both ways; compare the amount of behavior that actually varies.", "flow": ["State", "Allowed command", "Action", "Next state"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L032", "number": 32, "module": "F3", "title": "Factory and Builder solve different problems", "idea": "A factory chooses or creates an appropriate object. A builder collects parameters for a complex object and validates the final combination. Neither replaces a valid constructor contract.", "mental": "A SenderFactory selects SMS or email. An immutable NotificationRequest builder assembles optional metadata.", "code": "Sender sender = factory.forChannel(channel);\nNotification n = builder.message(text).build();", "gotcha": "A builder that permits impossible final combinations merely postpones errors.", "question": "Which is the factory's primary job here?", "options": ["Run database migrations", "Choose the sender implementation for a channel", "Guarantee remote delivery exactly once"], "answer": 1, "explanation": "Creation and selection differ from external delivery semantics.", "practice": "Remove a builder from a two-field value object and explain why the constructor is enough.", "flow": ["Creation need", "Factory choice", "Builder data", "Valid object"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L033", "number": 33, "module": "F3", "title": "Observer: notify without knowing every consumer", "idea": "Publish a domain event to registered observers. Define ordering, exception isolation and subscription lifetime. Synchronous callbacks and durable messaging have different contracts.", "mental": "When one listener throws, decide whether later listeners still run. The workshop baseline catches each listener failure and reports it.", "code": "for (Listener listener : snapshot) {\n    try { listener.on(event); }\n    catch (RuntimeException e) { failures.add(e); }\n}", "gotcha": "Calling arbitrary listeners while holding an internal lock can cause reentrancy, long stalls or deadlock.", "question": "Should an in-memory observer API promise crash recovery?", "options": ["No, not without persistence and a recovery design", "Yes, because listeners are interfaces", "Yes, if it uses a singleton"], "answer": 0, "explanation": "A callback list exists only in memory. A durable broker is a separate scope.", "practice": "Specify what unsubscribe during publication means for the current event.", "flow": ["Publisher", "Snapshot", "Listener", "Failure policy"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L034", "number": 34, "module": "F3", "title": "Command: represent an operation as data", "idea": "A command contains enough information to execute an action. Undo requires a valid inverse or a saved prior state; it is not automatic for every action.", "mental": "InsertText stores position and text. DeleteText must remember the removed text to restore it.", "code": "interface Edit {\n    void apply(Document d);\n    void undo(Document d);\n}", "gotcha": "Sending an email cannot usually be undone by deleting a local command object. Distinguish reversal from compensation.", "question": "What must a delete command retain for undo?", "options": ["Only the word DELETE", "Only the current document length", "The deleted content and its original position"], "answer": 2, "explanation": "The inverse needs the information lost by the forward operation.", "practice": "Explain why a new edit after undo clears the redo branch in this baseline.", "flow": ["Command", "Apply", "History", "Inverse"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L035", "number": 35, "module": "F3", "title": "Adapter and Decorator change different things", "idea": "An adapter translates an incompatible interface. A decorator preserves the interface while adding behavior around it. Define whether the added behavior changes latency, failure or ownership.", "mental": "A payment adapter translates a vendor response. A metrics decorator measures calls through the same PaymentPort.", "code": "PaymentPort port = new MetricsPayments(\n    new VendorPayments(client));", "gotcha": "A retry decorator can duplicate effects unless the wrapped operation has a retry-safe contract.", "question": "Which wrapper needs the strongest idempotency warning?", "options": ["A metrics label builder", "A retry wrapper around charge", "A formatter adapter for a local value"], "answer": 1, "explanation": "Retry can repeat an externally visible operation. Timing and logging are different concerns.", "practice": "Wrap a Sender with metrics without swallowing its failure result.", "flow": ["Same interface", "Before", "Delegate", "After"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L036", "number": 36, "module": "F3", "title": "Composite: a tree with uniform read behavior", "idea": "A composite lets callers traverse leaves and containers through a common abstraction. Do not force every leaf to support nonsensical mutation operations.", "mental": "Files have size. Directories contain entries. A recursive search visits both through Entry, but only Directory can add children.", "code": "interface Entry { String name(); }\nfinal class Directory implements Entry {\n    List<Entry> children;\n}", "gotcha": "Real file systems may include symbolic links and cycles. A strict tree model must explicitly exclude or handle them.", "question": "Where should addChild live?", "options": ["On Directory or a writable-container interface", "On every File and fail at runtime", "On String"], "answer": 0, "explanation": "Only containers can satisfy the operation honestly.", "practice": "Add a visitor that computes total size; explain how links change the traversal contract.", "flow": ["Directory", "Child entry", "Leaf", "Traversal"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L037", "number": 37, "module": "F4", "title": "Write preconditions and postconditions", "idea": "A method contract tells callers what must be true before the call and what becomes true after success. Also describe what remains unchanged on rejection.", "mental": "reserve(q): q is positive; success lowers available by q and creates one reservation; rejection changes nothing.", "code": "// pre: q > 0\n// success: available decreases by q\n// rejection: state is unchanged", "gotcha": "A method that partly mutates before validation violates the unchanged-on-failure contract.", "question": "When should validation occur?", "options": ["After decrementing every counter", "Only in the caller", "Before the first externally visible mutation"], "answer": 2, "explanation": "Plan first, then commit. This makes rejection behavior easier to guarantee.", "practice": "Write a contract for atomic multi-seat booking.", "flow": ["Precondition", "Plan", "Commit", "Postcondition"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L038", "number": 38, "module": "F4", "title": "Money needs a unit and a rounding rule", "idea": "For this workbook's integer-money examples, store a currency and long minor units. Validate currency compatibility and detect overflow. For decimal pricing, specify scale and rounding explicitly.", "mental": "Splitting 100 minor units among three members needs 34, 33, 33 in a documented deterministic order. Never lose the remainder.", "code": "long base = amount / members;\nlong remainder = amount % members;\nlong first = base + (remainder > 0 ? 1 : 0);", "gotcha": "Not every currency has two decimal places. BigDecimal.equals also compares scale; numeric comparison may need compareTo.", "question": "Why not silently use 0.33 three times for 1.00?", "options": ["Because three people cannot share a cost", "The shares would not conserve the original amount", "Because all decimal arithmetic is forbidden"], "answer": 1, "explanation": "The sum must equal the input amount. Remainder allocation is part of the policy.", "practice": "Define deterministic cent allocation and verify that all shares sum to the expense.", "flow": ["Currency", "Minor units", "Rounding", "Conservation"], "sources": ["S08"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L039", "number": 39, "module": "F4", "title": "Time ranges need endpoint semantics", "idea": "Use half-open intervals [start,end) in this workshop. They include the start and exclude the end, so adjacent bookings can touch. Separate calendar instants from elapsed-time measurements.", "mental": "[10:00,11:00) and [11:00,12:00) do not overlap. The test is a.start < b.end and b.start < a.end.", "code": "boolean overlaps(Range a, Range b) {\n    return a.start().isBefore(b.end())\n        && b.start().isBefore(a.end());\n}", "gotcha": "LocalDateTime alone cannot uniquely identify every instant around time-zone transitions. A monotonic elapsed timer is not a persisted timestamp.", "question": "Do [10,11) and [11,12) overlap?", "options": ["No; their shared boundary is excluded from the first", "Yes; equal endpoints always overlap", "Only when the calendar uses a map"], "answer": 0, "explanation": "The half-open convention makes adjacency unambiguous.", "practice": "Test an empty interval, a contained interval and exact adjacency.", "flow": ["Start inclusive", "Occupied interval", "End exclusive", "Adjacent OK"], "sources": ["S07", "S13"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L040", "number": 40, "module": "F4", "title": "Thread-safe containers do not protect workflows", "idea": "Choose an atomic boundary around the complete invariant. Thread-safe access to two independent entries does not turn their combined update into a transaction.", "mental": "Two gates can both read free=true before either marks the last spot occupied. Protect choose-and-claim as one action.", "code": "synchronized Ticket park(Vehicle v) {\n    Spot spot = chooseFree(v);\n    return claimAndIssue(spot, v);\n}", "gotcha": "A ConcurrentHashMap protects its own operations; it does not make the fields of stored mutable objects automatically safe.", "question": "What needs protection in choose-and-claim?", "options": ["Only creating the HashMap", "Only formatting the ticket ID", "The complete decision and state change"], "answer": 2, "explanation": "The losing caller must observe the updated ownership before it can also succeed.", "practice": "Write the two-thread failing interleaving for a non-atomic stock reservation.", "flow": ["Read", "Check", "Claim", "Publish"], "sources": ["S06", "S15"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L041", "number": 41, "module": "F4", "title": "Idempotency binds a key to one intent", "idea": "Remember both the request identity and its relevant payload. An identical successful retry returns the prior result; reusing the key for a different intent must be rejected. Define retention and failed-request behavior too.", "mental": "Transfer key K from A to B for 10 is not interchangeable with K from A to C for 20.", "code": "if (prior != null) {\n    requireSamePayload(prior, request);\n    return prior.result();\n}", "gotcha": "A map of key -> success boolean cannot detect conflicting reuse. Process restart also loses an in-memory registry.", "question": "What should conflicting reuse of an idempotency key do?", "options": ["Silently rewrite the old result", "Reject it rather than return a misleading old result", "Treat it as a brand-new request"], "answer": 1, "explanation": "A stable key must identify one logical intent. Otherwise deduplication hides corruption.", "practice": "Specify whether a rejected insufficient-funds request consumes its key in your chosen model.", "flow": ["Key", "Payload match", "Prior result", "No new effect"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L042", "number": 42, "module": "F4", "title": "An external timeout creates uncertainty", "idea": "When a remote side effect has no confirmed outcome, keep an UNKNOWN or pending-reconciliation state. Do not equate \"I did not receive success\" with \"nothing happened\".", "mental": "A charge may finish while its reply is lost. Reconcile with the provider reference or retry through the provider's supported idempotency mechanism.", "code": "enum PaymentState {\n    REQUESTED, APPROVED, DECLINED, UNKNOWN\n}", "gotcha": "Holding a Java lock during a network call can stall unrelated work and still cannot atomically commit the remote effect.", "question": "A charge request times out. What is known?", "options": ["The local caller lacks a final outcome", "The customer was definitely not charged", "The provider must be retried with a new key"], "answer": 0, "explanation": "The uncertainty is a fact about observation, not proof of failure.", "practice": "Draw the boundary between a local seat hold and remote payment confirmation.", "flow": ["Local intent", "Remote call", "Unknown outcome", "Reconcile"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L043", "number": 43, "module": "F4", "title": "Repository contracts must express atomic work", "idea": "A repository is a storage boundary, not just CRUD boilerplate. If correctness requires a conditional claim, expose that operation rather than separate find and save calls.", "mental": "tryReserve(id,expectedVersion,change) states the conflict check. A later SQL implementation can enforce the same promise using its chosen transaction mechanism.", "code": "boolean updateIfVersionMatches(\n    Id id, long expectedVersion, Change change);", "gotcha": "A global singleton repository is not automatically durable, isolated or safe across processes.", "question": "Which repository contract preserves optimistic concurrency?", "options": ["Always overwrite the row from an old snapshot", "Fetch once and trust forever", "Update only if the stored version still matches"], "answer": 2, "explanation": "The conditional update detects a stale decision instead of silently losing another update.", "practice": "Write both a coarse-lock memory implementation and a persistence contract for a claim.", "flow": ["Load version", "Compute", "Conditional write", "Retry conflict"], "sources": ["S16", "S17"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L044", "number": 44, "module": "F4", "title": "Return snapshots with clear ownership", "idea": "A result should describe what the caller may safely observe. A defensive copy avoids exposing the mutable internal container; deep safety also depends on the objects inside it.", "mental": "Return immutable TicketView values rather than the live Ticket map. The view can become stale; it must not be a secret mutation channel.", "code": "return tickets.values().stream()\n    .map(TicketView::from)\n    .toList();", "gotcha": "An unmodifiable collection is not automatically an atomic snapshot if it is built while unrelated unsynchronized mutations occur.", "question": "Why return a value view?", "options": ["To eliminate all need for synchronization", "To separate observation from permission to mutate", "To guarantee it always reflects future changes"], "answer": 1, "explanation": "The caller gets a result with explicit ownership and freshness, not direct access to internal state.", "practice": "Define snapshot semantics for a cache stats endpoint.", "flow": ["Owned state", "Consistent read", "Immutable view", "Caller"], "sources": ["S03"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L045", "number": 45, "module": "F4", "title": "Fakes make edge cases repeatable", "idea": "Inject time, randomness and external ports. A fake clock can advance exactly to the expiry boundary. A scripted random source can force a ladder or a winning move.", "mental": "Do not sleep five minutes to test a hold. Move a fake clock to expiresAt and assert the chosen boundary behavior.", "code": "Clock clock = Clock.fixed(instant, zone);\n// A mutable test clock can advance explicitly.", "gotcha": "A fake should honor the port's contract, not merely return whatever makes the test pass.", "question": "Which test is most deterministic?", "options": ["Advance an injected clock to the exact deadline", "Sleep and hope the scheduler wakes precisely", "Read today's actual time in every assertion"], "answer": 0, "explanation": "Controlled inputs remove timing variability from a boundary test.", "practice": "Build a fake sender with scripted APPROVED, DECLINED and UNKNOWN responses.", "flow": ["Hidden input", "Inject port", "Script fake", "Repeat"], "sources": ["S07"], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L046", "number": 46, "module": "F4", "title": "Property tests check the rule beyond examples", "idea": "Examples show specific cases; property-style tests exercise many inputs and assert a general rule. Use a simple independent reference model where possible.", "mental": "For any nonnegative expense and nonempty unique member list, shares must be nonnegative and sum exactly to the expense.", "code": "for (long amount = 0; amount < 500; amount++) {\n    assert sum(split(amount, members)) == amount;\n}", "gotcha": "Testing an algorithm against a copied version of itself can reproduce the same bug in both.", "question": "Which is a strong general property for transfers?", "options": ["Every balance always increases", "Every request must succeed", "Total balance is conserved by a successful transfer"], "answer": 2, "explanation": "Conservation is independent of the chosen account IDs and transfer amount.", "practice": "Compare an LRU implementation against a tiny list-based reference model.", "flow": ["Generate inputs", "Run design", "Check invariant", "Shrink example"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L047", "number": 47, "module": "F4", "title": "Race tests need coordinated starts", "idea": "Use a barrier or latch to make competitors reach the risky boundary together. Check the invariant after all participants finish. One successful stress run is evidence, not a proof of thread safety.", "mental": "With one remaining seat and many contenders, exactly one hold should succeed while the seat is live.", "code": "CountDownLatch start = new CountDownLatch(1);\n// All workers await start before competing.\nstart.countDown();", "gotcha": "Thread.sleep is not a synchronization proof. Tests must also observe failures from worker threads.", "question": "What should a race test assert?", "options": ["Only that each thread started", "The final invariant and all worker outcomes", "Only that the process did not crash"], "answer": 1, "explanation": "A silent lost update can violate correctness without throwing an exception.", "practice": "Test one-item stock with 20 simultaneous reservation requests and collect every Future.", "flow": ["Align starts", "Compete", "Await results", "Assert invariant"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L048", "number": 48, "module": "F4", "title": "Defend the design with one change request", "idea": "After explaining the core, change one requirement. Show the smallest affected boundary, the new invariant and the new tests. Separate implemented behavior from a proposed extension.", "mental": "Adding cancellation to a scheduler changes the job lifecycle. It does not automatically require replacing every task type.", "code": "Core implemented -> limits -> proposed change\n-> new invariant -> tests", "gotcha": "No single diagram is the unique correct answer. Evaluate against the stated contract, not how many patterns appear.", "question": "What makes a tradeoff explanation persuasive?", "options": ["A specific alternative, cost and reason under the scope", "Calling the design enterprise-grade", "Claiming it handles every production scenario"], "answer": 0, "explanation": "A concrete comparison shows the reasoning and its limits.", "practice": "Record a two-minute walkthrough: scope, core rule, owner, race, test and one tradeoff.", "flow": ["Choice", "Alternative", "Cost", "Reason"], "sources": [], "level": "Core", "detail": "", "kind": "lesson"}, {"id": "L049", "number": 49, "module": "P01", "title": "Problem statement and scope", "idea": "Design the in-memory core of a parking lot. A vehicle enters, receives a ticket for a compatible free spot, and later exits. Reject an entry when no suitable spot is free. The same active vehicle must not be parked twice.", "mental": "One lot, several spot sizes, concurrent gates, integer fee units, and ticket lookup by ID. No reservations, payment network, sensors or multi-server coordination in the core.", "code": "", "gotcha": "A parking spot is not a Vehicle subclass.", "question": "Which core request is rejected?", "options": ["A retry of a completed exit", "A smaller vehicle using an allowed larger spot", "A second active entry for the same plate"], "answer": 2, "explanation": "A second active entry for the same plate. Can a smaller vehicle use a larger spot? Yes. Can a license plate have two active tickets? No. Is exit retry-safe? Yes: an already-closed ticket returns its recorded receipt.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S15"], "level": "Core", "detail": "Can a smaller vehicle use a larger spot? Yes. Can a license plate have two active tickets? No. Is exit retry-safe? Yes: an already-closed ticket returns its recorded receipt.", "kind": "step-1", "problem": "Parking lot", "step": 1, "slug": "parking"}, {"id": "L050", "number": 50, "module": "P01", "title": "Work through one example", "idea": "There are spots S1(size 1) and S2(size 2). Bike B(size 1) enters and takes S1. Car C(size 2) takes S2. Car D is rejected. B exits; a new bike can now claim S1.", "mental": "After both accepted entries there are two active tickets and zero free spots. After B exits there is one active ticket. A repeated exit does not free S1 again.", "code": "", "gotcha": "A closed ticket must not release the spot twice.", "question": "After B exits in the example, how many spots are free?", "options": ["Two", "One", "Zero"], "answer": 1, "explanation": "One. After both accepted entries there are two active tickets and zero free spots. After B exits there is one active ticket. A repeated exit does not free S1 again.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Gate", "ParkingLot", "Spot + ticket", "Ticket view"], "sources": ["S15"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Parking lot", "step": 2, "slug": "parking"}, {"id": "L051", "number": 51, "module": "P01", "title": "Write the invariants", "idea": "A spot has at most one active ticket.\nEvery active ticket references a compatible occupied spot.\nAn active vehicle has exactly one active ticket, and closed tickets never release a newer occupant.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "An accurate-looking availability counter can disagree with the actual spots.", "question": "Which relationship must remain true?", "options": ["An active ticket owns a compatible occupied spot", "Every ticket is always active", "Every car always uses the smallest spot"], "answer": 0, "explanation": "An active ticket owns a compatible occupied spot. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S15"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Parking lot", "step": 3, "slug": "parking"}, {"id": "L052", "number": 52, "module": "P01", "title": "Choose objects and ownership", "idea": "ParkingLot: owns spots, active plate index and ticket lifecycle.\nSpot: stable ID and capacity; occupancy is controlled by the lot.\nTicket: entry time, vehicle, assigned spot and optional receipt.\nAllocationPolicy: chooses a compatible candidate without claiming it.\nFeePolicy: computes a quote from validated duration and vehicle.", "mental": "The central consistency owner in this design is ParkingLot. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A policy chooses a candidate; it does not own shared occupancy.", "question": "Who owns choose-and-claim?", "options": ["FeePolicy", "TicketView", "ParkingLot"], "answer": 2, "explanation": "ParkingLot. ParkingLot has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["ParkingLot", "Spot", "Ticket", "AllocationPolicy"], "sources": ["S15"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Parking lot", "step": 4, "slug": "parking"}, {"id": "L053", "number": 53, "module": "P01", "title": "Design the public API", "idea": "park succeeds with a new immutable ticket view or rejects without changing occupancy. exit checks ticket status first; an identical retry returns the prior receipt. Availability is advisory, not a reservation.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "Ticket park(String plate, int size);\nReceipt exit(String ticketId);\nList<SpotView> availability();", "gotcha": "Returning internal Spot objects exposes mutation.", "question": "Why retain the closed ticket receipt?", "options": ["To recompute a higher fee on every retry", "To make an exit retry return the same result", "To make the spot permanently occupied"], "answer": 1, "explanation": "To make an exit retry return the same result. park succeeds with a new immutable ticket view or rejects without changing occupancy. exit checks ticket status first; an identical retry returns the prior receipt. Availability is advisory, not a reservation.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S15"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Parking lot", "step": 5, "slug": "parking"}, {"id": "L054", "number": 54, "module": "P01", "title": "Draw the state machine", "idea": "The spot cycles FREE to OCCUPIED to FREE. The ticket has ACTIVE to CLOSED only. These are two related lifecycles, not one shared enum. A closed ticket remembers its result and cannot act on a later occupant.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Spot state and ticket state are related but not identical.", "question": "Can a CLOSED ticket close a new occupant's ticket?", "options": ["No", "Yes, if the spot ID matches", "Yes, after one second"], "answer": 0, "explanation": "No. The spot cycles FREE to OCCUPIED to FREE. The ticket has ACTIVE to CLOSED only. These are two related lifecycles, not one shared enum. A closed ticket remembers its result and cannot act on a later occupant.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["FREE", "OCCUPIED", "EXITED", "FREE AGAIN"], "sources": ["S15"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Parking lot", "step": 6, "slug": "parking"}, {"id": "L055", "number": 55, "module": "P01", "title": "Trace the key operation", "idea": "Under one lot lock, reject an already-active plate, choose a compatible free spot, create a ticket ID, and update both occupancy and the active-plate index. Publish the ticket only after the owned state agrees. Exit computes a valid fee before releasing the spot.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Do not publish a ticket before claiming its spot.", "question": "When may the ticket be returned?", "options": ["Before a spot is chosen", "After only the display counter changes", "After occupancy and indexes agree"], "answer": 2, "explanation": "After occupancy and indexes agree. Under one lot lock, reject an already-active plate, choose a compatible free spot, create a ticket ID, and update both occupancy and the active-plate index. Publish the ticket only after the owned state agrees. Exit computes a valid fee before releasing the spot.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Gate", "ParkingLot", "Spot + ticket", "Ticket view"], "sources": ["S15"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Parking lot", "step": 7, "slug": "parking"}, {"id": "L056", "number": 56, "module": "P01", "title": "Read the core Java logic", "idea": "This is a contextual core sketch. Helper methods are owned by the lot and do not call remote services. Candidate selection and all index changes happen under the same lock. The complete companion uses a simple linear spot scan.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "synchronized Ticket park(String plate, int size) {\n    requireValid(plate, size);\n    rejectActivePlate(plate);\n    Spot spot = chooseCompatibleFree(size);\n    Ticket ticket = newTicket(plate, spot);\n    occupy(spot, ticket);\n    activeByPlate.put(plate, ticket.id());\n    return ticket;\n}", "gotcha": "An exception after half the index updates leaves inconsistent state.", "question": "What boundary belongs around the code?", "options": ["Only a lock around ID formatting", "One boundary covering selection and all owned updates", "A separate private lock for each gate"], "answer": 1, "explanation": "One boundary covering selection and all owned updates. This is a contextual core sketch. Helper methods are owned by the lot and do not call remote services. Candidate selection and all index changes happen under the same lock. The complete companion uses a simple linear spot scan.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S15"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Parking lot", "step": 8, "slug": "parking"}, {"id": "L057", "number": 57, "module": "P01", "title": "Handle races and failure", "idea": "Two entry gates must not both win the last spot. Synchronizing only Map.put leaves a check-then-act race. Use one lot-level lock in the baseline and keep every access to mutable occupancy behind it. A multi-process version needs a shared ownership mechanism, not more local locks.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "A per-gate lock does not coordinate two gates.", "question": "What prevents two gates taking one spot?", "options": ["Atomic lot-level choose-and-claim", "A concurrent map plus separate unchecked writes", "Reading availability earlier"], "answer": 0, "explanation": "Atomic lot-level choose-and-claim. Two entry gates must not both win the last spot. Synchronizing only Map.put leaves a check-then-act race. Use one lot-level lock in the baseline and keep every access to mutable occupancy behind it. A multi-process version needs a shared ownership mechanism, not more local locks.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S15"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Parking lot", "step": 9, "slug": "parking"}, {"id": "L058", "number": 58, "module": "P01", "title": "Build the test plan", "idea": "Two cars compete for the final compatible spot: exactly one succeeds.\nA vehicle cannot park twice while its first ticket is active.\nWrong-sized vehicles are rejected without changing indexes.\nExit twice returns one receipt and does not release a newer occupant.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "A race test must collect the losing result too.", "question": "What should two contenders for one spot yield?", "options": ["Two successful tickets", "Always two failures", "Exactly one success"], "answer": 2, "explanation": "Exactly one success. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S15"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Parking lot", "step": 10, "slug": "parking"}, {"id": "L059", "number": 59, "module": "P01", "title": "Change one requirement", "idea": "Add electric charging. Model charger capability separately from physical size; extend the compatibility predicate and add a charging-session policy. Do not create an inheritance tree for every size-plus-charger combination.", "mental": "A linear scan is easy to explain and costs O(S). Per-size free-spot indexes can reduce allocation work, but entry and exit must now update those indexes atomically too.", "code": "", "gotcha": "Vehicle size and charger capability are independent dimensions.", "question": "Where does charger compatibility belong?", "options": ["Ticket receipt formatting", "A capability-aware compatibility rule", "A new copy of the complete lot for every combination"], "answer": 1, "explanation": "A capability-aware compatibility rule. Add electric charging. Model charger capability separately from physical size; extend the compatibility predicate and add a charging-session policy. Do not create an inheritance tree for every size-plus-charger combination.
