idity more complex. Persistent text structures are another advanced alternative.", "kind": "step-12", "problem": "Text editor with undo and redo", "step": 12, "slug": "editor"}, {"id": "L289", "number": 289, "module": "P21", "title": "Problem statement and scope", "idea": "Design an in-process scheduler for a fixed directed acyclic graph of jobs. A job becomes ready after all of its prerequisites succeed. Ready jobs can run concurrently. Record success, failure and cancellation, and avoid scheduling a job twice.", "mental": "A fixed graph validated before execution, one logical run, bounded worker concurrency and no crash recovery. Retry attempts, dynamic graph changes and distributed workers are extensions.", "code": "", "gotcha": "An in-process scheduler does not survive process loss.", "question": "What graph is accepted?", "options": ["Any cyclic graph", "Only a single chain", "A validated fixed DAG"], "answer": 2, "explanation": "A validated fixed DAG. Must every prerequisite succeed? Yes. Does one failed prerequisite block a dependent? Yes under this policy. Are cycles rejected? Yes before work starts. Can one completion callback be delivered twice? The owner must guard against double application.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Deep", "detail": "Must every prerequisite succeed? Yes. Does one failed prerequisite block a dependent? Yes under this policy. Are cycles rejected? Yes before work starts. Can one completion callback be delivered twice? The owner must guard against double application.", "kind": "step-1", "problem": "Dependency-aware task scheduler", "step": 1, "slug": "scheduler"}, {"id": "L290", "number": 290, "module": "P21", "title": "Work through one example", "idea": "A precedes B,C,D. E depends on B and C; F depends on C and D. After A succeeds, B,C,D become ready. When B and C both succeed, E becomes ready exactly once, even if their completion callbacks race.", "mental": "A dependent is not ready when only one parent finishes. Its remaining-prerequisite count or equivalent state must be updated atomically with the ready transition.", "code": "", "gotcha": "A child with two parents is not ready after only one completes.", "question": "When does E become ready?", "options": ["After D alone", "After B and C both succeed", "After B alone"], "answer": 1, "explanation": "After B and C both succeed. A dependent is not ready when only one parent finishes. Its remaining-prerequisite count or equivalent state must be updated atomically with the ready transition.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Completion", "Scheduler state", "Remaining prerequisites", "Ready queue"], "sources": [], "level": "Deep", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Dependency-aware task scheduler", "step": 2, "slug": "scheduler"}, {"id": "L291", "number": 291, "module": "P21", "title": "Write the invariants", "idea": "A job enters RUNNING only after all required parents have succeeded.\nOne attempt completion is applied at most once.\nA ready transition enqueues the job at most once.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Duplicate completions must not make remaining counts negative.", "question": "How many times may one attempt completion be applied?", "options": ["At most once", "Once per callback thread", "Until the queue is empty"], "answer": 0, "explanation": "At most once. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Deep", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Dependency-aware task scheduler", "step": 3, "slug": "scheduler"}, {"id": "L292", "number": 292, "module": "P21", "title": "Choose objects and ownership", "idea": "Scheduler: owns job states, remaining counts and ready queue.\nJob: ID, task function and immutable prerequisites.\nRunState: status, attempt ID and completion details.\nWorkerPool: executes submitted ready tasks.\nDependencyIndex: parent-to-dependent edges.", "mental": "The central consistency owner in this design is Scheduler. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Workers execute tasks; the scheduler owns dependency state.", "question": "Who owns remaining-prerequisite counts?", "options": ["WorkerPool", "Job function", "Scheduler"], "answer": 2, "explanation": "Scheduler. Scheduler has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Scheduler", "Job", "RunState", "WorkerPool"], "sources": [], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Dependency-aware task scheduler", "step": 4, "slug": "scheduler"}, {"id": "L293", "number": 293, "module": "P21", "title": "Design the public API", "idea": "Validate unique IDs, known prerequisites and acyclicity. Bind completions to attempt IDs so a late attempt cannot overwrite a retry. This baseline records no durable recovery state; process loss loses the run.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "RunId start(List<Job> dag);\nvoid onComplete(JobId job, AttemptId attempt, Outcome result);\nRunView status(RunId run);\nvoid cancel(RunId run);", "gotcha": "Attempt identity matters once retries exist.", "question": "Why include AttemptId?", "options": ["To avoid graph validation", "To distinguish current completion from stale attempts", "Only to sort job names"], "answer": 1, "explanation": "To distinguish current completion from stale attempts. Validate unique IDs, known prerequisites and acyclicity. Bind completions to attempt IDs so a late attempt cannot overwrite a retry. This baseline records no durable recovery state; process loss loses the run.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Deep", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Dependency-aware task scheduler", "step": 5, "slug": "scheduler"}, {"id": "L294", "number": 294, "module": "P21", "title": "Draw the state machine", "idea": "A root starts READY. Claiming a ready job changes it to RUNNING. A successful completion may unlock dependents. A failure blocks descendants that require success, or follows another explicitly chosen policy. CANCELLED needs an outcome distinct from successful completion.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "FAILED and BLOCKED are not the same event.", "question": "A failed prerequisite causes what here?", "options": ["A defined BLOCKED dependent outcome", "Automatic success of dependents", "Ignoring the edge"], "answer": 0, "explanation": "A defined BLOCKED dependent outcome. A root starts READY. Claiming a ready job changes it to RUNNING. A successful completion may unlock dependents. A failure blocks descendants that require success, or follows another explicitly chosen policy. CANCELLED needs an outcome distinct from successful completion.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["WAITING", "READY", "RUNNING", "SUCCEEDED / FAILED / BLOCKED"], "sources": [], "level": "Deep", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Dependency-aware task scheduler", "step": 6, "slug": "scheduler"}, {"id": "L295", "number": 295, "module": "P21", "title": "Trace the key operation", "idea": "Under the scheduler state boundary, verify the attempt is currently RUNNING and not yet completed. Record its outcome once. On success, update each dependent's remaining count; when the count reaches zero and status is WAITING, mark READY and enqueue once.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Mark READY and enqueue as one logical transition.", "question": "What must accompany count reaching zero?", "options": ["An unconditional enqueue on every callback", "A new duplicate job ID", "One guarded WAITING-to-READY enqueue"], "answer": 2, "explanation": "One guarded WAITING-to-READY enqueue. Under the scheduler state boundary, verify the attempt is currently RUNNING and not yet completed. Record its outcome once. On success, update each dependent's remaining count; when the count reaches zero and status is WAITING, mark READY and enqueue once.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Completion", "Scheduler state", "Remaining prerequisites", "Ready queue"], "sources": [], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Dependency-aware task scheduler", "step": 7, "slug": "scheduler"}, {"id": "L296", "number": 296, "module": "P21", "title": "Read the core Java logic", "idea": "The sketch is the successful-completion branch and assumes a single shared state boundary. Failure propagation, queue-to-worker claiming and rejected executor submissions require their own transitions. Never mark a task submitted without handling submission rejection.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "if (!isCurrentRunningAttempt(job, attempt)) return;\nmarkSucceeded(job, attempt);\nfor (JobId child : dependents(job)) {\n    int left = decrementRemaining(child);\n    if (left == 0 && state(child) == WAITING) {\n        setState(child, READY);\n        ready.add(child);\n    }\n}", "gotcha": "The success branch alone is not a complete scheduler.", "question": "What does the sketch omit?", "options": ["The need for a ready queue", "Failure, submission rejection and cancellation branches", "The idea of dependencies"], "answer": 1, "explanation": "Failure, submission rejection and cancellation branches. The sketch is the successful-completion branch and assumes a single shared state boundary. Failure propagation, queue-to-worker claiming and rejected executor submissions require their own transitions. Never mark a task submitted without handling submission rejection.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Dependency-aware task scheduler", "step": 8, "slug": "scheduler"}, {"id": "L297", "number": 297, "module": "P21", "title": "Handle races and failure", "idea": "B and C may finish simultaneously. Protect each decrement together with the WAITING-to-READY transition, and reject duplicate completion for a finished attempt. Execute user tasks outside the state lock. Bounded workers prevent unbounded parallel launch, but a huge ready queue still needs a limit.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Never run user task code while holding the scheduler state lock.", "question": "Where should task code run?", "options": ["Outside the scheduler state lock", "Inside every dependency update lock", "In the graph constructor"], "answer": 0, "explanation": "Outside the scheduler state lock. B and C may finish simultaneously. Protect each decrement together with the WAITING-to-READY transition, and reject duplicate completion for a finished attempt. Execute user tasks outside the state lock. Bounded workers prevent unbounded parallel launch, but a huge ready queue still needs a limit.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Deep", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Dependency-aware task scheduler", "step": 9, "slug": "scheduler"}, {"id": "L298", "number": 298, "module": "P21", "title": "Build the test plan", "idea": "E waits until both B and C succeed.\nDuplicate completion for B does not decrement E twice.\nA cycle or unknown prerequisite is rejected before execution.\nA failed parent leads to a defined blocked outcome for its dependents.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test racing completions for a shared child.", "question": "Which test catches double decrement?", "options": ["Only run one root task", "Only print the DAG", "Deliver the same completion twice"], "answer": 2, "explanation": "Deliver the same completion twice. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Deep", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Dependency-aware task scheduler", "step": 10, "slug": "scheduler"}, {"id": "L299", "number": 299, "module": "P21", "title": "Change one requirement", "idea": "Add retries with a new attempt ID and policy for backoff and deadlines. A late success from an old attempt must not count as the current attempt's completion. External task side effects need their own retry-safe contract.", "mental": "A central scheduler lock makes dependency transitions easy to inspect. Finer-grained atomics can reduce contention but must still couple count updates with one ready enqueue. Distributed scheduling introduces leases and durable state beyond this core.", "code": "", "gotcha": "A retry does not make arbitrary external effects safe.", "question": "What must a late old-attempt completion do?", "options": ["Reset all child counts", "Not overwrite the current attempt's state", "Always count as another success"], "answer": 1, "explanation": "Not overwrite the current attempt's state. Add retries with a new attempt ID and policy for backoff and deadlines. A late success from an old attempt must not count as the current attempt's completion. External task side effects need their own retry-safe contract.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Deep", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Dependency-aware task scheduler", "step": 11, "slug": "scheduler"}, {"id": "L300", "number": 300, "module": "P21", "title": "Defend the design", "idea": "I trace the multi-parent race, not only a root job. The key event is an idempotent completion that atomically unlocks a dependent once. I separate graph validation, state ownership and worker execution.", "mental": "V jobs and E edges: graph validation and total dependency bookkeeping O(V + E). Memory O(V + E), plus task data and queueing. Task execution cost is separate.", "code": "", "gotcha": "A bounded worker pool does not automatically bound the ready queue.", "question": "What is total graph bookkeeping cost?", "options": ["O(V + E)", "Always O(1)", "O(V factorial) for every DAG"], "answer": 0, "explanation": "O(V + E). A central scheduler lock makes dependency transitions easy to inspect. Finer-grained atomics can reduce contention but must still couple count updates with one ready enqueue. Distributed scheduling introduces leases and durable state beyond this core.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Deep", "detail": "A central scheduler lock makes dependency transitions easy to inspect. Finer-grained atomics can reduce contention but must still couple count updates with one ready enqueue. Distributed scheduling introduces leases and durable state beyond this core.", "kind": "step-12", "problem": "Dependency-aware task scheduler", "step": 12, "slug": "scheduler"}, {"id": "L301", "number": 301, "module": "P22", "title": "Problem statement and scope", "idea": "Design a service that accepts a notification request, chooses email/SMS/push delivery adapters, respects user preferences and records an attempt outcome. Keep a logical notification separate from its delivery attempts.", "mental": "A local orchestration design with fake provider ports, immutable rendered content and explicit accepted/sent/failed/unknown statuses. Durable queues, production provider integration and guaranteed user receipt are excluded.", "code": "", "gotcha": "Provider acceptance is not human receipt or reading.", "question": "Does SENT mean the user read the message?", "options": ["Yes", "Only for SMS", "No; this contract means provider acceptance"], "answer": 2, "explanation": "No; this contract means provider acceptance. Does provider acceptance mean the user read it? No. Can one logical notification have retries? Yes. What identifies duplicates? A caller request ID plus matching payload, and a separate stable provider key when supported.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Deep", "detail": "Does provider acceptance mean the user read it? No. Can one logical notification have retries? Yes. What identifies duplicates? A caller request ID plus matching payload, and a separate stable provider key when supported.", "kind": "step-1", "problem": "Notification delivery service", "step": 1, "slug": "notifications"}, {"id": "L302", "number": 302, "module": "P22", "title": "Work through one example", "idea": "Request N1 sends an email. The provider accepts it but the reply times out. The attempt becomes UNKNOWN. A retry must reconcile or reuse the provider's supported deduplication identity; it must not pretend that the first email was certainly not sent.", "mental": "A notification can be accepted locally without being sent, and sent without being delivered or read. Each status needs a precise observational meaning.", "code": "", "gotcha": "A timed-out email may already have been sent.", "question": "What should a lost provider reply produce?", "options": ["Automatic human-read status", "UNKNOWN", "Definite failure"], "answer": 1, "explanation": "UNKNOWN. A notification can be accepted locally without being sent, and sent without being delivered or read. Each status needs a precise observational meaning.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Request", "Preferences + render", "Attempt record", "Sender"], "sources": [], "level": "Deep", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Notification delivery service", "step": 2, "slug": "notifications"}, {"id": "L303", "number": 303, "module": "P22", "title": "Write the invariants", "idea": "One request ID binds to one recipient/channel/content intent.\nPreferences are checked according to a documented snapshot or send-time policy.\nEvery external attempt has a recorded identity and outcome, including uncertainty.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Changing content on retry can violate request identity.", "question": "What should a request ID bind?", "options": ["Recipient, channel and content intent", "Only the current worker ID", "Only the minute of the day"], "answer": 0, "explanation": "Recipient, channel and content intent. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Deep", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Notification delivery service", "step": 3, "slug": "notifications"}, {"id": "L304", "number": 304, "module": "P22", "title": "Choose objects and ownership", "idea": "NotificationService: validates intent and orchestrates lifecycle.\nNotification: logical immutable recipient, channel and rendered content.\nDeliveryAttempt: attempt ID, provider reference and status.\nSender: adapter for one channel/provider contract.\nPreferenceStore: supplies consent and routing rules.\nTemplateRenderer: creates immutable content before send.", "mental": "The central consistency owner in this design is NotificationService. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A template renderer should not send the message.", "question": "Who orchestrates notification attempts?", "options": ["TemplateRenderer", "Sender alone", "NotificationService"], "answer": 2, "explanation": "NotificationService. NotificationService has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["NotificationService", "Notification", "DeliveryAttempt", "Sender"], "sources": [], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Notification delivery service", "step": 4, "slug": "notifications"}, {"id": "L305", "number": 305, "module": "P22", "title": "Design the public API", "idea": "Return local acceptance separately from provider delivery. Store rendered content or a template version and inputs so retries do not silently change the message. Do not use a universal boolean for every provider outcome.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "NotificationView submit(NotificationRequest request);\nAttemptResult send(NotificationId id);\nNotificationView status(NotificationId id);", "gotcha": "Provider idempotency cannot be assumed for every adapter.", "question": "Why keep rendered content or a template version?", "options": ["To avoid preference checks", "To make retries preserve the accepted message", "To guarantee inbox placement"], "answer": 1, "explanation": "To make retries preserve the accepted message. Return local acceptance separately from provider delivery. Store rendered content or a template version and inputs so retries do not silently change the message. Do not use a universal boolean for every provider outcome.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Deep", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Notification delivery service", "step": 5, "slug": "notifications"}, {"id": "L306", "number": 306, "module": "P22", "title": "Draw the state machine", "idea": "SENT here means the provider acknowledged acceptance, not that the human received or read the message. UNKNOWN is not terminal success or failure. Provider webhooks may add later states with idempotent event processing in an extension.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "UNKNOWN must not be relabeled FAILED just to simplify a boolean.", "question": "Can UNKNOWN be safely treated as no effect?", "options": ["No", "Yes", "Only after a short sleep"], "answer": 0, "explanation": "No. SENT here means the provider acknowledged acceptance, not that the human received or read the message. UNKNOWN is not terminal success or failure. Provider webhooks may add later states with idempotent event processing in an extension.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["ACCEPTED", "SENDING", "SENT / FAILED", "UNKNOWN"], "sources": [], "level": "Deep", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Notification delivery service", "step": 6, "slug": "notifications"}, {"id": "L307", "number": 307, "module": "P22", "title": "Trace the key operation", "idea": "Validate the request and deduplication identity, obtain the preference decision, render a stable message and create a logical notification. Before an external call, create an attempt record. Invoke the adapter outside internal locks and then record a confirmed or unknown outcome.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Record an attempt before making the effect where the durability design requires it.", "question": "What is created before the send call?", "options": ["A fake delivered receipt", "An unrelated new recipient", "A tracked delivery attempt"], "answer": 2, "explanation": "A tracked delivery attempt. Validate the request and deduplication identity, obtain the preference decision, render a stable message and create a logical notification. Before an external call, create an attempt record. Invoke the adapter outside internal locks and then record a confirmed or unknown outcome.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Request", "Preferences + render", "Attempt record", "Sender"], "sources": [], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Notification delivery service", "step": 7, "slug": "notifications"}, {"id": "L308", "number": 308, "module": "P22", "title": "Read the core Java logic", "idea": "The contextual sketch does not implement durable attempt storage. A crash between provider acceptance and local recording remains a recovery case. A provider key only helps when the provider explicitly supports the required deduplication contract.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "Notification n = acceptOrReplay(request);\nAttempt a = beginAttempt(n.id());\ntry {\n    ProviderResult r = sender.send(a.key(), n.content());\n    recordOutcome(a, r);\n} catch (ProviderTimeout e) {\n    markUnknown(a);\n}", "gotcha": "An in-memory attempt record does not survive a crash.", "question": "What is not implemented by the short sketch?", "options": ["A sender boundary", "Durable crash recovery", "A place to mark unknown"], "answer": 1, "explanation": "Durable crash recovery. The contextual sketch does not implement durable attempt storage. A crash between provider acceptance and local recording remains a recovery case. A provider key only helps when the provider explicitly supports the required deduplication contract.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Notification delivery service", "step": 8, "slug": "notifications"}, {"id": "L309", "number": 309, "module": "P22", "title": "Handle races and failure", "idea": "Two workers must not create active sends for the same attempt without a claim rule. A lease plus attempt version is a possible persistence extension. A local synchronized block does not coordinate workers in different processes, and a retry decorator cannot invent provider idempotency.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Two workers need an explicit attempt claim boundary.", "question": "What prevents two workers sending the same active attempt?", "options": ["A defined atomic claim/lease rule", "Only different thread names", "Only an immutable template"], "answer": 0, "explanation": "A defined atomic claim/lease rule. Two workers must not create active sends for the same attempt without a claim rule. A lease plus attempt version is a possible persistence extension. A local synchronized block does not coordinate workers in different processes, and a retry decorator cannot invent provider idempotency.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Deep", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Notification delivery service", "step": 9, "slug": "notifications"}, {"id": "L310", "number": 310, "module": "P22", "title": "Build the test plan", "idea": "Opted-out requests follow the stated suppression policy.\nAn identical request ID replays one logical notification.\nTimeout is recorded as UNKNOWN.\nChanging the template after acceptance does not change a retried message.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test preferences and content versioning, not only a happy send.", "question": "Which test protects retry content?", "options": ["Only render once", "Only verify a nonempty subject", "Change a template after acceptance and replay the original content"], "answer": 2, "explanation": "Change a template after acceptance and replay the original content. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Deep", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Notification delivery service", "step": 10, "slug": "notifications"}, {"id": "L311", "number": 311, "module": "P22", "title": "Change one requirement", "idea": "Add channel fallback, such as email then SMS. Decide whether fallback is allowed while email is UNKNOWN; it may create two user-visible messages. Model fallback as a new attempt under the same logical intent, with a visible policy.", "mental": "Synchronous sending gives an immediate provider result but couples caller latency to the provider. Queued sending decouples callers but adds durable acceptance, retries, queue bounds and operator visibility.", "code": "", "gotcha": "Fallback during uncertainty can produce duplicate user-visible messages.", "question": "What is risky about fallback during UNKNOWN?", "options": ["It guarantees one message", "Both channels may eventually deliver", "It always cancels the first send"], "answer": 1, "explanation": "Both channels may eventually deliver. Add channel fallback, such as email then SMS. Decide whether fallback is allowed while email is UNKNOWN; it may create two user-visible messages. Model fallback as a new attempt under the same logical intent, with a visible policy.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Deep", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Notification delivery service", "step": 11, "slug": "notifications"}, {"id": "L312", "number": 312, "module": "P22", "title": "Defend the design", "idea": "I separate intent, rendered content and attempts. The API reports what is actually known rather than overstating delivery. Preference timing and retry identity are part of the contract, not implementation details.", "mental": "C candidate channels and content size M: O(C + M) local routing/render work, plus provider I/O. Retained attempt storage grows with notifications and retries.", "code": "", "gotcha": "A queue adds obligations as well as decoupling.", "question": "What does asynchronous sending add?", "options": ["Queue, retry and durable-acceptance decisions", "Automatic exactly-once delivery", "No extra states"], "answer": 0, "explanation": "Queue, retry and durable-acceptance decisions. Synchronous sending gives an immediate provider result but couples caller latency to the provider. Queued sending decouples callers but adds durable acceptance, retries, queue bounds and operator visibility.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Deep", "detail": "Synchronous sending gives an immediate provider result but couples caller latency to the provider. Queued sending decouples callers but adds durable acceptance, retries, queue bounds and operator visibility.", "kind": "step-12", "problem": "Notification delivery service", "step": 12, "slug": "notifications"}, {"id": "L313", "number": 313, "module": "P23", "title": "Problem statement and scope", "idea": "Design a stock service that reserves positive quantities of a SKU, confirms a reservation when sold, and releases it when cancelled. Distinguish on-hand stock, reserved stock and available stock. Repeated cancellation must never create extra inventory.", "mental": "One in-memory inventory owner, multiple SKUs, no automatic expiry in the core and stable reservation request IDs. Multi-warehouse allocation, replenishment forecasting and payment integration are extensions.", "code": "", "gotcha": "Available and onHand are not interchangeable.", "question": "What is available stock?", "options": ["onHand + reserved", "reserved only", "onHand - reserved"], "answer": 2, "explanation": "onHand - reserved. What is available? onHand minus reserved. Does confirmation reduce onHand? Yes and also reduces reserved. Does release reduce onHand? No. Can an ID be reused after cancellation? It replays the same old reservation, not a new claim.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Core", "detail": "What is available? onHand minus reserved. Does confirmation reduce onHand? Yes and also reduces reserved. Does release reduce onHand? No. Can an ID be reused after cancellation? It replays the same old reservation, not a new claim.", "kind": "step-1", "problem": "Inventory reservation service", "step": 1, "slug": "inventory"}, {"id": "L314", "number": 314, "module": "P23", "title": "Work through one example", "idea": "SKU X starts with onHand=10 and reserved=0. Reserve 3: available=7, reserved=3. Confirm that reservation: onHand=7, reserved=0, available=7. Reserve 2 then cancel: onHand stays 7 and available returns to 7.", "mental": "Confirmation is not a release followed by an unrelated sale. It changes onHand and reserved together while keeping available consistent.", "code": "", "gotcha": "Confirmation reduces both onHand and reserved.", "question": "After reserving 3 from 10 and confirming, what is onHand?", "options": ["3", "7", "10"], "answer": 1, "explanation": "7. Confirmation is not a release followed by an unrelated sale. It changes onHand and reserved together while keeping available consistent.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Request", "Inventory owner", "Availability guard", "Reservation"], "sources": [], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Inventory reservation service", "step": 2, "slug": "inventory"}, {"id": "L315", "number": 315, "module": "P23", "title": "Write the invariants", "idea": "For each SKU, 0 <= reserved <= onHand.\nEach active reservation contributes its quantity exactly once to reserved.\nA terminal reservation never releases or consumes stock again.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Releasing twice must not create stock.", "question": "What must repeated release avoid?", "options": ["Increasing stock a second time", "Returning a prior result", "Finding the reservation ID"], "answer": 0, "explanation": "Increasing stock a second time. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Inventory reservation service", "step": 3, "slug": "inventory"}, {"id": "L316", "number": 316, "module": "P23", "title": "Choose objects and ownership", "idea": "Inventory: owns stock counters, reservations and atomic transitions.\nStock: per-SKU onHand and reserved counts.\nReservation: ID, SKU, quantity and ACTIVE/CONFIRMED/RELEASED state.\nStockView: immutable snapshot with computed available quantity.\nAllocationPolicy: optional multi-location quantity plan.", "mental": "The central consistency owner in this design is Inventory. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A stock view should not provide setters.", "question": "Who owns the counters and transitions?", "options": ["StockView", "AllocationPolicy", "Inventory"], "answer": 2, "explanation": "Inventory. Inventory has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Inventory", "Stock", "Reservation", "StockView"], "sources": [], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Inventory reservation service", "step": 4, "slug": "inventory"}, {"id": "L317", "number": 317, "module": "P23", "title": "Design the public API", "idea": "reserve validates a positive quantity and matching payload on duplicate IDs. A confirmed reservation cannot be released under the core contract. Compute available from owned counters rather than maintaining a third independent mutable number.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "ReservationView reserve(String requestId, String sku, long qty);\nReservationView confirm(String reservationId);\nReservationView release(String reservationId);\nStockView stock(String sku);", "gotcha": "A terminal request ID is not a fresh reservation key.", "question": "What happens if an old released ID is reserved again with the same payload?", "options": ["Always create another active claim", "Replay that old reservation under this contract", "Create new stock"], "answer": 1, "explanation": "Replay that old reservation under this contract. reserve validates a positive quantity and matching payload on duplicate IDs. A confirmed reservation cannot be released under the core contract. Compute available from owned counters rather than maintaining a third independent mutable number.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Inventory reservation service", "step": 5, "slug": "inventory"}, {"id": "L318", "number": 318, "module": "P23", "title": "Draw the state machine", "idea": "Only ACTIVE can transition to CONFIRMED or RELEASED. Repeating the same terminal operation returns its prior result; asking for the opposite terminal operation is a conflict. A released request ID does not create a fresh reservation.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "CONFIRMED and RELEASED are different terminal outcomes.", "question": "Can a confirmed reservation be released here?", "options": ["No; it is a conflicting terminal action", "Yes repeatedly", "Only if quantity is one"], "answer": 0, "explanation": "No; it is a conflicting terminal action. Only ACTIVE can transition to CONFIRMED or RELEASED. Repeating the same terminal operation returns its prior result; asking for the opposite terminal operation is a conflict. A released request ID does not create a fresh reservation.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["ACTIVE", "CONFIRMED", "RELEASED", "REPLAY SAME RESULT"], "sources": [], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Inventory reservation service", "step": 6, "slug": "inventory"}, {"id": "L319", "number": 319, "module": "P23", "title": "Trace the key operation", "idea": "Check request identity first. For a new reservation, validate SKU and quantity, then compare available with requested quantity under the same lock. Increase reserved and insert the reservation. Confirmation decreases onHand and reserved together; release decreases only reserved.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Deduplication checks must include SKU and quantity.", "question": "What changes on reserve?", "options": ["onHand decreases immediately", "Both increase", "Reserved increases; onHand stays the same"], "answer": 2, "explanation": "Reserved increases; onHand stays the same. Check request identity first. For a new reservation, validate SKU and quantity, then compare available with requested quantity under the same lock. Increase reserved and insert the reservation. Confirmation decreases onHand and reserved together; release decreases only reserved.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Request", "Inventory owner", "Availability guard", "Reservation"], "sources": [], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Inventory reservation service", "step": 7, "slug": "inventory"}, {"id": "L320", "number": 320, "module": "P23", "title": "Read the core Java logic", "idea": "The pre-existing reservation invariant proves enough reserved stock for this transition. Encapsulation matters: if callers can mutate counters, the reasoning collapses. The complete companion validates all public inputs and conflicting terminal actions.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "synchronized void confirm(String id) {\n    Reservation r = requireReservation(id);\n    if (r.confirmed()) return;\n    requireActive(r);\n    Stock s = stockFor(r.sku());\n    s.onHand -= r.quantity();\n    s.reserved -= r.quantity();\n    r.markConfirmed();\n}", "gotcha": "Counter integrity depends on controlled mutation.", "question": "What changes on confirm?", "options": ["Available becomes negative", "onHand and reserved both decrease by the quantity", "Only reserved increases"], "answer": 1, "explanation": "onHand and reserved both decrease by the quantity. The pre-existing reservation invariant proves enough reserved stock for this transition. Encapsulation matters: if callers can mutate counters, the reasoning collapses. The complete companion validates all public inputs and conflicting terminal actions.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Inventory reservation service", "step": 8, "slug": "inventory"}, {"id": "L321", "number": 321, "module": "P23", "title": "Handle races and failure", "idea": "Two reservations for the last unit must not both pass. One inventory lock makes check-and-reserve atomic. Several SKU locks can support parallelism but a multi-SKU order needs deterministic lock order or a larger transaction boundary.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Safe individual counter updates do not protect the whole reservation.", "question": "How many successes may compete for one final unit?", "options": ["One", "Two", "Any number if IDs differ"], "answer": 0, "explanation": "One. Two reservations for the last unit must not both pass. One inventory lock makes check-and-reserve atomic. Several SKU locks can support parallelism but a multi-SKU order needs deterministic lock order or a larger transaction boundary.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Inventory reservation service", "step": 9, "slug": "inventory"}, {"id": "L322", "number": 322, "module": "P23", "title": "Build the test plan", "idea": "Ten one-unit successes exhaust stock ten, and the next fails.\nConfirmation changes both counters without changing available incorrectly.\nRelease twice does not inflate stock.\nConcurrent final-unit claims yield one active reservation.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test opposing terminal operations, not only identical retries.", "question": "Which test catches a stock-creation bug?", "options": ["Only read initial stock", "Only insert one SKU", "Release the same reservation twice"], "answer": 2, "explanation": "Release the same reservation twice. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Inventory reservation service", "step": 10, "slug": "inventory"}, {"id": "L323", "number": 323, "module": "P23", "title": "Change one requirement", "idea": "Add expiring reservations with a clock and ownership IDs. Cleanup must release only the still-active matching reservation; a confirmed sale must not be undone by an old expiry task. A multi-SKU order also needs all-or-nothing reservation semantics.", "mental": "Computing available from two counters avoids a redundant third counter. Maintaining reservation history enables retry behavior but grows storage. An archival policy must preserve the required deduplication horizon.", "code": "", "gotcha": "Stale expiry must not undo a confirmed sale.", "question": "What must an expiry task check?", "options": ["Only its own scheduled time", "Matching active reservation ownership/state", "Only the SKU name"], "answer": 1, "explanation": "Matching active reservation ownership/state. Add expiring reservations with a clock and ownership IDs. Cleanup must release only the still-active matching reservation; a confirmed sale must not be undone by an old expiry task. A multi-SKU order also needs all-or-nothing reservation semantics.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Inventory reservation service", "step": 11, "slug": "inventory"}, {"id": "L324", "number": 324, "module": "P23", "title": "Defend the design", "idea": "I define all three stock quantities explicitly and give each lifecycle transition a conservation equation. The race test and repeated-release test prove more than a diagram of Product and Warehouse classes.", "mental": "Expected O(1) single-SKU reserve/confirm/release, O(S + R) storage for S SKUs and R retained reservations. Multi-SKU work scales with the number of requested lines.", "code": "", "gotcha": "Deduplication history needs a defined retention horizon.", "question": "Why compute rather than store available separately?", "options": ["To avoid a redundant consistency invariant", "To make inventory unlimited", "To remove the need for validation"], "answer": 0, "explanation": "To avoid a redundant consistency invariant. Computing available from two counters avoids a redundant third counter. Maintaining reservation history enables retry behavior but grows storage. An archival policy must preserve the required deduplication horizon.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Core", "detail": "Computing available from two counters avoids a redundant third counter. Maintaining reservation history enables retry behavior but grows storage. An archival policy must preserve the required deduplication horizon.", "kind": "step-12", "problem": "Inventory reservation service", "step": 12, "slug": "inventory"}, {"id": "L325", "number": 325, "module": "P24", "title": "Problem statement and scope", "idea": "Design a teaching ledger that transfers integer minor units between existing wallets in one currency. A transfer must debit one wallet and credit the other atomically, reject insufficient funds and make successful retries idempotent by request ID.", "mental": "Single-process memory, no external banking, no fees, no foreign exchange and no production durability claim. Opening balances are setup data. The transfer log records immutable successful intents and results.", "code": "", "gotcha": "An interview wallet map is not a production financial platform.", "question": "What durability does this core promise?", "options": ["Bank-grade durable settlement", "Cross-region exactly-once posting", "None beyond the running process"], "answer": 2, "explanation": "None beyond the running process. Can wallets go negative? No. Is self-transfer allowed? This baseline rejects it. Does a failed insufficient-funds attempt consume its key? No in this chosen contract. A successful key remains bound to its original payload.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Deep", "detail": "Can wallets go negative? No. Is self-transfer allowed? This baseline rejects it. Does a failed insufficient-funds attempt consume its key? No in this chosen contract. A successful key remains bound to its original payload.", "kind": "step-1", "problem": "In-memory wallet transfer ledger", "step": 1, "slug": "wallet"}, {"id": "L326", "number": 326, "module": "P24", "title": "Work through one example", "idea": "A=100 and B=20. Transfer request K moves 30 from A to B, yielding A=70 and B=50. Retrying K returns the same transfer without moving more. Reusing K for amount 40 is rejected. Trying to move 200 changes nothing.", "mental": "Total balance stays 120 across successful internal transfers. This conservation property does not by itself establish a full production double-entry accounting system.", "code": "", "gotcha": "A successful retry must not transfer the amount again.", "question": "After K transfers 30, what are A and B?", "options": ["100 and 20", "70 and 50", "40 and 80"], "answer": 1, "explanation": "70 and 50. Total balance stays 120 across successful internal transfers. This conservation property does not by itself establish a full production double-entry accounting system.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Request", "Deduplicate + validate", "Debit + credit", "Transfer record"], "sources": [], "level": "Deep", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "In-memory wallet transfer ledger", "step": 2, "slug": "wallet"}, {"id": "L327", "number": 327, "module": "P24", "title": "Write the invariants", "idea": "No wallet balance becomes negative.\nA successful transfer conserves the sum of the two balances.\nOne successful request ID binds to one source, destination and amount.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Conservation alone is not a complete double-entry ledger.", "question": "What stays constant for internal transfers?", "options": ["The total balance", "Every individual balance", "The number of successful requests"], "answer": 0, "explanation": "The total balance. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Deep", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "In-memory wallet transfer ledger", "step": 3, "slug": "wallet"}, {"id": "L328", "number": 328, "module": "P24", "title": "Choose objects and ownership", "idea": "Ledger: owns balances and successful transfer records.\nWallet: stable ID, currency and controlled balance.\nTransferRequest: immutable key, source, destination and amount.\nTransferRecord: immutable before/after or posting information.\nMoney: unit-aware amount representation at the boundary.", "mental": "The central consistency owner in this design is Ledger. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A request object does not own shared balances.", "question": "Who owns debit, credit and deduplication together?", "options": ["TransferRequest", "WalletView", "Ledger"], "answer": 2, "explanation": "Ledger. Ledger has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Ledger", "Wallet", "TransferRequest", "TransferRecord"], "sources": [], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "In-memory wallet transfer ledger", "step": 4, "slug": "wallet"}, {"id": "L329", "number": 329, "module": "P24", "title": "Design the public API", "idea": "Validate known distinct wallets, one supported currency, positive amount, sufficient funds and destination overflow. Compare the full payload on a successful retry. History and balances are copied or immutable views.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "TransferRecord transfer(String requestId, String from,\n    String to, long amount);\nlong balance(String walletId);\nList<TransferRecord> history();", "gotcha": "A request ID without payload comparison hides conflicting intent.", "question": "What does same ID with amount 40 do after K=30?", "options": ["Silently edit the old amount", "Reject conflicting reuse", "Transfer another 40"], "answer": 1, "explanation": "Reject conflicting reuse. Validate known distinct wallets, one supported currency, positive amount, sufficient funds and destination overflow. Compare the full payload on a successful retry. History and balances are copied or immutable views.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Deep", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "In-memory wallet transfer ledger", "step": 5, "slug": "wallet"}, {"id": "L330", "number": 330, "module": "P24", "title": "Draw the state machine", "idea": "A rejected transfer makes no ledger change and is not retained as a successful idempotency result. A committed transfer is immutable. Reversal, when added, is another linked transfer, not deletion of history.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "A failed request's deduplication policy must be stated.", "question": "Does insufficient-funds rejection consume the key here?", "options": ["No, by this chosen contract", "Yes, universally in all systems", "Only if the key is long"], "answer": 0, "explanation": "No, by this chosen contract. A rejected transfer makes no ledger change and is not retained as a successful idempotency result. A committed transfer is immutable. Reversal, when added, is another linked transfer, not deletion of history.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["RECEIVED", "VALIDATED", "COMMITTED", "REPLAYED / REJECTED"], "sources": [], "level": "Deep", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "In-memory wallet transfer ledger", "step": 6, "slug": "wallet"}, {"id": "L331", "number": 331, "module": "P24", "title": "Trace the key operation", "idea": "Under one ledger lock, check for a previous successful key and compare payloads. Validate both wallets and amount, compute new debit and credit values using checked arithmetic, then assign both balances and store the transfer record together.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Compute destination overflow before debiting the source.", "question": "What must happen before the first balance write?", "options": ["Only ID formatting", "Writing a success log", "All predictable validation and checked arithmetic"], "answer": 2, "explanation": "All predictable validation and checked arithmetic. Under one ledger lock, check for a previous successful key and compare payloads. Validate both wallets and amount, compute new debit and credit values using checked arithmetic, then assign both balances and store the transfer record together.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Request", "Deduplicate + validate", "Debit + credit", "Transfer record"], "sources": [], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "In-memory wallet transfer ledger", "step": 7, "slug": "wallet"}, {"id": "L332", "number": 332, "module": "P24", "title": "Read the core Java logic", "idea": "validate proves positive amount and enough funds before subtraction. Destination overflow is checked before any live write. The record is constructed before committing. This in-memory critical section is not durable across process failure.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "synchronized TransferRecord transfer(Request r) {\n    TransferRecord prior = committed.get(r.id());\n    if (prior != null) return sameIntentOrReject(prior, r);\n    validate(r);\n    long debit = balances.get(r.from()) - r.amount();\n    long credit = Math.addExact(balances.get(r.to()), r.amount());\n    TransferRecord result = recordOf(r, debit, credit);\n    balances.put(r.from(), debit);\n    balances.put(r.to(), credit);\n    committed.put(r.id(), result);\n    return result;\n}", "gotcha": "The lock protects in-memory state, not durability.", "question": "Why use Math.addExact on destination credit?", "options": ["To guarantee positive balances without checks", "To detect overflow before mutation", "To create a database transaction"], "answer": 1, "explanation": "To detect overflow before mutation. validate proves positive amount and enough funds before subtraction. Destination overflow is checked before any live write. The record is constructed before committing. This in-memory critical section is not durable across process failure.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "In-memory wallet transfer ledger", "step": 8, "slug": "wallet"}, {"id": "L333", "number": 333, "module": "P24", "title": "Handle races and failure", "idea": "Two transfers from the same wallet must not both spend the same balance. A single ledger lock is the readable baseline. Per-wallet locks require stable ordering for two-wallet transfers and coordination of the shared idempotency registry.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Per-wallet locks can deadlock without a stable order.", "question": "What can two source transfers race on?", "options": ["The same spendable balance", "Only the receipt font", "Only the currency display symbol"], "answer": 0, "explanation": "The same spendable balance. Two transfers from the same wallet must not both spend the same balance. A single ledger lock is the readable baseline. Per-wallet locks require stable ordering for two-wallet transfers and coordination of the shared idempotency registry.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Deep", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "In-memory wallet transfer ledger", "step": 9, "slug": "wallet"}, {"id": "L334", "number": 334, "module": "P24", "title": "Build the test plan", "idea": "The example conserves total balance.\nA successful identical retry changes nothing.\nConflicting key reuse is rejected.\nInsufficient funds or destination overflow changes neither wallet.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test destination overflow as well as insufficient funds.", "question": "Which test targets failure atomicity?", "options": ["Only list wallet IDs", "Only send one valid transfer", "Overflow the destination and assert both balances unchanged"], "answer": 2, "explanation": "Overflow the destination and assert both balances unchanged. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Deep", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "In-memory wallet transfer ledger", "step": 10, "slug": "wallet"}, {"id": "L335", "number": 335, "module": "P24", "title": "Change one requirement", "idea": "Add durable double-entry postings, immutable journal identity, transactional persistence, reconciliation and an explicit recovery model. External payment initiation needs a separate state machine; do not hold a local lock while waiting for a bank.", "mental": "One lock simplifies correctness but limits concurrent independent transfers. Ordered per-wallet locking can improve parallelism at the cost of more complex interaction with deduplication and history. A database transaction is a different implementation boundary.", "code": "", "gotcha": "Reversal is an explicit compensating posting, not erasing history.", "question": "What is a correction in a durable accounting extension?", "options": ["A direct public balance setter", "A linked reversal or adjustment posting", "Deletion of all history"], "answer": 1, "explanation": "A linked reversal or adjustment posting. Add durable double-entry postings, immutable journal identity, transactional persistence, reconciliation and an explicit recovery model. External payment initiation needs a separate state machine; do not hold a local lock while waiting for a bank.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Deep", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "In-memory wallet transfer ledger", "step": 11, "slug": "wallet"}, {"id": "L336", "number": 336, "module": "P24", "title": "Defend the design", "idea": "My answer focuses on conservation, failure atomicity and request identity. I compute all fallible arithmetic before live writes. I explicitly separate this tested interview core from a production financial ledger.", "mental": "Expected O(1) transfer lookup and mutation in the local model; O(W + T) storage for W wallets and T retained transfers. History snapshot is O(T). No availability or durable exactly-once guarantee is implied.", "code": "", "gotcha": "A local Big-O claim says nothing about cross-region guarantees.", "question": "What is the key coarse-lock tradeoff?", "options": ["Simple correctness versus independent-transfer parallelism", "Durability versus currency names", "O(1) versus no arithmetic"], "answer": 0, "explanation": "Simple correctness versus independent-transfer parallelism. One lock simplifies correctness but limits concurrent independent transfers. Ordered per-wallet locking can improve parallelism at the cost of more complex interaction with deduplication and history. A database transaction is a different implementation boundary.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Deep", "detail": "One lock simplifies correctness but limits concurrent independent transfers. Ordered per-wallet locking can improve parallelism at the cost of more complex interaction with deduplication and history. A database transaction is a different implementation boundary.", "kind": "step-12", "problem": "In-memory wallet transfer ledger", "step": 12, "slug": "wallet"}, {"id": "L337", "number": 337, "module": "P25", "title": "Problem statement and scope", "idea": "Design a restaurant ordering core. A customer builds a cart from a menu, submits an order with a price snapshot, and follows acceptance, preparation and delivery states. Keep menu edits separate from the historical order.", "mental": "One restaurant per order, one currency, integer minor units and no live payment gateway. Courier dispatch, marketplace search, taxes and distributed stock synchronization are extensions.", "code": "", "gotcha": "Food ordering is not automatically a full delivery marketplace.", "question": "Can one core order span several restaurants?", "options": ["Yes without any new model", "Only when totals match", "No"], "answer": 2, "explanation": "No. Can an order contain items from several restaurants? Not here. Does a menu price change alter an accepted order? No. Until when may the customer cancel? Before preparation begins in this chosen policy.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S03"], "level": "Core", "detail": "Can an order contain items from several restaurants? Not here. Does a menu price change alter an accepted order? No. Until when may the customer cancel? Before preparation begins in this chosen policy.", "kind": "step-1", "problem": "Food ordering and order lifecycle", "step": 1, "slug": "food"}, {"id": "L338", "number": 338, "module": "P25", "title": "Work through one example", "idea": "A cart has two soups at 50 each and one bread at 20, total 120. Submit the order. The restaurant later changes soup to 60; the submitted order remains 120. After PREPARING begins, customer cancellation is rejected under this policy.", "mental": "Cart lines are mutable shopping intent; order lines are immutable accepted quantities and prices. They should not be the same shared mutable list.", "code": "", "gotcha": "A submitted price should not follow live menu edits.", "question": "What is the accepted total after soup later rises to 60?", "options": ["100", "120", "140"], "answer": 1, "explanation": "120. Cart lines are mutable shopping intent; order lines are immutable accepted quantities and prices. They should not be the same shared mutable list.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Cart", "Checkout validation", "Price snapshot", "Order"], "sources": ["S03"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Food ordering and order lifecycle", "step": 2, "slug": "food"}, {"id": "L339", "number": 339, "module": "P25", "title": "Write the invariants", "idea": "An accepted order contains positive quantities and a consistent currency.\nThe order total equals its immutable line totals plus explicitly modeled adjustments.\nOnly legal lifecycle transitions may change status.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "An order line quantity must be positive.", "question": "What must accepted lines preserve?", "options": ["Quantity and price at acceptance", "Only live menu references", "Only display names"], "answer": 0, "explanation": "Quantity and price at acceptance. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S03"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Food ordering and order lifecycle", "step": 3, "slug": "food"}, {"id": "L340", "number": 340, "module": "P25", "title": "Choose objects and ownership", "idea": "OrderService: validates checkout and creates immutable order lines.\nCart: mutable customer selection before acceptance.\nMenuItem: current catalog description and price.\nOrder: owns accepted lines, total and lifecycle.\nOrderLine: item snapshot, quantity and accepted unit price.\nPricingPolicy: optional fees or discount rules with explicit ordering.", "mental": "The central consistency owner in this design is Order. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A MenuItem should not own an order's lifecycle.", "question": "Who guards preparation and cancellation state?", "options": ["MenuItem", "Cart", "Order"], "answer": 2, "explanation": "Order. Order has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Order", "OrderService", "Cart", "MenuItem"], "sources": ["S03"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Food ordering and order lifecycle", "step": 4, "slug": "food"}, {"id": "L341", "number": 341, "module": "P25", "title": "Design the public API", "idea": "submit should bind a request ID to the accepted cart/version so retries do not create duplicate orders. Validate availability and quantity at acceptance, not only when an item was added to the cart. Expose controlled transitions rather than setStatus.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "OrderView submit(CartId cart, String requestId);\nOrderView accept(OrderId id);\nOrderView startPreparation(OrderId id);\nOrderView cancel(OrderId id);", "gotcha": "A request ID should bind the cart intent or version.", "question": "Why bind submit to a cart version or snapshot?", "options": ["To avoid quantity validation", "To make the accepted intent unambiguous", "To guarantee free delivery"], "answer": 1, "explanation": "To make the accepted intent unambiguous. submit should bind a request ID to the accepted cart/version so retries do not create duplicate orders. Validate availability and quantity at acceptance, not only when an item was added to the cart. Expose controlled transitions rather than setStatus.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S03"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Food ordering and order lifecycle", "step": 5, "slug": "food"}, {"id": "L342", "number": 342, "module": "P25", "title": "Draw the state machine", "idea": "SUBMITTED can be accepted or rejected. Under this policy cancellation is allowed before PREPARING. Delivery assignment and physical delivery are separate transitions in an extension. Do not let a customer mark their own order delivered without an authorized workflow.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Cancellation cutoff is a business rule that must be explicit.", "question": "Can the customer cancel after PREPARING here?", "options": ["No", "Yes without restriction", "Only if the menu changes"], "answer": 0, "explanation": "No. SUBMITTED can be accepted or rejected. Under this policy cancellation is allowed before PREPARING. Delivery assignment and physical delivery are separate transitions in an extension. Do not let a customer mark their own order delivered without an authorized workflow.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["SUBMITTED", "ACCEPTED", "PREPARING", "READY / DELIVERED"], "sources": ["S03"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Food ordering and order lifecycle", "step": 6, "slug": "food"}, {"id": "L343", "number": 343, "module": "P25", "title": "Trace the key operation", "idea": "Load the selected cart version, validate all items and quantities, compute line totals with overflow checks and capture prices. Create the order and record the request resu
