operations; a cleanup task may remove expired storage later.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["User", "ShowInventory", "Validate all seats", "One hold token"], "sources": ["S07"], "level": "Deep", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Movie-seat holds and confirmation", "step": 2, "slug": "seats"}, {"id": "L207", "number": 207, "module": "P14", "title": "Write the invariants", "idea": "No seat has more than one current owner.\nEvery seat in a successful hold has the same hold ID and owner.\nOnly the owner can confirm a still-live hold; stale commands cannot change a newer hold.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "A seat status without an ownership token permits stale release.", "question": "What protects against a stale release?", "options": ["Comparing the current ownership token", "Only checking seat color", "Only knowing the original user name"], "answer": 0, "explanation": "Comparing the current ownership token. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S07"], "level": "Deep", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Movie-seat holds and confirmation", "step": 3, "slug": "seats"}, {"id": "L208", "number": 208, "module": "P14", "title": "Choose objects and ownership", "idea": "ShowInventory: owns seat-to-hold and confirmed ownership.\nHold: ID, owner, immutable seat set, expiry and state.\nSeatId: stable identity within a show.\nBooking: confirmed ownership derived from one hold.\nClock: injectable current time for expiry decisions.", "mental": "The central consistency owner in this design is ShowInventory. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "The clock supplies time; inventory decides what that time means.", "question": "Who owns multi-seat atomicity?", "options": ["Clock", "SeatId", "ShowInventory"], "answer": 2, "explanation": "ShowInventory. ShowInventory has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["ShowInventory", "Hold", "SeatId", "Booking"], "sources": ["S07"], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Movie-seat holds and confirmation", "step": 4, "slug": "seats"}, {"id": "L209", "number": 209, "module": "P14", "title": "Design the public API", "idea": "Reject empty or unknown seat sets and nonpositive TTL. Confirmation checks ownership even on a retry. Expiry cleanup must compare the stored hold token before removing a seat mapping. Availability is computed from logical liveness.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "HoldView hold(String user, Set<String> seats, Duration ttl);\nBookingView confirm(String user, String holdId);\nvoid cancel(String user, String holdId);", "gotcha": "An already-confirmed retry must still validate the user.", "question": "Should confirmed retries bypass user checks?", "options": ["Only when a hold is old", "No", "Yes"], "answer": 1, "explanation": "No. Reject empty or unknown seat sets and nonpositive TTL. Confirmation checks ownership even on a retry. Expiry cleanup must compare the stored hold token before removing a seat mapping. Availability is computed from logical liveness.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S07"], "level": "Deep", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Movie-seat holds and confirmation", "step": 5, "slug": "seats"}, {"id": "L210", "number": 210, "module": "P14", "title": "Draw the state machine", "idea": "HELD can become CONFIRMED only before the deadline, or become EXPIRED/CANCELLED. CONFIRMED is terminal in this core. A seat can return to AVAILABLE after expiry, but the old hold object never becomes a new hold.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "An expired hold stays expired even if its seat later becomes free.", "question": "May CANCELLED become CONFIRMED here?", "options": ["No", "Yes before expiry", "Yes after expiry"], "answer": 0, "explanation": "No. HELD can become CONFIRMED only before the deadline, or become EXPIRED/CANCELLED. CONFIRMED is terminal in this core. A seat can return to AVAILABLE after expiry, but the old hold object never becomes a new hold.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["AVAILABLE", "HELD", "CONFIRMED", "EXPIRED / CANCELLED"], "sources": ["S07"], "level": "Deep", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Movie-seat holds and confirmation", "step": 6, "slug": "seats"}, {"id": "L211", "number": 211, "module": "P14", "title": "Trace the key operation", "idea": "Under one inventory lock, sample time once, validate all requested seats and ignore or clean expired ownership. If any seat is unavailable, change nothing. Otherwise create one hold and assign its ID to every requested seat before returning.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Validate the complete seat set before claiming any of it.", "question": "What happens if one requested seat is unavailable?", "options": ["Claim the remaining seats silently", "Create a confirmed booking anyway", "Reject without claiming the others"], "answer": 2, "explanation": "Reject without claiming the others. Under one inventory lock, sample time once, validate all requested seats and ignore or clean expired ownership. If any seat is unavailable, change nothing. Otherwise create one hold and assign its ID to every requested seat before returning.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["User", "ShowInventory", "Validate all seats", "One hold token"], "sources": ["S07"], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Movie-seat holds and confirmation", "step": 7, "slug": "seats"}, {"id": "L212", "number": 212, "module": "P14", "title": "Read the core Java logic", "idea": "requireActive rejects cancelled or otherwise inactive holds. Time is checked after that guard. A confirmed retry returns the prior booking, but even that retry must first validate the user. The complete companion includes both checks.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "synchronized BookingView confirm(String user, String id) {\n    Hold h = requireHold(id);\n    requireOwner(h, user);\n    if (h.confirmed()) return h.bookingView();\n    requireActive(h);\n    if (!clock.instant().isBefore(h.expiresAt()))\n        throw expired();\n    requireAllSeatsStillOwnedBy(h);\n    h.confirm();\n    return h.bookingView();\n}", "gotcha": "A cancelled hold cannot be confirmed merely because its deadline is in the future.", "question": "Which guard must the complete confirm method include?", "options": ["Only a nonempty ID", "Hold is active or already confirmed, not cancelled", "Only expiry time"], "answer": 1, "explanation": "Hold is active or already confirmed, not cancelled. requireActive rejects cancelled or otherwise inactive holds. Time is checked after that guard. A confirmed retry returns the prior booking, but even that retry must first validate the user. The complete companion includes both checks.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S07"], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Movie-seat holds and confirmation", "step": 8, "slug": "seats"}, {"id": "L213", "number": 213, "module": "P14", "title": "Handle races and failure", "idea": "Expiry, replacement hold and confirmation must share the ownership boundary. Never release by seat ID alone: compare the old hold ID against the current seat owner. For payment, keep a durable attempt state and reconcile a timeout; do not hold the inventory lock during remote I/O.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Old cleanup work must compare hold IDs.", "question": "What must stale expiry cleanup compare?", "options": ["Its hold ID against the current owner ID", "Only seat number", "Only the show title"], "answer": 0, "explanation": "Its hold ID against the current owner ID. Expiry, replacement hold and confirmation must share the ownership boundary. Never release by seat ID alone: compare the old hold ID against the current seat owner. For payment, keep a durable attempt state and reconcile a timeout; do not hold the inventory lock during remote I/O.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S07"], "level": "Deep", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Movie-seat holds and confirmation", "step": 9, "slug": "seats"}, {"id": "L214", "number": 214, "module": "P14", "title": "Build the test plan", "idea": "A two-seat request fails entirely if either seat is taken.\nConfirmation at exactly expiresAt fails.\nWrong-owner confirmation is rejected.\nA stale hold cancellation cannot free a seat held by a newer user.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test failure on the last seat in a multi-seat request.", "question": "Which test catches partial-hold bugs?", "options": ["Hold one free seat", "List the theater name", "Request two seats when the second is taken"], "answer": 2, "explanation": "Request two seats when the second is taken. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S07"], "level": "Deep", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Movie-seat holds and confirmation", "step": 10, "slug": "seats"}, {"id": "L215", "number": 215, "module": "P14", "title": "Change one requirement", "idea": "Add payment authorization and a confirmation workflow. Define what happens if payment succeeds after hold expiry, and whether to void/refund or offer a replacement. This needs explicit compensation and reconciliation, not a boolean paid field.", "mental": "A show-wide lock makes multi-seat atomicity straightforward. Per-seat locks allow more parallelism but require deterministic lock ordering and handling partially acquired sets. Cross-process ownership needs shared coordination.", "code": "", "gotcha": "Payment success after expiry is a reconciliation case.", "question": "A charge succeeds after hold expiry. Next step?", "options": ["Always seize a newly owned seat", "Apply an explicit reconciliation or compensation policy", "Pretend it never happened"], "answer": 1, "explanation": "Apply an explicit reconciliation or compensation policy. Add payment authorization and a confirmation workflow. Define what happens if payment succeeds after hold expiry, and whether to void/refund or offer a replacement. This needs explicit compensation and reconciliation, not a boolean paid field.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S07"], "level": "Deep", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Movie-seat holds and confirmation", "step": 11, "slug": "seats"}, {"id": "L216", "number": 216, "module": "P14", "title": "Defend the design", "idea": "I focus on expiring ownership, not just a seat status enum. All seats in a hold change together, and expiry has an exact boundary. The stale-release test is the design's most important failure demonstration.", "mental": "K requested seats: expected O(K) validation and claim, O(K) confirmation ownership checks. Storage O(seats + retained holds and their seat lists); retained history needs cleanup.", "code": "", "gotcha": "Per-seat locking requires ordering and rollback of partial acquisition.", "question": "What is the simplest atomic baseline?", "options": ["One show-inventory lock", "One unrelated lock per user", "No coordination because seats are in a map"], "answer": 0, "explanation": "One show-inventory lock. A show-wide lock makes multi-seat atomicity straightforward. Per-seat locks allow more parallelism but require deterministic lock ordering and handling partially acquired sets. Cross-process ownership needs shared coordination.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S07"], "level": "Deep", "detail": "A show-wide lock makes multi-seat atomicity straightforward. Per-seat locks allow more parallelism but require deterministic lock ordering and handling partially acquired sets. Cross-process ownership needs shared coordination.", "kind": "step-12", "problem": "Movie-seat holds and confirmation", "step": 12, "slug": "seats"}, {"id": "L217", "number": 217, "module": "P15", "title": "Problem statement and scope", "idea": "Design hotel reservations sold by room type across a date range. A guest requests one room of a type for check-in through check-out. Every occupied night must have enough capacity, and the multi-night reservation succeeds atomically.", "mental": "One hotel, LocalDate nights, room-type capacity and booking/cancellation. Physical room assignment, payments, overbooking, taxes and housekeeping are excluded from the core.", "code": "", "gotcha": "Room-type inventory and physical room assignment are different problems.", "question": "What is sold in this version?", "options": ["A permanent room purchase", "Only a check-in timestamp", "A room type for each occupied night"], "answer": 2, "explanation": "A room type for each occupied night. Is inventory per room or per type? Per type in this version. Does checkout consume a night? No. Can a three-night request partially succeed? No. Is same-day check-in/out accepted? No.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Deep", "detail": "Is inventory per room or per type? Per type in this version. Does checkout consume a night? No. Can a three-night request partially succeed? No. Is same-day check-in/out accepted? No.", "kind": "step-1", "problem": "Hotel room-type inventory", "step": 1, "slug": "hotel"}, {"id": "L218", "number": 218, "module": "P15", "title": "Work through one example", "idea": "Deluxe capacity is 2 on each night. One booking uses Sep 10 and Sep 11. Another uses Sep 11 and Sep 12. A third request spanning Sep 10 through checkout Sep 13 fails because Sep 11 is full, even though the other nights have room.", "mental": "Availability is the minimum free count across every occupied night. An aggregate free-room count for the whole hotel cannot answer this request.", "code": "", "gotcha": "Checkout is an excluded boundary.", "question": "Why does the third example stay fail?", "options": ["All nights must have identical reservation IDs", "Sep 11 has no remaining Deluxe capacity", "Sep 13 is always occupied"], "answer": 1, "explanation": "Sep 11 has no remaining Deluxe capacity. Availability is the minimum free count across every occupied night. An aggregate free-room count for the whole hotel cannot answer this request.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Guest", "Stay validation", "All-night capacity check", "Reserve nights"], "sources": [], "level": "Deep", "detail": "Trace every accepted and rejected operation. Name the exac ehicle is returned late? Record it and surface a conflict; do not silently overwrite a later reservation.", "kind": "step-1", "problem": "Vehicle rental and availability", "step": 1, "slug": "rental"}, {"id": "L230", "number": 230, "module": "P16", "title": "Work through one example", "idea": "Car V7 is reserved for [09:00,12:00). Another [12:00,15:00) reservation is allowed. V7 is returned at 12:30. The second promise now needs an explicit operational resolution; changing the first booking's planned end does not make the problem disappear.", "mental": "Planned reservation availability and actual vehicle possession are related but distinct. A late return creates a real conflict requiring a policy.", "code": "", "gotcha": "A late return can conflict with an already accepted next booking.", "question": "A previous renter returns late. What follows?", "options": ["Both customers may possess the same car", "An explicit conflict-resolution policy is needed", "The next reservation disappears automatically"], "answer": 1, "explanation": "An explicit conflict-resolution policy is needed. Planned reservation availability and actual vehicle possession are related but distinct. A late return creates a real conflict requiring a policy.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Customer", "RentalService", "Vehicle + calendar", "Reservation / rental"], "sources": ["S07"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Vehicle rental and availability", "step": 2, "slug": "rental"}, {"id": "L231", "number": 231, "module": "P16", "title": "Write the invariants", "idea": "Active planned reservations for a vehicle do not overlap.\nA vehicle cannot have two simultaneous active rentals.\nThe accepted quote is preserved even if the price policy later changes.", "mental": "Treat these as assertion  It moves upward, stops at 3, opens, closes, then continues to 5. A new request behind it at 1 can wait until the car finishes its current upward work under the chosen policy.", "mental": "Door state and movement state must agree. Choosing the nearest car for a new request is a policy, not proof of minimum waiting time or freedom from starvation.", "code": "", "gotcha": "A floor destination and a hall direction request are different inputs.", "question": "What must the car do before opening at floor 3?", "options": ["Ignore all requests", "Stop at floor 3", "Move to floor 5 first"], "answer": 1, "explanation": "Stop at floor 3. Door state and movement state must agree. Choosing the nearest car for a new request is a policy, not proof of minimum waiting time or freedom from starvation.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Request", "Dispatcher", "Car stop set", "Tick + doors"], "sources": [], "level": "Deep", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Elevator controller and dispatch", "step": 2, "slug": "elevator"}, {"id": "L243", "number": 243, "module": "P17", "title": "Write the invariants", "idea": "A car never moves while its door is open.\nIts floor remains inside the building bounds.\nA served request is removed or acknowledged exactly once in the simulation.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Open doors and movement cannot be independent unrestricted setters.", "question": "Which invariant is essential?", "options": ["Never move with doors open", "Always choose the nearest request", "Every request is served immediately"], "answer": 0, "explanation": "Never move with doors open. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Deep", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Elevator controller and dispatch", "step": 3, "slug": "elevator"}, {"id": "L244", "number": 244, "module": "P17", "title": "Choose objects and ownership", "idea": "ElevatorSystem: receives hall requests and delegates dispatch.\nDispatcher: selects a car from immutable car snapshots.\nElevatorCar: owns current floor, direction, door and target stops.\nStopPolicy: chooses the next stop from pending work.\nRequest: hall-call or car-destination data.", "mental": "The central consistency owner in this design is ElevatorCar. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Dispatcher chooses; ElevatorCar validates its own transitions.", "question": "Who owns door-and-motion consistency?", "options": ["Dispatcher", "Request", "ElevatorCar"], "answer": 2, "explanation": "ElevatorCar. ElevatorCar has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["ElevatorCar", "ElevatorSystem", "Dispatcher", "StopPolicy"], "sources": [], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Elevator controller and dispatch", "step": 4, "slug": "elevator"}, {"id": "L245", "number": 245, "module": "P17", "title": "Design the public API", "idea": "Validate impossible calls such as UP at the top floor. A tick is one deterministic state-machine step, not an elapsed real-time guarantee. Dispatcher decisions must be revalidated if car state can change concurrently.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "void hallCall(int floor, Direction direction);\nvoid carCall(String carId, int destination);\nvoid tick();\nCarView view(String carId);", "gotcha": "Top-floor UP is an impossible hall direction.", "question": "Which hall call is invalid?", "options": ["A car destination within bounds", "UP from the top floor", "DOWN from an interior floor"], "answer": 1, "explanation": "UP from the top floor. Validate impossible calls such as UP at the top floor. A tick is one deterministic state-machine step, not an elapsed real-time guarantee. Dispatcher decisions must be revalidated if car state can change concurrently.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Deep", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Elevator controller and dispatch", "step": 5, "slug": "elevator"}, {"id": "L246", "number": 246, "module": "P17", "title": "Draw the state machine", "idea": "At a destination, stop before opening. An open-door tick closes the door without moving. A later tick can resume motion. Separating these states makes the safety invariant visible rather than implicit in several booleans.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Opening must follow stopping, not happen during motion.", "question": "An open-door tick should do what in the simple model?", "options": ["Close without moving", "Move two floors", "Open another car's door"], "answer": 0, "explanation": "Close without moving. At a destination, stop before opening. An open-door tick closes the door without moving. A later tick can resume motion. Separating these states makes the safety invariant visible rather than implicit in several booleans.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["IDLE", "MOVING", "DOOR OPEN", "DOOR CLOSING"], "sources": [], "level": "Deep", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Elevator controller and dispatch", "step": 6, "slug": "elevator"}, {"id": "L247", "number": 247, "module": "P17", "title": "Trace the key operation", "idea": "Capture car states, select a candidate under the dispatch policy and assign the request. On each car tick, first handle the door state. If closed, choose a target, move toward it by one floor, and open only after reaching a stop.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Handle the door state before moving.", "question": "What is handled first in tick?", "options": ["Random dispatch", "Receipt generation", "Door state"], "answer": 2, "explanation": "Door state. Capture car states, select a candidate under the dispatch policy and assign the request. On each car tick, first handle the door state. If closed, choose a target, move toward it by one floor, and open only after reaching a stop.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Request", "Dispatcher", "Car stop set", "Tick + doors"], "sources": [], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Elevator controller and dispatch", "step": 7, "slug": "elevator"}, {"id": "L248", "number": 248, "module": "P17", "title": "Read the core Java logic", "idea": "This is a simplified simulator step. It omits physical acceleration, door sensors and hazard responses. It also needs an explicit policy for a request on the current floor and for direction changes when pending work lies behind the car.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "if (door == OPEN) { door = CLOSED; return; }\nOptionalInt target = stops.next(floor, direction);\nif (target.isEmpty()) { direction = IDLE; return; }\nfloor += Integer.signum(target.getAsInt() - floor);\nif (floor == target.getAsInt()) {\n    stops.remove(floor);\n    door = OPEN;\n}", "gotcha": "The small tick code is not a complete real-time controller.", "question": "What does the sketch deliberately omit?", "options": ["All state transitions", "Physical safety and sensor-control behavior", "The idea of a floor"], "answer": 1, "explanation": "Physical safety and sensor-control behavior. This is a simplified simulator step. It omits physical acceleration, door sensors and hazard responses. It also needs an explicit policy for a request on the current floor and for direction changes when pending work lies behind the car.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Elevator controller and dispatch", "step": 8, "slug": "elevator"}, {"id": "L249", "number": 249, "module": "P17", "title": "Handle races and failure", "idea": "Serialize state transitions per car. Dispatch can select from snapshots but must atomically register an assignment or retry if rejected. Do not let a hall request and a car request use independent un ation": "Assert floor stays unchanged during an open-door tick. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Deep", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Elevator controller and dispatch", "step": 10, "slug": "elevator"}, {"id": "L251", "number": 251, "module": "P17", "title": "Change one requirement", "idea": "Add request aging to reduce starvation under sustained traffic, then compare wait times using a deterministic workload. Emergency modes require a separate safety-oriented specification and are not validated by this workshop simulator.", "mental": "Nearest-car dispatch is simple but can be unfair and ignore direction. Direction-aware assignment and aging improve particular workloads at the cost of more state. Evaluate policy using a stated workload, not universal optimality claims.", "code": "", "gotcha": "Emergency operation is outside the simulation contract.", "question": "What can request aging address?", "options": ["All possible optimality concerns", "Starvation under some sustained workloads", "Hardware brake certification"], "answer": 1, "explanation": "Starvation under some sustained workloads. Add request aging to reduce starvation under sustained traffic, then compare wait times using a deterministic workload. Emergency modes require a separate safety-oriented specification and are not validated by this workshop simulator.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Deep", "detail": lls and physical cash movement as separate effects with uncertain outcomes.", "mental": "A design walkthrough with fake bank and dispenser ports, not real ATM firmware or a banking compliance specification. The core focuses on state, note planning, operation identity and recovery boundaries.", "code": "", "gotcha": "This is not an operational banking or hardware safety specification.", "question": "What does this walkthrough implement conceptually?", "options": ["Certified ATM firmware", "A guarantee of real-world exactly-once cash delivery", "A workflow with explicit fake ports and uncertainty"], "answer": 2, "explanation": "A workflow with explicit fake ports and uncertainty. Can the requested amount be formed with available notes? It must be checked. Can the dispenser partially dispense? The port must report or allow reconciliation of that case. Does timeout prove failure? No.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Deep", "detail": "Can the requested amount be formed with available notes? It must be checked. Can the dispenser partially dispense? The port must report or allow reconciliation of that case. Does timeout prove failure? No.", "kind": "step-1", "problem": "ATM withdrawal workflow", "step": 1, "slug": "atm"}, {"id": "L254", "number": 254, "module": "P18", "title": "Work through one example", "idea": "A withdrawal asks for 130. The ATM has one 100 note and three 10 notes, so a note plan exists. The bank authorizes it, but the dispenser reply is lost. The workflow must keep the attempt unresolved instead of retrying an unrelated second dispense.", "mental": "Account funds, reserved notes and physically dispensed notes are three different facts. The system must not invent a definite cash outcome after losing the hardware reply.", "code": "", "gotcha": "Available balance does not imply a feasible note combination.", "question": , "number": 256, "module": "P18", "title": "Choose objects and ownership", "idea": "AtmSession: owns authenticated interaction state.\nWithdrawalCoordinator: owns operation lifecycle and recovery decisions.\nCashInventory: validates and reserves a feasible note plan.\nBankPort: authorizes, settles or reverses by stable operation reference.\nDispenserPort: executes and queries a dispense attempt.\nWithdrawalRecord: immutable intent plus state and external references.", "mental": "The central consistency owner in this design is WithdrawalCoordinator. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "The UI session should not own the whole recovery protocol.", "question": "Who owns recovery decisions?", "options": ["AtmSession UI", "CashInventory alone", "WithdrawalCoordinator"], "answer": 2, "explanation": "WithdrawalCoordinator. WithdrawalCoordinator has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["WithdrawalCoordinator", "AtmSession", "CashInventory", "BankPort"], "sources": [], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "ATM withdrawal workflow", "step": 4, "slug": "atm"}, {"id": "L257", "number": 257, "module": "P18", "title": "Design the public API", "idea": "Avoid a boolean result that collapses declined, dispensed, partially dispensed and unknown. Authentication and amount limits belong to the session/policy boundary. Never include a raw secret such as a PIN in a diagnostic event.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "WithdrawalView withdraw(SessionId session,\n    String requestId, long amount);\nWithdrawalView reconcile(String withdrawalId);", "gotcha": "Never log authentication secrets to explain a failure.", "question": "Why is boolean success insufficient?", "options": ["It is always slower", "It hides declined, partial and unknown outcomes", "It cannot store a class name"], "answer": 1, "explanation": "It hides declined, partial and unknown outcomes. Avoid a boolean result that collapses declined, dispensed, partially dispensed and unknown. Authentication and amount limits belong to the session/policy boundary. Never include a raw secret such as a PIN in a diagnostic event.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Deep", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "ATM withdrawal workflow", "step": 5, "slug": "atm"}, {"id": "L258", "number": 258, "module": "P18", "title": "Draw the state machine", "idea": "Decline can terminate before dispensing. Authorization is not the same as final settlement. After a dispense request, a timeout enters UNKNOWN. Reconciliation may lead to settlement, partial handling or reversal under a specified bank/hardware protocol.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "AUTHORIZED and SETTLED mean different things.", "question": "Is authorization the same as settlement?", "options": ["No", "Yes", "Only for small amounts"], "answer": 0, "explanation": "No. Decline can terminate before dispensing. Authorization is not the same as final settlement. After a dispense request, a timeout enters UNKNOWN. Reconciliation may lead to settlement, partial handling or reversal under a specified bank/hardware protocol.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "f "atm"}, {"id": "L260", "number": 260, "module": "P18", "title": "Read the core Java logic", "idea": "This sketch illustrates boundaries only; it is not a safe complete protocol. The real ordering, recovery log and bank/dispenser guarantees must be specified together. Note reservation release is conditional on the known physical outcome.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "Withdrawal w = beginOrReplay(request);\nNotePlan plan = inventory.reservePlan(w.id(), w.amount());\nAuthorization auth = bank.authorize(w.id(), w.amount());\nrecordDispenseIntent(w, auth, plan);\nDispenseResult result = dispenser.dispense(w.id(), plan);\n// Timeout -> UNKNOWN, not automatic second dispense.\nrecordAndReconcile(w, result);", "gotcha": "The short sketch is not a complete recovery implementation.", "question": "What does the short code not provide?", "options": ["A place for operation identity", "A fully durable recovery protocol", "A separation of ports"], "answer": 1, "explanation": "A fully durable recovery protocol. This sketch illustrates boundaries only; it is not a safe complete protocol. The real ordering, recovery log and bank/dispenser guarantees must be specified together. Note reservation release is conditional on the known physical outcome.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "ATM withdrawal workflow", "step": 8, "slug": "atm"}, {"id": "L261", "number": 261, "module": "P18", "title": "Handle races and failure", "idea": "Serialize ownership of a note reservation and use stable withdrawal IDs at retry-aware ports. A JVM monitor cannot atomically include a remote bank and physical dispenser. On restart, recovery requires durable attempt state, which the in-memory exercises do not implement.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "A local lock cannot include a physical dispenser in one atomic commit.", "question": "Can a Java lock make bank and cash movement atomic?", "options": ["No", "Yes across all machines", "Only if static"], "answer": 0, "explanation": "No. Serialize ownership of a note reservation and use stable withdrawal IDs at retry-aware ports. A JVM monitor cannot atomically include a remote bank and physical dispenser. On restart, recovery requires durable attempt state, which the in-memory exercises do not implement.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Deep", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "ATM withdrawal workflow", "step": 9, "slug": "atm"}, {"id": "L262", "number": 262, "module": "P18", "title": "Build the test plan", "idea": "An impossible denomination request causes no dispense call.\nA declined authorization releases only its own reserved note plan.\nA lost dispense reply yields UNKNOWN, not a second new dispense.\nConflicting reuse of a withdrawal ID is rejected.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test the lost-reply case, not only explicit failure.", "question": "What should a lost-reply test forbid?", "options": ["Recording UNKNOWN", "Querying the original attempt", "A blind second new dispense"], "answer": 2, "explanation": "A blind second new dispense. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Deep", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "ATM withdrawal workflow", "step": 10, "slug": "atm"}, {"id": "L263", "number": 263, "module": "P18", "title": "Change one requirement", "idea": "For bounded note inventories, implement a feasible change planner and specify whether it minimizes note count or preserves certain denominations. Greedy largest-note-first can fail even when another valid combination exists.", "mental": "A clear state machine and fake ports are more valuable than an elaborate ATM class hierarchy. Physical uncertainty prevents a simple local transaction from proving end-to-end exactly-once cash delivery.", "code": "", "gotcha": "Greedy bounded coin change is not universally feasible.", "question": "Can largest-note-first fail with limited notes?", "options": ["Only if every amount is negative", "Yes", "No"], "answer": 1, "explanation": "Yes. For bounded note inventories, implement a feasible change planner and specify whether it minimizes note count or preserves certain denominations. Greedy largest-note-first can fail even when another valid combination exists.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Deep", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "ATM withdrawal workflow", "step": 11, "slug": "atm"}, {"id": "L264", "number": 264, "module": "P18", "title": "Defend the design", "idea": "I do not equate an authorization with cash delivery. I expose uncertainty in the state machine and bind retries to one withdrawal intent. The interview implementation uses fake ports; the production protocol requires stronger durability and device guarantees.", "mental": "Cash-plan complexity depends on amount and denomination counts; do not claim constant-time withdrawal. External latency and recovery dominate a real workflow and are outside a sequential data-structure cost.", "code": "", "gotcha": "Exactly-once physical effects cannot be asserted from a class diagram.", "question": "What matters more than extra class hierarchy here?", "options": ["Explicit state, effect boundaries and recovery contracts", "More inheritance levels", "A globally writable balance field"], "answer": 0, "explanation": "Explicit state, effect boundaries and recovery contracts. A clear state machine and fake ports are more valuable than an elaborate ATM class hierarchy. Physical uncertainty prevents a simple local transaction from proving end-to-end exactly-once cash delivery.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Deep", "detail": "A clear state machine and fake ports are more valuable than an elaborate ATM class hierarchy. Physical uncertainty prevents a simple local transaction from proving end-to-end exactly-once cash delivery.", "kind": "step-12", "problem": "ATM withdrawal workflow", "step": 12, "slug": "atm"}, {"id": "L265", "number": 265, "module": "P19", "title": "Problem statement and scope", "idea": "Design an in-memory hierarchical file system with directories and text files. Support creating paths, reading and appending file content, listing a directory and searching by name or size. Keep path traversal separate from search predicates.", "mental": "A rooted tree with absolute normalized paths. No symbolic links, hard links, permissions, disk persistence or concurrent streaming I/O. Names cannot be empty, dot or dot-dot, and a sibling name identifies only one entry.", "code": "", "gotcha": "A simplified tree is not a complete operating-system file system.", "question": "Are symbolic links in the core?", "options": ["Yes with all operating-system semantics", "Only when a filename contains a dot", "No"], "answer": 2, "explanation": "No. Does mkdir create missing parents? Choose and state the policy; this walkthrough uses explicit parent existence. Are listings sorted? Yes by name. Can a file and directory share one sibling name? No.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Core", "detail": "Does mkdir create missing parents? Choose and state the policy; this walkthrough uses explicit parent existence. Are listings sorted? Yes by name. Can a file and directory share one sibling name? No.", "kind": "step-1", "problem": "In-memory file system and search", "step": 1, "slug": "filesystem"}, {"id": "L266", "number": 266, "module": "P19", "title": "Work through one example", "idea": "Create /docs, then /docs/notes.txt with text \"hello\". Reading returns hello; appending \"!\" returns hello!. Listing /docs yields notes.txt. Trying to create a directory at /docs/notes.txt fails because that name is already a file.", "mental": "Paths identify entries within a parent, not arbitrary globally unique filenames. A search may visit many entries even when one direct path lookup is fast.", "code": "", "gotcha": "The same filename may exist under different directories.", "question": "Can /a/x and /b/x both exist?", "options": ["Only if both are directories", "Yes", "No; filenames are globally unique"], "answer": 1, "explanation": "Yes. Paths identify entries within a parent, not arbitrary globally unique filenames. A search may visit many entries even when one direct path lookup is fast.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Path", "Resolver", "Directory children", "Typed operation"], "sources": [], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "In-memory file system and search", "step": 2, "slug": "filesystem"}, {"id": "L267", "number": 267, "module": "P19", "title": "Write the invariants", "idea": "Each directory has unique child names.\nA file cannot contain children, and a directory cannot be read as text.\nEvery non-root entry has one parent in the tree model.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "A file cannot be used as an intermediate directory.", "question": "Can a TextFile have child entries?", "options": ["No", "Yes; any Entry can", "Only after reading it"], "answer": 0, "explanation": "No. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "In-memory file system and search", "step": 3, "slug": "filesystem"}, {"id": "L268", "number": 268, "module": "P19", "title": "Choose objects and ownership", "idea": "FileSystem: owns path resolution and controlled mutations.\nEntry: common immutable name and identity view.\nDirectory: owns a map of child names to entries.\nTextFile: owns content through controlled operations.\nSearchPredicate: tests read-only entry metadata.", "mental": "The central consistency owner in this design is FileSystem. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Search predicates should not own mutation.", "question": "Who coordinates path mutation?", "options": ["SearchPredicate", "EntryView", "FileSystem"], "answer": 2, "explanation": "FileSystem. FileSystem has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["FileSystem", "Entry", "Directory", "TextFile"], "sources": [], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "In-memory file system and search", "step": 4, "slug": "filesystem"}, {"id": "L269", "number": 269, "module": "P19", "title": "Design the public API", "idea": "State overwrite versus append behavior explicitly; use separate methods if both are supported. Normalize paths once, validate the root and distinguish not-found from wrong-entry-type errors. Return read views, not mutable child maps.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "void mkdir(String absolutePath);\nvoid write(String path, String text);\nString read(String path);\nList<String> list(String directory);\nList<EntryView> search(Predicate<EntryView> filter);", "gotcha": "Append and overwrite need distinct semantics.", "question": "What must write versus append specify?", "options": ["Only the directory color", "Whether old content is replaced or extended", "Only the file extension"], "answer": 1, "explanation": "Whether old content is replaced or extended. State overwrite versus append behavior explicitly; use separate methods if both are supported. Normalize paths once, validate the root and distinguish not-found from wrong-entry-type errors. Return read views, not mutable child maps.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "In-memory file system and search", "step": 5, "slug": "filesystem"}, {"id": "L270", "number": 270, "module": "P19", "title": "Draw the state machine", "idea": "A path segment resolves to either a file or a directory, never both. Removing a nonempty directory needs an explicit recursive-delete policy. The baseline does not silently reinterpret a file as a directory during traversal.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Deletion of a nonempty directory is not a trivial status flag.", "question": "Can traversal reinterpret an existing file as a directory?", "options": ["No", "Yes silently", "Only if the path is long"], "answer": 0, "explanation": "No. A path segment resolves to either a file or a directory, never both. Removing a nonempty directory needs an explicit recursive-delete policy. The baseline does not silently reinterpret a file as a directory during traversal.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["MISSING", "DIRECTORY / FILE", "UPDATED", "REMOVED (extension)"], "sources": [], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "In-memory file system and search", "step": 6, "slug": "filesystem"}, {"id": "L271", "number": 271, "module": "P19", "title": "Trace the key operation", "idea": "Split and validate the normalized absolute path, start at root and walk each parent segment, requiring a directory at every step. At the final segment, apply the operation's existence and type rules. Search separately traverses the tree and applies a predicate to metadata.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Validate and normalize before traversal.", "question": "What happens at every intermediate path component?", "options": ["Search every unrelated file", "Create a new root", "Require a directory and resolve its child"], "answer": 2, "explanation": "Require a directory and resolve its child. Split and validate the normalized absolute path, start at root and walk each parent segment, requiring a directory at every step. At the final segment, apply the operation's existence and type rules. Search separately traverses the tree and applies a predicate to metadata.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Path", "Resolver", "Directory children", "Typed operation"], "sources": [], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "In-memory file system and search", "step": 7, "slug": "filesystem"}, {"id": "L272", "number": 272, "module": "P19", "title": "Read the core Java logic", "idea": "The resolver is a contextual Java 17 pattern-matching sketch. It assumes normalizedSegments validates forbidden components rather than silently accepting traversal surprises. Search filters should not mutate the tree while it is being traversed.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "Entry current = root;\nfor (String part : normalizedSegments(path)) {\n    if (!(current instanceof Directory dir))\n        throw notDirectory();\n    current = dir.child(part);\n    if (current == null) throw notFound();\n}\nreturn current;", "gotcha": "Do not silently swallow dot-dot into an unintended parent.", "question": "What does the resolver assume?", "options": ["All missing paths are files", "Segments are normalized and validated", "Every input is already trustworthy"], "answer": 1, "explanation": "Segments are normalized and validated. The resolver is a contextual Java 17 pattern-matching sketch. It assumes normalizedSegments validates forbidden components rather than silently accepting traversal surprises. Search filters should not mutate the tree while it is being traversed.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "In-memory file system and search", "step": 8, "slug": "filesystem"}, {"id": "L273", "number": 273, "module": "P19", "title": "Handle races and failure", "idea": "A simple file-system lock can protect path traversal plus mutation. Locking only the final entry is insufficient if a parent can be moved or removed concurrently. Snapshot search or read-lock traversal requires explicit freshness and writer-blocking semantics.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Moving parents changes the meaning of final-entry locks.", "question": "Why can final-entry-only locking be insufficient?", "options": ["Parents may move or disappear during traversal", "Files never have names", "Maps cannot be synchronized"], "answer": 0, "explanation": "Parents may move or disappear during traversal. A simple file-system lock can protect path traversal plus mutation. Locking only the final entry is insufficient if a parent can be moved or removed concurrently. Snapshot search or read-lock traversal requires explicit freshness and writer-blocking semantics.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "In-memory file system and search", "step": 9, "slug": "filesystem"}, {"id": "L274", "number": 274, "module": "P19", "title": "Build the test plan", "idea": "Reading a directory returns a typed failure.\nA missing parent is rejected under the chosen mkdir policy.\nDuplicate sibling names are rejected.\nNested search returns matching files without exposing mutable entries.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test wrong type as well as missing path.", "question": "Which test checks type safety?", "options": ["Only read one existing file", "Only compare path strings", "Attempt to read a directory as text"], "answer": 2, "explanation": "Attempt to read a directory as text. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "In-memory file system and search", "step": 10, "slug": "filesystem"}, {"id": "L275", "number": 275, "module": "P19", "title": "Change one requirement", "idea": "Add symbolic links only with a specified resolution depth or visited-identity cycle detection. A tree traversal that was safe without links can loop forever once the structure becomes a graph.", "mental": "Composite modeling makes uniform traversal natural, while keeping addChild only on Directory preserves honest interfaces. A flat map keyed by full path simplifies lookup but makes subtree rename and ownership updates more expensive.", "code": "", "gotcha": "Links turn a tree into a possible cyclic graph.", "question": "What must link support address?", "options": ["Automatic disk durability", "Cycles and resolution policy", "Only text encoding"], "answer": 1, "explanation": "Cycles and resolution policy. Add symbolic links only with a specified resolution depth or visited-identity cycle detection. A tree traversal that was safe without links can loop forever once the structure becomes a graph.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "In-memory file system and search", "step": 11, "slug": "filesystem"}, {"id": "L276", "number": 276, "module": "P19", "title": "Defend the design", "idea": "I first define path and type semantics. The resolver handles navigation; predicates handle filtering. I explicitly exclude links from the tree baseline and explain why adding them changes termination and identity rules.", "mental": "D path segments: expected O(D) resolution with child maps. Search visits N entries: O(N + output size). Sorted listing of K children costs O(K log K) unless order is maintained on writes.", "code": "", "gotcha": "A full-tree search is not O(path depth).", "question": "What is full-tree search cost?", "options": ["O(N + output size)", "Always O(1)", "Only O(path depth)"], "answer": 0, "explanation": "O(N + output size). Composite modeling makes uniform traversal natural, while keeping addChild only on Directory preserves honest interfaces. A flat map keyed by full path simplifies lookup but makes subtree rename and ownership updates more expensive.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Core", "detail": "Composite modeling makes uniform traversal natural, while keeping addChild only on Directory preserves honest interfaces. A flat map keyed by full path simplifies lookup but makes subtree rename and ownership updates more expensive.", "kind": "step-12", "problem": "In-memory file system and search", "step": 12, "slug": "filesystem"}, {"id": "L277", "number": 277, "module": "P20", "title": "Problem statement and scope", "idea": "Design a single-document text editor with insert, delete, undo and redo. Each successful edit is one history entry. Undo restores the prior text; redo reapplies the undone edit. A new edit after undo discards the abandoned redo branch.", "mental": "Single-user in-memory text, character offsets and linear history. No collaborative editing, rich-text styles, persistence or grapheme-aware cursor handling. The tested companion uses text snapshots for clarity.", "code": "", "gotcha": "A single-user undo stack is not a collaborative editor.", "question": "What kind of history does this baseline support?", "options": ["Full collaborative merge history", "Unlimited durable version control", "Single-user linear history"], "answer": 2, "explanation": "Single-user linear history. Does an invalid edit enter history? No. Does a no-op count as an edit? This baseline ignores empty insertions and zero-length deletes. What happens after undo then a new edit? Clear redo history.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S22"], "level": "Core", "detail": "Does an invalid edit enter history? No. Does a no-op count as an edit? This baseline ignores empty insertions and zero-length deletes. What happens after undo then a new edit? Clear redo history.", "kind": "step-1", "problem": "Text editor with undo and redo", "step": 1, "slug": "editor"}, {"id": "L278", "number": 278, "module": "P20", "title": "Work through one example", "idea": "Start with \"ab\". Insert \"X\" at index 1 to get \"aXb\". Delete index 0 length 1 to get \"Xb\". Undo restores \"aXb\". Undo again restores \"ab\". Redo gives \"aXb\". A new insert now clears the old redo branch.", "mental": "History is a branching timeline with only one active forward branch in this baseline. A redo entry refers to a specific prior state, not any later arbitrary text.", "code": "", "gotcha": "Offsets are zero-based code-unit positions in this version.", "question": "What is \"ab\" after inserting X at index 1?", "options": ["abX", "aXb", "Xab"], "answer": 1, "explanation": "aXb. History is a branching timeline with only one active forward branch in this baseline. A redo entry refers to a specific prior state, not any later arbitrary text.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Edit request", "Validate range", "Save prior text", "Apply + clear redo"], "sources": ["S22"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Text editor with undo and redo", "step": 2, "slug": "editor"}, {"id": "L279", "number": 279, "module": "P20", "title": "Write the invariants", "idea": "Invalid edits leave text and both history stacks unchanged.\nUndo and redo move one accepted edit between history sides.\nA new accepted edit clears all redo entries.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "An invalid edit must not create a phantom history entry.", "question": "Should an invalid edit enter history?", "options": ["No", "Yes", "Only if it throws"], "answer": 0, "explanation": "No. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S22"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Text editor with undo and redo", "step": 3, "slug": "editor"}, {"id": "L280", "number": 280, "module": "P20", "title": "Choose objects and ownership", "idea": "Editor: owns current text and history stacks.\nEditCommand: optional operation-specific forward/inverse data.\nSnapshot: immutable text before or after an accepted edit.\nHistory: undo and redo stack ownership, possibly inside Editor.\nDocumentView: immutable current text and history availability.", "mental": "The central consistency owner in this design is Editor. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A read view should not expose mutable history stacks.", "question": "Who owns both history stacks?", "options": ["DocumentView", "EditCommand alone", "Editor"], "answer": 2, "explanation": "Editor. Editor has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Editor", "EditCommand", "Snapshot", "History"], "sources": ["S22"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Text editor with undo and redo", "step": 4, "slug": "editor"}, {"id": "L281", "number": 281, "module": "P20", "title": "Design the public API", "idea": "Validate index and range before recording history. Define indices as Java UTF-16 code-unit positions for this simple model; this is not the same as user-perceived characters. Returning String is safe for text ownership.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "void insert(int index, String text);\nvoid delete(int index, int length);\nboolean undo();\nboolean redo();\nString text();", "gotcha": "User-perceived characters may span multiple UTF-16 code units.", "question": "What do indices mean here?", "options": ["Byte positions in a network packet", "UTF-16 code-unit positions", "Always complete visual characters"], "answer": 1, "explanation": "UTF-16 code-unit positions. Validate index and range before recording history. Define indices as Java UTF-16 code-unit positions for this simple model; this is not the same as user-perceived characters. Returning String is safe for text ownership.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S22"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Text editor with undo and redo", "step": 5, "slug": "editor"}, {"id": "L282", "number": 282, "module": "P20", "title": "Draw the state machine", "idea": "Undo pushes current text onto redo, then restores the latest undo text. Redo pushes current text onto undo, then restores the latest redo text. A fresh edit adds the previous text to undo and clears redo.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "New edits after undo invalidate the old redo branch.", "question": "A new edit follows undo. What happens to redo?", "options": ["It is cleared", "It is kept and applied to unrelated text", "It automatically becomes another document"], "answer": 0, "explanation": "It is cleared. Undo pushes current text onto redo, then restores the latest undo text. Redo pushes current text onto undo, then restores the latest redo text. A fresh edit adds the previous text to undo and clears redo.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["EDITED", "UNDO AVAILABLE", "REDO AVAILABLE", "NEW BRANCH"], "sources": ["S22"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Text editor with undo and redo", "step": 6, "slug": "editor"}, {"id": "L283", "number": 283, "module": "P20", "title": "Trace the key operation", "idea": "For an edit, compute the resulting string before touching history. If the operation is valid and nontrivial, push the old text, assign the new text and clear redo. For undo/redo, check stack emptiness and move snapshots under one owner boundary.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Compute and validate the new text before changing history.", "question": "What happens before pushing history?", "options": ["Clearing every stack", "Returning a mutable buffer", "Input validation and new-text computation"], "answer": 2, "explanation": "Input validation and new-text computation. For an edit, compute the resulting string before touching history. If the operation is valid and nontrivial, push the old text, assign the new text and clear redo. For undo/redo, check stack emptiness and move snapshots under one owner boundary.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Edit request", "Validate range", "Save prior text", "Apply + clear redo"], "sources": ["S22"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Text editor with undo and redo", "step": 7, "slug": "editor"}, {"id": "L284", "number": 284, "module": "P20", "title": "Read the core Java logic", "idea": "The companion uses snapshots instead of inverse commands, trading memory for simple correctness. A command-based delete must retain removed content and position. Neither approach by itself handles concurrent collaborative edits.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "String next = current.substring(0, index)\n    + inserted + current.substring(index);\nundo.push(current);\ncurrent = next;\nredo.clear();\n// Validate input before this sequence.", "gotcha": "Deleting text requires retaining it if using inverse commands.", "question": "Why choose snapshots for the companion?", "options": ["They automatically support collaboration", "Simple, verifiable reversal at a memory cost", "They always use constant total memory"], "answer": 1, "explanation": "Simple, verifiable reversal at a memory cost. The companion uses snapshots instead of inverse commands, trading memory for simple correctness. A command-based delete must retain removed content and position. Neither approach by itself handles concurrent collaborative edits.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S22"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Text editor with undo and redo", "step": 8, "slug": "editor"}, {"id": "L285", "number": 285, "module": "P20", "title": "Handle races and failure", "idea": "Serialize all operations on one Editor in the baseline. A stale client offset may refer to different text after another edit. Collaboration requires document versions and an operation-transformation or CRDT-style protocol outside this linear-history design.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Old offsets need version handling under concurrent editing.", "question": "What makes a stale client offset unsafe?", "options": ["Other edits may have changed the document positions", "Offsets are strings", "Undo always removes the whole document"], "answer": 0, "explanation": "Other edits may have changed the document positions. Serialize all operations on one Editor in the baseline. A stale client offset may refer to different text after another edit. Collaboration requires document versions and an operation-transformation or CRDT-style protocol outside this linear-history design.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S22"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Text editor with undo and redo", "step": 9, "slug": "editor"}, {"id": "L286", "number": 286, "module": "P20", "title": "Build the test plan", "idea": "Insert and delete followed by undo restore the exact prior text.\nAn invalid range preserves text and history depths.\nA new edit after undo makes redo unavailable.\nUndo or redo on an empty stack is a no-op returning false.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test history depth as well as the final string.", "question": "What should empty undo return?", "options": ["A fabricated edit", "An exception after clearing text", "False without mutation"], "answer": 2, "explanation": "False without mutation. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S22"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Text editor with undo and redo", "step": 10, "slug": "editor"}, {"id": "L287", "number": 287, "module": "P20", "title": "Change one requirement", "idea": "Coalesce consecutive typing into one undo unit with a documented boundary such as a pause or cursor move. Coalescing affects user-visible history, so test it separately from low-level character insertion.", "mental": "Snapshots are easy to verify but store repeated text. Inverse commands save memory for small edits but make deletion data, grouping and index validity more complex. Persistent text structures are another advanced alternative.", "code": "", "gotcha": "Grouping keystrokes changes the user-visible undo contract.", "question": "What does typing coalescence change?", "options": ["The meaning of String immutability", "The undo-unit boundary", "Only the font"], "answer": 1, "explanation": "The undo-unit boundary. Coalesce consecutive typing into one undo unit with a documented boundary such as a pause or cursor move. Coalescing affects user-visible history, so test it separately from low-level character insertion.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S22"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Text editor with undo and redo", "step": 11, "slug": "editor"}, {"id": "L288", "number": 288, "module": "P20", "title": "Defend the design", "idea": "I make failure and branching semantics explicit. The baseline intentionally uses snapshots so undo is easy to prove. I can replace storage later without changing the visible edit/undo/redo contract.", "mental": "Text length N: simple String edit O(N). H full snapshots of average length N use O(H*N) character storage. Snapshot stack movement is O(1), but retaining text still has memory cost.", "code": "", "gotcha": "Snapshots trade memory for simplicity.", "question": "What is full-snapshot history space roughly?", "options": ["O(H*N)", "Always O(1)", "O(log H) regardless of text"], "answer": 0, "explanation": "O(H*N). Snapshots are easy to verify but store repeated text. Inverse commands save memory for small edits but make deletion data, grouping and index validity more complex. Persistent text structures are another advanced alternative.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S22"], "level": "Core", "detail": "Snapshots are easy to verify but store repeated text. Inverse commands save memory for small edits but make deletion data, grouping and index val
