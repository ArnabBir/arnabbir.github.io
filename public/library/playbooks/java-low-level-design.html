ce is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Extensible logging library", "step": 7, "slug": "logger"}, {"id": "L152", "number": 152, "module": "P09", "title": "Read the core Java logic", "idea": "The sketch shows failure isolation, not a complete file writer. Event timestamps are sampled once per event. Mutable structured context must be copied or converted into immutable values before handing the event to another thread.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "if (!threshold.accepts(level)) return ignored();\nLogEvent event = snapshotEvent(level, message);\nList<Exception> failures = new ArrayList<>();\nfor (Sink sink : sinkSnapshot) {\n    try { sink.write(event); }\n    catch (Exception e) { failures.add(e); }\n}\nreturn new LogResult(failures);", "gotcha": "Catching a sink failure does not mean it should disappear silently.", "question": "What does the loop isolate?", "options": ["All concurrent writer races automatically", "Failures of individual sinks", "Every possible process crash"], "answer": 1, "explanation": "Failures of individual sinks. The sketch shows failure isolation, not a complete file writer. Event timestamps are sampled once per event. Mutable structured context must be copied or converted into immutable values before handing the event to another thread.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S18"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Extensible logging library", "step": 8, "slug": "logger"}, {"id": "L153", "number": 153, "module": "P09", "title": "Handle races and failure", "idea": "Configuration changes can publish a new immutable sink list. Existing calls use their captured list. Define sink thread safety explicitly: the logger being thread-safe does not automatically make an injected file writer safe. Resource closure must coordinate with in-flight writers.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Closing a sink while another thread writes needs a lifecycle contract.", "question": "What must an injected sink document?", "options": ["Its concurrency and lifecycle contract", "Only its class name", "Only its preferred font"], "answer": 0, "explanation": "Its concurrency and lifecycle contract. Configuration changes can publish a new immutable sink list. Existing calls use their captured list. Define sink thread safety explicitly: the logger being thread-safe does not automatically make an injected file writer safe. Resource closure must coordinate with in-flight writers.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S18"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Extensible logging library", "step": 9, "slug": "logger"}, {"id": "L154", "number": 154, "module": "P09", "title": "Build the test plan", "idea": "Below-threshold events call no sink.\nOne failing sink does not suppress a healthy later sink.\nCaller mutation after log does not alter a captured event.\nClose follows the documented repeated-close and in-flight-write behavior.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "A happy-path file test does not verify failure isolation.", "question": "Which test checks failure isolation?", "options": ["One successful console message", "Only comparing enum ordinals", "A failing sink followed by a healthy sink"], "answer": 2, "explanation": "A failing sink followed by a healthy sink. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S18"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Extensible logging library", "step": 10, "slug": "logger"}, {"id": "L155", "number": 155, "module": "P09", "title": "Change one requirement", "idea": "Add an asynchronous bounded queue. Specify what happens when full: block, drop, fail or sample. Include a visible dropped-event count. A queue without a bound can turn a logging slowdown into memory exhaustion.", "mental": "Synchronous delivery is simple and makes backpressure visible as caller latency. Asynchronous delivery decouples bursts but adds overflow, ordering, shutdown and crash-loss decisions. It cannot be summarized as merely \"faster\".", "code": "", "gotcha": "An unbounded async queue moves the failure into memory.", "question": "What is required for a bounded async queue?", "options": ["A promise that producers never burst", "An explicit full-queue policy", "Infinite memory"], "answer": 1, "explanation": "An explicit full-queue policy. Add an asynchronous bounded queue. Specify what happens when full: block, drop, fail or sample. Include a visible dropped-event count. A queue without a bound can turn a logging slowdown into memory exhaustion.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S18"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Extensible logging library", "step": 11, "slug": "logger"}, {"id": "L156", "number": 156, "module": "P09", "title": "Defend the design", "idea": "I treat failure and resource lifetime as part of the logging API. I separate event creation, formatting and output, and I do not claim durability for an in-memory queue. The overload policy is an explicit extension decision.", "mental": "K sinks and event size M: at least O(K + M) coordination/formatting work, plus sink I/O. Asynchronous buffering adds O(queue capacity times average event size) memory.", "code": "", "gotcha": "Async does not mean durable or exactly once.", "question": "What cost does asynchronous delivery add?", "options": ["Buffering, overflow and shutdown complexity", "No operational cost", "Automatic durability"], "answer": 0, "explanation": "Buffering, overflow and shutdown complexity. Synchronous delivery is simple and makes backpressure visible as caller latency. Asynchronous delivery decouples bursts but adds overflow, ordering, shutdown and crash-loss decisions. It cannot be summarized as merely \"faster\".", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S18"], "level": "Core", "detail": "Synchronous delivery is simple and makes backpressure visible as caller latency. Asynchronous delivery decouples bursts but adds overflow, ordering, shutdown and crash-loss decisions. It cannot be summarized as merely \"faster\".", "kind": "step-12", "problem": "Extensible logging library", "step": 12, "slug": "logger"}, {"id": "L157", "number": 157, "module": "P10", "title": "Problem statement and scope", "idea": "Design a topic-based event bus. Clients subscribe callbacks, publish immutable events and unsubscribe using a returned token. One publication delivers to a snapshot of the subscribers present when that snapshot is taken.", "mental": "Synchronous process-local delivery, registration order within a captured snapshot and exception isolation. No durable replay, consumer offsets, network partitions or exactly-once delivery.", "code": "", "gotcha": "Calling it a bus does not make it a durable broker.", "question": "What is the delivery boundary?", "options": ["Everyone who ever subscribed", "Only whoever remains after all callbacks finish", "Subscribers in a captured snapshot"], "answer": 2, "explanation": "Subscribers in a captured snapshot. Does unsubscribe during publish affect the current event? Not after the snapshot is captured. May callbacks publish recursively? Yes in the simple contract, but callers must avoid unbounded recursion. Duplicate registrations produce distinct tokens.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "Does unsubscribe during publish affect the current event? Not after the snapshot is captured. May callbacks publish recursively? Yes in the simple contract, but callers must avoid unbounded recursion. Duplicate registrations produce distinct tokens.", "kind": "step-1", "problem": "In-memory publish-subscribe bus", "step": 1, "slug": "pubsub"}, {"id": "L158", "number": 158, "module": "P10", "title": "Work through one example", "idea": "Topic orders has subscribers A and B. Publication captures [A,B]. A unsubscribes B while handling the event. B still receives that current event. A later publication captures only A.", "mental": "The snapshot gives a precise subscription boundary. Unsubscribe prevents inclusion in future snapshots; it does not revoke work already captured by an in-flight publication.", "code": "", "gotcha": "Unsubscribe is not time travel for captured deliveries.", "question": "Does B get the current event after A unsubscribes B?", "options": ["Only if B subscribes again", "Yes, because B was captured", "No, never"], "answer": 1, "explanation": "Yes, because B was captured. The snapshot gives a precise subscription boundary. Unsubscribe prevents inclusion in future snapshots; it does not revoke work already captured by an in-flight publication.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Publisher", "Subscriber snapshot", "Callbacks", "Report"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "In-memory publish-subscribe bus", "step": 2, "slug": "pubsub"}, {"id": "L159", "number": 159, "module": "P10", "title": "Write the invariants", "idea": "Each subscription token identifies exactly one registration.\nA publication attempts each callback in its captured snapshot once.\nA callback failure does not corrupt the registration list or suppress later callbacks under this policy.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "One callback object may have several registrations.", "question": "What uniquely identifies a registration?", "options": ["Its subscription token", "Only the callback class name", "Only the topic string"], "answer": 0, "explanation": "Its subscription token. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "In-memory publish-subscribe bus", "step": 3, "slug": "pubsub"}, {"id": "L160", "number": 160, "module": "P10", "title": "Choose objects and ownership", "idea": "EventBus: owns topic-to-registration lists.\nSubscription: token, topic and idempotent close/unsubscribe action.\nRegistration: unique ID and callback reference.\nEvent: immutable payload and event identity.\nDeliveryReport: completed attempts and captured failures.", "mental": "The central consistency owner in this design is EventBus. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Events should not own the subscriber registry.", "question": "Who owns the registry?", "options": ["Event", "DeliveryReport", "EventBus"], "answer": 2, "explanation": "EventBus. EventBus has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["EventBus", "Subscription", "Registration", "Event"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "In-memory publish-subscribe bus", "step": 4, "slug": "pubsub"}, {"id": "L161", "number": 161, "module": "P10", "title": "Design the public API", "idea": "Use a distinct token for every registration, even when the same callback object subscribes twice. close is idempotent by this bus's contract. A delivery report describes local callback attempts, not durable downstream processing.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "Subscription subscribe(String topic, Listener listener);\nDeliveryReport publish(String topic, Event event);\ninterface Subscription extends AutoCloseable {\n    void close();\n}", "gotcha": "AutoCloseable does not itself guarantee idempotent close; this API chooses that behavior.", "question": "Closing one duplicate registration should remove?", "options": ["The entire topic", "Only that registration", "Every callback of the same class"], "answer": 1, "explanation": "Only that registration. Use a distinct token for every registration, even when the same callback object subscribes twice. close is idempotent by this bus's contract. A delivery report describes local callback attempts, not durable downstream processing.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "In-memory publish-subscribe bus", "step": 5, "slug": "pubsub"}, {"id": "L162", "number": 162, "module": "P10", "title": "Draw the state machine", "idea": "Subscription state and in-flight delivery state overlap. An unsubscribed registration may still exist in a previously captured snapshot. The API must state this rather than pretending unsubscribe instantly cancels arbitrary running code.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Registration removal and in-flight execution are different lifecycles.", "question": "Can an unsubscribed callback still be in flight?", "options": ["Yes", "No", "Only after a process restart"], "answer": 0, "explanation": "Yes. Subscription state and in-flight delivery state overlap. An unsubscribed registration may still exist in a previously captured snapshot. The API must state this rather than pretending unsubscribe instantly cancels arbitrary running code.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["REGISTERED", "SNAPSHOT CAPTURED", "CALLBACK ATTEMPT", "UNSUBSCRIBED"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "In-memory publish-subscribe bus", "step": 6, "slug": "pubsub"}, {"id": "L163", "number": 163, "module": "P10", "title": "Trace the key operation", "idea": "Under a short registry lock, copy the topic's registrations. Release the lock before invoking user code. For each captured registration, call the listener and collect its failure if any. Concurrent registration changes affect only later snapshots.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Invoking callbacks under a lock invites reentrancy and stalls.", "question": "When is the registry lock released?", "options": ["After every callback has finished", "Never", "Before invoking callbacks"], "answer": 2, "explanation": "Before invoking callbacks. Under a short registry lock, copy the topic's registrations. Release the lock before invoking user code. For each captured registration, call the listener and collect its failure if any. Concurrent registration changes affect only later snapshots.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Publisher", "Subscriber snapshot", "Callbacks", "Report"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "In-memory publish-subscribe bus", "step": 7, "slug": "pubsub"}, {"id": "L164", "number": 164, "module": "P10", "title": "Read the core Java logic", "idea": "List.copyOf makes a structural snapshot of registrations; event and registration content must have safe ownership too. CopyOnWriteArrayList is an alternative when registration changes are rare, not a free improvement for write-heavy workloads.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "List<Registration> snapshot;\nsynchronized (registry) {\n    snapshot = List.copyOf(registrations(topic));\n}\nfor (Registration r : snapshot) {\n    try { r.listener().on(event); }\n    catch (RuntimeException e) { failures.add(e); }\n}", "gotcha": "A list snapshot does not deep-copy an arbitrary payload.", "question": "What does List.copyOf copy here?", "options": ["All listener state recursively", "The list structure, not arbitrary nested mutable payloads", "The entire process memory"], "answer": 1, "explanation": "The list structure, not arbitrary nested mutable payloads. List.copyOf makes a structural snapshot of registrations; event and registration content must have safe ownership too. CopyOnWriteArrayList is an alternative when registration changes are rare, not a free improvement for write-heavy workloads.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "In-memory publish-subscribe bus", "step": 8, "slug": "pubsub"}, {"id": "L165", "number": 165, "module": "P10", "title": "Handle races and failure", "idea": "Do not invoke a callback while holding the registry lock. A callback may subscribe, unsubscribe, publish again or block. Concurrent publish calls may invoke the same listener concurrently; either document that requirement or add per-listener serialization.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Concurrent publications can still race inside the same listener.", "question": "Can concurrent publishers invoke one listener concurrently?", "options": ["Yes unless the bus adds serialization", "Never because the list is copied", "Only with a null topic"], "answer": 0, "explanation": "Yes unless the bus adds serialization. Do not invoke a callback while holding the registry lock. A callback may subscribe, unsubscribe, publish again or block. Concurrent publish calls may invoke the same listener concurrently; either document that requirement or add per-listener serialization.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "In-memory publish-subscribe bus", "step": 9, "slug": "pubsub"}, {"id": "L166", "number": 166, "module": "P10", "title": "Build the test plan", "idea": "Unsubscribe during a callback does not alter the current snapshot.\nThe next publication excludes the closed subscription.\nA throwing listener does not prevent the next listener from running.\nClosing one of two registrations of the same callback removes only that registration.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test duplicate registration tokens independently.", "question": "Which test clarifies unsubscribe semantics?", "options": ["Only publish to an empty topic", "Only print token IDs", "Unsubscribe during an active callback snapshot"], "answer": 2, "explanation": "Unsubscribe during an active callback snapshot. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "In-memory publish-subscribe bus", "step": 10, "slug": "pubsub"}, {"id": "L167", "number": 167, "module": "P10", "title": "Change one requirement", "idea": "Add asynchronous delivery with bounded per-subscriber queues. Decide whether slow subscribers drop events, block the publisher or disconnect. Durable replay requires a stored log and acknowledgement protocol, which is a different scope.", "mental": "Copy-on-publish makes the subscription boundary easy to explain. Copy-on-write moves copying cost to subscription updates. Neither choice gives durable messaging or prevents a subscriber's own race conditions.", "code": "", "gotcha": "Async queues need a slow-subscriber policy.", "question": "What must asynchronous delivery define?", "options": ["A promise of unlimited throughput", "Backpressure or overflow behavior for slow subscribers", "Only a thread name"], "answer": 1, "explanation": "Backpressure or overflow behavior for slow subscribers. Add asynchronous delivery with bounded per-subscriber queues. Decide whether slow subscribers drop events, block the publisher or disconnect. Durable replay requires a stored log and acknowledgement protocol, which is a different scope.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "In-memory publish-subscribe bus", "step": 11, "slug": "pubsub"}, {"id": "L168", "number": 168, "module": "P10", "title": "Defend the design", "idea": "My bus has an explicit unsubscribe boundary and never holds internal locks across user callbacks. I separate a process-local observer mechanism from a durable broker. The race tests demonstrate the promised snapshot behavior.", "mental": "S subscribers to a topic: O(S) snapshot and dispatch coordination, plus callback work. Registry storage is O(total live subscriptions). Copy-on-write changes which operations pay the copy cost.", "code": "", "gotcha": "Copy-on-write is expensive when subscriptions change often.", "question": "When is copy-on-write attractive?", "options": ["Many traversals and relatively few registration changes", "Every operation mutates the list heavily", "Only with durable storage"], "answer": 0, "explanation": "Many traversals and relatively few registration changes. Copy-on-publish makes the subscription boundary easy to explain. Copy-on-write moves copying cost to subscription updates. Neither choice gives durable messaging or prevents a subscriber's own race conditions.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S03", "S11", "S18"], "level": "Core", "detail": "Copy-on-publish makes the subscription boundary easy to explain. Copy-on-write moves copying cost to subscription updates. Neither choice gives durable messaging or prevents a subscriber's own race conditions.", "kind": "step-12", "problem": "In-memory publish-subscribe bus", "step": 12, "slug": "pubsub"}, {"id": "L169", "number": 169, "module": "P11", "title": "Problem statement and scope", "idea": "Design a library core that lends physical copies of books to members and records returns. Several copies may share a title. Enforce a maximum number of active loans per member and prevent a copy from being lent to two members at once.", "mental": "One branch, distinct copy IDs, injected clock and fixed loan duration. No fines, reservation queue, ebook licensing or inter-branch transfer in the core.", "code": "", "gotcha": "A title ID is not a physical copy ID.", "question": "What object is actually lent?", "options": ["Only a book title", "A new member account", "A uniquely identified physical copy"], "answer": 2, "explanation": "A uniquely identified physical copy. Do we lend a title or a physical copy? A copy. Can a return be retried? Yes. Does a missing copy equal a currently borrowed copy? No; report different failures.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S07"], "level": "Core", "detail": "Do we lend a title or a physical copy? A copy. Can a return be retried? Yes. Does a missing copy equal a currently borrowed copy? No; report different failures.", "kind": "step-1", "problem": "Library lending system", "step": 1, "slug": "library"}, {"id": "L170", "number": 170, "module": "P11", "title": "Work through one example", "idea": "Title T has copies C1 and C2. Ana borrows C1 and Ben borrows C2. A third request for C1 is rejected. Ana returns her loan. C1 becomes available while Ben's C2 loan remains active.", "mental": "Title-level stock is not the identity of a loan. Returning C1 must not affect C2, even though both have the same title.", "code": "", "gotcha": "Returning one copy must not release all copies of its title.", "question": "Ana returns C1. What happens to C2?", "options": ["Its title changes", "It remains on Ben's active loan", "It is also returned"], "answer": 1, "explanation": "It remains on Ben's active loan. Title-level stock is not the identity of a loan. Returning C1 must not affect C2, even though both have the same title.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Librarian", "Library", "Copy + member checks", "Loan"], "sources": ["S07"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Library lending system", "step": 2, "slug": "library"}, {"id": "L171", "number": 171, "module": "P11", "title": "Write the invariants", "idea": "A copy has at most one active loan.\nA member's active loan count never exceeds the configured limit.\nClosing a loan releases its copy at most once.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "A member-limit check races across different copies too.", "question": "Which rule spans multiple copies?", "options": ["The member's active-loan limit", "A copy's label color", "The ISBN string length"], "answer": 0, "explanation": "The member's active-loan limit. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S07"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Library lending system", "step": 3, "slug": "library"}, {"id": "L172", "number": 172, "module": "P11", "title": "Choose objects and ownership", "idea": "Library: owns checkout/return and cross-index consistency.\nBookTitle: bibliographic metadata shared by copies.\nBookCopy: unique physical inventory identity.\nMember: ID and lending eligibility.\nLoan: copy ID, member ID, due time and returned time.", "mental": "The central consistency owner in this design is Library. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Book metadata should not own checkout workflow.", "question": "Who owns atomic checkout?", "options": ["BookTitle", "BookCopy metadata", "Library"], "answer": 2, "explanation": "Library. Library has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Library", "BookTitle", "BookCopy", "Member"], "sources": ["S07"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Library lending system", "step": 4, "slug": "library"}, {"id": "L173", "number": 173, "module": "P11", "title": "Design the public API", "idea": "checkout validates known member, known copy, availability and member limit in one operation. Return uses loan identity, not just a title or current copy status. A repeated return returns the closed loan view.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "LoanView checkout(String memberId, String copyId);\nLoanView returnLoan(String loanId);\nList<LoanView> activeLoans(String memberId);", "gotcha": "Return by old loan ID is safer than setting a copy available.", "question": "What ID should a retry-safe return use?", "options": ["Only the member's display name", "Loan ID", "Only the title name"], "answer": 1, "explanation": "Loan ID. checkout validates known member, known copy, availability and member limit in one operation. Return uses loan identity, not just a title or current copy status. A repeated return returns the closed loan view.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S07"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Library lending system", "step": 5, "slug": "library"}, {"id": "L174", "number": 174, "module": "P11", "title": "Draw the state machine", "idea": "A loan moves ACTIVE to RETURNED; a copy cycles AVAILABLE to ON_LOAN to AVAILABLE. Retain loan history so an old return cannot close a newer loan on the same copy.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "A returned loan remains historical rather than becoming active again.", "question": "May an old returned loan become active again?", "options": ["No", "Yes whenever its copy is free", "Only after midnight"], "answer": 0, "explanation": "No. A loan moves ACTIVE to RETURNED; a copy cycles AVAILABLE to ON_LOAN to AVAILABLE. Retain loan history so an old return cannot close a newer loan on the same copy.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["AVAILABLE", "ON LOAN", "RETURNED", "AVAILABLE AGAIN"], "sources": ["S07"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Library lending system", "step": 6, "slug": "library"}, {"id": "L175", "number": 175, "module": "P11", "title": "Trace the key operation", "idea": "Validate both IDs, find whether the copy has an active loan, and check the member's active count. Create the due time from the injected clock, then store the loan and update the copy and member indexes atomically.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Compute predictable failures before updating any index.", "question": "What must be checked before creating the active loan?", "options": ["Only the title text", "Only the due date format", "Copy availability and member capacity"], "answer": 2, "explanation": "Copy availability and member capacity. Validate both IDs, find whether the copy has an active loan, and check the member's active count. Create the due time from the injected clock, then store the loan and update the copy and member indexes atomically.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Librarian", "Library", "Copy + member checks", "Loan"], "sources": ["S07"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Library lending system", "step": 7, "slug": "library"}, {"id": "L176", "number": 176, "module": "P11", "title": "Read the core Java logic", "idea": "The companion keeps history and active indexes behind one Library monitor. Due-time construction and predictable validation occur before mutation. A title search service can be independent of the checkout consistency owner.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "synchronized LoanView checkout(String member,\n                               String copy) {\n    requireKnown(member, copy);\n    requireCopyFree(copy);\n    requireBelowLimit(member);\n    Loan loan = createLoan(member, copy, clock.instant());\n    activeByCopy.put(copy, loan.id());\n    loans.put(loan.id(), loan);\n    incrementActiveCount(member);\n    return view(loan);\n}", "gotcha": "A maintained count must match active loans.", "question": "What must match incrementActiveCount?", "options": ["The shelf count only", "The actual set of active loans", "The number of all historical titles"], "answer": 1, "explanation": "The actual set of active loans. The companion keeps history and active indexes behind one Library monitor. Due-time construction and predictable validation occur before mutation. A title search service can be independent of the checkout consistency owner.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S07"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Library lending system", "step": 8, "slug": "library"}, {"id": "L177", "number": 177, "module": "P11", "title": "Handle races and failure", "idea": "Two librarians can both observe a copy as free unless checkout is atomic. Member limits also span multiple copies, so locking only the requested copy is insufficient for simultaneous checkouts by the same member. A coarse library lock is the clear baseline.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Per-copy locks alone cannot enforce a member-wide limit.", "question": "Why are per-copy locks insufficient by themselves?", "options": ["Two different copies can exceed one member's limit", "Copies can never be locked", "Members have no state"], "answer": 0, "explanation": "Two different copies can exceed one member's limit. Two librarians can both observe a copy as free unless checkout is atomic. Member limits also span multiple copies, so locking only the requested copy is insufficient for simultaneous checkouts by the same member. A coarse library lock is the clear baseline.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S07"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Library lending system", "step": 9, "slug": "library"}, {"id": "L178", "number": 178, "module": "P11", "title": "Build the test plan", "idea": "Two copies of the same title can be lent independently.\nTwo contenders for one copy produce one active loan.\nA member at the limit is rejected without reserving the copy.\nA stale repeated return never closes a newer loan for that copy.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test old-return replay after the copy has been borrowed again.", "question": "Which stale-operation test matters?", "options": ["Only search by author", "Only register a member", "Return an old loan after the copy is lent again"], "answer": 2, "explanation": "Return an old loan after the copy is lent again. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S07"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Library lending system", "step": 10, "slug": "library"}, {"id": "L179", "number": 179, "module": "P11", "title": "Change one requirement", "idea": "Add a FIFO reservation queue per title. Returning a copy can make it HELD for the next eligible member rather than immediately available. Introduce hold expiry and eligibility rechecks; do not silently reuse the old availability semantics.", "mental": "Maintaining per-member counts makes limit checks fast but adds an invariant with loan history. Scanning active loans is simpler for small data and costs O(L). Choose one representation and test its consistency.", "code": "", "gotcha": "Reservation queues introduce a HELD state.", "question": "What state can a reservation queue introduce?", "options": ["Always AVAILABLE", "HELD for an eligible next member", "Permanently RETURNED"], "answer": 1, "explanation": "HELD for an eligible next member. Add a FIFO reservation queue per title. Returning a copy can make it HELD for the next eligible member rather than immediately available. Introduce hold expiry and eligibility rechecks; do not silently reuse the old availability semantics.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S07"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Library lending system", "step": 11, "slug": "library"}, {"id": "L180", "number": 180, "module": "P11", "title": "Defend the design", "idea": "The central modeling distinction is title versus physical copy. The central atomic rule includes both copy availability and member capacity. I retain loan identity so retried returns cannot act on a later loan.", "mental": "C copies, M members and L retained loans. Indexed checkout/return are expected O(1), excluding returned-list creation. Active-loan listing is O(L) in a simple history scan; storage O(C + M + L).", "code": "", "gotcha": "Unbounded retained history needs an archival policy outside the toy run.", "question": "What is the cost of scanning loan history for a member?", "options": ["O(L)", "Always O(1)", "O(C squared) regardless of history"], "answer": 0, "explanation": "O(L). Maintaining per-member counts makes limit checks fast but adds an invariant with loan history. Scanning active loans is simpler for small data and costs O(L). Choose one representation and test its consistency.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S07"], "level": "Core", "detail": "Maintaining per-member counts makes limit checks fast but adds an invariant with loan history. Scanning active loans is simpler for small data and costs O(L). Choose one representation and test its consistency.", "kind": "step-12", "problem": "Library lending system", "step": 12, "slug": "library"}, {"id": "L181", "number": 181, "module": "P12", "title": "Problem statement and scope", "idea": "Design an expense-sharing core. A payer records a positive expense for a group of unique members. Allocate exact integer minor-unit shares and update each member's net balance. Support equal splitting first, with deterministic remainder allocation.", "mental": "One currency per ledger, one payer per expense, integer minor units, in-memory atomic posting and request-ID deduplication. No real transfers, currency exchange or proof of a minimum-number-of-payments settlement.", "code": "", "gotcha": "This is an accounting exercise, not a money-transfer service.", "question": "What does a positive net balance mean?", "options": ["The member owes money", "The expense was rejected", "The member is owed money"], "answer": 2, "explanation": "The member is owed money. Does the payer participate in the split? Yes in this baseline. What does a positive balance mean? The member is owed money. How are remainder units assigned? To earlier members in a documented deterministic order.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Core", "detail": "Does the payer participate in the split? Yes in this baseline. What does a positive balance mean? The member is owed money. How are remainder units assigned? To earlier members in a documented deterministic order.", "kind": "step-1", "problem": "Expense sharing and settlement", "step": 1, "slug": "splitwise"}, {"id": "L182", "number": 182, "module": "P12", "title": "Work through one example", "idea": "A pays 100 for members [A,B,C]. Equal shares are [34,33,33]. A receives +100 for paying and -34 for consumption, so A=+66, B=-33 and C=-33. Total net balance remains zero.", "mental": "A's balance is not +100 because A consumed a share too. A settlement of 33 from B to A moves B to zero and A to +33; it does not create a second expense.", "code": "", "gotcha": "The payer also owes their own consumption share.", "question": "What is A's balance after paying 100 for A,B,C?", "options": ["-34", "+66", "+100"], "answer": 1, "explanation": "+66. A's balance is not +100 because A consumed a share too. A settlement of 33 from B to A moves B to zero and A to +33; it does not create a second expense.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Caller", "Split policy", "Validate conservation", "Post balances"], "sources": [], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Expense sharing and settlement", "step": 2, "slug": "splitwise"}, {"id": "L183", "number": 183, "module": "P12", "title": "Write the invariants", "idea": "Shares are nonnegative and sum exactly to the expense amount.\nEvery posted expense changes total net balances by zero.\nA request ID identifies one immutable expense payload and is posted at most once.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Dropping a remainder loses money in the model.", "question": "What must every expense preserve?", "options": ["The sum of net balances remains zero", "Every member balance stays positive", "Every share is exactly equal even with a remainder"], "answer": 0, "explanation": "The sum of net balances remains zero. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Expense sharing and settlement", "step": 3, "slug": "splitwise"}, {"id": "L184", "number": 184, "module": "P12", "title": "Choose objects and ownership", "idea": "ExpenseService: validates and atomically posts an expense.\nSplitPolicy: produces member-to-share allocation.\nExpense: immutable payer, amount, ordered participants and shares.\nBalanceLedger: net amount owed to or by each member.\nSettlement: a separate payment acknowledgement between two members.", "mental": "The central consistency owner in this design is ExpenseService. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A split policy computes shares; it should not independently persist balances.", "question": "Who posts all member effects together?", "options": ["SplitPolicy", "ExpenseView", "ExpenseService"], "answer": 2, "explanation": "ExpenseService. ExpenseService has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["ExpenseService", "SplitPolicy", "Expense", "BalanceLedger"], "sources": [], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Expense sharing and settlement", "step": 4, "slug": "splitwise"}, {"id": "L185", "number": 185, "module": "P12", "title": "Design the public API", "idea": "Reject duplicate participants, an absent payer, nonpositive amounts and conflicting request-ID reuse. Snapshot balances without exposing the mutable ledger. A settlement request needs its own identity and validation rather than reusing expense semantics.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "ExpenseView addEqual(String requestId, String payer,\n    long amount, List<String> members);\nMap<String, Long> balances();", "gotcha": "List order affects this deterministic remainder policy.", "question": "What happens on same ID with a different amount?", "options": ["Return success while changing old history", "Reject conflicting reuse", "Post it as another expense"], "answer": 1, "explanation": "Reject conflicting reuse. Reject duplicate participants, an absent payer, nonpositive amounts and conflicting request-ID reuse. Snapshot balances without exposing the mutable ledger. A settlement request needs its own identity and validation rather than reusing expense semantics.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Expense sharing and settlement", "step": 5, "slug": "splitwise"}, {"id": "L186", "number": 186, "module": "P12", "title": "Draw the state machine", "idea": "Posted expenses are immutable history. A correction creates a clearly linked reversal and replacement in an extended model, rather than silently editing past balance effects. A successful identical retry returns the prior expense.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Editing a posted expense silently destroys an audit trail.", "question": "How should a posted expense correction be modeled?", "options": ["An explicit linked reversal or replacement workflow", "Silently mutate the historical record", "Delete all group balances"], "answer": 0, "explanation": "An explicit linked reversal or replacement workflow. Posted expenses are immutable history. A correction creates a clearly linked reversal and replacement in an extended model, rather than silently editing past balance effects. A successful identical retry returns the prior expense.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["DRAFT", "VALIDATED SHARES", "POSTED", "REPLAYED / REVERSED"], "sources": [], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Expense sharing and settlement", "step": 6, "slug": "splitwise"}, {"id": "L187", "number": 187, "module": "P12", "title": "Trace the key operation", "idea": "Validate the request and check deduplication. Compute shares with quotient and remainder. Build all resulting balances in a temporary plan with overflow checks. Commit the new balances and expense history together only after the complete plan is valid.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Validate all resulting balances for overflow before committing.", "question": "Why build a balance plan first?", "options": ["To guarantee constant memory", "To avoid checking membership", "To catch validation and overflow before live mutation"], "answer": 2, "explanation": "To catch validation and overflow before live mutation. Validate the request and check deduplication. Compute shares with quotient and remainder. Build all resulting balances in a temporary plan with overflow checks. Commit the new balances and expense history together only after the complete plan is valid.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Caller", "Split policy", "Validate conservation", "Post balances"], "sources": [], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Expense sharing and settlement", "step": 7, "slug": "splitwise"}, {"id": "L188", "number": 188, "module": "P12", "title": "Read the core Java logic", "idea": "next is a private plan, not live shared state. Applying the payer's net effect avoids a temporary arithmetic overflow that a separate debit then credit could create. Participant order determines remainder units and is part of request identity.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "long base = amount / members.size();\nlong rest = amount % members.size();\nfor (int i = 0; i < members.size(); i++) {\n    String member = members.get(i);\n    long share = base + (i < rest ? 1 : 0);\n    long delta = member.equals(payer) ? amount-share : -share;\n    next.merge(member, delta, Math::addExact);\n}\n// Commit next and the request result together.", "gotcha": "The sketch must operate on a plan, not a half-mutated live ledger.", "question": "Which shares sum to 100 under this rule?", "options": ["34,34,34", "34,33,33", "33,33,33"], "answer": 1, "explanation": "34,33,33. next is a private plan, not live shared state. Applying the payer's net effect avoids a temporary arithmetic overflow that a separate debit then credit could create. Participant order determines remainder units and is part of request identity.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Expense sharing and settlement", "step": 8, "slug": "splitwise"}, {"id": "L189", "number": 189, "module": "P12", "title": "Handle races and failure", "idea": "Two concurrent expenses touch several balances. One service lock is a valid in-memory baseline. Independent ConcurrentHashMap.merge calls do not make a multi-member posting atomic. A retry with the same ID and changed amount must be rejected.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Per-member atomic increments do not create one atomic expense.", "question": "Why not independently merge each member into shared state?", "options": ["The whole expense would not be atomic", "Maps cannot hold signed values", "Hashing changes currency"], "answer": 0, "explanation": "The whole expense would not be atomic. Two concurrent expenses touch several balances. One service lock is a valid in-memory baseline. Independent ConcurrentHashMap.merge calls do not make a multi-member posting atomic. A retry with the same ID and changed amount must be rejected.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Expense sharing and settlement", "step": 9, "slug": "splitwise"}, {"id": "L190", "number": 190, "module": "P12", "title": "Build the test plan", "idea": "100 split three ways produces 34,33,33.\nFor many amounts, shares sum exactly to the amount.\nTotal net balances remain zero after every expense.\nAn identical retry changes nothing; conflicting reuse is rejected.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Check the sum after a long sequence, not just one expense.", "question": "What broad property should tests assert?", "options": ["Only that a receipt prints", "Only that names are unique", "Conservation across many amounts and expenses"], "answer": 2, "explanation": "Conservation across many amounts and expenses. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Expense sharing and settlement", "step": 10, "slug": "splitwise"}, {"id": "L191", "number": 191, "module": "P12", "title": "Change one requirement", "idea": "Add exact or weighted shares behind SplitPolicy, then validate their sum and membership at the service boundary. A greedy debtor-creditor matcher can produce a valid settlement suggestion but does not generally prove a globally minimum number of transfers.", "mental": "Net balances are compact but lose who originally owed whom. Keep immutable expense history for explanation and corrections. Pairwise balances retain more relationship detail but use more state and do not remove conservation requirements.", "code": "", "gotcha": "Greedy debt simplification is not a general minimum-transfer proof.", "question": "Does a greedy settlement always minimize transfers?", "options": ["Only because the currency is fixed", "No; it is not a general optimality proof", "Yes, by definition"], "answer": 1, "explanation": "No; it is not a general optimality proof. Add exact or weighted shares behind SplitPolicy, then validate their sum and membership at the service boundary. A greedy debtor-creditor matcher can produce a valid settlement suggestion but does not generally prove a globally minimum number of transfers.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Expense sharing and settlement", "step": 11, "slug": "splitwise"}, {"id": "L192", "number": 192, "module": "P12", "title": "Defend the design", "idea": "I define the balance sign and remainder rule before classes. The important correctness properties are conservation and retry identity. I do not confuse a valid settlement heuristic with an optimal-transfer proof.", "mental": "P participants and M members: O(P) share planning; the simple companion copies the balance map, making posting O(M + P). O(M + E*P) retained storage across E expenses with participant history.", "code": "", "gotcha": "Net balances alone cannot explain individual expense history.", "question": "What does net-only storage lose?", "options": ["The explanation of individual original expenses", "The ability to add integers", "The currency unit automatically"], "answer": 0, "explanation": "The explanation of individual original expenses. Net balances are compact but lose who originally owed whom. Keep immutable expense history for explanation and corrections. Pairwise balances retain more relationship detail but use more state and do not remove conservation requirements.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Core", "detail": "Net balances are compact but lose who originally owed whom. Keep immutable expense history for explanation and corrections. Pairwise balances retain more relationship detail but use more state and do not remove conservation requirements.", "kind": "step-12", "problem": "Expense sharing and settlement", "step": 12, "slug": "splitwise"}, {"id": "L193", "number": 193, "module": "P13", "title": "Problem statement and scope", "idea": "Design a booking calendar for named meeting rooms. A request supplies a room, organizer, start and end. Accept the booking only when its half-open time range does not overlap another active booking in that room. Support cancellation.", "mental": "One location, Instant endpoints, known rooms and no recurring meetings. Room capacity and equipment filtering are extensions. Cancellation is by booking ID and is idempotent in the core.", "code": "", "gotcha": "A calendar UI does not guarantee atomic booking.", "question": "Can [10,11) and [11,12) share one room?", "options": ["No", "Only after cancellation", "Yes"], "answer": 2, "explanation": "Yes. Can meetings touch at an endpoint? Yes. Are empty intervals allowed? No. Can different rooms be booked at the same time? Yes. Are conflicts checked at request time? Yes; search results are only advisory.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S07"], "level": "Core", "detail": "Can meetings touch at an endpoint? Yes. Are empty intervals allowed? No. Can different rooms be booked at the same time? Yes. Are conflicts checked at request time? Yes; search results are only advisory.", "kind": "step-1", "problem": "Meeting-room booking", "step": 1, "slug": "meeting"}, {"id": "L194", "number": 194, "module": "P13", "title": "Work through one example", "idea": "R1 has [10:00,11:00). A request for [11:00,12:00) succeeds. A request for [10:30,11:30) fails. The same overlapping range in R2 can succeed. Cancel the first booking and its interval no longer blocks R1.", "mental": "The overlap formula uses strict less-than comparisons. Equality at an end/start boundary does not create a conflict under [start,end) semantics.", "code": "", "gotcha": "Endpoint equality is allowed under the chosen half-open rule.", "question": "Does [10:30,11:30) conflict with [10,11)?", "options": ["Only in another room", "Yes", "No"], "answer": 1, "explanation": "Yes. The overlap formula uses strict less-than comparisons. Equality at an end/start boundary does not create a conflict under [start,end) semantics.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Organizer", "CalendarService", "Overlap check", "Booking"], "sources": ["S07"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Meeting-room booking", "step": 2, "slug": "meeting"}, {"id": "L195", "number": 195, "module": "P13", "title": "Write the invariants", "idea": "Every active booking has start < end.\nActive ranges for the same room do not overlap.\nCancellation removes only the referenced active booking, at most once.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Checking only whether the new start lies inside misses enclosing intervals.", "question": "Which condition is mandatory?", "options": ["start is before end", "start equals end", "All meetings use one room"], "answer": 0, "explanation": "start is before end. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S07"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Meeting-room booking", "step": 3, "slug": "meeting"}, {"id": "L196", "number": 196, "module": "P13", "title": "Choose objects and ownership", "idea": "CalendarService: owns booking and cancellation decisions.\nRoom: stable ID and descriptive metadata.\nTimeRange: validated immutable endpoints and overlaps method.\nBooking: ID, room, organizer, range and status.\nRoomCalendar: optional per-room active interval index.", "mental": "The central consistency owner in this design is CalendarService. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A TimeRange cannot see other bookings by itself.", "question": "Who owns conflict check plus insertion?", "options": ["TimeRange", "Room metadata", "CalendarService"], "answer": 2, "explanation": "CalendarService. CalendarService has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["CalendarService", "Room", "TimeRange", "Booking"], "sources": ["S07"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Meeting-room booking", "step": 4, "slug": "meeting"}, {"id": "L197", "number": 197, "module": "P13", "title": "Design the public API", "idea": "Validate room and organizer IDs, construct a valid range, and check overlap at the commit boundary. An earlier findAvailableRooms call does not reserve anything. Return a snapshot and keep cancellation history.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "BookingView book(String room, String organizer,\n    Instant start, Instant end);\nBookingView cancel(String bookingId);", "gotcha": "An availability response is not a hold.", "question": "Does a search result reserve the room?", "options": ["Only if displayed in green", "No", "Yes forever"], "answer": 1, "explanation": "No. Validate room and organizer IDs, construct a valid range, and check overlap at the commit boundary. An earlier findAvailableRooms call does not reserve anything. Return a snapshot and keep cancellation history.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S07"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Meeting-room booking", "step": 5, "slug": "meeting"}, {"id": "L198", "number": 198, "module": "P13", "title": "Draw the state machine", "idea": "There is no temporary hold in this baseline: booking commits immediately. Cancellation marks history and removes the range from active conflict checking. Rebooking creates a new booking ID rather than reviving an old cancelled object.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Cancelled history must not block future bookings.", "question": "Should cancelled ranges remain conflict-active?", "options": ["No", "Yes", "Only for the original organizer"], "answer": 0, "explanation": "No. There is no temporary hold in this baseline: booking commits immediately. Cancellation marks history and removes the range from active conflict checking. Rebooking creates a new booking ID rather than reviving an old cancelled object.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["REQUESTED", "CONFIRMED", "CANCELLED", "HISTORICAL"], "sources": ["S07"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Meeting-room booking", "step": 6, "slug": "meeting"}, {"id": "L199", "number": 199, "module": "P13", "title": "Trace the key operation", "idea": "Under the calendar owner's lock, validate the room, scan active bookings in that room and reject any overlapping range. If none conflicts, create the ID and insert the booking. Cancellation changes status under the same boundary.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Do not release the lock between conflict scan and insertion.", "question": "What must be atomic?", "options": ["Only formatting time", "Only generating an ID", "Conflict scan and booking insertion"], "answer": 2, "explanation": "Conflict scan and booking insertion. Under the calendar owner's lock, validate the room, scan active bookings in that room and reject any overlapping range. If none conflicts, create the ID and insert the booking. Cancellation changes status under the same boundary.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Organizer", "CalendarService", "Overlap check", "Booking"], "sources": ["S07"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Meeting-room booking", "step": 7, "slug": "meeting"}, {"id": "L200", "number": 200, "module": "P13", "title": "Read the core Java logic", "idea": "The formula catches partial overlap, full containment and identical ranges. It also permits adjacency. A per-room scan is an intentional baseline, not an interval-tree claim.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "boolean overlaps(Booking b, Instant start, Instant end) {\n    return b.active()\n        && b.start().isBefore(end)\n        && start.isBefore(b.end());\n}\n// Scan + insert must be one atomic operation.", "gotcha": "Use strict comparisons for half-open overlap.", "question": "Which formula is correct for half-open overlap?", "options": ["a.end < b.start", "a.start < b.end and b.start < a.end", "a.start <= b.end only"], "answer": 1, "explanation": "a.start < b.end and b.start < a.end. The formula catches partial overlap, full containment and identical ranges. It also permits adjacency. A per-room scan is an intentional baseline, not an interval-tree claim.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S07"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Meeting-room booking", "step": 8, "slug": "meeting"}, {"id": "L201", "number": 201, "module": "P13", "title": "Handle races and failure", "idea": "Two requesters can both observe a free room before inserting. Protect scan-and-insert together. With per-room locks, bookings of different rooms can proceed independently; operations involving several rooms require ordered multi-room coordination or a larger boundary.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Per-room locks need a new plan for multi-room bookings.", "question": "What does a per-room lock permit?", "options": ["Independent mutations for different rooms", "Uncoordinated multi-room transactions", "Automatic cross-server locking"], "answer": 0, "explanation": "Independent mutations for different rooms. Two requesters can both observe a free room before inserting. Protect scan-and-insert together. With per-room locks, bookings of different rooms can proceed independently; operations involving several rooms require ordered multi-room coordination or a larger boundary.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S07"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Meeting-room booking", "step": 9, "slug": "meeting"}, {"id": "L202", "number": 202, "module": "P13", "title": "Build the test plan", "idea": "Adjacent intervals are accepted.\nContained and enclosing intervals are rejected.\nDifferent rooms allow identical times.\nCancel then rebook succeeds, and repeated cancel does not affect the replacement.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test a new interval that fully encloses an existing one.", "question": "Which case catches a common bad formula?", "options": ["A booking in an empty calendar", "Two unrelated room names", "A new interval fully contains an old interval"], "answer": 2, "explanation": "A new interval fully contains an old interval. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S07"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Meeting-room booking", "step": 10, "slug": "meeting"}, {"id": "L203", "number": 203, "module": "P13", "title": "Change one requirement", "idea": "Recurring meetings require expanding or representing occurrences with a time zone, daylight-saving policy and exception dates. Decide all-or-nothing versus partial series acceptance. Do not model recurrence as adding 24 hours to every local day.", "mental": "A list is easy to verify. For already-nonoverlapping intervals sorted by start time, predecessor/successor checks can be enough for single-resource insertion. General interval queries and recurrence require more careful indexing.", "code": "", "gotcha": "A local daily recurrence is not always exactly 24 elapsed hours.", "question": "What must recurrence specify?", "options": ["Only a longer booking ID", "Time zone, exceptions and partial-versus-atomic acceptance", "Only the weekday label"], "answer": 1, "explanation": "Time zone, exceptions and partial-versus-atomic acceptance. Recurring meetings require expanding or representing occurrences with a time zone, daylight-saving policy and exception dates. Decide all-or-nothing versus partial series acceptance. Do not model recurrence as adding 24 hours to every local day.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S07"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Meeting-room booking", "step": 11, "slug": "meeting"}, {"id": "L204", "number": 204, "module": "P13", "title": "Defend the design", "idea": "My core uses one explicit endpoint convention and one atomic conflict check. I demonstrate adjacency and containment tests. Recurrence is separate because it changes both time modeling and the scope of an atomic request.", "mental": "B retained bookings: simple scan O(B) per book; expected O(1) ID cancellation. Per-room indexes reduce the scanned set; storage O(B + R).", "code": "", "gotcha": "An interval tree is not required to solve a tiny in-memory prompt.", "question": "Why start with a list scan?", "options": ["It makes a correct baseline easy to inspect", "It gives O(1) arbitrary overlap queries", "It removes the need for tests"], "answer": 0, "explanation": "It makes a correct baseline easy to inspect. A list is easy to verify. For already-nonoverlapping intervals sorted by start time, predecessor/successor checks can be enough for single-resource insertion. General interval queries and recurrence require more careful indexing.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S07"], "level": "Core", "detail": "A list is easy to verify. For already-nonoverlapping intervals sorted by start time, predecessor/successor checks can be enough for single-resource insertion. General interval queries and recurrence require more careful indexing.", "kind": "step-12", "problem": "Meeting-room booking", "step": 12, "slug": "meeting"}, {"id": "L205", "number": 205, "module": "P14", "title": "Problem statement and scope", "idea": "Design assigned-seat booking for one show. A user holds one or more seats for a short duration, then confirms before expiry. A hold is all-or-nothing. A seat cannot belong to two live holds or confirmed bookings at once.", "mental": "One show, an injected clock, atomic multi-seat holds and in-memory confirmation. Payment is a separate external boundary; the core does not claim to charge a card or atomically commit a remote charge.", "code": "", "gotcha": "A payment-success flag does not implement a payment protocol.", "question": "Is a multi-seat hold partial in this contract?", "options": ["Yes; whichever seats were free", "Only for premium seats", "No; all seats or none"], "answer": 2, "explanation": "No; all seats or none. Can a hold contain several seats? Yes, atomically. Is expiresAt itself valid? No: live means now < expiresAt. May another user confirm a hold? No. Does confirmation retry return the same result? Yes.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S07"], "level": "Deep", "detail": "Can a hold contain several seats? Yes, atomically. Is expiresAt itself valid? No: live means now < expiresAt. May another user confirm a hold? No. Does confirmation retry return the same result? Yes.", "kind": "step-1", "problem": "Movie-seat holds and confirmation", "step": 1, "slug": "seats"}, {"id": "L206", "number": 206, "module": "P14", "title": "Work through one example", "idea": "At t=0, Ana holds A1 and A2 until t=5. Ben cannot hold A2 at t=4. At exactly t=5, Ana cannot confirm. Ben can now claim A2. An old expiry task for Ana must not release Ben's new hold.", "mental": "Seat ownership includes the hold ID, not just HELD status. Expiry is a logical rule checked by operations; a cleanup task may remove expired storage later.", "code": "", "gotcha": "Expiry at the exact deadline is rejected in this contract.", "question": "Can Ana confirm at t=5 when expiresAt=5?", "options": ["Only after Ben tries", "No", "Yes"], "answer": 1, "explanation": "No. Seat ownership includes the hold ID, not just HELD status. Expiry is a logical rule checked by
