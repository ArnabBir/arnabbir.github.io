 transition", "No new state"], "answer": 1, "explanation": "Vote identity and one-time quorum transition. Add parallel approvals with a quorum. Each approver vote needs identity and deduplication, and the quorum transition must occur once. Define rejection precedence and what late votes mean after the workflow becomes terminal.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Deep", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Multi-step approval workflow", "step": 11, "slug": "approval"}, {"id": "L408", "number": 408, "module": "P30", "title": "Defend the design", "idea": "I anchor every decision to a step and version, not a vague pending status. The model captures policy and submitted facts so later changes do not rewrite history. Parallel quorum logic is a separate extension with new invariants.", "mental": "S steps and D decisions: O(S) submission policy capture, expected O(1) sequential decision checks, O(D) history snapshot. Storage O(S + D) per workflow.", "code": "", "gotcha": "A full graph engine may be unnecessary for a sequential workflow.", "question": "Why start with a step list rather than a graph engine?", "options": ["It matches the sequential scope with fewer invariants", "It solves all future workflow graphs", "It removes the need for version checks"], "answer": 0, "explanation": "It matches the sequential scope with fewer invariants. An explicit step list is easy to inspect for sequential approval. A generic workflow graph supports branches but needs cycle handling, join semantics and richer validation. Introduce that machinery only when requirements justify it.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Deep", "detail": "An explicit step list is easy to inspect for sequential approval. A generic workflow graph supports branches but needs cycle handling, join semantics and richer validation. Introduce that machinery only when requirements justify it.", "kind": "step-12", "problem": "Multi-step approval workflow", "step": 12, "slug": "approval"}], "modules": [{"id": "F1", "title": "Start with the interview, not the diagram", "description": "A repeatable path from an ambiguous prompt to a small, defensible design.", "kind": "foundation"}, {"id": "F2", "title": "Java objects that protect their own rules", "description": "Identity, value objects, encapsulation and small APIs without framework ceremony.", "kind": "foundation"}, {"id": "F3", "title": "Design principles and patterns by need", "description": "Use a pattern when it removes a concrete source of change or confusion.", "kind": "foundation"}, {"id": "F4", "title": "Correctness, testing and design defense", "description": "The shared tools behind booking, inventory, money, retries and honest extension discussions.", "kind": "foundation"}, {"id": "P01", "title": "Parking lot", "description": "Design the in-memory core of a parking lot. A vehicle enters, receives a ticket for a compatible free spot, and later exits. Reject an entry when no suitable spot is free. The same active vehicle must not be parked twice.", "kind": "problem"}, {"id": "P02", "title": "Vending machine", "description": "Design a vending machine that accepts integer-value credit, selects an in-stock product, dispenses one item and returns any remaining credit. A user may cancel before purchase. Start with a software-only dispenser whose success is immediate.", "kind": "problem"}, {"id": "P03", "title": "Tic-tac-toe", "description": "Design a two-player n-by-n tic-tac-toe game. Players alternate placing marks in empty cells. A full row, column or main diagonal of one mark wins. Reject out-of-turn moves, occupied cells and moves after the game ends.", "kind": "problem"}, {"id": "P04", "title": "Snakes and ladders", "description": "Design a turn-based snakes-and-ladders game with an injected die. A player moves by the roll, follows the configured jump at the landing square, and wins by reaching the final square exactly. Players begin at square zero outside the board.", "kind": "problem"}, {"id": "P05", "title": "Chess move-validation core", "description": "Design the object model and validation pipeline for a two-player chess game. A player requests a move, the game validates turn and legality, applies it, and returns a new view. Distinguish a piece's movement shape from whether the move leaves its own king in check.", "kind": "problem"}, {"id": "P06", "title": "LRU cache", "description": "Design a generic bounded in-memory cache with get and put. When a new entry exceeds capacity, evict the least recently used entry. A successful get and an update of an existing key both count as use. Reject null keys and values in this workshop.", "kind": "problem"}, {"id": "P07", "title": "LFU cache with recency tie-break", "description": "Design a fixed-capacity least-frequently-used cache. Every successful get and update increases the entry's frequency. When capacity is exceeded, evict the lowest-frequency entry; among equal frequencies evict the least recently used.", "kind": "problem"}, {"id": "P08", "title": "Token-bucket rate limiter", "description": "Design an in-process token bucket. The bucket holds up to C tokens and refills at R tokens per second. Each accepted request spends one token. Requests without enough tokens are rejected immediately rather than queued.", "kind": "problem"}, {"id": "P09", "title": "Extensible logging library", "description": "Design a logger supporting levels, formatting and multiple output sinks. A log call below the threshold is ignored. Accepted events carry an event timestamp, level and immutable message data and are sent to configured sinks.", "kind": "problem"}, {"id": "P10", "title": "In-memory publish-subscribe bus", "description": "Design a topic-based event bus. Clients subscribe callbacks, publish immutable events and unsubscribe using a returned token. One publication delivers to a snapshot of the subscribers present when that snapshot is taken.", "kind": "problem"}, {"id": "P11", "title": "Library lending system", "description": "Design a library core that lends physical copies of books to members and records returns. Several copies may share a title. Enforce a maximum number of active loans per member and prevent a copy from being lent to two members at once.", "kind": "problem"}, {"id": "P12", "title": "Expense sharing and settlement", "description": "Design an expense-sharing core. A payer records a positive expense for a group of unique members. Allocate exact integer minor-unit shares and update each member's net balance. Support equal splitting first, with deterministic remainder allocation.", "kind": "problem"}, {"id": "P13", "title": "Meeting-room booking", "description": "Design a booking calendar for named meeting rooms. A request supplies a room, organizer, start and end. Accept the booking only when its half-open time range does not overlap another active booking in that room. Support cancellation.", "kind": "problem"}, {"id": "P14", "title": "Movie-seat holds and confirmation", "description": "Design assigned-seat booking for one show. A user holds one or more seats for a short duration, then confirms before expiry. A hold is all-or-nothing. A seat cannot belong to two live holds or confirmed bookings at once.", "kind": "problem"}, {"id": "P15", "title": "Hotel room-type inventory", "description": "Design hotel reservations sold by room type across a date range. A guest requests one room of a type for check-in through check-out. Every occupied night must have enough capacity, and the multi-night reservation succeeds atomically.", "kind": "problem"}, {"id": "P16", "title": "Vehicle rental and availability", "description": "Design reservations for individually identified rental vehicles. A customer selects a vehicle and a time range, receives a confirmed reservation, then checks out and returns it. Overlapping active reservations for the same vehicle are rejected.", "kind": "problem"}, {"id": "P17", "title": "Elevator controller and dispatch", "description": "Design a small elevator simulation. Riders submit hall requests with floor and desired direction; passengers submit car destination requests. A controller chooses which car handles a hall request. Each car moves one floor per simulation tick and opens only at a stop.", "kind": "problem"}, {"id": "P18", "title": "ATM withdrawal workflow", "description": "Design the software workflow for a cash withdrawal: authenticate a session, validate an amount, obtain account authorization, plan available notes and coordinate dispensing. Treat bank calls and physical cash movement as separate effects with uncertain outcomes.", "kind": "problem"}, {"id": "P19", "title": "In-memory file system and search", "description": "Design an in-memory hierarchical file system with directories and text files. Support creating paths, reading and appending file content, listing a directory and searching by name or size. Keep path traversal separate from search predicates.", "kind": "problem"}, {"id": "P20", "title": "Text editor with undo and redo", "description": "Design a single-document text editor with insert, delete, undo and redo. Each successful edit is one history entry. Undo restores the prior text; redo reapplies the undone edit. A new edit after undo discards the abandoned redo branch.", "kind": "problem"}, {"id": "P21", "title": "Dependency-aware task scheduler", "description": "Design an in-process scheduler for a fixed directed acyclic graph of jobs. A job becomes ready after all of its prerequisites succeed. Ready jobs can run concurrently. Record success, failure and cancellation, and avoid scheduling a job twice.", "kind": "problem"}, {"id": "P22", "title": "Notification delivery service", "description": "Design a service that accepts a notification request, chooses email/SMS/push delivery adapters, respects user preferences and records an attempt outcome. Keep a logical notification separate from its delivery attempts.", "kind": "problem"}, {"id": "P23", "title": "Inventory reservation service", "description": "Design a stock service that reserves positive quantities of a SKU, confirms a reservation when sold, and releases it when cancelled. Distinguish on-hand stock, reserved stock and available stock. Repeated cancellation must never create extra inventory.", "kind": "problem"}, {"id": "P24", "title": "In-memory wallet transfer ledger", "description": "Design a teaching ledger that transfers integer minor units between existing wallets in one currency. A transfer must debit one wallet and credit the other atomically, reject insufficient funds and make successful retries idempotent by request ID.", "kind": "problem"}, {"id": "P25", "title": "Food ordering and order lifecycle", "description": "Design a restaurant ordering core. A customer builds a cart from a menu, submits an order with a price snapshot, and follows acceptance, preparation and delivery states. Keep menu edits separate from the historical order.", "kind": "problem"}, {"id": "P26", "title": "Ride dispatch and driver assignment", "description": "Design a ride-request core that assigns one available driver to one waiting rider. A matching policy chooses a candidate using driver snapshots, but the assignment operation must atomically claim the driver and update the trip.", "kind": "problem"}, {"id": "P27", "title": "Parcel locker allocation", "description": "Design a parcel-locker system. A courier deposits a parcel into a compatible free compartment. The recipient receives a pickup token and uses it to release the correct parcel. A token must not open a newer parcel's compartment after its original pickup.", "kind": "problem"}, {"id": "P28", "title": "Ten-pin bowling scorecard", "description": "Design a standard ten-pin scorecard for ten frames. Record rolls in order and compute scores only when required bonus rolls are known. Strikes and spares create obligations to include later rolls. Validate legal roll sequences, especially frame ten.", "kind": "problem"}, {"id": "P29", "title": "Shopping-cart pricing and coupons", "description": "Design a deterministic pricing engine for an immutable cart snapshot. Compute line totals, apply eligible coupons in an explicit order and return a quote with a breakdown. Keep pricing calculation separate from consuming a limited-use coupon.", "kind": "problem"}, {"id": "P30", "title": "Multi-step approval workflow", "description": "Design a configurable approval workflow for a submitted expense or document. A policy produces ordered approval steps. Only the authorized approver for the current step can approve or reject. Preserve decisions and policy version for an audit trail.", "kind": "problem"}], "problems": [{"slug": "parking", "title": "Parking lot", "level": "Core", "brief": "Design the in-memory core of a parking lot. A vehicle enters, receives a ticket for a compatible free spot, and later exits. Reject an entry when no suitable spot is free. The same active vehicle must not be parked twice.", "scope": "One lot, several spot sizes, concurrent gates, integer fee units, and ticket lookup by ID. No reservations, payment network, sensors or multi-server coordination in the core.", "ask": "Can a smaller vehicle use a larger spot? Yes. Can a license plate have two active tickets? No. Is exit retry-safe? Yes: an already-closed ticket returns its recorded receipt.", "example": "There are spots S1(size 1) and S2(size 2). Bike B(size 1) enters and takes S1. Car C(size 2) takes S2. Car D is rejected. B exits; a new bike can now claim S1.", "outcome": "After both accepted entries there are two active tickets and zero free spots. After B exits there is one active ticket. A repeated exit does not free S1 again.", "rules": ["A spot has at most one active ticket.", "Every active ticket references a compatible occupied spot.", "An active vehicle has exactly one active ticket, and closed tickets never release a newer occupant."], "model": ["ParkingLot: owns spots, active plate index and ticket lifecycle.", "Spot: stable ID and capacity; occupancy is controlled by the lot.", "Ticket: entry time, vehicle, assigned spot and optional receipt.", "AllocationPolicy: chooses a compatible candidate without claiming it.", "FeePolicy: computes a quote from validated duration and vehicle."], "owner": "ParkingLot", "peers": ["FeePolicy", "TicketView"], "apis": "Ticket park(String plate, int size);\nReceipt exit(String ticketId);\nList<SpotView> availability();", "api_note": "park succeeds with a new immutable ticket view or rejects without changing occupancy. exit checks ticket status first; an identical retry returns the prior receipt. Availability is advisory, not a reservation.", "states": ["FREE", "OCCUPIED", "EXITED", "FREE AGAIN"], "state_note": "The spot cycles FREE to OCCUPIED to FREE. The ticket has ACTIVE to CLOSED only. These are two related lifecycles, not one shared enum. A closed ticket remembers its result and cannot act on a later occupant.", "flow": ["Gate", "ParkingLot", "Spot + ticket", "Ticket view"], "trace": "Under one lot lock, reject an already-active plate, choose a compatible free spot, create a ticket ID, and update both occupancy and the active-plate index. Publish the ticket only after the owned state agrees. Exit computes a valid fee before releasing the spot.", "code": "synchronized Ticket park(String plate, int size) {\n    requireValid(plate, size);\n    rejectActivePlate(plate);\n    Spot spot = chooseCompatibleFree(size);\n    Ticket ticket = newTicket(plate, spot);\n    occupy(spot, ticket);\n    activeByPlate.put(plate, ticket.id());\n    return ticket;\n}", "code_note": "This is a contextual core sketch. Helper methods are owned by the lot and do not call remote services. Candidate selection and all index changes happen under the same lock. The complete companion uses a simple linear spot scan.", "race": "Two entry gates must not both win the last spot. Synchronizing only Map.put leaves a check-then-act race. Use one lot-level lock in the baseline and keep every access to mutable occupancy behind it. A multi-process version needs a shared ownership mechanism, not more local locks.", "tests": ["Two cars compete for the final compatible spot: exactly one succeeds.", "A vehicle cannot park twice while its first ticket is active.", "Wrong-sized vehicles are rejected without changing indexes.", "Exit twice returns one receipt and does not release a newer occupant."], "extension": "Add electric charging. Model charger capability separately from physical size; extend the compatibility predicate and add a charging-session policy. Do not create an inheritance tree for every size-plus-charger combination.", "tradeoff": "A linear scan is easy to explain and costs O(S). Per-size free-spot indexes can reduce allocation work, but entry and exit must now update those indexes atomically too.", "cost": "S spots, T retained tickets: allocation O(S); ticket lookup expected O(1); storage O(S + T). Ticket retention needs a policy outside an unlimited interview run.", "pitch": "I start with one lot owner because the hard rule spans spots, tickets and active vehicles. I separate selection and pricing policy from ownership. I can demonstrate a concurrent final-spot test and explain exactly what changes for persistence.", "gotchas": ["A parking spot is not a Vehicle subclass.", "A closed ticket must not release the spot twice.", "An accurate-looking availability counter can disagree with the actual spots.", "A policy chooses a candidate; it does not own shared occupancy.", "Returning internal Spot objects exposes mutation.", "Spot state and ticket state are related but not identical.", "Do not publish a ticket before claiming its spot.", "An exception after half the index updates leaves inconsistent state.", "A per-gate lock does not coordinate two gates.", "A race test must collect the losing result too.", "Vehicle size and charger capability are independent dimensions.", "A coarse lock favors simple correctness over maximum parallelism."], "checks": [["Which core request is rejected?", "A second active entry for the same plate", "A retry of a completed exit", "A smaller vehicle using an allowed larger spot"], ["After B exits in the example, how many spots are free?", "One", "Zero", "Two"], ["Which relationship must remain true?", "An active ticket owns a compatible occupied spot", "Every ticket is always active", "Every car always uses the smallest spot"], ["Who owns choose-and-claim?", "ParkingLot", "FeePolicy", "TicketView"], ["Why retain the closed ticket receipt?", "To make an exit retry return the same result", "To make the spot permanently occupied", "To recompute a higher fee on every retry"], ["Can a CLOSED ticket close a new occupant's ticket?", "No", "Yes, if the spot ID matches", "Yes, after one second"], ["When may the ticket be returned?", "After occupancy and indexes agree", "Before a spot is chosen", "After only the display counter changes"], ["What boundary belongs around the code?", "One boundary covering selection and all owned updates", "A separate private lock for each gate", "Only a lock around ID formatting"], ["What prevents two gates taking one spot?", "Atomic lot-level choose-and-claim", "A concurrent map plus separate unchecked writes", "Reading availability earlier"], ["What should two contenders for one spot yield?", "Exactly one success", "Two successful tickets", "Always two failures"], ["Where does charger compatibility belong?", "A capability-aware compatibility rule", "A new copy of the complete lot for every combination", "Ticket receipt formatting"], ["Why begin with a spot scan?", "It is a simple correct baseline with explicit O(S) cost", "It guarantees O(1) allocation", "It removes all synchronization needs"]], "sources": ["S15"], "module": "P01"}, {"slug": "vending", "title": "Vending machine", "level": "Core", "brief": "Design a vending machine that accepts integer-value credit, selects an in-stock product, dispenses one item and returns any remaining credit. A user may cancel before purchase. Start with a software-only dispenser whose success is immediate.", "scope": "One customer session at a time; unlimited logical change; stock and prices supplied at construction. Hardware jams, exact coin inventories, card payments and restocking during a purchase are extensions.", "ask": "Do we need exact coin change? Not in the core. Can a session buy multiple items? Yes, until its credit is spent or refunded. What does a failed selection do? Keep the credit and stock unchanged.", "example": "Tea costs 30 and has stock 2. Insert 20: selection is rejected for insufficient credit. Insert another 20: selection succeeds, stock becomes 1 and credit becomes 10. Cancel returns 10 and clears the session credit.", "outcome": "The rejected purchase does not consume credit or tea. Only the successful purchase decreases stock. A second cancellation returns zero.", "rules": ["Credit and every stock count are nonnegative.", "A successful purchase reduces stock by one and credit by exactly the quoted price.", "A rejected purchase changes neither credit nor stock."], "model": ["Machine: owns the session, inventory and atomic purchase operation.", "Product: SKU, display name and immutable unit price.", "Slot: product plus stock count.", "Receipt: dispensed SKU, charged amount and remaining credit.", "DispenserPort: hardware boundary introduced only for the extension."], "owner": "Machine", "peers": ["Product", "Receipt"], "apis": "void insert(long amount);\nReceipt buy(String sku);\nlong cancel();", "api_note": "Reject nonpositive inserts and overflow. buy returns a receipt only when the in-memory purchase succeeds. cancel refunds the current credit and sets it to zero. Do not expose a public setter for session credit.", "states": ["IDLE", "COLLECTING", "PURCHASE", "COLLECTING / IDLE"], "state_note": "IDLE means no credit. A valid insert leads to COLLECTING. A successful purchase can leave credit, so it may return to COLLECTING rather than IDLE. Cancellation returns to IDLE. In the baseline, dispensing is part of the atomic software operation.", "flow": ["Customer", "Machine", "Validate stock + credit", "Receipt"], "trace": "Find the SKU, check available stock and sufficient credit, compute the new values without overflow, then commit stock and credit together. The response reports the charged amount and remaining credit. A bad SKU is rejected before mutation.", "code": "synchronized Receipt buy(String sku) {\n    Slot slot = requireSlot(sku);\n    if (slot.stock() == 0) throw soldOut();\n    long price = slot.price();\n    if (credit < price) throw insufficient();\n    slot.decrement();\n    credit -= price;\n    return new Receipt(sku, price, credit);\n}", "code_note": "The sketch assumes immutable validated positive prices and no failing hardware call after mutation. That scope is essential. Do not copy it unchanged into a physical machine where dispensing can fail or its outcome can be unknown.", "race": "One machine lock keeps insertion, purchase and cancellation from interleaving halfway through a state change. For hardware, create a vend attempt ID and a DISPENSING state, invoke the port outside the lock, and reconcile a jam or lost reply. A physical effect and an in-memory update are not one transaction.", "tests": ["Insufficient credit leaves both values unchanged.", "Buying the last item succeeds once, then reports sold out.", "Cancel twice refunds credit only once.", "Nonpositive credit and arithmetic overflow are rejected before mutation."], "extension": "Exact coin change introduces a ChangePolicy over the available coin counts. Compute a feasible change plan before committing purchase. A greedy choice is not universally correct for arbitrary denominations and limited inventories.", "tradeoff": "An enum with guarded methods is enough for the small software state machine. A State hierarchy becomes useful when accepting, refunding, dispensing and fault recovery have substantially different behaviors.", "cost": "P product slots: expected O(1) SKU lookup and purchase, O(P) storage. Exact-change planning has a separate problem-size cost determined by its chosen algorithm.", "pitch": "I separate the software model from unreliable hardware. My first implementation proves money and stock conservation under rejection. Then I introduce a dispensing protocol only when the problem actually requires physical uncertainty.", "gotchas": ["Unlimited logical change is an assumption, not a physical claim.", "A failed buy must retain the inserted credit.", "Checking credit after decrementing stock violates failure atomicity.", "Product metadata should not own the whole customer session.", "insert(-5) is not a valid refund API.", "A purchase with leftover credit need not return to IDLE.", "Validate all predictable failures before mutating.", "The code assumes no remote side effect during the atomic operation.", "A successful software decrement does not prove an item physically fell.", "Test cancellation after an insufficient-credit rejection.", "Greedy change can fail with unusual denominations.", "Do not introduce a dozen State classes just to rename enum values."], "checks": [["What is deliberately excluded from the core?", "Exact physical coin inventory", "Positive-price validation", "Insufficient-credit rejection"], ["What credit remains after paying 40 for tea priced 30?", "10", "0", "30"], ["A purchase is rejected. What changes?", "Neither stock nor credit", "Only stock", "Both are cleared"], ["Who owns the credit-and-stock invariant?", "Machine", "Product", "Receipt"], ["What should cancel return on its second call?", "Zero", "The previous refund again", "The last product price"], ["After a buy leaves credit, which state is valid?", "COLLECTING", "Always IDLE", "Permanently DISPENSING"], ["What must happen before stock decreases?", "Stock and credit validation", "Receipt printing only", "Clearing all inserted credit"], ["What assumption makes the tiny buy sketch valid?", "Dispensing is a synchronous software success", "Hardware never fails in reality", "Network payment is exactly once"], ["What does a hardware timeout require?", "A tracked uncertain vend outcome", "An automatic new vend attempt with no ID", "Pretending no item could have dispensed"], ["Which boundary test matters?", "Cancel twice after a purchase with leftover credit", "Only reading the product name", "Only starting an empty application"], ["What does exact change add?", "A feasible coin-allocation plan", "Only a new display label", "No new correctness rules"], ["When is a State hierarchy useful?", "When state-specific behavior becomes substantial", "Whenever an enum has two members", "Only to increase class count"]], "module": "P02"}, {"slug": "tictactoe", "title": "Tic-tac-toe", "level": "Core", "brief": "Design a two-player n-by-n tic-tac-toe game. Players alternate placing marks in empty cells. A full row, column or main diagonal of one mark wins. Reject out-of-turn moves, occupied cells and moves after the game ends.", "scope": "An in-process game with square board size n >= 1. No AI, network transport, undo or configurable shorter winning streak in the core. Marks X and O are distinct from player identity.", "ask": "Is the winning line always length n? Yes. Do invalid attempts consume a turn? No. What happens on a full board with no winner? The result is DRAW.", "example": "On a 3-by-3 board: X plays (0,0), O (1,0), X (0,1), O (1,1), X (0,2). X wins the top row. O cannot make another move. An occupied-cell attempt made earlier would not have changed the turn.", "outcome": "There are five accepted moves, the top row belongs to X, and the game result is X_WON. Rejected attempts are not included in the move count.", "rules": ["An accepted move fills exactly one previously empty in-bounds cell.", "Only the player whose turn it is may move.", "A terminal game never accepts another move."], "model": ["Game: owns board, turn, accepted-move count and result.", "Board: stores marks and answers line checks.", "PlayerId: stable player identity associated with one mark.", "Move: requested row, column and actor.", "GameView: immutable board snapshot, next turn and result."], "owner": "Game", "peers": ["PlayerId", "Move"], "apis": "GameView move(PlayerId actor, int row, int col);\nGameView view();", "api_note": "move either applies one legal move or rejects without changing board, turn or count. A terminal view has no next player. Return a copied board view rather than a mutable array reference.", "states": ["X TURN", "O TURN", "X / O WON", "DRAW"], "state_note": "A valid nonwinning move switches turns. Winning moves transition directly to a terminal win. If the move fills the board without a winner, transition to DRAW. Check win before draw: the last empty cell can also complete a line.", "flow": ["Player", "Game guard", "Board update", "Result check"], "trace": "Validate that the game is active, actor is the current player, coordinates are valid and the cell is empty. Write the mark and increment accepted moves. Check only relevant lines or scan the board; if no terminal result, flip the turn.", "code": "requireActiveAndTurn(actor);\nrequireEmptyCell(row, col);\nboard[row][col] = turn;\nmoves++;\nif (wins(row, col, turn)) result = won(turn);\nelse if (moves == n * n) result = DRAW;\nelse turn = other(turn);", "code_note": "The logic is ordered to avoid two subtle bugs: invalid moves consuming turns, and a final winning move being misclassified as a draw. A checked bound on n or wider arithmetic avoids unrealistic n*n overflow in a generalized API.", "race": "For a network extension, serialize moves per game and add a game version. A duplicate request ID can replay the same response. An old board version should be rejected rather than applied to the current turn. A concurrent map of games does not serialize each mutable game.", "tests": ["The example top-row win ends after five moves.", "An invalid cell leaves the same player to move.", "A winning final cell is a win, not a draw.", "A terminal game rejects all additional moves."], "extension": "For connect-k, diagonal and row totals alone are insufficient; a line must contain k contiguous marks. Add a WinRule interface and directional counting from the last move. Keep turn ownership in Game.", "tradeoff": "Scanning a row and column after a move is O(n) and easy to verify. Per-player row/column counters give O(1) checks for full-length n wins, but require more update invariants and do not solve arbitrary connect-k.", "cost": "Board storage O(n squared). Baseline line check O(n) per accepted move; a copied full board view costs O(n squared). Include response cost when discussing API complexity.", "pitch": "I keep the game as the mutation owner and make invalid moves leave all state unchanged. My tests focus on turn consumption and terminal ordering. I can optimize the win check later without changing the public move contract.", "gotchas": ["Do not promise every board-game rule from one generic Game class.", "Coordinates are zero-based in this workshop.", "Rejected moves must not increase the move counter.", "Player identity and mark are different concepts.", "A raw char[][] return value leaks internal state.", "Test win before full-board draw.", "Flip the turn only after a successful nonterminal move.", "Counter optimization assumes the stated full-line winning rule.", "Per-game mutable state needs per-game coordination.", "A test of only diagonal wins misses row and terminal logic.", "Connect-k requires contiguity, not merely k marks somewhere.", "The response snapshot can dominate the move-check cost."], "checks": [["What winning rule is in scope?", "A complete length-n row, column or main diagonal", "Any three marks anywhere", "The shortest line chosen by each player"], ["How many accepted moves in the example?", "Five", "Four", "Six"], ["Does an occupied-cell attempt consume a turn?", "No", "Yes", "Only for O"], ["Who owns turn advancement?", "Game", "PlayerId", "Move"], ["What should view return?", "An immutable or defensively copied snapshot", "The writable internal array", "Only the array address"], ["The final cell fills the board and wins. Result?", "Win", "Draw", "Keep playing"], ["What happens before writing the mark?", "Validate actor, state, bounds and emptiness", "Switch to the next player", "Declare a draw"], ["Which ordering is correct?", "Check win, then draw, then switch turn", "Switch turn, then validate", "Declare draw before checking win"], ["What handles two simultaneous moves?", "Serialization or version checking per game", "Only a concurrent map storing the games", "Each player using a separate lock"], ["What must stay unchanged after rejection?", "Board, turn and accepted-move count", "Only the board size", "Nothing"], ["Where should connect-k variation go?", "A winning-rule collaborator", "A second copy of all turn handling", "The player ID string"], ["What can make move response O(n squared)?", "Copying the complete board", "Comparing two player IDs", "Incrementing an integer"]], "module": "P03"}, {"slug": "snakes", "title": "Snakes and ladders", "level": "Core", "brief": "Design a turn-based snakes-and-ladders game with an injected die. A player moves by the roll, follows the configured jump at the landing square, and wins by reaching the final square exactly. Players begin at square zero outside the board.", "scope": "One die, no bonus turn on six, exact finish, and at most one jump per accepted landing. Board squares are 1 through N. Jumps starting at N are forbidden. No money, online play or tournament ranking.", "ask": "Does overshoot bounce back? No: stay in place and consume the turn. Are chained jumps followed? Not in this version. Can two players share a square? Yes.", "example": "N=20 and there is a ladder 3->11 and a snake 15->6. A starts at 0 and rolls 3, so lands at 11. B rolls 6 and lands at 6. Later A at 18 rolls 4, stays at 18 and passes the turn.", "outcome": "A ladder is applied once to the landing square. Sharing square 6 is allowed. An overshoot changes the turn but not the player position.", "rules": ["Every player position stays in the inclusive range 0..N.", "Only the current player rolls; every nonwinning valid roll advances the turn.", "The chosen jump rule is applied exactly as specified, not repeatedly by accident."], "model": ["Game: owns players, positions and current turn.", "Board: validates size and immutable jump map.", "Die: produces a roll in the configured range.", "Player: ID and position owned by Game.", "TurnResult: roll, initial square, landing and final square."], "owner": "Game", "peers": ["Die", "Board"], "apis": "TurnResult playTurn(PlayerId player);\nGameView view();\ninterface Die { int roll(); }", "api_note": "The die is injected so tests can use a scripted sequence. Reject a roll outside the die contract without changing the game. The result explains raw landing and post-jump destination separately.", "states": ["WAIT FOR TURN", "ROLL", "MOVE / STAY", "NEXT / WON"], "state_note": "A legal roll can result in no movement on overshoot. That is still a consumed turn. A winning move ends the game before switching to another player. Invalid player requests are not valid turns.", "flow": ["Player", "Game", "Die + board", "TurnResult"], "trace": "Check the actor and active game, obtain one roll, validate its range and compute tentative position. If it exceeds N, keep the old position. Otherwise look up one jump. Store the final position and either declare a winner or advance the turn.", "code": "int rolled = die.roll();\nrequireRoll(rolled);\nint landing = position + rolled;\nint next = position;\nif (landing <= board.last())\n    next = board.jumpOrStay(landing);\nposition = next;\nif (next == board.last()) winner = current;\nelse advanceTurn();", "code_note": "The Board constructor must validate every jump endpoint and the chosen terminal-square rules. To keep arithmetic simple, bound board size and die range or compute landing using long. The sketch follows at most one jump by design.", "race": "Serialize a whole turn, including die consumption, so two calls cannot both act for the same current player. For network retries, bind a command ID to its roll and outcome; rerolling on retry changes the logical command.", "tests": ["A scripted roll lands exactly on a ladder.", "An overshoot preserves position but advances the turn.", "An invalid die value is rejected without a position change.", "A winning turn prevents later rolls."], "extension": "For chained jumps, walk the jump graph until a square has no outgoing jump and detect a repeated square. Reject cyclic board definitions or stop with an explicit invalid-board error. Do not write an unbounded recursive jump loop.", "tradeoff": "An immutable map gives direct jump lookup and keeps board validation separate from play. A generic event engine would be more flexible but adds concepts not needed for this small ruleset.", "cost": "P players and J jumps: expected O(1) baseline turn work, O(P + J) storage. Chained jumps add O(number of followed jumps) work with cycle detection.", "pitch": "I state the rules that common variants disagree on before coding. The die is a dependency, so the test does not rely on luck. Each turn returns enough detail to explain how a roll became a final position.", "gotchas": ["Snakes-and-ladders variants do not all use the same overshoot rule.", "The starting square is zero, not an occupied board cell.", "A no-movement overshoot still consumes the turn.", "The die supplies randomness; it does not own turn order.", "Rerolling inside a retry violates command identity.", "A valid roll and a valid move distance are not the same result.", "Validate the die output even when using a custom implementation.", "Integer addition can overflow for unbounded configuration values.", "Two concurrent calls must not both consume the current turn.", "Random tests alone may never visit a jump or exact finish.", "Chained jumps can contain cycles.", "A configurable engine is not automatically a better interview answer."], "checks": [["How does this version handle overshoot?", "Stay in place and pass the turn", "Bounce backward", "Win immediately"], ["A at 0 rolls 3 with jump 3->11. Final square?", "11", "3", "14"], ["Can two players occupy square 6?", "Yes, in this contract", "No, always capture the other player", "Only after a six"], ["Who owns turn order?", "Game", "Die", "Board"], ["Why inject Die?", "To make specific roll sequences testable", "To prevent any repeated number", "To make jumps random too"], ["Does overshoot advance the turn?", "Yes", "No", "Only for the first player"], ["How many die rolls should one command consume?", "One", "Until the player can move", "One per retry regardless of command ID"], ["What does jumpOrStay do here?", "Apply at most one configured jump", "Follow jumps forever", "Choose a random destination"], ["What must a retry reuse?", "The original command result and roll", "A newly generated roll", "The other player's turn"], ["Which test targets the exact-finish rule?", "From 18 on N=20, roll 4 and stay", "Only construct a valid board", "Only display player names"], ["What must chained-jump support detect?", "Cycles", "Duplicate player colors", "Even die values"], ["What is baseline jump lookup cost with a hash map?", "Expected O(1)", "Always O(J squared)", "O(P) because of player count"]], "module": "P04"}, {"slug": "chess", "title": "Chess move-validation core", "level": "Deep", "brief": "Design the object model and validation pipeline for a two-player chess game. A player requests a move, the game validates turn and legality, applies it, and returns a new view. Distinguish a piece's movement shape from whether the move leaves its own king in check.", "scope": "Guided design, not a complete chess engine. The core explains ordinary moves, captures, turn ownership and king safety. Castling, en passant, promotion choice, repetition, clocks and complete draw adjudication are named extensions, not implemented claims.", "ask": "Does \"valid move\" include king safety? Yes. Must special moves be coded in this round? Clarify; this walkthrough designs their extension points. Are we building AI? No.", "example": "A rook appears able to move along its rank. However, it currently shields its own king from an enemy rook. Moving it away would expose the king, so the request is rejected and the board must remain unchanged.", "outcome": "Piece geometry can say yes while whole-position legality says no. The rejected move does not change turn, castling rights or any board square.", "rules": ["Only the side to move may act.", "A legal accepted move leaves that side's king unattacked.", "A rejected move leaves the entire position, including auxiliary rights, unchanged."], "model": ["Game: owns turn, position and accepted-move history.", "Position: board plus side-to-move and rule-relevant metadata.", "Piece: color and movement category, not a complete game controller.", "MoveGenerator: creates pseudo-legal candidates.", "LegalityChecker: checks king safety against the resulting position.", "MoveEffect: all square and metadata changes applied as one unit."], "owner": "Game", "peers": ["Piece", "MoveGenerator"], "apis": "MoveResult move(PlayerId actor, Move move);\nList<Move> legalMoves(Position position);\nboolean isAttacked(Position p, Square square, Color by);", "api_note": "Keep attack detection separate from full legal-move generation to avoid circular definitions. A candidate move contains source and destination; special moves may require additional data such as promotion piece. Never expose writable board state to callers.", "states": ["SIDE TO MOVE", "CANDIDATE", "LEGAL / REJECTED", "NEXT / TERMINAL"], "state_note": "CHECK is a property of a position, not necessarily a terminal state. Checkmate requires check and no legal moves. Stalemate requires no legal moves while not in check. This outline does not claim complete rules for every draw condition.", "flow": ["Player", "Game", "Candidate + king check", "New position"], "trace": "Validate ownership and movement geometry, create a candidate position or reversible MoveEffect, then test whether the mover's king is attacked. Commit the whole effect only if safe. Switch turn after commit and assess the opponent's legal responses.", "code": "requireTurn(actor);\nMoveEffect effect = generator.effect(position, move);\nPosition candidate = position.applyCopy(effect);\nif (attacks.isAttacked(candidate,\n        candidate.kingSquare(turn), other(turn)))\n    throw illegalMove();\nposition = candidate;\nturn = other(turn);", "code_note": "The sketch illustrates an architectural pipeline, not a complete move generator. Copying the position avoids partial rollback bugs in a teaching implementation. All special-move rights belong in the copied position too.", "race": "Serialize moves per game and version the position for remote clients. A command based on version 12 must not overwrite version 13. AI analysis can read an immutable position snapshot outside the game lock; it cannot commit a move without revalidation.", "tests": ["A pinned piece cannot expose its own king.", "A piece cannot jump through blockers unless its movement rule permits it.", "A rejected candidate preserves every position field.", "Check is not automatically reported as checkmate."], "extension": "Add castling as a multi-square MoveEffect with king/rook movement, rights and attacked-transit-square checks. Add promotion as an explicit move choice. Avoid scattered booleans that update only part of the position.", "tradeoff": "Piece subclasses can encode movement geometry, while data-driven movement rules may be easier to enumerate. Neither model removes the need for whole-position legality. A full rules engine is substantially beyond this scoped pipeline.", "cost": "On a fixed 8-by-8 board, scans are bounded, but describe work as candidate moves times attack-check cost when generalizing. Do not claim a full engine is O(1) because the board is fixed.", "pitch": "I separate pseudo-legal movement from legal game moves. The design protects all position metadata together and exposes a clear extension for multi-square moves. I explicitly do not claim that a short class sketch implements all chess rules.", "gotchas": ["A small movement hierarchy is not a complete chess engine.", "A visually legal rook move may expose the king.", "Moving the king into attack is not an acceptable transient committed state.", "A Piece should not mutate an unrelated Game singleton.", "Attack detection and full legal-move enumeration must not recurse into each other blindly.", "Check and checkmate are different outcomes.", "Rollback must restore auxiliary rights as well as board squares.", "The snippet omits complete piece movement implementations.", "An AI result computed on an old position needs revalidation.", "A few opening-move tests do not verify legal chess.", "Castling affects multiple squares and several conditions.", "Fixed board size does not excuse hiding the actual algorithmic work."], "checks": [["What does this walkthrough promise?", "A scoped move-validation design, not a complete chess engine", "Every chess variant and draw rule", "A production tournament server"], ["A rook move exposes its own king. Accept?", "No", "Yes, because rook geometry allows it", "Yes, if it captures a pawn"], ["What must rejection preserve?", "All board and position metadata", "Only the source square", "Only player names"], ["Who commits a legal position change?", "Game", "Piece", "MoveGenerator"], ["Why separate isAttacked from legalMoves?", "To avoid circular legality definitions and clarify semantics", "To ignore king safety", "To make every move automatically legal"], ["Is CHECK always terminal?", "No", "Yes", "Only when White is in check"], ["When is the candidate committed?", "After king-safety validation", "Before movement validation", "As soon as the source is nonempty"], ["Why use applyCopy in a teaching design?", "To avoid partial rollback of rejected candidates", "To guarantee perfect performance", "To implement all special moves automatically"], ["What if a client submits an old position version?", "Reject or revalidate rather than blindly overwrite", "Always apply to the new position", "Reset the whole match"], ["Which test catches a whole-position legality bug?", "Moving a pinned piece", "Printing a bishop name", "Constructing a player ID"], ["How should castling be represented?", "A validated multi-square effect plus rights changes", "Only a normal king move with no metadata", "Two independently committed public moves"], ["What is the key design distinction?", "Movement geometry versus whole-position legality", "White classes versus black classes only", "Board arrays versus display colors"]], "sources": ["S20"], "module": "P05"}, {"slug": "lru", "title": "LRU cache", "level": "Core", "brief": "Design a generic bounded in-memory cache with get and put. When a new entry exceeds capacity, evict the least recently used entry. A successful get and an update of an existing key both count as use. Reject null keys and values in this workshop.", "scope": "Positive fixed capacity, access-order eviction, no TTL, no loader and no persistence. The tested baseline uses one lock and LinkedHashMap; a custom map-plus-doubly-linked-list version is an interview extension.", "ask": "Does a miss change order? No. Does updating an existing key count as use? Yes. Is capacity zero valid? This baseline rejects it; another contract could implement a no-storage cache.", "example": "Capacity is 2. put(A,1), put(B,2), get(A), put(C,3). After get(A), B is older than A. Adding C evicts B. Updating A to 9 makes A most recent without changing the entry count.", "outcome": "After adding C the cache contains A and C. get(B) misses. The recency order is C then A after the final update, from least to most recent.", "rules": ["Size never exceeds capacity after a completed operation.", "Each key appears exactly once in both lookup and recency representation.", "The eviction victim is the least recently accessed retained entry."], "model": ["LruCache<K,V>: owns capacity, index and recency behavior.", "LinkedHashMap<K,V>: access-ordered storage in the baseline.", "CacheView: optional immutable key-order snapshot for testing.", "EvictionListener: optional effect invoked outside the lock in an extension."], "owner": "LruCache", "peers": ["EvictionListener", "CacheView"], "apis": "Optional<V> get(K key);\nvoid put(K key, V value);\nList<K> keysLeastToMostRecent();", "api_note": "A cache miss is Optional.empty because null values are prohibited. get is logically a mutation of recency. The key-order view is copied while holding the cache lock and is mainly useful for testing.", "states": ["ABSENT", "PRESENT", "TOUCHED", "EVICTED"], "state_note": "put creates or updates an entry and makes it most recent. A hit moves an existing entry to most recent. A miss leaves order unchanged. Eviction removes the key from every representation, not only the visible list.", "flow": ["Caller", "Cache lock", "Lookup + touch", "Value / miss"], "trace": "For a hit, locate the entry and update recency in the same operation. For put, insert or replace, then remove the eldest entry only when size exceeds capacity. In the standard-library baseline, access-order LinkedHashMap maintains the list.", "code": "map = new LinkedHashMap<K,V>(16, 0.75f, true) {\n    protected boolean removeEldestEntry(\n            Map.Entry<K,V> eldest) {\n        return size() > capacity;\n    }\n};\n// All cache methods synchronize on one owner.\n// get() changes recency when it hits.", "code_note": "The true constructor argument selects access order. The remove-eldest condition must be greater than capacity, not greater than or equal. The complete companion rejects nulls and returns copied order views.", "race": "Treat get and put as mutations under the same lock. Synchronizing put but not get still races on access order. Do not invoke a slow or reentrant eviction callback while holding the cache lock; capture the event then invoke it under an explicit delivery policy.", "tests": ["The example evicts B, not A.", "Updating an existing key changes recency but not size.", "A miss leaves the order unchanged.", "Capacity one repeatedly evicts the older entry and rejects null input."], "extension": "Add TTL independently of recency. Expired entries must act as misses even if they are most recent. Specify whether get refreshes expiry, which time source measures TTL, and whether removal is lazy or scheduled.", "tradeoff": "LinkedHashMap avoids pointer bugs in a practical implementation. A custom doubly linked list demonstrates the underlying algorithm but must maintain head, tail, predecessor, successor and map invariants carefully.", "cost": "C entries: expected O(1) get and put with suitable hashing; O(C) space. Returning a key-order snapshot costs O(C). Lock contention is not captured by the sequential Big-O statement.", "pitch": "The key insight is that get mutates recency. I use one atomic owner and test order as well as values. I can explain the doubly linked list behind the library and isolate TTL as a separate policy.", "gotchas": ["Capacity semantics must be stated before testing zero.", "Insertion order is not access order.", "Removing only from the list leaks a stale lookup entry.", "An eviction listener is not the owner of recency.", "Optional.empty is ambiguous if null values are allowed.", "A hit changes order; a miss does not.", "Eviction happens only after size exceeds capacity.", "size() >= capacity evicts one entry too early.", "An unsynchronized get is not a harmless read in an access-order map.", "Value-only assertions miss ordering bugs.", "TTL and LRU answer different questions.", "Expected O(1) is not a latency guarantee under contention."], "checks": [["Does a hit count as use?", "Yes", "No; only inserts count", "Only when the value changes"], ["Which key is evicted by put(C) in the example?", "B", "A", "C"], ["What must a custom implementation keep aligned?", "Hash index and recency list", "Only the values", "Only a hit counter"], ["Who owns recency mutation?", "LruCache", "EvictionListener", "CacheView"], ["Why prohibit null values here?", "To make absence unambiguous", "Because all maps prohibit null", "To eliminate key hashing"], ["What does a cache miss do to recency?", "Nothing", "Moves an absent node to the head", "Evicts the oldest entry"], ["When should eviction occur?", "When size becomes greater than capacity", "When size equals capacity", "On every get"], ["Which LinkedHashMap constructor mode is needed?", "Access order", "Insertion order", "Random order"], ["Must get share the synchronization boundary?", "Yes; a hit mutates ordering", "No; it only returns a value", "Only when a key is missing"], ["Which test distinguishes LRU from insertion order?", "Read A before inserting C", "Insert only one key", "Clear an empty cache"], ["Can the most recent entry be expired?", "Yes; TTL is separate from recency", "No; recent always means unexpired", "Only with duplicate keys"], ["What does the custom-list version add?", "Pointer and representation invariants", "Automatic distributed consistency", "A guarantee of no contention"]], "sources": ["S05"], "module": "P06"}, {"slug": "lfu", "title": "LFU cache with recency tie-break", "level": "Deep", "brief": "Design a fixed-capacity least-frequently-used cache. Every successful get and update increases the entry's frequency. When capacity is exceeded, evict the lowest-frequency entry; among equal frequencies evict the least recently used.", "scope": "Positive capacity, initial frequency one, no TTL, no frequency decay and no loader. This is a guided algorithm-and-ownership design; the complete Java companion implements LRU, not LFU.", "ask": "Do updates count as accesses? Yes. Do misses increment frequency? No. Are old popular entries ever aged down? Not in the core; decay changes the data structure and policy.", "example": "Capacity 2: put(A,1), put(B,2), get(A), put(C,3). A has frequency 2 and B has 1, so B leaves. After get(C), A and C both have 2; A is older within that frequency and is the next victim.", "outcome": "The eviction decision compares frequency first and recency second. A globally recent item can still lose if its frequency is lower.", "rules": ["Every retained key belongs to exactly one frequency bucket.", "Each bucket preserves least-to-most recent order among its members.", "minFrequency names the smallest nonempty bucket while the cache is nonempty."], "model": ["LfuCache: owns key index, frequency buckets and minimum frequency.", "Entry: key, value and current frequency.", "FrequencyBucket: ordered set or doubly linked list of entries.", "KeyIndex: expected constant-time entry lookup."], "owner": "LfuCache", "peers": ["Entry", "CacheView"], "apis": "Optional<V> get(K key);\nvoid put(K key, V value);\nCacheView snapshot();", "api_note": "A hit promotes the entry to the next frequency and the most recent end of that bucket. Updating a value does the same. Inserting a new key may first evict one existing entry, then creates frequency one and sets minFrequency to one.", "states": ["FREQ f", "REMOVE FROM f", "APPEND TO f+1", "MIN UPDATED"], "state_note": "Promotion is a multi-representation change: remove from the old bucket, remove an empty bucket if desired, update the entry frequency, append to the new bucket and repair the minimum. On insertion the minimum becomes one regardless of previous values.", "flow": ["Caller", "Key index", "Frequency buckets", "Victim / value"], "trace": "On a hit, remember old frequency f and remove the entry from bucket f. If f equals the current minimum and the bucket becomes empty, this promotion makes f+1 the new minimum. Add the entry to the most-recent end of bucket f+1.", "code": "int old = entry.frequency;\nBucket from = buckets.get(old);\nfrom.remove(entry);\nif (from.isEmpty() && minFrequency == old)\n    minFrequency = old + 1;\nentry.frequency = old + 1;\nbuckets.computeIfAbsent(old + 1, k -> new Bucket())\n       .addMostRecent(entry);", "code_note": "This contextual promotion sketch assumes a retained hit and no frequency overflow. Eviction, insertion and bucket deletion need their own updates. Use a bounded-counter policy or wider representation for an unbounded lifetime; silent wraparound breaks ordering.", "race": "Protect promotion and eviction under one owner lock in a simple baseline. Thread-safe bucket containers do not protect the invariant across buckets and the key index. Snapshot code must not expose entries while they are between buckets.", "tests": ["The example evicts B first and A on the later tie.", "Promoting the sole minimum-frequency entry updates the minimum.", "Insertion after eviction resets minFrequency to one.", "Updating an existing key never creates a duplicate bucket entry."], "extension": "Frequency decay avoids permanent popularity from ancient traffic, but renormalizing counts changes costs and tie-break semantics. Treat it as a new policy and specify whether recency order is preserved when buckets merge.", "tradeoff": "A map of frequency buckets can support expected O(1) operations but has complex invariants. A heap with versioned entries is simpler to order but adds logarithmic work and stale-entry cleanup. Choose based on required interview scope.", "cost": "C retained entries: expected O(1) standard bucket operations and O(C) live-entry storage when empty buckets are removed. Counter lifetime and stale metadata require explicit bounds.", "pitch": "I define the tie-break before the structure. The difficult part is preserving one bucket membership per key while repairing the minimum. I would dry-run promotion of the last minimum-frequency entry before claiming the design is correct.", "gotchas": ["LFU is not LRU with a renamed variable.", "Recency matters only within an equal-frequency tie.", "Leaving an entry in its old bucket creates duplicate ownership.", "Entry does not independently decide global eviction.", "Misses should not create phantom frequency records.", "The minimum changes when its final member is promoted.", "Insertion must reset the minimum to one.", "Frequency counters can overflow in long-lived processes.", "Separate safe containers do not imply safe cross-bucket movement.", "A hit-count test alone misses the recency tie-break.", "Decay can merge previously separate frequency groups.", "Unremoved empty buckets can grow with the number of accesses."], "checks": [["What breaks an LFU tie here?", "Least recent use within the same frequency", "Alphabetical key order", "Random choice"], ["After A and C both reach frequency 2, who is older?", "A", "C", "Neither can be evicted"], ["How many buckets may contain a retained entry?", "Exactly one", "Any number", "Zero after every hit"], ["Who owns minFrequency?", "LfuCache", "Entry", "CacheView"], ["What does updating an existing key do?", "Replace value and count as access", "Create a second entry", "Reset frequency to zero"], ["The sole minimum entry is promoted. What changes?", "The minimum advances to its new frequency", "The minimum remains on an empty bucket", "The whole cache is cleared"], ["What does a new insertion set the minimum to?", "One", "The largest existing frequency", "Zero"], ["What is missing from the promotion sketch?", "Insertion and eviction handling", "The concept of a key", "A need for any invariant"], ["What must be atomic?", "Removal from old bucket and addition to new bucket", "Only reading the value", "Only allocating a bucket object"], ["Which case targets minimum maintenance?", "Promote the last entry in the minimum bucket", "Read a missing key once", "Display the capacity"], ["What does frequency decay affect?", "Bucket grouping and possibly tie-break handling", "Only the UI label", "Nothing in the algorithm"], ["Why delete empty buckets?", "To bound metadata growth", "To force every lookup to scan", "To eliminate key equality"]], "module": "P07"}, {"slug": "rate", "title": "Token-bucket rate limiter", "level": "Core", "brief": "Design an in-process token bucket. The bucket holds up to C tokens and refills at R tokens per second. Each accepted request spends one token. Requests without enough tokens are rejected immediately rather than queued.", "scope": "One bucket, finite positive capacity and rate, injected monotonic nanosecond ticker, no distributed quota and no per-tenant eviction. Fractional tokens are allowed for refill calculations.", "ask": "Is a burst allowed? Yes, up to the current tokens. Does an idle period accumulate beyond capacity? No. Is rejection retry-safe? It does not spend a token; a later attempt is a new admission check.", "example": "C=3 and R=1 token/second. At time zero, three calls pass and a fourth fails. After half a second, the bucket has 0.5 tokens and still rejects. After another half second, one request passes.", "outcome": "A full bucket permits a burst. Refill adds elapsedTime times rate and is capped at C. It does not reset all tokens at a fixed wall-clock boundary.", "rules": ["Tokens remain within zero and capacity, allowing small floating-point tolerance.", "A successful tryAcquire spends exactly one token.", "Refill time and token consumption are updated in the same atomic operation."], "model": ["TokenBucket: owns capacity, rate, tokens and last sample.", "Ticker: supplies elapsed nanosecond samples.", "AdmissionDecision: accepted or rejected, optionally with retry delay.", "LimiterRegistry: optional keyed bucket ownership, excluded from core."], "owner": "TokenBucket", "peers": ["Ticker", "LimiterRegistry"], "apis": "boolean tryAcquire();\ninterface Ticker { long readNanos(); }", "api_note": "tryAcquire does not block. The ticker contract is monotonic over the comparison horizon; it is not an Instant timestamp. Validate finite configuration values, and do not permit NaN to bypass comparisons.", "states": ["TOKENS AVAILABLE", "SPEND", "EMPTY", "REFILL"], "state_note": "There is no separate reset event. Every admission samples elapsed time, computes replenishment, caps the balance and then decides. A long idle period restores at most capacity, not unlimited historical credit.", "flow": ["Request", "Sample elapsed time", "Refill + spend", "Allow / reject"], "trace": "Read the ticker while holding the bucket lock. Compute elapsed nanoseconds from the prior sample, reject an invalid backwards test ticker, refill proportionally and update the sample. If tokens are at least one, decrement and accept; otherwise reject.", "code": "synchronized boolean tryAcquire() {\n    long now = ticker.readNanos();\n    long elapsed = now - last;\n    if (elapsed < 0) throw badTicker();\n    tokens = Math.min(capacity,\n        tokens + elapsed / 1e9 * rate);\n    last = now;\n    if (tokens < 1.0) return false;\n    tokens -= 1.0;\n    return true;\n}", "code_note": "This is an admission-control teaching implementation, not a billing-grade exact quota. Floating-point behavior near boundaries needs tests. The elapsed-time horizon must stay within signed-long difference limits. Wall-clock changes should not mint tokens.", "race": "Two callers must not both observe the same final token and spend it. One lock around refill and decrement is sufficient for the in-process bucket. Across several servers, independent local buckets allow a combined burst larger than C; define a shared or partitioned quota separately.", "tests": ["Exactly C immediate calls pass from a full integer-capacity bucket.", "A half-token refill still rejects a one-token request.", "A long idle period does not exceed capacity.", "Many simultaneous contenders for one token produce one success."], "extension": "Add per-user buckets with a registry and an idle-removal policy. Removing a bucket while it has active callers can accidentally create two independent buckets for one user. Define registry ownership and eviction carefully.", "tradeoff": "Token bucket supports bursts with a smooth refill rule. Fixed windows are simpler but allow bursts around a boundary. A sliding log tracks a different exact-window contract at higher storage cost. None is universally correct without requirements.", "cost": "O(1) time and space per bucket. A registry for U active users is O(U) space before eviction. This sequential cost does not describe contention or distributed coordination.", "pitch": "I first distinguish rate from concurrency: the bucket limits admissions over time, not the number of requests currently running. I inject elapsed time and test exact boundaries without sleeping.", "gotchas": ["A rate limit is not a concurrency semaphore.", "Half a token cannot pay for a one-token request.", "Separate refill and spend steps can oversubscribe the bucket.", "A ticker measures time; it does not own quota.", "Wall-clock timestamps and elapsed nanoseconds are not interchangeable.", "An idle bucket cannot accumulate beyond capacity.", "Updating last incorrectly can refill the same elapsed period twice.", "NaN or infinite configuration values need validation.", "Local buckets do not enforce one global quota.", "Sleep-based tests are slower and less precise than an injected ticker.", "Racy registry eviction can duplicate one user's budget.", "Different limiter algorithms implement different traffic contracts."], "checks": [["Does this limiter queue rejected requests?", "No; it rejects immediately", "Yes; forever", "Only at midnight"], ["After spending all tokens, is 0.5 token enough?", "No", "Yes", "Only for the fourth request"], ["Which fields must change together?", "Token balance and last refill sample", "Only the display name", "Only registry size"], ["Who owns quota state?", "TokenBucket", "Ticker", "LimiterRegistry view"], ["Which clock source matches elapsed refill?", "An injected monotonic ticker", "A formatted local date string", "A random timestamp"], ["What happens after a very long idle period?", "Tokens cap at capacity", "Tokens grow without limit", "Capacity permanently doubles"], ["What must precede spending?", "Refill based on newly elapsed time", "A calendar-day reset", "Deleting the bucket"], ["Why validate finite capacity and rate?", "NaN and infinity break meaningful comparisons", "To make HashMap ordered", "To ensure a fixed thread count"], ["Two callers race for one token. Expected successes?", "One", "Two", "Always zero"], ["Which test avoids real waiting?", "Advance a fake ticker", "Sleep near a boundary", "Use the current calendar day"], ["What can registry eviction accidentally create?", "Two live buckets for the same key", "An immutable rate", "A guaranteed global quota"], ["What does a token bucket not directly limit?", "Number of requests currently executing", "Admissions over time", "Available burst tokens"]], "sources": ["S13"], "module": "P08"}, {"slug": "logger", "title": "Extensible logging library", "level": "Core", "brief": "Design a logger supporting levels, formatting and multiple output sinks. A log call below the threshold is ignored. Accepted events carry an event timestamp, level and immutable message data and are sent to configured sinks.", "scope": "Synchronous in-process dispatch in the core. Formatting and sinks are replaceable. No durability or exactly-once guarantee. Asynchronous queues, rotation and remote collection are extensions.", "ask": "What happens if one sink fails? Continue to other sinks and return or report collected failures through a separate error policy. Are sink calls serialized? The sink contract must state its own concurrency behavior.", "example": "Threshold INFO, sinks Console and File. DEBUG is ignored. ERROR creates one event and sends it to both sinks. If File fails, Console still receives the event and the failure is reported without recursively logging through the same broken path.", "outcome": "Filtering happens before expensive event construction when possible. One failed destination must not silently prevent all remaining destinations unless fail-fast semantics were explicitly chosen.", "rules": ["Events below threshold produce no sink writes.", "Accepted events are immutable snapshots of caller data.", "Sink failure handling must not recurse unboundedly through the same logger."], "model": ["Logger: filters events and coordinates delivery.", "LogEvent: timestamp, level, message and copied context.", "Formatter: pure conversion from event to bytes or text.", "Sink: writes one formatted or structured event.", "ErrorHandler: handles sink failures outside the normal logging path."], "owner": "Logger", "peers": ["Formatter", "LogEvent"], "apis": "LogResult log(Level level, String message);\ninterface Sink { void write(LogEvent event); }\ninterface Formatter { String format(LogEvent e); }", "api_note": "Choose whether sinks receive structured events or formatted strings; do not let every sink interpret arbitrary mutable caller objects. Redact sensitive fields before output. close must define whether the logger owns and closes its sinks.", "states": ["OPEN", "FILTER / DELIVER", "CLOSING", "CLOSED"], "state_note": "The synchronous baseline rejects calls after close. Closing an already-closed logger is a no-op by chosen contract. For asynchronous logging, CLOSING must specify drain versus discard and how waiting callers are released.", "flow": ["Caller", "Level filter", "Event snapshot", "Sinks"], "trace": "Read a stable configuration snapshot, filter, build one event using the clock, then iterate a sink snapshot. Catch individual sink exceptions, continue according to policy, and pass failures to a nonrecursive error handler. Avoid holding a configuration lock across I/O.", "code": "if (!threshold.accepts(level)) return ignored();\nLogEvent event = snapshotEvent(level, message);\nList<Exception> failures = new ArrayList<>();\nfor (Sink sink : sinkSnapshot) {\n    try { sink.write(event); }\n    catch (Exception e) { failures.add(e); }\n}\nreturn new LogResult(failures);", "code_note": "The sketch shows failure isolation, not a complete file writer. Event timestamps are sampled once per event. Mutable structured context must be copied or converted into immutable values before handing the event to another thread.", "race": "Configuration changes can publish a new immutable sink list. Existing calls use their captured list. Define sink thread safety explicitly: the logger being thread-safe does not automatically make an injected file writer safe. Resource closure must coordinate with in-flight writers.", "tests": ["Below-threshold events call no sink.", "One failing sink does not suppress a healthy later sink.", "Caller mutation after log does not alter a captured event.", "Close follows the documented repeated-close and in-flight-write behavior."], "extension": "Add an asynchronous bounded queue. Specify what happens when full: block, drop, fail or sample. Include a visible dropped-event count. A queue without a bound can turn a logging slowdown into memory exhaustion.", "tradeoff": "Synchronous delivery is simple and makes backpressure visible as caller latency. Asynchronous delivery decouples bursts but adds overflow, ordering, shutdown and crash-loss decisions. It cannot be summarized as merely \"faster\".", "cost": "K sinks and event size M: at least O(K + M) coordination/formatting work, plus sink I/O. Asynchronous buffering adds O(queue capacity times average event size) memory.", "pitch": "I treat failure and resource lifetime as part of the logging API. I separate event creation, formatting and output, and I do not claim durability for an in-memory queue. The overload policy is an explicit extension decision.", "gotchas": ["A logger can block its caller even when the API returns void.", "Formatting DEBUG messages before filtering wastes work.", "Passing mutable context lets later changes rewrite history.", "Formatting and output are distinct responsibilities.", "A log library should not accidentally print secrets by default.", "Close semantics matter even for a utility library.", "Do not hold a global configuration lock during slow I/O.", "Catching a sink failure does not mean it should disappear silently.", "Closing a sink while another thread writes needs a lifecycle contract.", "A happy-path file test does not verify failure isolation.", "An unbounded async queue moves the failure into memory.", "Async does not mean durable or exactly once."], "checks": [["What does the core promise?", "Synchronous delivery with explicit failure handling", "Durable exactly-once remote storage", "Unlimited asynchronous buffering"], ["If File fails after Console succeeds, what happens?", "Report the failure and keep the successful delivery", "Undo the console output", "Recursively log forever"], ["What should a below-threshold event do?", "Produce no sink writes", "Write only to the first sink", "Always format and flush"], ["Who coordinates sink delivery?", "Logger", "Formatter", "LogEvent"], ["Why copy structured context?", "To capture event-time data rather than later mutations", "To guarantee disk durability", "To make every object serializable"], ["What must close specify?", "Ownership and behavior of in-flight and later writes", "Only the final filename", "The number of log levels"], ["Where should slow I/O occur?", "Outside a configuration-mutation lock", "Inside every setter lock", "Inside the LogEvent constructor"], ["What does the loop isolate?", "Failures of individual sinks", "Every possible process crash", "All concurrent writer races automatically"], ["What must an injected sink document?", "Its concurrency and lifecycle contract", "Only its class name", "Only its preferred font"], ["Which test checks failure isolation?", "A failing sink followed by a healthy sink", "One successful console message", "Only comparing enum ordinals"], ["What is required for a bounded async queue?", "An explicit full-queue policy", "Infinite memory", "A promise that producers never burst"], ["What cost does asynchronous delivery add?", "Buffering, overflow and shutdown complexity", "No operational cost", "Automatic durability"]], "sources": ["S18"], "module": "P09"}, {"slug": "pubsub", "title": "In-memory publish-subscribe bus", "level": "Core", "brief": "Design a topic-based event bus. Clients subscribe callbacks, publish immutable events and unsubscribe using a returned token. One publication delivers to a snapshot of the subscribers present when that snapshot is taken.", "scope": "Synchronous process-local delivery, registration order within a captured snapshot and exception isolation. No durable replay, consumer offsets, network partitions or exactly-once delivery.", "ask": "Does unsubscribe during publish affect the current event? Not after the snapshot is captured. May callbacks publish recursively? Yes in the simple contract, but callers must avoid unbounded recursion. Duplicate registrations produce distinct tokens.", "example": "Topic orders has subscribers A and B. Publication captures [A,B]. A unsubscribes B while handling the event. B still receives that current event. A later publication captures only A.", "outcome": "The snapshot gives a precise subscription boundary. Unsubscribe prevents inclusion in future snapshots; it does not revoke work already captured by an in-flight publication.", "rules": ["Each subscription token identifies exactly one registration.", "A publication attempts each callback in its captured snapshot once.", "A callback failure does not corrupt the registration list or suppress later callbacks under this policy."], "model": ["EventBus: owns topic-to-registration lists.", "Subscription: token, topic and idempotent close/unsubscribe action.", "Registration: unique ID and callback reference.", "Event: immutable payload and event identity.", "DeliveryReport: completed attempts and captured failures."], "owner": "EventBus", "peers": ["Event", "DeliveryReport"], "apis": "Subscription subscribe(String topic, Listener listener);\nDeliveryReport publish(String topic, Event event);\ninterface Subscription extends AutoCloseable {\n    void close();\n}", "api_note": "Use a distinct token for every registration, even when the same callback object subscribes twice. close is idempotent by this bus's contract. A delivery report describes local callback attempts, not durable downstream processing.", "states": ["REGISTERED", "SNAPSHOT CAPTURED", "CALLBACK ATTEMPT", "UNSUBSCRIBED"], "state_note": "Subscription state and in-flight delivery state overlap. An unsubscribed registration may still exist in a previously captured snapshot. The API must state this rather than pretending unsubscribe instantly cancels arbitrary running code.", "flow": ["Publisher", "Subscriber snapshot", "Callbacks", "Report"], "trace": "Under a short registry lock, copy the topic's registrations. Release the lock before invoking user code. For each captured registration, call the listener and collect its failure if any. Concurrent registration changes affect only later snapshots.", "code": "List<Registration> snapshot;\nsynchronized (registry) {\n    snapshot = List.copyOf(registrations(topic));\n}\nfor (Registration r : snapshot) {\n    try { r.listener().on(event); }\n    catch (RuntimeException e) { failures.add(e); }\n}", "code_note": "List.copyOf makes a structural snapshot of registrations; event and registration content must have safe ownership too. CopyOnWriteArrayList is an alternative when registration changes are rare, not a free improvement for write-heavy workloads.", "race": "Do not invoke a callback while holding the registry lock. A callback may subscribe, unsubscribe, publish again or block. Concurrent publish calls may invoke the same listener concurrently; either document that requirement or add per-listener serialization.", "tests": ["Unsubscribe during a callback does not alter the current snapshot.", "The next publication excludes the closed subscription.", "A throwing listener does not prevent the next listener from running.", "Closing one of two registrations of the same callback removes only that registration."], "extension": "Add asynchronous delivery with bounded per-subscriber queues. Decide whether slow subscribers drop events, block the publisher or disconnect. Durable replay requires a stored log and acknowledgement protocol, which is a different scope.", "tradeoff": "Copy-on-publish makes the subscription boundary easy to explain. Copy-on-write moves copying cost to subscription updates. Neither choice gives durable messaging or prevents a subscriber's own race conditions.", "cost": "S subscribers to a topic: O(S) snapshot and dispatch coordination, plus callback work. Registry storage is O(total live subscriptions). Copy-on-write changes which operations pay the copy cost.", "pitch": "My bus has an explicit unsubscribe boundary and never holds internal locks across user callbacks. I separate a process-local observer mechanism from a durable broker. The race tests demonstrate the promised snapshot behavior.", "gotchas": ["Calling it a bus does not make it a durable broker.", "Unsubscribe is not time travel for captured deliveries.", "One callback object may have several registrations.", "Events should not own the subscriber registry.", "AutoCloseable does not itself guarantee idempotent close; this API chooses that behavior.", "Registration removal and in-flight execution are different lifecycles.", "Invoking callbacks under a lock invites reentrancy and stalls.", "A lis
