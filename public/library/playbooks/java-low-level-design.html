", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S15"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Parking lot", "step": 11, "slug": "parking"}, {"id": "L060", "number": 60, "module": "P01", "title": "Defend the design", "idea": "I start with one lot owner because the hard rule spans spots, tickets and active vehicles. I separate selection and pricing policy from ownership. I can demonstrate a concurrent final-spot test and explain exactly what changes for persistence.", "mental": "S spots, T retained tickets: allocation O(S); ticket lookup expected O(1); storage O(S + T). Ticket retention needs a policy outside an unlimited interview run.", "code": "", "gotcha": "A coarse lock favors simple correctness over maximum parallelism.", "question": "Why begin with a spot scan?", "options": ["It is a simple correct baseline with explicit O(S) cost", "It guarantees O(1) allocation", "It removes all synchronization needs"], "answer": 0, "explanation": "It is a simple correct baseline with explicit O(S) cost. A linear scan is easy to explain and costs O(S). Per-size free-spot indexes can reduce allocation work, but entry and exit must now update those indexes atomically too.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S15"], "level": "Core", "detail": "A linear scan is easy to explain and costs O(S). Per-size free-spot indexes can reduce allocation work, but entry and exit must now update those indexes atomically too.", "kind": "step-12", "problem": "Parking lot", "step": 12, "slug": "parking"}, {"id": "L061", "number": 61, "module": "P02", "title": "Problem statement and scope", "idea": "Design a vending machine that accepts integer-value credit, selects an in-stock product, dispenses one item and returns any remaining credit. A user may cancel before purchase. Start with a software-only dispenser whose success is immediate.", "mental": "One customer session at a time; unlimited logical change; stock and prices supplied at construction. Hardware jams, exact coin inventories, card payments and restocking during a purchase are extensions.", "code": "", "gotcha": "Unlimited logical change is an assumption, not a physical claim.", "question": "What is deliberately excluded from the core?", "options": ["Positive-price validation", "Insufficient-credit rejection", "Exact physical coin inventory"], "answer": 2, "explanation": "Exact physical coin inventory. Do we need exact coin change? Not in the core. Can a session buy multiple items? Yes, until its credit is spent or refunded. What does a failed selection do? Keep the credit and stock unchanged.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Core", "detail": "Do we need exact coin change? Not in the core. Can a session buy multiple items? Yes, until its credit is spent or refunded. What does a failed selection do? Keep the credit and stock unchanged.", "kind": "step-1", "problem": "Vending machine", "step": 1, "slug": "vending"}, {"id": "L062", "number": 62, "module": "P02", "title": "Work through one example", "idea": "Tea costs 30 and has stock 2. Insert 20: selection is rejected for insufficient credit. Insert another 20: selection succeeds, stock becomes 1 and credit becomes 10. Cancel returns 10 and clears the session credit.", "mental": "The rejected purchase does not consume credit or tea. Only the successful purchase decreases stock. A second cancellation returns zero.", "code": "", "gotcha": "A failed buy must retain the inserted credit.", "question": "What credit remains after paying 40 for tea priced 30?", "options": ["30", "10", "0"], "answer": 1, "explanation": "10. The rejected purchase does not consume credit or tea. Only the successful purchase decreases stock. A second cancellation returns zero.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Customer", "Machine", "Validate stock + credit", "Receipt"], "sources": [], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Vending machine", "step": 2, "slug": "vending"}, {"id": "L063", "number": 63, "module": "P02", "title": "Write the invariants", "idea": "Credit and every stock count are nonnegative.\nA successful purchase reduces stock by one and credit by exactly the quoted price.\nA rejected purchase changes neither credit nor stock.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Checking credit after decrementing stock violates failure atomicity.", "question": "A purchase is rejected. What changes?", "options": ["Neither stock nor credit", "Only stock", "Both are cleared"], "answer": 0, "explanation": "Neither stock nor credit. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Vending machine", "step": 3, "slug": "vending"}, {"id": "L064", "number": 64, "module": "P02", "title": "Choose objects and ownership", "idea": "Machine: owns the session, inventory and atomic purchase operation.\nProduct: SKU, display name and immutable unit price.\nSlot: product plus stock count.\nReceipt: dispensed SKU, charged amount and remaining credit.\nDispenserPort: hardware boundary introduced only for the extension.", "mental": "The central consistency owner in this design is Machine. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Product metadata should not own the whole customer session.", "question": "Who owns the credit-and-stock invariant?", "options": ["Product", "Receipt", "Machine"], "answer": 2, "explanation": "Machine. Machine has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Machine", "Product", "Slot", "Receipt"], "sources": [], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Vending machine", "step": 4, "slug": "vending"}, {"id": "L065", "number": 65, "module": "P02", "title": "Design the public API", "idea": "Reject nonpositive inserts and overflow. buy returns a receipt only when the in-memory purchase succeeds. cancel refunds the current credit and sets it to zero. Do not expose a public setter for session credit.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "void insert(long amount);\nReceipt buy(String sku);\nlong cancel();", "gotcha": "insert(-5) is not a valid refund API.", "question": "What should cancel return on its second call?", "options": ["The last product price", "Zero", "The previous refund again"], "answer": 1, "explanation": "Zero. Reject nonpositive inserts and overflow. buy returns a receipt only when the in-memory purchase succeeds. cancel refunds the current credit and sets it to zero. Do not expose a public setter for session credit.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Vending machine", "step": 5, "slug": "vending"}, {"id": "L066", "number": 66, "module": "P02", "title": "Draw the state machine", "idea": "IDLE means no credit. A valid insert leads to COLLECTING. A successful purchase can leave credit, so it may return to COLLECTING rather than IDLE. Cancellation returns to IDLE. In the baseline, dispensing is part of the atomic software operation.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "A purchase with leftover credit need not return to IDLE.", "question": "After a buy leaves credit, which state is valid?", "options": ["COLLECTING", "Always IDLE", "Permanently DISPENSING"], "answer": 0, "explanation": "COLLECTING. IDLE means no credit. A valid insert leads to COLLECTING. A successful purchase can leave credit, so it may return to COLLECTING rather than IDLE. Cancellation returns to IDLE. In the baseline, dispensing is part of the atomic software operation.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["IDLE", "COLLECTING", "PURCHASE", "COLLECTING / IDLE"], "sources": [], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Vending machine", "step": 6, "slug": "vending"}, {"id": "L067", "number": 67, "module": "P02", "title": "Trace the key operation", "idea": "Find the SKU, check available stock and sufficient credit, compute the new values without overflow, then commit stock and credit together. The response reports the charged amount and remaining credit. A bad SKU is rejected before mutation.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Validate all predictable failures before mutating.", "question": "What must happen before stock decreases?", "options": ["Receipt printing only", "Clearing all inserted credit", "Stock and credit validation"], "answer": 2, "explanation": "Stock and credit validation. Find the SKU, check available stock and sufficient credit, compute the new values without overflow, then commit stock and credit together. The response reports the charged amount and remaining credit. A bad SKU is rejected before mutation.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Customer", "Machine", "Validate stock + credit", "Receipt"], "sources": [], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Vending machine", "step": 7, "slug": "vending"}, {"id": "L068", "number": 68, "module": "P02", "title": "Read the core Java logic", "idea": "The sketch assumes immutable validated positive prices and no failing hardware call after mutation. That scope is essential. Do not copy it unchanged into a physical machine where dispensing can fail or its outcome can be unknown.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "synchronized Receipt buy(String sku) {\n    Slot slot = requireSlot(sku);\n    if (slot.stock() == 0) throw soldOut();\n    long price = slot.price();\n    if (credit < price) throw insufficient();\n    slot.decrement();\n    credit -= price;\n    return new Receipt(sku, price, credit);\n}", "gotcha": "The code assumes no remote side effect during the atomic operation.", "question": "What assumption makes the tiny buy sketch valid?", "options": ["Network payment is exactly once", "Dispensing is a synchronous software success", "Hardware never fails in reality"], "answer": 1, "explanation": "Dispensing is a synchronous software success. The sketch assumes immutable validated positive prices and no failing hardware call after mutation. That scope is essential. Do not copy it unchanged into a physical machine where dispensing can fail or its outcome can be unknown.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Vending machine", "step": 8, "slug": "vending"}, {"id": "L069", "number": 69, "module": "P02", "title": "Handle races and failure", "idea": "One machine lock keeps insertion, purchase and cancellation from interleaving halfway through a state change. For hardware, create a vend attempt ID and a DISPENSING state, invoke the port outside the lock, and reconcile a jam or lost reply. A physical effect and an in-memory update are not one transaction.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "A successful software decrement does not prove an item physically fell.", "question": "What does a hardware timeout require?", "options": ["A tracked uncertain vend outcome", "An automatic new vend attempt with no ID", "Pretending no item could have dispensed"], "answer": 0, "explanation": "A tracked uncertain vend outcome. One machine lock keeps insertion, purchase and cancellation from interleaving halfway through a state change. For hardware, create a vend attempt ID and a DISPENSING state, invoke the port outside the lock, and reconcile a jam or lost reply. A physical effect and an in-memory update are not one transaction.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Vending machine", "step": 9, "slug": "vending"}, {"id": "L070", "number": 70, "module": "P02", "title": "Build the test plan", "idea": "Insufficient credit leaves both values unchanged.\nBuying the last item succeeds once, then reports sold out.\nCancel twice refunds credit only once.\nNonpositive credit and arithmetic overflow are rejected before mutation.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test cancellation after an insufficient-credit rejection.", "question": "Which boundary test matters?", "options": ["Only reading the product name", "Only starting an empty application", "Cancel twice after a purchase with leftover credit"], "answer": 2, "explanation": "Cancel twice after a purchase with leftover credit. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Vending machine", "step": 10, "slug": "vending"}, {"id": "L071", "number": 71, "module": "P02", "title": "Change one requirement", "idea": "Exact coin change introduces a ChangePolicy over the available coin counts. Compute a feasible change plan before committing purchase. A greedy choice is not universally correct for arbitrary denominations and limited inventories.", "mental": "An enum with guarded methods is enough for the small software state machine. A State hierarchy becomes useful when accepting, refunding, dispensing and fault recovery have substantially different behaviors.", "code": "", "gotcha": "Greedy change can fail with unusual denominations.", "question": "What does exact change add?", "options": ["No new correctness rules", "A feasible coin-allocation plan", "Only a new display label"], "answer": 1, "explanation": "A feasible coin-allocation plan. Exact coin change introduces a ChangePolicy over the available coin counts. Compute a feasible change plan before committing purchase. A greedy choice is not universally correct for arbitrary denominations and limited inventories.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Vending machine", "step": 11, "slug": "vending"}, {"id": "L072", "number": 72, "module": "P02", "title": "Defend the design", "idea": "I separate the software model from unreliable hardware. My first implementation proves money and stock conservation under rejection. Then I introduce a dispensing protocol only when the problem actually requires physical uncertainty.", "mental": "P product slots: expected O(1) SKU lookup and purchase, O(P) storage. Exact-change planning has a separate problem-size cost determined by its chosen algorithm.", "code": "", "gotcha": "Do not introduce a dozen State classes just to rename enum values.", "question": "When is a State hierarchy useful?", "options": ["When state-specific behavior becomes substantial", "Whenever an enum has two members", "Only to increase class count"], "answer": 0, "explanation": "When state-specific behavior becomes substantial. An enum with guarded methods is enough for the small software state machine. A State hierarchy becomes useful when accepting, refunding, dispensing and fault recovery have substantially different behaviors.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Core", "detail": "An enum with guarded methods is enough for the small software state machine. A State hierarchy becomes useful when accepting, refunding, dispensing and fault recovery have substantially different behaviors.", "kind": "step-12", "problem": "Vending machine", "step": 12, "slug": "vending"}, {"id": "L073", "number": 73, "module": "P03", "title": "Problem statement and scope", "idea": "Design a two-player n-by-n tic-tac-toe game. Players alternate placing marks in empty cells. A full row, column or main diagonal of one mark wins. Reject out-of-turn moves, occupied cells and moves after the game ends.", "mental": "An in-process game with square board size n >= 1. No AI, network transport, undo or configurable shorter winning streak in the core. Marks X and O are distinct from player identity.", "code": "", "gotcha": "Do not promise every board-game rule from one generic Game class.", "question": "What winning rule is in scope?", "options": ["Any three marks anywhere", "The shortest line chosen by each player", "A complete length-n row, column or main diagonal"], "answer": 2, "explanation": "A complete length-n row, column or main diagonal. Is the winning line always length n? Yes. Do invalid attempts consume a turn? No. What happens on a full board with no winner? The result is DRAW.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Core", "detail": "Is the winning line always length n? Yes. Do invalid attempts consume a turn? No. What happens on a full board with no winner? The result is DRAW.", "kind": "step-1", "problem": "Tic-tac-toe", "step": 1, "slug": "tictactoe"}, {"id": "L074", "number": 74, "module": "P03", "title": "Work through one example", "idea": "On a 3-by-3 board: X plays (0,0), O (1,0), X (0,1), O (1,1), X (0,2). X wins the top row. O cannot make another move. An occupied-cell attempt made earlier would not have changed the turn.", "mental": "There are five accepted moves, the top row belongs to X, and the game result is X_WON. Rejected attempts are not included in the move count.", "code": "", "gotcha": "Coordinates are zero-based in this workshop.", "question": "How many accepted moves in the example?", "options": ["Six", "Five", "Four"], "answer": 1, "explanation": "Five. There are five accepted moves, the top row belongs to X, and the game result is X_WON. Rejected attempts are not included in the move count.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Player", "Game guard", "Board update", "Result check"], "sources": [], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Tic-tac-toe", "step": 2, "slug": "tictactoe"}, {"id": "L075", "number": 75, "module": "P03", "title": "Write the invariants", "idea": "An accepted move fills exactly one previously empty in-bounds cell.\nOnly the player whose turn it is may move.\nA terminal game never accepts another move.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Rejected moves must not increase the move counter.", "question": "Does an occupied-cell attempt consume a turn?", "options": ["No", "Yes", "Only for O"], "answer": 0, "explanation": "No. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Tic-tac-toe", "step": 3, "slug": "tictactoe"}, {"id": "L076", "number": 76, "module": "P03", "title": "Choose objects and ownership", "idea": "Game: owns board, turn, accepted-move count and result.\nBoard: stores marks and answers line checks.\nPlayerId: stable player identity associated with one mark.\nMove: requested row, column and actor.\nGameView: immutable board snapshot, next turn and result.", "mental": "The central consistency owner in this design is Game. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Player identity and mark are different concepts.", "question": "Who owns turn advancement?", "options": ["PlayerId", "Move", "Game"], "answer": 2, "explanation": "Game. Game has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Game", "Board", "PlayerId", "Move"], "sources": [], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Tic-tac-toe", "step": 4, "slug": "tictactoe"}, {"id": "L077", "number": 77, "module": "P03", "title": "Design the public API", "idea": "move either applies one legal move or rejects without changing board, turn or count. A terminal view has no next player. Return a copied board view rather than a mutable array reference.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "GameView move(PlayerId actor, int row, int col);\nGameView view();", "gotcha": "A raw char[][] return value leaks internal state.", "question": "What should view return?", "options": ["Only the array address", "An immutable or defensively copied snapshot", "The writable internal array"], "answer": 1, "explanation": "An immutable or defensively copied snapshot. move either applies one legal move or rejects without changing board, turn or count. A terminal view has no next player. Return a copied board view rather than a mutable array reference.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Tic-tac-toe", "step": 5, "slug": "tictactoe"}, {"id": "L078", "number": 78, "module": "P03", "title": "Draw the state machine", "idea": "A valid nonwinning move switches turns. Winning moves transition directly to a terminal win. If the move fills the board without a winner, transition to DRAW. Check win before draw: the last empty cell can also complete a line.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Test win before full-board draw.", "question": "The final cell fills the board and wins. Result?", "options": ["Win", "Draw", "Keep playing"], "answer": 0, "explanation": "Win. A valid nonwinning move switches turns. Winning moves transition directly to a terminal win. If the move fills the board without a winner, transition to DRAW. Check win before draw: the last empty cell can also complete a line.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["X TURN", "O TURN", "X / O WON", "DRAW"], "sources": [], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Tic-tac-toe", "step": 6, "slug": "tictactoe"}, {"id": "L079", "number": 79, "module": "P03", "title": "Trace the key operation", "idea": "Validate that the game is active, actor is the current player, coordinates are valid and the cell is empty. Write the mark and increment accepted moves. Check only relevant lines or scan the board; if no terminal result, flip the turn.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Flip the turn only after a successful nonterminal move.", "question": "What happens before writing the mark?", "options": ["Switch to the next player", "Declare a draw", "Validate actor, state, bounds and emptiness"], "answer": 2, "explanation": "Validate actor, state, bounds and emptiness. Validate that the game is active, actor is the current player, coordinates are valid and the cell is empty. Write the mark and increment accepted moves. Check only relevant lines or scan the board; if no terminal result, flip the turn.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Player", "Game guard", "Board update", "Result check"], "sources": [], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Tic-tac-toe", "step": 7, "slug": "tictactoe"}, {"id": "L080", "number": 80, cker: checks king safety against the resulting position.\nMoveEffect: all square and metadata changes applied as one unit.", "mental": "The central consistency owner in this design is Game. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A Piece should not mutate an unrelated Game singleton.", "question": "Who commits a legal position change?", "options": ["Piece", "MoveGenerator", "Game"], "answer": 2, "explanation": "Game. Game has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Game", "Position", "Piece", "MoveGenerator"], "sources": ["S20"], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Chess move-validation core", "step": 4, "slug": "chess"}, {"id": "L101", "number": 101, "module": "P05", "title": "Design the public API", "idea": "Keep attack detection separate from full legal-move generation to avoid circular definitions. A candidate move contains source and destination; special moves may require additional data such as promotion piece. Never expose writable board state to callers.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "MoveResult move(PlayerId actor, Move move);\nList<Move> legalMoves(Position position);\nboolean isAttacked(Position p, Square square, Color by);", "gotcha": "Attack detection and full legal-move enumeration must not recurse into each other blindly.", "question": "Why separate isAttacked from legalMoves?", "options": ["To make every move automatically legal", "To avoid circular legality definitions and clarify semantics", "To ignore king safety"], "answer": 1, "explanation": "To avoid circular legality definitions and clarify dation core", "step": 6, "slug": "chess"}, {"id": "L103", "number": 103, "module": "P05", "title": "Trace the key operation", "idea": "Validate ownership and movement geometry, create a candidate position or reversible MoveEffect, then test whether the mover's king is attacked. Commit the whole effect only if safe. Switch turn after commit and assess the opponent's legal responses.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Rollback must restore auxiliary rights as well as board squares.", "question": "When is the candidate committed?", "options": ["Before movement validation", "As soon as the source is nonempty", "After king-safety validation"], "answer": 2, "explanation": "After king-safety validation. Validate ownership and movement geometry, create a candidate position or reversible MoveEffect, then test whether the mover's king is attacked. Commit the whole effect only if safe. Switch turn after commit and assess the opponent's legal responses.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Player", "Game", "Candidate + king check", "New position"], "sources": ["S20"], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Chess move-validation core", "step": 7, "slug": "chess"}, {"id": "L104", "number": 104, "module": "P05", "title": "Read the core Java logic", "idea": "The sketch illustrates an architectural pipeline, not a complete move generator. Copying the position avoids partial rollback bugs in a teaching implementation. All special-move rights belong in the copied position too.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "requireTurn(actor);\nMoveEffect effect = generator.effect(position, move);\nPosition candidate = position.applyCopy(effect);\nif (attacks.isAttacked(candidate,\n        candidate.kingSquare(turn), other(turn)))\n    throw illegalMove();\nposition = candidate;\nturn = other(turn);", "gotcha": "The snippet omits complete piece movement implementations.", "question": "Why use applyCopy in a teaching design?", "options": ["To implement all special moves automatically", "To avoid partial rollback of rejected candidates", "To guarantee perfect performance"], "answer": 1, "explanation": "To avoid partial rollback of rejected candidates. The sketch illustrates an architectural pipeline, not a complete move generator. Copying the position avoids partial rollback bugs in a teaching implementation. All special-move rights belong in the copied position too.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S20"], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Chess move-validation core", "step": 8, "slug": "chess"}, {"id": "L105", "number": 105, "module": "P05", "title": "Handle races and failure", "idea": "Serialize moves per game and version the position for remote clients. A command based on version 12 must not overwrite version 13. AI analysis can read an immutable position snapshot outside the game lock; it cannot commit a move without revalidation.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "An AI result computed on an old position needs revalidation.", "question": "What if a client submits an old position version?", " arts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Chess move-validation core", "step": 10, "slug": "chess"}, {"id": "L107", "number": 107, "module": "P05", "title": "Change one requirement", "idea": "Add castling as a multi-square MoveEffect with king/rook movement, rights and attacked-transit-square checks. Add promotion as an explicit move choice. Avoid scattered booleans that update only part of the position.", "mental": "Piece subclasses can encode movement geometry, while data-driven movement rules may be easier to enumerate. Neither model removes the need for whole-position legality. A full rules engine is substantially beyond this scoped pipeline.", "code": "", "gotcha": "Castling affects multiple squares and several conditions.", "question": "How should castling be represented?", "options": ["Two independently committed public moves", "A validated multi-square effect plus rights changes", "Only a normal king move with no metadata"], "answer": 1, "explanation": "A validated multi-square effect plus rights changes. Add castling as a multi-square MoveEffect with king/rook movement, rights and attacked-transit-square checks. Add promotion as an explicit move choice. Avoid scattered booleans that update only part of the position.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S20"], "level": "Deep", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Chess move-validation core", "step": 11, "slug": "chess"}, {"id": "L108", "number": 108, "module": "P05", "title": "Defend the design", "idea": "I separate pseudo-legal movement from legal game moves. The design protects all position metadata together and exposes a clear extension for multi-square xtension.", "code": "", "gotcha": "Capacity semantics must be stated before testing zero.", "question": "Does a hit count as use?", "options": ["No; only inserts count", "Only when the value changes", "Yes"], "answer": 2, "explanation": "Yes. Does a miss change order? No. Does updating an existing key count as use? Yes. Is capacity zero valid? This baseline rejects it; another contract could implement a no-storage cache.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S05"], "level": "Core", "detail": "Does a miss change order? No. Does updating an existing key count as use? Yes. Is capacity zero valid? This baseline rejects it; another contract could implement a no-storage cache.", "kind": "step-1", "problem": "LRU cache", "step": 1, "slug": "lru"}, {"id": "L110", "number": 110, "module": "P06", "title": "Work through one example", "idea": "Capacity is 2. put(A,1), put(B,2), get(A), put(C,3). After get(A), B is older than A. Adding C evicts B. Updating A to 9 makes A most recent without changing the entry count.", "mental": "After adding C the cache contains A and C. get(B) misses. The recency order is C then A after the final update, from least to most recent.", "code": "", "gotcha": "Insertion order is not access order.", "question": "Which key is evicted by put(C) in the example?", "options": ["C", "B", "A"], "answer": 1, "explanation": "B. After adding C the cache contains A and C. get(B) misses. The recency order is C then A after the final update, from least to most recent.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Caller", "Cache lock", "Lookup + touch", "Value / miss"], "sources": ["S05"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "LRU cache", "step": 2, "slug": "lru"}, {"id": "L111", "number": 111, "module": "P06", "title": "Write the invariants", "idea": "Size never exceeds capacity after a completed operation.\nEach key appears exactly once in both lookup and recency representation.\nThe eviction victim is the least recently accessed retained entry.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Removing only from the list leaks a stale lookup entry.", "question": "What must a custom implementation keep aligned?", "options": ["Hash index and recency list", "Only the values", "Only a hit counter"], "answer": 0, "explanation": "Hash index and recency list. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S05"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "LRU cache", "step": 3, "slug": "lru"}, {"id": "L112", "number": 112, "module": "P06", "title": "Choose objects and ownership", "idea": "LruCache<K,V>: owns capacity, index and recency behavior.\nLinkedHashMap<K,V>: access-ordered storage in the baseline.\nCacheView: optional immutable key-order snapshot for testing.\nEvictionListener: optional effect invoked outside the lock in an extension.", "mental": "The central consistency owner in this design is LruCache. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "An eviction listener is not the owner of recency.", "question": "Who owns recency mutation?", "options": ["EvictionListener", "CacheView", "LruCache"], "answer": 2, "explanation": "LruCache. LruCache has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["LruCache", "LruCache<K,V>", "LinkedHashMap<K,V>", "CacheView"], "sources": ["S05"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "LRU cache", "step": 4, "slug": "lru"}, {"id": "L113", "number": 113, "module": "P06", "title": "Design the public API", "idea": "A cache miss is Optional.empty because null values are prohibited. get is logically a mutation of recency. The key-order view is copied while holding the cache lock and is mainly useful for testing.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "Optional<V> get(K key);\nvoid put(K key, V value);\nList<K> keysLeastToMostRecent();", "gotcha": "Optional.empty is ambiguous if null values are allowed.", "question": "Why prohibit null values here?", "options": ["To eliminate key hashing", "To make absence unambiguous", "Because all maps prohibit null"], "answer": 1, "explanation": "To make absence unambiguous. A cache miss is Optional.empty because null values are prohibited. get is logically a mutation of recency. The key-order view is copied while holding the cache lock and is mainly useful for testing.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S05"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "LRU cache", "step": 5, "slug": "lru"}, {"id": "L114", "number": 114, "module": "P06", "title": "Draw the state machine", "idea": "put creates or updates an entry and makes it most recent. A hit moves an existing entry to most recent. A miss leaves order unchanged. Evic xceeds capacity. In the standard-library baseline, access-order LinkedHashMap maintains the list.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Caller", "Cache lock", "Lookup + touch", "Value / miss"], "sources": ["S05"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "LRU cache", "step": 7, "slug": "lru"}, {"id": "L116", "number": 116, "module": "P06", "title": "Read the core Java logic", "idea": "The true constructor argument selects access order. The remove-eldest condition must be greater than capacity, not greater than or equal. The complete companion rejects nulls and returns copied order views.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "map = new LinkedHashMap<K,V>(16, 0.75f, true) {\n    protected boolean removeEldestEntry(\n            Map.Entry<K,V> eldest) {\n        return size() > capacity;\n    }\n};\n// All cache methods synchronize on one owner.\n// get() changes recency when it hits.", "gotcha": "size() >= capacity evicts one entry too early.", "question": "Which LinkedHashMap constructor mode is needed?", "options": ["Random order", "Access order", "Insertion order"], "answer": 1, "explanation": "Access order. The true constructor argument selects access order. The remove-eldest condition must be greater than capacity, not greater than or equal. The complete companion rejects nulls and returns copied order views.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S05"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "LRU cache", "step": 8, "slug": "lru"}, {"id": "L117", "number": 117, "module": "P06", "title": "Handle races and failure", "idea": "Treat get and put as mutations under the same lock. Synchronizing put but not get still races on access order. Do not invoke a slow or reentrant eviction callback while holding the cache lock; capture the event then invoke it under an explicit delivery policy.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "An unsynchronized get is not a harmless read in an access-order map.", "question": "Must get share the synchronization boundary?", "options": ["Yes; a hit mutates ordering", "No; it only returns a value", "Only when a key is missing"], "answer": 0, "explanation": "Yes; a hit mutates ordering. Treat get and put as mutations under the same lock. Synchronizing put but not get still races on access order. Do not invoke a slow or reentrant eviction callback while holding the cache lock; capture the event then invoke it under an explicit delivery policy.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S05"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "LRU cache", "step": 9, "slug": "lru"}, {"id": "L118", "number": 118, "module": "P06", "title": "Build the test plan", "idea": "The example evicts B, not A.\nUpdating an existing key changes recency but not size.\nA miss leaves the order unchanged.\nCapacity one repeatedly evicts the older entry and rejects null input.", "mental": "For each test, assert both the result and the final state. On rejection, asse ition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S05"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "LRU cache", "step": 11, "slug": "lru"}, {"id": "L120", "number": 120, "module": "P06", "title": "Defend the design", "idea": "The key insight is that get mutates recency. I use one atomic owner and test order as well as values. I can explain the doubly linked list behind the library and isolate TTL as a separate policy.", "mental": "C entries: expected O(1) get and put with suitable hashing; O(C) space. Returning a key-order snapshot costs O(C). Lock contention is not captured by the sequential Big-O statement.", "code": "", "gotcha": "Expected O(1) is not a latency guarantee under contention.", "question": "What does the custom-list version add?", "options": ["Pointer and representation invariants", "Automatic distributed consistency", "A guarantee of no contention"], "answer": 0, "explanation": "Pointer and representation invariants. LinkedHashMap avoids pointer bugs in a practical implementation. A custom doubly linked list demonstrates the underlying algorithm but must maintain head, tail, predecessor, successor and map invariants carefully.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S05"], "level": "Core", "detail": "LinkedHashMap avoids pointer bugs in a practical implementation. A custom doubly linked list demonstrates the underlying algorithm but must maintain head, tail, predecessor, successor and map invariants carefully.", "kind": "step-12", "problem": "LRU cache", "step": 12, "slug": "lru"}, {"id": "L121", "number": 121, "module": "P07", "title": "Problem statement and scope", "idea": "Design a fixed-capacity least-frequently-used cache. Every successful get and update increases the entry's frequency. When capacity is exceeded, evict the lowest-frequency entry; among equal frequencies evict the least recently used.", "mental": "Positive capacity, initial frequency one, no TTL, no frequency decay and no loader. This is a guided algorithm-and-ownership design; the complete Java companion implements LRU, not LFU.", "code": "", "gotcha": "LFU is not LRU with a renamed variable.", "question": "What breaks an LFU tie here?", "options": ["Alphabetical key order", "Random choice", "Least recent use within the same frequency"], "answer": 2, "explanation": "Least recent use within the same frequency. Do updates count as accesses? Yes. Do misses increment frequency? No. Are old popular entries ever aged down? Not in the core; decay changes the data structure and policy.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Deep", "detail": "Do updates count as accesses? Yes. Do misses increment frequency? No. Are old popular entries ever aged down? Not in the core; decay changes the data structure and policy.", "kind": "step-1", "problem": "LFU cache with recency tie-break", "step": 1, "slug": "lfu"}, {"id": "L122", "number": 122, "module": "P07", "title": "Work through one example", "idea": "Capacity 2: put(A,1), put(B,2), get(A), put(C,3). A has frequency 2 and B has 1, so B leaves. After get(C), A and C both have 2; A is older within that frequency and is the next victim.", "mental": "The eviction decision compares frequency first and recency second. A globally recent item can still lose if its frequency is lower.", "code": "", "gotcha": "Recency matters only within an equal-frequency tie.", "question": "After A and C both reach frequency 2, who is older?", "options": ["Neither can be evicted", "A", "C"], "answer": 1, "explanation": "A. The eviction decision compares frequency first and n this design is LfuCache. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Entry does not independently decide global eviction.", "question": "Who owns minFrequency?", "options": ["Entry", "CacheView", "LfuCache"], "answer": 2, "explanation": "LfuCache. LfuCache has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["LfuCache", "Entry", "FrequencyBucket", "KeyIndex"], "sources": [], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "LFU cache with recency tie-break", "step": 4, "slug": "lfu"}, {"id": "L125", "number": 125, "module": "P07", "title": "Design the public API", "idea": "A hit promotes the entry to the next frequency and the most recent end of that bucket. Updating a value does the same. Inserting a new key may first evict one existing entry, then creates frequency one and sets minFrequency to one.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "Optional<V> get(K key);\nvoid put(K key, V value);\nCacheView snapshot();", "gotcha": "Misses should not create phantom frequency records.", "question": "What does updating an existing key do?", "options": ["Reset frequency to zero", "Replace value and count as access", "Create a second entry"], "answer": 1, "explanation": "Replace value and count as access. A hit promotes the entry to the next frequency and the most recent end of that bucket. Updating a value does the same. Inserting a new key may first evict one existing entry, then creates frequency one and sets minFrequency to one.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return inimum and the bucket becomes empty, this promotion makes f+1 the new minimum. Add the entry to the most-recent end of bucket f+1.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Insertion must reset the minimum to one.", "question": "What does a new insertion set the minimum to?", "options": ["The largest existing frequency", "Zero", "One"], "answer": 2, "explanation": "One. On a hit, remember old frequency f and remove the entry from bucket f. If f equals the current minimum and the bucket becomes empty, this promotion makes f+1 the new minimum. Add the entry to the most-recent end of bucket f+1.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Caller", "Key index", "Frequency buckets", "Victim / value"], "sources": [], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "LFU cache with recency tie-break", "step": 7, "slug": "lfu"}, {"id": "L128", "number": 128, "module": "P07", "title": "Read the core Java logic", "idea": "This contextual promotion sketch assumes a retained hit and no frequency overflow. Eviction, insertion and bucket deletion need their own updates. Use a bounded-counter policy or wider representation for an unbounded lifetime; silent wraparound breaks ordering.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "int old = entry.frequency;\nBucket from = buckets.get(old);\nfrom.remove(entry);\nif (from.isEmpty() && minFrequency == old)\n    minFrequency = old + 1;\nentry.frequency = old + 1;\nbuckets.computeIfAbsent(old + 1, k -> new Bucket())\n       .addMostRecent(entry);", "gotcha": "Frequency counters can overflow in long-lived processes.", "question": "What is missing from the promotion sketch?", "options": ["A need for any invariant", "Insertion and eviction handling", "The concept of a key"], "answer": 1, "explanation": "Insertion and eviction handling. This contextual promotion sketch assumes a retained hit and no frequency overflow. Eviction, insertion and bucket deletion need their own updates. Use a bounded-counter policy or wider representation for an unbounded lifetime; silent wraparound breaks ordering.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "LFU cache with recency tie-break", "step": 8, "slug": "lfu"}, {"id": "L129", "number": 129, "module": "P07", "title": "Handle races and failure", "idea": "Protect promotion and eviction under one owner lock in a simple baseline. Thread-safe bucket containers do not protect the invariant across buckets and the key index. Snapshot code must not expose entries while they are between buckets.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Separate safe containers do not imply safe cross-bucket movement.", "question": "What must be atomic?", "options": ["Removal from old bucket and addition to new bucket", "Only reading the value", "Only allocating a bucket object"], "answer": 0, "explanation": "Removal from old bucket and addition to new bucket. Protect promotion and eviction under one owner lock in a simple baseline. Thread-safe bucket containers do not protect the invariant across buckets and the key index. Snapshot code must not he next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S13"], "level": "Core", "detail": "Is a burst allowed? Yes, up to the current tokens. Does an idle period accumulate beyond capacity? No. Is rejection retry-safe? It does not spend a token; a later attempt is a new admission check.", "kind": "step-1", "problem": "Token-bucket rate limiter", "step": 1, "slug": "rate"}, {"id": "L134", "number": 134, "module": "P08", "title": "Work through one example", "idea": "C=3 and R=1 token/second. At time zero, three calls pass and a fourth fails. After half a second, the bucket has 0.5 tokens and still rejects. After another half second, one request passes.", "mental": "A full bucket permits a burst. Refill adds elapsedTime times rate and is capped at C. It does not reset all tokens at a fixed wall-clock boundary.", "code": "", "gotcha": "Half a token cannot pay for a one-token request.", "question": "After spending all tokens, is 0.5 token enough?", "options": ["Only for the fourth request", "No", "Yes"], "answer": 1, "explanation": "No. A full bucket permits a burst. Refill adds elapsedTime times rate and is capped at C. It does not reset all tokens at a fixed wall-clock boundary.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Request", "Sample elapsed time", "Refill + spend", "Allow / reject"], "sources": ["S13"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Token-bucket rate limiter", "step": 2, "slug": "rate"}, {"id": "L135", "number": 135, "module": "P08", "title": "Write the invariants", "idea": "Tokens remain within zero and capacity, allowing small floating-point tolerance.\nA successful tryAcquire spends exactly one token.\nRefill time and token consumption are updated in the same atomic operation.", "mental": "Treat these as assertions after every , "problem": "Token-bucket rate limiter", "step": 4, "slug": "rate"}, {"id": "L137", "number": 137, "module": "P08", "title": "Design the public API", "idea": "tryAcquire does not block. The ticker contract is monotonic over the comparison horizon; it is not an Instant timestamp. Validate finite configuration values, and do not permit NaN to bypass comparisons.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "boolean tryAcquire();\ninterface Ticker { long readNanos(); }", "gotcha": "Wall-clock timestamps and elapsed nanoseconds are not interchangeable.", "question": "Which clock source matches elapsed refill?", "options": ["A random timestamp", "An injected monotonic ticker", "A formatted local date string"], "answer": 1, "explanation": "An injected monotonic ticker. tryAcquire does not block. The ticker contract is monotonic over the comparison horizon; it is not an Instant timestamp. Validate finite configuration values, and do not permit NaN to bypass comparisons.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S13"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Token-bucket rate limiter", "step": 5, "slug": "rate"}, {"id": "L138", "number": 138, "module": "P08", "title": "Draw the state machine", "idea": "There is no separate reset event. Every admission samples elapsed time, computes replenishment, caps the balance and then decides. A long idle period restores at most capacity, not unlimited historical credit.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "An idle bucket cannot accumulate beyond capacity.", "question": "What happens after a very long idle period?", "options": ["Tokens cap at capacity", "Tokens grow without limit", "Capacity permanently doubles"], "answer": 0, "explanation": "Tokens cap at capacity. There is no separate reset event. Every admission samples elapsed time, computes replenishment, caps the balance and then decides. A long idle period restores at most capacity, not unlimited historical credit.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["TOKENS AVAILABLE", "SPEND", "EMPTY", "REFILL"], "sources": ["S13"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Token-bucket rate limiter", "step": 6, "slug": "rate"}, {"id": "L139", "number": 139, "module": "P08", "title": "Trace the key operation", "idea": "Read the ticker while holding the bucket lock. Compute elapsed nanoseconds from the prior sample, reject an invalid backwards test ticker, refill proportionally and update the sample. If tokens are at least one, decrement and accept; otherwise reject.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Updating last incorrectly can refill the same elapsed period twice.", "question": "What must precede spending?", "options": ["A calendar-day reset", "Deleting the bucket", "Refill based on newly elapsed time"], "answer": 2, "explanation": "Refill based on newly elapsed time. Read the ticker while holding the bucket lock. Compute elapsed nanoseconds from the prior sample, reject an invalid backwards test ticker, refill proportionally and update the sample. If tokens are at least one, decrement and accept; otherwise reject.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Request", "Sample elapsed time", "Refill + spend", "Allow / reject"], "sources": ["S13"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Token-bucket rate limiter", "step": 7, "slug": "rate"}, {"id": "L140", "number": 140, "module": "P08", "title": "Read the core Java logic", "idea": "This is an admission-control teaching implementation, not a billing-grade exact quota. Floating-point behavior near boundaries needs tests. The elapsed-time horizon must stay within signed-long difference limits. Wall-clock changes should not mint tokens.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "synchronized boolean tryAcquire() {\n    long now = ticker.readNanos();\n    long elapsed = now - last;\n    if (elapsed < 0) throw badTicker();\n    tokens = Math.min(capacity,\n        tokens + elapsed / 1e9 * rate);\n    last = now;\n    if (tokens < 1.0) return false;\n    tokens -= 1.0;\n    return true;\n}", "gotcha": "NaN or infinite configuration values need validation.", "question": "Why validate finite capacity and rate?", "options": ["To ensure a fixed thread count", "NaN and infinity break meaningful comparisons", "To make HashMap ordered"], "answer": 1, "explanation": "NaN and infinity break meaningful comparisons. This is an admission-control teaching implementation, not a billing-grade exact quota. Floating-point behavior near boundaries needs tests. The elapsed-time horizon must stay within signed-long difference limits. Wall-clock changes should not mint tokens.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S13"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Token-bucket rate limiter", "step": 8, "slug": "rate"}, {"id": "L141", "number": 141, "module": "P08", "title": "Handle races and failure", "idea": "Two callers must not both observe the same final token and spend it. One lock around refill and decrement is sufficient for the in-process bucket. Across several servers, independent local buckets allow a combined burst larger than C; define a shared or partitioned quota separately.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Local buckets do not enforce one global quota.", "question": "Two callers race for one token. Expected successes?", "options": ["One", "Two", "Always zero"], "answer": 0, "explanation": "One. Two callers must not both observe the same final token and spend it. One lock around refill and decrement is sufficient for the in-process bucket. Across several servers, independent local buckets allow a combined burst larger than C; define a shared or partitioned quota separately.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S13"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Token-bucket rate limiter", "step": 9, "slug": "rate"}, {"id": "L142", "number": 142, "module": "P08", "title": "Build the test plan", "idea": "Exactly C immediate calls pass from a full integer-capacity bucket.\nA half-token refill still rejects a one-token request.\nA long idle period does not exceed capacity.\nMany simultaneous contenders for one token produce one success.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Sleep-based tests are slower and less precise than an injected ticker.", "question": "Which test avoids real waiting?", "options": ["Sleep near a boundary", "Use the current calendar day", "Advance a fake ticker"], "answer": 2, "explanation": "Advance a fake ticker. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S13"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Token-bucket rate limiter", "step": 10, "slug": "rate"}, {"id": "L143", "number": 143, "module": "P08", "title": "Change one requirement", "idea": "Add per-user buckets with a registry and an idle-removal policy. Removing a bucket while it has active callers can accidentally create two independent buckets for one user. Define registry ownership and eviction carefully.", "mental": "Token bucket supports bursts with a smooth refill rule. Fixed windows are simpler but allow bursts around a boundary. A sliding log tracks a different exact-window contract at higher storage cost. None is universally correct without requirements.", "code": "", "gotcha": "Racy registry eviction can duplicate one user's budget.", "question": "What can registry eviction accidentally create?", "options": ["A guaranteed global quota", "Two live buckets for the same key", "An immutable rate"], "answer": 1, "explanation": "Two live buckets for the same key. Add per-user buckets with a registry and an idle-removal policy. Removing a bucket while it has active callers can accidentally create two independent buckets for one user. Define registry ownership and eviction carefully.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S13"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Token-bucket rate limiter", "step": 11, "slug": "rate"}, {"id": "L144", "number": 144, "module": "P08", "title": "Defend the design", "idea": "I first distinguish rate from concurrency: the bucket limits admissions over time, not the number of requests currently running. I inject elapsed time and test exact boundaries without sleeping.", "mental": "O(1) time and space per bucket. A registry for U active users is O(U) space before eviction. This sequential cost does not describe contention or distributed coordination.", "code": "", "gotcha": "Different limiter algorithms implement different traffic contracts.", "question": "What does a token bucket not directly limit?", "options": ["Number of requests currently executing", "Admissions over time", "Available burst tokens"], "answer": 0, "explanation": "Number of requests currently executing. Token bucket supports bursts with a smooth refill rule. Fixed windows are simpler but allow bursts around a boundary. A sliding log tracks a different exact-window contract at higher storage cost. None is universally correct without requirements.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S13"], "level": "Core", "detail": "Token bucket supports bursts with a smooth refill rule. Fixed windows are simpler but allow bursts around a boundary. A sliding log tracks a different exact-window contract at higher storage cost. None is universally correct without requirements.", "kind": "step-12", "problem": "Token-bucket rate limiter", "step": 12, "slug": "rate"}, {"id": "L145", "number": 145, "module": "P09", "title": "Problem statement and scope", "idea": "Design a logger supporting levels, formatting and multiple output sinks. A log call below the threshold is ignored. Accepted events carry an event timestamp, level and immutable message data and are sent to configured sinks.", "mental": "Synchronous in-process dispatch in the core. Formatting and sinks are replaceable. No durability or exactly-once guarantee. Asynchronous queues, rotation and remote collection are extensions.", "code": "", "gotcha": "A logger can block its caller even when the API returns void.", "question": "What does the core promise?", "options": ["Durable exactly-once remote storage", "Unlimited asynchronous buffering", "Synchronous delivery with explicit failure handling"], "answer": 2, "explanation": "Synchronous delivery with explicit failure handling. What happens if one sink fails? Continue to other sinks and return or report collected failures through a separate error policy. Are sink calls serialized? The sink contract must state its own concurrency behavior.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S18"], "level": "Core", "detail": "What happens if one sink fails? Continue to other sinks and return or report collected failures through a separate error policy. Are sink calls serialized? The sink contract must state its own concurrency behavior.", "kind": "step-1", "problem": "Extensible logging library", "step": 1, "slug": "logger"}, {"id": "L146", "number": 146, "module": "P09", "title": "Work through one example", "idea": "Threshold INFO, sinks Console and File. DEBUG is ignored. ERROR creates one event and sends it to both sinks. If File fails, Console still receives the event and the failure is reported without recursively logging through the same broken path.", "mental": "Filtering happens before expensive event construction when possible. One failed destination must not silently prevent all remaining destinations unless fail-fast semantics were explicitly chosen.", "code": "", "gotcha": "Formatting DEBUG messages before filtering wastes work.", "question": "If File fails after Console succeeds, what happens?", "options": ["Recursively log forever", "Report the failure and keep the successful delivery", "Undo the console output"], "answer": 1, "explanation": "Report the failure and keep the successful delivery. Filtering happens before expensive event construction when possible. One failed destination must not silently prevent all remaining destinations unless fail-fast semantics were explicitly chosen.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Caller", "Level filter", "Event snapshot", "Sinks"], "sources": ["S18"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Extensible logging library", "step": 2, "slug": "logger"}, {"id": "L147", "number": 147, "module": "P09", "title": "Write the invariants", "idea": "Events below threshold produce no sink writes.\nAccepted events are immutable snapshots of caller data.\nSink failure handling must not recurse unboundedly through the same logger.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Passing mutable context lets later changes rewrite history.", "question": "What should a below-threshold event do?", "options": ["Produce no sink writes", "Write only to the first sink", "Always format and flush"], "answer": 0, "explanation": "Produce no sink writes. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S18"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Extensible logging library", "step": 3, "slug": "logger"}, {"id": "L148", "number": 148, "module": "P09", "title": "Choose objects and ownership", "idea": "Logger: filters events and coordinates delivery.\nLogEvent: timestamp, level, message and copied context.\nFormatter: pure conversion from event to bytes or text.\nSink: writes one formatted or structured event.\nErrorHandler: handles sink failures outside the normal logging path.", "mental": "The central consistency owner in this design is Logger. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Formatting and output are distinct responsibilities.", "question": "Who coordinates sink delivery?", "options": ["Formatter", "LogEvent", "Logger"], "answer": 2, "explanation": "Logger. Logger has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Logger", "LogEvent", "Formatter", "Sink"], "sources": ["S18"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Extensible logging library", "step": 4, "slug": "logger"}, {"id": "L149", "number": 149, "module": "P09", "title": "Design the public API", "idea": "Choose whether sinks receive structured events or formatted strings; do not let every sink interpret arbitrary mutable caller objects. Redact sensitive fields before output. close must define whether the logger owns and closes its sinks.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "LogResult log(Level level, String message);\ninterface Sink { void write(LogEvent event); }\ninterface Formatter { String format(LogEvent e); }", "gotcha": "A log library should not accidentally print secrets by default.", "question": "Why copy structured context?", "options": ["To make every object serializable", "To capture event-time data rather than later mutations", "To guarantee disk durability"], "answer": 1, "explanation": "To capture event-time data rather than later mutations. Choose whether sinks receive structured events or formatted strings; do not let every sink interpret arbitrary mutable caller objects. Redact sensitive fields before output. close must define whether the logger owns and closes its sinks.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S18"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Extensible logging library", "step": 5, "slug": "logger"}, {"id": "L150", "number": 150, "module": "P09", "title": "Draw the state machine", "idea": "The synchronous baseline rejects calls after close. Closing an already-closed logger is a no-op by chosen contract. For asynchronous logging, CLOSING must specify drain versus discard and how waiting callers are released.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Close semantics matter even for a utility library.", "question": "What must close specify?", "options": ["Ownership and behavior of in-flight and later writes", "Only the final filename", "The number of log levels"], "answer": 0, "explanation": "Ownership and behavior of in-flight and later writes. The synchronous baseline rejects calls after close. Closing an already-closed logger is a no-op by chosen contract. For asynchronous logging, CLOSING must specify drain versus discard and how waiting callers are released.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["OPEN", "FILTER / DELIVER", "CLOSING", "CLOSED"], "sources": ["S18"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Extensible logging library", "step": 6, "slug": "logger"}, {"id": "L151", "number": 151, "module": "P09", "title": "Trace the key operation", "idea": "Read a stable configuration snapshot, filter, build one event using the clock, then iterate a sink snapshot. Catch individual sink exceptions, continue according to policy, and pass failures to a nonrecursive error handler. Avoid holding a configuration lock across I/O.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Do not hold a global configuration lock during slow I/O.", "question": "Where should slow I/O occur?", "options": ["Inside every setter lock", "Inside the LogEvent constructor", "Outside a configuration-mutation lock"], "answer": 2, "explanation": "Outside a configuration-mutation lock. Read a stable configuration snapshot, filter, build one event using the clock, then iterate a sink snapshot. Catch individual sink exceptions, continue according to policy, and pass failures to a nonrecursive error handler. Avoid holding a configuration lock across I/O.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Caller", "Level filter", "Event snapshot", "Sinks"], "sources": ["S18"], "level": "Core", "detail": "This sequen
