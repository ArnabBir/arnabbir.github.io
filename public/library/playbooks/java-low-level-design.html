 <div class="tabpanel" id="panel-practice" role="tabpanel" aria-labelledby="tab-practice" ${tab!=='practice'?'hidden':''}><h2>Make the design yours</h2>${para(c.practice)}<div class="callout"><strong>Explain out loud</strong><p>What must remain true? Who owns the rule? Where does the change become atomic? What happens on rejection?</p></div><label for="lessonNote">Your notes, test cases or pseudocode</label><textarea id="lessonNote" maxlength="20000" placeholder="Write your answer before opening the solution again."></textarea><div class="section"><h3>Schedule a review</h3><p class="small muted">Again: tomorrow. Hard: half the current interval, at least one day. Good: grow the interval, up to 30 days. This is a simple practice schedule, not a mastery certificate.</p><div class="btns"><button data-rating="again">Again</button><button data-rating="hard">Hard</button><button data-rating="good" class="primary">Good</button></div></div><button id="launchLabButton">Open interactive labs</button></div>`;
 $('lessonNote').value=state.notes[c.id]||'';
 if(quizSelection!==null)showQuizResult(quizSelection,false);
 updatePosition();

 return `<div class="diagram">${svg}</div><div class="labtoolbar">${field('Room',labSelect('room',[['R1','R1'],['R2','R2']],s.room))}${field('Start hour',labInput('meetStart',s.start,'number','min="0" max="23"'))}${field('End hour',labInput('meetEnd',s.end,'number','min="1" max="24"'))}</div><div class="btns">${labBtn('book','Book interval','primary')}</div><div class="labtoolbar">${field('Reservation to cancel',labSelect('meetingId',[['','Choose a reservation'],...s.bookings.map(b=>[b.id,`${b.id}: ${b.room} [${b.start},${b.end}) ${b.active?'active':'cancelled'}`])],s.chosen))}</div>${labBtn('meetingCancel','Cancel reservation')}<p class="section small">Conflict rule: newStart &lt; oldEnd AND oldStart &lt; newEnd. Try [9,10), then [10,11), then [9,11) in R1.</p>`;
 }
 case 'inventory':return `<div class="labtoolbar">${field('Protocol',labSelect('raceMode',[['broken','Broken: separate read / check / commit'],['atomic','Safe: atomic check + reserve']],s.mode))}</div>${labBtn('raceMode','Apply protocol and reset')}<div class="stats"><div class="stat"><strong>1</strong><span>on hand</span></div><div class="stat"><strong>${s.reserved}</strong><span>reserved</span></div><div class="stat"><strong class="${s.reserved<=1?'good':'bad'}">${s.reserved<=1?'HOLDS':'BROKEN'}</strong><span>reserved &lt;= on hand</span></div></div><table><tr><th>Request</th><th>Next step</th><th>Read snapshot</th><th>Result</th></tr>${['A','B'].map(k=>{const t=s.threads[k];return `<tr><td>${k}</td><td>${s.mode==='atomic'?(t.pc?'done':'atomic operation'):['read available','check snapshot','commit if allowed','done'][t.pc]}</td><td>${t.snapshot??'-'}</td><td>${t.pc===(s.mode==='atomic'?1:3)?t.ok?'reserved':'rejected':'pending'}</td></tr>`;}).join('')}</table><div class="btns section">${labBtn('stepA','Step request A','primary')}${labBtn('stepB','Step request B')}${labBtn('raceDemo','Run adversarial schedule')}</div><p class="small">In the broken model, commit trusts an earlier observation. The safe model combines the capacity check and mutation inside one consistency boundary. This does not simulate every JVM execution.</p>`;
 case 'wallet':return `<div class="stats"><div class="stat"><strong>${s.balances.A}</strong><span>Account A</span></div><div class="stat"><strong>${s.balances.B}</strong><span>Account B</span></div><div class="stat"><strong>${s.balances.A+s.balances.B}</strong><span>conserved total</span></div><div class="stat"><strong>${Object.keys(s.requests).length}</strong><span>successful request keys</span></div></div><div class="labtoolbar">${field('From',labSelect('walletFrom',[['A','A'],['B','B']],s.from))}${field('To',labSelect('walletTo',[['A','A'],['B','B']],s.to))}${field('Amount',labInput('walletAmount',s.amount,'number','min="1" max="1000000000"'))}${field('Idempotency key',labInput('walletKey',s.key,'text','maxlength="40"'))}</div>${labBtn('transfer','Submit transfer','primary')}<p class="section small">Submit K1 / A to B / 30 twice. Then reuse K1 with 31. The replay has no second debit; a changed payload is a conflict, not a new transfer.</p>`;
 case 'editor':return `<div class="laboutput"><h3>Document</h3><pre id="editorText">${esc(s.text)||'(empty)'}</pre><p class="small">UTF-16 length: ${s.text.length}. Undo depth: ${s.undo.length}; redo depth: ${s.redo.length}.</p></div><div class="labtoolbar">${field('Position',labInput('editPos',s.pos,'number','min="0"'))}${field('Text to insert',labInput('editText',s.insert,'text','maxlength="100"'))}${field('Delete length',labInput('editLength',s.length,'number','min="0"'))}</div><div class="btns">${labBtn('insert','Insert','primary')}${labBtn('delete','Delete range')}${labBtn('undo','Undo')}${labBtn('redo','Redo')}</div><p class="section small">Insert X at 1, undo, then insert Y at 1. Redo must be empty: the old X branch is no longer your future.</p>`;
 case 'elevator':{
 let svg='<svg viewBox="0 0 600 340" role="img" aria-label="Elevator floors and pending stops">';for(let f=0;f<=8;f++){const y=305-f*35;svg+=`<line x1="65" x2="540" y1="${y}" y2="${y}" stroke="currentColor" opacity=".15"/><text x="30" y="${y+5}" font-size="14" fill="currentColor">${f}</text>`;if(s.stops.includes(f))svg+=`<circle cx="500" cy="${y-8}" r="9" fill="var(--accent)"/><text x="395" y="${y-3}" font-size="12" fill="currentColor">requested</text>`;if(f===s.floor)svg+=`<rect x="110" y="${y-28}" width="245" height="30" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="232" y="${y-8}" text-anchor="middle" font-size="14" fill="currentColor">${s.open?'DOORS OPEN':'DOORS CLOSED'} / ${s.direction>0?'UP':s.direction<0?'DOWN':'IDLE'}</text>`;}svg+='</svg>';
 return `<div class="diagram">${svg}</div><div class="labtoolbar">${field('Requested floor',labInput('elevFloor',s.next,'number','min="0" max="8"'))}</div><div class="btns">${labBtn('requestStop','Request stop')}${labBtn('tick','Advance one tick','primary')}</div><p class="section small">Tick ${s.tick}. Pending: ${s.stops.length?s.stops.slice().sort((a,b)=>a-b).join(', '):'none'}. A door-open tick closes doors without moving. A reached stop opens doors; pending requests in the current direction are served before reversing.</p>`;
 }
 case 'pubsub':return `<div class="grid"><div class="box"><h3>Live registry</h3>${s.live.length?s.live.map(x=>`<span class="chip">${x.name} #${x.id}</span>`).join(''):'Empty'}</div><div class="box"><h3>Captured publication</h3>${s.snapshot===null?'<p>Capture a snapshot first.</p>':s.snapshot.map((x,i)=>`<span class="chip ${i===s.cursor?'active':''}">${i<s.cursor?'done: ':''}${x.name} #${x.id}</span>`).join('')||'Empty snapshot'}</div></div><div class="btns section">${labBtn('capture','Capture publication','primary')}${labBtn('deliver','Deliver next callback')}${labBtn('removeB','Unsubscribe live B')}${labBtn('registerB','Subscribe another B')}</div><label class="row"><input id="busThrows" type="checkbox" ${s.throws?'checked':''}> Make B throw a simulated RuntimeException</label><p class="section small">Capture A and B, then unsubscribe B before delivery. B still appears in that captured publication. Subscribe another B: its new token belongs to later publications, not this snapshot.</p>`;
}}
function renderLabs(){const meta=LAB_META.find(m=>m[0]===currentLab)||LAB_META[0];currentLab=meta[0];const s=LABS[currentLab];$('labsView').innerHTML=`<div class="card"><div class="eyebrow">Change the state. Observe the invariant.</div><h1>Interactive design laboratory</h1><label for="labSelect">Choose an experiment</label>${labSelect('labSelect',LAB_META.map(m=>[m[0],m[1]]),currentLab)}<h2 class="section">${esc(meta[2])}</h2><p class="labnote">${esc(meta[3])}</p>${renderLabBody(currentLab)}<div class="row spread section"><h3>Event log</h3>${labBtn('reset','Reset this lab')}</div><div class="lablog" role="log" aria-live="polite">${s.log.map(l=>`<div>${esc(l)}</div>`).join('')||'<div>No actions yet. Predict the result before clicking.</div>'}</div><details><summary>How to learn from the experiment</summary><p>Name the invariant. Predict the next state. Try one command that should be rejected, one boundary and one replay. Then find the corresponding problem in Study and write its Java test.</p><p>Lab state is temporary and resets on reload. Progress export saves lesson notes and mock work, not these experiments. These deterministic models demonstrate chosen rules; they are not benchmarks, a JVM, an exhaustive concurrency explorer or production services.</p></details></div>`;}
function raceStep(s,k){const t=s.threads[k];if(s.mode==='atomic'){if(t.pc)return labLog(s,k+': already finished.');t.snapshot=1-s.reserved;t.ok=t.snapshot>=1;if(t.ok)s.reserved++;t.pc=1;return labLog(s,k+': atomic check + reserve -> '+(t.ok?'accepted':'rejected'));}
 if(t.pc===0){t.snapshot=1-s.reserved;t.pc++;labLog(s,k+': read available = '+t.snapshot);}else if(t.pc===1){t.ok=t.snapshot>=1;t.pc++;labLog(s,k+': old snapshot permits reserve? '+t.ok);}else if(t.pc===2){if(t.ok)s.reserved++;t.pc++;labLog(s,k+': '+(t.ok?'committed; total reserved = '+s.reserved:'rejected'));}else labLog(s,k+': already finished.');}
function actLab(action){let s=LABS[currentLab];if(action==='reset'){LABS[currentLab]=initialLab(currentLab);renderLabs();return;}try{switch(currentLab){
 case 'seats':{
 s.owner=$('seatOwner').value;s.selected=[...document.querySelectorAll('[data-seat]:checked')].map(x=>x.dataset.seat);s.chosen=$('seatHold').value;
 if(action==='time1'||action==='time5'){s.now+=action==='time1'?1:5;labLog(s,'Manual time is now '+s.now+'. Expiry is checked by the operation, not a background timer.');break;}
 if(action==='hold'){if(!s.selected.length)throw Error('Choose at least one seat.');if(s.selected.some(k=>s.holds.some(h=>holdLive(h,s)&&h.seats.includes(k))))throw Error('At least one selected seat is unavailable. No seat was changed.');const h={id:'H'+s.next++,owner:s.owner,seats:[...s.selected],state:'HELD',expires:s.now+5};s.holds.push(h);s.chosen=h.id;labLog(s,`${h.id}: ${h.owner} holds ${h.seats.join(', ')} until t=${h.expires}.`);break;}
 const h=s.holds.find(h=>h.id===s.chosen);if(!h)throw Error('Select a reservation target.');if(h.owner!==s.owner)throw Error('Customer does not own this hold.');
 if(action==='confirm'){if(h.state==='CONFIRMED'){labLog(s,h.id+': same confirmation returned; no new effect.');break;}if(h.state!=='HELD')throw Error('Hold is not active.');if(s.now>=h.expires)throw Error('Hold has expired; confirmation rejected.');h.state='CONFIRMED';labLog(s,h.id+': confirmed.');}
 if(action==='cancel'){if(h.state==='CONFIRMED')throw Error('Confirmed holds cannot be cancelled in this scoped exercise.');if(h.state==='CANCELLED'||h.state==='EXPIRED'){labLog(s,h.id+': same terminal result; no new effect.');break;}h.state=s.now>=h.expires?'EXPIRED':'CANCELLED';labLog(s,h.id+': '+h.state+'. Newer holds are untouched.');}break;
 }
 case 'lru':s.key=$('lruKey').value.trim();s.value=$('lruValue').value;if(action==='capacity'){s.cap=labInt('lruCap',1,5);s.entries=[];labLog(s,'Capacity changed to '+s.cap+'; cache cleared.');break;}if(!s.key)throw Error('Key must not be empty.');let at=s.entries.findIndex(([k])=>k===s.key);if(action==='get'){if(at<0)labLog(s,s.key+': miss; order unchanged.');else{const e=s.entries.splice(at,1)[0];s.entries.push(e);labLog(s,s.key+': hit '+e[1]+'; moved to most recent.');}}if(action==='put'){if(at>=0)s.entries.splice(at,1);s.entries.push([s.key,s.value]);const evicted=s.entries.length>s.cap?s.entries.shift():null;labLog(s,s.key+': stored'+(evicted?'; evicted '+evicted[0]:''));}break;
 case 'vending':if(action==='coin10'||action==='coin20'){s.credit+=action==='coin10'?10:20;labLog(s,'Credit is '+s.credit+'.');}if(action==='buy'){if(s.stock<=0)throw Error('Sold out. Credit is unchanged; cancel to refund.');if(s.credit<30)throw Error('Insufficient credit. Stock and credit are unchanged.');const change=s.credit-30;s.stock--;s.credit=0;labLog(s,'Dispensed tea; returned '+change+'; session returned to IDLE.');}if(action==='refund'){const r=s.credit;s.credit=0;labLog(s,'Refunded '+r+'; no stock changed.');}break;
 case 'split':s.amount=labInt('splitAmount',0,1000000000);s.count=labInt('splitCount',2,6);s.payer=labInt('splitPayer',0,s.count-1);labLog(s,`${s.amount} split across ${s.count}; first ${s.amount%s.count} participant(s) receive one remainder unit.`);break;
 case 'meeting':s.room=$('room').value;s.start=labInt('meetStart',0,23);s.end=labInt('meetEnd',1,24);s.chosen=$('meetingId').value;if(action==='book'){if(s.start>=s.end)throw Error('Start must be before end.');if(s.bookings.some(b=>b.active&&b.room===s.room&&s.start<b.end&&b.start<s.end))throw Error('Overlap rejected; no new reservation.');const b={id:'M'+s.next++,room:s.room,start:s.start,end:s.end,active:true};s.bookings.push(b);s.chosen=b.id;labLog(s,`${b.id}: reserved ${b.room} [${b.start},${b.end}).`);}else if(action==='meetingCancel'){const b=s.bookings.find(b=>b.id===s.chosen);if(!b)throw Error('Choose a reservation.');labLog(s,b.id+(b.active?': cancelled.':': already cancelled; same result.'));b.active=false;}break;
 case 'inventory':if(action==='raceMode'){const mode=$('raceMode').value;LABS.inventory=initialLab('inventory');s=LABS.inventory;s.mode=mode;labLog(s,'Protocol set to '+mode+'.');}if(action==='stepA'||action==='stepB')raceStep(s,action.slice(-1));if(action==='raceDemo'){const mode=s.mode;LABS.inventory=initialLab('inventory');s=LABS.inventory;s.mode=mode;for(const k of mode==='atomic'?['A','B']:['A','B','A','B','A','B'])raceStep(s,k);}break;
 case 'wallet':s.from=$('walletFrom').value;s.to=$('walletTo').value;s.amount=labInt('walletAmount',1,1000000000);s.key=$('walletKey').value.trim();if(!s.key)throw Error('Idempotency key is required.');if(s.from===s.to)throw Error('Source and destination must differ.');const prior=s.requests[s.key];if(prior){if(prior.from!==s.from||prior.to!==s.to||prior.amount!==s.amount)throw Error('Key conflict: the successful original payload differs.');labLog(s,s.key+': prior receipt replayed; balances unchanged.');break;}if(s.balances[s.from]<s.amount)throw Error('Insufficient balance. Neither account changed; key is not retained.');s.balances[s.from]-=s.amount;s.balances[s.to]+=s.amount;s.requests[s.key]={from:s.from,to:s.to,amount:s.amount};labLog(s,`${s.key}: committed ${s.amount} from ${s.from} to ${s.to}. Total remains 120.`);break;
 case 'editor':if(action==='undo'){if(!s.undo.length)throw Error('Nothing to undo.');s.redo.push(s.text);s.text=s.undo.pop();labLog(s,'Restored previous snapshot.');break;}if(action==='redo'){if(!s.redo.length)throw Error('Nothing to redo.');s.undo.push(s.text);s.text=s.redo.pop();labLog(s,'Restored next snapshot.');break;}s.pos=labInt('editPos',0,s.text.length);s.insert=$('editText').value;s.length=labInt('editLength',0,100000);let next=s.text;if(action==='insert')next=s.text.slice(0,s.pos)+s.insert+s.text.slice(s.pos);if(action==='delete'){if(s.pos+s.length>s.text.length)throw Error('Delete range extends past the document.');next=s.text.slice(0,s.pos)+s.text.slice(s.pos+s.length);}if(next===s.text){labLog(s,'No-op: history is unchanged.');break;}if(next.length>5000)throw Error('Lab text limit is 5,000 UTF-16 units.');s.undo.push(s.text);s.text=next;s.redo=[];labLog(s,'Applied edit; redo branch cleared.');break;
 case 'elevator':if(action==='requestStop'){s.next=labInt('elevFloor',0,8);if(!s.stops.includes(s.next))s.stops.push(s.next);labLog(s,'Stop '+s.next+' requested (deduplicated).');break;}if(action==='tick'){s.tick++;if(s.open){s.open=false;labLog(s,'Closed doors; did not move.');break;}if(s.stops.includes(s.floor)){s.stops=s.stops.filter(f=>f!==s.floor);s.open=true;labLog(s,'Opened doors at requested floor '+s.floor+'.');break;}if(!s.stops.length){s.direction=0;labLog(s,'Idle; no request.');break;}if(!s.direction){const nearest=s.stops.slice().sort((a,b)=>Math.abs(a-s.floor)-Math.abs(b-s.floor)||a-b)[0];s.direction=Math.sign(nearest-s.floor);}if(!s.stops.some(f=>(f-s.floor)*s.direction>0))s.direction=-s.direction;s.floor+=s.direction;if(s.stops.includes(s.floor)){s.stops=s.stops.filter(f=>f!==s.floor);s.open=true;}labLog(s,'Moved to '+s.floor+' with doors closed'+(s.open?'; arrived and opened doors.':'.'));}break;
 case 'pubsub':s.throws=$('busThrows').checked;if(action==='capture'){s.snapshot=s.live.map(x=>({...x}));s.cursor=0;labLog(s,'Captured '+s.snapshot.length+' subscription token(s).');}if(action==='deliver'){if(s.snapshot===null)throw Error('Capture a publication first.');if(s.cursor>=s.snapshot.length)throw Error('Snapshot delivery is complete.');const x=s.snapshot[s.cursor++];labLog(s,`${x.name} #${x.id}: ${x.name==='B'&&s.throws?'simulated failure isolated; later callbacks remain eligible.':'delivered.'}`);}if(action==='removeB'){const count=s.live.filter(x=>x.name==='B').length;s.live=s.live.filter(x=>x.name!=='B');labLog(s,'Unsubscribed '+count+' live B token(s); captured snapshot is unchanged.');}if(action==='registerB'){const x={name:'B',id:s.next++};s.live.push(x);labLog(s,'Subscribed B #'+x.id+' for future snapshots.');}break;
}}catch(e){labLog(s,'REJECTED: '+e.message);}renderLabs();}

</script>
<script>
for(const m of MODULES){const o=document.createElement('option');o.value=m.id;o.textContent=m.id+' · '+m.title;$('moduleFilter').appendChild(o);}
$('search').addEventListener('input',refreshFilter);$('moduleFilter').addEventListener('change',refreshFilter);$('modeFilter').addEventListener('change',refreshFilter);
$('previousButton').onclick=()=>move(-1);$('nextButton').onclick=()=>move(1);$('todayButton').onclick=today;$('allButton').onclick=()=>{daily=false;$('search').value='';$('moduleFilter').value='';$('modeFilter').value='all';refreshFilter();status('Showing the complete course.');};
$('themeButton').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';applyTheme();save();};$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){setView(b.dataset.view);return;}if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.answer!==undefined){showQuizResult(+b.dataset.answer);return;}if(b.dataset.rating){review(b.dataset.rating);return;}if(b.dataset.labaction){actLab(b.dataset.labaction);return;}
 switch(b.id){
 case 'bookmarkButton':state.bookmarks[state.current]=!state.bookmarks[state.current];if(!state.bookmarks[state.current])delete state.bookmarks[state.current];save();renderCard();refreshFilter();break;
 case 'markButton':{const p=state.progress[state.current]||{};state.progress[state.current]={...p,studied:true,due:p.due||Date.now()+86400000,interval:p.interval||1};save();renderCard();renderSidebar();status(state.current+' marked studied.');break;}
 case 'openMockButton':{mockSlug=card().slug||PROBLEMS[0].slug;setView('mock');break;}
 case 'launchLabButton':setView('labs');break;
 case 'copyButton':try{await navigator.clipboard.writeText(card().code);status('Code copied.');}catch(err){status('Clipboard unavailable in this viewer. Select the code and copy it manually.');}break;
 case 'diagramNext':diagramStep=Math.min(3,diagramStep+1);renderCard();break;
 case 'diagramBack':diagramStep=Math.max(0,diagramStep-1);renderCard();break;
 case 'revealButton':showQuizResult(-1,false);break;
 case 'retryQuizButton':quizSelection=null;renderCard();break;
 case 'exportButton':exportProgress();break;
 case 'importButton':$('importFile').click();break;
 case 'resetProgressButton':if(confirm('Clear this browser\'s notes, bookmarks, quiz history and progress? Export first to keep a backup.')){state={version:1,current:CARDS[0].id,progress:{},notes:{},bookmarks:{},mock:{},theme:state.theme,session:null};daily=false;save();refreshFilter();renderGuide();status('Progress cleared.');}break;
 case 'startExamButton':startExam();break;
 case 'submitExamButton':submitExam();break;
 case 'timerStart':if(!timerEnd&&timerRemaining>0){timerEnd=Date.now()+timerRemaining*1000;timerHandle=setInterval(updateTimer,250);updateTimer();}break;
 case 'timerPause':if(timerEnd){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=null;clearInterval(timerHandle);timerHandle=null;updateTimer();}break;
 case 'timerReset':clearInterval(timerHandle);timerHandle=null;timerEnd=null;timerRemaining=+$('timerLength').value*60;updateTimer();break;
 case 'mockSolution':go(CARDS.find(c=>c.slug===mockSlug).id);break;
 case 'exportMockButton':exportMock();break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='lessonNote'){state.notes[state.current]=e.target.value;save();}if(e.target.dataset.mockfield){const m=state.mock[mockSlug];m.fields[e.target.dataset.mockfield]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.id==='importFile')importProgress(e.target.files[0]);if(e.target.dataset.exam){exam.answers[e.target.dataset.exam]=+e.target.value;}if(e.target.id==='mockProblem'){mockSlug=e.target.value;renderMock();}if(e.target.dataset.rubric){state.mock[mockSlug].scores[e.target.dataset.rubric]=+e.target.value;save();updateRubric();}if(e.target.id==='labSelect'){currentLab=e.target.value;renderLabs();}if(e.target.id==='splitCount'){const count=+e.target.value,amount=Number($('splitAmount').value);if($('splitAmount').value.trim()&&Number.isSafeInteger(amount)&&amount>=0&&amount<=1000000000)LABS.split.amount=amount;LABS.split.payer=+$('splitPayer').value;LABS.split.count=count;if(LABS.split.payer>=count)LABS.split.payer=0;renderLabs();}});
document.addEventListener('keydown',e=>{if(currentView!=='study'||e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'){e.preventDefault();move(1);}if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}});
let touch=null;$('lessonCard').addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('pre,textarea,input,button,select,a'))return;touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});$('lessonCard').addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.abs(dx)>85&&Math.abs(dy)<55&&!String(getSelection()))move(dx<0?1:-1);},{passive:true});
matchMedia('(max-width: 599px)').addEventListener('change',()=>{if(currentView==='study')renderCard();});
applyTheme();$('storageNotice').hidden=storageOK;refreshFilter();renderCard();status('Ready. Start with F1 or choose a problem from the course map.');
// Test hooks expose navigation and model actions for reproducible browser QA.
window.Workshop={DATA,getState:()=>state,getCard:card,go,setTab,setView,refreshFilter,review,cleanState,getFiltered:()=>filtered,getLabs:()=>LABS,setLab:id=>{currentLab=id;setView('labs');},actLab};
