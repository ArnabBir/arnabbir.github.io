lt together. Later menu mutations affect new orders only.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Compute line totals before accepting the order.", "question": "What happens before creating the accepted order?", "options": ["Mutate every menu price", "Mark it delivered", "Validate lines and compute a stable total"], "answer": 2, "explanation": "Validate lines and compute a stable total. Load the selected cart version, validate all items and quantities, compute line totals with overflow checks and capture prices. Create the order and record the request result together. Later menu mutations affect new orders only.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Cart", "Checkout validation", "Price snapshot", "Order"], "sources": ["S03"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Food ordering and order lifecycle", "step": 7, "slug": "food"}, {"id": "L344", "number": 344, "module": "P25", "title": "Read the core Java logic", "idea": "The core sketch does not automatically coordinate external payment or restaurant stock. If those become requirements, introduce explicit reservation/payment states and failures. List immutability also requires immutable OrderLine content.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "List<OrderLine> lines = cart.items().stream()\n    .map(item -> snapshotValidatedLine(item, menu))\n    .toList();\nlong total = checkedTotal(lines);\nOrder order = new Order(newId(), lines, total);\n// Save order and successful request identity together.", "gotcha": "An unmodifiable list of mutable lines is still unsafe.", "question": "What else is needed besides List.toList?", "options": ["A global public setter", "Immutable or safely owned line contents", "An extra mutable array reference"], "answer": 1, "explanation": "Immutable or safely owned line contents. The core sketch does not automatically coordinate external payment or restaurant stock. If those become requirements, introduce explicit reservation/payment states and failures. List immutability also requires immutable OrderLine content.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S03"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Food ordering and order lifecycle", "step": 8, "slug": "food"}, {"id": "L345", "number": 345, "module": "P25", "title": "Handle races and failure", "idea": "Cart edits racing with submit need a version check or a captured immutable snapshot. Two kitchen workers starting preparation should not apply the transition twice. The order owner checks current state and authorization at the transition boundary.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Concurrent cart changes require snapshot or version semantics.", "question": "What can race with submit?", "options": ["A cart edit", "Only printing a receipt", "An unrelated image load"], "answer": 0, "explanation": "A cart edit. Cart edits racing with submit need a version check or a captured immutable snapshot. Two kitchen workers starting preparation should not apply the transition twice. The order owner checks current state and authorization at the transition boundary.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S03"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Food ordering and order lifecycle", "step": 9, "slug": "food"}, {"id": "L346", "number": 346, "module": "P25", "title": "Build the test plan", "idea": "Changing the menu after submission does not change the total.\nA zero or negative quantity is rejected.\nA repeated successful submit returns the same order.\nCancel after preparation is rejected without changing state.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test price history after menu edits.", "question": "Which test protects historical pricing?", "options": ["Only read the current menu", "Only count restaurants", "Change menu prices after acceptance"], "answer": 2, "explanation": "Change menu prices after acceptance. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S03"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Food ordering and order lifecycle", "step": 10, "slug": "food"}, {"id": "L347", "number": 347, "module": "P25", "title": "Change one requirement", "idea": "Add partial item rejection. Decide whether the customer must approve a revised price, whether fees are recomputed and how payment adjustment works. Do not silently remove items from an already accepted order total.", "mental": "Snapshotting prices duplicates catalog data but preserves the transaction's meaning. Referencing live prices is storage-light but makes historical orders change when the menu changes, which violates this contract.", "code": "", "gotcha": "Partial rejection changes pricing and customer consent.", "question": "What must partial rejection define?", "options": ["No new rules", "Revised total, approval and payment adjustment", "Only a new status label"], "answer": 1, "explanation": "Revised total, approval and payment adjustment. Add partial item rejection. Decide whether the customer must approve a revised price, whether fees are recomputed and how payment adjustment works. Do not silently remove items from an already accepted order total.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S03"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Food ordering and order lifecycle", "step": 11, "slug": "food"}, {"id": "L348", "number": 348, "module": "P25", "title": "Defend the design", "idea": "I separate cart intent from accepted order facts. My design protects the price snapshot and lifecycle independently of menu changes. I state the cancellation cutoff rather than scattering it across controllers.", "mental": "L cart lines: O(L) validation and total calculation plus menu lookups. Storage O(L) per accepted order. State transitions are O(1) local checks.", "code": "", "gotcha": "Duplicated price data can be intentional historical evidence.", "question": "Why store accepted price snapshots?", "options": ["To preserve historical order meaning", "To make every query constant memory", "To copy the entire menu forever"], "answer": 0, "explanation": "To preserve historical order meaning. Snapshotting prices duplicates catalog data but preserves the transaction's meaning. Referencing live prices is storage-light but makes historical orders change when the menu changes, which violates this contract.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S03"], "level": "Core", "detail": "Snapshotting prices duplicates catalog data but preserves the transaction's meaning. Referencing live prices is storage-light but makes historical orders change when the menu changes, which violates this contract.", "kind": "step-12", "problem": "Food ordering and order lifecycle", "step": 12, "slug": "food"}, {"id": "L349", "number": 349, "module": "P26", "title": "Problem statement and scope", "idea": "Design a ride-request core that assigns one available driver to one waiting rider. A matching policy chooses a candidate using driver snapshots, but the assignment operation must atomically claim the driver and update the trip.", "mental": "One service area, simplified coordinates and one active trip per driver. No real navigation, surge pricing, payment, safety operations or global dispatch optimization. Location freshness is explicitly modeled as an input quality limit.", "code": "", "gotcha": "A dispatch toy is not a complete ride-hailing service.", "question": "What is the core ownership limit?", "options": ["Unlimited trips per driver", "One driver per city", "One active trip per driver"], "answer": 2, "explanation": "One active trip per driver. Can a driver have two active trips? No. Does nearest guarantee fastest arrival? No. Who may cancel and when? Define allowed states; the baseline allows cancellation before pickup and requires ownership checks.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Deep", "detail": "Can a driver have two active trips? No. Does nearest guarantee fastest arrival? No. Who may cancel and when? Define allowed states; the baseline allows cancellation before pickup and requires ownership checks.", "kind": "step-1", "problem": "Ride dispatch and driver assignment", "step": 1, "slug": "ride"}, {"id": "L350", "number": 350, "module": "P26", "title": "Work through one example", "idea": "Riders A and B both see driver D as available. Both matching policies choose D. Only one atomic claim succeeds; the other request tries another driver or remains waiting. A later old cancellation cannot free D from a newer trip.", "mental": "Matching is a suggestion; assignment is an ownership change. A driver's available status must be linked to an active trip ID, not a standalone boolean.", "code": "", "gotcha": "Two requesters can choose the same nearest driver.", "question": "A and B both choose D. How many claims succeed?", "options": ["Always zero", "One", "Two"], "answer": 1, "explanation": "One. Matching is a suggestion; assignment is an ownership change. A driver's available status must be linked to an active trip ID, not a standalone boolean.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Ride request", "Candidate ranking", "Atomic driver claim", "Assigned trip"], "sources": [], "level": "Deep", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Ride dispatch and driver assignment", "step": 2, "slug": "ride"}, {"id": "L351", "number": 351, "module": "P26", "title": "Write the invariants", "idea": "A driver has at most one active trip.\nA trip has at most one assigned active driver in the core.\nCancellation or completion releases only the driver still owned by that trip.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "A boolean available flag loses the owner identity.", "question": "Why store activeTripId instead of only available?", "options": ["To identify and validate the current owner", "To make distance exact", "To remove all trip state"], "answer": 0, "explanation": "To identify and validate the current owner. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Deep", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Ride dispatch and driver assignment", "step": 3, "slug": "ride"}, {"id": "L352", "number": 352, "module": "P26", "title": "Choose objects and ownership", "idea": "DispatchService: coordinates match and atomic assignment.\nMatchingPolicy: ranks candidate driver snapshots.\nDriverState: location, freshness and current trip ownership.\nTrip: rider, pickup, destination and lifecycle.\nAssignment: trip-driver relation and version/token.", "mental": "The central consistency owner in this design is DispatchService. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "MatchingPolicy should not silently mutate driver ownership.", "question": "Who performs the atomic claim?", "options": ["MatchingPolicy", "LocationView", "DispatchService"], "answer": 2, "explanation": "DispatchService. DispatchService has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["DispatchService", "MatchingPolicy", "DriverState", "Trip"], "sources": [], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Ride dispatch and driver assignment", "step": 4, "slug": "ride"}, {"id": "L353", "number": 353, "module": "P26", "title": "Design the public API", "idea": "tryAssign is conditional on both waiting trip and available driver state. A stale location may exclude a driver or lower confidence under an explicit policy. Do not expose setAvailable(true) without matching current ownership.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "TripView requestRide(RideRequest request);\nboolean tryAssign(TripId trip, DriverId driver);\nTripView cancel(Actor actor, TripId trip);", "gotcha": "Old locations require a freshness rule.", "question": "What must tryAssign recheck?", "options": ["Only the rider name", "Trip waiting and driver unassigned", "Only the last search result"], "answer": 1, "explanation": "Trip waiting and driver unassigned. tryAssign is conditional on both waiting trip and available driver state. A stale location may exclude a driver or lower confidence under an explicit policy. Do not expose setAvailable(true) without matching current ownership.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Deep", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Ride dispatch and driver assignment", "step": 5, "slug": "ride"}, {"id": "L354", "number": 354, "module": "P26", "title": "Draw the state machine", "idea": "WAITING can be assigned or cancelled. ASSIGNED can progress to pickup or a permitted cancellation. Once picked up, the cancellation/abort contract changes and needs a separate policy. Completion is authorized by the owning trip workflow.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Cancellation after pickup is not the same as before pickup.", "question": "Does cancellation after pickup need its own rule?", "options": ["Yes", "No; it is identical to waiting cancellation", "Only for long distances"], "answer": 0, "explanation": "Yes. WAITING can be assigned or cancelled. ASSIGNED can progress to pickup or a permitted cancellation. Once picked up, the cancellation/abort contract changes and needs a separate policy. Completion is authorized by the owning trip workflow.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["WAITING", "ASSIGNED", "PICKED UP", "COMPLETED / CANCELLED"], "sources": [], "level": "Deep", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Ride dispatch and driver assignment", "step": 6, "slug": "ride"}, {"id": "L355", "number": 355, "module": "P26", "title": "Trace the key operation", "idea": "Create or replay a ride request. Rank candidate drivers using snapshots. For each candidate, atomically verify the trip is waiting and the driver has no active trip, then write both ownership references. A failed claim means retry selection, not override the winner.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Claim both trip and driver or neither.", "question": "A candidate claim fails. What should happen?", "options": ["Overwrite the winning assignment", "Mark two trips assigned", "Try another candidate or keep waiting"], "answer": 2, "explanation": "Try another candidate or keep waiting. Create or replay a ride request. Rank candidate drivers using snapshots. For each candidate, atomically verify the trip is waiting and the driver has no active trip, then write both ownership references. A failed claim means retry selection, not override the winner.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Ride request", "Candidate ranking", "Atomic driver claim", "Assigned trip"], "sources": [], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Ride dispatch and driver assignment", "step": 7, "slug": "ride"}, {"id": "L356", "number": 356, "module": "P26", "title": "Read the core Java logic", "idea": "The sketch assumes shared objects protected by the same dispatch owner. Separate driver and trip repositories need an atomic contract spanning both, or a carefully specified workflow. Ranking correctness does not replace claim correctness.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "synchronized boolean tryAssign(Trip trip, Driver driver) {\n    if (trip.state() != WAITING) return false;\n    if (driver.activeTrip() != null) return false;\n    driver.assign(trip.id());\n    trip.assign(driver.id());\n    return true;\n}", "gotcha": "Independent repositories do not become atomic from a synchronized method on one object.", "question": "What does the sketch assume?", "options": ["Perfect location freshness", "Shared state under one consistency owner", "Automatic cross-database transactions"], "answer": 1, "explanation": "Shared state under one consistency owner. The sketch assumes shared objects protected by the same dispatch owner. Separate driver and trip repositories need an atomic contract spanning both, or a carefully specified workflow. Ranking correctness does not replace claim correctness.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Ride dispatch and driver assignment", "step": 8, "slug": "ride"}, {"id": "L357", "number": 357, "module": "P26", "title": "Handle races and failure", "idea": "Simultaneous riders can select the same driver. Assignment is the linearization point in the local model. Cancellation must compare driver.activeTrip with this trip ID before release. Multi-server dispatch requires shared conditional ownership, not independent JVM locks.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "A stale cancel must compare current trip ownership.", "question": "What protects a driver from old cancellation?", "options": ["Compare the current trip ownership token", "Only compare a display name", "Always set available true"], "answer": 0, "explanation": "Compare the current trip ownership token. Simultaneous riders can select the same driver. Assignment is the linearization point in the local model. Cancellation must compare driver.activeTrip with this trip ID before release. Multi-server dispatch requires shared conditional ownership, not independent JVM locks.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Deep", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Ride dispatch and driver assignment", "step": 9, "slug": "ride"}, {"id": "L358", "number": 358, "module": "P26", "title": "Build the test plan", "idea": "Two waiting trips competing for one driver yield one assignment.\nCancelling a stale trip does not free a driver assigned elsewhere.\nA picked-up trip follows the chosen cancellation policy.\nStale locations are handled according to the documented freshness rule.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test the losing assignment outcome too.", "question": "Which test exposes the central race?", "options": ["Only compute one distance", "Only create a rider", "Two trips competing for one driver"], "answer": 2, "explanation": "Two trips competing for one driver. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Deep", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Ride dispatch and driver assignment", "step": 10, "slug": "ride"}, {"id": "L359", "number": 359, "module": "P26", "title": "Change one requirement", "idea": "Add driver acceptance with expiring assignment offers. The driver is then reserved for one offer while it is live. A late acceptance must match the offer token and deadline, reusing the same ownership ideas as seat holds.", "mental": "Nearest-by-distance is cheap and understandable but ignores road travel time, driver preference and fairness. More advanced ranking can replace MatchingPolicy without weakening the atomic assignment boundary.", "code": "", "gotcha": "Expiring offers need token and deadline validation.", "question": "What does a driver-acceptance offer add?", "options": ["Guaranteed acceptance", "Expiring temporary ownership", "No extra states"], "answer": 1, "explanation": "Expiring temporary ownership. Add driver acceptance with expiring assignment offers. The driver is then reserved for one offer while it is live. A late acceptance must match the offer token and deadline, reusing the same ownership ideas as seat holds.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": [], "level": "Deep", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Ride dispatch and driver assignment", "step": 11, "slug": "ride"}, {"id": "L360", "number": 360, "module": "P26", "title": "Defend the design", "idea": "I distinguish ranking from claiming. The crucial race test has two riders choose one driver, and the stale-cancellation test protects later ownership. Location accuracy and optimal routing are outside this small core.", "mental": "D driver snapshots: a simple candidate scan is O(D). Claim is expected O(1) in the local indexed model. Geospatial indexing and travel-time estimation are separate extensions.", "code": "", "gotcha": "Nearest distance is not guaranteed fastest arrival.", "question": "What can replace the ranking policy independently?", "options": ["Travel-time-aware or fairness-aware ranking", "The atomic ownership invariant", "The identity of the current trip"], "answer": 0, "explanation": "Travel-time-aware or fairness-aware ranking. Nearest-by-distance is cheap and understandable but ignores road travel time, driver preference and fairness. More advanced ranking can replace MatchingPolicy without weakening the atomic assignment boundary.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": [], "level": "Deep", "detail": "Nearest-by-distance is cheap and understandable but ignores road travel time, driver preference and fairness. More advanced ranking can replace MatchingPolicy without weakening the atomic assignment boundary.", "kind": "step-12", "problem": "Ride dispatch and driver assignment", "step": 12, "slug": "ride"}, {"id": "L361", "number": 361, "module": "P27", "title": "Problem statement and scope", "idea": "Design a parcel-locker system. A courier deposits a parcel into a compatible free compartment. The recipient receives a pickup token and uses it to release the correct parcel. A token must not open a newer parcel's compartment after its original pickup.", "mental": "One locker bank, size-based compatibility and software-only open acknowledgement. Token verification is modeled, not a production authentication scheme. Real door sensors, delivery notifications and secure token storage are extension boundaries.", "code": "", "gotcha": "A deterministic teaching token is not a secure production credential.", "question": "What is a token tied to?", "options": ["A compartment forever", "Every parcel of the same size", "One parcel allocation"], "answer": 2, "explanation": "One parcel allocation. Can a small parcel use a larger compartment? Yes. Is a token single-use? Yes for successful pickup. Do pickup failures consume it? Invalid credentials do not. Can a parcel be split? No.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S21"], "level": "Core", "detail": "Can a small parcel use a larger compartment? Yes. Is a token single-use? Yes for successful pickup. Do pickup failures consume it? Invalid credentials do not. Can a parcel be split? No.", "kind": "step-1", "problem": "Parcel locker allocation", "step": 1, "slug": "locker"}, {"id": "L362", "number": 362, "module": "P27", "title": "Work through one example", "idea": "Parcel P1 uses compartment C2 and token T1. Pickup with T1 succeeds and C2 becomes free. P2 later uses C2 with token T2. A replay of T1 must not open C2 or release P2.", "mental": "Pickup authorization is tied to parcel and allocation identity, not merely a compartment number. Reusing a physical compartment must not reuse its old authority.", "code": "", "gotcha": "A compartment number is not sufficient pickup authority.", "question": "Can T1 release P2 after C2 is reused?", "options": ["Only on the same day", "No", "Yes because the compartment matches"], "answer": 1, "explanation": "No. Pickup authorization is tied to parcel and allocation identity, not merely a compartment number. Reusing a physical compartment must not reuse its old authority.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Courier / recipient", "LockerService", "Allocation ownership", "Compartment"], "sources": ["S21"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Parcel locker allocation", "step": 2, "slug": "locker"}, {"id": "L363", "number": 363, "module": "P27", "title": "Write the invariants", "idea": "A compartment owns at most one stored parcel.\nA live pickup token identifies one parcel allocation.\nA consumed or expired token cannot affect a later allocation.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "Old tokens must not affect reused compartments.", "question": "What must remain unique?", "options": ["One stored parcel owner per compartment", "One parcel name worldwide", "One recipient per building forever"], "answer": 0, "explanation": "One stored parcel owner per compartment. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S21"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Parcel locker allocation", "step": 3, "slug": "locker"}, {"id": "L364", "number": 364, "module": "P27", "title": "Choose objects and ownership", "idea": "LockerService: owns allocation and pickup transitions.\nCompartment: ID, size and current allocation token.\nParcel: ID, recipient reference and size.\nAllocation: parcel, compartment, pickup-token reference and status.\nTokenVerifier: validates credentials without exposing secret values.\nDoorPort: optional hardware boundary.", "mental": "The central consistency owner in this design is LockerService. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A token verifier should not decide inventory ownership.", "question": "Who owns allocation transitions?", "options": ["TokenVerifier", "ParcelView", "LockerService"], "answer": 2, "explanation": "LockerService. LockerService has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["LockerService", "Compartment", "Parcel", "Allocation"], "sources": ["S21"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Parcel locker allocation", "step": 4, "slug": "locker"}, {"id": "L365", "number": 365, "module": "P27", "title": "Design the public API", "idea": "The external pickup API should avoid leaking whether arbitrary tokens exist. For teaching tests, deterministic tokens can be injected; a production implementation needs cryptographically suitable generation, protected storage and attempt throttling.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "DepositView deposit(Parcel parcel);\nPickupResult pickup(String token);\nList<CompartmentView> availability();", "gotcha": "Avoid leaking secret tokens in logs.", "question": "Are deterministic test tokens production security?", "options": ["Only if they contain a number", "No", "Yes automatically"], "answer": 1, "explanation": "No. The external pickup API should avoid leaking whether arbitrary tokens exist. For teaching tests, deterministic tokens can be injected; a production implementation needs cryptographically suitable generation, protected storage and attempt throttling.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S21"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Parcel locker allocation", "step": 5, "slug": "locker"}, {"id": "L366", "number": 366, "module": "P27", "title": "Draw the state machine", "idea": "In the software core, successful deposit moves directly to STORED. A real door workflow may require ALLOCATED then confirmed deposit. Pickup consumes the allocation's authority; it does not create a permanent permission to open a compartment.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Expired authority does not imply the parcel physically disappeared.", "question": "Does token expiry make a compartment physically empty?", "options": ["No", "Yes", "Only for small parcels"], "answer": 0, "explanation": "No. In the software core, successful deposit moves directly to STORED. A real door workflow may require ALLOCATED then confirmed deposit. Pickup consumes the allocation's authority; it does not create a permanent permission to open a compartment.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["FREE", "ALLOCATED", "STORED", "PICKED UP / EXPIRED"], "sources": ["S21"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Parcel locker allocation", "step": 6, "slug": "locker"}, {"id": "L367", "number": 367, "module": "P27", "title": "Trace the key operation", "idea": "For deposit, validate parcel identity and choose a compatible free compartment, create an allocation ID and token, then bind them atomically. For pickup, verify the token, check its live allocation and current compartment owner, then close the allocation and release that same owner.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Claim the compartment and allocation together.", "question": "What must pickup compare?", "options": ["Only the compartment size", "Only the courier name", "Allocation ID with the current compartment owner"], "answer": 2, "explanation": "Allocation ID with the current compartment owner. For deposit, validate parcel identity and choose a compatible free compartment, create an allocation ID and token, then bind them atomically. For pickup, verify the token, check its live allocation and current compartment owner, then close the allocation and release that same owner.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Courier / recipient", "LockerService", "Allocation ownership", "Compartment"], "sources": ["S21"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Parcel locker allocation", "step": 7, "slug": "locker"}, {"id": "L368", "number": 368, "module": "P27", "title": "Read the core Java logic", "idea": "This contextual snippet represents a confirmed software pickup. A physical door may open while the final acknowledgement is lost, so a real implementation needs an attempt state and sensor reconciliation rather than assuming both mutations prove removal.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "Allocation a = requireLiveAllocation(token);\nCompartment c = compartments.get(a.compartmentId());\nif (!a.id().equals(c.allocationId()))\n    throw staleAllocation();\na.markPickedUp();\nc.clearIfOwnedBy(a.id());", "gotcha": "The snippet assumes a confirmed software pickup.", "question": "What does the pickup snippet not prove?", "options": ["A logical state change", "Real physical parcel removal", "The use of an ownership check"], "answer": 1, "explanation": "Real physical parcel removal. This contextual snippet represents a confirmed software pickup. A physical door may open while the final acknowledgement is lost, so a real implementation needs an attempt state and sensor reconciliation rather than assuming both mutations prove removal.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S21"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Parcel locker allocation", "step": 8, "slug": "locker"}, {"id": "L369", "number": 369, "module": "P27", "title": "Handle races and failure", "idea": "Two couriers must not claim the same final compartment. Pickup and expiry cleanup share the allocation boundary and compare ownership IDs. An expired token should not clear a newer assignment even if the compartment number matches.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Expiry cleanup must compare current allocation identity.", "question": "What protects against stale expiry cleanup?", "options": ["Matching current allocation identity", "A timer firing once", "A public setFree method"], "answer": 0, "explanation": "Matching current allocation identity. Two couriers must not claim the same final compartment. Pickup and expiry cleanup share the allocation boundary and compare ownership IDs. An expired token should not clear a newer assignment even if the compartment number matches.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S21"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Parcel locker allocation", "step": 9, "slug": "locker"}, {"id": "L370", "number": 370, "module": "P27", "title": "Build the test plan", "idea": "A too-large parcel is rejected without consuming a compartment.\nTwo deposits for one suitable compartment yield one success.\nAn old token replay cannot release a newer parcel.\nA wrong token leaves every allocation unchanged.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test reuse of the same compartment with a new parcel.", "question": "Which test is most revealing?", "options": ["Only deposit into an empty bank", "Only display parcel size", "Old token after compartment reuse"], "answer": 2, " ims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Parcel locker allocation", "step": 11, "slug": "locker"}, {"id": "L372", "number": 372, "module": "P27", "title": "Defend the design", "idea": "The main idea is expiring authority tied to an allocation. I test compartment reuse explicitly so an old code cannot affect a new parcel. Physical occupancy and token validity remain distinct facts.", "mental": "C compartments: O(C) scan allocation; expected O(1) token lookup. Storage O(C + retained allocations). Real hardware latency is a separate concern.", "code": "", "gotcha": "Selection policy and atomic ownership are separate responsibilities.", "question": "Why choose the smallest compatible compartment?", "options": ["To preserve larger capacity for larger parcels", "To eliminate synchronization", "To guarantee no future rejection"], "answer": 0, "explanation": "To preserve larger capacity for larger parcels. Smallest-compatible allocation preserves larger compartments but can require an ordered size index. A scan is simpler for a small bank. More efficient selection must not move ownership out of the locker service.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S21"], "level": "Core", "detail": "Smallest-compatible allocation preserves larger compartments but can require an ordered size index. A scan is simpler for a small bank. More efficient selection must not move ownership out of the locker service.", "kind": "step-12", "problem": "Parcel locker allocation", "step": 12, "slug": "locker"}, {"id": "L373", "number": 373, "module": "P28", "title": "Problem statement and scope", "idea": "Design a standard ten-pin scorecard for ten frames. Record rolls in order and compute scores only when required bonus rolls are known. Strikes and spares create obligations to include later rolls. Validate legal roll sequences, especially frame ten.", "mental": "One player scorecard, integer pin counts and standard strike/spare scoring. No lane hardware, tournament handicaps or multiplayer scheduling. This is a guided scoring design with an independent roll-history model.", "code": "", "gotcha": "This scope is standard ten-pin scoring, not all bowling variants.", "question": "How many frames does the scorecard contain?", "options": ["Twelve after a perfect game", "As many as rolls", "Ten"], "answer": 2, "explanation": "Ten. Can a frame score be incomplete? Yes. How does a strike score? Ten plus the next two rolls. How does a spare score? Ten plus the next roll. Frame ten has bonus rolls but not extra frames.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S19"], "level": "Core", "detail": "Can a frame score be incomplete? Yes. How does a strike score? Ten plus the next two rolls. How does a spare score? Ten plus the next roll. Frame ten has bonus rolls but not extra frames.", "kind": "step-1", "problem": "Ten-pin bowling scorecard", "step": 1, "slug": "bowling"}, {"id": "L374", "number": 374, "module": "P28", "title": "Work through one example", "idea": "Rolls 10,3,4 give frame one 17 and frame two 7. Rolls 6,4,5 give frame one 15 but frame two is incomplete. A perfect game records twelve strikes and totals 300.", "mental": "A roll can contribute to its own frame and to an earlier frame's bonus. This is not duplicate storage; it is the scoring rule over one chronological roll log.", "code": "", "gotcha": "A strike needs the next two rolls, not necessarily the next frame.", "question": "What does 10,3,4 score for frame one?", "options": ["24", "17", "10"], "answer": 1, "explanation": "17. A roll can contribute to its own frame and to an earlier frame's bonus. This is not duplicate storage; it is the scoring rule over one chronological roll log.", "  "mental": "A roll log plus pure scorer is straightforward and auditable. Incremental bonus counters can make display updates faster but introduce more mutable obligations and are harder to validate around the tenth frame.", "code": "", "gotcha": "Multiplayer turn order is separate from scoring.", "question": "Where should multiplayer turn order live?", "options": ["In the pin-count integer", "A controller outside each scorecard", "Inside every strike calculation"], "answer": 1, "explanation": "A controller outside each scorecard. Add several players by giving each an independent scorecard and a turn-order controller. Do not mix frame-scoring logic with lane rotation or UI animation.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S19"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Ten-pin bowling scorecard", "step": 11, "slug": "bowling"}, {"id": "L384", "number": 384, "module": "P28", "title": "Defend the design", "idea": "I model incomplete information explicitly. The pure scorer computes from one validated log, and the input parser protects rack legality. I pay special attention to frame ten rather than forcing it into the normal two-roll rule.", "mental": "A standard game has at most 21 rolls; rescoring the fixed ten frames is bounded and simple. For a generalized frame count F, a linear roll-log scorer is O(F) time and space.", "code": "", "gotcha": "Incremental bonus state can be more complex than rescoring 21 rolls.", "question": "Why can full rescoring be reasonable?", "options": ["A standard game has a very small bounded roll log", "It guarantees constant work for all generalized games", "It eliminates validation"], "answer": 0, "explanation": "A standard game has a very small bounded roll log. A roll log plus pure scorer is straightforward and auditable. Incremental bonus counters can make display updates faster but introduce more mutable obligations and are harder to validate around the tenth frame.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S19"], "level": "Core", "detail": "A roll log plus pure scorer is straightforward and auditable. Incremental bonus counters can make display updates faster but introduce more mutable obligations and are harder to validate around the tenth frame.", "kind": "step-12", "problem": "Ten-pin bowling scorecard", "step": 12, "slug": "bowling"}, {"id": "L385", "number": 385, "module": "P29", "title": "Problem statement and scope", "idea": "Design a deterministic pricing engine for an immutable cart snapshot. Compute line totals, apply eligible coupons in an explicit order and return a quote with a breakdown. Keep pricing calculation separate from consuming a limited-use coupon.", "mental": "One currency, integer minor units, fixed-amount and percentage discounts, and explicit rounding. No actual payment, jurisdiction-specific tax calculation or universal real-world promotion rules.", "code": "", "gotcha": "This example is not jurisdiction-specific tax guidance.", "question": "How many order-level coupons can apply in this core?", "options": ["Unlimited in unspecified order", "None even when valid", "At most one"], "answer": 2, "explanation": "At most one. Can coupons stack? This version applies at most one order-level coupon. Is a discount capped at subtotal? Yes. How are percentage fractions rounded? Down to whole minor units in this chosen example. Does preview consume a coupon? No.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": ["S23"], "level": "Core", "detail": "Can coupons stack? This version applies at most one order-level coupon. Is a discount capped at subtotal? Yes. How are percentage fractions rounded? Down to whole minor units in this chosen example. Does preview consume a coupon? No.", "kind": "step-1", "problem": "Shopping-cart pricing and coupons", "step": 1, "slug": "coupon"}, {"id": "L386", "number": 386, "module": "P29", "title": "Work through one example", "idea": "Subtotal is 105 minor units. A 10% coupon gives floor(10.5)=10 off, so total is 95. A fixed 200-off coupon is capped to 105 and total becomes zero. A preview does not reduce the coupon's remaining-use count.", "mental": "Coupon order, capping and rounding are business rules, not interchangeable implementation details. A quote needs to explain each adjustment.", "code": "", "gotcha": "Rounding changes the answer for small amounts.", "question": "What total results from 10% off 105 under this rule?", "options": ["90", "95", "94"], "answer": 1, "explanation": "95. Coupon order, capping and rounding are business rules, not interchangeable implementation details. A quote needs to explain each adjustment.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Cart snapshot", "Eligibility rule", "Discount calculation", "Quote breakdown"], "sources": ["S23"], "level": "Core", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Shopping-cart pricing and coupons", "step": 2, "slug": "coupon"}, {"id": "L387", "number": 387, "module": "P29", "title": "Write the invariants", "idea": "All cart quantities are positive and all amounts use one currency.\nThe final total is nonnegative and equals subtotal minus the accepted discount in this scope.\nA preview does not mutate coupon redemption state.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "A discount must not make the total negative under this contract.", "question": "What happens when a fixed discount exceeds subtotal?", "options": ["Cap it at subtotal", "Allow a negative total", "Increase the discount again"], "answer": 0, "explanation": "Cap it at subtotal. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": ["S23"], "level": "Core", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Shopping-cart pricing and coupons", "step": 3, "slug": "coupon"}, {"id": "L388", "number": 388, "module": "P29", "title": "Choose objects and ownership", "idea": "PricingEngine: pure quote calculation.\nCartSnapshot: immutable validated lines.\nDiscountPolicy: eligibility and discount calculation.\nQuote: subtotal, adjustment, total and policy/version references.\nCouponRedemptionService: atomically consumes limited usage at checkout.", "mental": "The central consistency owner in this design is PricingEngine. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "Coupon redemption is not the pricing engine's pure responsibility.", "question": "Who owns pure quote computation?", "options": ["CouponRedemptionService", "CartView", "PricingEngine"], "answer": 2, "explanation": "PricingEngine. PricingEngine has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["PricingEngine", "CartSnapshot", "DiscountPolicy", "Quote"], "sources": ["S23"], "level": "Core", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Shopping-cart pricing and coupons", "step": 4, "slug": "coupon"}, {"id": "L389", "number": 389, "module": "P29", "title": "Design the public API", "idea": "Use checked arithmetic for quantity times unit price and avoid amount*percent overflow. Either bound inputs or use BigInteger/BigDecimal as appropriate. Quote expiry and revalidation at checkout must be stated rather than assumed.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "Quote quote(CartSnapshot cart, Coupon coupon);\nRedemptionResult redeem(String requestId, QuoteId quote);", "gotcha": "Multiplication can overflow before division.", "question": "Why avoid long multiplication before division?", "options": ["Because prices are strings", "It can overflow before the discount is reduced", "Because division is always inexact"], "answer": 1, "explanation": "It can overflow before the discount is reduced. Use checked arithmetic for quantity times unit price and avoid amount*percent overflow. Either bound inputs or use BigInteger/BigDecimal as appropriate. Quote expiry and revalidation at checkout must be stated rather than assumed.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": ["S23"], "level": "Core", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Shopping-cart pricing and coupons", "step": 5, "slug": "coupon"}, {"id": "L390", "number": 390, "module": "P29", "title": "Draw the state machine", "idea": "QUOTED is not a coupon reservation unless the API explicitly creates a hold. REDEEMED is a separate mutation with its own idempotency identity. A stale quote may be rejected or repriced under a documented customer-consent rule.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "A quote is not automatically a reservation.", "question": "Does QUOTED mean a coupon use is reserved?", "options": ["No, unless explicitly modeled as a hold", "Yes automatically", "Only with a UUID"], "answer": 0, "explanation": "No, unless explicitly modeled as a hold. QUOTED is not a coupon reservation unless the API explicitly creates a hold. REDEEMED is a separate mutation with its own idempotency identity. A stale quote may be rejected or repriced under a documented customer-consent rule.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["CART SNAPSHOT", "QUOTED", "REVALIDATED", "REDEEMED / REJECTED"], "sources": ["S23"], "level": "Core", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Shopping-cart pricing and coupons", "step": 6, "slug": "coupon"}, {"id": "L391", "number": 391, "module": "P29", "title": "Trace the key operation", "idea": "Validate and sum line totals with checked arithmetic. Evaluate coupon eligibility against the snapshot. Compute the discount with the chosen rounding rule, cap it at subtotal, and return an immutable breakdown without changing coupon inventory.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Never consume a coupon during a read-only preview.", "question": "What does preview mutate?", "options": ["The final-use counter", "The user's payment balance", "No coupon redemption state"], "answer": 2, "explanation": "No coupon redemption state. Validate and sum line totals with checked arithmetic. Evaluate coupon eligibility against the snapshot. Compute the discount with the chosen rounding rule, cap it at subtotal, and return an immutable breakdown without changing coupon inventory.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Cart snapshot", "Eligibility rule", "Discount calculation", "Quote breakdown"], "sources": ["S23"], "level": "Core", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Shopping-cart pricing and coupons", "step": 7, "slug": "coupon"}, {"id": "L392", "number": 392, "module": "P29", "title": "Read the core Java logic", "idea": "The percentage sketch assumes percent is validated in the range 0..100 and subtotal is nonnegative. Integer division implements rounding down for these nonnegative inputs. A different rounding contract needs different code.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "BigInteger raw = BigInteger.valueOf(subtotal)\n    .multiply(BigInteger.valueOf(percent))\n    .divide(BigInteger.valueOf(100));\nlong discount = Math.min(subtotal, raw.longValueExact());\nlong total = subtotal - discount;\nreturn new Quote(subtotal, discount, total);", "gotcha": "Validate percent bounds before using the arithmetic.", "question": "What input bound does the percentage sketch assume?", "options": ["Negative subtotals only", "Percent between 0 and 100 and nonnegative subtotal", "Any signed integer percent"], "answer": 1, "explanation": "Percent between 0 and 100 and nonnegative subtotal. The percentage sketch assumes percent is validated in the range 0..100 and subtotal is nonnegative. Integer division implements rounding down for these nonnegative inputs. A different rounding contract needs different code.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": ["S23"], "level": "Core", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Shopping-cart pricing and coupons", "step": 8, "slug": "coupon"}, {"id": "L393", "number": 393, "module": "P29", "title": "Handle races and failure", "idea": "Pricing itself can run on immutable snapshots without a shared mutation lock. Limited-use redemption is different: two checkouts must not both consume the final coupon use. Put the check and decrement behind one redemption boundary.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "The final coupon use needs an atomic claim.", "question": "What requires atomic coordination?", "options": ["Consuming the final limited coupon use", "Reading an immutable cart snapshot", "Formatting the quote breakdown"], "answer": 0, "explanation": "Consuming the final limited coupon use. Pricing itself can run on immutable snapshots without a shared mutation lock. Limited-use redemption is different: two checkouts must not both consume the final coupon use. Put the check and decrement behind one redemption boundary.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": ["S23"], "level": "Core", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Shopping-cart pricing and coupons", "step": 9, "slug": "coupon"}, {"id": "L394", "number": 394, "module": "P29", "title": "Build the test plan", "idea": "A 10% discount on 105 is 10 under the chosen rounding.\nA fixed discount above subtotal produces total zero, not negative.\nRepeated previews do not consume limited uses.\nTwo redemption attempts for the final use produce at most one new success.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test small amounts where rounding is visible.", "question": "Which test distinguishes calculation from redemption?", "options": ["Only check a coupon name", "Only render the cart", "Preview many times and verify uses remain unchanged"], "answer": 2, "explanation": "Preview many times and verify uses remain unchanged. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": ["S23"], "level": "Core", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Shopping-cart pricing and coupons", "step": 10, "slug": "coupon"}, {"id": "L395", "number": 395, "module": "P29", "title": "Change one requirement", "idea": "Add stacking. Specify whether percentage applies before or after fixed discounts, eligibility recalculation, caps and line-level allocation. Different orders can produce different totals, so the policy must return a traceable adjustment list.", "mental": "Pure pricing is easy to test and cache for a stable snapshot. Redemption remains an effectful service with different concurrency needs. Combining them makes a harmless preview unexpectedly consume inventory.", "code": "", "gotcha": "Stacking order changes totals.", "question": "What must stacking define?", "options": ["No additional rules", "Order, caps, eligibility and rounding interactions", "Only coupon colors"], "answer": 1, "explanation": "Order, caps, eligibility and rounding interactions. Add stacking. Specify whether percentage applies before or after fixed discounts, eligibility recalculation, caps and line-level allocation. Different orders can produce different totals, so the policy must return a traceable adjustment list.", "practice": "Change exactly one requirement. Write the smallest affected API, state transition and test.", "flow": ["New rule", "Changed boundary", "New invariant", "New tests"], "sources": ["S23"], "level": "Core", "detail": "Extension notes are proposed designs, not claims that the downloadable core already implements those features.", "kind": "step-11", "problem": "Shopping-cart pricing and coupons", "step": 11, "slug": "coupon"}, {"id": "L396", "number": 396, "module": "P29", "title": "Defend the design", "idea": "I keep quote calculation pure and define rounding and capping explicitly. Limited-use consumption is a separate retry-safe operation. That split prevents a preview from spending the last coupon.", "mental": "L lines and K considered rules: typical baseline O(L + K), plus the cost of rule predicates. Limited-use redemption lookup is expected O(1) locally, with a separate atomic mutation.", "code": "", "gotcha": "Pure calculation and effectful redemption need different contracts.", "question": "Why separate pricing and redemption?", "options": ["Different purity and concurrency contracts", "To avoid all validation", "To make every preview a transaction"], "answer": 0, "explanation": "Different purity and concurrency contracts. Pure pricing is easy to test and cache for a stable snapshot. Redemption remains an effectful service with different concurrency needs. Combining them makes a harmless preview unexpectedly consume inventory.", "practice": "Give a two-minute explanation without reading. Name one limitation and defend one rejected alternative.", "flow": ["Scope", "Core rule", "Evidence", "Tradeoff"], "sources": ["S23"], "level": "Core", "detail": "Pure pricing is easy to test and cache for a stable snapshot. Redemption remains an effectful service with different concurrency needs. Combining them makes a harmless preview unexpectedly consume inventory.", "kind": "step-12", "problem": "Shopping-cart pricing and coupons", "step": 12, "slug": "coupon"}, {"id": "L397", "number": 397, "module": "P30", "title": "Problem statement and scope", "idea": "Design a configurable approval workflow for a submitted expense or document. A policy produces ordered approval steps. Only the authorized approver for the current step can approve or reject. Preserve decisions and policy version for an audit trail.", "mental": "Sequential steps, one active approver role per step, immutable submitted payload and no delegation or parallel quorum approvals in the core. This is a software-design exercise, not a legal or organizational compliance policy.", "code": "", "gotcha": "The example is not a compliance policy for a real organization.", "question": "May finance approve before manager in this policy?", "options": ["Yes if the page is open", "Only when the amount is small", "No"], "answer": 2, "explanation": "No. Can the requester approve their own request? This policy rejects that. Can policy edits change in-flight steps? No: capture the policy version at submission. What does duplicate approval do? Replay only when it matches the recorded command.", "practice": "Write your own three clarification questions before reading the next card.", "flow": ["Prompt", "Scope", "Questions", "Contract"], "sources": [], "level": "Deep", "detail": "Can the requester approve their own request? This policy rejects that. Can policy edits change in-flight steps? No: capture the policy version at submission. What does duplicate approval do? Replay only when it matches the recorded command.", "kind": "step-1", "problem": "Multi-step approval workflow", "step": 1, "slug": "approval"}, {"id": "L398", "number": 398, "module": "P30", "title": "Work through one example", "idea": "Request R needs manager approval then finance approval. Finance cannot approve first. Manager approves, moving R to finance. A duplicate manager command returns its recorded outcome and does not accidentally approve the finance step.", "mental": "An approval command targets a request version and step identity, not merely an object with status PENDING. The audit log preserves who decided what and when.", "code": "", "gotcha": "A duplicate approval must not advance the next step.", "question": "What does duplicate manager approval do?", "options": ["Restart the workflow", "Replay that decision without approving finance", "Advance the next step"], "answer": 1, "explanation": "Replay that decision without approving finance. An approval command targets a request version and step identity, not merely an object with status PENDING. The audit log preserves who decided what and when.", "practice": "Replay the example on paper, then change one input and predict the result.", "flow": ["Decision command", "Identity + authorization", "Current-step guard", "Audit + advance"], "sources": [], "level": "Deep", "detail": "Trace every accepted and rejected operation. Name the exact fields that change and the fields that must remain unchanged.", "kind": "step-2", "problem": "Multi-step approval workflow", "step": 2, "slug": "approval"}, {"id": "L399", "number": 399, "module": "P30", "title": "Write the invariants", "idea": "Only the current authorized approver can decide the active step.\nA decision command is applied at most once to its intended step.\nSubmitted content and captured policy version do not silently change during approval.", "mental": "Treat these as assertions after every completed public operation. Rejection should also preserve valid state.", "code": "", "gotcha": "A requester's self-approval rule must be enforced at the boundary.", "question": "What must remain captured after submission?", "options": ["Payload and policy version", "Only the current UI label", "The latest mutable policy always"], "answer": 0, "explanation": "Payload and policy version. The invariant must hold after both accepted and rejected operations.", "practice": "Write a before-and-after assertion for each invariant; include one failure path.", "flow": ["Before", "Guard", "Atomic change", "After"], "sources": [], "level": "Deep", "detail": "Choose one invariant and invent the smallest sequence that would break a naive implementation.", "kind": "step-3", "problem": "Multi-step approval workflow", "step": 3, "slug": "approval"}, {"id": "L400", "number": 400, "module": "P30", "title": "Choose objects and ownership", "idea": "Workflow: owns current step, status and recorded decisions.\nApprovalPolicy: creates an immutable sequence of required steps.\nStep: stable ID, required role and decision status.\nDecisionCommand: command ID, step ID, expected version, actor and choice.\nDecisionRecord: immutable actor, timestamp, outcome and policy context.", "mental": "The central consistency owner in this design is Workflow. Other collaborators do not get unrestricted access to its mutable state.", "code": "", "gotcha": "A mutable policy should not rewrite in-flight steps.", "question": "Who owns step advancement?", "options": ["ApprovalPolicy", "DecisionRecord", "Workflow"], "answer": 2, "explanation": "Workflow. Workflow has the state needed to enforce this rule.", "practice": "Draw an ownership diagram. Label owns, references and uses; explain why each arrow exists.", "flow": ["Workflow", "ApprovalPolicy", "Step", "DecisionCommand"], "sources": [], "level": "Deep", "detail": "These are proposed responsibility boundaries for the stated scope, not mandatory class names. Merge trivial wrappers when they do not improve the explanation.", "kind": "step-4", "problem": "Multi-step approval workflow", "step": 4, "slug": "approval"}, {"id": "L401", "number": 401, "module": "P30", "title": "Design the public API", "idea": "Check command replay identity, then current version/step and actor authorization. A duplicate earlier decision must not be applied to whichever step happens to be current now. Return a new immutable view after a successful decision.", "mental": "State the precondition, success result, rejection behavior and ownership of returned data for each operation.", "code": "WorkflowView submit(Submission submission);\nWorkflowView decide(DecisionCommand command);\nList<DecisionRecord> history(WorkflowId id);", "gotcha": "A command ID alone is not authorization.", "question": "What must a command identify besides the workflow?", "options": ["Only the document title", "The intended step, version and actor", "Only a timestamp string"], "answer": 1, "explanation": "The intended step, version and actor. Check command replay identity, then current version/step and actor authorization. A duplicate earlier decision must not be applied to whichever step happens to be current now. Return a new immutable view after a successful decision.", "practice": "Write one accepted and one rejected call for the highest-risk API.", "flow": ["Validate input", "Decide", "Return result", "Caller contract"], "sources": [], "level": "Deep", "detail": "Names used in snippets are illustrative. Short declarations are contextual API sketches rather than complete source files.", "kind": "step-5", "problem": "Multi-step approval workflow", "step": 5, "slug": "approval"}, {"id": "L402", "number": 402, "module": "P30", "title": "Draw the state machine", "idea": "Approval advances to the next configured step; approving the final step terminates the workflow. Rejection is terminal under this baseline. Resubmission creates a new version or new workflow with explicit linkage rather than erasing the rejection.", "mental": "A state name is not a transition guard. For each arrow, name the command, authorized actor, condition and mutation.", "code": "", "gotcha": "Rejection is terminal in this baseline.", "question": "What happens after final-step approval?", "options": ["The workflow becomes APPROVED", "It loops to the first step", "It stays pending forever"], "answer": 0, "explanation": "The workflow becomes APPROVED. Approval advances to the next configured step; approving the final step terminates the workflow. Rejection is terminal under this baseline. Resubmission creates a new version or new workflow with explicit linkage rather than erasing the rejection.", "practice": "Create a table: current state, command, guard, next state, rejection result.", "flow": ["SUBMITTED", "STEP PENDING", "APPROVED", "REJECTED"], "sources": [], "level": "Deep", "detail": "The visual is a simplified lifecycle overview, not a claim that every adjacent box is a legal edge. The prose defines the actual allowed transitions.", "kind": "step-6", "problem": "Multi-step approval workflow", "step": 6, "slug": "approval"}, {"id": "L403", "number": 403, "module": "P30", "title": "Trace the key operation", "idea": "Under the workflow lock, replay a matching known command or reject conflicting reuse. Validate expected version, step ID and actor. Construct the immutable decision record, update the step and current index, append audit history and increment version together.", "mental": "The important line is where ownership or durable intent changes. Identify which work may happen before, inside and after the chosen boundary.", "code": "", "gotcha": "Validate current step and version before applying a new decision.", "question": "What happens before a new decision is applied?", "options": ["Increment the step unconditionally", "Delete previous history", "Validate version, step and authorization"], "answer": 2, "explanation": "Validate version, step and authorization. Under the workflow lock, replay a matching known command or reject conflicting reuse. Validate expected version, step ID and actor. Construct the immutable decision record, update the step and current index, append audit history and increment version together.", "practice": "Number the messages and mark the commit point. Then place a failure before and after it.", "flow": ["Decision command", "Identity + authorization", "Current-step guard", "Audit + advance"], "sources": [], "level": "Deep", "detail": "This sequence is the scoped local design. Effects outside the process require the additional protocol described in the failure card.", "kind": "step-7", "problem": "Multi-step approval workflow", "step": 7, "slug": "approval"}, {"id": "L404", "number": 404, "module": "P30", "title": "Read the core Java logic", "idea": "The order prevents a replay from acting on a later step. Authorization still needs a clear replay policy; do not expose another actor's result simply because they know a command ID. The sketch assumes authorization identity is supplied by a trusted boundary.", "mental": "Read the guard first, then the planned values, then the live mutations. Do not infer helper behavior that is not part of the described contract.", "code": "DecisionRecord prior = decisions.get(command.id());\nif (prior != null) return replayOrReject(prior, command);\nrequireVersion(command.expectedVersion());\nrequireCurrentStep(command.stepId());\nrequireAuthorized(command.actor());\nDecisionRecord record = planDecision(command);\napplyDecision(record);\nversion++;", "gotcha": "Replay results still need an authorization policy.", "question": "Why check replay identity explicitly?", "options": ["To make every command unique by clock", "So a duplicate does not act on a later current step", "To skip all authorization"], "answer": 1, "explanation": "So a duplicate does not act on a later current step. The order prevents a replay from acting on a later step. Authorization still needs a clear replay policy; do not expose another actor's result simply because they know a command ID. The sketch assumes authorization identity is supplied by a trusted boundary.", "practice": "Explain every line, then introduce one bug and write a test that catches it.", "flow": ["Guard", "Plan", "Commit", "Result"], "sources": [], "level": "Deep", "detail": "Card snippets are contextual sketches, not independently compilable programs. Selected complete implementations are separately marked in the companion coverage manifest.", "kind": "step-8", "problem": "Multi-step approval workflow", "step": 8, "slug": "approval"}, {"id": "L405", "number": 405, "module": "P30", "title": "Handle races and failure", "idea": "Two approvers or browser tabs can act on the same version. Only one matching state transition may commit. Version checks plus the workflow boundary reject the stale command. A mutable global policy must not alter the already-captured step sequence.", "mental": "Separate in-process atomicity from persistence, external effects and multi-server coordination. A local lock solves only the scope it actually covers.", "code": "", "gotcha": "Concurrent browser tabs can submit stale versions.", "question": "Two tabs decide from the same version. What is valid?", "options": ["One commits and the stale decision is rejected", "Both always advance different steps", "Both delete the audit trail"], "answer": 0, "explanation": "One commits and the stale decision is rejected. Two approvers or browser tabs can act on the same version. Only one matching state transition may commit. Version checks plus the workflow boundary reject the stale command. A mutable global policy must not alter the already-captured step sequence.", "practice": "Write a two-column interleaving showing the broken version, then mark what the fixed boundary prevents.", "flow": ["Caller A", "Shared boundary", "Caller B", "Invariant"], "sources": [], "level": "Deep", "detail": "A successful stress test is useful evidence, not a proof of all schedules or production reliability.", "kind": "step-9", "problem": "Multi-step approval workflow", "step": 9, "slug": "approval"}, {"id": "L406", "number": 406, "module": "P30", "title": "Build the test plan", "idea": "Finance cannot approve the manager step.\nA duplicate manager command does not advance finance.\nConcurrent decisions based on one version produce one committed transition.\nPolicy edits after submission do not change the captured steps.", "mental": "For each test, assert both the result and the final state. On rejection, assert that unrelated state did not change.", "code": "", "gotcha": "Test duplicate decisions across a step transition.", "question": "Which test protects policy history?", "options": ["Only create one empty workflow", "Only compare role strings", "Edit the policy after submit and keep captured steps"], "answer": 2, "explanation": "Edit the policy after submit and keep captured steps. Check the result and every relevant invariant, including state after failure.", "practice": "Implement at least two tests before looking at a reference implementation. Add one metamorphic or conservation property.", "flow": ["Arrange", "Act", "Assert result", "Assert state"], "sources": [], "level": "Deep", "detail": "Use deterministic clocks, scripted inputs and coordinated starts where relevant. Check worker exceptions rather than losing them in background threads.", "kind": "step-10", "problem": "Multi-step approval workflow", "step": 10, "slug": "approval"}, {"id": "L407", "number": 407, "module": "P30", "title": "Change one requirement", "idea": "Add parallel approvals with a quorum. Each approver vote needs identity and deduplication, and the quorum transition must occur once. Define rejection precedence and what late votes mean after the workflow becomes terminal.", "mental": "An explicit step list is easy to inspect for sequential approval. A generic workflow graph supports branches but needs cycle handling, join semantics and richer validation. Introduce that machinery only when requirements justify it.", "code": "", "gotcha": "Parallel quorum introduces one-time join semantics.", "question": "What does a quorum extension add?", "options": ["Automatic cycle elimination", "Vote identity and one-time quorum
