t snapshot does not deep-copy an arbitrary payload.", "Concurrent publications can still race inside the same listener.", "Test duplicate registration tokens independently.", "Async queues need a slow-subscriber policy.", "Copy-on-write is expensive when subscriptions change often."], "checks": [["What is the delivery boundary?", "Subscribers in a captured snapshot", "Everyone who ever subscribed", "Only whoever remains after all callbacks finish"], ["Does B get the current event after A unsubscribes B?", "Yes, because B was captured", "No, never", "Only if B subscribes again"], ["What uniquely identifies a registration?", "Its subscription token", "Only the callback class name", "Only the topic string"], ["Who owns the registry?", "EventBus", "Event", "DeliveryReport"], ["Closing one duplicate registration should remove?", "Only that registration", "Every callback of the same class", "The entire topic"], ["Can an unsubscribed callback still be in flight?", "Yes", "No", "Only after a process restart"], ["When is the registry lock released?", "Before invoking callbacks", "After every callback has finished", "Never"], ["What does List.copyOf copy here?", "The list structure, not arbitrary nested mutable payloads", "The entire process memory", "All listener state recursively"], ["Can concurrent publishers invoke one listener concurrently?", "Yes unless the bus adds serialization", "Never because the list is copied", "Only with a null topic"], ["Which test clarifies unsubscribe semantics?", "Unsubscribe during an active callback snapshot", "Only publish to an empty topic", "Only print token IDs"], ["What must asynchronous delivery define?", "Backpressure or overflow behavior for slow subscribers", "Only a thread name", "A promise of unlimited throughput"], ["When is copy-on-write attractive?", "Many traversals and relatively few registration changes", "Every operation mutates the list heavily", "Only with durable storage"]], "sources": ["S03", "S11", "S18"], "module": "P10"}, {"slug": "library", "title": "Library lending system", "level": "Core", "brief": "Design a library core that lends physical copies of books to members and records returns. Several copies may share a title. Enforce a maximum number of active loans per member and prevent a copy from being lent to two members at once.", "scope": "One branch, distinct copy IDs, injected clock and fixed loan duration. No fines, reservation queue, ebook licensing or inter-branch transfer in the core.", "ask": "Do we lend a title or a physical copy? A copy. Can a return be retried? Yes. Does a missing copy equal a currently borrowed copy? No; report different failures.", "example": "Title T has copies C1 and C2. Ana borrows C1 and Ben borrows C2. A third request for C1 is rejected. Ana returns her loan. C1 becomes available while Ben's C2 loan remains active.", "outcome": "Title-level stock is not the identity of a loan. Returning C1 must not affect C2, even though both have the same title.", "rules": ["A copy has at most one active loan.", "A member's active loan count never exceeds the configured limit.", "Closing a loan releases its copy at most once."], "model": ["Library: owns checkout/return and cross-index consistency.", "BookTitle: bibliographic metadata shared by copies.", "BookCopy: unique physical inventory identity.", "Member: ID and lending eligibility.", "Loan: copy ID, member ID, due time and returned time."], "owner": "Library", "peers": ["BookTitle", "BookCopy"], "apis": "LoanView checkout(String memberId, String copyId);\nLoanView returnLoan(String loanId);\nList<LoanView> activeLoans(String memberId);", "api_note": "checkout validates known member, known copy, availability and member limit in one operation. Return uses loan identity, not just a title or current copy status. A repeated return returns the closed loan view.", "states": ["AVAILABLE", "ON LOAN", "RETURNED", "AVAILABLE AGAIN"], "state_note": "A loan moves ACTIVE to RETURNED; a copy cycles AVAILABLE to ON_LOAN to AVAILABLE. Retain loan history so an old return cannot close a newer loan on the same copy.", "flow": ["Librarian", "Library", "Copy + member checks", "Loan"], "trace": "Validate both IDs, find whether the copy has an active loan, and check the member's active count. Create the due time from the injected clock, then store the loan and update the copy and member indexes atomically.", "code": "synchronized LoanView checkout(String member,\n                               String copy) {\n    requireKnown(member, copy);\n    requireCopyFree(copy);\n    requireBelowLimit(member);\n    Loan loan = createLoan(member, copy, clock.instant());\n    activeByCopy.put(copy, loan.id());\n    loans.put(loan.id(), loan);\n    incrementActiveCount(member);\n    return view(loan);\n}", "code_note": "The companion keeps history and active indexes behind one Library monitor. Due-time construction and predictable validation occur before mutation. A title search service can be independent of the checkout consistency owner.", "race": "Two librarians can both observe a copy as free unless checkout is atomic. Member limits also span multiple copies, so locking only the requested copy is insufficient for simultaneous checkouts by the same member. A coarse library lock is the clear baseline.", "tests": ["Two copies of the same title can be lent independently.", "Two contenders for one copy produce one active loan.", "A member at the limit is rejected without reserving the copy.", "A stale repeated return never closes a newer loan for that copy."], "extension": "Add a FIFO reservation queue per title. Returning a copy can make it HELD for the next eligible member rather than immediately available. Introduce hold expiry and eligibility rechecks; do not silently reuse the old availability semantics.", "tradeoff": "Maintaining per-member counts makes limit checks fast but adds an invariant with loan history. Scanning active loans is simpler for small data and costs O(L). Choose one representation and test its consistency.", "cost": "C copies, M members and L retained loans. Indexed checkout/return are expected O(1), excluding returned-list creation. Active-loan listing is O(L) in a simple history scan; storage O(C + M + L).", "pitch": "The central modeling distinction is title versus physical copy. The central atomic rule includes both copy availability and member capacity. I retain loan identity so retried returns cannot act on a later loan.", "gotchas": ["A title ID is not a physical copy ID.", "Returning one copy must not release all copies of its title.", "A member-limit check races across different copies too.", "Book metadata should not own checkout workflow.", "Return by old loan ID is safer than setting a copy available.", "A returned loan remains historical rather than becoming active again.", "Compute predictable failures before updating any index.", "A maintained count must match active loans.", "Per-copy locks alone cannot enforce a member-wide limit.", "Test old-return replay after the copy has been borrowed again.", "Reservation queues introduce a HELD state.", "Unbounded retained history needs an archival policy outside the toy run."], "checks": [["What object is actually lent?", "A uniquely identified physical copy", "Only a book title", "A new member account"], ["Ana returns C1. What happens to C2?", "It remains on Ben's active loan", "It is also returned", "Its title changes"], ["Which rule spans multiple copies?", "The member's active-loan limit", "A copy's label color", "The ISBN string length"], ["Who owns atomic checkout?", "Library", "BookTitle", "BookCopy metadata"], ["What ID should a retry-safe return use?", "Loan ID", "Only the title name", "Only the member's display name"], ["May an old returned loan become active again?", "No", "Yes whenever its copy is free", "Only after midnight"], ["What must be checked before creating the active loan?", "Copy availability and member capacity", "Only the title text", "Only the due date format"], ["What must match incrementActiveCount?", "The actual set of active loans", "The number of all historical titles", "The shelf count only"], ["Why are per-copy locks insufficient by themselves?", "Two different copies can exceed one member's limit", "Copies can never be locked", "Members have no state"], ["Which stale-operation test matters?", "Return an old loan after the copy is lent again", "Only search by author", "Only register a member"], ["What state can a reservation queue introduce?", "HELD for an eligible next member", "Permanently RETURNED", "Always AVAILABLE"], ["What is the cost of scanning loan history for a member?", "O(L)", "Always O(1)", "O(C squared) regardless of history"]], "sources": ["S07"], "module": "P11"}, {"slug": "splitwise", "title": "Expense sharing and settlement", "level": "Core", "brief": "Design an expense-sharing core. A payer records a positive expense for a group of unique members. Allocate exact integer minor-unit shares and update each member's net balance. Support equal splitting first, with deterministic remainder allocation.", "scope": "One currency per ledger, one payer per expense, integer minor units, in-memory atomic posting and request-ID deduplication. No real transfers, currency exchange or proof of a minimum-number-of-payments settlement.", "ask": "Does the payer participate in the split? Yes in this baseline. What does a positive balance mean? The member is owed money. How are remainder units assigned? To earlier members in a documented deterministic order.", "example": "A pays 100 for members [A,B,C]. Equal shares are [34,33,33]. A receives +100 for paying and -34 for consumption, so A=+66, B=-33 and C=-33. Total net balance remains zero.", "outcome": "A's balance is not +100 because A consumed a share too. A settlement of 33 from B to A moves B to zero and A to +33; it does not create a second expense.", "rules": ["Shares are nonnegative and sum exactly to the expense amount.", "Every posted expense changes total net balances by zero.", "A request ID identifies one immutable expense payload and is posted at most once."], "model": ["ExpenseService: validates and atomically posts an expense.", "SplitPolicy: produces member-to-share allocation.", "Expense: immutable payer, amount, ordered participants and shares.", "BalanceLedger: net amount owed to or by each member.", "Settlement: a separate payment acknowledgement between two members."], "owner": "ExpenseService", "peers": ["SplitPolicy", "ExpenseView"], "apis": "ExpenseView addEqual(String requestId, String payer,\n    long amount, List<String> members);\nMap<String, Long> balances();", "api_note": "Reject duplicate participants, an absent payer, nonpositive amounts and conflicting request-ID reuse. Snapshot balances without exposing the mutable ledger. A settlement request needs its own identity and validation rather than reusing expense semantics.", "states": ["DRAFT", "VALIDATED SHARES", "POSTED", "REPLAYED / REVERSED"], "state_note": "Posted expenses are immutable history. A correction creates a clearly linked reversal and replacement in an extended model, rather than silently editing past balance effects. A successful identical retry returns the prior expense.", "flow": ["Caller", "Split policy", "Validate conservation", "Post balances"], "trace": "Validate the request and check deduplication. Compute shares with quotient and remainder. Build all resulting balances in a temporary plan with overflow checks. Commit the new balances and expense history together only after the complete plan is valid.", "code": "long base = amount / members.size();\nlong rest = amount % members.size();\nfor (int i = 0; i < members.size(); i++) {\n    String member = members.get(i);\n    long share = base + (i < rest ? 1 : 0);\n    long delta = member.equals(payer) ? amount-share : -share;\n    next.merge(member, delta, Math::addExact);\n}\n// Commit next and the request result together.", "code_note": "next is a private plan, not live shared state. Applying the payer's net effect avoids a temporary arithmetic overflow that a separate debit then credit could create. Participant order determines remainder units and is part of request identity.", "race": "Two concurrent expenses touch several balances. One service lock is a valid in-memory baseline. Independent ConcurrentHashMap.merge calls do not make a multi-member posting atomic. A retry with the same ID and changed amount must be rejected.", "tests": ["100 split three ways produces 34,33,33.", "For many amounts, shares sum exactly to the amount.", "Total net balances remain zero after every expense.", "An identical retry changes nothing; conflicting reuse is rejected."], "extension": "Add exact or weighted shares behind SplitPolicy, then validate their sum and membership at the service boundary. A greedy debtor-creditor matcher can produce a valid settlement suggestion but does not generally prove a globally minimum number of transfers.", "tradeoff": "Net balances are compact but lose who originally owed whom. Keep immutable expense history for explanation and corrections. Pairwise balances retain more relationship detail but use more state and do not remove conservation requirements.", "cost": "P participants and M members: O(P) share planning; the simple companion copies the balance map, making posting O(M + P). O(M + E*P) retained storage across E expenses with participant history.", "pitch": "I define the balance sign and remainder rule before classes. The important correctness properties are conservation and retry identity. I do not confuse a valid settlement heuristic with an optimal-transfer proof.", "gotchas": ["This is an accounting exercise, not a money-transfer service.", "The payer also owes their own consumption share.", "Dropping a remainder loses money in the model.", "A split policy computes shares; it should not independently persist balances.", "List order affects this deterministic remainder policy.", "Editing a posted expense silently destroys an audit trail.", "Validate all resulting balances for overflow before committing.", "The sketch must operate on a plan, not a half-mutated live ledger.", "Per-member atomic increments do not create one atomic expense.", "Check the sum after a long sequence, not just one expense.", "Greedy debt simplification is not a general minimum-transfer proof.", "Net balances alone cannot explain individual expense history."], "checks": [["What does a positive net balance mean?", "The member is owed money", "The member owes money", "The expense was rejected"], ["What is A's balance after paying 100 for A,B,C?", "+66", "+100", "-34"], ["What must every expense preserve?", "The sum of net balances remains zero", "Every member balance stays positive", "Every share is exactly equal even with a remainder"], ["Who posts all member effects together?", "ExpenseService", "SplitPolicy", "ExpenseView"], ["What happens on same ID with a different amount?", "Reject conflicting reuse", "Post it as another expense", "Return success while changing old history"], ["How should a posted expense correction be modeled?", "An explicit linked reversal or replacement workflow", "Silently mutate the historical record", "Delete all group balances"], ["Why build a balance plan first?", "To catch validation and overflow before live mutation", "To guarantee constant memory", "To avoid checking membership"], ["Which shares sum to 100 under this rule?", "34,33,33", "33,33,33", "34,34,34"], ["Why not independently merge each member into shared state?", "The whole expense would not be atomic", "Maps cannot hold signed values", "Hashing changes currency"], ["What broad property should tests assert?", "Conservation across many amounts and expenses", "Only that a receipt prints", "Only that names are unique"], ["Does a greedy settlement always minimize transfers?", "No; it is not a general optimality proof", "Yes, by definition", "Only because the currency is fixed"], ["What does net-only storage lose?", "The explanation of individual original expenses", "The ability to add integers", "The currency unit automatically"]], "module": "P12"}, {"slug": "meeting", "title": "Meeting-room booking", "level": "Core", "brief": "Design a booking calendar for named meeting rooms. A request supplies a room, organizer, start and end. Accept the booking only when its half-open time range does not overlap another active booking in that room. Support cancellation.", "scope": "One location, Instant endpoints, known rooms and no recurring meetings. Room capacity and equipment filtering are extensions. Cancellation is by booking ID and is idempotent in the core.", "ask": "Can meetings touch at an endpoint? Yes. Are empty intervals allowed? No. Can different rooms be booked at the same time? Yes. Are conflicts checked at request time? Yes; search results are only advisory.", "example": "R1 has [10:00,11:00). A request for [11:00,12:00) succeeds. A request for [10:30,11:30) fails. The same overlapping range in R2 can succeed. Cancel the first booking and its interval no longer blocks R1.", "outcome": "The overlap formula uses strict less-than comparisons. Equality at an end/start boundary does not create a conflict under [start,end) semantics.", "rules": ["Every active booking has start < end.", "Active ranges for the same room do not overlap.", "Cancellation removes only the referenced active booking, at most once."], "model": ["CalendarService: owns booking and cancellation decisions.", "Room: stable ID and descriptive metadata.", "TimeRange: validated immutable endpoints and overlaps method.", "Booking: ID, room, organizer, range and status.", "RoomCalendar: optional per-room active interval index."], "owner": "CalendarService", "peers": ["TimeRange", "Room"], "apis": "BookingView book(String room, String organizer,\n    Instant start, Instant end);\nBookingView cancel(String bookingId);", "api_note": "Validate room and organizer IDs, construct a valid range, and check overlap at the commit boundary. An earlier findAvailableRooms call does not reserve anything. Return a snapshot and keep cancellation history.", "states": ["REQUESTED", "CONFIRMED", "CANCELLED", "HISTORICAL"], "state_note": "There is no temporary hold in this baseline: booking commits immediately. Cancellation marks history and removes the range from active conflict checking. Rebooking creates a new booking ID rather than reviving an old cancelled object.", "flow": ["Organizer", "CalendarService", "Overlap check", "Booking"], "trace": "Under the calendar owner's lock, validate the room, scan active bookings in that room and reject any overlapping range. If none conflicts, create the ID and insert the booking. Cancellation changes status under the same boundary.", "code": "boolean overlaps(Booking b, Instant start, Instant end) {\n    return b.active()\n        && b.start().isBefore(end)\n        && start.isBefore(b.end());\n}\n// Scan + insert must be one atomic operation.", "code_note": "The formula catches partial overlap, full containment and identical ranges. It also permits adjacency. A per-room scan is an intentional baseline, not an interval-tree claim.", "race": "Two requesters can both observe a free room before inserting. Protect scan-and-insert together. With per-room locks, bookings of different rooms can proceed independently; operations involving several rooms require ordered multi-room coordination or a larger boundary.", "tests": ["Adjacent intervals are accepted.", "Contained and enclosing intervals are rejected.", "Different rooms allow identical times.", "Cancel then rebook succeeds, and repeated cancel does not affect the replacement."], "extension": "Recurring meetings require expanding or representing occurrences with a time zone, daylight-saving policy and exception dates. Decide all-or-nothing versus partial series acceptance. Do not model recurrence as adding 24 hours to every local day.", "tradeoff": "A list is easy to verify. For already-nonoverlapping intervals sorted by start time, predecessor/successor checks can be enough for single-resource insertion. General interval queries and recurrence require more careful indexing.", "cost": "B retained bookings: simple scan O(B) per book; expected O(1) ID cancellation. Per-room indexes reduce the scanned set; storage O(B + R).", "pitch": "My core uses one explicit endpoint convention and one atomic conflict check. I demonstrate adjacency and containment tests. Recurrence is separate because it changes both time modeling and the scope of an atomic request.", "gotchas": ["A calendar UI does not guarantee atomic booking.", "Endpoint equality is allowed under the chosen half-open rule.", "Checking only whether the new start lies inside misses enclosing intervals.", "A TimeRange cannot see other bookings by itself.", "An availability response is not a hold.", "Cancelled history must not block future bookings.", "Do not release the lock between conflict scan and insertion.", "Use strict comparisons for half-open overlap.", "Per-room locks need a new plan for multi-room bookings.", "Test a new interval that fully encloses an existing one.", "A local daily recurrence is not always exactly 24 elapsed hours.", "An interval tree is not required to solve a tiny in-memory prompt."], "checks": [["Can [10,11) and [11,12) share one room?", "Yes", "No", "Only after cancellation"], ["Does [10:30,11:30) conflict with [10,11)?", "Yes", "No", "Only in another room"], ["Which condition is mandatory?", "start is before end", "start equals end", "All meetings use one room"], ["Who owns conflict check plus insertion?", "CalendarService", "TimeRange", "Room metadata"], ["Does a search result reserve the room?", "No", "Yes forever", "Only if displayed in green"], ["Should cancelled ranges remain conflict-active?", "No", "Yes", "Only for the original organizer"], ["What must be atomic?", "Conflict scan and booking insertion", "Only formatting time", "Only generating an ID"], ["Which formula is correct for half-open overlap?", "a.start < b.end and b.start < a.end", "a.start <= b.end only", "a.end < b.start"], ["What does a per-room lock permit?", "Independent mutations for different rooms", "Uncoordinated multi-room transactions", "Automatic cross-server locking"], ["Which case catches a common bad formula?", "A new interval fully contains an old interval", "A booking in an empty calendar", "Two unrelated room names"], ["What must recurrence specify?", "Time zone, exceptions and partial-versus-atomic acceptance", "Only the weekday label", "Only a longer booking ID"], ["Why start with a list scan?", "It makes a correct baseline easy to inspect", "It gives O(1) arbitrary overlap queries", "It removes the need for tests"]], "sources": ["S07"], "module": "P13"}, {"slug": "seats", "title": "Movie-seat holds and confirmation", "level": "Deep", "brief": "Design assigned-seat booking for one show. A user holds one or more seats for a short duration, then confirms before expiry. A hold is all-or-nothing. A seat cannot belong to two live holds or confirmed bookings at once.", "scope": "One show, an injected clock, atomic multi-seat holds and in-memory confirmation. Payment is a separate external boundary; the core does not claim to charge a card or atomically commit a remote charge.", "ask": "Can a hold contain several seats? Yes, atomically. Is expiresAt itself valid? No: live means now < expiresAt. May another user confirm a hold? No. Does confirmation retry return the same result? Yes.", "example": "At t=0, Ana holds A1 and A2 until t=5. Ben cannot hold A2 at t=4. At exactly t=5, Ana cannot confirm. Ben can now claim A2. An old expiry task for Ana must not release Ben's new hold.", "outcome": "Seat ownership includes the hold ID, not just HELD status. Expiry is a logical rule checked by operations; a cleanup task may remove expired storage later.", "rules": ["No seat has more than one current owner.", "Every seat in a successful hold has the same hold ID and owner.", "Only the owner can confirm a still-live hold; stale commands cannot change a newer hold."], "model": ["ShowInventory: owns seat-to-hold and confirmed ownership.", "Hold: ID, owner, immutable seat set, expiry and state.", "SeatId: stable identity within a show.", "Booking: confirmed ownership derived from one hold.", "Clock: injectable current time for expiry decisions."], "owner": "ShowInventory", "peers": ["Clock", "SeatId"], "apis": "HoldView hold(String user, Set<String> seats, Duration ttl);\nBookingView confirm(String user, String holdId);\nvoid cancel(String user, String holdId);", "api_note": "Reject empty or unknown seat sets and nonpositive TTL. Confirmation checks ownership even on a retry. Expiry cleanup must compare the stored hold token before removing a seat mapping. Availability is computed from logical liveness.", "states": ["AVAILABLE", "HELD", "CONFIRMED", "EXPIRED / CANCELLED"], "state_note": "HELD can become CONFIRMED only before the deadline, or become EXPIRED/CANCELLED. CONFIRMED is terminal in this core. A seat can return to AVAILABLE after expiry, but the old hold object never becomes a new hold.", "flow": ["User", "ShowInventory", "Validate all seats", "One hold token"], "trace": "Under one inventory lock, sample time once, validate all requested seats and ignore or clean expired ownership. If any seat is unavailable, change nothing. Otherwise create one hold and assign its ID to every requested seat before returning.", "code": "synchronized BookingView confirm(String user, String id) {\n    Hold h = requireHold(id);\n    requireOwner(h, user);\n    if (h.confirmed()) return h.bookingView();\n    requireActive(h);\n    if (!clock.instant().isBefore(h.expiresAt()))\n        throw expired();\n    requireAllSeatsStillOwnedBy(h);\n    h.confirm();\n    return h.bookingView();\n}", "code_note": "requireActive rejects cancelled or otherwise inactive holds. Time is checked after that guard. A confirmed retry returns the prior booking, but even that retry must first validate the user. The complete companion includes both checks.", "race": "Expiry, replacement hold and confirmation must share the ownership boundary. Never release by seat ID alone: compare the old hold ID against the current seat owner. For payment, keep a durable attempt state and reconcile a timeout; do not hold the inventory lock during remote I/O.", "tests": ["A two-seat request fails entirely if either seat is taken.", "Confirmation at exactly expiresAt fails.", "Wrong-owner confirmation is rejected.", "A stale hold cancellation cannot free a seat held by a newer user."], "extension": "Add payment authorization and a confirmation workflow. Define what happens if payment succeeds after hold expiry, and whether to void/refund or offer a replacement. This needs explicit compensation and reconciliation, not a boolean paid field.", "tradeoff": "A show-wide lock makes multi-seat atomicity straightforward. Per-seat locks allow more parallelism but require deterministic lock ordering and handling partially acquired sets. Cross-process ownership needs shared coordination.", "cost": "K requested seats: expected O(K) validation and claim, O(K) confirmation ownership checks. Storage O(seats + retained holds and their seat lists); retained history needs cleanup.", "pitch": "I focus on expiring ownership, not just a seat status enum. All seats in a hold change together, and expiry has an exact boundary. The stale-release test is the design's most important failure demonstration.", "gotchas": ["A payment-success flag does not implement a payment protocol.", "Expiry at the exact deadline is rejected in this contract.", "A seat status without an ownership token permits stale release.", "The clock supplies time; inventory decides what that time means.", "An already-confirmed retry must still validate the user.", "An expired hold stays expired even if its seat later becomes free.", "Validate the complete seat set before claiming any of it.", "A cancelled hold cannot be confirmed merely because its deadline is in the future.", "Old cleanup work must compare hold IDs.", "Test failure on the last seat in a multi-seat request.", "Payment success after expiry is a reconciliation case.", "Per-seat locking requires ordering and rollback of partial acquisition."], "checks": [["Is a multi-seat hold partial in this contract?", "No; all seats or none", "Yes; whichever seats were free", "Only for premium seats"], ["Can Ana confirm at t=5 when expiresAt=5?", "No", "Yes", "Only after Ben tries"], ["What protects against a stale release?", "Comparing the current ownership token", "Only checking seat color", "Only knowing the original user name"], ["Who owns multi-seat atomicity?", "ShowInventory", "Clock", "SeatId"], ["Should confirmed retries bypass user checks?", "No", "Yes", "Only when a hold is old"], ["May CANCELLED become CONFIRMED here?", "No", "Yes before expiry", "Yes after expiry"], ["What happens if one requested seat is unavailable?", "Reject without claiming the others", "Claim the remaining seats silently", "Create a confirmed booking anyway"], ["Which guard must the complete confirm method include?", "Hold is active or already confirmed, not cancelled", "Only expiry time", "Only a nonempty ID"], ["What must stale expiry cleanup compare?", "Its hold ID against the current owner ID", "Only seat number", "Only the show title"], ["Which test catches partial-hold bugs?", "Request two seats when the second is taken", "Hold one free seat", "List the theater name"], ["A charge succeeds after hold expiry. Next step?", "Apply an explicit reconciliation or compensation policy", "Pretend it never happened", "Always seize a newly owned seat"], ["What is the simplest atomic baseline?", "One show-inventory lock", "One unrelated lock per user", "No coordination because seats are in a map"]], "sources": ["S07"], "module": "P14"}, {"slug": "hotel", "title": "Hotel room-type inventory", "level": "Deep", "brief": "Design hotel reservations sold by room type across a date range. A guest requests one room of a type for check-in through check-out. Every occupied night must have enough capacity, and the multi-night reservation succeeds atomically.", "scope": "One hotel, LocalDate nights, room-type capacity and booking/cancellation. Physical room assignment, payments, overbooking, taxes and housekeeping are excluded from the core.", "ask": "Is inventory per room or per type? Per type in this version. Does checkout consume a night? No. Can a three-night request partially succeed? No. Is same-day check-in/out accepted? No.", "example": "Deluxe capacity is 2 on each night. One booking uses Sep 10 and Sep 11. Another uses Sep 11 and Sep 12. A third request spanning Sep 10 through checkout Sep 13 fails because Sep 11 is full, even though the other nights have room.", "outcome": "Availability is the minimum free count across every occupied night. An aggregate free-room count for the whole hotel cannot answer this request.", "rules": ["For every room type and night, reserved count stays between zero and capacity.", "A confirmed booking reserves every night in its date range.", "Cancellation releases each originally reserved night at most once."], "model": ["HotelInventory: owns per-type per-night counts and reservations.", "RoomType: category and capacity policy.", "StayRange: nonempty LocalDate check-in/check-out value.", "Reservation: immutable type, occupied nights and state.", "RoomAssignment: a separate later mapping to physical room IDs."], "owner": "HotelInventory", "peers": ["RoomType", "StayRange"], "apis": "ReservationView reserve(String guest, String type,\n    LocalDate checkIn, LocalDate checkOut);\nReservationView cancel(String reservationId);", "api_note": "Choose a maximum stay length to bound work. Iterate dates with date arithmetic, not fixed elapsed-hour additions. Return a typed unavailability result identifying the first conflicting night when appropriate.", "states": ["REQUESTED", "CONFIRMED", "CANCELLED", "CHECKED IN (extension)"], "state_note": "The baseline inventory reservation has CONFIRMED and CANCELLED states. Physical check-in is not yet implemented. A later assignment workflow can reserve inventory before choosing one concrete room for the entire stay.", "flow": ["Guest", "Stay validation", "All-night capacity check", "Reserve nights"], "trace": "Expand the bounded half-open date range into occupied nights. Under the inventory boundary, check every type/night count. Build the reservation and increment all counts only after every night passes. Cancel looks up the original reservation range.", "code": "List<LocalDate> nights = stay.nights();\nfor (LocalDate night : nights)\n    requireAvailable(type, night);\nReservation r = createReservation(type, nights);\nfor (LocalDate night : nights)\n    incrementReserved(type, night);\n// All checks and increments share one boundary.", "code_note": "This is a contextual atomicity sketch. The inventory must define default capacity for dates not yet materialized. Avoid accidentally treating a missing count as zero capacity when it means zero reservations.", "race": "Two multi-night bookings must not both consume the last capacity on their common night. A hotel-level lock is the simple baseline. Fine-grained type/night locks require globally consistent acquisition order across date sets.", "tests": ["Checkout date is not reserved.", "A conflict on the final night rejects the entire stay.", "Two room types do not consume each other's inventory.", "Repeated cancellation releases no extra capacity."], "extension": "Assign a specific physical room at check-in or earlier. A room-type count alone does not prove one room is free for the entire stay if room-level constraints exist. Add room-level interval checks and an explicit reassignment policy.", "tradeoff": "Selling by type gives flexible later assignment, but counts abstract away room identity. Selling a specific room gives stronger identity guarantees with potentially less flexibility. Explain which contract the interviewer requested.", "cost": "D nights in the requested stay: O(D) validation and mutation with indexed counts. Space is proportional to materialized type/night entries plus retained reservations.", "pitch": "I model inventory per occupied night, not one total number. The multi-night check is all-or-nothing. I keep the distinction between selling a room type and assigning a physical room explicit.", "gotchas": ["Room-type inventory and physical room assignment are different problems.", "Checkout is an excluded boundary.", "A free first night does not imply a free complete stay.", "Room metadata does not own per-night atomicity.", "Bound the date range before expanding it.", "Do not claim check-in behavior that is not in the core.", "Validate all nights before increasing any count.", "Missing inventory entries need a defined meaning.", "Night-by-night locks acquired in different orders can deadlock.", "Test a conflict on the last rather than first night.", "Type-level counts can hide room-level placement constraints.", "One global availableRooms integer cannot represent nightly inventory."], "checks": [["What is sold in this version?", "A room type for each occupied night", "A permanent room purchase", "Only a check-in timestamp"], ["Why does the third example stay fail?", "Sep 11 has no remaining Deluxe capacity", "Sep 13 is always occupied", "All nights must have identical reservation IDs"], ["What must a successful stay reserve?", "Every occupied night", "Only check-in night", "Only checkout night"], ["Who owns the all-night capacity update?", "HotelInventory", "RoomType", "StayRange"], ["Why bound the stay length?", "To bound validation and expansion work", "To force a fixed currency", "To avoid identifying the guest"], ["Is physical check-in implemented in this core?", "No; it is an extension", "Yes in full detail", "Only for suites"], ["When may the night counts be incremented?", "After all nights pass validation", "Immediately after checking the first night", "After creating a display label"], ["How should a missing reserved-count entry be interpreted?", "According to an explicit zero-reserved/default-capacity contract", "Always as sold out", "Always as unlimited capacity"], ["What is the risky shared resource for overlapping stays?", "Their common room-type nights", "Only the guest name", "Only the reservation ID counter"], ["Which boundary test is essential?", "Checkout date is not consumed", "Only comparing hotel names", "Only creating a room type"], ["What does physical room assignment add?", "Room-identity and interval-placement constraints", "Only a receipt color", "No new validation"], ["What is the natural work variable for one booking?", "Number of occupied nights D", "Number of characters in the hotel name", "Only the number of room types"]], "module": "P15"}, {"slug": "rental", "title": "Vehicle rental and availability", "level": "Core", "brief": "Design reservations for individually identified rental vehicles. A customer selects a vehicle and a time range, receives a confirmed reservation, then checks out and returns it. Overlapping active reservations for the same vehicle are rejected.", "scope": "One branch, exact vehicle IDs, half-open Instant ranges, immutable quoted price, and manual state transitions. Driving-license checks, real payments, damage billing and cross-branch logistics are extensions.", "ask": "Is a car category or an exact vehicle promised? An exact vehicle. Can a car under maintenance be reserved? No. What happens when a vehicle is returned late? Record it and surface a conflict; do not silently overwrite a later reservation.", "example": "Car V7 is reserved for [09:00,12:00). Another [12:00,15:00) reservation is allowed. V7 is returned at 12:30. The second promise now needs an explicit operational resolution; changing the first booking's planned end does not make the problem disappear.", "outcome": "Planned reservation availability and actual vehicle possession are related but distinct. A late return creates a real conflict requiring a policy.", "rules": ["Active planned reservations for a vehicle do not overlap.", "A vehicle cannot have two simultaneous active rentals.", "The accepted quote is preserved even if the price policy later changes."], "model": ["RentalService: owns reservation and checkout transitions.", "Vehicle: ID, category and operational status.", "Reservation: customer, planned range, quote and status.", "Rental: actual checkout/return times tied to a reservation.", "PricingPolicy: creates a versioned immutable quote."], "owner": "RentalService", "peers": ["PricingPolicy", "VehicleView"], "apis": "ReservationView reserve(Request request);\nRentalView checkout(String reservationId);\nRentalView returnVehicle(String rentalId, Instant actualReturn);", "api_note": "Separate planned end from actual return. checkout validates both reservation state and current vehicle possession. Repeated return returns the recorded result; modifying actualReturn under the same command identity is a conflict.", "states": ["RESERVED", "CHECKED OUT", "RETURNED", "CANCELLED"], "state_note": "RESERVED may become CHECKED_OUT or CANCELLED. CHECKED_OUT becomes RETURNED. Cancellation is not a substitute for returning a vehicle already possessed by the customer. Maintenance affects new availability through a separate operational status.", "flow": ["Customer", "RentalService", "Vehicle + calendar", "Reservation / rental"], "trace": "For reservation, validate the range, maintenance state and calendar conflict, then snapshot the quote and commit. For checkout, validate the reservation and absence of an active rental before assigning possession. For return, close only the referenced rental.", "code": "requireState(reservation, RESERVED);\nrequireVehicleOperational(reservation.vehicleId());\nrequireNoActiveRental(reservation.vehicleId());\nRental rental = createRental(reservation, clock.instant());\nactiveRental.put(reservation.vehicleId(), rental.id());\nreservation.markCheckedOut();", "code_note": "The checkout sketch protects actual possession rather than only planned time. The complete system must state whether early checkout and late arrival are allowed. The walkthrough leaves these as explicit configurable rules.", "race": "A maintenance update racing with checkout must have a defined order. Use the same vehicle ownership boundary for operational status and active rental assignment. Locking only the reservation object does not protect the shared physical vehicle.", "tests": ["Adjacent planned intervals are accepted.", "Checkout fails when another rental still owns the vehicle.", "Changing the price policy does not rewrite an accepted quote.", "Repeated return does not close another rental."], "extension": "Sell by category and assign a vehicle later. Add a category-capacity reservation and an allocation step that respects branch, maintenance and actual possession. Do not claim a category count guarantees a specific vehicle is ready.", "tradeoff": "Exact-vehicle booking is easier to explain but less flexible operationally. Category booking permits reassignment but adds a second consistency problem between capacity promises and physical allocation.", "cost": "B reservations for a vehicle: O(B) baseline conflict scan; expected O(1) active-rental lookup. Storage grows with vehicles, reservations and rental history.", "pitch": "I separate the calendar promise from actual possession and preserve the quote at acceptance. That lets the design explain late returns rather than hiding them in a timestamp update.", "gotchas": ["A category promise is not the same as an exact-car promise.", "A late return can conflict with an already accepted next booking.", "A rental and reservation have different time facts.", "A pricing policy should not rewrite historical quotes.", "Actual return time is not the planned checkout boundary.", "Cancelling cannot make a physically borrowed vehicle reappear.", "Checkout must check actual possession.", "The sketch needs explicit early/late checkout rules.", "A per-reservation lock does not protect shared vehicle ownership.", "Test a late previous renter when the next customer arrives.", "Category allocation adds a second ownership stage.", "A calendar conflict scan is not a fleet-optimization algorithm."], "checks": [["What does this baseline promise?", "A specific vehicle", "Any vehicle worldwide", "Only a category with no identity"], ["A previous renter returns late. What follows?", "An explicit conflict-resolution policy is needed", "The next reservation disappears automatically", "Both customers may possess the same car"], ["Which fact is distinct from planned end?", "Actual return time", "Vehicle ID", "Customer ID"], ["Who coordinates checkout?", "RentalService", "PricingPolicy", "VehicleView"], ["Why snapshot the quote?", "To preserve the accepted pricing promise", "To make time stop", "To avoid all future validation"], ["Can CHECKED_OUT simply become CANCELLED?", "Not as a replacement for a physical return", "Yes, with no other effect", "Only if the user logs out"], ["What must checkout validate?", "No existing active rental for the vehicle", "Only a valid reservation ID format", "Only the current price"], ["What shared state does activeRental represent?", "Actual vehicle possession", "Only planned room capacity", "The number of search results"], ["What must coordinate with maintenance updates?", "The vehicle checkout boundary", "Only the receipt formatter", "Only the customer name"], ["Which test protects pricing history?", "Change policy after reservation and retain the old quote", "Only calculate a new price", "Only create a vehicle"], ["What does category booking add?", "Later physical vehicle allocation", "No new responsibilities", "Automatic handling of all late returns"], ["What is a baseline conflict-check cost?", "O(B) for B reservations on that vehicle", "Always O(1)", "O(number of driver-license digits)"]], "sources": ["S07"], "module": "P16"}, {"slug": "elevator", "title": "Elevator controller and dispatch", "level": "Deep", "brief": "Design a small elevator simulation. Riders submit hall requests with floor and desired direction; passengers submit car destination requests. A controller chooses which car handles a hall request. Each car moves one floor per simulation tick and opens only at a stop.", "scope": "A deterministic teaching simulation, not a certified physical control system. Fixed floor range, discrete ticks and simplified door states. No emergency braking, fire mode, capacity sensors or real hardware integration.", "ask": "Are hall and car requests different? Yes. Do repeated stop requests duplicate a stop? No. Must dispatch be globally optimal? No; start with a stated simple policy and discuss fairness.", "example": "A car at floor 0 receives destinations 3 and 5. It moves upward, stops at 3, opens, closes, then continues to 5. A new request behind it at 1 can wait until the car finishes its current upward work under the chosen policy.", "outcome": "Door state and movement state must agree. Choosing the nearest car for a new request is a policy, not proof of minimum waiting time or freedom from starvation.", "rules": ["A car never moves while its door is open.", "Its floor remains inside the building bounds.", "A served request is removed or acknowledged exactly once in the simulation."], "model": ["ElevatorSystem: receives hall requests and delegates dispatch.", "Dispatcher: selects a car from immutable car snapshots.", "ElevatorCar: owns current floor, direction, door and target stops.", "StopPolicy: chooses the next stop from pending work.", "Request: hall-call or car-destination data."], "owner": "ElevatorCar", "peers": ["Dispatcher", "Request"], "apis": "void hallCall(int floor, Direction direction);\nvoid carCall(String carId, int destination);\nvoid tick();\nCarView view(String carId);", "api_note": "Validate impossible calls such as UP at the top floor. A tick is one deterministic state-machine step, not an elapsed real-time guarantee. Dispatcher decisions must be revalidated if car state can change concurrently.", "states": ["IDLE", "MOVING", "DOOR OPEN", "DOOR CLOSING"], "state_note": "At a destination, stop before opening. An open-door tick closes the door without moving. A later tick can resume motion. Separating these states makes the safety invariant visible rather than implicit in several booleans.", "flow": ["Request", "Dispatcher", "Car stop set", "Tick + doors"], "trace": "Capture car states, select a candidate under the dispatch policy and assign the request. On each car tick, first handle the door state. If closed, choose a target, move toward it by one floor, and open only after reaching a stop.", "code": "if (door == OPEN) { door = CLOSED; return; }\nOptionalInt target = stops.next(floor, direction);\nif (target.isEmpty()) { direction = IDLE; return; }\nfloor += Integer.signum(target.getAsInt() - floor);\nif (floor == target.getAsInt()) {\n    stops.remove(floor);\n    door = OPEN;\n}", "code_note": "This is a simplified simulator step. It omits physical acceleration, door sensors and hazard responses. It also needs an explicit policy for a request on the current floor and for direction changes when pending work lies behind the car.", "race": "Serialize state transitions per car. Dispatch can select from snapshots but must atomically register an assignment or retry if rejected. Do not let a hall request and a car request use independent unsynchronized copies of the same stop set.", "tests": ["The car never changes floor on an open-door tick.", "Repeated requests for one floor do not create repeated identical stops.", "Out-of-range floors and impossible hall directions are rejected.", "Requests behind the travel direction are eventually served under the tested policy and assumptions."], "extension": "Add request aging to reduce starvation under sustained traffic, then compare wait times using a deterministic workload. Emergency modes require a separate safety-oriented specification and are not validated by this workshop simulator.", "tradeoff": "Nearest-car dispatch is simple but can be unfair and ignore direction. Direction-aware assignment and aging improve particular workloads at the cost of more state. Evaluate policy using a stated workload, not universal optimality claims.", "cost": "E cars and S pending stops per car: simple dispatch O(E); ordered stop insertion O(log S). Each simulated movement tick does bounded work plus stop-selection cost.", "pitch": "I separate dispatch from the car state machine. The car owns the door-and-motion invariant regardless of policy. I label the result as a simulation, not hardware safety software.", "gotchas": ["A toy controller is not a certified elevator safety design.", "A floor destination and a hall direction request are different inputs.", "Open doors and movement cannot be independent unrestricted setters.", "Dispatcher chooses; ElevatorCar validates its own transitions.", "Top-floor UP is an impossible hall direction.", "Opening must follow stopping, not happen during motion.", "Handle the door state before moving.", "The small tick code is not a complete real-time controller.", "Snapshot-based dispatch can race with car movement.", "A light-load test does not prove fairness under sustained arrivals.", "Emergency operation is outside the simulation contract.", "Nearest is not a proof of globally shortest waiting time."], "checks": [["What is this artifact's elevator scope?", "A deterministic teaching simulation", "A certified physical safety controller", "A full building evacuation system"], ["What must the car do before opening at floor 3?", "Stop at floor 3", "Move to floor 5 first", "Ignore all requests"], ["Which invariant is essential?", "Never move with doors open", "Always choose the nearest request", "Every request is served immediately"], ["Who owns door-and-motion consistency?", "ElevatorCar", "Dispatcher", "Request"], ["Which hall call is invalid?", "UP from the top floor", "DOWN from an interior floor", "A car destination within bounds"], ["An open-door tick should do what in the simple model?", "Close without moving", "Move two floors", "Open another car's door"], ["What is handled first in tick?", "Door state", "Random dispatch", "Receipt generation"], ["What does the sketch deliberately omit?", "Physical safety and sensor-control behavior", "The idea of a floor", "All state transitions"], ["What must be serialized?", "Mutations of one car's state and stop set", "Only rendering the building name", "Every unrelated read in the whole process"], ["Which test targets the door invariant?", "Assert floor stays unchanged during an open-door tick", "Only submit one request", "Only count cars"], ["What can request aging address?", "Starvation under some sustained workloads", "Hardware brake certification", "All possible optimality concerns"], ["What is simple dispatch cost over E cars?", "O(E)", "Always O(1)", "O(number of riders squared) regardless of policy"]], "module": "P17"}, {"slug": "atm", "title": "ATM withdrawal workflow", "level": "Deep", "brief": "Design the software workflow for a cash withdrawal: authenticate a session, validate an amount, obtain account authorization, plan available notes and coordinate dispensing. Treat bank calls and physical cash movement as separate effects with uncertain outcomes.", "scope": "A design walkthrough with fake bank and dispenser ports, not real ATM firmware or a banking compliance specification. The core focuses on state, note planning, operation identity and recovery boundaries.", "ask": "Can the requested amount be formed with available notes? It must be checked. Can the dispenser partially dispense? The port must report or allow reconciliation of that case. Does timeout prove failure? No.", "example": "A withdrawal asks for 130. The ATM has one 100 note and three 10 notes, so a note plan exists. The bank authorizes it, but the dispenser reply is lost. The workflow must keep the attempt unresolved instead of retrying an unrelated second dispense.", "outcome": "Account funds, reserved notes and physically dispensed notes are three different facts. The system must not invent a definite cash outcome after losing the hardware reply.", "rules": ["A note plan never uses more notes than are available.", "One withdrawal ID identifies one amount, account and dispense intent.", "Unknown physical outcomes remain tracked until reconciled rather than guessed."], "model": ["AtmSession: owns authenticated interaction state.", "WithdrawalCoordinator: owns operation lifecycle and recovery decisions.", "CashInventory: validates and reserves a feasible note plan.", "BankPort: authorizes, settles or reverses by stable operation reference.", "DispenserPort: executes and queries a dispense attempt.", "WithdrawalRecord: immutable intent plus state and external references."], "owner": "WithdrawalCoordinator", "peers": ["AtmSession", "CashInventory"], "apis": "WithdrawalView withdraw(SessionId session,\n    String requestId, long amount);\nWithdrawalView reconcile(String withdrawalId);", "api_note": "Avoid a boolean result that collapses declined, dispensed, partially dispensed and unknown. Authentication and amount limits belong to the session/policy boundary. Never include a raw secret such as a PIN in a diagnostic event.", "states": ["CREATED", "AUTHORIZED", "DISPENSE REQUESTED", "SETTLED / UNKNOWN"], "state_note": "Decline can terminate before dispensing. Authorization is not the same as final settlement. After a dispense request, a timeout enters UNKNOWN. Reconciliation may lead to settlement, partial handling or reversal under a specified bank/hardware protocol.", "flow": ["Session", "Withdrawal record", "Bank + dispenser ports", "Reconcile"], "trace": "Validate session and amount, create or replay the operation record, plan and reserve notes, obtain bank authorization, record dispense intent, then invoke the dispenser. Record its confirmed result and coordinate settlement. Every failure edge must say whether notes, authorization or cash might already exist.", "code": "Withdrawal w = beginOrReplay(request);\nNotePlan plan = inventory.reservePlan(w.id(), w.amount());\nAuthorization auth = bank.authorize(w.id(), w.amount());\nrecordDispenseIntent(w, auth, plan);\nDispenseResult result = dispenser.dispense(w.id(), plan);\n// Timeout -> UNKNOWN, not automatic second dispense.\nrecordAndReconcile(w, result);", "code_note": "This sketch illustrates boundaries only; it is not a safe complete protocol. The real ordering, recovery log and bank/dispenser guarantees must be specified together. Note reservation release is conditional on the known physical outcome.", "race": "Serialize ownership of a note reservation and use stable withdrawal IDs at retry-aware ports. A JVM monitor cannot atomically include a remote bank and physical dispenser. On restart, recovery requires durable attempt state, which the in-memory exercises do not implement.", "tests": ["An impossible denomination request causes no dispense call.", "A declined authorization releases only its own reserved note plan.", "A lost dispense reply yields UNKNOWN, not a second new dispense.", "Conflicting reuse of a withdrawal ID is rejected."], "extension": "For bounded note inventories, implement a feasible change planner and specify whether it minimizes note count or preserves certain denominations. Greedy largest-note-first can fail even when another valid combination exists.", "tradeoff": "A clear state machine and fake ports are more valuable than an elaborate ATM class hierarchy. Physical uncertainty prevents a simple local transaction from proving end-to-end exactly-once cash delivery.", "cost": "Cash-plan complexity depends on amount and denomination counts; do not claim constant-time withdrawal. External latency and recovery dominate a real workflow and are outside a sequential data-structure cost.", "pitch": "I do not equate an authorization with cash delivery. I expose uncertainty in the state machine and bind retries to one withdrawal intent. The interview implementation uses fake ports; the production protocol requires stronger durability and device guarantees.", "gotchas": ["This is not an operational banking or hardware safety specification.", "Available balance does not imply a feasible note combination.", "A timeout does not prove that no cash moved.", "The UI session should not own the whole recovery protocol.", "Never log authentication secrets to explain a failure.", "AUTHORIZED and SETTLED mean different things.", "Record operation identity before issuing an effect.", "The short sketch is not a complete recovery implementation.", "A local lock cannot include a physical dispenser in one atomic commit.", "Test the lost-reply case, not only explicit failure.", "Greedy bounded coin change is not universally feasible.", "Exactly-once physical effects cannot be asserted from a class diagram."], "checks": [["What does this walkthrough implement conceptually?", "A workflow with explicit fake ports and uncertainty", "Certified ATM firmware", "A guarantee of real-world exactly-once cash delivery"], ["The dispenser reply is lost. What is the state?", "UNKNOWN until reconciled", "Definitely no cash dispensed", "Definitely settled"], ["What must identify a dispense intent?", "A stable withdrawal ID and matching payload", "Only the current wall-clock second", "Only the user's display name"], ["Who owns recovery decisions?", "WithdrawalCoordinator", "AtmSession UI", "CashInventory alone"], ["Why is boolean success insufficient?", "It hides declined, partial and unknown outcomes", "It cannot store a class name", "It is always slower"], ["Is authorization the same as settlement?", "No", "Yes", "Only for small amounts"], ["What should be recorded before invoking a dispense effect?", "The stable dispense intent and references", "Only a success message", "A new unrelated retry ID"], ["What does the short code not provide?", "A fully durable recovery protocol", "A separation of ports", "A place for operation identity"], ["Can a Java lock make bank and cash movement atomic?", "No", "Yes across all machines", "Only if static"], ["What should a lost-reply test forbid?", "A blind second new dispense", "Recording UNKNOWN", "Querying the original attempt"], ["Can largest-note-first fail with limited notes?", "Yes", "No", "Only if every amount is negative"], ["What matters more than extra class hierarchy here?", "Explicit state, effect boundaries and recovery contracts", "More inheritance levels", "A globally writable balance field"]], "module": "P18"}, {"slug": "filesystem", "title": "In-memory file system and search", "level": "Core", "brief": "Design an in-memory hierarchical file system with directories and text files. Support creating paths, reading and appending file content, listing a directory and searching by name or size. Keep path traversal separate from search predicates.", "scope": "A rooted tree with absolute normalized paths. No symbolic links, hard links, permissions, disk persistence or concurrent streaming I/O. Names cannot be empty, dot or dot-dot, and a sibling name identifies only one entry.", "ask": "Does mkdir create missing parents? Choose and state the policy; this walkthrough uses explicit parent existence. Are listings sorted? Yes by name. Can a file and directory share one sibling name? No.", "example": "Create /docs, then /docs/notes.txt with text \"hello\". Reading returns hello; appending \"!\" returns hello!. Listing /docs yields notes.txt. Trying to create a directory at /docs/notes.txt fails because that name is already a file.", "outcome": "Paths identify entries within a parent, not arbitrary globally unique filenames. A search may visit many entries even when one direct path lookup is fast.", "rules": ["Each directory has unique child names.", "A file cannot contain children, and a directory cannot be read as text.", "Every non-root entry has one parent in the tree model."], "model": ["FileSystem: owns path resolution and controlled mutations.", "Entry: common immutable name and identity view.", "Directory: owns a map of child names to entries.", "TextFile: owns content through controlled operations.", "SearchPredicate: tests read-only entry metadata."], "owner": "FileSystem", "peers": ["SearchPredicate", "EntryView"], "apis": "void mkdir(String absolutePath);\nvoid write(String path, String text);\nString read(String path);\nList<String> list(String directory);\nList<EntryView> search(Predicate<EntryView> filter);", "api_note": "State overwrite versus append behavior explicitly; use separate methods if both are supported. Normalize paths once, validate the root and distinguish not-found from wrong-entry-type errors. Return read views, not mutable child maps.", "states": ["MISSING", "DIRECTORY / FILE", "UPDATED", "REMOVED (extension)"], "state_note": "A path segment resolves to either a file or a directory, never both. Removing a nonempty directory needs an explicit recursive-delete policy. The baseline does not silently reinterpret a file as a directory during traversal.", "flow": ["Path", "Resolver", "Directory children", "Typed operation"], "trace": "Split and validate the normalized absolute path, start at root and walk each parent segment, requiring a directory at every step. At the final segment, apply the operation's existence and type rules. Search separately traverses the tree and applies a predicate to metadata.", "code": "Entry current = root;\nfor (String part : normalizedSegments(path)) {\n    if (!(current instanceof Directory dir))\n        throw notDirectory();\n    current = dir.child(part);\n    if (current == null) throw notFound();\n}\nreturn current;", "code_note": "The resolver is a contextual Java 17 pattern-matching sketch. It assumes normalizedSegments validates forbidden components rather than silently accepting traversal surprises. Search filters should not mutate the tree while it is being traversed.", "race": "A simple file-system lock can protect path traversal plus mutation. Locking only the final entry is insufficient if a parent can be moved or removed concurrently. Snapshot search or read-lock traversal requires explicit freshness and writer-blocking semantics.", "tests": ["Reading a directory returns a typed failure.", "A missing parent is rejected under the chosen mkdir policy.", "Duplicate sibling names are rejected.", "Nested search returns matching files without exposing mutable entries."], "extension": "Add symbolic links only with a specified resolution depth or visited-identity cycle detection. A tree traversal that was safe without links can loop forever once the structure becomes a graph.", "tradeoff": "Composite modeling makes uniform traversal natural, while keeping addChild only on Directory preserves honest interfaces. A flat map keyed by full path simplifies lookup but makes subtree rename and ownership updates more expensive.", "cost": "D path segments: expected O(D) resolution with child maps. Search visits N entries: O(N + output size). Sorted listing of K children costs O(K log K) unless order is maintained on writes.", "pitch": "I first define path and type semantics. The resolver handles navigation; predicates handle filtering. I explicitly exclude links from the tree baseline and explain why adding them changes termination and identity rules.", "gotchas": ["A simplified tree is not a complete operating-system file system.", "The same filename may exist under different directories.", "A file cannot be used as an intermediate directory.", "Search predicates should not own mutation.", "Append and overwrite need distinct semantics.", "Deletion of a nonempty directory is not a trivial status flag.", "Validate and normalize before traversal.", "Do not silently swallow dot-dot into an unintended parent.", "Moving parents changes the meaning of final-entry locks.", "Test wrong type as well as missing path.", "Links turn a tree into a possible cyclic graph.", "A full-tree search is not O(path depth)."], "checks": [["Are symbolic links in the core?", "No", "Yes with all operating-system semantics", "Only when a filename contains a dot"], ["Can /a/x and /b/x both exist?", "Yes", "No; filenames are globally unique", "Only if both are directories"], ["Can a TextFile have child entries?", "No", "Yes; any Entry can", "Only after reading it"], ["Who coordinates path mutation?", "FileSystem", "SearchPredicate", "EntryView"], ["What must write versus append specify?", "Whether old content is replaced or extended", "Only the file extension", "Only the directory color"], ["Can traversal reinterpret an existing file as a directory?", "No", "Yes silently", "Only if the path is long"], ["What happens at every intermediate path component?", "Require a directory and resolve its child", "Search every unrelated file", "Create a new root"], ["What does the resolver assume?", "Segments are normalized and validated", "Every input is already trustworthy", "All missing paths are files"], ["Why can final-entry-only locking be insufficient?", "Parents may move or disappear during traversal", "Files never have names", "Maps cannot be synchronized"], ["Which test checks type safety?", "Attempt to read a directory as text", "Only read one existing file", "Only compare path strings"], ["What must link support address?", "Cycles and resolution policy", "Only text encoding", "Automatic disk durability"], ["What is full-tree search cost?", "O(N + output size)", "Always O(1)", "Only O(path depth)"]], "module": "P19"}, {"slug": "editor", "title": "Text editor with undo and redo", "level": "Core", "brief": "Design a single-document text editor with insert, delete, undo and redo. Each successful edit is one history entry. Undo restores the prior text; redo reapplies the undone edit. A new edit after undo discards the abandoned redo branch.", "scope": "Single-user in-memory text, character offsets and linear history. No collaborative editing, rich-text styles, persistence or grapheme-aware cursor handling. The tested companion uses text snapshots for clarity.", "ask": "Does an invalid edit enter history? No. Does a no-op count as an edit? This baseline ignores empty insertions and zero-length deletes. What happens after undo then a new edit? Clear redo history.", "example": "Start with \"ab\". Insert \"X\" at index 1 to get \"aXb\". Delete index 0 length 1 to get \"Xb\". Undo restores \"aXb\". Undo again restores \"ab\". Redo gives \"aXb\". A new insert now clears the old redo branch.", "outcome": "History is a branching timeline with only one active forward branch in this baseline. A redo entry refers to a specific prior state, not any later arbitrary text.", "rules": ["Invalid edits leave text and both history stacks unchanged.", "Undo and redo move one accepted edit between history sides.", "A new accepted edit clears all redo entries."], "model": ["Editor: owns current text and history stacks.", "EditCommand: optional operation-specific forward/inverse data.", "Snapshot: immutable text before or after an accepted edit.", "History: undo and redo stack ownership, possibly inside Editor.", "DocumentView: immutable current text and history availability."], "owner": "Editor", "peers": ["DocumentView", "EditCommand"], "apis": "void insert(int index, String text);\nvoid delete(int index, int length);\nboolean undo();\nboolean redo();\nString text();", "api_note": "Validate index and range before recording history. Define indices as Java UTF-16 code-unit positions for this simple model; this is not the same as user-perceived characters. Returning String is safe for text ownership.", "states": ["EDITED", "UNDO AVAILABLE", "REDO AVAILABLE", "NEW BRANCH"], "state_note": "Undo pushes current text onto redo, then restores the latest undo text. Redo pushes current text onto undo, then restores the latest redo text. A fresh edit adds the previous text to undo and clears redo.", "flow": ["Edit request", "Validate range", "Save prior text", "Apply + clear redo"], "trace": "For an edit, compute the resulting string before touching history. If the operation is valid and nontrivial, push the old text, assign the new text and clear redo. For undo/redo, check stack emptiness and move snapshots under one owner boundary.", "code": "String next = current.substring(0, index)\n    + inserted + current.substring(index);\nundo.push(current);\ncurrent = next;\nredo.clear();\n// Validate input before this sequence.", "code_note": "The companion uses snapshots instead of inverse commands, trading memory for simple correctness. A command-based delete must retain removed content and position. Neither approach by itself handles concurrent collaborative edits.", "race": "Serialize all operations on one Editor in the baseline. A stale client offset may refer to different text after another edit. Collaboration requires document versions and an operation-transformation or CRDT-style protocol outside this linear-history design.", "tests": ["Insert and delete followed by undo restore the exact prior text.", "An invalid range preserves text and history depths.", "A new edit after undo makes redo unavailable.", "Undo or redo on an empty stack is a no-op returning false."], "extension": "Coalesce consecutive typing into one undo unit with a documented boundary such as a pause or cursor move. Coalescing affects user-visible history, so test it separately from low-level character insertion.", "tradeoff": "Snapshots are easy to verify but store repeated text. Inverse commands save memory for small edits but make deletion data, grouping and index validity more complex. Persistent text structures are another advanced alternative.", "cost": "Text length N: simple String edit O(N). H full snapshots of average length N use O(H*N) character storage. Snapshot stack movement is O(1), but retaining text still has memory cost.", "pitch": "I make failure and branching semantics explicit. The baseline intentionally uses snapshots so undo is easy to prove. I can replace storage later without changing the visible edit/undo/redo contract.", "gotchas": ["A single-user undo stack is not a collaborative editor.", "Offsets are zero-based code-unit positions in this version.", "An invalid edit must not create a phantom history entry.", "A read view should not expose mutable history stacks.", "User-perceived characters may span multiple UTF-16 code units.", "New edits after undo invalidate the old redo branch.", "Compute and validate the new text before changing history.", "Deleting text requires retaining it if using inverse commands.", "Old offsets need version handling under concurrent editing.", "Test history depth as well as the final string.", "Grouping keystrokes changes the user-visible undo contract.", "Snapshots trade memory for simplicity."], "checks": [["What kind of history does this baseline support?", "Single-user linear history", "Full collaborative merge history", "Unlimited durable version control"], ["What is \"ab\" after inserting X at index 1?", "aXb", "Xab", "abX"], ["Should an invalid edit enter history?", "No", "Yes", "Only if it throws"], ["Who owns both history stacks?", "Editor", "DocumentView", "EditCommand alone"], ["What do indices mean here?", "UTF-16 code-unit positions", "Always complete visual characters", "Byte positions in a network packet"], ["A new edit follows undo. What happens to redo?", "It is cleared", "It is kept and applied to unrelated text", "It automatically becomes another document"], ["What happens before pushing history?", "Input validation and new-text computation", "Clearing every stack", "Returning a mutable buffer"], ["Why choose snapshots for the companion?", "Simple, verifiable reversal at a memory cost", "They always use constant total memory", "They automatically support collaboration"], ["What makes a stale client offset unsafe?", "Other edits may have changed the document positions", "Offsets are strings", "Undo always removes the whole document"], ["What should empty undo return?", "False without mutation", "A fabricated edit", "An exception after clearing text"], ["What does typing coalescence change?", "The undo-unit boundary", "Only the font", "The meaning of String immutability"], ["What is full-snapshot history space roughly?", "O(H*N)", "Always O(1)", "O(log H) regardless of text"]], "sources": ["S22"], "module": "P20"}, {"slug": "scheduler", "title": "Dependency-aware task scheduler", "level": "Deep", "brief": "Design an in-process scheduler for a fixed directed acyclic graph of jobs. A job becomes ready after all of its prerequisites succeed. Ready jobs can run concurrently. Record success, failure and cancellation, and avoid scheduling a job twice.", "scope": "A fixed graph validated before execution, one logical run, bounded worker concurrency and no crash recovery. Retry attempts, dynamic graph changes and distributed workers are extensions.", "ask": "Must every prerequisite succeed? Yes. Does one failed prerequisite block a dependent? Yes under this policy. Are cycles rejected? Yes before work starts. Can one completion callback be delivered twice? The owner must guard against double application.", "example": "A precedes B,C,D. E depends on B and C; F depends on C and D. After A succeeds, B,C,D become ready. When B and C both succeed, E becomes ready exactly once, even if their completion callbacks race.", "outcome": "A dependent is not ready when only one parent finishes. Its remaining-prerequisite count or equivalent state must be updated atomically with the ready transition.", "rules": ["A job enters RUNNING only after all required parents have succeeded.", "One attempt completion is applied at most once.", "A ready transition enqueues the job at most once."], "model": ["Scheduler: owns job states, remaining counts and ready queue.", "Job: ID, task function and immutable prerequisites.", "RunState: status, attempt ID and completion details.", "WorkerPool: executes submitted ready tasks.", "DependencyIndex: parent-to-dependent edges."], "owner": "Scheduler", "peers": ["WorkerPool", "Job"], "apis": "RunId start(List<Job> dag);\nvoid onComplete(JobId job, AttemptId attempt, Outcome result);\nRunView status(RunId run);\nvoid cancel(RunId run);", "api_note": "Validate unique IDs, known prerequisites and acyclicity. Bind completions to attempt IDs so a late attempt cannot overwrite a retry. This baseline records no durable recovery state; process loss loses the run.", "states": ["WAITING", "READY", "RUNNING", "SUCCEEDED / FAILED / BLOCKED"], "state_note": "A root starts READY. Claiming a ready job changes it to RUNNING. A successful completion may unlock dependents. A failure blocks descendants that require success, or follows another explicitly chosen policy. CANCELLED needs an outcome distinct from successful completion.", "flow": ["Completion", "Scheduler state", "Remaining prerequisites", "Ready queue"], "trace": "Under the scheduler state boundary, verify the attempt is currently RUNNING and not yet completed. Record its outcome once. On success, update each dependent's remaining count; when the count reaches zero and status is WAITING, mark READY and enqueue once.", "code": "if (!isCurrentRunningAttempt(job, attempt)) return;\nmarkSucceeded(job, attempt);\nfor (JobId child : dependents(job)) {\n    int left = decrementRemaining(child);\n    if (left == 0 && state(child) == WAITING) {\n        setState(child, READY);\n        ready.add(child);\n    }\n}", "code_note": "The sketch is the successful-completion branch and assumes a single shared state boundary. Failure propagation, queue-to-worker claiming and rejected executor submissions require their own transitions. Never mark a task submitted without handling submission rejection.", "race": "B and C may finish simultaneously. Protect each decrement together with the WAITING-to-READY transition, and reject duplicate completion for a finished attempt. Execute user tasks outside the state lock. Bounded workers prevent unbounded parallel launch, but a huge ready queue still needs a limit.", "tests": ["E waits until both B and C succeed.", "Duplicate completion for B does not decrement E twice.", "A cycle or unknown prerequisite is rejected before execution.", "A failed parent leads to a defined blocked outcome for its dependents."], "extension": "Add retries with a new attempt ID and policy for backoff and deadlines. A late success from an old attempt must not count as the current attempt's completion. External task side effects need their own retry-safe contract.", "tradeoff": "A central scheduler lock makes dependency transitions easy to inspect. Finer-grained atomics can reduce contention but must still couple count updates with one ready enqueue. Distributed scheduling introduces leases and durable state beyond this core.", "cost": "V jobs and E edges: graph validation and total dependency bookkeeping O(V + E). Memory O(V + E), plus task data and queueing. Task execution cost is separate.", "pitch": "I trace the multi-parent race, not only a root job. The key event is an idempotent completion that atomically unlocks a dependent once. I separate graph validation, state ownership and worker execution.", "gotchas": ["An in-process scheduler does not survive process loss.", "A child with two parents is not ready after only one completes.", "Duplicate completions must not make remaining counts negative.", "Workers execute tasks; the scheduler owns dependency state.", "Attempt identity matters once retries exist.", "FAILED and BLOCKED are not the same event.", "Mark READY and enqueue as one logical transition.", "The success branch alone is not a complete scheduler.", "Never run user task code while holding the scheduler state lock.", "Test racing completions for a shared child.", "A retry does not make arbitrary external effects safe.", "A bounded worker pool does not automatically bound the ready queue."], "checks": [["What graph is accepted?", "A validated fixed DAG", "Any cyclic graph", "Only a single chain"], ["When does E become ready?", "After B and C both succeed", "After B alone", "After D alone"], ["How many times may one attempt completion be applied?", "At most once", "Once per callback thread", "Until the queue is empty"], ["Who owns remaining-prerequisite counts?", "Scheduler", "WorkerPool", "Job function"], ["Why include AttemptId?", "To distinguish current completion from stale attempts", "Only to sort job names", "To avoid graph validation"], ["A failed prerequisite causes what here?", "A defined BLOCKED dependent outcome", "Automatic success of dependents", "Ignoring the edge"], ["What must accompany count reaching zero?", "One guarded WAITING-to-READY enqueue", "An unconditional enqueue on every callback", "A new duplicate job ID"], ["What does the sketch omit?", "Failure, submission rejection and cancellation branches", "The idea of dependencies", "The need for a ready queue"], ["Where should task code run?", "Outside the scheduler state lock", "Inside every dependency update lock", "In the graph constructor"], ["Which test catches double decrement?", "Deliver the same completion twice", "Only run one root task", "Only print the DAG"], ["What must a late old-attempt completion do?", "Not overwrite the current attempt's state", "Always count as another success", "Reset all child counts"], ["What is total graph bookkeeping cost?", "O(V + E)", "Always O(1)", "O(V factorial) for every DAG"]], "module": "P21"}, {"slug": "notifications", "title": "Notification delivery service", "level": "Deep", "brief": "Design a service that accepts a notification request, chooses email/SMS/push delivery adapters, respects user preferences and records an attempt outcome. Keep a logical notification separate from its delivery attempts.", "scope": "A local orchestration design with fake provider ports,
