immutable rendered content and explicit accepted/sent/failed/unknown statuses. Durable queues, production provider integration and guaranteed user receipt are excluded.", "ask": "Does provider acceptance mean the user read it? No. Can one logical notification have retries? Yes. What identifies duplicates? A caller request ID plus matching payload, and a separate stable provider key when supported.", "example": "Request N1 sends an email. The provider accepts it but the reply times out. The attempt becomes UNKNOWN. A retry must reconcile or reuse the provider's supported deduplication identity; it must not pretend that the first email was certainly not sent.", "outcome": "A notification can be accepted locally without being sent, and sent without being delivered or read. Each status needs a precise observational meaning.", "rules": ["One request ID binds to one recipient/channel/content intent.", "Preferences are checked according to a documented snapshot or send-time policy.", "Every external attempt has a recorded identity and outcome, including uncertainty."], "model": ["NotificationService: validates intent and orchestrates lifecycle.", "Notification: logical immutable recipient, channel and rendered content.", "DeliveryAttempt: attempt ID, provider reference and status.", "Sender: adapter for one channel/provider contract.", "PreferenceStore: supplies consent and routing rules.", "TemplateRenderer: creates immutable content before send."], "owner": "NotificationService", "peers": ["TemplateRenderer", "Sender"], "apis": "NotificationView submit(NotificationRequest request);\nAttemptResult send(NotificationId id);\nNotificationView status(NotificationId id);", "api_note": "Return local acceptance separately from provider delivery. Store rendered content or a template version and inputs so retries do not silently change the message. Do not use a universal boolean for every provider outcome.", "states": ["ACCEPTED", "SENDING", "SENT / FAILED", "UNKNOWN"], "state_note": "SENT here means the provider acknowledged acceptance, not that the human received or read the message. UNKNOWN is not terminal success or failure. Provider webhooks may add later states with idempotent event processing in an extension.", "flow": ["Request", "Preferences + render", "Attempt record", "Sender"], "trace": "Validate the request and deduplication identity, obtain the preference decision, render a stable message and create a logical notification. Before an external call, create an attempt record. Invoke the adapter outside internal locks and then record a confirmed or unknown outcome.", "code": "Notification n = acceptOrReplay(request);\nAttempt a = beginAttempt(n.id());\ntry {\n    ProviderResult r = sender.send(a.key(), n.content());\n    recordOutcome(a, r);\n} catch (ProviderTimeout e) {\n    markUnknown(a);\n}", "code_note": "The contextual sketch does not implement durable attempt storage. A crash between provider acceptance and local recording remains a recovery case. A provider key only helps when the provider explicitly supports the required deduplication contract.", "race": "Two workers must not create active sends for the same attempt without a claim rule. A lease plus attempt version is a possible persistence extension. A local synchronized block does not coordinate workers in different processes, and a retry decorator cannot invent provider idempotency.", "tests": ["Opted-out requests follow the stated suppression policy.", "An identical request ID replays one logical notification.", "Timeout is recorded as UNKNOWN.", "Changing the template after acceptance does not change a retried message."], "extension": "Add channel fallback, such as email then SMS. Decide whether fallback is allowed while email is UNKNOWN; it may create two user-visible messages. Model fallback as a new attempt under the same logical intent, with a visible policy.", "tradeoff": "Synchronous sending gives an immediate provider result but couples caller latency to the provider. Queued sending decouples callers but adds durable acceptance, retries, queue bounds and operator visibility.", "cost": "C candidate channels and content size M: O(C + M) local routing/render work, plus provider I/O. Retained attempt storage grows with notifications and retries.", "pitch": "I separate intent, rendered content and attempts. The API reports what is actually known rather than overstating delivery. Preference timing and retry identity are part of the contract, not implementation details.", "gotchas": ["Provider acceptance is not human receipt or reading.", "A timed-out email may already have been sent.", "Changing content on retry can violate request identity.", "A template renderer should not send the message.", "Provider idempotency cannot be assumed for every adapter.", "UNKNOWN must not be relabeled FAILED just to simplify a boolean.", "Record an attempt before making the effect where the durability design requires it.", "An in-memory attempt record does not survive a crash.", "Two workers need an explicit attempt claim boundary.", "Test preferences and content versioning, not only a happy send.", "Fallback during uncertainty can produce duplicate user-visible messages.", "A queue adds obligations as well as decoupling."], "checks": [["Does SENT mean the user read the message?", "No; this contract means provider acceptance", "Yes", "Only for SMS"], ["What should a lost provider reply produce?", "UNKNOWN", "Definite failure", "Automatic human-read status"], ["What should a request ID bind?", "Recipient, channel and content intent", "Only the current worker ID", "Only the minute of the day"], ["Who orchestrates notification attempts?", "NotificationService", "TemplateRenderer", "Sender alone"], ["Why keep rendered content or a template version?", "To make retries preserve the accepted message", "To guarantee inbox placement", "To avoid preference checks"], ["Can UNKNOWN be safely treated as no effect?", "No", "Yes", "Only after a short sleep"], ["What is created before the send call?", "A tracked delivery attempt", "A fake delivered receipt", "An unrelated new recipient"], ["What is not implemented by the short sketch?", "Durable crash recovery", "A place to mark unknown", "A sender boundary"], ["What prevents two workers sending the same active attempt?", "A defined atomic claim/lease rule", "Only different thread names", "Only an immutable template"], ["Which test protects retry content?", "Change a template after acceptance and replay the original content", "Only render once", "Only verify a nonempty subject"], ["What is risky about fallback during UNKNOWN?", "Both channels may eventually deliver", "It always cancels the first send", "It guarantees one message"], ["What does asynchronous sending add?", "Queue, retry and durable-acceptance decisions", "Automatic exactly-once delivery", "No extra states"]], "module": "P22"}, {"slug": "inventory", "title": "Inventory reservation service", "level": "Core", "brief": "Design a stock service that reserves positive quantities of a SKU, confirms a reservation when sold, and releases it when cancelled. Distinguish on-hand stock, reserved stock and available stock. Repeated cancellation must never create extra inventory.", "scope": "One in-memory inventory owner, multiple SKUs, no automatic expiry in the core and stable reservation request IDs. Multi-warehouse allocation, replenishment forecasting and payment integration are extensions.", "ask": "What is available? onHand minus reserved. Does confirmation reduce onHand? Yes and also reduces reserved. Does release reduce onHand? No. Can an ID be reused after cancellation? It replays the same old reservation, not a new claim.", "example": "SKU X starts with onHand=10 and reserved=0. Reserve 3: available=7, reserved=3. Confirm that reservation: onHand=7, reserved=0, available=7. Reserve 2 then cancel: onHand stays 7 and available returns to 7.", "outcome": "Confirmation is not a release followed by an unrelated sale. It changes onHand and reserved together while keeping available consistent.", "rules": ["For each SKU, 0 <= reserved <= onHand.", "Each active reservation contributes its quantity exactly once to reserved.", "A terminal reservation never releases or consumes stock again."], "model": ["Inventory: owns stock counters, reservations and atomic transitions.", "Stock: per-SKU onHand and reserved counts.", "Reservation: ID, SKU, quantity and ACTIVE/CONFIRMED/RELEASED state.", "StockView: immutable snapshot with computed available quantity.", "AllocationPolicy: optional multi-location quantity plan."], "owner": "Inventory", "peers": ["StockView", "AllocationPolicy"], "apis": "ReservationView reserve(String requestId, String sku, long qty);\nReservationView confirm(String reservationId);\nReservationView release(String reservationId);\nStockView stock(String sku);", "api_note": "reserve validates a positive quantity and matching payload on duplicate IDs. A confirmed reservation cannot be released under the core contract. Compute available from owned counters rather than maintaining a third independent mutable number.", "states": ["ACTIVE", "CONFIRMED", "RELEASED", "REPLAY SAME RESULT"], "state_note": "Only ACTIVE can transition to CONFIRMED or RELEASED. Repeating the same terminal operation returns its prior result; asking for the opposite terminal operation is a conflict. A released request ID does not create a fresh reservation.", "flow": ["Request", "Inventory owner", "Availability guard", "Reservation"], "trace": "Check request identity first. For a new reservation, validate SKU and quantity, then compare available with requested quantity under the same lock. Increase reserved and insert the reservation. Confirmation decreases onHand and reserved together; release decreases only reserved.", "code": "synchronized void confirm(String id) {\n    Reservation r = requireReservation(id);\n    if (r.confirmed()) return;\n    requireActive(r);\n    Stock s = stockFor(r.sku());\n    s.onHand -= r.quantity();\n    s.reserved -= r.quantity();\n    r.markConfirmed();\n}", "code_note": "The pre-existing reservation invariant proves enough reserved stock for this transition. Encapsulation matters: if callers can mutate counters, the reasoning collapses. The complete companion validates all public inputs and conflicting terminal actions.", "race": "Two reservations for the last unit must not both pass. One inventory lock makes check-and-reserve atomic. Several SKU locks can support parallelism but a multi-SKU order needs deterministic lock order or a larger transaction boundary.", "tests": ["Ten one-unit successes exhaust stock ten, and the next fails.", "Confirmation changes both counters without changing available incorrectly.", "Release twice does not inflate stock.", "Concurrent final-unit claims yield one active reservation."], "extension": "Add expiring reservations with a clock and ownership IDs. Cleanup must release only the still-active matching reservation; a confirmed sale must not be undone by an old expiry task. A multi-SKU order also needs all-or-nothing reservation semantics.", "tradeoff": "Computing available from two counters avoids a redundant third counter. Maintaining reservation history enables retry behavior but grows storage. An archival policy must preserve the required deduplication horizon.", "cost": "Expected O(1) single-SKU reserve/confirm/release, O(S + R) storage for S SKUs and R retained reservations. Multi-SKU work scales with the number of requested lines.", "pitch": "I define all three stock quantities explicitly and give each lifecycle transition a conservation equation. The race test and repeated-release test prove more than a diagram of Product and Warehouse classes.", "gotchas": ["Available and onHand are not interchangeable.", "Confirmation reduces both onHand and reserved.", "Releasing twice must not create stock.", "A stock view should not provide setters.", "A terminal request ID is not a fresh reservation key.", "CONFIRMED and RELEASED are different terminal outcomes.", "Deduplication checks must include SKU and quantity.", "Counter integrity depends on controlled mutation.", "Safe individual counter updates do not protect the whole reservation.", "Test opposing terminal operations, not only identical retries.", "Stale expiry must not undo a confirmed sale.", "Deduplication history needs a defined retention horizon."], "checks": [["What is available stock?", "onHand - reserved", "onHand + reserved", "reserved only"], ["After reserving 3 from 10 and confirming, what is onHand?", "7", "10", "3"], ["What must repeated release avoid?", "Increasing stock a second time", "Returning a prior result", "Finding the reservation ID"], ["Who owns the counters and transitions?", "Inventory", "StockView", "AllocationPolicy"], ["What happens if an old released ID is reserved again with the same payload?", "Replay that old reservation under this contract", "Create new stock", "Always create another active claim"], ["Can a confirmed reservation be released here?", "No; it is a conflicting terminal action", "Yes repeatedly", "Only if quantity is one"], ["What changes on reserve?", "Reserved increases; onHand stays the same", "onHand decreases immediately", "Both increase"], ["What changes on confirm?", "onHand and reserved both decrease by the quantity", "Only reserved increases", "Available becomes negative"], ["How many successes may compete for one final unit?", "One", "Two", "Any number if IDs differ"], ["Which test catches a stock-creation bug?", "Release the same reservation twice", "Only read initial stock", "Only insert one SKU"], ["What must an expiry task check?", "Matching active reservation ownership/state", "Only the SKU name", "Only its own scheduled time"], ["Why compute rather than store available separately?", "To avoid a redundant consistency invariant", "To make inventory unlimited", "To remove the need for validation"]], "module": "P23"}, {"slug": "wallet", "title": "In-memory wallet transfer ledger", "level": "Deep", "brief": "Design a teaching ledger that transfers integer minor units between existing wallets in one currency. A transfer must debit one wallet and credit the other atomically, reject insufficient funds and make successful retries idempotent by request ID.", "scope": "Single-process memory, no external banking, no fees, no foreign exchange and no production durability claim. Opening balances are setup data. The transfer log records immutable successful intents and results.", "ask": "Can wallets go negative? No. Is self-transfer allowed? This baseline rejects it. Does a failed insufficient-funds attempt consume its key? No in this chosen contract. A successful key remains bound to its original payload.", "example": "A=100 and B=20. Transfer request K moves 30 from A to B, yielding A=70 and B=50. Retrying K returns the same transfer without moving more. Reusing K for amount 40 is rejected. Trying to move 200 changes nothing.", "outcome": "Total balance stays 120 across successful internal transfers. This conservation property does not by itself establish a full production double-entry accounting system.", "rules": ["No wallet balance becomes negative.", "A successful transfer conserves the sum of the two balances.", "One successful request ID binds to one source, destination and amount."], "model": ["Ledger: owns balances and successful transfer records.", "Wallet: stable ID, currency and controlled balance.", "TransferRequest: immutable key, source, destination and amount.", "TransferRecord: immutable before/after or posting information.", "Money: unit-aware amount representation at the boundary."], "owner": "Ledger", "peers": ["TransferRequest", "WalletView"], "apis": "TransferRecord transfer(String requestId, String from,\n    String to, long amount);\nlong balance(String walletId);\nList<TransferRecord> history();", "api_note": "Validate known distinct wallets, one supported currency, positive amount, sufficient funds and destination overflow. Compare the full payload on a successful retry. History and balances are copied or immutable views.", "states": ["RECEIVED", "VALIDATED", "COMMITTED", "REPLAYED / REJECTED"], "state_note": "A rejected transfer makes no ledger change and is not retained as a successful idempotency result. A committed transfer is immutable. Reversal, when added, is another linked transfer, not deletion of history.", "flow": ["Request", "Deduplicate + validate", "Debit + credit", "Transfer record"], "trace": "Under one ledger lock, check for a previous successful key and compare payloads. Validate both wallets and amount, compute new debit and credit values using checked arithmetic, then assign both balances and store the transfer record together.", "code": "synchronized TransferRecord transfer(Request r) {\n    TransferRecord prior = committed.get(r.id());\n    if (prior != null) return sameIntentOrReject(prior, r);\n    validate(r);\n    long debit = balances.get(r.from()) - r.amount();\n    long credit = Math.addExact(balances.get(r.to()), r.amount());\n    TransferRecord result = recordOf(r, debit, credit);\n    balances.put(r.from(), debit);\n    balances.put(r.to(), credit);\n    committed.put(r.id(), result);\n    return result;\n}", "code_note": "validate proves positive amount and enough funds before subtraction. Destination overflow is checked before any live write. The record is constructed before committing. This in-memory critical section is not durable across process failure.", "race": "Two transfers from the same wallet must not both spend the same balance. A single ledger lock is the readable baseline. Per-wallet locks require stable ordering for two-wallet transfers and coordination of the shared idempotency registry.", "tests": ["The example conserves total balance.", "A successful identical retry changes nothing.", "Conflicting key reuse is rejected.", "Insufficient funds or destination overflow changes neither wallet."], "extension": "Add durable double-entry postings, immutable journal identity, transactional persistence, reconciliation and an explicit recovery model. External payment initiation needs a separate state machine; do not hold a local lock while waiting for a bank.", "tradeoff": "One lock simplifies correctness but limits concurrent independent transfers. Ordered per-wallet locking can improve parallelism at the cost of more complex interaction with deduplication and history. A database transaction is a different implementation boundary.", "cost": "Expected O(1) transfer lookup and mutation in the local model; O(W + T) storage for W wallets and T retained transfers. History snapshot is O(T). No availability or durable exactly-once guarantee is implied.", "pitch": "My answer focuses on conservation, failure atomicity and request identity. I compute all fallible arithmetic before live writes. I explicitly separate this tested interview core from a production financial ledger.", "gotchas": ["An interview wallet map is not a production financial platform.", "A successful retry must not transfer the amount again.", "Conservation alone is not a complete double-entry ledger.", "A request object does not own shared balances.", "A request ID without payload comparison hides conflicting intent.", "A failed request's deduplication policy must be stated.", "Compute destination overflow before debiting the source.", "The lock protects in-memory state, not durability.", "Per-wallet locks can deadlock without a stable order.", "Test destination overflow as well as insufficient funds.", "Reversal is an explicit compensating posting, not erasing history.", "A local Big-O claim says nothing about cross-region guarantees."], "checks": [["What durability does this core promise?", "None beyond the running process", "Bank-grade durable settlement", "Cross-region exactly-once posting"], ["After K transfers 30, what are A and B?", "70 and 50", "40 and 80", "100 and 20"], ["What stays constant for internal transfers?", "The total balance", "Every individual balance", "The number of successful requests"], ["Who owns debit, credit and deduplication together?", "Ledger", "TransferRequest", "WalletView"], ["What does same ID with amount 40 do after K=30?", "Reject conflicting reuse", "Transfer another 40", "Silently edit the old amount"], ["Does insufficient-funds rejection consume the key here?", "No, by this chosen contract", "Yes, universally in all systems", "Only if the key is long"], ["What must happen before the first balance write?", "All predictable validation and checked arithmetic", "Only ID formatting", "Writing a success log"], ["Why use Math.addExact on destination credit?", "To detect overflow before mutation", "To create a database transaction", "To guarantee positive balances without checks"], ["What can two source transfers race on?", "The same spendable balance", "Only the receipt font", "Only the currency display symbol"], ["Which test targets failure atomicity?", "Overflow the destination and assert both balances unchanged", "Only list wallet IDs", "Only send one valid transfer"], ["What is a correction in a durable accounting extension?", "A linked reversal or adjustment posting", "Deletion of all history", "A direct public balance setter"], ["What is the key coarse-lock tradeoff?", "Simple correctness versus independent-transfer parallelism", "Durability versus currency names", "O(1) versus no arithmetic"]], "module": "P24"}, {"slug": "food", "title": "Food ordering and order lifecycle", "level": "Core", "brief": "Design a restaurant ordering core. A customer builds a cart from a menu, submits an order with a price snapshot, and follows acceptance, preparation and delivery states. Keep menu edits separate from the historical order.", "scope": "One restaurant per order, one currency, integer minor units and no live payment gateway. Courier dispatch, marketplace search, taxes and distributed stock synchronization are extensions.", "ask": "Can an order contain items from several restaurants? Not here. Does a menu price change alter an accepted order? No. Until when may the customer cancel? Before preparation begins in this chosen policy.", "example": "A cart has two soups at 50 each and one bread at 20, total 120. Submit the order. The restaurant later changes soup to 60; the submitted order remains 120. After PREPARING begins, customer cancellation is rejected under this policy.", "outcome": "Cart lines are mutable shopping intent; order lines are immutable accepted quantities and prices. They should not be the same shared mutable list.", "rules": ["An accepted order contains positive quantities and a consistent currency.", "The order total equals its immutable line totals plus explicitly modeled adjustments.", "Only legal lifecycle transitions may change status."], "model": ["OrderService: validates checkout and creates immutable order lines.", "Cart: mutable customer selection before acceptance.", "MenuItem: current catalog description and price.", "Order: owns accepted lines, total and lifecycle.", "OrderLine: item snapshot, quantity and accepted unit price.", "PricingPolicy: optional fees or discount rules with explicit ordering."], "owner": "Order", "peers": ["MenuItem", "Cart"], "apis": "OrderView submit(CartId cart, String requestId);\nOrderView accept(OrderId id);\nOrderView startPreparation(OrderId id);\nOrderView cancel(OrderId id);", "api_note": "submit should bind a request ID to the accepted cart/version so retries do not create duplicate orders. Validate availability and quantity at acceptance, not only when an item was added to the cart. Expose controlled transitions rather than setStatus.", "states": ["SUBMITTED", "ACCEPTED", "PREPARING", "READY / DELIVERED"], "state_note": "SUBMITTED can be accepted or rejected. Under this policy cancellation is allowed before PREPARING. Delivery assignment and physical delivery are separate transitions in an extension. Do not let a customer mark their own order delivered without an authorized workflow.", "flow": ["Cart", "Checkout validation", "Price snapshot", "Order"], "trace": "Load the selected cart version, validate all items and quantities, compute line totals with overflow checks and capture prices. Create the order and record the request result together. Later menu mutations affect new orders only.", "code": "List<OrderLine> lines = cart.items().stream()\n    .map(item -> snapshotValidatedLine(item, menu))\n    .toList();\nlong total = checkedTotal(lines);\nOrder order = new Order(newId(), lines, total);\n// Save order and successful request identity together.", "code_note": "The core sketch does not automatically coordinate external payment or restaurant stock. If those become requirements, introduce explicit reservation/payment states and failures. List immutability also requires immutable OrderLine content.", "race": "Cart edits racing with submit need a version check or a captured immutable snapshot. Two kitchen workers starting preparation should not apply the transition twice. The order owner checks current state and authorization at the transition boundary.", "tests": ["Changing the menu after submission does not change the total.", "A zero or negative quantity is rejected.", "A repeated successful submit returns the same order.", "Cancel after preparation is rejected without changing state."], "extension": "Add partial item rejection. Decide whether the customer must approve a revised price, whether fees are recomputed and how payment adjustment works. Do not silently remove items from an already accepted order total.", "tradeoff": "Snapshotting prices duplicates catalog data but preserves the transaction's meaning. Referencing live prices is storage-light but makes historical orders change when the menu changes, which violates this contract.", "cost": "L cart lines: O(L) validation and total calculation plus menu lookups. Storage O(L) per accepted order. State transitions are O(1) local checks.", "pitch": "I separate cart intent from accepted order facts. My design protects the price snapshot and lifecycle independently of menu changes. I state the cancellation cutoff rather than scattering it across controllers.", "gotchas": ["Food ordering is not automatically a full delivery marketplace.", "A submitted price should not follow live menu edits.", "An order line quantity must be positive.", "A MenuItem should not own an order's lifecycle.", "A request ID should bind the cart intent or version.", "Cancellation cutoff is a business rule that must be explicit.", "Compute line totals before accepting the order.", "An unmodifiable list of mutable lines is still unsafe.", "Concurrent cart changes require snapshot or version semantics.", "Test price history after menu edits.", "Partial rejection changes pricing and customer consent.", "Duplicated price data can be intentional historical evidence."], "checks": [["Can one core order span several restaurants?", "No", "Yes without any new model", "Only when totals match"], ["What is the accepted total after soup later rises to 60?", "120", "140", "100"], ["What must accepted lines preserve?", "Quantity and price at acceptance", "Only live menu references", "Only display names"], ["Who guards preparation and cancellation state?", "Order", "MenuItem", "Cart"], ["Why bind submit to a cart version or snapshot?", "To make the accepted intent unambiguous", "To guarantee free delivery", "To avoid quantity validation"], ["Can the customer cancel after PREPARING here?", "No", "Yes without restriction", "Only if the menu changes"], ["What happens before creating the accepted order?", "Validate lines and compute a stable total", "Mutate every menu price", "Mark it delivered"], ["What else is needed besides List.toList?", "Immutable or safely owned line contents", "An extra mutable array reference", "A global public setter"], ["What can race with submit?", "A cart edit", "Only printing a receipt", "An unrelated image load"], ["Which test protects historical pricing?", "Change menu prices after acceptance", "Only read the current menu", "Only count restaurants"], ["What must partial rejection define?", "Revised total, approval and payment adjustment", "Only a new status label", "No new rules"], ["Why store accepted price snapshots?", "To preserve historical order meaning", "To make every query constant memory", "To copy the entire menu forever"]], "sources": ["S03"], "module": "P25"}, {"slug": "ride", "title": "Ride dispatch and driver assignment", "level": "Deep", "brief": "Design a ride-request core that assigns one available driver to one waiting rider. A matching policy chooses a candidate using driver snapshots, but the assignment operation must atomically claim the driver and update the trip.", "scope": "One service area, simplified coordinates and one active trip per driver. No real navigation, surge pricing, payment, safety operations or global dispatch optimization. Location freshness is explicitly modeled as an input quality limit.", "ask": "Can a driver have two active trips? No. Does nearest guarantee fastest arrival? No. Who may cancel and when? Define allowed states; the baseline allows cancellation before pickup and requires ownership checks.", "example": "Riders A and B both see driver D as available. Both matching policies choose D. Only one atomic claim succeeds; the other request tries another driver or remains waiting. A later old cancellation cannot free D from a newer trip.", "outcome": "Matching is a suggestion; assignment is an ownership change. A driver's available status must be linked to an active trip ID, not a standalone boolean.", "rules": ["A driver has at most one active trip.", "A trip has at most one assigned active driver in the core.", "Cancellation or completion releases only the driver still owned by that trip."], "model": ["DispatchService: coordinates match and atomic assignment.", "MatchingPolicy: ranks candidate driver snapshots.", "DriverState: location, freshness and current trip ownership.", "Trip: rider, pickup, destination and lifecycle.", "Assignment: trip-driver relation and version/token."], "owner": "DispatchService", "peers": ["MatchingPolicy", "LocationView"], "apis": "TripView requestRide(RideRequest request);\nboolean tryAssign(TripId trip, DriverId driver);\nTripView cancel(Actor actor, TripId trip);", "api_note": "tryAssign is conditional on both waiting trip and available driver state. A stale location may exclude a driver or lower confidence under an explicit policy. Do not expose setAvailable(true) without matching current ownership.", "states": ["WAITING", "ASSIGNED", "PICKED UP", "COMPLETED / CANCELLED"], "state_note": "WAITING can be assigned or cancelled. ASSIGNED can progress to pickup or a permitted cancellation. Once picked up, the cancellation/abort contract changes and needs a separate policy. Completion is authorized by the owning trip workflow.", "flow": ["Ride request", "Candidate ranking", "Atomic driver claim", "Assigned trip"], "trace": "Create or replay a ride request. Rank candidate drivers using snapshots. For each candidate, atomically verify the trip is waiting and the driver has no active trip, then write both ownership references. A failed claim means retry selection, not override the winner.", "code": "synchronized boolean tryAssign(Trip trip, Driver driver) {\n    if (trip.state() != WAITING) return false;\n    if (driver.activeTrip() != null) return false;\n    driver.assign(trip.id());\n    trip.assign(driver.id());\n    return true;\n}", "code_note": "The sketch assumes shared objects protected by the same dispatch owner. Separate driver and trip repositories need an atomic contract spanning both, or a carefully specified workflow. Ranking correctness does not replace claim correctness.", "race": "Simultaneous riders can select the same driver. Assignment is the linearization point in the local model. Cancellation must compare driver.activeTrip with this trip ID before release. Multi-server dispatch requires shared conditional ownership, not independent JVM locks.", "tests": ["Two waiting trips competing for one driver yield one assignment.", "Cancelling a stale trip does not free a driver assigned elsewhere.", "A picked-up trip follows the chosen cancellation policy.", "Stale locations are handled according to the documented freshness rule."], "extension": "Add driver acceptance with expiring assignment offers. The driver is then reserved for one offer while it is live. A late acceptance must match the offer token and deadline, reusing the same ownership ideas as seat holds.", "tradeoff": "Nearest-by-distance is cheap and understandable but ignores road travel time, driver preference and fairness. More advanced ranking can replace MatchingPolicy without weakening the atomic assignment boundary.", "cost": "D driver snapshots: a simple candidate scan is O(D). Claim is expected O(1) in the local indexed model. Geospatial indexing and travel-time estimation are separate extensions.", "pitch": "I distinguish ranking from claiming. The crucial race test has two riders choose one driver, and the stale-cancellation test protects later ownership. Location accuracy and optimal routing are outside this small core.", "gotchas": ["A dispatch toy is not a complete ride-hailing service.", "Two requesters can choose the same nearest driver.", "A boolean available flag loses the owner identity.", "MatchingPolicy should not silently mutate driver ownership.", "Old locations require a freshness rule.", "Cancellation after pickup is not the same as before pickup.", "Claim both trip and driver or neither.", "Independent repositories do not become atomic from a synchronized method on one object.", "A stale cancel must compare current trip ownership.", "Test the losing assignment outcome too.", "Expiring offers need token and deadline validation.", "Nearest distance is not guaranteed fastest arrival."], "checks": [["What is the core ownership limit?", "One active trip per driver", "Unlimited trips per driver", "One driver per city"], ["A and B both choose D. How many claims succeed?", "One", "Two", "Always zero"], ["Why store activeTripId instead of only available?", "To identify and validate the current owner", "To make distance exact", "To remove all trip state"], ["Who performs the atomic claim?", "DispatchService", "MatchingPolicy", "LocationView"], ["What must tryAssign recheck?", "Trip waiting and driver unassigned", "Only the last search result", "Only the rider name"], ["Does cancellation after pickup need its own rule?", "Yes", "No; it is identical to waiting cancellation", "Only for long distances"], ["A candidate claim fails. What should happen?", "Try another candidate or keep waiting", "Overwrite the winning assignment", "Mark two trips assigned"], ["What does the sketch assume?", "Shared state under one consistency owner", "Automatic cross-database transactions", "Perfect location freshness"], ["What protects a driver from old cancellation?", "Compare the current trip ownership token", "Only compare a display name", "Always set available true"], ["Which test exposes the central race?", "Two trips competing for one driver", "Only compute one distance", "Only create a rider"], ["What does a driver-acceptance offer add?", "Expiring temporary ownership", "No extra states", "Guaranteed acceptance"], ["What can replace the ranking policy independently?", "Travel-time-aware or fairness-aware ranking", "The atomic ownership invariant", "The identity of the current trip"]], "module": "P26"}, {"slug": "locker", "title": "Parcel locker allocation", "level": "Core", "brief": "Design a parcel-locker system. A courier deposits a parcel into a compatible free compartment. The recipient receives a pickup token and uses it to release the correct parcel. A token must not open a newer parcel's compartment after its original pickup.", "scope": "One locker bank, size-based compatibility and software-only open acknowledgement. Token verification is modeled, not a production authentication scheme. Real door sensors, delivery notifications and secure token storage are extension boundaries.", "ask": "Can a small parcel use a larger compartment? Yes. Is a token single-use? Yes for successful pickup. Do pickup failures consume it? Invalid credentials do not. Can a parcel be split? No.", "example": "Parcel P1 uses compartment C2 and token T1. Pickup with T1 succeeds and C2 becomes free. P2 later uses C2 with token T2. A replay of T1 must not open C2 or release P2.", "outcome": "Pickup authorization is tied to parcel and allocation identity, not merely a compartment number. Reusing a physical compartment must not reuse its old authority.", "rules": ["A compartment owns at most one stored parcel.", "A live pickup token identifies one parcel allocation.", "A consumed or expired token cannot affect a later allocation."], "model": ["LockerService: owns allocation and pickup transitions.", "Compartment: ID, size and current allocation token.", "Parcel: ID, recipient reference and size.", "Allocation: parcel, compartment, pickup-token reference and status.", "TokenVerifier: validates credentials without exposing secret values.", "DoorPort: optional hardware boundary."], "owner": "LockerService", "peers": ["TokenVerifier", "ParcelView"], "apis": "DepositView deposit(Parcel parcel);\nPickupResult pickup(String token);\nList<CompartmentView> availability();", "api_note": "The external pickup API should avoid leaking whether arbitrary tokens exist. For teaching tests, deterministic tokens can be injected; a production implementation needs cryptographically suitable generation, protected storage and attempt throttling.", "states": ["FREE", "ALLOCATED", "STORED", "PICKED UP / EXPIRED"], "state_note": "In the software core, successful deposit moves directly to STORED. A real door workflow may require ALLOCATED then confirmed deposit. Pickup consumes the allocation's authority; it does not create a permanent permission to open a compartment.", "flow": ["Courier / recipient", "LockerService", "Allocation ownership", "Compartment"], "trace": "For deposit, validate parcel identity and choose a compatible free compartment, create an allocation ID and token, then bind them atomically. For pickup, verify the token, check its live allocation and current compartment owner, then close the allocation and release that same owner.", "code": "Allocation a = requireLiveAllocation(token);\nCompartment c = compartments.get(a.compartmentId());\nif (!a.id().equals(c.allocationId()))\n    throw staleAllocation();\na.markPickedUp();\nc.clearIfOwnedBy(a.id());", "code_note": "This contextual snippet represents a confirmed software pickup. A physical door may open while the final acknowledgement is lost, so a real implementation needs an attempt state and sensor reconciliation rather than assuming both mutations prove removal.", "race": "Two couriers must not claim the same final compartment. Pickup and expiry cleanup share the allocation boundary and compare ownership IDs. An expired token should not clear a newer assignment even if the compartment number matches.", "tests": ["A too-large parcel is rejected without consuming a compartment.", "Two deposits for one suitable compartment yield one success.", "An old token replay cannot release a newer parcel.", "A wrong token leaves every allocation unchanged."], "extension": "Add expiration and return-to-sender workflow. Expiry may disable recipient pickup but must not mark the compartment physically empty before a courier actually removes the parcel. Separate logical token expiry from physical occupancy.", "tradeoff": "Smallest-compatible allocation preserves larger compartments but can require an ordered size index. A scan is simpler for a small bank. More efficient selection must not move ownership out of the locker service.", "cost": "C compartments: O(C) scan allocation; expected O(1) token lookup. Storage O(C + retained allocations). Real hardware latency is a separate concern.", "pitch": "The main idea is expiring authority tied to an allocation. I test compartment reuse explicitly so an old code cannot affect a new parcel. Physical occupancy and token validity remain distinct facts.", "gotchas": ["A deterministic teaching token is not a secure production credential.", "A compartment number is not sufficient pickup authority.", "Old tokens must not affect reused compartments.", "A token verifier should not decide inventory ownership.", "Avoid leaking secret tokens in logs.", "Expired authority does not imply the parcel physically disappeared.", "Claim the compartment and allocation together.", "The snippet assumes a confirmed software pickup.", "Expiry cleanup must compare current allocation identity.", "Test reuse of the same compartment with a new parcel.", "Return-to-sender requires physical removal state.", "Selection policy and atomic ownership are separate responsibilities."], "checks": [["What is a token tied to?", "One parcel allocation", "A compartment forever", "Every parcel of the same size"], ["Can T1 release P2 after C2 is reused?", "No", "Yes because the compartment matches", "Only on the same day"], ["What must remain unique?", "One stored parcel owner per compartment", "One parcel name worldwide", "One recipient per building forever"], ["Who owns allocation transitions?", "LockerService", "TokenVerifier", "ParcelView"], ["Are deterministic test tokens production security?", "No", "Yes automatically", "Only if they contain a number"], ["Does token expiry make a compartment physically empty?", "No", "Yes", "Only for small parcels"], ["What must pickup compare?", "Allocation ID with the current compartment owner", "Only the compartment size", "Only the courier name"], ["What does the pickup snippet not prove?", "Real physical parcel removal", "The use of an ownership check", "A logical state change"], ["What protects against stale expiry cleanup?", "Matching current allocation identity", "A timer firing once", "A public setFree method"], ["Which test is most revealing?", "Old token after compartment reuse", "Only deposit into an empty bank", "Only display parcel size"], ["What does return-to-sender add?", "A physical-removal workflow distinct from token expiry", "Only a new label", "Automatic free space"], ["Why choose the smallest compatible compartment?", "To preserve larger capacity for larger parcels", "To eliminate synchronization", "To guarantee no future rejection"]], "sources": ["S21"], "module": "P27"}, {"slug": "bowling", "title": "Ten-pin bowling scorecard", "level": "Core", "brief": "Design a standard ten-pin scorecard for ten frames. Record rolls in order and compute scores only when required bonus rolls are known. Strikes and spares create obligations to include later rolls. Validate legal roll sequences, especially frame ten.", "scope": "One player scorecard, integer pin counts and standard strike/spare scoring. No lane hardware, tournament handicaps or multiplayer scheduling. This is a guided scoring design with an independent roll-history model.", "ask": "Can a frame score be incomplete? Yes. How does a strike score? Ten plus the next two rolls. How does a spare score? Ten plus the next roll. Frame ten has bonus rolls but not extra frames.", "example": "Rolls 10,3,4 give frame one 17 and frame two 7. Rolls 6,4,5 give frame one 15 but frame two is incomplete. A perfect game records twelve strikes and totals 300.", "outcome": "A roll can contribute to its own frame and to an earlier frame's bonus. This is not duplicate storage; it is the scoring rule over one chronological roll log.", "rules": ["Each roll knocks down only pins currently standing in that rack.", "There are exactly ten frames; bonus rolls belong to frame ten.", "A frame is scored only after all of its required rolls and bonuses exist."], "model": ["Scorecard: owns validated chronological rolls and completion state.", "FrameCursor: tracks frame and rack progression for input validation.", "Scorer: pure function over an immutable roll snapshot.", "FrameScore: complete or pending subtotal.", "Roll: immutable pins knocked down."], "owner": "Scorecard", "peers": ["Scorer", "FrameScore"], "apis": "void roll(int pins);\nList<FrameScore> frames();\nOptionalInt finalScore();", "api_note": "roll rejects illegal pin counts and rolls after game completion. finalScore is absent until a complete legal game exists. A display may show complete frame subtotals and pending frames separately.", "states": ["FRAME FIRST ROLL", "FRAME SECOND ROLL", "TENTH BONUS", "COMPLETE"], "state_note": "Frames one through nine end immediately on a strike or after two rolls. The tenth gives one bonus roll for a spare or two for a strike. After a tenth-frame strike, rack reset behavior affects which third-roll pin counts are legal.", "flow": ["Roll input", "Rack validation", "Append roll log", "Pure score calculation"], "trace": "Validate the next roll using frame/rack state before appending it. For scoring frames one through nine, a strike advances the roll cursor by one and a normal frame by two. Access future rolls only when they exist; otherwise mark the frame pending.", "code": "if (rolls.get(i) == 10) {\n    requireKnown(i + 2);\n    frameScore = 10 + rolls.get(i + 1) + rolls.get(i + 2);\n    i += 1;\n} else if (rolls.get(i) + rolls.get(i + 1) == 10) {\n    requireKnown(i + 2);\n    frameScore = 10 + rolls.get(i + 2);\n    i += 2;\n}", "code_note": "This contextual snippet shows strike/spare scoring, not complete validation or the tenth-frame parser. The normal open-frame branch and incomplete-second-roll checks are also required. Keep scoring pure so an independent test can verify the roll history.", "race": "A scorecard accepts one ordered stream of rolls. Serialize append operations or require a monotonically increasing roll sequence number. Two scoring readers can use the same immutable snapshot without mutating the scorecard.", "tests": ["A gutter game totals zero.", "Ten open frames of 3 and 4 total 70.", "Twelve strikes total 300.", "After tenth-frame strike then 7, a roll of 4 is invalid because only 3 pins remain."], "extension": "Add several players by giving each an independent scorecard and a turn-order controller. Do not mix frame-scoring logic with lane rotation or UI animation.", "tradeoff": "A roll log plus pure scorer is straightforward and auditable. Incremental bonus counters can make display updates faster but introduce more mutable obligations and are harder to validate around the tenth frame.", "cost": "A standard game has at most 21 rolls; rescoring the fixed ten frames is bounded and simple. For a generalized frame count F, a linear roll-log scorer is O(F) time and space.", "pitch": "I model incomplete information explicitly. The pure scorer computes from one validated log, and the input parser protects rack legality. I pay special attention to frame ten rather than forcing it into the normal two-roll rule.", "gotchas": ["This scope is standard ten-pin scoring, not all bowling variants.", "A strike needs the next two rolls, not necessarily the next frame.", "Two rolls can each be <=10 and still exceed one rack's remaining pins.", "The scorer reads; the scorecard validates append order.", "Do not return a fabricated final score before completion.", "Tenth-frame bonus rolls are not an eleventh frame.", "Validate before appending to the roll log.", "The strike/spare snippet omits complete tenth-frame validation.", "Concurrent append order must be defined.", "Test 10,7,4 in the tenth as an invalid sequence.", "Multiplayer turn order is separate from scoring.", "Incremental bonus state can be more complex than rescoring 21 rolls."], "checks": [["How many frames does the scorecard contain?", "Ten", "Twelve after a perfect game", "As many as rolls"], ["What does 10,3,4 score for frame one?", "17", "10", "24"], ["When is a strike frame complete for scoring?", "After its next two bonus rolls are known", "Immediately after recording 10", "Only after the next two frames"], ["Who validates a newly appended roll?", "Scorecard", "Scorer read function", "FrameScore view"], ["What should finalScore return before game completion?", "An absent/pending result", "Always zero as a final result", "Always 300"], ["Are tenth-frame bonus rolls extra frames?", "No", "Yes", "Only after a spare"], ["What happens before appending a roll?", "Validate current rack and game state", "Assume every 0..10 value is legal", "Erase earlier bonuses"], ["Is the shown strike/spare branch a complete implementation?", "No; more branches and input validation are required", "Yes for all legal and illegal games", "Only if the list is mutable"], ["How can readers safely score while rolls arrive?", "Use an immutable roll snapshot", "Mutate the same cursor globally", "Ignore roll order"], ["Is tenth-frame 10,7,4 legal?", "No; after 7 only 3 pins remain", "Yes; every number is <=10", "Only for a perfect game"], ["Where should multiplayer turn order live?", "A controller outside each scorecard", "Inside every strike calculation", "In the pin-count integer"], ["Why can full rescoring be reasonable?", "A standard game has a very small bounded roll log", "It guarantees constant work for all generalized games", "It eliminates validation"]], "sources": ["S19"], "module": "P28"}, {"slug": "coupon", "title": "Shopping-cart pricing and coupons", "level": "Core", "brief": "Design a deterministic pricing engine for an immutable cart snapshot. Compute line totals, apply eligible coupons in an explicit order and return a quote with a breakdown. Keep pricing calculation separate from consuming a limited-use coupon.", "scope": "One currency, integer minor units, fixed-amount and percentage discounts, and explicit rounding. No actual payment, jurisdiction-specific tax calculation or universal real-world promotion rules.", "ask": "Can coupons stack? This version applies at most one order-level coupon. Is a discount capped at subtotal? Yes. How are percentage fractions rounded? Down to whole minor units in this chosen example. Does preview consume a coupon? No.", "example": "Subtotal is 105 minor units. A 10% coupon gives floor(10.5)=10 off, so total is 95. A fixed 200-off coupon is capped to 105 and total becomes zero. A preview does not reduce the coupon's remaining-use count.", "outcome": "Coupon order, capping and rounding are business rules, not interchangeable implementation details. A quote needs to explain each adjustment.", "rules": ["All cart quantities are positive and all amounts use one currency.", "The final total is nonnegative and equals subtotal minus the accepted discount in this scope.", "A preview does not mutate coupon redemption state."], "model": ["PricingEngine: pure quote calculation.", "CartSnapshot: immutable validated lines.", "DiscountPolicy: eligibility and discount calculation.", "Quote: subtotal, adjustment, total and policy/version references.", "CouponRedemptionService: atomically consumes limited usage at checkout."], "owner": "PricingEngine", "peers": ["CouponRedemptionService", "CartView"], "apis": "Quote quote(CartSnapshot cart, Coupon coupon);\nRedemptionResult redeem(String requestId, QuoteId quote);", "api_note": "Use checked arithmetic for quantity times unit price and avoid amount*percent overflow. Either bound inputs or use BigInteger/BigDecimal as appropriate. Quote expiry and revalidation at checkout must be stated rather than assumed.", "states": ["CART SNAPSHOT", "QUOTED", "REVALIDATED", "REDEEMED / REJECTED"], "state_note": "QUOTED is not a coupon reservation unless the API explicitly creates a hold. REDEEMED is a separate mutation with its own idempotency identity. A stale quote may be rejected or repriced under a documented customer-consent rule.", "flow": ["Cart snapshot", "Eligibility rule", "Discount calculation", "Quote breakdown"], "trace": "Validate and sum line totals with checked arithmetic. Evaluate coupon eligibility against the snapshot. Compute the discount with the chosen rounding rule, cap it at subtotal, and return an immutable breakdown without changing coupon inventory.", "code": "BigInteger raw = BigInteger.valueOf(subtotal)\n    .multiply(BigInteger.valueOf(percent))\n    .divide(BigInteger.valueOf(100));\nlong discount = Math.min(subtotal, raw.longValueExact());\nlong total = subtotal - discount;\nreturn new Quote(subtotal, discount, total);", "code_note": "The percentage sketch assumes percent is validated in the range 0..100 and subtotal is nonnegative. Integer division implements rounding down for these nonnegative inputs. A different rounding contract needs different code.", "race": "Pricing itself can run on immutable snapshots without a shared mutation lock. Limited-use redemption is different: two checkouts must not both consume the final coupon use. Put the check and decrement behind one redemption boundary.", "tests": ["A 10% discount on 105 is 10 under the chosen rounding.", "A fixed discount above subtotal produces total zero, not negative.", "Repeated previews do not consume limited uses.", "Two redemption attempts for the final use produce at most one new success."], "extension": "Add stacking. Specify whether percentage applies before or after fixed discounts, eligibility recalculation, caps and line-level allocation. Different orders can produce different totals, so the policy must return a traceable adjustment list.", "tradeoff": "Pure pricing is easy to test and cache for a stable snapshot. Redemption remains an effectful service with different concurrency needs. Combining them makes a harmless preview unexpectedly consume inventory.", "cost": "L lines and K considered rules: typical baseline O(L + K), plus the cost of rule predicates. Limited-use redemption lookup is expected O(1) locally, with a separate atomic mutation.", "pitch": "I keep quote calculation pure and define rounding and capping explicitly. Limited-use consumption is a separate retry-safe operation. That split prevents a preview from spending the last coupon.", "gotchas": ["This example is not jurisdiction-specific tax guidance.", "Rounding changes the answer for small amounts.", "A discount must not make the total negative under this contract.", "Coupon redemption is not the pricing engine's pure responsibility.", "Multiplication can overflow before division.", "A quote is not automatically a reservation.", "Never consume a coupon during a read-only preview.", "Validate percent bounds before using the arithmetic.", "The final coupon use needs an atomic claim.", "Test small amounts where rounding is visible.", "Stacking order changes totals.", "Pure calculation and effectful redemption need different contracts."], "checks": [["How many order-level coupons can apply in this core?", "At most one", "Unlimited in unspecified order", "None even when valid"], ["What total results from 10% off 105 under this rule?", "95", "94", "90"], ["What happens when a fixed discount exceeds subtotal?", "Cap it at subtotal", "Allow a negative total", "Increase the discount again"], ["Who owns pure quote computation?", "PricingEngine", "CouponRedemptionService", "CartView"], ["Why avoid long multiplication before division?", "It can overflow before the discount is reduced", "Because division is always inexact", "Because prices are strings"], ["Does QUOTED mean a coupon use is reserved?", "No, unless explicitly modeled as a hold", "Yes automatically", "Only with a UUID"], ["What does preview mutate?", "No coupon redemption state", "The final-use counter", "The user's payment balance"], ["What input bound does the percentage sketch assume?", "Percent between 0 and 100 and nonnegative subtotal", "Any signed integer percent", "Negative subtotals only"], ["What requires atomic coordination?", "Consuming the final limited coupon use", "Reading an immutable cart snapshot", "Formatting the quote breakdown"], ["Which test distinguishes calculation from redemption?", "Preview many times and verify uses remain unchanged", "Only check a coupon name", "Only render the cart"], ["What must stacking define?", "Order, caps, eligibility and rounding interactions", "Only coupon colors", "No additional rules"], ["Why separate pricing and redemption?", "Different purity and concurrency contracts", "To avoid all validation", "To make every preview a transaction"]], "sources": ["S23"], "module": "P29"}, {"slug": "approval", "title": "Multi-step approval workflow", "level": "Deep", "brief": "Design a configurable approval workflow for a submitted expense or document. A policy produces ordered approval steps. Only the authorized approver for the current step can approve or reject. Preserve decisions and policy version for an audit trail.", "scope": "Sequential steps, one active approver role per step, immutable submitted payload and no delegation or parallel quorum approvals in the core. This is a software-design exercise, not a legal or organizational compliance policy.", "ask": "Can the requester approve their own request? This policy rejects that. Can policy edits change in-flight steps? No: capture the policy version at submission. What does duplicate approval do? Replay only when it matches the recorded command.", "example": "Request R needs manager approval then finance approval. Finance cannot approve first. Manager approves, moving R to finance. A duplicate manager command returns its recorded outcome and does not accidentally approve the finance step.", "outcome": "An approval command targets a request version and step identity, not merely an object with status PENDING. The audit log preserves who decided what and when.", "rules": ["Only the current authorized approver can decide the active step.", "A decision command is applied at most once to its intended step.", "Submitted content and captured policy version do not silently change during approval."], "model": ["Workflow: owns current step, status and recorded decisions.", "ApprovalPolicy: creates an immutable sequence of required steps.", "Step: stable ID, required role and decision status.", "DecisionCommand: command ID, step ID, expected version, actor and choice.", "DecisionRecord: immutable actor, timestamp, outcome and policy context."], "owner": "Workflow", "peers": ["ApprovalPolicy", "DecisionRecord"], "apis": "WorkflowView submit(Submission submission);\nWorkflowView decide(DecisionCommand command);\nList<DecisionRecord> history(WorkflowId id);", "api_note": "Check command replay identity, then current version/step and actor authorization. A duplicate earlier decision must not be applied to whichever step happens to be current now. Return a new immutable view after a successful decision.", "states": ["SUBMITTED", "STEP PENDING", "APPROVED", "REJECTED"], "state_note": "Approval advances to the next configured step; approving the final step terminates the workflow. Rejection is terminal under this baseline. Resubmission creates a new version or new workflow with explicit linkage rather than erasing the rejection.", "flow": ["Decision command", "Identity + authorization", "Current-step guard", "Audit + advance"], "trace": "Under the workflow lock, replay a matching known command or reject conflicting reuse. Validate expected version, step ID and actor. Construct the immutable decision record, update the step and current index, append audit history and increment version together.", "code": "DecisionRecord prior = decisions.get(command.id());\nif (prior != null) return replayOrReject(prior, command);\nrequireVersion(command.expectedVersion());\nrequireCurrentStep(command.stepId());\nrequireAuthorized(command.actor());\nDecisionRecord record = planDecision(command);\napplyDecision(record);\nversion++;", "code_note": "The order prevents a replay from acting on a later step. Authorization still needs a clear replay policy; do not expose another actor's result simply because they know a command ID. The sketch assumes authorization identity is supplied by a trusted boundary.", "race": "Two approvers or browser tabs can act on the same version. Only one matching state transition may commit. Version checks plus the workflow boundary reject the stale command. A mutable global policy must not alter the already-captured step sequence.", "tests": ["Finance cannot approve the manager step.", "A duplicate manager command does not advance finance.", "Concurrent decisions based on one version produce one committed transition.", "Policy edits after submission do not change the captured steps."], "extension": "Add parallel approvals with a quorum. Each approver vote needs identity and deduplication, and the quorum transition must occur once. Define rejection precedence and what late votes mean after the workflow becomes terminal.", "tradeoff": "An explicit step list is easy to inspect for sequential approval. A generic workflow graph supports branches but needs cycle handling, join semantics and richer validation. Introduce that machinery only when requirements justify it.", "cost": "S steps and D decisions: O(S) submission policy capture, expected O(1) sequential decision checks, O(D) history snapshot. Storage O(S + D) per workflow.", "pitch": "I anchor every decision to a step and version, not a vague pending status. The model captures policy and submitted facts so later changes do not rewrite history. Parallel quorum logic is a separate extension with new invariants.", "gotchas": ["The example is not a compliance policy for a real organization.", "A duplicate approval must not advance the next step.", "A requester's self-approval rule must be enforced at the boundary.", "A mutable policy should not rewrite in-flight steps.", "A command ID alone is not authorization.", "Rejection is terminal in this baseline.", "Validate current step and version before applying a new decision.", "Replay results still need an authorization policy.", "Concurrent browser tabs can submit stale versions.", "Test duplicate decisions across a step transition.", "Parallel quorum introduces one-time join semantics.", "A full graph engine may be unnecessary for a sequential workflow."], "checks": [["May finance approve before manager in this policy?", "No", "Yes if the page is open", "Only when the amount is small"], ["What does duplicate manager approval do?", "Replay that decision without approving finance", "Advance the next step", "Restart the workflow"], ["What must remain captured after submission?", "Payload and policy version", "Only the current UI label", "The latest mutable policy always"], ["Who owns step advancement?", "Workflow", "ApprovalPolicy", "DecisionRecord"], ["What must a command identify besides the workflow?", "The intended step, version and actor", "Only a timestamp string", "Only the document title"], ["What happens after final-step approval?", "The workflow becomes APPROVED", "It loops to the first step", "It stays pending forever"], ["What happens before a new decision is applied?", "Validate version, step and authorization", "Increment the step unconditionally", "Delete previous history"], ["Why check replay identity explicitly?", "So a duplicate does not act on a later current step", "To skip all authorization", "To make every command unique by clock"], ["Two tabs decide from the same version. What is valid?", "One commits and the stale decision is rejected", "Both always advance different steps", "Both delete the audit trail"], ["Which test protects policy history?", "Edit the policy after submit and keep captured steps", "Only create one empty workflow", "Only compare role strings"], ["What does a quorum extension add?", "Vote identity and one-time quorum transition", "No new state", "Automatic cycle elimination"], ["Why start with a step list rather than a graph engine?", "It matches the sequential scope with fewer invariants", "It solves all future workflow graphs", "It removes the need for version checks"]], "module": "P30"}], "sources": {"S01": ["Java 17: Record", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Record.html", "Record components and generated equality; shallow immutability."], "S02": ["Java 17: Object", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Object.html", "Equality and hash-code contracts."], "S03": ["Java 17: List", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/List.html", "Unmodifiable lists and copyOf."], "S04": ["Java 17: Map", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Map.html", "Keys, default methods, immutable map factories."], "S05": ["Java 17: LinkedHashMap", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/LinkedHashMap.html", "Access-order iteration and synchronization requirements."], "S06": ["Java 17: ConcurrentHashMap", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html", "Atomic per-key operations; no multi-key transaction."], "S07": ["Java 17: Clock", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/time/Clock.html", "Injectable clocks and deterministic time."], "S08": ["Java 17: BigDecimal", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/math/BigDecimal.html", "Decimal arithmetic, rounding and equality."], "S09": ["Java 17: Comparator", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Comparator.html", "Comparator composition and ordering contracts."], "S10": ["Java 17: PriorityQueue", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/PriorityQueue.html", "Heap operation costs; iteration is not sorted."], "S11": ["Java 17: CopyOnWriteArrayList", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/concurrent/CopyOnWriteArrayList.html", "Snapshot traversal and write-copy cost."], "S12": ["Java 17: ScheduledExecutorService", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/concurrent/ScheduledExecutorService.html", "Delay and periodic-task semantics."], "S13": ["Java 17: System.nanoTime", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/System.html#nanoTime()", "Elapsed time, not wall-clock timestamps."], "S14": ["Java 17: ReentrantLock", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html", "Lock ownership and finally-based release."], "S15": ["Java language specification 17, chapter 17", "https://docs.oracle.com/javase/specs/jls/se17/html/jls-17.html", "Synchronization, visibility and happens-before."], "S16": ["PostgreSQL 17: explicit locking", "https://www.postgresql.org/docs/17/explicit-locking.html", "Optional persistence extension: row locks and deadlocks."], "S17": ["PostgreSQL 17: constraints", "https://www.postgresql.org/docs/17/ddl-constraints.html", "Optional persistence extension: uniqueness and exclusions."], "S18": ["Java 17: AutoCloseable", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/AutoCloseable.html", "Explicit resource lifetime and close contract."], "S19": ["USBC: Keeping Score", "https://bowl.com/keeping-score", "Basic ten-pin scoring reference; examples in this workbook are original."], "S20": ["FIDE: Laws of Chess, effective 1 January 2023", "https://handbook.fide.com/chapter/E012023", "Move legality and king-safety reference, not a complete implementation."], "S21": ["Java 17: SecureRandom", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/security/SecureRandom.html", "Reference for secure random generation; deterministic lab tokens are not credentials."], "S22": ["Java 17: String", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/String.html", "UTF-16 indexing and immutable text."], "S23": ["Java 17: BigInteger", "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/math/BigInteger.html", "Arbitrary-precision integer arithmetic and exact conversions."]}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('courseData').textContent), CARDS=DATA.cards, MODULES=DATA.modules, PROBLEMS=DATA.problems;
const BYID=Object.fromEntries(CARDS.map(c=>[c.id,c])), MOD=Object.fromEntries(MODULES.map(m=>[m.id,m]));
const KEY='java-lld-field-guide-v1', VERSION=1;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=s=>String(s||'').split('\n').map(x=>`<p>${esc(x)}</p>`).join('');
const lines=s=>String(s||'').split('\n').map(x=>`<div class="listline">${esc(x)}</div>`).join('');
let storageOK=true, state={version:VERSION,current:CARDS[0].id,progress:{},notes:{},bookmarks:{},mock:{},theme:'light',session:null};
function cleanState(raw){
 if(!raw||raw.version!==VERSION)throw Error('Not a compatible field-guide progress file.');
 const s={version:VERSION,current:BYID[raw.current]?raw.current:CARDS[0].id,progress:{},notes:{},bookmarks:{},mock:{},theme:raw.theme==='dark'?'dark':'light',session:null};
 for(const id of Object.keys(BYID)){
  const p=raw.progress?.[id]; if(p&&typeof p==='object')s.progress[id]={studied:p.studied===true,due:Number.isFinite(p.due)?p.due:0,interval:Number.isFinite(p.interval)?Math.max(0,Math.min(90,p.interval)):0,attempts:Number.isInteger(p.attempts)?Math.max(0,p.attempts):0,correct:Number.isInteger(p.correct)?Math.max(0,p.correct):0,lastCorrect:typeof p.lastCorrect==='boolean'?p.lastCorrect:null};
  if(typeof raw.notes?.[id]==='string')s.notes[id]=raw.notes[id].slice(0,20000);
  if(raw.bookmarks?.[id]===true)s.bookmarks[id]=true;
 }
 if(raw.session&&typeof raw.session.date==='string'&&Array.isArray(raw.session.ids))s.session={date:raw.session.date,ids:raw.session.ids.filter(id=>BYID[id]).slice(0,10)};
 for(const p of PROBLEMS){const m=raw.mock?.[p.slug];if(m&&typeof m==='object'){s.mock[p.slug]={fields:{},scores:{}};for(const k of MOCK_KEYS){if(typeof m.fields?.[k]==='string')s.mock[p.slug].fields[k]=m.fields[k].slice(0,20000);const val=m.scores?.[k];if(Number.isInteger(val)&&val>=0&&val<=2)s.mock[p.slug].scores[k]=val;}}}
 return s;
}
// State import accepts known fields only.
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}$('storageNotice').hidden=storageOK;}
function status(message){$('globalStatus').textContent=message;}
function applyTheme(){document.documentElement.dataset.theme=state.theme;$('themeButton').textContent=state.theme==='dark'?'Light':'Dark';}
let currentView='study',tab='learn',filtered=CARDS.map(c=>c.id),daily=false,diagramStep=-1,quizSelection=null,exam=null,mockSlug=PROBLEMS[0].slug;
const MOCK_FIELDS=[['scope','Scope and clarifying questions'],['examples','Worked example and acceptance criteria'],['invariants','Invariants and the consistency owner'],['model','Classes, responsibilities and relationships'],['api','API contracts and failure results'],['sequence','State machine and critical operation trace'],['tests','Tests, races and boundary cases'],['tradeoff','Complexity, tradeoff and change request']];
const MOCK_KEYS=MOCK_FIELDS.map(x=>x[0]);
// Load after rubric constants exist; no executable content is imported.
try{const saved=localStorage.getItem(KEY);if(saved)state=cleanState(JSON.parse(saved));}catch(e){if(e.name==='SecurityError')storageOK=false;}
function card(){return BYID[state.current]||CARDS[0];}
function setView(view){currentView=view;for(const v of ['study','labs','mock','guide'])$(v+'View').hidden=v!==view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));if(view==='study')renderCard();if(view==='labs')renderLabs();if(view==='mock')renderMock();if(view==='guide')renderGuide();}
function go(id,keepTab=false){if(!BYID[id])return;state.current=id;quizSelection=null;diagramStep=-1;if(!keepTab)tab='learn';save();setView('study');renderSidebar();if(innerWidth<741)$('sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'auto'});}
function move(delta){let i=filtered.indexOf(state.current);if(i<0)i=CARDS.findIndex(c=>c.id===state.current);let ids=filtered.includes(state.current)?filtered:CARDS.map(c=>c.id);const target=ids[i+delta];if(target)go(target);}
function refreshFilter(){const q=$('search').value.trim().toLowerCase(),module=$('moduleFilter').value,mode=$('modeFilter').value;filtered=CARDS.filter(c=>{
 const p=state.progress[c.id]||{};if(daily&&!state.session?.ids.includes(c.id))return false;if(module&&c.module!==module)return false;
 if(mode==='bookmarked'&&!state.bookmarks[c.id])return false;if(mode==='mistakes'&&p.lastCorrect!==false)return false;if(mode==='due'&&!(p.studied&&p.due<=Date.now()))return false;if(mode==='unseen'&&p.studied)return false;
 return !q||[c.title,c.problem,MOD[c.module].title,c.idea,c.mental,c.code,c.gotcha,c.question,c.detail].join(' ').toLowerCase().includes(q);
 }).map(c=>c.id);renderSidebar();updatePosition();}
function renderSidebar(){const studied=Object.values(state.progress).filter(p=>p.studied).length;$('progressText').textContent=`${studied} / ${CARDS.length} studied`;$('progressFill').style.width=(100*studied/CARDS.length)+'%';$('filterSummary').textContent=`${daily?'Today session: ':''}${filtered.length} matching lessons`;
 $('navlist').innerHTML=filtered.map(id=>{const c=BYID[id],p=state.progress[id]||{};return `<button class="navitem ${state.current===id?'current':''}" data-go="${id}"><span class="dot">${p.studied?'&#10003;':'&#9675;'}</span> ${esc(id)} &middot; ${esc(c.title)}<small>${esc(MOD[c.module].title)}${state.bookmarks[id]?' &middot; saved':''}</small></button>`;}).join('')||'<p class="small muted">No lessons match. Clear the search or choose All.</p>';
}
function updatePosition(){let i=filtered.indexOf(state.current),ids=i>=0?filtered:CARDS.map(c=>c.id);if(i<0)i=ids.indexOf(state.current);$('positionLabel').textContent=`${i+1} / ${ids.length}${daily?(filtered.includes(state.current)?' in Today':' outside Today'):''} · ${state.current}`;$('previousButton').disabled=i<=0;$('nextButton').disabled=i>=ids.length-1;}
function svgText(text,x,y,max=20){let words=String(text).split(/\s+/),out=[],line='';for(const w of words){if(line.length+w.length+1>max&&line){out.push(line);line=w;}else line+=(line?' ':'')+w;}if(line)out.push(line);out=out.slice(0,3);return out.map((l,i)=>`<text x="${x}" y="${y+(i-(out.length-1)/2)*16}" text-anchor="middle" font-size="12" font-weight="650">${esc(l)}</text>`).join('');}
function diagram(c){const nodes=c.flow.slice(0,4),model=c.step===4;let svg='';if(innerWidth<600){
 svg=`<svg viewBox="0 0 340 292" role="img" aria-label="${esc(nodes.join(', '))}">`;
 nodes.forEach((n,i)=>{let x=model&&i>0?48:18,y=8+i*72,w=model&&i>0?274:304;if(i>0&&c.step!==6){svg+=model?`<path class="edge" d="M30 66 V${y+28} H48"/>`:`<path class="edge" d="M170 ${y-13} V${y-2} m-4 -5 l4 5 4 -5"/>`;}svg+=`<rect class="node ${diagramStep===i?'hot':''}" x="${x}" y="${y}" width="${w}" height="58" rx="9"/>${svgText(n,x+w/2,y+30,33)}`;});svg+='</svg>';
 }else if(model){
 svg=`<svg viewBox="0 0 720 215" role="img" aria-label="Responsibility map for ${esc(c.problem||c.title)}"><rect class="node ${diagramStep===0?'hot':''}" x="250" y="8" width="220" height="56" rx="10"/>${svgText(nodes[0],360,40,25)}`;
 for(let i=1;i<nodes.length;i++){let x=20+(i-1)*235;svg+=`<path class="edge" d="M360 64 V90 H${x+105} V120"/><rect class="node ${diagramStep===i?'hot':''}" x="${x}" y="120" width="210" height="68" rx="10"/>${svgText(nodes[i],x+105,158,25)}`;}svg+='</svg>';
 }else{svg=`<svg viewBox="0 0 720 110" role="img" aria-label="${esc(nodes.join(', '))}">`;nodes.forEach((n,i)=>{let x=8+i*180;if(i<nodes.length-1&&c.step!==6)svg+=`<path class="edge" d="M${x+156} 49 H${x+174} m-5 -4 l5 4 -5 4"/>`;svg+=`<rect class="node ${diagramStep===i?'hot':''}" x="${x}" y="12" width="156" height="74" rx="11"/>${svgText(n,x+78,52,19)}`;});svg+='</svg>';}
 return `<div class="diagram">${svg}<div class="caption">${model?'Responsibility map. The text defines owns / uses / references.':c.step===6?'Lifecycle overview. Read the transition guards below; not every pair is a legal transition.':'Follow the ordered labels. Arrows show flow, not every possible call.'}</div></div>`;
}
function refs(c){return c.sources.length?`<div class="refs">Contract references: ${c.sources.map(id=>`<a href="${esc(DATA.sources[id][1])}" target="_blank" rel="noopener noreferrer">${esc(id)} · ${esc(DATA.sources[id][0])}</a>`).join('')}</div>`:'<p class="refs">Original workshop design choices. Scope and tradeoffs are stated explicitly.</p>';}
function renderCard(){const c=card(),p=state.progress[c.id]||{},module=MOD[c.module];
 $('lessonCard').innerHTML=`<div class="row spread cardmeta"><div class="eyebrow">${esc(c.id)} / ${esc(module.title)}</div><span class="badge ${c.level==='Deep'?'deep':''}">${esc(c.level)}</span></div><h1>${esc(c.title)}</h1>${c.problem?`<p class="muted">${esc(c.problem)} &middot; step ${c.step} of 12</p>`:''}
 <div class="cardtools"><button id="bookmarkButton" aria-pressed="${!!state.bookmarks[c.id]}">${state.bookmarks[c.id]?'Saved':'Bookmark'}</button><button id="markButton">${p.studied?'Studied ✓':'Mark studied'}</button><button id="openMockButton">Practice this design</button></div>
 ${c.problem?`<div class="steps" aria-label="Problem walkthrough steps">${CARDS.filter(x=>x.module===c.module).map(x=>`<button data-go="${x.id}" class="${x.id===c.id?'active':''}" aria-label="Step ${x.step}: ${esc(x.title)}">${x.step}</button>`).join('')}</div>`:''}
 <div class="tabs" role="tablist" aria-label="Lesson sections">${[['learn','Idea'],['code','Code & flow'],['quiz','Quiz'],['practice','Practice']].map(([id,label])=>`<button role="tab" id="tab-${id}" data-tab="${id}" aria-selected="${tab===id}" aria-controls="panel-${id}">${label}</button>`).join('')}</div>
 <div class="tabpanel" id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" ${tab!=='learn'?'hidden':''}><div class="eyebrow">The idea</div>${c.idea.includes('\n')?lines(c.idea):para(c.idea)}${diagram(c)}<div class="callout"><h3>Mental model</h3>${para(c.mental)}</div><div class="callout gotcha"><h3>Watch out</h3>${para(c.gotcha)}</div>${refs(c)}</div>
 <div class="tabpanel" id="panel-code" role="tabpanel" aria-labelledby="tab-code" ${tab!=='code'?'hidden':''}><div class="row spread"><h2>${c.code?'Read the code slowly':'Trace the design'}</h2><button id="copyButton" ${!c.code?'hidden':''}>Copy code</button></div>${c.code?`<pre><code>${esc(c.code)}</code></pre><p class="small muted">Contextual teaching snippet. Complete selected Java files are in the ZIP; this HTML does not execute Java.</p>`:para(c.mental)}${diagram(c)}<div class="btns"><button id="diagramBack">Previous stage</button><button id="diagramNext">Next stage</button></div><p id="diagramCaption" class="small muted">${diagramStep<0?'Step through the responsibility or flow labels.':esc(c.flow[diagramStep])}</p>${para(c.detail||c.idea)}${refs(c)}</div>
 <div class="tabpanel" id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" ${tab!=='quiz'?'hidden':''}><div class="eyebrow">Predict before revealing</div><h2>${esc(c.question)}</h2><div id="quizAnswers">${c.options.map((o,i)=>`<button class="answer" data-answer="${i}"><strong>${String.fromCharCode(65+i)}.</strong> ${esc(o)}</button>`).join('')}</div><div id="quizResult" hidden></div><div class="btns"><button id="revealButton">Reveal explanation</button><button id="retryQuizButton" hidden>Try again</button></div><p class="small muted">${p.attempts?`${p.correct||0} correct / ${p.attempts} submitted attempts on this lesson.`:'Choose an answer to record an attempt. Revealing without answering does not count as a correct attempt.'}</p></div>
